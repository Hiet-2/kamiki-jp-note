<style>
:root{
  --paper:#f4efe6; --paper2:#ebe4d6; --card:#fffdf8; --ink:#1d1b18; --ink2:#4a453d; --rule:#8c8374;
  --accent:#8a1c1c; --accent-bg:#f6e3df; --jp:#1f4e79; --jp-bg:#e2ecf5; --vs:#7a4a00; --vs-bg:#f7ead2;
  --focus:#ffd43d;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-size:18px;line-height:1.7;
  word-break:auto-phrase;text-wrap:pretty;
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(140,131,116,.13) 33px 34px)}
a{color:var(--jp)}
:focus-visible{outline:3px solid var(--ink);background:var(--focus)}
header{border-bottom:3px double var(--ink);background:var(--paper);position:sticky;top:0;z-index:5}
.hd{max-width:1080px;margin:0 auto;padding:16px 24px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.logo{font-family:"Zen Old Mincho",serif;font-size:32px;line-height:1.2;margin:0;letter-spacing:.04em}
.logo small{display:block;font-family:"Zen Kaku Gothic New";font-size:14px;letter-spacing:.1em;color:var(--ink2);font-weight:700}
nav{display:flex;gap:4px;margin-left:auto}
nav a{display:block;padding:10px 18px;text-decoration:none;color:var(--ink);font-weight:700;border:1px solid var(--rule);border-bottom:none;background:var(--paper2);border-radius:8px 8px 0 0;min-height:44px}
nav a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:240px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:16px;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:24px}
h2{font-family:"Zen Old Mincho",serif;font-size:28px;line-height:1.4;margin:8px 0 16px;text-wrap:balance}
.lead{color:var(--ink2);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;
  animation:rise .4s both;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink)}
.card .t{font-weight:700;line-height:1.5}
.card .s{font-size:16px;color:var(--ink2)}
.meta{font-size:16px;color:var(--ink2);display:flex;gap:4px 12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:1px 10px;border-radius:999px;border:1px solid currentColor}
.k-jp{color:var(--jp);background:var(--jp-bg)} .k-vs{color:var(--vs);background:var(--vs-bg)} .k-x{color:var(--accent);background:var(--accent-bg)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.theme{background:var(--card);border:1px solid var(--rule);border-left:8px solid var(--ink);border-radius:8px;padding:14px 18px;text-decoration:none;color:var(--ink);animation:rise .4s both}
.theme b{font-size:20px;display:block}
.theme span{font-size:16px;color:var(--ink2)}
.pt{display:grid;grid-template-columns:96px 1fr;gap:4px 16px;padding:16px 0;border-top:1px solid var(--rule);animation:rise .35s both}
.pt:first-of-type{border-top:2px solid var(--ink)}
.ts{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;align-self:start;padding-top:2px}
.pt h3{margin:0;font-size:20px;line-height:1.5}
.pt p{margin:4px 0 0}
.pt .from{grid-column:2;font-size:16px;color:var(--ink2)}
.pt .from a{color:var(--ink2)}
.sum{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 24px;margin:0 0 24px}
.sum ul{margin:8px 0 0;padding-left:1.2em}
.warn{font-size:16px;color:var(--vs);background:var(--vs-bg);border:1px solid var(--vs);border-radius:8px;padding:8px 14px;margin:0 0 16px}
.back{display:inline-block;margin-bottom:8px;font-weight:700}
.empty{color:var(--ink2);padding:24px 0}
.toc{margin:12px 0 0;padding-left:0;list-style:none;columns:2 280px;column-gap:32px}
.toc li{break-inside:avoid;margin:2px 0}
.sec{padding:16px 0;border-top:1px solid var(--rule);scroll-margin-top:150px}
.sec:first-of-type{border-top:2px solid var(--ink)}
.sec h3{font-size:22px;line-height:1.5;margin:0 0 8px;scroll-margin-top:140px}
.sec p{margin:0 0 12px;max-width:44em}
.cite{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin:0 2px;text-decoration:none;line-height:1.6;white-space:nowrap}
.cite:hover{text-decoration:underline}
.rg{font-size:18px;margin:20px 0 8px;padding-left:10px;border-left:6px solid var(--jp)}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.route{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.route b{font-size:18px;line-height:1.4}
.when{font-size:16px;color:var(--ink2)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;line-height:1.4}
.step{display:inline-block;background:var(--jp-bg);color:var(--jp);border:1px solid var(--jp);border-radius:6px;padding:2px 8px;font-weight:700;font-size:16px}
.arr{color:var(--ink2);font-weight:700;padding:0 2px}
.opts{display:flex;gap:8px;align-items:flex-start}
.optl{flex:none;font-size:14px;font-weight:700;color:var(--vs);background:var(--vs-bg);border:1px solid var(--vs);border-radius:999px;padding:1px 10px;margin-top:3px}
.opts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rnote{margin:0;font-size:16px;color:var(--ink2)}
@media (max-width:767px){.routes{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:767px){.hd{padding:12px 16px 0}.logo{font-size:26px}nav{margin-left:0}nav a{padding:8px 12px}main,.bar{padding-left:16px;padding-right:16px}.pt{grid-template-columns:1fr}.pt .from{grid-column:1}}
.foot{border-top:3px double var(--ink);background:var(--paper)}.foot div{max-width:1080px;margin:0 auto;padding:16px 24px 32px;font-size:16px;color:var(--ink2)}.foot p{margin:0 0 8px}
</style>

以前はガードに当たっていた場面でも、大Pを空振りさせられたうえに差し返しを食らいやすくなる。", "themes": ["patch", "neutral"], "chars": ["JP"], "side": "jp"}, {"t": 34, "head": "弱ストリボーグの影縫いは前方に拡大", "body": "弱ストリボーグの影縫いは強くなり、攻撃判定が前方に広がった。2段目だけ当たる距離では確認が現実的でないが、初段が当たる距離ではキャラによって SA の確定を取られる。ルークは SA で取れる。", "themes": ["patch", "neutral"], "chars": ["JP", "ルーク"], "side": "jp"}, {"t": 69, "head": "中足ワープは2段目へのジャスパ対策", "body": "中足ワープの調整は、2段目にジャストパリィを狙ってくる人が当然いたので、それへの対策だろうという見立て。ジャストパリィや無敵技で割り込まれないようにする調整だろう。", "themes": ["patch", "defense"], "chars": ["JP"], "side": "jp"}, {"t": 92, "head": "前大Kは垂直への対空で2段目が当たる", "body": "前大Kの調整は、垂直ジャンプに対してめり込み気味に対空したとき、ほぼ2段目が当たるようになった話だと見ている。", "themes": ["patch", "antiair"], "chars": ["JP"], "side": "jp"}, {"t": 104, "head": "大Pは下がりに空振りさせられやすい", "body": "下がりをレコードして大Pを見ると、相手がかなり下がる。発生の早いキャラに対しては、大Pを透かされて差し返される場面が前よりかなり増える。", "themes": ["patch", "neutral"], "chars": ["JP"], "side": "jp"}, {"t": 129, "head": "アムネジアと大Pのナーフは痛い", "body": "OD アムネジアは、相手が投げをきちんとやってきていたら確定がない状況になる。この2つのナーフはダメージが大きいと見ている。トータルではナーフだが、ストリボーグは牽制技としては強そうだ。", "themes": ["patch", "defense"], "chars": ["JP"], "side": "jp"}, {"t": 140, "head": "ワープ系はダッシュインパクトに強い", "body": "ストリボーグは多くのキャラが SA で確定を取れるので、先端の手前の距離を見極めて使うとよい。中足ワープや大Kワープなどは、ダッシュインパクトのような行動をしてくる相手にかなり強いはずで、使い道がある。特に読み合いを仕掛けられる点がよい。", "themes": ["patch", "offense"], "chars": ["JP"], "side": "jp"}, {"t": 153, "head": "総評は十分戦えるという感触", "body": "耐えられないという状態ではなく、強い側の位置にいてくれそうだという感触を持っている。", "themes": ["patch"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】Year4で何が変わった？JPの調整を確認", "date": "20260813", "duration": 163, "views": 1699, "short": false}, {"id": "odGhkR7MFco", "kind": "キャラ対策", "level": "中級", "summary": "テリー・ジュリ・イングリッド・マノンの嫌な行動への一口対策をまとめた動画。テリーのファイヤーキックからの択、ジュリの五黄殺からの歳破衝、イングリッドのワープ、マノンの SA2 への対処を、短く1つずつ示す。", "takeaways": ["テリーの択は小Pで勝てる", "ジュリの突進にジャストパリィ", "マノンのSA2は最後まで守らない"], "characters": ["テリー", "ジュリ", "イングリッド", "マノン"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年8月の動画。各キャラの性能前提のため、調整で変わっている可能性がある", "points": [{"t": 1, "head": "テリーの択は小Pで勝てる", "body": "ファイヤーキックの後に掛けられる様々な択は、実はすべて小Pに負ける。裏目はラッシュで、ラッシュが見えたらドライブリバーサルが理想だが難しいので、小Pを押しておけばラッシュ以外の択には勝てると割り切る。", "themes": ["matchup", "defense"], "chars": ["テリー"], "side": ""}, {"t": 13, "head": "ジュリの歳破衝にジャストパリィ", "body": "五黄殺から歳破衝でごまかされた経験は多い。歳破衝のタイミングに合わせてジャストパリィをすると、大きい反撃が入る。裏目がほとんどないのが利点だ。", "themes": ["matchup", "defense"], "chars": ["ジュリ"], "side": ""}, {"t": 41, "head": "ジュリの他の行動は確定か連ガ", "body": "ジュリの他の行動は、暗剣殺への派生なら確定反撃が取れる。五黄殺の初弾から歳破衝は連ガなので、ジャストパリィがそもそも出ない。唯一の裏目は五黄殺の出し切りだが、ジュリ側がマイナ12を背負うので、普通はやらない。", "themes": ["matchup", "combo"], "chars": ["ジュリ"], "side": ""}, {"t": 53, "head": "イングリッドのワープは見てジャストパリィ", "body": "イングリッドのワープをガードすると不利になる。キンバリーやダルシムのテレポートと違い、必ず攻撃判定が出るので、殴らないという選択肢が最初からない。見てジャストパリィをするとよく、外しても裏目がない。", "themes": ["matchup", "defense"], "chars": ["イングリッド", "キンバリー", "ダルシム"], "side": ""}, {"t": 75, "head": "ワープへのインパクトはおすすめしない", "body": "ワープを見た瞬間にインパクトを出す手もあるが、イングリッド側が別の行動をしてくると爆発するので、神木Cはおすすめしない。", "themes": ["matchup", "defense"], "chars": ["イングリッド"], "side": ""}, {"t": 85, "head": "マノンのSA2は普通にガードしない", "body": "マノンの SA2 を普通にガードすると、端から離れてしまい、普通の端コンボがしにくくなる。", "themes": ["matchup", "defense"], "chars": ["マノン"], "side": ""}, {"t": 96, "head": "SA2の跳ねる所は隙が大きい", "body": "マノンの SA2 の跳ねるところはフレームが大きく空いていて、ラッシュで割り込んだり、インパクトを入れたりできる。最後までガードしきってもゲージが削られるだけなので、大きな端コンボを入れるようにする。ジュリの SA1 も同じだ。", "themes": ["matchup", "combo", "resource"], "chars": ["マノン", "ジュリ"], "side": ""}], "title": "【スト6】一口対策動画まとめ3【テリー・ジュリ・イングリッド・マノン】", "date": "20260801", "duration": 117, "views": 1393, "short": false}, {"id": "IKr3BxMpj88", "kind": "プレイ", "level": "全般", "summary": "変なテンションで勝つ、というネタの短い切り抜き。泥試合になった試合の様子。", "takeaways": ["変なテンションで勝つ泥試合"], "characters": ["JP"], "themes": [], "version_sensitive": false, "version_note": "", "points": [{"t": 0, "head": "変なテンションで勝つ泥試合", "body": "ものすごい泥試合になった試合の切り抜き。驚く声や叫び声が中心で、解説はない。", "themes": [], "chars": ["JP"], "side": ""}], "title": "【スト6】変なテンションでなんか勝つ人", "date": "20260725", "duration": 17, "views": 7337, "short": true}, {"id": "9A6i80KhYjw", "kind": "キャラ対策", "level": "中級", "summary": "マノンのSA2への確定反撃を30秒で説明するショート。普通にガードすると端から離れるが、跳ねる部分に大きな隙間があり、割り込むか、最後までガードせず大きい端コンを入れる。ジュリのSA1も同じ。", "takeaways": ["SA2の跳ねる部分は大きく隙間がある", "割り込むか大きい端コンを入れる", "ジュリのSA1も同じ"], "characters": ["マノン"], "themes": ["matchup", "combo"], "version_sensitive": true, "version_note": "2026年7月の動画。マノンのSA2が調整で変わっている可能性がある", "points": [{"t": 0, "head": "SA2の跳ねる部分は隙間が大きい", "body": "マノンのSA2を普通にガードすると、端から離れて普通の端コンがしにくい。実は跳ねる部分のフレームがめちゃくちゃ空いている。", "themes": ["matchup"], "chars": ["マノン"], "side": ""}, {"t": 12, "head": "ラッシュやインパクトで割り込める", "body": "跳ねる部分の隙間には、ラッシュなどで割り込んだり、インパクトを出したりできる。最後までガードしきっても余計にゲージを削られるだけなので、大きい端コンを入れるようにする。", "themes": ["matchup", "combo"], "chars": ["マノン"], "side": ""}, {"t": 23, "head": "ジュリのSA1も同じ", "body": "同じ対応が、ジュリのSA1でも使える。", "themes": ["matchup", "combo"], "chars": ["ジュリ"], "side": ""}], "title": "30秒キャラ対策「マノンのSA2への確定」【スト6】", "date": "20260714", "duration": 30, "views": 16294, "short": true}, {"id": "1NDeURlQ0dE", "kind": "JP対策", "level": "中級", "summary": "JPの端での大P通常セットへの対応を説明するショート。JPの投げではコンボにならないので投げのケアは捨て気味でよい。詐欺飛びでJP有利は続くが、投げに意識を割く必要はない。", "takeaways": ["JPの投げはコンボにならない", "投げのケアは捨て気味でいい", "JP有利は続くが投げは意識しない"], "characters": ["JP"], "themes": ["setplay", "defense"], "version_sensitive": true, "version_note": "2026年7月の動画。JPのセットプレイが調整で変わっている可能性がある", "points": [{"t": 0, "head": "大Pの通常セットは投げを捨て気味でいい", "body": "JPが大Pからの通常セットで来る場面で、まず大事なのは、投げられてもコンボができないこと。投げのケアは割と捨て気味でいい。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 11, "head": "JP有利は続くが投げに意識は割かない", "body": "JPは詐欺飛びができるので、状況としてJP側の有利は続く。それでも、投げにそんなに意識を割かなくていい。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}], "title": "【スト6/JP対策】端のセットプレーへの対応って何するの？", "date": "20260706", "duration": 17, "views": 11018, "short": true}, {"id": "KMrV_6C9Huw", "kind": "JP対策", "level": "上級", "summary": "JPのセットプレイ3種（一番おなじみのセット・大P後の通常セット・大Pから直接のOD設置）と、それぞれへの対応を解説する動画。最終的にはじゃんけんなので完全な対応は無理だと前置きし、各択を狩れる行動と避けたい行動を示す。バーンアウト中の同じ連携にも触れる。", "takeaways": ["設置後は結局じゃんけん", "OD設置は連ガで暴れが負ける", "大P直接のOD設置は警戒して返す"], "characters": ["JP"], "themes": ["setplay", "defense", "offense"], "version_sensitive": true, "version_note": "2026年6月の動画で語られたJPのセットプレイ。調整で変わっている可能性がある", "points": [{"t": 10, "head": "トリグラフOD設置は投げ・ワープ・ストリボーグの3択", "body": "トリグラフOD設置は、最もおなじみで目にする機会が多いセットプレイ。投げ、弱ワープからのジャンプ中K、弱ストリボーグの3つの択がある。", "themes": ["setplay"], "chars": ["JP"], "side": "vs_jp"}, {"t": 27, "head": "投げ択のリターンと対応", "body": "投げからコンボが入り、もう一度ループさせることもできるので、投げを受け入れれば楽とは限らない。対応は投げ抜けか無敵技。遅らせ投げ抜けにはリターンを出せるが、最速の投げ抜けは狩れない。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 55, "head": "このセットが狩れる行動は3つ", "body": "このセットが狩れるのは、遅らせ投げ抜け、一部を除く無敵技、前飛びの3つだ。真上に判定があるタイプの昇龍や無敵技は例外で、相手が勝つ。", "themes": ["setplay", "defense", "antiair"], "chars": ["JP"], "side": "vs_jp"}, {"t": 68, "head": "前飛びにはめくり技を出す", "body": "ただの前飛びはワープジャンプ中Kに狩られるが、前飛びしながらめくり技を出すと勝てる。前飛びしたときに相手がワープしているのが見えたら、とりあえずめくり技を出すのがおすすめだ。", "themes": ["antiair", "setplay"], "chars": ["JP"], "side": "vs_jp"}, {"t": 95, "head": "打撃重ねは連ガ。遅らせ投げ抜けは一番減る", "body": "打撃を重ねられると、飛んでも暴れても食らう。ある意味で最もシンプルで強い択だ。連ガになっているので、ガードしてからのリバーサルOD昇龍は出ず、ドライブゲージも削られる。ガードしてしまったらドライブリバーサルをするとよい。このセットで最も減るのは遅らせ投げ抜けを狩られたときで、読まれるとゲーム終了になるので、一番おすすめしない。", "themes": ["setplay", "defense", "resource"], "chars": ["JP"], "side": "vs_jp"}, {"t": 132, "head": "大P後の通常セットは投げが捨て気味でよい", "body": "大Pからの通常セットは、投げてもコンボにならないので、投げは捨て気味の択になる。詐欺飛びで JP の有利は続くが、投げをそこまで意識しなくてよい。痛いのは大Kが直撃することだ。", "themes": ["setplay", "offense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 156, "head": "大Kからの中段と中足に注意する", "body": "大Kから中段が来るので、中段は立ってガードする。新要素として、大Kから中足を出す選択肢もあるが、完全な択ではないので、中足は食らわないようにする。大Kをガードした後は、中段も中足も暴れに負けるので、暴れるのは1つの手だ。ただし暴れをケアされると大きく食らうので、暴れ一辺倒にはしない。", "themes": ["setplay", "offense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 188, "head": "大Pから直接の起爆は暴れ潰し", "body": "新要素の、大Pから直接ヴィーハトを起爆する連携は暴れ潰しになっているので、動いてはいけない。起爆を見てジャストパリィできるのが最もよい。起爆へのジャストパリィは補正がかからず、爆発のダメージを与えられる強みがある。バグか仕様かは神木Cにも分からない。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 222, "head": "起爆からのラヴーシュカはリバーサルで返す", "body": "起爆からラヴーシュカにつなぐ形は、真面目にガードするのはほぼ無理だ。ドライブリバーサルが当たるので、様子見されない限り、崩しに来たと判断してドライブリバーサルで返すのがおすすめ。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 233, "head": "大Pから直接のOD設置は小Pから連ガ", "body": "大Pから直接OD設置するパターン。OD設置から小Pでフレームを消費し、トルバランまで連ガになる。トルバランは発生が特別に早くないので見てガードできるが、ヴィーハトのエフェクトと重なって見にくく、特に下段が見にくい。下段が来ることが多いので注意する。", "themes": ["setplay", "offense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 256, "head": "大P直接のOD設置は見たら返す", "body": "大Pから直接OD設置された時点で、例の連携だと判断する。リバーサルの昇龍を出すか、引きの動作にジャストパリィを狙う。投げられても返せない。ドライブリバーサルが当たるので、ガードしてからドライブリバーサルをやるのがよい。リバーサルのドライブリバーサルは、逆に詐欺飛びで返されるので避ける。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 292, "head": "バーンアウト中も同じ連携が来る", "body": "バーンアウト中も全く同じ連携が来る。トリグラフから始まり、小P、トルバランまで連ガになる。できるならトリグラフを見てから、SA3 や SA2 を撃つのが一番よい。", "themes": ["setplay", "resource", "defense"], "chars": ["JP"], "side": "vs_jp"}], "title": "【コメントで補足あり】【スト6/JP対策】必須知識！JPのセットプレイ3種とその対応", "date": "20260627", "duration": 318, "views": 15917, "short": false}, {"id": "OB71irQeRhQ", "kind": "講座", "level": "初心者", "summary": "カウンターとパニッシュカウンターの定義と、有利フレームが増える仕組みを説明する動画。専用のやられになる技の例と、カウンター確認の見るところ・練習法も扱う。", "takeaways": ["カウンターは出がかりを潰した判定", "パニカは後隙に当たると成立", "確認は表示・音・火花のどれか"], "characters": ["JP"], "themes": ["system", "combo", "practice"], "version_sensitive": false, "version_note": "", "points": [{"t": 11, "head": "カウンターは技の出がかりを潰した判定", "body": "コンボレシピに「カウンター限定」「パニッシュカウンター限定」と書いてあって戸惑う人向けの話。カウンターは技の出がかりを潰したときに出る判定で、画面に黄色くカウンターと表示される。", "themes": ["system"], "chars": ["JP"], "side": ""}, {"t": 22, "head": "カウンターで有利が2フレ増えコンボになる", "body": "JPの中足がヒットしたときの有利は通常プラス3フレだが、カウンターになると一律でプラス2フレ増え、プラス5フレになる。そのため通常では入らないコンボが入る。これがカウンター限定コンボの理屈だ。", "themes": ["system", "combo"], "chars": ["JP"], "side": ""}, {"t": 34, "head": "ラッシュ打撃のプラス4とカウンターは重なる", "body": "ラッシュ打撃はプラス4フレされるが、カウンターの増加分と重なるので、ラッシュカウンターのコンボも同時にある。", "themes": ["system", "combo"], "chars": [], "side": ""}, {"t": 46, "head": "ラッシュ止めは必ずカウンターになる", "body": "ラッシュを止めたときは必ずカウンターになる。一部を除く、攻撃判定の出ない必殺技もパニッシュカウンターになるものがあり、例としてジェイミーの飲みが挙がる。", "themes": ["system", "combo"], "chars": ["ジェイミー"], "side": ""}, {"t": 56, "head": "パニッシュカウンターは技の後隙に当たる", "body": "パニッシュカウンターはカウンターより理屈が簡単で、技の後隙に攻撃が当たったときに成立する。押し置きをするからパニッシュと呼ぶ。", "themes": ["system"], "chars": [], "side": ""}, {"t": 69, "head": "攻撃判定がなくてもパニカになる技がある", "body": "攻撃判定が出ていなくても、パニッシュカウンターになる技がある。例として、JPのヴィーハトなどのワープと、ダルシムのワープを挙げている。", "themes": ["system"], "chars": ["JP", "ダルシム"], "side": ""}, {"t": 79, "head": "パニカは+4され専用やられの技もある", "body": "パニッシュカウンターでは有利フレームがプラス4される。JPではパニッシュカウンターから色々な技がつながる。ベガの大Kは膝崩れ、マリーザの大Kは吹っ飛びなど、専用のやられになる技がある。", "themes": ["system", "combo"], "chars": ["JP", "ベガ", "マリーザ"], "side": ""}, {"t": 91, "head": "専用やられは大きな反撃が入る技", "body": "専用の挙動になる技は、大きな反撃が入る技と覚えておくとよい。確定反撃の場面で技の後隙を刺したときが分かりやすく、SA や昇龍拳が例になる。", "themes": ["system", "combo"], "chars": [], "side": ""}, {"t": 102, "head": "実戦のカウンター確認は状況確認を含む", "body": "実戦では出がかりを潰す当たり方になるため、自分が技を振ったタイミングで相手が何かしていたかという状況確認が半分ほど含まれる。", "themes": ["combo", "practice"], "chars": [], "side": ""}, {"t": 124, "head": "確認で見るところは表示・音・火花", "body": "確認の方法は人によって違い、画面の表示、音、火花の3つがある。パニッシュカウンターのときの音はかなり派手で、聞き比べると違いが分かる。神木Cは主に、パニッシュカウンターという文字の表示を見て確認する。", "themes": ["combo", "practice"], "chars": [], "side": ""}, {"t": 146, "head": "トレモのランダム設定で確認を練習する", "body": "自分がやりやすい確認方法を探せばよい。実戦は状況確認が入るので、トレモのほうが難しい。トレモでガードランダムとヒットランダムにして確認できれば、実戦でミスしない。", "themes": ["practice", "combo"], "chars": [], "side": ""}], "title": "【スト6】カウンター・パニッシュカウンターとは/カウンター確認のやり方", "date": "20260625", "duration": 163, "views": 1259, "short": false}, {"id": "zXlU2ibtKd8", "kind": "講座", "level": "初心者", "summary": "カウンターヒットの仕組みを説明するショート。カウンターは技の出掛かりを潰した時の判定で、ヒット時の有利フレームが一律で増え、カウンター限定のコンボができる。", "takeaways": ["カウンターは出掛かりを潰した判定", "ヒット時の有利が一律で増える", "増えた有利でカウンター限定コンボ"], "characters": [], "themes": ["system", "combo"], "version_sensitive": false, "version_note": "", "points": [{"t": 0, "head": "カウンターは技の出掛かりを潰した判定", "body": "カウンターは、相手の技の出掛かりを潰した時に出る判定。1P側の横に黄色くカウンターの文字が出る。", "themes": ["system"], "chars": [], "side": ""}, {"t": 12, "head": "カウンターで有利が増えコンボが変わる", "body": "中足がヒットした時は通常プラス3フレームだが、カウンターだと一律でプラス2フレームされ、5フレームになる。そのため、カウンター限定のコンボができる。", "themes": ["system", "combo"], "chars": [], "side": ""}], "title": "【スト6】カウンターヒットとは何か", "date": "20260625", "duration": 25, "views": 27261, "short": true}, {"id": "M1UjNFTVZRM", "kind": "JP講座", "level": "中級", "summary": "JPの中Kの使い方を説明するショート。マイナス3フレームの状況から8フレームの技を打つ強気の差し返しで、先端で当てると相手の最速の中足に勝つ。", "takeaways": ["マイナス3から8フレ技で差し返す", "いい距離で当てると決まり手になる", "JPの中足は全キャラで一番長い"], "characters": ["JP"], "themes": ["neutral"], "version_sensitive": true, "version_note": "2026年6月の動画。JPの中Kの性能が調整で変わっている可能性がある", "points": [{"t": 0, "head": "マイナス3から8フレ技で差し返す", "body": "質問は実戦で使っている差し返しについて。神木Cがよく使うのは、マイナス3フレームから8フレームの技を打つ強気の行動で、いい距離だと決まる。試合の決まり手になることも多い。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 11, "head": "先端で当てれば相手の最速中足に勝つ", "body": "相手が最速で中足を打ってきた場合は負ける。ただしJPの中足は全キャラで一番長いので、先端で当てれば勝つ。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】中Kの使い方", "date": "20260612", "duration": 23, "views": 27139, "short": true}, {"id": "uRveIeiCzyo", "kind": "JP講座", "level": "中級", "summary": "JPの中Kを、小技暴れへの勝ち筋・差し返し・大足確定・ガードされても有利な使い方の4役で解説する動画。足元の判定が強い性質が、役割ごとの強みの土台になる。", "takeaways": ["中Kは小技暴れに勝てる", "足元判定が強く差し返し向き", "ガードされても有利で攻め継続"], "characters": ["JP"], "themes": ["neutral", "combo"], "version_sensitive": true, "version_note": "2026年6月の動画で語られたJPの中Kの性能。調整で変わっている可能性がある", "points": [{"t": 0, "head": "マイナ3から8フレの中Kを振る", "body": "神木Cがオート差し返し的によく使うのは、マイナ3の状況から8フレの中Kを振る行動だ。いい距離なら通る。相手は有利が3フレなので、小技で暴れてくることが多い。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 10, "head": "小技暴れに中Kがぬるっと勝つ", "body": "相手の小技の暴れに、中Kがちょうど勝つ。相手が中足で打ち返してきた場合は負ける。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 21, "head": "相手の打ち返しが4フレ遅れると勝つ", "body": "相手の打ち返しが4フレほど遅れると中Kが勝つ。神木Cの試合では決まり手になる場面が多い。最速で中足を打たれた場合は負ける。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 32, "head": "JPの中足は最長なので先端で当てれば勝つ", "body": "JPの中足は全キャラで一番長く、先端で当てると、相手が中足で打ち返してきても勝つ。ジュリは中足がキャンセルできるキャラの中では一番長いが、それでも負ける。キャンセルできないキャラのほうが、基本的に中足は長い。", "themes": ["neutral"], "chars": ["JP", "ジュリ"], "side": "jp"}, {"t": 45, "head": "中Kの主な用途はフレームマジックと差し返し", "body": "中Kの主な使い道は、フレームマジックで下段に勝つ使い方と、差し返しの2つ。リリーの技のように、差し返しが厳しい相手にも役立つ。", "themes": ["neutral", "offense"], "chars": ["JP", "リリー"], "side": "jp"}, {"t": 58, "head": "足元判定が強く大Pが届かない所も殴れる", "body": "中Kは足元の判定が非常に強く、大Pでは本体に届かない距離でも、相手の技の足元に残った判定を殴れる。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 68, "head": "差し返し・ラッシュ止め・大足確定に使う", "body": "かなり余裕を持った反応（22フレームほど）でも、中Kなら差し返しが成立する。ラッシュ止めでもわりと使える。JPは大足への確定が難しくなりがちなので、大足確定でいちばん頭を使わずに使えるのが中Kだ。", "themes": ["combo", "neutral"], "chars": ["JP"], "side": "jp"}, {"t": 92, "head": "しゃがみ技での打ち返しにとても強い", "body": "足元の判定が強いので、相手がしゃがみ技で打ち返してくる場面に非常に強い。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 103, "head": "ガードされても有利なので攻めを継続できる", "body": "確認が必要な別のやり方もあるが、確認が面倒でゲージ効率もよい中Kを基本にする。うっかりガードされても有利なため、攻めを続けられる。", "themes": ["offense", "resource"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】レジェンドが教える、陰に隠れがちだけど強い！中Kの使い方", "date": "20260611", "duration": 113, "views": 2279, "short": false}, {"id": "NCU2nCTFHWE", "kind": "キャラ対策", "level": "全般", "summary": "イングリッドのワープへの対策を30秒で説明するショート。ワープをガードするとこちらが不利になり、キンバリーやダルシムのテレポと違って必ず攻撃判定が出る。見てから対応すれば裏目はなく、インパクトは勧めない。", "takeaways": ["ワープは必ず攻撃判定が出る", "見てから対応すれば裏目なし", "インパクトは爆死するので非推奨"], "characters": ["イングリッド"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年6月の動画。イングリッドの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "ワープは必ず攻撃判定が出る", "body": "イングリッドのワープをガードすると、こちらが不利になる。キンバリーやダルシムのテレポと違って、殴らない選択肢がワープした時点でなく、必ず攻撃判定が出る。", "themes": ["matchup", "defense"], "chars": ["イングリッド"], "side": ""}, {"t": 12, "head": "見てから対応すれば裏目がない", "body": "ワープを見てから対応するといい。ミスしても裏目はない。ワープを見た瞬間のインパクトも当たるが、イングリッド側が別の動きをすると爆死するので、神木Cはあまり勧めない。", "themes": ["matchup", "defense"], "chars": ["イングリッド"], "side": ""}, {"t": 22, "head": "しゃがみ大Pでの対応は非推奨", "body": "概要欄では、しゃがみ大Pでも対応できるが、遅れると前蹴りを食らうので、神木Cは非推奨と補足している。", "themes": ["matchup", "defense"], "chars": ["イングリッド"], "side": ""}], "title": "30秒キャラ対策「イングリッドのワープ」【スト6】", "date": "20260607", "duration": 26, "views": 33254, "short": true}, {"id": "F_AiTqOacmU", "kind": "キャラ対策", "level": "中級", "summary": "ジュリの五黄殺からの歳破衝への対策を30秒で説明するショート。歳破衝のタイミングでジャストパリィをすると大きいリターンが取れ、裏目はほぼない。", "takeaways": ["歳破衝のタイミングでジャストパリィ", "暗剣殺派生はプラス8で確定", "唯一の裏目は五黄殺の出し切り"], "characters": ["ジュリ"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年5月の動画。ジュリの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "歳破衝のタイミングでジャストパリィ", "body": "五黄殺から歳破衝でごまかされた経験は多い。歳破衝のタイミングでジャストパリィをすると、大きいリターンが入る。", "themes": ["matchup", "defense"], "chars": ["ジュリ"], "side": ""}, {"t": 11, "head": "裏目が少なく、暗剣殺派生は確定", "body": "この対策のいいところは裏目が少ないこと。ジュリが暗剣殺に派生した場合は、プラス8フレームなので確定が入る。", "themes": ["matchup", "defense"], "chars": ["ジュリ"], "side": ""}, {"t": 21, "head": "唯一の裏目は五黄殺の出し切り", "body": "五黄殺の初弾から歳破衝は連続ガードなので、パリィがそもそも出ない。唯一の裏目は五黄殺の出し切りで、ジュリ側がマイナス12を背負う技なので普通はやらない。", "themes": ["matchup", "defense"], "chars": ["ジュリ"], "side": ""}], "title": "30秒キャラ対策「ジュリの突進」【スト6】", "date": "20260511", "duration": 35, "views": 86115, "short": true}, {"id": "-ec3gJzxTfY", "kind": "キャラ対策", "level": "中級", "summary": "テリーの中足ターゲットコンボへの対策を30秒で説明するショート。ファイヤーキックからの択はしゃがみ小Pに負け、裏目はラッシュだけ。JPはしゃがみ小Pが強いので立たなくていい。", "takeaways": ["中足タゲコンの択は小Pに負ける", "裏目はラッシュだけ", "ラッシュが見えたらリバーサルが理想"], "characters": ["テリー"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年4月の動画。テリーの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "タゲコン後の択はしゃがみ小Pで勝つ", "body": "中足ターゲットコンボのファイヤーキックからは、いろんな択をかけられる。それは全てしゃがみ小Pに負け、裏目になるのはラッシュ。概要欄では、JPの場合はしゃがみ小Pが強いので立たなくて大丈夫と補足している。", "themes": ["matchup", "defense"], "chars": ["テリー"], "side": "jp"}, {"t": 11, "head": "ラッシュはリバーサルが理想、小Pでいい", "body": "ラッシュが見えたらリバーサルが理想だが難しい。しゃがみ小Pを押しておけば、ラッシュ以外には勝てる。", "themes": ["matchup", "defense"], "chars": ["テリー"], "side": "jp"}], "title": "30秒キャラ対策「テリーの中足タゲコン」【スト6】", "date": "20260427", "duration": 20, "views": 20927, "short": true}, {"id": "i3rONIDr_9M", "kind": "キャラ対策", "level": "中級", "summary": "サガット・ガイル・ジェイミー・舞の一口対策をまとめた動画だ。サガットのバーンアウト中の固め、ガイルの目の前ブレイド、ジェイミーの飲みへの確定反撃、舞の SA1 後の起き攻めを扱う。", "takeaways": ["サガットのBO中固めは立ちガードで割り込む", "ガイルの目の前ブレイドは見てからパニカン", "ジェイミーの飲みは不利が大きく確定を取る"], "characters": ["サガット", "ガイル", "ジェイミー", "舞"], "themes": ["matchup", "defense", "combo"], "version_sensitive": true, "version_note": "2026年4月の動画。各キャラの技のフレームが前提で、調整で変わっている可能性がある", "points": [{"t": 1, "head": "サガットのバーンアウト中の固めは立ってガードする", "body": "バーンアウト中にしゃがみ中を連打される場面で、しゃがんでガードするとサガットがプラス8フレになる。立ってガードするとサガットが不利になり、割り込める。しゃがみ中をガードした後は下段が来ないので、そこで立つ。", "themes": ["matchup", "defense"], "chars": ["サガット"], "side": ""}, {"t": 28, "head": "ガイルの目の前ブレイドは見てから間に合う", "body": "目の前で出されるソニックブレイドを見過ごすと、ガイル側から強い行動をされる。ほぼ全キャラが小足で見てから余裕で間に合い、ブレイドに当たらずパニッシュカウンターが取れる。JPとキンバリーは小足の判定がほとんど前に出ないので、大足で取る。", "themes": ["matchup", "combo"], "chars": ["ガイル"], "side": ""}, {"t": 52, "head": "ジェイミーの飲みは不利が大きい", "body": "ジェイミーがよくやるぼったくりの飲みは、後ろ投げ後の飲みがマイナ24、OD酔疾歩からの2杯目の飲みがマイナ24、リバーサルの飲みがマイナ27だ。確定反撃を持つキャラが結構多い。", "themes": ["matchup", "combo"], "chars": ["ジェイミー"], "side": ""}, {"t": 76, "head": "飲みには確定を取り、受け身を取らない", "body": "サーチ技のあるキャラは最も簡単に反撃できる。ラッシュが強いキャラはラッシュ中足でもよい。受け身を取ると反撃が届かないので、受け身を取らずに起き上がってから反撃する。", "themes": ["matchup", "combo"], "chars": ["ジェイミー"], "side": ""}, {"t": 98, "head": "舞の SA1 後は光らずに来たら小Pを押す", "body": "画面端で SA1 を食らった後の起き攻めで、OD技から SA1 を発動して溜めてきた花蝶扇は暴れ潰しになる。光らずに来た花蝶扇には、小Pが最初から勝つ。直前のコンボルートを見ておき、光っていないところから花蝶扇が来たらぼったくりなので小Pを押す。見てからでも間に合う。", "themes": ["matchup", "defense"], "chars": ["舞"], "side": ""}], "title": "【コメントで補足あり】一口対策動画まとめ2【スト6/サガット/ガイル/ジェイミー/舞】", "date": "20260416", "duration": 138, "views": 1617, "short": false}, {"id": "zSauC-9QniY", "kind": "キャラ対策", "level": "中級", "summary": "舞のSA1後の起き攻めへの対策を30秒で説明するショート。画面端でSA1を受けたあとの攻めは時々ぼったくりになっていて、光らずにやってくる攻めには小Pが勝つ。", "takeaways": ["SA1後の起き攻めはぼったくりがある", "光る溜めは暴れつぶし", "光らない攻めには小Pを押す"], "characters": ["舞"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年4月の動画。舞のSA1まわりの性能が調整で変わっている可能性がある", "points": [{"t": 0, "head": "画面端でSA1後の攻めは時々ぼったくり", "body": "画面端でSA1を受けたあとの攻めは、ほとんどの人が経験している。実は時々ぼったくりになっている。", "themes": ["matchup", "defense"], "chars": ["舞"], "side": ""}, {"t": 12, "head": "溜めは暴れつぶし、光らない攻めには勝てる", "body": "OD技からSA1を発動したあとに溜めてきた場合は暴れつぶしになる。光らずにやってきた場合は、最初から小Pが勝つ。", "themes": ["matchup", "defense"], "chars": ["舞"], "side": ""}, {"t": 23, "head": "前のコンボを見て、光らない攻めは小P", "body": "前に画面端でSA1をやられた時のコンボルートを見ておく。光っていない攻めが来たら、知らないと食らうぼったくりなので小Pを押す。", "themes": ["matchup", "defense"], "chars": ["舞"], "side": ""}], "title": "【コメントで補足あり】30秒キャラ対策「舞のSA1後起き攻め」【スト6】", "date": "20260416", "duration": 35, "views": 98018, "short": true}, {"id": "GKq1l0eQpko", "kind": "キャラ対策", "level": "中級", "summary": "ジェイミーがよくやるぼったくりの飲み3つを1分で説明するショート。どれも不利が大きく、確定反撃のあるキャラが多い。JPはサーチ技で一番簡単に咎められ、受け身を取らないのが大事になる。", "takeaways": ["ぼったくり飲み3つは咎める", "JPはサーチ技で簡単に確定", "受け身を取らない"], "characters": ["ジェイミー"], "themes": ["matchup", "combo"], "version_sensitive": true, "version_note": "2026年4月の動画。ジェイミーの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "ぼったくり飲み3つは大きく不利を背負う", "body": "よくやるぼったくりの飲みは、後ろ投げの飲み、ODの技からの2杯飲み、リバーサルの飲みの3つ。ジェイミー側の不利は、順にマイナス24、マイナス24、マイナス27。", "themes": ["matchup", "combo"], "chars": ["ジェイミー"], "side": ""}, {"t": 10, "head": "JPはサーチ技で一番簡単に確定を取れる", "body": "これらは確定反撃のあるキャラが多く、JPのようなサーチ技のあるキャラが一番簡単。", "themes": ["matchup", "combo"], "chars": ["ジェイミー", "JP"], "side": "jp"}, {"t": 23, "head": "ラッシュ中足や突進系のSAでも咎められる", "body": "ラッシュが使いやすいキャラはラッシュ中足、突進系のSAがあるキャラはそれでもいい。これをちゃんとやることが大事になる。", "themes": ["matchup", "combo"], "chars": ["ジェイミー"], "side": ""}, {"t": 34, "head": "受け身を取らずに反撃する", "body": "受け身を取ると届かないので、受け身を取らずに反撃する。ジェイミー戦は受け身を取らないことが大事。", "themes": ["matchup", "combo"], "chars": ["ジェイミー"], "side": ""}], "title": "1分キャラ対策「ジェイミーのぼったくり飲み3選」【スト6】", "date": "20260415", "duration": 42, "views": 120344, "short": true}, {"id": "HYEVgrQBIiI", "kind": "プレイ", "level": "全般", "summary": "コンボの安さをネタにした配信の切り抜き。別の配信者へのダメ出し配信で教えていた時の場面。4連勝の表示と、投げが決まって「激安」と言う声が中心。", "takeaways": ["コンボが激安というネタの切り抜き"], "characters": ["JP"], "themes": [], "version_sensitive": false, "version_note": "", "points": [{"t": 0, "head": "4連勝を見せる場面から始まる切り抜き", "body": "題名はコンボが激安の殿堂。別の配信者に教えていた時の切り抜きで、4連勝の表示を見せる場面と、投げが決まって「激安」と言う場面がある。", "themes": [], "chars": ["JP"], "side": ""}], "title": "【スト６】（コンボが）激安の殿堂【 神木C / 切り抜き/空跳つもり/スト６/re;BON】", "date": "20260415", "duration": 31, "views": 20442, "short": true}, {"id": "XiF2VhStumc", "kind": "キャラ対策", "level": "中級", "summary": "ガイルのソニックブレイドのスカしへの対策を30秒で説明するショート。見過ごすとガイル側から強い行動をされるが、ほとんどのキャラは見てからでも間に合い、パニッシュカウンターが取れる。", "takeaways": ["見過ごすとガイルに強い行動をされる", "小足で見てからパニッシュカウンター", "JPとキンバリーは大足で取る"], "characters": ["ガイル"], "themes": ["matchup", "neutral"], "version_sensitive": true, "version_note": "2026年4月の動画。ガイルの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "目の前のブレイドを見過ごさない", "body": "ガイルの目の前のソニックブレイドを見過ごすと、ガイル側から強い行動をされる。動画では強ソニックブレイドで見せているが、弱でも中でもODでも同じ。", "themes": ["matchup"], "chars": ["ガイル"], "side": ""}, {"t": 11, "head": "小足なら見てから間に合いパニッシュカウンター", "body": "ほぼ全キャラが、小足で見てから余裕で間に合う。ブレイドに当たらずにパニッシュカウンターが取れる。概要欄では、中央で余裕があれば微下がり大足ができるとより良いと補足している。", "themes": ["matchup", "neutral"], "chars": ["ガイル"], "side": ""}, {"t": 22, "head": "JPとキンバリーは大足で対応する", "body": "JPとキンバリーは小足の判定がほとんど前に出ないので、大足で対応する。それ以外のキャラは小足で対応するのがいい。", "themes": ["matchup"], "chars": ["ガイル", "JP"], "side": "jp"}], "title": "30秒キャラ対策「ガイルのブレイドスカ」【スト6】", "date": "20260414", "duration": 27, "views": 85372, "short": true}, {"id": "kgXJu4JUL1s", "kind": "キャラ対策", "level": "中級", "summary": "サガットのバーンアウト中のニー固めへの対策を30秒で説明するショート。しゃがんでガードするとサガット側がプラス8フレームになるが、立ってガードするとサガット側が不利になり割り込める。", "takeaways": ["しゃがみガードだとプラス8フレーム", "立ってガードすると割り込める", "ガード後は立てば下段は来ない"], "characters": ["サガット"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年4月の動画。サガットの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "しゃがんでガードするとプラス8フレーム", "body": "バーンアウト中にニー固めを連打された経験は多い。しゃがんでガードすると、サガット側がプラス8フレームになる。", "themes": ["matchup", "defense"], "chars": ["サガット"], "side": ""}, {"t": 11, "head": "立ってガードすれば割り込める", "body": "立ってガードすると逆にサガット側が不利になるので、割り込める。ガードしたあとは立てばよく、ここから下段択は来ない。", "themes": ["matchup", "defense"], "chars": ["サガット"], "side": ""}], "title": "30秒キャラ対策「サガットのBO中ニー固め」【スト6】", "date": "20260413", "duration": 27, "views": 122716, "short": true}, {"id": "Zx_-M_fIjjg", "kind": "キャラ対策", "level": "中級", "summary": "ブランカ・ケン・キンバリーの一口対策をまとめた動画だ。ブランカのOD ローリングへのインパクト、ケンのバーンアウト中の迅雷脚への割り込み、キンバリーのキャンセル疾駆けへのボタン押しの3つを扱う。", "takeaways": ["ブランカが遠くで光ったらインパクト", "ケンのBO中迅雷脚は下段択が連ガ", "キンバリーの疾駆けは光る時以外ボタン"], "characters": ["ブランカ", "ケン", "キンバリー"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年4月の動画。各キャラの技のフレームが前提で、調整で変わっている可能性がある", "points": [{"t": 1, "head": "ブランカが遠くで光ったらインパクト", "body": "OD ローリングを見てからインパクトは無理だと思うかもしれないが、その距離で見るべきものは他にない。理想は強ローリングにジャストパリィ、手前で止まるローリングにはボタンを押すことだが、全部は難しい。遠くで黄色く光ったらインパクトと決めておけば、ブランカ使いは OD ローリングで雑に近づきにくくなる。", "themes": ["matchup", "system"], "chars": ["ブランカ"], "side": ""}, {"t": 22, "head": "ケンのバーンアウト中の中迅雷脚は下段択が連ガ", "body": "バーンアウト中の中迅雷脚は、下段択が連続ガードになり、初段止めでもマイナ3だ。何でもよいのでボタンを押しておけば、中段にはパニッシュカウンターが取れる。初段止めを最速で狙われても、当たるか相打ちになる。バーンアウト中に迅雷脚でいじめられたときの簡単な対策になる。", "themes": ["matchup", "defense"], "chars": ["ケン"], "side": ""}, {"t": 54, "head": "迅雷脚の割り込みには注意点がある", "body": "一部の迅雷脚は下段択が連ガにならず、食らってしまう。強迅雷脚は、中Pなどで暴れていると中段に勝てない。技を見分けて、中Pで暴れる、ファジーガードをするなど対応を変える。", "themes": ["matchup", "defense"], "chars": ["ケン"], "side": ""}, {"t": 66, "head": "キンバリーのキャンセル疾駆けはほぼぼったくり", "body": "キンバリーのキャンセル疾駆けは、ほぼぼったくりだ。急停止で止めても食らう。", "themes": ["matchup", "defense"], "chars": ["キンバリー"], "side": ""}, {"t": 77, "head": "暴れ潰しになる疾駆けは一部だけ", "body": "しゃがみ大攻撃の疾駆けキャンセルと大Pの疾駆けキャンセルは暴れ潰しになる。他の中・大の通常技からの疾駆けキャンセルは、ボタンを押せば割れる。", "themes": ["matchup", "defense"], "chars": ["キンバリー"], "side": ""}, {"t": 88, "head": "光ってきたとき以外はボタンを押す", "body": "暴れ潰しの形と、光ってきたとき以外は、ボタンを押していい。むしろ押さなければならない。押さないと永久に攻められ続ける。これをやられるとキンバリー側は非常に嫌な気持ちになる。", "themes": ["matchup", "defense"], "chars": ["キンバリー"], "side": ""}], "title": "【スト6】一口対策動画まとめ1【ブランカ・ケン・キンバリー】", "date": "20260410", "duration": 104, "views": 1354, "short": false}, {"id": "bhoqYKGAPsA", "kind": "JP講座", "level": "中級", "summary": "JPの3大Pが強い理由の一部を説明するショート。当たると状況が良く、ラッシュ小Pに行ける。ラッシュを見て無敵技を出す相手にはラッシュインパクトが有効で、昇龍のないキャラに特に強い。", "takeaways": ["3大Pは当たると状況がいい", "無敵技にはラッシュインパクト", "リバーサルはSA3以外遮れる"], "characters": ["JP"], "themes": ["offense"], "version_sensitive": true, "version_note": "2026年4月の動画。JPの3大Pまわりの性能が調整で変わっている可能性がある", "points": [{"t": 0, "head": "3大Pが当たるとラッシュ小Pができる", "body": "3大Pが当たると状況がよく、ラッシュ小Pに行ける。ラッシュを見てから昇龍などの無敵技を出す相手には、こういう動きで返す手がある。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 11, "head": "ラッシュインパクトは昇龍のないキャラに強い", "body": "返す手はラッシュインパクト。昇龍のないキャラに対して特に強く、リバーサルを遮れる。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 22, "head": "SA3以外のリバーサルは遮れる", "body": "ラッシュインパクトはリバーサルを遮れる動きで、SA3以外のリバーサルは遮れる。", "themes": ["offense", "defense"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】3大Pが強すぎる理由", "date": "20260409", "duration": 34, "views": 10095, "short": true}, {"id": "fpvEhseVtV0", "kind": "JP講座", "level": "中級", "summary": "JP の3大Pを、リスクとリターンの両面から解説する。当たってもゲームは終わらないがガードされると終わることがあるため、先端で当てるのが基本になる。ヒット後の起き攻めと、距離を問わず確定を取られるキャラへの注意点も説明する。", "takeaways": ["3大Pは先端ならほぼ確定反撃がない", "ヒット後はラッシュ小Pで起き攻めできる", "ブランカ・ベガ・キンバリー相手は全距離で危険"], "characters": ["JP"], "themes": ["neutral", "offense", "combo"], "version_sensitive": true, "version_note": "2026年4月の動画。3大Pのフレームと各キャラの確定反撃が前提で、調整で変わっている可能性がある", "points": [{"t": 0, "head": "3大Pはガードされるとゲームが終わることがある", "body": "3大Pは当たってもゲームは終了しないが、ガードされると場合によってはゲームが終了する。うまく使えないと非常に弱い技になる。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 11, "head": "リーチの長い下段で歩きの多い相手に刺さる", "body": "リーチが非常に長い下段で、差し返しを見てうろつく相手、特に歩きの多い相手に刺さりやすい。ガードされるとマイナ14になるので使いどころが難しい。", "themes": ["neutral"], "chars": ["JP"], "side": "jp"}, {"t": 24, "head": "先端ならほとんどのキャラに確定反撃がない", "body": "近距離でガードされるとゲームが終わることがあるが、ど先端で当てればほぼ全てのキャラに確定反撃がなく、逆に押し置きができる。", "themes": ["neutral", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 36, "head": "ヒット後はラッシュ小Pでプラスになる", "body": "当たると状況がかなりよく、ラッシュ小Pができる。ラッシュ小Pはプラスで、バックステップや投げを絡めた起き攻めにつなげられる。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 59, "head": "ラッシュを見て昇龍が来る相手にはラッシュインパクト", "body": "ラッシュを見てから昇龍や無敵技を出してくる相手には、逆択としてラッシュインパクトがある。相手が非常に上手く、見てから昇龍してくると信じたときの行動だ。昇龍のないキャラが SA で返してくる場合は、アムネジアで返すことができる。", "themes": ["offense", "system"], "chars": ["JP"], "side": "jp"}, {"t": 81, "head": "昇龍のないキャラ、特に ED に強い", "body": "ヒット後のラッシュ小Pの押し止めは、昇龍のないキャラに特に強い。リバーサルの無敵技は SA3 以外ガードできる。ED は結構強い押し止めになる。相手がジャストパリィを使ってくることもあるので、ラッシュ小P以外の選択肢も混ぜる。", "themes": ["offense"], "chars": ["JP", "ED"], "side": "jp"}, {"t": 115, "head": "全距離で確定を取られるキャラがいる", "body": "先端ならほとんどのキャラに確定がないが、距離を問わず確定が取れる「選ばれしキャラ」が一部いる。具体的にはブランカ、ベガ、キンバリーだ。キンバリーは水切り蹴り、ブランカはアマゾンリバーランで、どんな距離でも確定を取れる。", "themes": ["matchup", "combo"], "chars": ["ブランカ", "ベガ", "キンバリー"], "side": "jp"}, {"t": 136, "head": "ベガ相手の3大Pは命がけ。SA まで含めると確定は多い", "body": "ベガは距離に関わらず確定が取れ、ゲーム終了になる。ベガに3大Pを出すときは命をかけるつもりでやる。SA まで含めると確定があるキャラは多く（例はルークのバルカンブラスト）、3大Pが入って相手に SA ゲージを使わせた交換と考えてもよい。", "themes": ["matchup", "resource"], "chars": ["ベガ", "ルーク"], "side": "jp"}, {"t": 160, "head": "ラシードも全距離でほぼ確定を取られる", "body": "ラシードはほぼ全ての距離で、本当のど先端でないと確定を取られるので、命がけになる。", "themes": ["matchup", "combo"], "chars": ["ラシード"], "side": "jp"}, {"t": 181, "head": "ダウンを取れれば昇龍が遅いキャラに強い", "body": "3大Pでダウンさせると、昇龍を持たないキャラや ED のように昇龍が遅いキャラに対してかなり強い。昇龍のあるキャラでも、ラッシュインパクトから読み合いができる。", "themes": ["offense"], "chars": ["JP", "ED"], "side": "jp"}, {"t": 191, "head": "ベガ戦はリスクを飲んででも3大Pを通す", "body": "ガードされても先端なら、選ばれしキャラ以外は確定がない。ベガは確定が重いので特に気をつける。ただしベガ相手は3大Pを通すとこちらが有利になるので、リスクを飲んででも出さなければならない場面がある。ブランカ使いがアマゾンリバーランを命がけで出すのと同じ感覚だ。", "themes": ["matchup"], "chars": ["ベガ", "ブランカ"], "side": "jp"}], "title": "【スト6】レジェンドJPが教える、実は強い3大Pの使い方", "date": "20260408", "duration": 219, "views": 6666, "short": false}, {"id": "LmCHCw2Knm0", "kind": "キャラ対策", "level": "中級", "summary": "キンバリーの疾駆けへの対策を30秒で説明するショート。疾駆けから暴れつぶしになるのはしゃがみ大と大Pからの形だけで、ほかは小Pで割れる。", "takeaways": ["暴れつぶしは一部だけ、あとは小P", "ボタンを押さないと永久に食らう"], "characters": ["キンバリー"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年4月の動画。概要欄では疾駆けが強化されたと触れており、調整で変わっている可能性がある", "points": [{"t": 0, "head": "暴れつぶしの疾駆けは一部だけ", "body": "疾駆けのうち、暴れつぶしになるのはしゃがみ大からと大Pからの形。ほかの中・大の通常技からの疾駆けは、全部小Pで割れる。", "themes": ["matchup", "defense"], "chars": ["キンバリー"], "side": ""}, {"t": 10, "head": "一部以外はボタンを押す", "body": "しゃがみ大・大Pからの疾駆けと、光ってきた時以外はボタンを押していい。押さなければ永久に押し付けられ続けるので、押さなければいけない。", "themes": ["matchup", "defense"], "chars": ["キンバリー"], "side": ""}], "title": "【コメントで補足あり】30秒キャラ対策「キンバリーのキャンセル疾駆け」【スト6】", "date": "20260404", "duration": 30, "views": 138855, "short": true}, {"id": "8A00rs2vVms", "kind": "プレイ", "level": "全般", "summary": "「謝罪系配信者」と題した、配信のネタ切り抜き。謝ったら相手がミスをして投げが決まる場面。", "takeaways": ["謝罪系配信者のネタ切り抜き"], "characters": ["JP"], "themes": [], "version_sensitive": false, "version_note": "", "points": [{"t": 0, "head": "謝罪系配信者のネタ切り抜き", "body": "謝ったら相手がミスをして、投げが決まった場面。技や数字の解説はないネタの切り抜き。", "themes": [], "chars": ["JP"], "side": ""}], "title": "【スト6/JP】神はスト6にいた", "date": "20260402", "duration": 22, "views": 6240, "short": true}, {"id": "ecVrhjzPsXw", "kind": "プレイ", "level": "全般", "summary": "2026年2月21日開催の第2回ゆなっこ杯 5on5 で、準優勝したチームの決勝トーナメントを、ウィナーズ2回戦から切り抜いた動画だ。掛け声や雑談が中心だ。メンバーを入れ替えながら勝ち上がり、ウィナーズファイナルを勝ってグランドファイナルへ進む流れだ。", "takeaways": ["5on5 の決勝トーナメントの切り抜き", "味方が相手ドラゲの残りを声に出して共有する", "ウィナーズファイナルを勝ち、グランドファイナルへ"], "characters": ["JP"], "themes": [], "version_sensitive": false, "version_note": "", "points": [{"t": 140, "head": "味方が相手のドラゲの残りを声に出して共有する", "body": "ウィナーズ2回戦（vs絶一門）では、味方が相手のドライブゲージの残りを声に出して数える。3本ちょい、2.8のように伝え、メンバーの入れ替えの判断材料にしている。", "themes": [], "chars": [], "side": ""}, {"t": 369, "head": "ウィナーズ3回戦の相手の編成を確認する", "body": "次の相手との対戦に向けて、豪鬼、キンバリー、ジェイミー、ラシード、ベガの名前が挙がる。行きたい人が行く形でメンバーを決めていく。", "themes": [], "chars": ["豪鬼", "キンバリー", "ジェイミー", "ラシード", "ベガ"], "side": ""}, {"t": 549, "head": "ウィナーズセミファイナルに進む", "body": "ウィナーズ3回戦を勝ち、ウィナーズセミファイナル（vsいなり寿司45周年）に入る。メンバー選びを相談しながら、行きたい人が出ていく。", "themes": [], "chars": [], "side": ""}, {"t": 1054, "head": "ウィナーズファイナルに進出する", "body": "セミファイナルを勝ち、ウィナーズファイナル（vs世界ブランカ連合）に進む。決勝に来たがまだグランドファイナルではない、という声が入る。", "themes": [], "chars": [], "side": ""}, {"t": 1476, "head": "ウィナーズファイナルを勝ちグランドファイナルへ", "body": "ウィナーズファイナルを勝ち、グランドファイナルに進出する。誰も予想していなかった展開として盛り上がる。", "themes": [], "chars": [], "side": ""}], "title": "【スト6/大会切り抜き】第2回ゆなっこ杯5on5　準優勝チームの軌跡", "date": "20260401", "duration": 1491, "views": 1074, "short": false}, {"id": "g2DdpXwc3Yc", "kind": "プレイ", "level": "全般", "summary": "5onで準優勝した時の大会の切り抜き。インパクトや投げの掛け声と笑い声が中心のネタ動画。", "takeaways": ["5onで準優勝した時の切り抜き"], "characters": ["JP"], "themes": [], "version_sensitive": false, "version_note": "", "points": [{"t": 0, "head": "5on準優勝までの勝ち上がり", "body": "5onで準優勝した時の切り抜き。「インパクト」「投げ」の掛け声が中心で、プレイの解説はない。", "themes": [], "chars": ["JP"], "side": ""}], "title": "【スト6/大会切り抜き】番狂せ連発！勝ち進む者達", "date": "20260401", "duration": 40, "views": 6779, "short": true}, {"id": "zkfXQVg4DTg", "kind": "キャラ対策", "level": "中級", "summary": "ケンのバーンアウト中の迅雷脚への対応を1分で説明するショート。中迅雷脚の下段択は連続ガードになり、初段止めでもマイナス3フレームなので、ボタンを押すだけで中段にはパニッシュカウンターが取れる。", "takeaways": ["BO中の迅雷脚はボタンを押す", "初段止めでもマイナス3フレーム", "派生を見分けて対応を変える"], "characters": ["ケン"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年3月の動画。ケンの迅雷脚まわりの性能が調整で変わっている可能性がある", "points": [{"t": 0, "head": "バーンアウト中の迅雷脚はボタンを押す", "body": "バーンアウト中に迅雷脚でいじめられても、簡単な対策がある。中迅雷脚の下段択は連続ガードになっていて、初段止めでもマイナス3フレーム。何でもいいからボタンを押しておくと中段にはパニッシュカウンターが取れ、初段止めには最速でも当てるか相打ちになる。", "themes": ["matchup", "defense"], "chars": ["ケン"], "side": ""}, {"t": 21, "head": "逆迅雷脚と大迅雷脚の中段には注意", "body": "逆迅雷脚は下段択も連続ガードではないので、ボタンを押していると食らう。大迅雷脚は、発生の遅い中Pなどで暴れていると中段に勝てない。", "themes": ["matchup", "defense"], "chars": ["ケン"], "side": ""}, {"t": 33, "head": "技を見分けて対応を変える", "body": "派生ごとに対応を変える。中Pを押してよい派生、ファジーガードで真面目に守る派生、小Pで押してよい派生がある。", "themes": ["defense"], "chars": ["ケン"], "side": ""}], "title": "【スト6】1分キャラ対策「ケンによるBO中の迅雷脚」", "date": "20260325", "duration": 44, "views": 98985, "short": true}, {"id": "5C-Lhcaaedc", "kind": "キャラ対策", "level": "全般", "summary": "ブランカのローリングへの対策を30秒で説明するショート。遠くで黄色く光ったらインパクトを入れる方針で、ODローリングで雑に近づかれにくくなる。", "takeaways": ["遠くで光ったらインパクト", "全部の対処は難しいので絞る"], "characters": ["ブランカ"], "themes": ["matchup", "neutral"], "version_sensitive": true, "version_note": "2026年3月の動画。ブランカの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "遠くで光ったらインパクトを打つ", "body": "ブランカが遠くで光ったらインパクトを入れる。ODローリングを見てインパクトは無理に思えるが、この距離では他に見るものがない。", "themes": ["matchup"], "chars": ["ブランカ"], "side": ""}, {"t": 10, "head": "理想は技ごとの対応、全部は難しい", "body": "理想は、強ローリングにはジャストパリィ、手前で止まるローリングにはボタン押し。全部やるのは難しいので、遠くで黄色く光ったらインパクトに絞ると、ODローリングで雑に近づかれにくくなる。", "themes": ["matchup", "neutral"], "chars": ["ブランカ"], "side": ""}], "title": "【スト6】30秒キャラ対策「ブランカのローリング」", "date": "20260324", "duration": 25, "views": 345286, "short": true}, {"id": "94J0Hk14lME", "kind": "プレイ", "level": "全般", "summary": "新しいおもちゃが強すぎて笑う、普段のランクマ配信の切り抜き。講座動画とは違い、怒らず楽しくやっている配信の雰囲気を見せる。", "takeaways": ["普段のランクマ配信の雰囲気"], "characters": ["JP"], "themes": [], "version_sensitive": false, "version_note": "", "points": [{"t": 1, "head": "新しいおもちゃで爆笑するランクマ配信", "body": "講座ではなく、普段のランクマ配信の様子を切り抜いたネタ動画。「神キャラ」の一言が入る。技や状況の解説はない。", "themes": [], "chars": ["JP"], "side": ""}], "title": "【スト6/JP】新しいおもちゃが強すぎて爆笑する男", "date": "20260319", "duration": 20, "views": 7579, "short": true}, {"id": "VXe0w9NM7Hg", "kind": "JP対策", "level": "中級", "summary": "JPのシューティングへの対応の一部を説明するショート。設置は最初の段階で2種類あり、JPが6、7フレームほど不利になる設置と有利になる設置で、確定を取れる側が入れ替わる。", "takeaways": ["設置は2種類、有利不利が逆", "トリグラフ設置はJPが6、7F不利", "有利か不利かを認識する"], "characters": ["JP"], "themes": ["setplay", "defense"], "version_sensitive": true, "version_note": "2026年3月の動画。JPの設置まわりの性能が調整で変わっている可能性がある", "points": [{"t": 0, "head": "シューティングの設置は最初の段階で2種類ある", "body": "設置までの流れは、最初の段階で設置が2種類に分かれる。", "themes": ["setplay"], "chars": ["JP"], "side": "vs_jp"}, {"t": 11, "head": "トリグラフまで出す設置はJPが6、7フレーム不利", "body": "トルバラン、トリグラフまで出して設置するとJP側が6、7フレームほど不利になる。一方、トルバランの段階で設置するとJP側が有利になる。", "themes": ["setplay"], "chars": ["JP"], "side": "vs_jp"}, {"t": 22, "head": "不利の設置は確定を取れ、有利の設置は取られる", "body": "JP不利の設置では、トリグラフから抜けてうまくやれば確定を取れる。JP有利の設置からトリグラフをやられると、逆に確定を取られる。リバーサルで行動が取れるキャラは、どちらの設置かの有利不利を認識したほうがいい。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}], "title": "【スト6/JP対策】シューティングされてる時って何すればいいの？", "date": "20260318", "duration": 41, "views": 13956, "short": true}, {"id": "VhKotbb94dI", "kind": "JP対策", "level": "全般", "summary": "JP のシューティング（設置からトリグラフで固める流れ）への対策を解説する。設置の始動の違い、ワープ投げ・ワープ打撃への対応、トリグラフ後の動き、見てから返せるキャラの強み、パリィの扱い方を順に説明する。最後に、弾をガードし続けても動けないわけではないと補足する。", "takeaways": ["ODトリグラフのガード後は前ステップしない", "パリィは起爆へのジャストパリィ以外は貼らない", "弾の張り直しはJPが不利で歩ける"], "characters": ["JP"], "themes": ["setplay", "neutral", "defense"], "version_sensitive": true, "version_note": "2026年3月の動画。配信後の調整でフレームは変わらなかったと概要欄にあるが、以降の調整で変わっている可能性がある", "points": [{"t": 11, "head": "設置の始動で JP の有利不利が変わる", "body": "ラッシュからトリグラフまで出して設置すると JP 側が6〜7フレ不利になり、トルバランの段階で設置すると JP 側が有利になる。トリグラフからの設置なら、リバーサルで取れる行動を出せば確定が取れることが多い。有利の設置からトリグラフを出されると、逆に確定を取られる。", "themes": ["setplay"], "chars": ["JP"], "side": "vs_jp"}, {"t": 52, "head": "トルバランフェイントはパリィを釣る行動", "body": "ガードを選んだ後、JP はトルバランフェイントでパリィを釣り、トリグラフでゲージを削りに来る。中下択もあるがおまけだ。パリィしているとわかれば投げに来るので、うっかりパリィしたらラッシュで逃げる。それを読んでジャンプ攻撃で降ってくることも多く、択掛けになる。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 120, "head": "ワープ投げ・打撃は昇竜・空投げで落とす", "body": "昇竜のような無敵技を持つキャラは、ラッシュから昇竜を出せばワープ投げにもワープ打撃にも対応でき、大きなリターンになる。通常技で落とせるキャラもいる。難しければ、ワープを見て空投げを狙うのもよい。", "themes": ["setplay", "antiair"], "chars": ["JP"], "side": "vs_jp"}, {"t": 177, "head": "即起爆に即ラッシュするのは NG", "body": "JP が最初に即起爆をしてくることがある。即ラッシュした相手が即起爆を選んでいると危険だ。まず即起爆してくるタイプかを見てからラッシュしたほうがよい。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 202, "head": "ODトリグラフのガード後に前ステップしない", "body": "通常トリグラフはガードした側が有利、ODトリグラフはガードした側が不利になる。ODトリグラフをガードした後に前ステップすると、その後の通常トリグラフが刺さり、設置されてシューティングが再開する。前ステップが長いマリーザとザンギエフは前飛びでも抜けられないが、マリーザはジャンプ中P、ザンギエフはドロップキックを出しながら飛ぶと2発目のODトリグラフを避けられる。", "themes": ["setplay", "defense", "matchup"], "chars": ["JP", "マリーザ", "ザンギエフ"], "side": "vs_jp"}, {"t": 262, "head": "トリグラフはジャストパリィラッシュで走る", "body": "できるならジャストパリィラッシュが有効だ。JP がラッシュを読んで2発目を中トリグラフにしても、初弾をジャストパリィしていれば問題ない。中トリグラフでパリィを釣られても、ジャストパリィラッシュを仕込んでおけば確定が取れ、密着されれば JP は実質シューティング終了になる。ラッシュが速いキャラで試す価値がある。", "themes": ["setplay", "neutral"], "chars": ["JP"], "side": "vs_jp"}, {"t": 346, "head": "ダルシムはトリグラフとテレポートの読み合い", "body": "ダルシムは前ステップが非常に長く、ODトリグラフだけでなく通常トリグラフにも当たりやすい。2発目にテレポートが噛み合うと JP 側にもリスクがあるので、テレポートとの読み合いになる。", "themes": ["setplay", "matchup"], "chars": ["ダルシム"], "side": "vs_jp"}, {"t": 377, "head": "トリグラフを見てから SA を返せるキャラは強い", "body": "トリグラフを見てから返せる SA を持つキャラの代表がキャミィ、エドモンド本田、ベガだ。設置中でも同じように返せる。JP は距離が遠いときにゲージや体力を削りにトリグラフを撃つので、できると JP 側は非常に嫌がる。", "themes": ["setplay", "defense"], "chars": ["キャミィ", "エドモンド本田", "ベガ"], "side": "vs_jp"}, {"t": 449, "head": "バーンアウト中はトリグラフ後の前ステップは全キャラ確定", "body": "バーンアウト中は、トリグラフをガードした後に前ステップすると全キャラ確定を取られるので控える。OD設置をされたら我慢して、ガードしきって接近する。", "themes": ["setplay", "resource"], "chars": ["JP"], "side": "vs_jp"}, {"t": 482, "head": "受ける側はパリィをなるべく貼らない", "body": "うっかりパリィしたらワープが来ると想定し、パリィラッシュまで入れて対応する。ワープを見て昇竜を出す対応と違い、1発目の後に2発目が来るので、パリィで逃げたり昇竜で返すのはやりづらい。パリィは弾の起爆に合わせたジャストパリィのときだけにし、トルバランにはパリィしないほうがよい。釣られるとゲージが減る上にワープ投げを食らうリスクがある。フェイントかどうかを見分けるのはかなり難しく、非推奨だ。", "themes": ["setplay", "defense", "resource"], "chars": ["JP"], "side": "vs_jp"}, {"t": 551, "head": "弾の張り直しは JP が不利なので歩ける", "body": "弾をガードし続けて動けないというのは勘違いだ。張り直しの場面は JP が不利で、マイナス19、OD版でもマイナス9と言っている。設置をやり直す限り歩ける隙間があり、トルバランの連発でも弾の間に隙間がある。波動のあるキャラは張り直しにOD波動などで割り込める。", "themes": ["setplay", "neutral"], "chars": ["JP"], "side": "vs_jp"}], "title": "【スト6/JP対策】JPのシューティング対策について教える全actレジェンドJP", "date": "20260318", "duration": 673, "views": 18299, "short": false}, {"id": "_mOPb3s_vtI", "kind": "JP講座", "level": "上級", "summary": "JP の大Pラッシュからの読み合いを、JP 側のメリットと相手側の対処の両面から解説する。大Pラッシュは相手の無敵技をガードでき、遅らせ投げ抜けには大Pラッシュ大Kが勝つ。後半は、遅らせ投げ抜けのタイミングを何度かやって掴む方法を説明する。", "takeaways": ["大Pラッシュは相手の無敵技をガードできる", "遅らせ投げ抜けには大Pラッシュ大Kが勝つ", "遅らせ投げ抜けは何度かやって感覚を掴む"], "characters": ["JP"], "themes": ["offense", "defense", "practice"], "version_sensitive": true, "version_note": "2026年3月の動画（配信は2026年2月）。JP の大Pラッシュ後の読み合いとフレームが前提で、調整で変わっている可能性がある", "points": [{"t": 0, "head": "大Pラッシュはラヴーシュカの崩しや連携構成に使う", "body": "神木Cが大Pラッシュを最もよく使う場面は、ラヴーシュカで崩しに行くときと、連携を組むときだ。大Pラッシュをした時点で JP 側が有利になっている。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 24, "head": "大Pラッシュ後は何もしないガードで無敵技を受けられる", "body": "大Pラッシュ後に何もしないでガードすると、相手の無敵技をガードできる。SA でも同じだ。基本は遅らせ投げをするが、遅らせ投げは相手の小Pに負ける。", "themes": ["offense", "defense"], "chars": ["JP"], "side": "jp"}, {"t": 46, "head": "遅らせ投げ抜けには大Pラッシュ大Kで勝つ", "body": "遅らせ投げ抜けに勝つのは大Pラッシュ大Kだ。大Kをガードされるとラヴーシュカの固めに行ける。嫌がって昇竜を出せば遅らせ投げでガードされるかもしれず、相手にとっては非常に難しい読み合いになる。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 78, "head": "遅らせた大Kも混ぜる。リターンは JP 側が大きい", "body": "大Pラッシュから大Kを大きく遅らせて出すこともある。この読み合いは JP 側のリターンが大きい。相手がドライブリバーサルを出せばゲージの交換にはなるが、JP 側に仕込みがあるので完璧な対処ではない。", "themes": ["offense", "defense"], "chars": ["JP"], "side": "jp"}, {"t": 103, "head": "大Pラッシュ中足・小足は連ガで無敵技が出にくい", "body": "他キャラにも同様の大Pラッシュはあるが、JP は特にリターンが高い。大Pラッシュ中足と大Pラッシュ小足は連続ガードになるので、相手が SA1 や昇竜を狙っても出ない。完璧に入力すればガードできるが、昇竜のコマンドの6が入っていると中足の下段のタイミングで下段を食らい、崩れる。", "themes": ["offense", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 136, "head": "中足が当たれば勝ちの場面は連ガ下段を選ぶ", "body": "遅らせ投げで昇竜をガードして攻撃を当てたい場面でも、中足が当たれば勝ちという状況がある。昇竜が来ても勝てるように、大Pラッシュ中足の連ガ下段を選ぶことも多い。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 147, "head": "ためキャラには連ガ下段が有効", "body": "連ガ下段が特に有効なのはガイルやディージェイのようなためキャラだ。SA でない無敵技を出すには上を入れなければならず、その時点で下段を食らう。", "themes": ["offense", "matchup"], "chars": ["ガイル", "ディージェイ"], "side": "jp"}, {"t": 182, "head": "大Pラッシュに相手が何をするかは1〜2回で読める", "body": "大Pラッシュ後に相手が何をしているかは、1〜2回やれば理解できる。散らす人もいるが、大体はとっさの反応なので手なりの行動が多い。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 217, "head": "大Pラッシュを見て無敵技をガードするなら遅らせる", "body": "大Pラッシュを見て無敵技のガードに回るとき、最速で入力すると食らってしまう。ガードを入れながら気持ち遅らせる、という感覚になる。", "themes": ["defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 248, "head": "遅らせのタイミングは何度かやって掴む", "body": "遅らせのタイミングは、何度かやってこのくらい遅らせればガードできるという感覚を掴むしかない。無敵技のあるキャラは ED 以外ほぼ全員発生が同じなので、1キャラでできれば ED 以外の全員に使える。", "themes": ["practice", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 271, "head": "JP が走り終わったタイミングで投げを入れる", "body": "体感では、JP の表示が緑になって走り終わったあたりで投げを入れるつもりでやると合う。", "themes": ["practice", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 281, "head": "ED は遅らせ投げ抜けとガードを両立できない", "body": "ED の昇竜は発生が遅く、13フレと言っている。遅らせ投げ抜けと昇竜のガードを両立できないので、ED は割り切るしかない。", "themes": ["defense", "matchup"], "chars": ["ED"], "side": "vs_jp"}], "title": "【スト6/JP】全actレジェンドJPが教える、大Pラッシュの読み合いについて【配信切り抜き】", "date": "20260303", "duration": 296, "views": 4467, "short": false}, {"id": "k7wcmJH9vuQ", "kind": "JP講座", "level": "中級", "summary": "配信でJPの大Pラッシュからの択を説明した切り抜き。大Pラッシュを当てた時点でJP側が有利で、遅らせ投げ・大攻撃・ラヴーシュカの固めを使い分けて相手を迷わせる。", "takeaways": ["大Pラッシュの時点でJP有利", "遅らせ投げは相手の小Pに負ける", "大攻撃で遅らせ投げの穴を埋める"], "characters": ["JP"], "themes": ["offense", "setplay"], "version_sensitive": true, "version_note": "2026年3月の動画。JPの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "大Pラッシュ後はラヴーシュカの固めかラッシュ中段", "body": "一番よく使うのは、ラヴーシュカで連係を組む形と、ラッシュ中段に行く形。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 11, "head": "大Pラッシュ後は遅らせ投げが基本、小Pに負ける", "body": "大Pラッシュを当てた時点でJP側が有利になっている。基本は遅らせ投げで、無敵技を捨てた相手ならガードできるが、相手の小Pには負ける。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 22, "head": "遅らせ投げに負ける小Pには大Pラッシュ後の大攻撃", "body": "遅らせ投げが小Pに負けるので、それに勝つ選択肢として大Pラッシュ後の大攻撃を使う。これをガードされても、ラヴーシュカの固めに行ける。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 34, "head": "昇龍・暴れのどれにも択を返せる読み合い", "body": "相手が嫌がって昇龍を出すと、遅らせ投げ側にガードされるかもしれない。遅らせ投げに勝とうと攻撃を振っても大攻撃が2回入る形になる。相手は何をすべきか難しく、かなり有利な読み合いになる。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】大Pラッシュ、とは", "date": "20260303", "duration": 51, "views": 6301, "short": true}], "lives": [{"id": "l4dteBzkU60", "game": "スト6", "summary": "共演者2人とチームで出た大会（げんちゃんまんカップ）の配信。共演者との会話が中心で、神木C本人の発言と確定できる解説の場面が無いため、見どころは立てていない。", "highlights": [], "title": "【スト6】げんちゃんまんカップ出る　w/こなん、れでぃあ", "date": "20261122", "duration": 7548}, {"id": "yTBD_tabZpk", "game": "スト6", "summary": "大会のない日にランクマを約2時間遊んだ配信。大攻撃を振った場面の意図と、シャーロスチをガードした側が確定反撃を取れる距離、アルジュン戦の話題が出た。", "highlights": [{"t": 1873, "head": "大攻撃を振ったのは読みか", "body": "2ラウンド目に走っていた場面で大攻撃を振ったのは読みか、と聞かれた。読みと言えば読みだが、特定の行動を読んだわけではなく、前に歩いてこないかな、という程度の感覚だった。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4874, "head": "シャーロスチの先端に確定を取れるキャラ", "body": "シャーロスチの先端にも確定反撃が届くか、という質問への答え。一部の技まで含めれば届くキャラは結構いるが、それを除いて全距離で確定があるのはブランカ、ベガ、エレナだろう、という見立て。ほかにもほぼ届くキャラはいるが、先端だとない場合がある。", "chars": ["JP", "ブランカ", "ベガ", "エレナ"], "themes": ["neutral", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 6575, "head": "アルジュン戦のシャーロスチ", "body": "アルジュン相手のシャーロスチには基本的に確定が取れるらしく、しゃがみ大足がほぼ確実に届くようだ、という話。そのためシャーロスチは自殺技になりやすい気がする、という見立て。", "chars": ["JP", "アルジュン"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】大会もないしランクマ", "date": "20261121", "duration": 7659}, {"id": "2vL4Q5qBTwE", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。画面端を背負ったJPの凌ぎ方、大Pガード後のキャンセルラッシュからの選択を話した。さっきの場面ではアムネジアよりSA3を出せば勝てたか、と振り返った。", "highlights": [{"t": 4715, "head": "アムネジアよりSA3を出せば勝てたか", "body": "さっきの場面を振り返り、アムネジアを出したところでSA3を出していれば勝てたのではないか、と話した。アムネジアは間に合わないことも多いので、SAをきちんと出すことも必要だと振り返った。", "chars": ["JP"], "themes": ["defense", "resource"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 5899, "head": "画面端を背負ったJPの凌ぎ方", "body": "視聴者の「画面端のJPがきつい」という質問に答えた場面。昇竜の届く距離からは攻めを仕掛けられないため、大足などで我慢して凌ぐか、前飛びや垂直ジャンプで通す。暴れをうまく通せれば、そこからSAにつなぐ。", "chars": ["JP"], "themes": ["defense", "antiair"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 6583, "head": "大Pガード後のキャンセルラッシュの選択", "body": "大Pをガードさせてキャンセルラッシュした後は、ラッシュ遅らせ投げ、ラッシュ大K、ラッシュ中足の3つから判断する。視聴者に聞かれた小Pシミーは全くしない。ラッシュ小Pで終えるのはもったいなく、ラッシュ中足は下段で崩れる可能性があるが、ラッシュ小Pは崩れる可能性がない。", "chars": ["JP"], "themes": ["offense"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】時オカクリアしたからランクマ", "date": "20261120", "duration": 8440}, {"id": "KvgW-OHvPPg", "game": "スト6", "summary": "誕生日に出た大会の配信。大会は初戦負けで、配信は約1時間15分で終わった。試合の合間に、パリィを入力したつもりがSAが出た負け方と、アムネジアの仕込みの難しさを話した。", "highlights": [{"t": 1133, "head": "パリィ入力でSAが出た負け方", "body": "ドライブパリィを出そうとしてSAが出てしまった負け方を振り返った。発動系のSAを持つキャラでは起こりうる、という考え。パリィの優先度を高くしてほしいとは思うが、そうすると悪い仕込みができてしまうのだろう、このゲームは悪い仕込みをなるべくできないようにされている、という見立て。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "解説"]}, {"t": 1446, "head": "アムネジアの仕込みはミスが怖い", "body": "8月の調整で、ドライブリバーサルの暗転中に後ろ入力をしても、それまでのコマンド入力やボタンが打ち消されないよう修正された。アムネジアは下入力なので、引きを出さなければ関係は薄いだろう、という見立て。アムネジアの操作にはKを短時間に3回押すものがあり、ミスすると相手の目の前で出して終わるため、ミスしやすい本人は普段やらない。", "chars": ["JP"], "themes": ["patch", "defense"], "side": "jp", "tags": ["調整", "解説"]}], "title": "【スト6】誕生日だしゆなっこ杯出る", "date": "20261114", "duration": 4605}, {"id": "8RylXGykVY4", "game": "スト6", "summary": "バトルハブで対戦しながら視聴者の質問に答える配信。アムネジアをガードされたあとに表ガードが裏のようになる状況の見立て、暴れのジャストパリィと起き攻めの初段、アムネジアでの入れ替え、小Pからの大足の使い分けを話した。", "highlights": [{"t": 1426, "head": "アムネジア後に表ガードで裏のようになる理由", "body": "アムネジアをガードされたあとに、表側のガードなのに裏のように見える不思議な状況になる件への答え。多分、相手がアムネジアをガードした後に一瞬だけ投げや前歩きを入れるような行動をしてきた結果そうなったのだろう、という見立て。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2701, "head": "暴れジャスパは起き攻めの初段を狙う", "body": "暴れのジャストパリィは起き攻めの初段を狙う程度でよいか、という質問への答え。起き攻めの最初の一発にジャストパリィできるのがいちばんよい。小Pの2段目などにも狙えるとかなり強いが、神木C自身もそこはあまりできていない。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["Q&A"]}, {"t": 3273, "head": "ジャスパを嫌がられてもアムネジアがある", "body": "ジャストパリィを嫌がられて投げを重ねられても、アムネジアで入れ替えられる選択肢がまだ残っているため、ジャストパリィには強さがある、という話。ただし小Pなどを最速で暴れてくる相手には無力で、最後は読み合いになる。", "chars": ["JP"], "themes": ["defense", "offense"], "side": "jp", "tags": ["解説"]}, {"t": 4214, "head": "小P大足は相手を見て使い分ける", "body": "小Pからの大足が当たると渋い、という視聴者の言葉への答え。小P大足が中央でもつながる相手キャラなら積極的に狙い、そうでないキャラでは悩みどころになる。相手がきちんとガードできるのか、わざと食らうタイプなのかを見たうえで使う。", "chars": ["JP"], "themes": ["offense", "matchup"], "side": "jp", "tags": ["Q&A"]}], "title": "【スト6】チルハブ　アジア2にいる", "date": "20261107", "duration": 4497}, {"id": "AUIvAc6QVVk", "game": "スト6", "summary": "新actでバトルハブに入り、対戦しながら話す配信。差し返しの技の選び方、バトルハブが練習に向く理由、JPの大Pと中Pの振り方の質問に答えた。", "highlights": [{"t": 631, "head": "差し返しは基本は中攻撃で返す", "body": "トレモでの差し返しについての質問に、基本は中攻撃で返すと答えた。ただし相手の技によっては大Pのほうがよい場合もある、という前置きつき。", "chars": ["JP"], "themes": ["neutral", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 2972, "head": "練習にはバトルハブが向く", "body": "練習にはバトルハブのほうが向く、という考えを話した。前日のactの終盤に回していて少しできるようになってきたと感じたため、改めて中足ラッシュにリバを意識しながらバトルハブで対戦している。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["練習", "解説"]}, {"t": 3837, "head": "JPの大Pと中Pの振り方", "body": "JPの大Pと大Kのリーチが思ったより短く、振り方が分からないという質問への答え。大Pは隙の大きい技をガードさせたあとに使い、ラッシュなどで攻めを迫る形が強い。一歩踏み込んでガードさせにいくつもりで振る。先端だとしゃがみの相手に当たらないため、神木Cはほぼ置き技として使い、相手の前歩きに刺さるよう置く。中Pは当たっても大きくないがリーチが長く、距離を詰めてきた相手への嫌がらせに優秀。", "chars": ["JP"], "themes": ["neutral", "offense"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】新actだし珍しくバトルハブ", "date": "20261101", "duration": 6572}, {"id": "-vxkmHh1WQ8", "game": "スト6", "summary": "ランクマを2時間ほど回した配信。当たる相手がルークとジェイミーに偏るという感想が目立ち、ほかは対戦の実況とミスの振り返りが中心。終盤は負けが続き、切り上げた。", "highlights": [{"t": 4382, "head": "当たる相手がルークとジェイミーに偏る", "body": "ランクマで当たるのがルークばかりで、ほかは春麗に1回当たった程度だと話し、世界がルークとジェイミーに支配されていると嘆いた。同じキャラばかり当たる状況は、この後も15分ほどの間に繰り返し出た。", "chars": ["JP", "ルーク", "ジェイミー"], "themes": ["matchup"], "side": "", "tags": ["雑談"]}], "title": "【スト6】そろぼち2300にしたいランクマ", "date": "20261026", "duration": 7844}, {"id": "4kt8x5v_xcg", "game": "スト6", "summary": "ランクマで2300を目指しながら視聴者の質問に答える配信。中央で大攻撃をガードさせる方法と、JPの勝ちパターンの考え方に答えた。コマ投げを持つキャラの対策についての考えも話した。", "highlights": [{"t": 462, "head": "中央で大攻撃をガードさせるには", "body": "中央で大攻撃を相手にガードさせる状況がなかなか作れない、という質問への答え。ダッシュからだろう、という見立て。大攻撃は当てに行くと意外とリーチが短く、先端だとしゃがみに当たらない。ガードさせる形としては、大Pからラッシュして大攻撃を出す流れが多い。素で出す大攻撃は置き技として使うことがほとんど。", "chars": ["JP"], "themes": ["neutral", "offense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4655, "head": "JPの勝ちパターンと立ち回りの目標", "body": "JPの勝ちパターンが分からないという質問への答え。勝ち方は2つで、1つは画面端でシューティングして完全に倒す形。もう1つはセットプレイで、一度読み合いに勝てば大きなリターンで一気に勝てる。どちらも大Pから大ストリボのコンボが前提になる。大P、しゃがみ中P、中攻撃などを当てて吹き飛ばすことをまず目標にする。インパクトを相手の入れ込みに当ててから攻める形や、ラヴーシュカで崩す形も挙げた。", "chars": ["JP", "アルジュン"], "themes": ["offense", "setplay", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 8942, "head": "見てから飛べないコマ投げの対策の発想", "body": "見てから飛べないコマ投げを持つキャラは、実際に使うかどうかより、持っているという事実が大きいという話。ザンギエフでもマリーザでもエドモンド本田でも、投げ読みでどうにかするしかないという発想がどうしても生まれる。対策の選択肢としてインパクトで仕掛ける話も出た。", "chars": ["ザンギエフ", "マリーザ", "エドモンド本田"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】ぼちぼち2300にしたいランクマ", "date": "20261024", "duration": 9182}, {"id": "ff2oYUGxmBQ", "game": "スト6", "summary": "ランクマをしながら視聴者とやりとりする配信。ジャストパリィ対空への考え方、アルジュン戦の課題、ED戦の組み立てを話した。ランクマ中の声はゲーム内の音声や反射の声が大半で、見どころは少ない。", "highlights": [{"t": 4520, "head": "バーンアウト中のインパクトは返されやすい", "body": "バーンアウト中にインパクトを当てるとラインが上がることはある。ただ、相手がインパクトを一番警戒している時間帯なので、返されるリスクは通常時より少し高いだろう、という見立て。", "chars": ["JP"], "themes": ["resource", "system"], "side": "", "tags": ["解説"]}, {"t": 5056, "head": "ジャストパリィ対空は強いが頼りすぎない", "body": "ジャストパリィ対空は手癖で狙ってしまうが、強い手段で悪ではないという考えを話した。ただし全部をジャストパリィ対空にすると、キャミィやジェイミーのすかし投げを食らい続けることになる。", "chars": ["JP", "キャミィ", "ジェイミー"], "themes": ["antiair", "practice"], "side": "jp", "tags": ["解説", "雑談"]}, {"t": 6247, "head": "アルジュン戦のタックルへの対応", "body": "アルジュン戦の課題を振り返った。相手の持ち味はタックルの部分だろうと見て、そこをしっかり止めたいと話した。タックルしてくる場面はインパクトで返すところだが、実戦でできていない、と振り返った。", "chars": ["JP", "アルジュン"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}, {"t": 7777, "head": "ED戦は遅らせ投げが意味を持たない", "body": "ED戦では、いつもの大Pからラッシュして遅らせ投げをする流れが意味を持たない、と話した。ED専用の何かを考える、という問題意識も話した。", "chars": ["JP", "ED"], "themes": ["matchup", "offense"], "side": "jp", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】眼の様子を見ながらランクマやる", "date": "20261023", "duration": 10296}, {"id": "xTB9fRZxxqg", "game": "スト6", "summary": "ゆなっこ杯に出た配信。大会の終盤で敗れて終わった。技の解説や対策の話はほとんどない。", "highlights": [], "title": "【スト6】眼も回復してきたしゆなっこ杯出る", "date": "20261022", "duration": 6032}, {"id": "lNQmRzkLPIU", "game": "スト6", "summary": "WW #4 に出場した配信。大会の対戦を中心に進めた。", "highlights": [], "title": "【スト6】WW #4 出る", "date": "20261018", "duration": 6018}, {"id": "U1N5IuQSEvk", "game": "スト6", "summary": "EVO France の開始前までランクマをしながら配信。視聴者の質問に答え、ベガのデビルリバースとイングリッドのワープへの対処を解説した。ODヴィーハトが通常のヴィーハトになる現象への疑問や、日本の大会の見立ても話した。", "highlights": [{"t": 922, "head": "ODヴィーハトが通常になる現象への疑問", "body": "2回目のODヴィーハトが通常のヴィーハトになる現象を話題にした。理屈が分からず、先行入力の仕様が悪さをしているのかもしれないが、それよりは起爆のタイミングと設置のタイミングが完全に一致していないためか、と考えた。ボタンの押し間違いはしていないという。", "chars": ["JP"], "themes": ["setplay", "system"], "side": "jp", "tags": ["検証", "雑談"]}, {"t": 1683, "head": "ベガのデビルリバースはジャンプ中Pで落とす", "body": "視聴者の質問に答えて、ベガのデビルリバースへの対処を解説した。空投げはデビルリバースに負けるため、ジャンプ中Pで落とす。同時飛びくらいまでならジャンプ中Pで落ちて、そのままフルコンボに行ける。めくりや裏落ちを狙う相手にしゃがみ大攻撃で落とそうとすると痛い目に遭うため、距離と相手の傾向で選ぶ。", "chars": ["JP", "ベガ"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 1971, "head": "イングリッドのワープは初手ならインパクト", "body": "イングリッドのワープへの対処を答えた。初手で後ろへのワープを選ぶ相手は基本的にいないので初手のインパクトは通る、という人の考えに納得した。2手目以降は後ろワープが絡むと発生が間に合わないことがたまにあるため、ジャストパリィを選ぶことがほとんど。ワープには2種類あり、出るタイミングが違うので見てから対処できる。次の大会で当たるなら練習しておくとよい。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 6794, "head": "日本の大会はトップ8に入るハードルが高い", "body": "WWは1回戦から全力の相手と当たる大会で、トップ8に入るハードルが高い大会だろう、という見立てを話した。EVO Japan でも初戦か2回戦で2000〜2100帯と当たることが多い。記念参加の参加者が大量にいる本家のEVOと比べて、日本の大会は全部ハードルが高いと思う、と話した。", "chars": ["JP"], "themes": ["practice"], "side": "", "tags": ["雑談", "大会"]}], "title": "【スト6】EVOフラ始まる前ぐらいまで", "date": "20261011", "duration": 11943}, {"id": "Itmg-znx9Lg", "game": "スト6", "summary": "ランクマを短時間回し、2200に戻して終えた配信。ゲージが足りないときの方針、グラップへのリスクの付け方、思考を声に出しながら戦うと調子がいい、という話をした。終盤に、翌日にキンバリー戦の動画を出す予定を告知した。", "highlights": [{"t": 1759, "head": "ゲージ不足は設置して前に出て回収", "body": "ゲージがない場面で、設置をして前に出ながらゲージを回収し、後ろに下がらない、と自分に言い聞かせた場面。方針を声に出して確認した形だ。", "chars": ["JP"], "themes": ["resource", "setplay"], "side": "jp", "tags": ["リプレイ振り返り", "練習"]}, {"t": 2052, "head": "グラップにリスクを持たせる", "body": "グラップがある場面で全部投げに行ってしまっている、と振り返り、グラップにちゃんとリスクを持たせることを考えた。ジャストパリィした次の読み合いで、投げ抜けを使って相手に分からせるのが好きだとも話した。", "chars": ["JP"], "themes": ["offense", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "解説"]}, {"t": 2714, "head": "思考を声に出すと調子がいい", "body": "ランクマを終えるとき、レートを戻せたのは喋りながらやったからで、思考を声に出せたほうがいい感じがあると振り返った。やはり喋りながらやったほうが調子が出る、という実感の話。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["練習", "雑談"]}], "title": "【スト6】ちょっとだけ", "date": "20261007", "duration": 2828}, {"id": "7FClbj2dYso", "game": "スト6", "summary": "ランクマでMRを回収する長時間の配信。今回のJPの印象への答えと、変なキャラ枠の強さの見立てを話した。ランクマ中の実況が大半を占める。", "highlights": [{"t": 869, "head": "アレックスは勝ち方も負け方も極端", "body": "アレックスはマリーザと同じタイプで、どこまでレートを上げても、すごい負け方をする可能性が高い。すごい勝ち方かすごい負け方かのどちらかになりやすく、攻めの強さはマリーザより上、という話。", "chars": ["アレックス", "マリーザ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 4083, "head": "JPの今回の印象は大Pが一番痛い", "body": "今回のJPの印象を聞かれ、アムネジアもだが大Pが一番痛いと思う、と答えた。それでも全然上の方のキャラなのは間違いない。個人としては頭打ちだった気がしていたが、最近リプレイを見直したら、意外とまだやれるかもしれないと話した。", "chars": ["JP"], "themes": ["patch", "practice"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 4338, "head": "変なキャラ枠はバイパーが抜けて強い気がする", "body": "変なキャラ業界の1位は誰か、という話題で、バイパーが抜けて強い気がするという見立て。レジェンドの人数が多いことも理由に挙げた。", "chars": ["C.ヴァイパー"], "themes": ["matchup", "neutral"], "side": "", "tags": ["雑談", "キャラ対策"]}], "title": "【スト6】飲酒ランクマで溶かしたMRを回収したい配信", "date": "20261003", "duration": 7936}, {"id": "Jsg1B-3ogLY", "game": "スト6", "summary": "ランクマのリプレイを見ながらメモを取る振り返り配信。大Kが当たる場面、垂直ジャンプの癖、追い込まれたときのアムネジアへの偏り、連続ガードの小Pへのパリィ仕込みなどを課題として拾った。", "highlights": [{"t": 1212, "head": "シューティングは得意でも好みでもない", "body": "神木Cはシューティングが得意ではなく、正直好みでもないと話した。ふだんはあまりやらず、たまに思い出したように使う程度だ。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["リプレイ振り返り", "雑談"]}, {"t": 1576, "head": "垂直ジャンプの癖を前飛びに替える", "body": "リプレイを見て、咎められていないだけで垂直ジャンプをしてしまう癖があると振り返った。もう少し前飛びを増やす方向で考えている。", "chars": ["JP"], "themes": ["antiair", "practice"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 2212, "head": "追い込まれるとアムネジアに偏る", "body": "リプレイを見ながら、勝てなくなると本当にアムネジア以外をしなくなることがある、と振り返った。リバーサルの行動が一点読みになっているわけではない、とも見た。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 2332, "head": "連続ガードの小Pにパリィを仕込む", "body": "連続ガードを組むときの小Pにパリィを仕込む技について、やらない理由がないので常にやるべきだと振り返った。できていない試合は、ただサボっているだけだと自省した。", "chars": ["JP"], "themes": ["offense", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "練習"]}, {"t": 3113, "head": "遅らせ大攻撃からの差しは得が大きい", "body": "遅らせて出す大攻撃からの差しは、ゲージが回復するうえに火力も大きく出るので強い、と振り返った。カウンターになることが多く、そのときは大体2回当たるが、カウンターにならないこともたまにある。", "chars": ["JP"], "themes": ["neutral", "resource"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 3314, "head": "設置後の前歩きが遅れる", "body": "設置したあと前歩きをする場面について、単純に動き出しが遅れていると振り返った。やり慣れていない動きなので、つい遅れてしまうという見立て。", "chars": ["JP"], "themes": ["setplay"], "side": "jp", "tags": ["リプレイ振り返り", "セットプレイ"]}, {"t": 3734, "head": "画面端に詰める展開を重視する", "body": "インパクトが運で通っただけの試合と、画面端にきちんと詰めて勝った試合を見比べた。シューティング展開よりも、画面端に詰める展開のほうが勝ちが多い気がするという見立てを示した。", "chars": ["JP"], "themes": ["neutral", "offense"], "side": "jp", "tags": ["リプレイ振り返り"]}], "title": "【スト6】ただひたすら自分のリプレイを見る配信", "date": "20260930", "duration": 4046}, {"id": "ZtF7sNSdFQ4", "game": "スト6", "summary": "だらだらとランクマを回した配信。キンバリーのSA2に対して、トリグラフでなく起爆を使う理由を示し、ブランカとJPの相性という質問にも答えた。ランクマ中の実況が大半を占める。", "highlights": [{"t": 2401, "head": "キンバリーSA2にはトリグラフでなく起爆", "body": "視聴者の、トリグラフではだめなのかという質問への答え。トリグラフは、キンバリーのSA2の弾無敵が切れた直後に当たる形になるため、普通に無敵で負ける。ヴィーハトの起爆に替えると当たる、と実際に試して示した。この内容をショート動画にする案も出した。", "chars": ["JP", "キンバリー"], "themes": ["setplay", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策", "セットプレイ"]}, {"t": 3275, "head": "ブランカ対JPの相性は五分という印象", "body": "視聴者の、ブランカとの相性を問う質問への答え。ブランカはJP戦でリバランがかなりいい仕事をし、相手がよく見ていると差し返し性能もかなり良い。一方で、画面端に行った場面や、起爆が刺さる場面もちょくちょくあるので、五分という印象を持っていると答えた。", "chars": ["JP", "ブランカ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】だらだらランクマ", "date": "20260926", "duration": 3407}, {"id": "uKBhh1Wz8us", "game": "スト6", "summary": "ランクマをしながら、リプレイを見ての助言と視聴者の質問に答える配信。バーンアウト中の相手への攻め方、ドライブゲージの使い方、画面端の守り、相手ができないことを突き続ける考え方、ミラーのトリグラフの打ち合いを話した。", "highlights": [{"t": 2964, "head": "バーンアウトさせたら無理に近づかず削る", "body": "リプレイを見て、バーンアウトさせたのでSAをやりたくて無理にラッシュで近づき、こうなったのだろう、という見立て。距離を取るなら、削って削って、当たったらSAを入れる形でも全然いいと話した。試合全体では、ドライブゲージが多いときの使い方が怪しいかもしれない、とも指摘した。", "chars": ["JP"], "themes": ["resource", "offense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 3295, "head": "バーンアウト中の相手に生ラッシュで入らない", "body": "SAに行きたいこと自体はよいが、生ラッシュから入ろうとしてラッシュを止められ、そこから逆転されている。バーンアウト中の相手はリバで返してこないので、ゲージに余裕があれば連続ガードになる形で入ると邪魔されない。大PからODトルバランも強い形として挙げた。", "chars": ["JP"], "themes": ["resource", "offense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 3477, "head": "ゲージ6本の状態は損、使いに行く", "body": "自分のドライブゲージが多いときは、使いに行く意識を持つ。ゲージが6本の状態は損をしているので、6本をキープしないようにするのが前向きな考え方だ。多くの人にこの話をしている。", "chars": ["JP"], "themes": ["resource"], "side": "jp", "tags": ["リプレイ振り返り", "解説"]}, {"t": 3530, "head": "画面端の守りは起き攻めの傾向を見る", "body": "画面端から抜け出せないという質問への答え。本当に面倒なときはアムネジアを使う。それ以外では、投げを重ねてくる相手にはバックで避けるなど、起き攻めの傾向を見て対応する。読み合いを回すのが遅く、対応を決める頃には試合が終わりかけているのが課題だと振り返った。", "chars": ["JP"], "themes": ["defense"], "side": "jp", "tags": ["Q&A"]}, {"t": 3737, "head": "相手ができないことを擦り倒す", "body": "JPは相手ができないことを見て、そこを突き続けるのが非常に大事なキャラだ。例えば垂直ジャンプをよく見て空投げで落とす。グラマス・アルマス帯でも必ず穴があるので、当たるならそればかりやるくらいでよい。勝つことがすべてで、相手がインパクトを返さないなら画面端でインパクトを使い続ける。", "chars": ["JP"], "themes": ["practice", "neutral"], "side": "jp", "tags": ["解説"]}, {"t": 4275, "head": "ラッシュ大P中はトルバランを仕込まない", "body": "ラッシュ大Pのときはトルバランを仕込んでいないという認識でよいか、という質問に、仕込んでいないと答えた。大P、ラッシュ、大Pと振る連携は割のいい読み合いだが、ゲージ消費は激しい。", "chars": ["JP"], "themes": ["neutral", "resource"], "side": "jp", "tags": ["Q&A"]}, {"t": 4964, "head": "ミラーのトリグラフ戦はジャスパで返す", "body": "JP同士の戦いでトリグラフの打ち合いが難しいという質問への答え。トリグラフをジャストパリィしてトリグラフを返せるようになると、打ち合いはかなり有利になる。難度は高いが、ミラーは多いので頑張る価値がある。", "chars": ["JP"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】ほのぼのランクマ", "date": "20260925", "duration": 9676}, {"id": "RsQ9LmSpnOA", "game": "スト6", "summary": "コミュニティ大会に出場した配信。対戦の合間は雑談が中心で、JPの技の解説や対策の話は少ない。終盤の負け試合で、OD技の弱点を振り返った。", "highlights": [{"t": 3864, "head": "ODトルバランの弱い点", "body": "ODトルバランは、相手のラッシュで突き抜けられてしまう場面が出た。神木Cはこの点をトルバランの良くないところ、本当に弱いところだと振り返った。", "chars": ["JP"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["リプレイ振り返り"]}], "title": "【スト6】ゆなっこ杯　出る", "date": "20260921", "duration": 3971}, {"id": "evBaj9xQWio", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。大Pの振り方、起き上がりのリバーサルジャストパリィ、ヴィーハト設置後に下がる相手への対応、大攻撃を振る距離、アレックス戦、トルバランのフェイントの読み合いを話した。", "highlights": [{"t": 1897, "head": "大Pは一歩踏み込んで振る", "body": "立ち回りで大Pを振ること自体は続けているが、返されて負けるパターンが以前より多いと振り返った。大Pを振るなら、一歩踏み込んで振ることがより大事になったという見立て。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 2408, "head": "起き上がりジャスパはリバーサル表示で覚える", "body": "起き上がりのジャストパリィは、相手が重ねてきた技に合わせて出し、リバーサルの表示が出ていれば大丈夫。タイミングは感覚で覚えると答えた。アムネジアより状況もダメージも良いことが多いので頑張りたい、投げには勝てない、とも話した。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4275, "head": "設置後に下がられたら歩いてラインを上げる", "body": "ヴィーハトを設置しても相手に下がられてやることがなくなるという質問への答え。歩いてラインを上げ、ゲージを回復してさらにヴィーハトを置く。設置の張り直しは、読み合うというより、距離がまだあるなら張り直せばいいはず、と答えた。", "chars": ["JP"], "themes": ["setplay", "neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 6815, "head": "大攻撃は距離を考えて振る", "body": "空振りしない距離なら大攻撃を振ってよいかという質問への答え。Year1の頃は差し返されにくく、無限に振ってよい技だった。今は差し返されるようになったので、そこそこ距離を考えて振る必要がある。中足などで相手の後ろ下がりを咎めておくと、相手があまり後ろに歩かなくなり、大攻撃を当てやすくなるという考え。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 7523, "head": "アレックス戦は前進に刺さる置き技を置く", "body": "アレックス戦で意識することを聞かれた場面。アレックスは前に進んだところへ刺さる大Pが強いので、そこに当たるような置き技を置けると対処しやすいだろう、という見立て。", "chars": ["JP", "アレックス"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 9699, "head": "トルバランのフェイントは相手の型を見て変える", "body": "トルバランのフェイントの読み合いで、インパクトも暴れも読み合いの形に合わせられるので裏目ではないと答えた。まずトルバランを出して様子を見て、相手がラッシュを張る型か、ラッシュしてくる型か、止まったときだけボタンを押す型かを見て対応を変える。パリィしてくれる相手なら、読み勝ったときのJP側のリターンが大きい。", "chars": ["JP"], "themes": ["neutral", "offense"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】意外にもJPのMRが2200になる配信", "date": "20260920", "duration": 11686}, {"id": "M-hVEg_phXA", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。シューティングと接近のどちらで戦うか、大Kを振る場面、グラマスからアルマスへ上がるときの注意、地上のライン上げ、ワープ攻めを歩きで避ける相手を話した。", "highlights": [{"t": 711, "head": "シューティングか接近かは好みで決める", "body": "JPの戦い方で、シューティング主体か近づくかで迷っているという質問への答え。一切近づかない人もいて個人差が大きく、個性が出やすい。自分が好きなほう、強く使えるほうで決めればよい。どちらか一方に決めず、両方やるのも面白い。", "chars": ["JP"], "themes": ["neutral", "practice"], "side": "jp", "tags": ["Q&A"]}, {"t": 3863, "head": "大Kは相手が前に出たいときに振る", "body": "大Kを使う場面の質問に、相手が前に出たくなる場面だと答えた。投げ抜けの後やインパクトをガードさせた後は前に出たくなりやすく、当たりやすい気がする。センスの部分が大きく、うまく説明できない。投げ抜け後の最速の大Kは、相手のジャンプ攻撃に負ける。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4619, "head": "アルマス帯はコンボ精度の差が大きい", "body": "グラマスからアルマスに上がるコツを聞かれ、その経験がないので分からないと断ったうえで答えた。アルマスでも1800や2000のあたりでは、コンボ精度の差が大きいことが多い。調子が悪くレートが下がっているときは、普段しないコンボ系の操作ミスが増えやすい。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A"]}, {"t": 7163, "head": "地上のライン上げは設置して歩く", "body": "JPでの地上のラインの上げ方が分からない、どうやって上げているか、と聞かれ、設置して歩く、以上と答えた。設置すると相手が何もできなくなるからだ。", "chars": ["JP"], "themes": ["setplay", "neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 7865, "head": "ラッシュを使うコンボはゲージ効率が悪い", "body": "稼働初期に見た、中央インパクトからのコンボについての質問への答え。ラッシュを入れるとゲージ効率が悪くなるので、中央ならあえてやる必要はないと思う、と答えた。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 8714, "head": "ワープ攻めを歩きで避ける相手がいる", "body": "ワープからのジャンプ中攻撃で裏に回る攻めを、ワープを見て少し前に歩いて空かしてくる相手がいる。上のレート帯には、実際にこうした対応をする人がいると話した。", "chars": ["JP"], "themes": ["offense", "setplay"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】なんとJPのMRが2200になる配信", "date": "20260912", "duration": 9081}, {"id": "8fWBeWhQDKs", "game": "スト6", "summary": "ランクマでMRを上げながら視聴者の質問に答える約3時間の配信。確定反撃の始動技、ドライブリバーサルとアムネジアの使い分け、JPがきついキャラ、大Kの振り方、1500〜1600帯からの練習法を話した。", "highlights": [{"t": 4802, "head": "ベガ・ジェイミーにはバクステを置く", "body": "ベガ相手に立ち回りの大Kが有効かという質問に、噛み合いやすい気はする、と答えた。同じ技をいっぱいやってくるジェイミーやベガのようなキャラには、バクステを置いておくといいことが起こりやすい。", "chars": ["JP", "ベガ", "ジェイミー"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5031, "head": "確定反撃の始動はインパクトが基本", "body": "確定反撃の始動をインパクトにするかの基準は、大体インパクトにすること。リーサルがあるときはラッシュから入り、相手がバーンアウトしていなければインパクトから入ってゲージを削る。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 6165, "head": "弾を重ねられるならリバで起こす", "body": "リバとアムネジアの使い分けを聞かれ、弾をひたすら重ねられて負けることが多々あるので、そういう場面ではリバで起こす、と答えた。", "chars": ["JP"], "themes": ["defense", "resource"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 7946, "head": "JPがきついキャラ", "body": "JPがきついキャラの質問への答え。ジェイミー、ベガ、ジュリの辺りが一番きつく、あとケンがきつい。ケンはラッシュの速さが他のキャラと方向性が違う。ルークもケンと同様の理由でしんどい。サガットはそこまでではない。", "chars": ["JP", "ジェイミー", "ベガ", "ジュリ", "ケン", "ルーク"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 8154, "head": "ヴァイパーの上からの攻撃は落とさない", "body": "ヴァイパーが上から足で攻撃してくる動きへの対処を聞かれ、きついと認めつつ、ヴァイパー戦は不利とは思わないと答えた。JPが有利だと言う人もいる印象がある。対処としては、頑張って落とそうとしないのがよい。", "chars": ["C.ヴァイパー"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 9003, "head": "大Kは中足がぎりぎり届かない距離で", "body": "相手に刺さる大Kをどう振っているのかという質問への答え。見てから振る場合もあるが、相手の中足に噛み合う、中足がぎりぎり届かない距離で振ることが多い。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 9896, "head": "1500〜1600帯からの練習", "body": "1500〜1600で伸び悩む人への助言。JPならコンボの威力や完走率を上げ、橋のセットプレイを1、2個覚える。キャラ対策は基本いらないが、確定技には確定反撃をきちんと取る。昇龍をガードした後に焦って小Pから入っていないかを見直す。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】JPのMRが2200になる配信", "date": "20260911", "duration": 10829}, {"id": "-sVAWAfLmJ4", "game": "スト6", "summary": "MR2200を目指してランクマを続ける配信。視聴者が見つけたトルバラン後の連携を試し、イングリッド戦の体感に答え、ODトルバランからSA2につなぐ場面でのリバーサルのキャラ差に触れた。", "highlights": [{"t": 1033, "head": "苦し紛れの一発逆転連携は悪くない", "body": "試した連携を見て、結構強そうな気がすると話した。この連携を使う状況はかなり苦し紛れなので、一発逆転の連携としては悪くなく、リバーサルのパリィはなかなか狙われないだろう、という見立て。", "chars": ["JP"], "themes": ["offense", "combo"], "side": "jp", "tags": ["解説", "コンボ"]}, {"t": 3238, "head": "イングリッド戦の体感", "body": "JPとイングリッドの対戦の体感を聞かれ、「普通に有利なんだろうなと思いつつ、それはそれとしてなんか結構嫌な気持ちすることは多い」と答えた。", "chars": ["JP", "イングリッド"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 3606, "head": "ODトルバランからSA2でリバ抜け", "body": "ODトルバランからSA2につなぐ場面で、最速でリバーサルを入れられると、ブランカとラシードは抜けられてしまう。リバーサルの性能にキャラごとの差があることに疑問も口にした。", "chars": ["JP", "ブランカ", "ラシード"], "themes": ["combo", "defense"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】JPのMRが2200になる配信", "date": "20260910", "duration": 5465}, {"id": "rK3x2ER651c", "game": "スト6", "summary": "大雨の夜に行ったランクマ配信。ダルシム戦で飛びが必要になる話と、勝った試合を反省して、カウンター時とパニッシュカウンター時の始動を練習課題にした場面がある。中身は薄めの配信。", "highlights": [{"t": 549, "head": "ダルシム戦は結局飛びが必要", "body": "ダルシム戦で「結局ダルシムには飛びなんだよな」と振り返った場面。ただし、何も見ていない飛びは落とされやすいとも話した。ダルシムに対する立ち回りの考え方の振り返りだ。", "chars": ["ダルシム"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 5261, "head": "勝った試合の反省と練習課題", "body": "勝ちはしたが内容が良くないと振り返った。カウンターとパニッシュカウンターで最適な始動が違い、使い分けるのが理想だが難しい。ここで火力が安くなって負けた試合があるので、今度から練習する、とした。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["リプレイ振り返り", "練習"]}], "title": "【スト6】明日大雨らしいしランクマ", "date": "20260906", "duration": 5507}, {"id": "x37Y8lEVE8c", "game": "スト6", "summary": "ランクマをしながら視聴者の質問やリプレイに答える配信。OD技にパニッシュカウンターの投げが入った理由の解説、OD トルバランがヒットした後の詐欺飛びの検討、アレックスへの印象を話した。", "highlights": [{"t": 1265, "head": "OD技の後の投げがパニカンになった理由", "body": "OD技で突っ込んでくる相手にパニッシュカウンターの投げが入った理由を説明した。その技はガードして不利3フレームなので何も確定しない。投げがパニッシュカウンターになったのは、相手がジャストパリィを狙ってパリィを押したところに投げを入れたからだ。", "chars": ["JP"], "themes": ["system", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 1440, "head": "OD トルバラン後の詐欺飛びを試す", "body": "視聴者から、相手が後ろ受け身を取る前提で、OD トルバランがヒットした後に画面中央から詐欺飛びに行けるのではというリプレイが送られ、実際に試した。OD トルバランが当たった後は良い選択肢が少なくなりがちなので、詐欺飛びに行けるなら非常によいかもしれない、という見立て。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 1909, "head": "詐欺飛びの表裏は割り切って使う", "body": "ジャンプ弱Kを使う詐欺飛びは、表になっているか裏になっているかが見えず、やっている側でも分からない。表裏が分かるようになればめくらず確実に詐欺飛びにできて熱いが、割り切って、めくらない前提の表の択として使うのもいいかもしれない、という考え。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["セットプレイ", "解説"]}, {"t": 3728, "head": "アレックスには一方的に壊される印象", "body": "アレックスに負けるときは、大体すごい形になる。マリーザに近い印象だが、アレックスとはマリーザほど長く付き合っていないので、破壊される印象がより強い。破壊力が高く、前よりだいぶ強いという感想。", "chars": ["JP", "アレックス"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】社会復帰後初週末なのでランクマ", "date": "20260905", "duration": 7641}, {"id": "x3yXrFHODpY", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。大型キャラ相手に全部ストリボーグにするやり方への考えと、立ち大攻撃を振る理由を話した。ほかは雑談が中心。", "highlights": [{"t": 1841, "head": "大型キャラ相手は全ストリボーグでよい", "body": "大型キャラ相手に全部ストリボーグにするやり方について、やること自体は極めて簡単なので、やらない理由はないという考え。ただし最大ダメージを取る場面ではやり方が変わるのが若干面倒だ、とも話した。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["コンボ", "雑談"]}, {"t": 2464, "head": "立ち大攻撃を振る理由", "body": "他のプレイヤーより立ち大攻撃を振る理由を視聴者から聞かれ、ガードさせて有利で、置いておくと相手が勝手に突っ込んでくるから、と答えた。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】社会復帰したので本当に軽くランクマ", "date": "20260902", "duration": 4587}, {"id": "eC9U3U3weZ0", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。JPの難しさの種類、中距離のサガットへの立ち回り、ヴィーハトの起爆を見せておく意図を話した。", "highlights": [{"t": 500, "head": "JPの難しさは手元の忙しさではない", "body": "JPは難しいキャラと言われがちだが、手元が忙しいタイプの難しさではなく、そこまで難しいかという気がする、という感想。難しさの種類が多分違い、ヴァイパーのような手元が超忙しいキャラは、操作の選択の種類が多いタイプだと話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 1673, "head": "中距離のサガットには中Pを置く", "body": "中距離のサガットに対して固まってしまう、という質問への答え。見てドライブインパクトやジャストパリィを取れれば一番よいが、現実的には難しい。そこで中Pを置いておく。差し返しがあると危ないが、そうでなければ多くの技に勝てる。", "chars": ["JP", "サガット"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2185, "head": "設置の後は起爆を見せておく", "body": "ヴィーハトを設置した後、何もしなくても1回起爆を見せておくと相手が動きにくくなるので、常に見せるようにしている。飛びが多い相手には起爆からコンボになる。ラッシュで設置を突き抜けてくる相手もいるため、どちらかといえば飛びの多い相手に向く。", "chars": ["JP"], "themes": ["setplay"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】明日から社会復帰なので本当に軽くやる", "date": "20260831", "duration": 4254}, {"id": "3TayBTaG5pY", "game": "スト6", "summary": "ランクマを回しながら進めた配信。実況が中心で、視聴者の質問に、やる気が出ないときの付き合い方と、十字キーでのコマンド入力のコツを答えた。", "highlights": [{"t": 5129, "head": "やる気が出ないときはやらなくていい", "body": "モチベーションが落ちているという質問に、やる気が出ないときはやらなくていいと答えた。ゲームなのだから気が向いたときにやるもので、大会やプロを目指す目標があるなら別だが、そうでなければ楽しめるときにやればいいという考えだ。目標になる大会がない時期は、レートを上げる以外に無理をしなくてもいいだろう、という見立て。", "chars": [], "themes": ["practice"], "side": "", "tags": ["Q&A", "練習"]}, {"t": 6724, "head": "十字キーのコマンドは回しすぎるくらいでいい", "body": "十字キーで下左下左のコマンドが素早く出ないという質問への答え。技の硬直中に入れる分には、ほかのコマンドが出ないように気を付けるだけでよく、回しすぎるぐらいで構わない。生の状態で入れると後ろ入力でジャンプしてしまうことがある、と実際に入力して見せた。操作は指先で行っている。", "chars": [], "themes": ["practice"], "side": "", "tags": ["Q&A", "練習"]}], "title": "【スト6】社会復帰が近づいてつらいのでランクマ", "date": "20260830", "duration": 7245}, {"id": "LtVWTrXxfCI", "game": "スト6", "summary": "大会に出場した配信。大会運営側の不具合で試合が進まない時間が長く、その間は状況の説明が中心になった。見どころは、リーサルのコンボルートの選び方と、設置が当たった場面の選択の振り返り。", "highlights": [{"t": 931, "head": "リーサルは簡単なルートを選ぶ", "body": "リーサルを狙うコンボで、大Pを使う難しいルートは安定しないことがちょくちょくあるので、神木Cはあまりやりたくないと話した。足りそうなら簡単なほうを選ぶことが多い。簡単なほうで足りなかったときがあまりにも悲しく、後悔することもたまにあるからだ。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["解説", "コンボ"]}, {"t": 7818, "head": "設置が当たった場面の選択を振り返る", "body": "設置が当たった場面から、SA1で相手をバーンアウトさせる流れが一番期待していた展開だった。神木Cは、その選択ができなかったと振り返った。", "chars": ["JP"], "themes": ["resource", "combo"], "side": "jp", "tags": ["リプレイ振り返り"]}], "title": "【スト6】WW #3 出る", "date": "20260830", "duration": 8304}, {"id": "SpasYmij-Os", "game": "スト6", "summary": "JPとベガでランクマを回した配信。視聴者の質問に、始めるならJPとベガのどちらがよいか、設置が絡む詐欺飛びのタイミング、1500帯の相手の傾向を答えた。", "highlights": [{"t": 1438, "head": "今から始めるならJPかベガか", "body": "今から始めるならJPとベガのどちらがおすすめかという質問に、ほかのキャラから乗り換えるなら取っ
