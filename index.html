つきやすいのはベガだと答えた。JPは覚えることが多いのが難点だ。", "chars": ["JP", "ベガ"], "themes": ["practice"], "side": "", "tags": ["Q&A"]}, {"t": 1994, "head": "設置が絡む詐欺飛びはタイミングで変わる", "body": "視聴者の質問に答え、設置が絡む詐欺飛びの話をした。大Pが当たった高さや、設置が直撃したタイミングのフレームが影響する。大P設置からの前投げは一応詐欺飛びになるが、タイミングによって詐欺飛びになったりならなかったりする。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 2444, "head": "1500帯は発売初期より強い相手が増えた", "body": "1500帯に強い相手が多すぎるのではという質問に、発売初期よりは強くなっているだろうと答えた。ただし1500帯の相手は、たいていコンボが安いとも話した。", "chars": ["JP"], "themes": ["practice"], "side": "", "tags": ["Q&A"]}], "title": "【スト6】JPとベガでランクマ", "date": "20260824", "duration": 7285}, {"id": "OuGmSoPe7e8", "game": "スト6", "summary": "MR2000を目指してJPでランクマを回した配信。視聴者の質問に、ジャンプ中Pの使い方とJPの基本の勝ち筋を答え、ODトルバランの使い方を見直した。", "highlights": [{"t": 1477, "head": "ジャンプ中Pはとにかく長くて強い", "body": "うまいJP使いはジャンプ中Pを使っているが強いのかという質問に、ジャンプ中Pは非常に強いと答えた。技がとにかく長く、垂直ジャンプから振ると相手の行動を抑制する効果が高い。判定は強くないので、相手が対空技を振っていると当たってしまうが、何もせずに着地すれば、その対空技の隙に確定を取れる。", "chars": ["JP"], "themes": ["neutral", "antiair"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 9176, "head": "有利なのに圧で下がってしまう負け方", "body": "ランクマの試合を振り返り、有利な状況なのに相手の圧に押されて後ろに下がってしまうのはよくない、ありがちな負け方だと話した場面。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 9665, "head": "JPの基本はダウンから設置で端へ", "body": "今シーズンはまず、当たることが多いキャラへの勝率を上げることが大事だと話した。JPの基本の勝ち筋は、ダウンを取って設置し、投げなどで画面端に追い込んでセットプレイにつなげることで、どこまで行ってもこれだという答えだった。", "chars": ["JP"], "themes": ["setplay", "practice"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 10107, "head": "ODトルバランの使い方を見直した", "body": "ODトルバランからの発動を相手の頭に刷り込ませておければ強い、と評価を改めた。光る技には反射的にパリィを出しがちだという見立てもある。トルバランは相手の目の前に行くまで判定が出ない弾なので、波動拳と同じ使い方では弱い。これまでは、ラッシュ大Pからの形がほとんどで、生のODトルバランはあまり使ってこなかった。", "chars": ["JP"], "themes": ["neutral", "offense"], "side": "jp", "tags": ["解説", "練習"]}], "title": "【スト6】ぼちぼちMR2000にしたい", "date": "20260818", "duration": 13723}, {"id": "mWlneLs90qQ", "game": "スト6", "summary": "MR2000を目指してランクマを回しながら、視聴者の質問や話題に答える配信。補正切り行動、大PからのOD設置の考え方、パリィ専用ボタンの勧め、パッドとレバーレスの違いを話した。", "highlights": [{"t": 3060, "head": "補正切り行動はバーンアウト中の相手向け", "body": "補正切り行動は、パリィを釣られた場合に投げられる形になっていない限り、バーンアウト中の相手以外にはあまり使えない。そのためバーンアウト中の相手に使うなら、1種類あれば足りるという見立て。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["解説"]}, {"t": 4797, "head": "変なセットプレイより先に練習すること", "body": "JPを使っていると変わったセットプレイを作りたくなる気持ちは分かるが、レートを上げたいならその優先度はかなり低く、インパクトを返す練習をしたほうがいい。最近ずっと負けている自分では説得力がないかもしれない、とも付け加えた。", "chars": ["JP"], "themes": ["practice", "setplay"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 5617, "head": "大PからのOD設置は強い行動ではない", "body": "大PからのOD設置についての質問への答え。大PからのOD設置はそもそも自分では全くやらず、強い行動だとも思っていない。相手がきちんと見ていれば確定反撃を取られて全てを失う。設置はコンボの締めや立ち回りで普通に行えばよい。", "chars": ["JP"], "themes": ["setplay"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 6580, "head": "パリィは専用ボタンを作る", "body": "パリィを同時押しで出している人は、専用のパリィボタンを作ったほうがいい。一時的にジャストパリィが出にくくなっても、最終的には専用ボタンのほうが120%いい。連携を考えるより、ボタンを作ってジャストパリィを150回練習したほうがいい。", "chars": ["JP"], "themes": ["practice", "system"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 7034, "head": "パリィボタンは一番押しやすい場所に", "body": "パリィはインパクト以上に咄嗟に押すボタンなので、全ボタンの中で一番押しやすい場所に置く。同時押しをミスして別の技が漏れ、そこに攻撃を食らってダウンしているなら、同時押しのままではだめで、専用ボタンを作らなければならない。ミスが一切ないなら同時押しのままでよい。", "chars": ["JP"], "themes": ["practice", "system"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 8635, "head": "パッドで難しい入力とレバーレス", "body": "JPミラーではトリグラフ、ジャストパリィ、トリグラフと続ける場面があり、やれたほうがいい場面も多いが、パッドでは相当難しい。こうした行動はレバーレスのほうがやりやすいだろう、という見立て。今は比較的暇なので、レバーレスに移るタイミングとしてはありえなくもないと考えた。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談"]}, {"t": 10587, "head": "詐欺飛びに毎回行ける起き攻めは強い", "body": "詐欺飛びに毎回行ける起き攻めは、普通にかなり強い。ただしこのゲームにはジャストパリィがあるので、詐欺飛びの価値が落ちる面はあるが、本来はかなり強い。", "chars": ["JP"], "themes": ["offense", "setplay"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】ぼちぼちMR2000にしたい", "date": "20260817", "duration": 12936}, {"id": "QAR6ElExOhY", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。入れ込みでラッシュを仕込む癖の直し方、パリィにリスクを付ける連携、セットプレイに投げを混ぜる考え方を話した。後半は負けが込み、途中でゲームがフリーズする場面もあった。", "highlights": [{"t": 1709, "head": "入れ込みラッシュ癖の直し方", "body": "確認の弾からラッシュを仕込む癖が抜けず、パニッシュカウンターのコンボに移れないという質問への答え。直し方は意識するほかない。ガードされる前提の技なら入れ込みで構わず、そこそこ当たる可能性がある場面では手を止めて確認するほうがいい。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 2083, "head": "パリィにリスクを付ける連携は少ない", "body": "パリィにリスクを付けられる連携はほかにあるかという質問への答え。稼働最初期からあるODトルバランからトリグラフの通常設置は、パリィされても投げで拾える。ほかにはあまりないだろう、という見立て。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 2392, "head": "セットプレイに投げを混ぜる", "body": "パリィを投げられるのは相手にとって大きなリスクだ。セットプレイに投げを入れないと、相手はパリィか昇龍に絞れて安定してしまい、いちばんリターンが出る行動以外もやらないと読み合いにならない。ジャストパリィされそうな場面では、毎回同じ行動だと読まれるので、そこに投げを混ぜるだけで、ジャストパリィされる回数は減るはず、という見立て。", "chars": ["JP"], "themes": ["offense", "setplay"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】もうすぐ無職が終わってしまうのでランクマ", "date": "20260815", "duration": 9629}, {"id": "3LFNsEnYIRg", "game": "スト6", "summary": "共演者と組んで大会に出場した配信。試合の進行と合間の雑談が中心で、まとまった解説の場面は少ない。", "highlights": [], "title": "【スト6】もかCUP出る　w/こなん", "date": "20260808", "duration": 16403}, {"id": "n-Z8lBOOIvw", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。メインとサブキャラの考え方、ダルシム戦の見立て、調整後のJPの評価を話した。大Pのナーフが痛く、アムネジア後は持続投げのセットプレイを覚えておく、という内容。", "highlights": [{"t": 1455, "head": "サブキャラは今のメインを使いこなしてから", "body": "メインのJPを使いこなせていないまま別のキャラを触るのは中途半端で嫌だ、という葛藤の相談に答えた。メインが強く戦えるキャラで、そのキャラでまだ十分にやれていないのにサブキャラを始めるのは、伸びには良くない可能性があるという見立て。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1951, "head": "ダルシム戦は対策なしでは厳しい", "body": "JPで上のランクまで行く人はダルシム対策をしっかり固めているというイメージが話題になった。ダルシム戦は全く対策しないで戦うのは厳しい、と答えた。", "chars": ["JP", "ダルシム"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 8965, "head": "調整後のJP：大Pのナーフが痛い", "body": "調整で弱体化されたJPについて、十分に強いが強キャラとは言えなくなったかもしれない、と答えた。痛いのはアムネジアより大Pのナーフだ。アムネジアは持続投げを取った時に無敵技をパリィされて負ける形が増えたため、各キャラの持続投げのセットプレイを覚えておくとよい。JP自体より、ルークなどJPから見て嫌なキャラが強くなったことが問題だ。", "chars": ["JP", "ルーク"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["Q&A", "調整"]}], "title": "【スト6】ランクマ→FF14　コントローラ壊れた", "date": "20260807", "duration": 17205}, {"id": "zAhVM3GijPc", "game": "スト6", "summary": "JPとベガでランクマをしながら視聴者の質問に答える配信。調整後のJPについて、アムネジアの弱体化と持続投げへの備え、モダンの強み、キャンセルワープの使い道、設置を置くタイミング、調整後の環境の見立てを話した。", "highlights": [{"t": 315, "head": "調整の影響はアムネジアの弱体化が大きい", "body": "調整の影響は大きいかという質問に、大きいと答え、特にアムネジアの影響が大きいとした。持続投げから無敵技をパリィされると大きく負けるので、各キャラの持続投げのセットプレイは覚えておいたほうがよい、という見立て。", "chars": ["JP"], "themes": ["patch", "defense"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 1290, "head": "JPの感想は大Pのナーフが痛い", "body": "今のJPの感想を聞かれ、大Pのナーフが痛いが十分に強いと答えた。最大の問題はルークなどの強さだとした。アムネジアについては、むしろ今まで通用しすぎていたという位置づけの調整だ、という見方を示した。", "chars": ["JP", "ルーク"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 3660, "head": "モダンJPの強みは手軽さ", "body": "モダンはトリグラフの強度を後から選べるが、クラシックと比べて強いかという質問への答え。遠距離戦ではクラシックだと相当きつい側面があり、モダンはワンボタンで出せてコマンド入力の手間も少ないため、かなり有利だ。以前はコンボ火力の低さが弱点だったが、今回クラシックとほぼ変わらないコンボが出せるようになり、その穴が塞がった。", "chars": ["JP"], "themes": ["system", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4611, "head": "調整後のJPは5強レベルではなさそう", "body": "調整への感想を聞かれ、普通にナーフだと答えた。5強とまで言えるレベルではなさそうだというのが第一印象だ。ほかのキャラの調整がどれほどかにもよる、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 4663, "head": "キャンセルワープの使い道", "body": "キャンセルワープの使い道を聞かれ、後日の調整の第一印象の動画でも話すと前置きして答えた。見てジャストパリィをしてくる相手や、無敵技で割り込んでくる相手への対応が真っ先に浮かぶ使い道だ。ラッシュ後に中Pが出てしまい、ダッシュインパクトを受ける場面への対応にもなる。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4963, "head": "設置を置くタイミングは安全第一", "body": "設置を置くタイミングの質問に、確定を取られにくいタイミングだと答えた。自分のゲージに余裕があれば置く、という程度でよい。設置自体は直接ダメージにならないため、適当に置いてばかりいると近づかれ、ゲージを払ってダメージを受ける状態になる。", "chars": ["JP"], "themes": ["setplay", "resource"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 6571, "head": "調整後はルークとリュウが強そう", "body": "調整後の環境の見立て。ルークとリュウがかなり強そうで、人口の面ではこの2キャラが二大巨頭になりそうだ。ジェイミーもかなり強いと思われる。JPにとっては、自身のナーフよりもルークがかなり強いことが逆風だという見方。", "chars": ["JP", "ルーク", "リュウ", "ジェイミー"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["調整", "雑談"]}], "title": "【スト6】JP・ベガランクマ→FF14", "date": "20260806", "duration": 14658}, {"id": "JljSmBPaBfM", "game": "スト6", "summary": "調整直後のJPでランクマをしながら話す配信。新しいJPの評価、調整後の環境の見立て、モダンJPが強いという声への疑問、アムネジアに頼れなくなった後の立ち回りを話した。終盤はベガも使った。", "highlights": [{"t": 205, "head": "新JPはナーフでも上の方にいる", "body": "新しいJPはどうかと聞かれ、ナーフではあるが十分に上の方にいると思う、と答えた。ストリボーグの使い道は少し難しいが、何度か使った感じでは意外と強いかもしれない。大Pとの使い分けが必要になるだろう、という見立て。", "chars": ["JP"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 739, "head": "調整後の環境はルークとリュウが強い", "body": "調整後のJPは、メインとして使い続けるが、ナーフなので今後どうなるかは難しい。5強レベルではなくなっただろう、という見立て。研究が進めば変わるかもしれないが、今のところは5強とは言えなさそうだ。ルークとリュウは相当強いだろう。前に5強と呼ばれたキャラのうち、サガットとブランカは残れるかどうかというところだ。", "chars": ["JP", "ルーク", "リュウ", "サガット", "ブランカ"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 3023, "head": "モダンJPが強いという声に疑問", "body": "モダンJPが今なぜ必要なのか、という話題。普通のコンボが出せるようになったことは分かっているが、それだけでモダンのほうが強いと言えるレベルなのかという疑問がある。ワンボタンのアムネジアは割り込みが強く、守りが強くなる点は認める。JPはモダンのほうが強いと言う人は多いが、正直な感想は本当かというものだ。", "chars": ["JP"], "themes": ["system", "defense"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 6116, "head": "アムネジアに頼れなくなったJPの課題", "body": "調整後のJPは、前ほどアムネジアに頼れなくなったという見立て。その分、リバーサルと、投げ読みのバックの重要度がかなり上がった。", "chars": ["JP"], "themes": ["defense", "patch"], "side": "jp", "tags": ["解説", "調整"]}], "title": "【スト6】軽ランクマ　もしかしたらベガも", "date": "20260804", "duration": 6949}, {"id": "R5jtd6nJRK4", "game": "スト6", "summary": "調整直後の様子見のランクマ配信。視聴者の質問に答えてワープキャンセルの使い道を話し、アムネジアが警戒されすぎる状況に触れた。終盤でレジェンドに戻って配信を終えた。", "highlights": [{"t": 1380, "head": "ワープキャンセルの使い道", "body": "JPの技からワープキャンセルができるようになったが使い道はという質問に答えた。これまでは中足起爆をジャストパリィされると補正が乗らず、相手のリターンが大きかった。ジャストパリィと無敵技への両対応は厳しそうなので、ワープでかわすのが1つの答え。設置があるときのラッシュインパクトにも、中Pワープでリスクを負わせられるという見立て。", "chars": ["JP"], "themes": ["patch", "setplay"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 2578, "head": "JPの対空はアムネジアという答え", "body": "キャラごとに通常技の対空より無敵技の対空がよいことはあるのか、という質問に答えた。JPの場合は通常技ではなくアムネジアで対空する。ジェイミーなどには、通常技のボタンのほうがよい可能性もある、という見立て。", "chars": ["JP"], "themes": ["antiair"], "side": "jp", "tags": ["Q&A"]}, {"t": 6991, "head": "ワープキャンセルの悪さと苦手キャラの強化", "body": "ワープキャンセルで悪さができそうかという質問に、できると思うと答えた。ラヴーシュカ中の連携などが後々出てくるだろうという見立て。ジャストパリィを狙ってくる人が非常に多かったので、中Pワープでかわせるのは大きい。JPは強いと見ているが、元々苦手寄りだったルークとジェイミーの強化は逆風と話した。", "chars": ["JP", "ルーク", "ジェイミー"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["Q&A", "調整"]}], "title": "【スト6】ニューイヤー様子見JP", "date": "20260803", "duration": 9427}, {"id": "gYHNHkrNd8w", "game": "スト6", "summary": "調整が来た日に、公式の変更内容を読み上げながらJPの調整を確認し、実機でも試した配信。アムネジアの投げ後の硬直増加と大Pの弱化を中心にナーフと見つつ、ワープキャンセルなどの強化点を挙げ、トータルでは耐えているという評価だった。", "highlights": [{"t": 430, "head": "アムネジアの投げ後は小Pしか確定しない", "body": "アムネジアで投げを取った後のJP側の硬直が4F増える調整。投げ後はプラス4になり、確定は基本的に小Pだけと考えておけばよい。相手が持続投げをきちんと行うと小Pさえ繋がらず、有利Fだけが残る場面がある。ベガの膝を取ったときと同じ状況になる、と話した。", "chars": ["JP"], "themes": ["patch", "offense"], "side": "jp", "tags": ["調整", "解説"]}, {"t": 503, "head": "中P・中足のキャンセル先にワープが加わった", "body": "中Pや中足からキャンセルできるのは起爆だけだったが、ワープもできるようになった。強化ポイントとして挙げた。起爆の中Pが強いため、ラッシュを見ると中Pを押す相手が多く、設置があるときに中Pをインパクトでつぶすラッシュインパクトが有効だった。そこにワープで隠れる使い方になるだろう、という見立て。", "chars": ["JP"], "themes": ["patch", "setplay"], "side": "jp", "tags": ["調整", "セットプレイ"]}, {"t": 790, "head": "ストリボーグの判定拡大とODトリグラフの簡略化", "body": "弱とODのストリボーグは判定が大きくなるので、大Pに対してギリギリ当たる距離で牽制技として使えるようになるだろう、という見立て。ODトリグラフはカウンターヒットと同じ扱いになり、いつでも使えるようになる。単純な強化と評価した。", "chars": ["JP"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["調整", "解説"]}, {"t": 2005, "head": "大Pは後ろ下がりでスカされ差し返される", "body": "大Pは後ろに下がる相手にスカされやすくなるという調整で、その意味を質問されて答えた。同じ行動でもスカしやすくなり、JP側は差し返しをかなり受けやすくなる、という説明だった。", "chars": ["JP"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 2498, "head": "ストリボーグの前方拡大は食い込むと確定を受ける", "body": "ストリボーグは攻撃判定が前に広がったが、2段目だけが当たる距離だとルークのSAで確定を取られる。テリーはSAで取られないので問題は小さい。ルークのバルカンブラストなど、反撃が強力な相手には注意が必要だと実機で確かめた。", "chars": ["JP", "ルーク"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["調整", "検証"]}, {"t": 3127, "head": "大Pは足の速いキャラに大きく下がられる", "body": "実機で相手を後ろに下がらせて大Pを振ると、大きく下がられてスカされる。足の速い春麗のようなキャラには、大Pをスカされて差し返される場面が前より大きく増える。JPやサガットのような足の遅いキャラへの影響は大きくない、という見立て。", "chars": ["JP", "春麗"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["調整", "検証"]}, {"t": 3318, "head": "ストリボーグは先端を見極めて牽制に使う", "body": "ストリボーグは牽制技として強そうだが、食い込むと多くのキャラのSAで確定を取られるため、先端を見極めて振るのが前提になる。どれくらい活きるかは実際にやってみないと分からない、という見立て。", "chars": ["JP"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["調整", "検証"]}, {"t": 3570, "head": "ワープキャンセルの強化と調整全体の評価", "body": "中足ワープや中Pワープは、ラッシュインパクトで来る相手にリスクを負わせて読み合いを仕掛けられるので強いはずだ、という見立て。アムネジアの弱化が大きくトータルではナーフだが、耐えている部類だと評価した。他キャラの強化具合によっては5強とは言えなくなるかもしれないが、強い方には残るだろう。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "総評"]}, {"t": 3862, "head": "ワープキャンセルとジャストパリィ・昇竜の両対応", "body": "ワープキャンセルに対して、ジャストパリィと昇竜拳を入れ込んで両対応できるかという質問に、難しそうだと答えた。ラッシュを入れ込んでいる状況で、見てジャストパリィをしようとしてもなかなかできなさそう、という見立て。", "chars": ["JP"], "themes": ["patch", "defense"], "side": "vs_jp", "tags": ["Q&A", "調整"]}, {"t": 8793, "head": "JPはナーフだが上位には残るという見立て", "body": "JPはナーフされたが、他キャラの強化次第で位置づけが決まるという見立て。5強と言えるレベルになるかは怪しいが、上の方にはいる。端での受けが厳しくなることと、大Pの弱化が響く。エレナは5強に入るだろうと見て、ルークやバイパーは強化が大きい。", "chars": ["JP", "エレナ", "ルーク"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["調整", "総評"]}, {"t": 9661, "head": "入れ替えコンボを試す", "body": "SAとドライブゲージ2本を使う入れ替えのコンボを試した。悪くなさそうと評価しつつ、2本使うかというと微妙だとも話した。入れ替えをやるなら2本使わないと難しそうで、実戦で使うかどうかは試して考える。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["コンボ", "検証"]}], "title": "【スト6】無職だし調整確認する", "date": "20260803", "duration": 10306}, {"id": "JdR_4go3Ihc", "game": "スト6", "summary": "EWCを見ながらカスタムを募集し、ランクマも回した配信。調整前日で、JPに入りそうな弱体の予想、パリィの使い方、リリーと春麗に勝てない理由、画面端のセットプレイでの暴発対策、読み合いのずらし方などの質問に答えた。", "highlights": [{"t": 389, "head": "JPの弱体はヴィーハトの補正と予想", "body": "調整前日に、ヴィーハトにコンボ補正が乗ることが一番思いつく弱体だと話した。現状は始動補正だけでコンボ補正がないという認識で、1年ほど前から来ると言い続けているが、まだ来ていない。SAがヒット発動のみになっても強いという見立ても示した。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 2637, "head": "パリィは相手の連携への割り込みに使う", "body": "パリィの使い方がまだわからないという質問に答えた。相手の連携に割り込むために使う。連携の途中でジャストパリィを取れるようになると、相手からすると攻めが非常にしづらくなる。", "chars": ["JP"], "themes": ["system", "defense"], "side": "jp", "tags": ["Q&A"]}, {"t": 4165, "head": "リリー・春麗に負け越す理由と相性表の見方", "body": "JP有利のはずのリリーと春麗に負け越すという質問に答えた。リリーには、設置があると風を抜けようとする動きを釣りやすく、それを見てジャストパリィを取る展開が多い。相性表は下のレート帯には原則関係ないので、囚われすぎないほうがよいと話した。", "chars": ["JP", "リリー", "春麗"], "themes": ["matchup", "practice"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 4319, "head": "カスタムで勝てても、ランクマで勝てるとは限らない", "body": "カスタムでレジェンドに勝てるからレジェンドに行けるという自信は危ないと話した。カスタムは相手も練習や試しをしていることが多く、ランクマとは動きが違う。ランクマで勝てない原因が動きの出来の悪さだと自分で分かっているなら、それを直せばよい。", "chars": [], "themes": ["practice"], "side": "", "tags": ["Q&A", "考え方"]}, {"t": 6100, "head": "画面端のセットプレイで引き中がワープに化ける", "body": "画面端のセットプレイで引き中がワープに化けやすいというコツの質問に、自分も時々あると答えた。小Pの直後に引き中へ直接行こうとするので暴発する。小Pの後にいったんニュートラルに戻してから引き中を出すようにすると、化けにくい。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 6352, "head": "シビアなヒット確認は体力バーを見る", "body": "超シビアなヒット確認では、体力バーを見るのが昔からの鉄板だと話した。実戦のほうが状況確認が混ざるので簡単だという。確認に失敗してもガードされたあとに小Pが連続ガードになるので、リスクは大きくなく気軽に挑戦できるラインだという見立て。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 6757, "head": "壁端で投げとシミーのどちらを見るか", "body": "壁端で何を見るのがリスクが低いかという質問に、シミーを見て無限投げで負けたなら読み負けでしかたがないと答えた。投げをしていたら相手がシミーで爆散した可能性もある。リスクの面ではシミーを見るのは正しい判断だと話した。", "chars": ["JP"], "themes": ["defense", "offense"], "side": "jp", "tags": ["Q&A"]}, {"t": 7026, "head": "読み合いを読まれないためのずらし方", "body": "掴み4連続目はアムネジアというルールにするという視聴者の案をきっかけに、読み合いを読まれない方法を話した。秒数の偶奇のようにタイムカウントで行動を決める方式は、自分の意思が介在しないので相手に読まれにくい。自分でもタイムカウント方式のアムネジアを取り入れてみるとした。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "jp", "tags": ["Q&A", "考え方"]}], "title": "【スト6】EWC眺めつつカスタム募", "date": "20260731", "duration": 7280}, {"id": "vnbXq7ZW5So", "game": "スト6", "summary": "フランス遠征から帰国した直後の軽めの配信。ランクマを回しつつ、旅の写真を見ながら振り返った。時差ぼけで調子が出ず、ほとんど勝てなかった。ゲームの内容に触れた場面は少ない。", "highlights": [{"t": 4156, "head": "ラッシュで飛んでしまう現象", "body": "中Kからのラッシュでジャンプが出てしまう場面があった。ラッシュで飛ぶのは何とかならないのか、これはもう治らないのだろうという見立てを話した。", "chars": ["JP"], "themes": ["system"], "side": "jp", "tags": ["雑談"]}], "title": "【スト6】帰国したし軽め配信", "date": "20260728", "duration": 6481}, {"id": "tdyU_8woXj8", "game": "スト6", "summary": "フランス遠征の前日にランクマをしながら視聴者の質問に答えた配信。マスターに上がったばかりの人への助言、インパクト後の動き、調整の見立て、次の1年の最強キャラの予想、シューティングへの対処を話した。", "highlights": [{"t": 348, "head": "マスター到達後はセットプレイとコンボを固める", "body": "JPでマスターに上がったばかりの人への助言。上がったばかりだとセットプレイをあまり覚えていない可能性があるので、その知識を入れる。仕上がっていないコンボも多いはずなので、そこを詰める。コンボはどこまで行っても大事で、火力はなるべく上げる。JPはアドリブのコンボがとても大事になるキャラなので、アドリブの筋肉をつける。", "chars": ["JP"], "themes": ["practice", "combo", "setplay"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1086, "head": "インパクト後は前歩きが基本", "body": "ドライブインパクトの後は歩きと前ステのどちらがいいかという質問への答え。前ステはミスする心配がない。ただ前に歩くとドライブゲージが少し回復するので、基本的には歩きのほうがいい。ただし差は誤差レベル。", "chars": ["JP"], "themes": ["system", "resource"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 1256, "head": "調整は大きなナーフが来ないという見立て", "body": "ブランカは大きなナーフが来ないだろう、という見立て。ワールドウォリアーズとEVOの時期には調整枠が固まっているだろう、という見立て。ストリートファイター6の調整自体が大きなナーフを入れない方針で、1年目の終わりのJPのナーフが過去いちばん大きな調整だっただろう。強化方向はそこそこあるかもしれないが、大きなナーフ方向はないのではないか。", "chars": ["JP", "ブランカ"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 1870, "head": "大きな調整でも順位は総入れ替えしない見立て", "body": "次の調整は大きなアップデートになるだろう。ただ、環境を大きく変えるとプレイヤーが離れるのを運営は恐れるので、順位がごっそり入れ替わる調整はやらないだろうという見立て。次の1年の最強キャラの予想はエレナで、最強になる可能性があるという予想だ。", "chars": ["エレナ"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 2101, "head": "ワープ待ちの相手には弾を撃ち続ける", "body": "シューティング中にワープだけを見て待っている相手への対処の質問への答え。ワープせず、そのまま永久に弾を撃つ。相手が近づく意思を見せないなら、弾を撃ち続けるだけだ。", "chars": ["JP"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2285, "head": "破壊系キャラは最強にならないという見立て", "body": "キンバリーが最強になることはないだろう。キンバリー、マリーザ、アレックス、ダルシムなどの破壊系のキャラは、最強にするとゲームが誰もやらなくなると運営も考えているので、最強にはしないだろうという見立て。破壊系のなかで一番強くなる可能性があるのはベガだろう。キンバリーは毎年少しずつ強化されて今は立ち位置が悪くない。", "chars": ["キンバリー", "マリーザ", "アレックス", "ダルシム", "ベガ"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["調整", "雑談"]}], "title": "【スト6】明日からフランスなのでちょっとだけ", "date": "20260721", "duration": 2948}, {"id": "ZJXcLmyFz-A", "game": "スト6", "summary": "大会で敗退した翌日のランクマ配信。ラグの影響が大きかったと振り返り、フランス遠征の前にMR2300に乗せたいと話した。ODストリボーグからのコンボの難しさにも触れた。", "highlights": [{"t": 2252, "head": "ODストリボーグから先のコンボは距離が難しい", "body": "ODストリボーグから続く部分はダメージが大きく、できるかどうかで減りが大きく変わる。ただギリギリの距離では届くかどうかの判断が相当難しく、トレモでもできるか怪しい難度だ。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["コンボ", "練習"]}, {"t": 6118, "head": "ラッシュで飛んでしまう現象は1年目から", "body": "しゃがみ中攻撃からのラッシュのつもりが、ジャンプが出てしまった。1年目から言われている現象で、治らないのだろうという見立てだ。", "chars": ["JP"], "themes": ["system"], "side": "jp", "tags": ["雑談"]}], "title": "【スト6】大会爆散したのでランクマ", "date": "20260719", "duration": 6843}, {"id": "0VlxiRZ90F0", "game": "スト6", "summary": "深夜までのランクマ配信。視聴者の質問に、パリィとインパクトのボタン配置、ラッシュ後のストリボーグ2回のコンボ、リュウ戦の読み合いを答えた。プレイ中の実況とFF14などの雑談が大半で、見どころは少ない。", "highlights": [{"t": 3877, "head": "パリィとインパクトのボタンは分ける", "body": "パリィとインパクトは別のボタンに割り当てるのが必須で、特にパリィのボタンが大事だ。アケコンは何かしらの形でボタンを増設している人が多い印象。神木C自身はパッドで、背面のボタンにパリィもインパクトも置き、小指で押している。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 6110, "head": "ラッシュ後のストリボーグ2回の違い", "body": "ラッシュからストリボーグを2回入れるコンボで、1回目に何を使うかを質問された。ゲージの回収はほんの少し違うらしいが、差を実感したことはない。拾いやすさは中ストリボーグのほうが若干上で、好み程度の差だと答えた。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 6395, "head": "リュウの竜巻はJP使いの通る道", "body": "リュウの竜巻旋風脚を食らって負けるのは、JPを使っていれば必ず通る場面だと答えた。リュウとJPの読み合いの究極の瞬間で、竜巻で負けた経験があるのはJP使いのほぼ全員だ。", "chars": ["JP", "リュウ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】早起きしたいので早めランクマ", "date": "20260717", "duration": 14383}, {"id": "tQv3KOwGqwM", "game": "スト6", "summary": "ランクマをしながら雑談と視聴者の質問に答える配信。イングリッドの通常技と当て身の評価、JPのアムネジアとの比較、1年目の環境と次の調整の見立てを話した。スト6の話題は一部で、FFの話が長い。", "highlights": [{"t": 2830, "head": "イングリッドは大技が強く他は弱い", "body": "イングリッドを使う人が減ったという感触だ。しゃがみ大Pは強く、大P・大足もそれなりに強いだろう、という見立て。大技は強いが、ほかの通常技はあまり強くない。当て身は弱い。", "chars": ["イングリッド"], "themes": ["neutral", "matchup"], "side": "", "tags": ["Q&A", "キャラ対策"]}, {"t": 3259, "head": "アムネジアとイングリッドの当て身の差", "body": "JPのアムネジアは0点か120点を取る技で、イングリッドの当て身は0点か60点だ。当て身は確定リターンが取れてこそよく、イングリッドの当て身は詐欺飛びに確定しない。取っても状況が良くなるご褒美がない点も弱い。", "chars": ["JP", "イングリッド"], "themes": ["defense", "matchup"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 3591, "head": "1年目の環境と次の調整の見立て", "body": "1年目の環境ではJPとルークが特に強く、ディージェイも強く、ブランカは一貫して強かった。次の調整は環境を大きく変えてこないだろう、という見立てで、1年目の終わりにJPが弱体化された調整が一番大きかったという見立て。", "chars": ["JP", "ルーク", "ディージェイ", "ブランカ"], "themes": ["patch"], "side": "", "tags": ["Q&A", "調整"]}], "title": "【スト6】1時間だけランクマ", "date": "20260716", "duration": 4670}, {"id": "suzckUKhzyk", "game": "スト6", "summary": "ランクマで負け越しを繰り返す配信。見どころは、コンボの補正切りを使いすぎると相手に覚えられ通らなくなる話。そのほかは対戦の実況とキャラの好き嫌いの雑談が中心で、本人の発言と確定できる場面が少ない。", "highlights": [{"t": 1796, "head": "補正切りは多用すると見切られる", "body": "補正切りが多い人だと覚えられると通らなくなることがある。神木C自身も補正切りで勝てる場面ではやるが、飛ばれて潰されるパターンも多く、最近は減らすよう周りに言われている。", "chars": ["JP"], "themes": ["combo", "offense"], "side": "jp", "tags": ["解説", "雑談"]}], "title": "【スト6】色々タスクこなしたからランクマ", "date": "20260715", "duration": 8991}, {"id": "wsmE7M2oF7M", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える長時間の配信。トルバランの使いどころ、引き中攻撃の考え方、ルーク戦のラッシュ止め対策、補正切り投げの是非、ベガのダブルニーをガードした後の動きを話した。", "highlights": [{"t": 1041, "head": "トルバランの使いどころ", "body": "弾の使いどころを聞かれ、一番多いのは大Pからトルバランのフェイントを入れる形で、パリィしてダッシュ投げにつなぐ、ラッシュしてくる相手にはしゃがみ中攻撃を当てる、と答えた。近距離でトルバランを撃ち、見て飛んだ相手を落とす釣りの使い方もありうる。", "chars": ["JP"], "themes": ["neutral", "setplay"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 1484, "head": "引き中攻撃は使いどころが未確定", "body": "引き中攻撃はほとんど使わず、使いどころが分かっていない。相手の連携への割り込みや、下がって技を空かす使い方がよいのだろう、という見立て。ダッシュ引き中の単発からラヴーシュカにつなぐ形は強いが、コマンドが難しくミスの代償が大きいので自分はあまりやらない。", "chars": ["JP"], "themes": ["neutral", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4844, "head": "ジラントからのアムネジア", "body": "ジラントからのアムネジアが間に合わないことがあるという話に、そもそもそれが成功する方がおかしいので、決まれば儲けものと思った方がよいと答えた。本当の正解はジラントから直接SAをキャンセルすることだ、とも話した。", "chars": ["JP"], "themes": ["combo", "defense"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 5698, "head": "ルーク戦のラッシュ止め対策", "body": "ルーク戦のラッシュ対策を聞かれ、相手がラッシュ止めを振ってくる場合の対処を答えた。ラッシュ止めの技は全般にとても隙があるので、その空振りを大Pや大Kで刺すようにするとよい。", "chars": ["JP", "ルーク"], "themes": ["matchup", "offense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 7062, "head": "補正切り投げはやるべきか", "body": "補正切り投げはやった方がよいかと聞かれ、理屈では見て飛べる行動で、飛ばれるとフルコンを食らうため、相手が確実に飛べる人ならやらない方がよいと答えた。ただ現実には飛べない相手が多いので、自分はよくやる。", "chars": ["JP"], "themes": ["offense", "practice"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 7238, "head": "ベガのダブルニーをガードした後", "body": "ベガのダブルニーをガードした後は何をすればよいかと聞かれ、ガードしても確定反撃はほとんど取れないと答えた。有利ではあるので中攻撃などを振ればよく、弱攻撃が届く距離なら弱攻撃で確定を取る話になるが、実際にはほとんど取れない。ダブルニーにリスクを与えるには、バックステップや垂直ジャンプですかす動きが必要だ。", "chars": ["JP", "ベガ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】ショート投稿したからランクマ", "date": "20260714", "duration": 13119}, {"id": "gTpEBizr3ks", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。視聴者への差し返しの助言、アムネジアをガードさせた後が強い理由、考えてプレイするとはどういう状態か、キャミィ戦の置き技、長時間ランクマとの付き合い方を話した。", "highlights": [{"t": 2388, "head": "JPで差し返し主体は難しい", "body": "視聴者から、JPでも差し返し主体で戦ってよいかと聞かれた。歩きが遅いJPで差し返しを狙い続けるのは難しいと答えた。中Pが届くか届かないかの距離を保ち、長い通常技を軸に、飛び道具で牽制して、嫌がった相手の置き技を狩る形になるだろう、という見立て。", "chars": ["JP"], "themes": ["neutral", "practice"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2626, "head": "マリーザは最強にならない見立て", "body": "マリーザは今後もピーキーな強さを軸に強化されていくだろう、という見立て。絶対に最強キャラにはされず、大会で当たると負けうる立ち位置を続けるはずで、コンセプトに沿っていて分かりやすい。間違っても最強にはならないだろう、という確信もある。", "chars": ["マリーザ"], "themes": ["matchup"], "side": "", "tags": ["雑談"]}, {"t": 4251, "head": "アムネジアガード後が強い理由", "body": "アムネジアをガードさせた後の展開は強いという話に、強い理由は誰も確定を知らないことだと答えた。レジェンド帯でも確定を取ってくる相手は5人に1人ぐらいだ。確定を知らないままだとリスクになる、とも話した。", "chars": ["JP"], "themes": ["defense", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4632, "head": "空振りが多いときは1歩踏み込む", "body": "技の間合いが把握できず空振りが多いという視聴者に、練習あるのみで、それ以外に言えることはあまりないと答えた。実際に相手にしているときの感覚より若干短いことがありがちだろう、という見立てで、思ったより1歩踏み込むくらいでよいかもしれないと助言した。", "chars": ["JP"], "themes": ["neutral", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4776, "head": "考えてプレイするとは何か", "body": "考えてプレイするとはどういう状態かと聞かれ、今なぜこの技を振ったのかと問われたときに説明できることだと答えた。全部の行動でなくても、特に決まり手になった攻撃に意思があるかが違う。怖くて後ろに下がり続けるだけなら何も考えていない状態で、自分のゲージ状況を含めて距離を取るか近くで攻めるかを考えられるとよい。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 5136, "head": "キャミィ戦は置きを多めに", "body": "JPでキャミィに勝てる気がしないという視聴者に、噛み合いは悪く、お互いにきつい組み合わせだと答えた。キャノンストライクと噛み合いやすいので、中足や中Kを振りすぎない方がよい。たまたま置いていた技にストライクが引っかかることが多く、置きを多めにした方がよいという印象だ。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5344, "head": "立ち大Pの対空は前飛びに効かない", "body": "対空を立ち大Pにしているという視聴者の相談に、キャノンストライクとは噛み合って良いことが起きる場面があるだろうが、ただの前飛びには対空になっていないと答えた。ただの前飛びを見て大Pで落とせているならすごいが、自分はおそらくできない。", "chars": ["JP", "キャミィ"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5658, "head": "長時間ランクマと休み方", "body": "一人で長時間ランクマを続けると手癖だけのプレイになり、苛立って誰にも勝てなくなると話した。MRを上げる目的なら1日1時間、なんなら30分が目安で、1時間か30分ごとに休憩するくらいが本来はよい。第三者に見てもらいながらやる方が精神は安定する気がする、という見立て。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】大会爆散したからランクマ", "date": "20260713", "duration": 6700}, {"id": "H-WQjXXkNyk", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。キャノンストライクへの対空、豪鬼戦の波動連発と空対空、引き中攻撃の使い方、JPがきついキャラ、ベガ戦の考え方、インパクトを撃つ場面を話した。", "highlights": [{"t": 1595, "head": "ストライクへの対空は対策ではない", "body": "キャノンストライクへの対空についての質問に、遠めからのストライクには勝ちやすいが、見てからは出せないと答えた。遠めの飛びに対空を出せばストライクにも通常の着地にも勝てるというだけで、ストライク対策ではない。ただ、飛びを対空で落とせていること自体は偉い。", "chars": ["JP", "キャミィ"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2113, "head": "豪鬼の波動連発への対処", "body": "豪鬼が一定の距離から波動を連発してくるとき、むかついて飛ぶのは避けるべきで、飛んでも波動が間に合う。簡単な対処はODトルバランで消すことだが、豪鬼側が別の打撃や飛びを入れるとやられるリスクがある。もう一つはジャストパリィから前飛びに行く形で、できれば確定も取れる。一番いけないのは、通常ガードや通常パリィから前飛びして対空で落とされることだ。", "chars": ["JP", "豪鬼"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2292, "head": "空対空で落としてフルコンへ", "body": "豪鬼戦では空対空や対空で落とすとフルコンボに行ける。ジャンプ中Pの先端あたりで落とし、そこからラッシュと大Kでコンボする形は、できるようにしておくとよい。ダルシムのフロートを落としたときも同じコンボになる。豪鬼は体力が低くJPは火力が高いので、端に追い込んだらセットプレイに行く。遠めの空対空はほぼジャンプ中P、近めはジャンプ中Kと使い分けるのが一番よい。", "chars": ["JP", "豪鬼"], "themes": ["antiair", "combo", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策", "コンボ"]}, {"t": 2535, "head": "引き中攻撃の使いどころ", "body": "引き中攻撃の強い使い方を聞かれ、自分もあまり使えていないので有意義なことは言えないと断った上で答えた。連携で使う以外では、判定が引っ込むため、長い判定で突っ込んでくる技を止めやすい。例はジュリのラッシュ中Kで、引き中攻撃で止めるようにすると止まりやすい。", "chars": ["JP", "ジュリ"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2717, "head": "JPがきついキャラの移り変わり", "body": "豪鬼は作りからして長くJPにとって最もきついキャラで、特に発売直後は強かった。豪鬼が弱くなるにつれ、JPの火力で押し切れる場面が増えた。今JPがきついキャラを選ぶなら、ベガとジュリが一番大変な相手になるだろう、という見立て。相手がとてもうまい前提ならEDもきつく、ジェイミーは酒を多く飲まれるととてもきつくなる。", "chars": ["JP", "豪鬼", "ベガ", "ジュリ", "ED", "ジェイミー"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 3177, "head": "ベガ戦で考えていること", "body": "ベガ戦で考えていることを聞かれ、デビルリバースを空対空で落とすこと、今はデビルリバースの移動が少なくなったので対空で落としてコンボにつなぐことを大事にしたいと答えた。垂直ジャンプは相手の技で死ぬことが多く、ダブルニーを打たれにくくしたい狙いもあるため、バックステップを他のキャラ戦より多めに使う。キャミィ戦も同じ振りでストライクを空かすのが大事だが、自分はあまりできていない。", "chars": ["JP", "ベガ", "キャミィ"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 3239, "head": "大Kは真似してよいか", "body": "大Kを真似してよいかと聞かれ、真似できるならしてほしいが、真似して死んだという苦情がいろんな人から来ているので苦情は受け付けないと答えた。大Kのコツを聞かれても分からないとしか答えられず、むしろコピーできたならその秘訣を教えてほしい、という。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 3763, "head": "インパクトを撃つ場面", "body": "相手の連携へのインパクトをどんな時に使うかと聞かれ、調子が悪い時はインパクトとアムネジアが増えると答えた。狙いは相手が入れ込みがちな連携に噛み合わせることだ。調子が悪い時に出るインパクトは、もう勝てないと言いながら撃つ、つまり何も考えていないもの。JPミラーは大Pから何かを入れ込む相手が多く、そこに撃つとキャンセルした技に当たる。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】明日6時起きだからランクマ", "date": "20260710", "duration": 8799}, {"id": "DHwYs05qqek", "game": "スト6", "summary": "ランクマを遊びながら進めた配信。ストリボーグをガードされたときの不利の大きさと使い方、リーサルでSA3を選ぶ判断、他のJP使いのプレイを見ない理由を話した。", "highlights": [{"t": 4998, "head": "弱・中ストリボーグは牽制に向かない", "body": "弱・中ストリボーグは、ガードされたときのマイナスが大きく、距離でごまかせているだけの技だ。近めの距離でガードされるとSA1で確定を取られるキャラが多く、ガイルは距離を問わず確定がある。牽制として使える技ではない。強ストリボーグはガードさせて有利だが、発生が遅いので置き技として使う。", "chars": ["JP", "ガイル"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["解説", "キャラ対策"]}, {"t": 7709, "head": "リーサルはSA3へ直行すべきだった", "body": "さっさとSA3まで行っていれば、それでリーサルだった。神木Cは、SA2へ行ったせいで無駄な悩みが発生した、と振り返った。", "chars": ["JP"], "themes": ["resource", "combo"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 9180, "head": "他のJP使いを見ない理由", "body": "神木Cは他のJP使いのプレイをほとんど見ない。見たほうがいいとは思うが、見る時間があれば対戦してしまうのが理由で、精神性の問題だと話した。自分は安定感が低く調子に左右されるので、安定した側の人を見たほうがいいのかもしれない、という見立て。大会で当たる相手のリプレイは見る。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】明日色々やりたいから早めランクマ", "date": "20260709", "duration": 10941}, {"id": "QTL5e1tPUHA", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。設置前にライン上げとシューティングのどちらを選ぶか、前ジャンプを選ぶ場面、強設置と中設置の違いを話した。この日はダルシムとの対戦が極端に多く、ダルシム祭りと呼んで終えた。", "highlights": [{"t": 1800, "head": "設置前はライン上げかシューティングか", "body": "質問への答え。判断の軸は自分のゲージ状況で、ゲージが全然ない時はシューティングで時間を稼いでゲージを溜めることが多い。そうでなければ前歩きでラインを上げ、回復しつつセットプレイに持っていきたい。自分は相手と中Pがギリギリ届くか届かないかの距離が好きで、ライン上げを選ぶことが多い。", "chars": ["JP"], "themes": ["resource", "neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 2230, "head": "前ジャンプを選ぶのはどんな場面か", "body": "前ジャンプを選ぶ場面についての質問への答え。相手によるが、波動拳を持つキャラなら、キャンセルできない技で微妙な距離になった時に、次は波動拳が来るのではという読みで飛ぶことが多い。むかついたから飛ぶこともあり、常に意思があるわけではない。リバサで前飛びは普通しない。投げを読んだ時くらいだ。", "chars": ["JP"], "themes": ["antiair", "offense"], "side": "jp", "tags": ["Q&A"]}, {"t": 2735, "head": "リバサジャンプ一辺倒はダメ", "body": "リバサの前ジャンプは有効になる場面があるので、選択肢の一つとして持っておくのはよい。ただしリバサジャンプしかしないのはダメだ。リバサジャンプを一切やってはいけないという話ではなく、極端に捉えないことが大事だ。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["Q&A"]}, {"t": 4021, "head": "イングリッド戦は受けの答えが無いと振り返る", "body": "イングリッド戦を振り返り、イングリッドは端が強く、通常技は弱いと話した。受けの答えが自分の中に全然なく、ノリでガードしてしまっているのがよくないと振り返った場面。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 5628, "head": "ダルシムは個人差が大きい", "body": "ダルシム戦の感想として、ダルシム使いは個人差が大きいと話した。フェイントを入れるタイプ、ワープを多用するタイプ、全くワープしないタイプがいる。この日はダルシムばかりと当たっていた。", "chars": ["JP", "ダルシム"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 6938, "head": "強設置と中設置の違いは諸説", "body": "強設置より中設置のほうが利点が多いのではという質問への答え。諸説あるという印象だ。ベガのように距離を詰めるのが得意なキャラが相手なら、中設置のほうが良さそうな場面は多いと感じる。一方、強設置は起爆した時に良い当たり方をするという利点がある。", "chars": ["JP"], "themes": ["setplay"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】眠いのでちょっとランクマ", "date": "20260708", "duration": 7396}, {"id": "UjeaGpYWGxc", "game": "スト6", "summary": "ランクマ配信。モダンJPの評価、切断を晒さないほうがよいという考え、差し返し主体のEDへの苦手意識を話した。終盤にC.ヴァイパー対策として、セイスモハンマーをガードした後の対処を解説した。", "highlights": [{"t": 725, "head": "モダンJPは使う意味が薄い", "body": "モダンJPの話。JPが強いのでモダンでもそこそこやれる可能性はあるが、クラシックと比べた時に使う意味がない度合いは全キャラで最上位だと思う、という見立て。モダンJPでレジェンドに到達した人は1人か2人いる。", "chars": ["JP"], "themes": ["system"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 3045, "head": "切断を晒すのは避ける", "body": "対戦中の切断は不意に起きることがあり、やられたようにしか見えないタイミングで切れることもある。3年ほどゲームをやっていれば2、3回はあるはずで、Twitterなどで晒すのは揉め事の理由になって危ない。変に攻撃的にならないほうがいい、という考えだ。", "chars": [], "themes": ["practice"], "side": "", "tags": ["雑談"]}, {"t": 6729, "head": "差し返し主体のEDは苦手", "body": "EDを差し返し重視のスタイルで使われると、勝てる気がしないと話した。そのスタイルとは相性が悪く、自分もそうした相手を苦手としているため、その手の相手には一生勝てない気がするという感想だった。", "chars": ["JP", "ED"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 9724, "head": "ヴァイパー対策：セイスモ後のインパクト", "body": "C.ヴァイパーのセイスモハンマーをガードした後の対処を示した。セイスモは、そこで止まるパターンと、続けて別の技が出るパターンがある。ガードしたら続きの技が出たかを見て、出た時だけインパクトを押す。とても早く押す必要があり、遅れると返される。止まる場面で誤ってインパクトを出すとマイナス3で痛い。", "chars": ["JP", "C.ヴァイパー"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】ジム行ったからランクマやる", "date": "20260706", "duration": 9969}, {"id": "an09SU2JA3A", "game": "スト6", "summary": "WW #2 に出る配信。初戦はシードで、ルーザー側で長く待つ時間が多かった。コンボミスが響いた負けや、勝ち急いだ場面を振り返り、最終的に65位タイで敗退した。", "highlights": [{"t": 9383, "head": "勝ち急いだアブニマーチの場面", "body": "2戦目で甘いアブニマーチを出した場面を、普通にリーサルがあったかもしれないと話したが、すぐにリーサルは無理そうだと言い直した。普通にコンボして設置するのがよかったが、勝ち急いだ、と振り返った。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 10332, "head": "一定以上に強いEDには勝てない", "body": "一定以上の強さを持つEDには本当に勝てない、と話した。一定以上強いEDはかなり別キャラのようになる、という印象で、誰でもいいからED戦をやればよいというものではない。", "chars": ["JP", "ED"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】WW #2　出る", "date": "20260705", "duration": 10582}, {"id": "4vJjrBXQ7NY", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。ダイヤ帯でシューティングだけでは勝てなくなった時の中距離の当て方と、サブキャラの適性に答えた。引き中攻撃と中Kの違い、前大Kの拾いの難しさにも触れた。", "highlights": [{"t": 682, "head": "中距離は大Pがギリギリ届く間合い", "body": "ダイヤ帯でシューティングだけでは勝てなくなったという質問への答え。中距離で最も強いのは大Pがギリギリ届く間合いで、至近距離は全体的なフレームの重さから弱めになる。この距離で大Pラッシュや中Pラッシュで嫌がらせをし、大Pが当たればシューティングへ移る。大Pトリグラフフェイントでパリィを釣り、ダッシュ投げにつなぐ手もある。突っ込まれて負けるなら、ラッシュや飛びを止める対処が要る。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 1096, "head": "前大Kの拾いは伸びしろの代表", "body": "前大Kの拾いは、JP使いの伸びしろの代表のような行動だと話した。拾うには少し遅らせる必要があり、浮きの高さによって変えなければならないため難しい。自分は画面端で前大Kから中ストリボーグにつなぐ際、前大Kの高さを誤ると中ストリボーグが変にディレイするのが苦手だ。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["コンボ", "解説"]}, {"t": 2565, "head": "リーサルの判断は確実な削りを選ぶ", "body": "リーサルを狙える場面の振り返り。1つ前の時点で多分リーサルだったが確証がなかったため、確実な方を選んだ。連携が決まらなくても、そのまま削りで確実にリーサルになるので、削りのほうが確実だと判断した、と説明した。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["解説"]}, {"t": 3653, "head": "サブキャラの適性（ED・ルーク）", "body": "サブキャラの適性についての話。EDは以前のバージョンなら案外サブキャラ向きだったが、今は違うという。ルークはコンボの感覚が独特だが、それをこなせるならサブキャラ適性は低くなさそうだという見立て。昇竜コマンドが出せなくても最悪やれるキャラだ。", "chars": ["ED", "ルーク"], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 5130, "head": "設置後は引き中攻撃より中K", "body": "セットプレイの動画のコメントで、設置からのつなぎを引き中攻撃にするか中Kにするかの違いを聞かれたという話。どちらも連続ガードで好みの範囲という印象で、当たった場合の火力は中Kのほうが高い。引き中攻撃からの連携もやりづらく、あえて引き中攻撃を選ぶ理由は自分にはない。", "chars": ["JP"], "themes": ["setplay"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 5855, "head": "アムネジア絡みの連携はゲージ削り用", "body": "アムネジアを絡めたコンボはあまりダメージが減らない。アムネジアから中K、SAとつなぐのは、ゲージを削りたい時用の連携だ。最近やれていないが、やったほうがよい連携で、忘れがちだという。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["コンボ", "解説"]}], "title": "【スト6】寝落ちしてたからランクマ", "date": "20260703", "duration": 7444}, {"id": "Xec6eJ-w62w", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。JPの弱体化の見立て、ダルシム戦とキャミィ戦の話、モダンのキャラ選びの相談に答えた。終盤は視聴者のリプレイを見て、動きのテンポ、設置後のラッシュの是非、参考にするリプレイの選び方を解説した。", "highlights": [{"t": 3696, "head": "JPの弱体化はどこに入るか", "body": "JPの弱体化がどこに入るかを聞かれ、ヴィーハトの起爆に補正が付いて火力が下がるのが一番ありそうだ、という見立てを示した。現状の起爆は始動補正だけが付いている。アムネジアの持続の調整も考えたが、イングリッドに同じ持続の当て身が出たため、当て身の標準はこの長さなのだろう、とした。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "Q&A"]}, {"t": 3950, "head": "ダルシム戦はワープを止める", "body": "ダルシムが苦手という質問に「ワープを止める」と三度繰り返して答えた。ダルシムのテレポートを止めないと、ダルシムにやりたい放題されるため。画面端の設置の起き攻めで、あえて小足を混ぜるとよいだろう、という見立て。遠距離のトリグラフは控えめにし、降ってくるところに合わせないと痛い目を見る。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "setplay"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5380, "head": "キャミィ戦で一番きついのは飛び", "body": "キャミィ戦は勢いに飲まれてしまいやすいと振り返った。レジェンド帯ではキャミィがとても多く、勝率は5割前後だが、上位のキャミィは厳しい。一番きついのはキャノンストライクと、それを盾にした通常飛びを繰り返される展開だ。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "antiair"], "side": "vs_jp", "tags": ["キャラ対策", "雑談"]}, {"t": 6977, "head": "モダンで始めるならどのキャラか", "body": "モダンで始めて上を目指したいという相談に答えた。モダンは不便の少ない適性の高いキャラを選ぶのが大事。鉄板はリリー、マリーザ、エドモンド本田、ザンギエフの4キャラ。ヴァイパーも適性は高いが、モダンでも難しい。モダンJPはアルマスなどを目標にするなら全くお勧めできない。", "chars": ["JP", "リリー", "マリーザ", "エドモンド本田", "ザンギエフ", "C.ヴァイパー"], "themes": ["practice"], "side": "jp", "tags": ["Q&A"]}, {"t": 7825, "head": "全体にワンテンポ遅い", "body": "視聴者のリプレイを見て、何をするにもワンテンポ遅いと指摘した。ヴィーハトを置くときも間が空き、その分だけ相手の飛びが当たるフレームが増える。弾から弾へ間を空けずに出す練習を勧めた。たまには相手の弾にパリィをして、ドライブゲージの不利を避けることも挙げた。", "chars": ["JP"], "themes": ["practice", "neutral"], "side": "jp", "tags": ["リプレイ振り返り", "練習"]}, {"t": 8001, "head": "生ラッシュは前パリィ前で入力する", "body": "生のドライブラッシュは、パリィの後に前を入れる入力だと最速で出ず、ドライブゲージを1本より少し余計に使う。「前、パリィ、前」と入力すると最速で出て、ゲージは1本で済む。必須の練習だとした。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "練習"]}, {"t": 8120, "head": "設置後のラッシュに意味は薄い", "body": "設置している間の攻めを聞かれ、設置後にラッシュで突っ込む意味は薄いと答えた。相手が見ていればしゃがみ中Pなどで止められ、ラッシュで届く技もない。設置の圧があるので、歩いて相手に手を出させ、そこにコンボを入れる方が強い。ラッシュで届く技があり有利フレームから行けるなら使ってよい。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 8548, "head": "参考にするのは少し上の人のリプレイ", "body": "参考にするリプレイは、最上位の選手ではなく自分より少し上の人のものがよい。1100帯なら1300から1500くらいの人を勧めた。神木Cのリプレイは、セットプレイ以外はほとんど真似できないだろう、とした。できなくて萎えてしまう恐れがあるため。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 8646, "head": "中距離は大P・中P・中足で振る", "body": "中距離の立ち回りを聞かれ、中央では大P、中P、中足などの牽制を振り回すのが強いと答えた。直接高いリターンにつながるのは大P。ダウンが取れたら設置につなげる。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】クソデカパフェ食べたからランクマ", "date": "20260702", "duration": 8830}, {"id": "nVJ1B9hi_lA", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。EWCの予選の勝ち上がり計算、コンボのゲージ配分、モダンの各キャラの評価、立ち中Kの強さ、キャミィ対策、レート上げの考え方を話した。終盤は連続ガードが切れるSAの話をした。", "highlights": [{"t": 444, "head": "コンボはODストリボーグでゲージを節約", "body": "コンボの途中でラッシュを使わずODストリボーグで済ませるのは、ゲージ優先、コスパ優先の選択だと答えた。神木Cは大Pからのラッシュにゲージを使うことが多く、コンボ自体はODストリボーグで済ませることが結構ある。", "chars": ["JP"], "themes": ["resource", "combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 1355, "head": "EWC予選の勝ち上がりの数え方", "body": "EWC本戦への予選は128人のトーナメントで、ウィナーズ側のベスト8に行くのに5回の勝利が必要なようだ、と数えた。6回勝てばウィナー側でベスト8に入り、5位以上なので本戦に出られる。初日は上位64まで進む予定で、初日に負ける可能性も十分あるとした。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["大会"]}, {"t": 2642, "head": "モダンは完成度の低いキャラがいる", "body": "初期キャラのモダンは完成度が低いキャラが結構いると話した。追加キャラはモダンにも力を入れて作られているようだ。モダンリリーとモダンルークは完成されている。一方、モダンキンバリー、モダンJP、モダンダルシムは、モダンを使う意味がほとんどないキャラになったのが残念だとした。", "chars": ["JP", "リリー", "ルーク", "キンバリー", "ダルシム"], "themes": ["system"], "side": "jp", "tags": ["解説", "雑談"]}, {"t": 3000, "head": "モダンJPは使う意味がほぼない", "body": "モダンJPはモダンを使う意味がほぼないキャラだと話した。しゃがみ中がなく、JPの強みがほぼ消えている。代わりに得られるのはワンボタンのアムネジアで、対空のアムネジアなどが出せる。マスターやハイマスターまでを目指すならやってよいキャラだが、レジェンドを目標にするならまずクラシックにするよう言わざるを得ない。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["解説", "Q&A"]}, {"t": 4166, "head": "立ち中Kは足元の判定が強い", "body": "立ち中Kは判定が強く当たりやすいのかと聞かれ、先端や中足、下段技への打ち返しに特に強いと答えた。足元の判定が強いので勝ちやすい。小Pだと負けることもあり、先端が届かないこともある。相手の打ち返しが遅れると勝てる。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4496, "head": "キャノンストライクを盾にした飛びがきつい", "body": "キャノンストライク対策を聞かれ、どこまで行ってもきつい技だと答えた。きついのはストライクを盾にした通常飛びで、さらにスカし飛びなどを当てないと本当にきつい。ガードは状況としてきつく、対策というほどのものでもない。遠めなら前大Kが合うことが多い。神木Cもキャミィには今苦労している。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "antiair"], "side": "vs_jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5192, "head": "MRは環境に多いキャラへの勝率が大事", "body": "環境に多いキャラへの勝率が特に大事だという見立てを示した。環境に多いのはJPや、今ならイングリッドだ。MRのことだけを考えるなら、当たらないダルシムの勝率が3割でも全然よい。ただし大会を考えると、それはよくない。", "chars": ["JP", "ダルシム", "イングリッド"], "themes": ["practice", "matchup"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 9756, "head": "連続ガードが切れるSAは少ない", "body": "連続ガードが切れるSAは、ジュリのSA1、マノンのSA2、チュンリーのSA2だけだろう、という見立てを示した。ジュリとマノンのSAは、切れ目にインパクトで割り込めるほどの隙間があるので警戒しなくてよく、切れ目で確定を取るのがよい。マノンのSAをガードしきると、画面端から離れてしまう。", "chars": ["JP", "ジュリ", "マノン", "春麗"], "themes": ["combo", "defense"], "side": "vs_jp", "tags": ["解説", "調整"]}], "title": "【スト6】なんかフランスに行く無職男性ランクマ", "date": "20260701", "duration": 10411}, {"id": "tNI_1RdQb9E", "game": "スト6", "summary": "ランクマ中心の配信で、大半は実況と雑談。コンボの成功率を上げる練習の話と、JPの中Pをガードした後の動きの質問に答えた。", "highlights": [{"t": 202, "head": "コンボの成功率が低く練習中", "body": "最近あるコンボの成功率が低すぎるため、その練習をしていると述べた。しゃがみの時点でボタンを押してしまうのが早く、焦っていたと振り返った。うまくいかないのは実戦で焦る場面だという。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["練習", "リプレイ振り返り"]}, {"t": 651, "head": "JPの中Pをガードした後の動き", "body": "JPの中Pをガードしたら何をすればよいかを聞かれた。中Pを連打してくる相手には、ボタンを押す。ただし中P自体が全キャラ最強の中Pで、ある程度は付き合わざるを得ない、という答えだった。", "chars": ["JP"], "themes": ["matchup", "defense"], "side": "vs_jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】33歳無職男性（既婚・住宅ローン有）ランクマ", "date": "20260630", "duration": 5759}, {"id": "UbimFsDclH0", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。ODアムネジアとOD昇龍の比較、JPミラーが嫌いな理由、アレックスへの対処、早掛けのジャストパリィ、マスター帯手前で停滞するJP使いへの助言を話した。", "highlights": [{"t": 2040, "head": "OD昇龍とODアムネジアの比較", "body": "トータルで見ればOD昇龍のほうがODアムネジアより強いだろうが、ODアムネジアは上振れたときの出力がすごい、という見立て。昇龍は無敵以外の面でも安定した対空技として頼れ、キャンセルラッシュ確定があるのも確実に強い点だ。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["Q&A", "考察"]}, {"t": 2908, "head": "JPミラーが嫌いな理由", "body": "JPミラーは得意苦手以前に嫌いだと答えた。特に遠くでトリグラフを撃ち合う展開が嫌だ。JPミラーにはJPだけができないJP対策が多く、それが気分の悪さにつながりやすい。", "chars": ["JP"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 3609, "head": "アレックスは構えを見て止める", "body": "アレックス対策を聞かれ、構えを見たら積極的にトリグラフやトルバランで圧をかけ、止めていきたいと答えた。コマ投げキャラのため勝ち負けが極端になりやすく、負けるときも派手に負ける。", "chars": ["JP", "アレックス"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 4527, "head": "早掛けにはジャストパリィも見せる", "body": "早掛けにはボタンを押すのも大事だが、同じぐらいジャストパリィを見せられるのも大事だと話した。神木C自身は早掛けのジャストパリィがあまりできておらず、今の課題だと振り返った。", "chars": ["JP"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "振り返り"]}, {"t": 6330, "head": "マスター帯手前のJP使いへの助言", "body": "マスター帯手前で停滞するJP使いの質問に答えた。1200から1500の帯にいたことがなく実感はないと断ったうえで、対空は大事だが、勝てないならコンボの火力が低いか、ボタンを押す場所（有利・不利フレーム）が悪いか、その両方が考えられるとした。本来しゃがみ中Pが当たる場面で小Pで済ませると火力が下がり、読み合いの回数が増えて火力差で負ける。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】多分沼を脱したランクマ", "date": "20260629", "duration": 7497}, {"id": "AOaVhAk3gSw", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。大Kを控える相手、キャンセルラッシュ前大Kからの大ストリボーグ、ODアムネジアへの警戒、大Pラッシュ引き中Pの考え方、フレームの覚え方を話した。終盤にJP対策動画の予告をした。", "highlights": [{"t": 2866, "head": "大Kを控える相手", "body": "大Kを振らない相手がいるか聞かれ、あまりないが、うまい相手には控えめになるかもしれないと答えた。相手が差し返しをよく見ている場合や、マリーザのグラディウスに引っかかると大変なことになる。置き技に大Kが引っかかるとひどい目に遭うキャラには、多少控えめになる。", "chars": ["JP", "マリーザ"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["Q&A", "立ち回り"]}, {"t": 3317, "head": "前大Kからの大ストリボーグが入る相手", "body": "中央でのキャンセルラッシュ前大Kから大ストリボーグが入るのは、横幅の大きいキャラだと答えた。エドモンド本田、ブランカ、ザンギエフだろうという見立てで、マリーザには入らなかった。火力はわずかに上がるだけで誤差の範囲なので、無理に狙わなくてよい。ODトリグラフからトリグラフにつなぐなら、大攻撃から中トルバランを経由するほうが高いとも話した。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 3626, "head": "ODアムネジアへの警戒は共有財産", "body": "ODアムネジアを早めに見せておくべきかという質問に、見せるのも大事だが、他のJPが散々使っているため何もしなくても相手は最初から警戒してくる、と答えた。ODアムネジアが弱いわけではなく、他のプレイヤーのおかげで相手が警戒してくれる利益を受けていると自覚したほうがよい。この警戒はJP全体の共有財産だ。", "chars": ["JP"], "themes": ["defense", "neutral"], "side": "jp", "tags": ["Q&A", "考察"]}, {"t": 5446, "head": "大Pラッシュ引き中Pは使わない", "body": "大Pからラッシュ引き中Pの使い分けを聞かれ、そもそも自分はこの択をやらないと答えた。連続ガードになるためそれ自体では崩れず、シミーもできないので、強い状況ではないという認識。大Pラッシュ周りは少し前に動画にしており、そちらを見るのが早い。", "chars": ["JP"], "themes": ["offense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 6449, "head": "フレームはざっくり覚える", "body": "フレーム関連はざっくり覚えておけばよく、有利・不利フレームを押さえるのが大事だと話した。そのうえで自キャラの確定を調べるとよい。JPなら大Pが確定するか、大Kが確定するか、中Kでないと確定を取れないかといった点だ。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 6751, "head": "土曜公開のJP対策動画の予告", "body": "土曜の12時にJP対策の動画を公開する予定だと予告した。JPのセットプレイ3種類について、JP側の行動と受ける側の行動の択をまとめた内容で、JP戦に困っている人向けだが、JP使いも相手の対応を知れる。", "chars": ["JP"], "themes": ["setplay", "matchup"], "side": "vs_jp", "tags": ["告知"]}], "title": "【スト6】目安1時半ぐらいまでランクマ", "date": "20260626", "duration": 6843}, {"id": "fTLTYUgGTuo", "game": "スト6", "summary": "ランクマで調子を戻そうとする長時間の配信。ODストリボーグとOD設置の使いどころ、立ち回りの大K、遅らせ大ストリボーグの難しさ、ラッシュ後の択、キンバリーの肘への対処を話した。", "highlights": [{"t": 916, "head": "ODストリボーグはコスパがよい", "body": "視聴者に勧められたODストリボーグについて、強いと答えた。コンボからODストリボーグを入れる使い方があり、コスパがよい技だ。神木C自身も、他の人の配信を見るまではうまく使えていなかった。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 1706, "head": "立ち回りで大Kを振るのは強い", "body": "立ち回りで大Kを振るのは強いかと聞かれ、強いと答えた。大Kは相手から差し返しにくく、当たったあとのコンボや派生が多く、削りにも行ける。神木Cの真似をして大Kを振り差し返されたという苦情は受け付けないとも話した。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "立ち回り"]}, {"t": 2009, "head": "遅らせ大ストリボーグは入力が難しい", "body": "遅らせて入れる大ストリボーグは入力が難しく、相当慣れないとミスしやすい。大会のレベルでも大体みんな避けているのではないか、大Pからトリグラフにつなぐ形などで妥協していることが多いだろう、という見立て。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 2930, "head": "大Pパニカン後に前大Kで弾フェイント", "body": "昨日までの不調の中で唯一よかったこととして、大Pがパニッシュカウンターになったとき、飛び道具のフェイントとして前大Kを出せるようになったと話した。ただし今日もできるかは分からない。", "chars": ["JP"], "themes": ["combo", "offense"], "side": "jp", "tags": ["練習", "コンボ"]}, {"t": 2971, "head": "OD設置と通常のトルバランの使い分け", "body": "OD設置を使い始めてから勝てなくなったという悩みに、成長の過程でよくあることで、理由がはっきりしているだけまだよいと答えた。押し込んでいる場面や、相手が画面端から出ようとして飛んだのを落とした後はOD設置のほうが状況がよい。ただし相手がうっかりパリィを張るタイプならトルバランのほうがよいことがほとんどだ。", "chars": ["JP"], "themes": ["setplay", "resource"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 3327, "head": "ラッシュ後は遅らせ投げが多い", "body": "ラッシュの後は、相手が後ろ入れで昇龍拳を出せることから、遅らせたラッシュ投げをすることが多いという見立て。ラッシュ遅らせ大攻撃というパターンもあるが、遅らせ投げがいちばん多い。", "chars": ["JP"], "themes": ["offense"], "side": "jp", "tags": ["Q&A", "起き攻め"]}, {"t": 3706, "head": "OD設置はゲージ2本を使う前提で選ぶ", "body": "OD設置はゲージを2本消費する。そのため、その後の状況でも自分のゲージをよく見る必要があり、トルバランより少し頭を使わなければならないと振り返った。", "chars": ["JP"], "themes": ["resource", "setplay"], "side": "jp", "tags": ["振り返り", "ゲージ管理"]}, {"t": 5607, "head": "キンバリーの肘は大Kで落とす", "body": "キンバリーの飛びからの肘への対処を聞かれ、落とせる距離なら落とすと答えた。肘を大Kで落とせるのが本当はいちばんよく、落とせるとコンボに行けて大きいので頑張りたいが、難しい。届く距離なら前大Kや対空も無難だろう、という見立て。", "chars": ["JP", "キンバリー"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】ランクマ メンシが使えるようになったみたいですよ", "date": "20260625", "duration": 11257}, {"id": "KC4ifg4QEtA", "game": "スト6", "summary": "ランクマ中心の配信。対空が間に合わないときのジャストパリィ対空の考え方、ルークの大Pの強さ、運びたいときのコンボルートの実演を話した。調子が悪い日の振り返りも出た。", "highlights": [{"t": 705, "head": "間に合わない対空はジャストパリィでよい", "body": "対空が間に合わないときのジャストパリィ対空は、MR帯を気にせずいつでも使ってよい。対空はできるだけ落とし、難しそうならジャストパリィで受け、空投げができると強い。JPは空投げと前大Kの対空を使い分けるのが一番で、ジャストパリィ対空はその中でも最初に持っておきたい手札だ。間に合わない対空を無理やり読み合いにできる。", "chars": ["JP"], "themes": ["antiair", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 805, "head": "ルークの大Pは強い", "body": "ルークの大Pは前に大きく踏み込み、ダメージも大きい。モダンルークの強さを支える技で、クラシックでも十分に強いが、モダンルークを使う理由があるのはこの技の影響が大きい。", "chars": ["ルーク"], "themes": ["matchup"], "side": "vs_jp", "tags": ["キャラ対策"]}, {"t": 3033, "head": "弱い日は理由を言えない行動が増える", "body": "調子が悪いときは何も考えずに動いていて、自分の行動をなぜやったのか説明できないパターンが増える気がする、と振り返った。長時間やっているとそれは起きやすくなるだろう、という見立て。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談", "練習"]}, {"t": 4060, "head": "反応の遅さの原因が設定のこともある", "body": "反応が少し遅くなる原因が、モニターやパソコンの設定にあることが意外とあると話した。神木C自身がそれだったという。設定を見直してみるのもよい、という助言だった。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 7472, "head": "JPでリバーサルから持続中段を狙えるか", "body": "ラシードなどがリバーサルから持続の中段でコンボをつなぐ印象があり、JPでもできないかと調べた。相当に頑張ればできるようだが、体感で出すにはあまりにも難しいという。", "chars": ["JP", "ラシード"], "themes": ["defense", "combo"], "side": "jp", "tags": ["練習"]}, {"t": 8098, "head": "運びたいとき用のコンボルート", "body": "画面中央付近から画面端へ運びたいとき用のルートを実演した。通常技と設置を挟んで前へ運ぶ形で、画面端が少し近いときは中設置でなく弱設置にして、大P、中トルバランとつなぐ。インパクトを混ぜながら運ぶ応用ルートは、ダッシュ前大Kの前の歩きの具合が難しく、練習が必要。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["コンボ", "解説"]}], "title": "【スト6】ランクマ 二桁順位にしたい", "date": "20260623", "duration": 10637}, {"id": "-rrXNES3ACw", "game": "スト6", "summary": "ランクマ中心の配信。新しいことの練習の場所、各キャラの大Pの強さ、JPの苦手キャラとサブキャラ、立ち大Kの振りどころの質問、アムネジアの使い方を話した。長時間でインパクトが雑になる反省も出た。", "highlights": [{"t": 1061, "head": "新しいことの練習はランクマ以外で", "body": "最近戦い方を変えたら勝率が下がったという相談に、新しいことをやれば最初は下がるものだと答えた。ランクマで練習するより、カスタムやハブで新しいことをやるときだけ練習するのがよい。新しい課題があるときのハブは有効だが、最近は使えていない。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1485, "head": "各キャラの大Pの強さを比べる", "body": "大Pの性能はJPが全キャラ最強クラスだろう、という見立て。強い大Pの持ち主は、JPとケンが確定で、EDも強い。ルークの大Pはモダンだと下がりながら出せて余計に強い。ジェイミーは強いが方向性が違う。エドモンド本田の大Pも強い。大Pは大体のキャラが強い技だ。", "chars": ["JP", "ケン", "ED", "ルーク", "ジェイミー", "エドモンド本田"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["雑談"]}, {"t": 2081, "head": "ジャンプ中Pは対空が出れば負ける", "body": "JPのジャンプ中Pは判定が強いが、相手が対空技を出せていれば基本負ける。空対空で勝つことと、相手に対空技を出されて負けることは話が全く別で、相手が対空を振っていれば結果は決まっている。", "chars": ["JP"], "themes": ["antiair", "offense"], "side": "jp", "tags": ["解説"]}, {"t": 3784, "head": "ナーフが来ても仕方ないという考え", "body": "JPは強く、キャラへの反発も大きいので、キャラの根底を否定する調整でない限り、ナーフが来ても仕方がないと考えている。過去に大攻撃のドライブゲージ削りが減った調整も、JPはヒット時の削りが強烈なので、ほとんど影響を受けなかったという。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 3939, "head": "苦手キャラとサブキャラの考え方", "body": "JPは尖った性能で、苦手なキャラははっきり苦手になる。ベガ、ケン、EDあたりが苦手で、ベガはキャラの作りの時点で厳しい。通常技で対空するキャラ全般は避けられない宿命で、そうしたキャラへの対応用にサブキャラを1体持っておけるといい。", "chars": ["JP", "ベガ", "ケン", "ED"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 4382, "head": "立ち大Kの振りどころ", "body": "地上の立ち回りで立ち大Kをどう振るかという毎週の質問に、言葉にできず雰囲気で振っていると答えた。目安は、相手が前に出てきそうな場所に置いておくこと。中Pのガード後や投げ抜けの後など、前に出たくなる相手に当たる。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 5697, "head": "アムネジアで上書きできる場面がある", "body": "リプレイで試して、後ろ入れで祈るより、アムネジアなら五分以上で勝てる場面があると気づいた。遅らせて出された大Kは、アムネジアで上書きできるタイミングが多い。ただし打撃でない飛び道具にはどうにもならず、安定させるのは難しく、ミスすると画面端に追い込まれるリスクも大きい。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["リプレイ振り返り", "解説"]}, {"t": 5995, "head": "ジュリ戦はラッシュを引き中Pで止める", "body": "ジュリ戦では、ラッシュを止めるときに引き中Pで止める場面を結構やらなければならないと話した。JPを使う限り、ジュリ戦は永久に課題だという。", "chars": ["JP", "ジュリ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 7336, "head": "マリーザ戦は極端な結果になる", "body": "マリーザ戦は、ものすごい勝ち方をするか、ものすごい負け方をするかの二択になる。アムネジアを読まれると、一度転ばされてアムネジアを出した時点で負けるような終わり方になる。", "chars": ["JP", "マリーザ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 8006, "head": "長時間でインパクトが雑になる", "body": "時間が長くなると雑なインパクトが増えるのはよくない、と振り返った。休憩やトレモを間に挟まないといけないとして、休憩をきちんと挟むようにしていきたいと話した。", "chars": ["JP"], "themes": ["practice", "system"], "side": "jp", "tags": ["雑談", "練習"]}], "title": "【スト6】ランクマ 二桁順位にしたい", "date": "20260622", "duration": 9232}, {"id": "2RL5sSXwv3A", "game": "スト6", "summary": "ランクマ中心の配信。ラッシュから大Kにつなぐ連携が連ガにならない理由、大Pラッシュの強み、大Pトルバランのフェイントでパリィを釣る考え方、ラッシュ中段のパニッシュカウンターからの前大Kを話した。後半はコントローラーの不調でコマンドミスが続いた。", "highlights": [{"t": 467, "head": "大Pや中攻撃からのラッシュ大Kは割り込まれる", "body": "ラッシュ大Kを取り入れたら最速暴れに負けたという話に答えた。大Pや中攻撃からのラッシュ大Kは絶対に連ガにならず、昇龍を持つ相手には昇龍が入る連携なので強くない。しゃがみ中ラッシュをガードの上から入れるのは、相手が昇龍を出せないと踏んだ場合か確認ミス。普通のキャラはしゃがみ中ラッシュ小Pが連ガだが、JPはしゃがみ中が強すぎて連ガを作れない。やるなら大Pからにするとよい。", "chars": ["JP"], "themes": ["offense", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 892, "head": "大Pラッシュは無敵技を打たれにくい", "body": "大Pラッシュ中足が連ガになるほか、大Pラッシュのあとは後ろ入れっぱなしで無敵技をガードできる。このため相手は大Pラッシュに対して無敵技を打ちにくく、JPに有利な状況になる。", "chars": ["JP"], "themes": ["offense", "defense"], "side": "jp", "tags": ["解説"]}, {"t": 3081, "head": "大Pトルバランのフェイントでパリィを釣る", "body": "大Pをガードさせたあとに普通にトルバランを打たない理由を聞かれ、フェイントの狙いを答えた。大Pトルバランのフェイントは、相手が思わずパリィする人ならパリィを釣ってそのまま投げに行ける。パリィする人かどうかの様子見も兼ねて使う。パリィしない人とわかれば、中トルバランなどで普通に打ち、ゲージを削りつつ崩れればよい。", "chars": ["JP"], "themes": ["offense", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 3926, "head": "インパクトの割り込みは読み", "body": "ドライブインパクトでの割り込みを、見てからではなく読みだったと振り返った。キャンセルできない技が来そうだと感じて出したもので、インパクトで割り込めば確定しそうな連携だと考えていた。実際には相手の行動もインパクトだった。相手が普通に大Pを出していたら負けていた。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 4287, "head": "ラッシュ中段のパニカンから前大K", "body": "ラッシュ中段がパニッシュカウンターになると前大Kがつながることに、最近気づいた。火力が上がるので意識したいと話した。ただし先端で当てると前大Kが届かないため、微妙な場面もある。", "chars": ["JP"], "themes": ["combo", "offense"], "side": "jp", "tags": ["コンボ", "解説"]}, {"t": 5353, "head": "インパクトにアムネジアを間に合わせる", "body": "相手のラッシュしゃがみ中Pからのインパクトは、ガードしてしまうとアムネジアで割り込めない。しゃがみ中Pをあえて食らうと、インパクトにアムネジアが間に合うようになる。これを高等テクニックとして紹介した。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["解説"]}, {"t": 5496, "head": "パリィを誘ってしゃがみ中で止める", "body": "1戦目でパリィからラッシュする動きが見えた相手に、トルバランのフェイントでパリィを誘い、しゃがみ中で止める狙いで動いた。パリィを張る相手には大Pトルバランの択がJP有利になりがちで、最終的に何もしない選択が増えるだろう、という見立て。", "chars": ["JP"], "themes": ["offense", "neutral"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】ランクマ V最面白かったっすね～", "date": "20260621", "duration": 6302}, {"id": "QJy4s3alemg", "game": "スト6", "summary": "軽ランクマをしながら視聴者の質問に答えた配信。イングリッドのワープへの対策、裏投げ設置とビームの関係、パリィの難しさ、ガードさせて有利な技とアムネジアの関係を話した。", "highlights": [{"t": 291, "head": "イングリッドのワープへの対策", "body": "視聴者の質問に答えた。ワープは必ず攻撃判定が出るため、基本はジャストパリィがおすすめで、見てから押せるフレームなのでコスパがよい。ミスしても裏目は小さいがリターンも小さい。リターンが欲しいならしゃがみ大Pで、こちらへ来るワープは両方落とせるが、遅れると食らう。インパクトは最もリターンが出るが、外すと終わる。", "chars": ["JP", "イングリッド"], "themes": ["defense", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 624, "head": "裏投げ設置にイングリッドのビーム", "body": "JPの裏投げからの通常設置は、ストックが2つ以上あるイングリッドにはビームが確定するはずで、やってはいけないと話した。JPの裏投げ設置は確定する場面が多いが、取れる人は意外と少ない。相手が取れないと分かれば使い倒してよいが、イングリッドは分かりやすい部類で、取ってくる人が多そうだという見立て。", "chars": ["JP", "イングリッド"], "themes": ["setplay", "matchup"], "side": "jp", "tags": ["解説", "セットプレイ"]}, {"t": 3552, "head": "パリィは思ったより難しい", "body": "他の配信を見て、1300〜1400帯でのJPの制圧力が改めて半端ではないと感じた。パリィしましょうとよく言うが、思ったより難しいらしい。設置されたトルバランのフェイントを意識し続けると、ワープ投げなどを全部食らう。自分はその帯だった時期がなく、脱出法を聞かれても分からないため、実際の対戦を見て何が足りないかを探すしかないと話した。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "", "tags": ["考え方"]}, {"t": 3932, "head": "ガード有利の技はアムネジアでJP有利", "body": "ガードさせて有利になる技は意外と多い。そうした技はアムネジアで取った場合もJP側が有利になるのが大体のところで、例外はその時点では思いつかないと話した。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["解説"]}, {"t": 6871, "head": "イングリッド戦でインパクトを使う案", "body": "イングリッドは立ち回りの牽制に使う技にキャンセルできないものが多いため、インパクトを使うのもありだろうという見立て。ワープへのジャストパリィは意識して練習しないとミスしやすく、ミスするとワープからの読み合いに巻き込まれるため、ガードはしたくないと話した。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策"]}], "title": "【スト6】今日も軽ランクマ　レジェJP", "date": "20260620", "duration": 8075}, {"id": "noiU5hmgPNI", "game": "スト6", "summary": "軽ランクマをしながら視聴者の質問に答える配信。EDは操作が難しいため、かなり上のMR帯までJP有利という見立てとED戦の近づき方、リリー戦でコマ投げ後にアムネジアで割り込む点を話した。", "highlights": [{"t": 1962, "head": "ED戦の見立てと近づき方", "body": "EDは操作が難しく、MR2200〜2300かそれ以上のかなり上の帯まではJP有利だと思う、という見立て。視聴者の質問には、JPの大Pの間合いより少し外側がEDの得意な距離なので、そこからさらに一歩踏み込むのが大事と答えた。大Pからラッシュ小Pの連携は、SAを除いて相手を下げさせられ、EDは歩きが多いため機能しやすい気がするという。", "chars": ["JP", "ED"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5529, "head": "リリーのコマ投げ後はアムネジア", "body": "リリーのコマ投げの後、ラッシュで来る攻めは様子見以外なら通常のアムネジアで割り込める。OD技を使わなくてよいのがポイントで、コマ投げの後にリリーがダッシュで来たらアムネジアを置くと、割のいい読み合いになると話した。", "chars": ["JP", "リリー"], "themes": ["defense", "matchup"], "side": "jp", "tags": ["解説", "キャラ対策"]}], "title": "【スト6】多分軽ランクマ　レジェJP", "date": "20260619", "duration": 5820}, {"id": "rePYufsCK60", "game": "スト6", "summary": "軽ランクマ配信。エドモンド本田の使用を検討していること、ヴァイパー戦の見立て、DJの強さの聞き伝え、インパクトを返した後の運びの使い分けを話した。", "highlights": [{"t": 798, "head": "エドモンド本田の使用を検討", "body": "聞いた話では、エドモンド本田はジュリやジェイミーなどに行けるらしい。JPの補完としては極めて都合がよいのではと考え、本格的に使うことを検討し始めたと話した。", "chars": ["エドモンド本田", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ選択"]}, {"t": 1167, "head": "ヴァイパー戦は不利か", "body": "ヴァイパーをしっかり使っている人は、今はJP戦もヴァイパー有利だと言っている印象がある。神木C自身はそこまでではないと思っている、という見立て。", "chars": ["JP", "C.ヴァイパー"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 3269, "head": "DJは上位キャラに強いらしい", "body": "DJは1年目から強く、今もかなり強い。DJ使いから聞いた話では、環境上位のキャラに対する相性が軒並みよいらしい。上位キャラにだいたい行けるなら相当強いのではと考えつつ、下位のどこかに極端にきついキャラがいるのかもしれない、という見立て。", "chars": ["ディージェイ"], "themes": ["matchup"], "side": "", "tags": ["キャラ評価"]}, {"t": 3441, "head": "インパクト返し後の運びの使い分け", "body": "相手のインパクトを返した後、画面端まで届かない位置からの運びを話した。ゲージを使ってよいなら設置を絡めた運びのルート、使いたくないなら大Pから大ストリボーグのルートがよい。インパクト返しの直後は大Pが入らない場面がある。OD設置を2回使う高火力のルートもあるが、やることが多く実戦ではほとんど使わない。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["解説", "コンボ"]}], "title": "【スト6】軽ランクマ　もしかしたらエドモンド神木", "date": "20260616", "duration": 7395}, {"id": "p71cjrihU5Q", "game": "スト6", "summary": "共演者とチームを組んで出たスト6のチーム戦大会の配信。プール戦を勝ち上がり、プール決勝で敗れた。試合の合間の待ち時間は共演者との雑談が中心だった。", "highlights": [], "title": "【スト6】TOP　熱血通常技対空", "date": "20260614", "duration": 11258}, {"id": "RLq5mM2DSGU", "game": "スト6", "summary": "ランクマをしながら視聴者とやりとりする配信。ベガのODサイコクラッシャーとデビルリバースへの対処を画面を使って解説し、マリーザなど恐怖を与えるキャラとの対戦にも触れた。", "highlights": [{"t": 3338, "head": "恐怖を与えるキャラとの対戦は疲れる", "body": "マリーザやザンギエフは、対戦相手に本能的な恐怖を与えるキャラだ。戦って精神的に疲れるのは当たり前だ、という見立て。イングリッドも同じはずだという。", "chars": ["マリーザ", "ザンギエフ"], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 3621, "head": "ベガのODサイコとデビルリバース対処", "body": "ODサイコクラッシャーはガードすれば有利なので、怖がらずにボタンを押す。遠くから連打してくる相手には垂直ジャンプやバックジャンプを置くと確定が取れることがあるが、近い距離でバックジャンプするとヘルアタックで大きく減る。デビルリバースはナーフで以前ほど横に移動できなくなり、遠めからなら対空でほぼ落とせ、落とせば何でもつながる。", "chars": ["JP", "ベガ"], "themes": ["matchup", "antiair", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】ランクマ　明日はTOP", "date": "20260613", "duration": 7087}, {"id": "aeQXHzc2tzI", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。モダンでC.ヴァイパーを始める相談、モダンとクラシックの違い、イングリッドの強さの見立てを話した。終盤はホンダのコンボトライアルを試して配信を終えた。", "highlights": [{"t": 2742, "head": "モダンのC.ヴァイパーは強いので使えばよい", "body": "モダンでC.ヴァイパーを始めるのはどうか、という視聴者の質問への答え。モダンのC.ヴァイパーは強いので使えばよい。モダンが弱いキャラなら使う意味がないと言うこともあるが、このキャラは使う意味がある。モダンのJPはマスターを目指すだけなら構わないが、JPと比べてキャラパワーは圧倒的に低く、教えられる人も少ない。2000や2100のレジェンドを目指すならやめたほうがよい。", "chars": ["C.ヴァイパー", "JP"], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 3300, "head": "モダンとクラシックは別キャラ", "body": "モダンとクラシックは別キャラという印象で、クラシックと同じ戦い方をして勝手に切れる人が多い。モダンJPで強くなりたい人にまずモダンをやめるよう言わざるを得ない状況は良くないという考えだ。ワンボタンSAなどの強烈な強さはあるが、強さと弱さのバランスは悪く、完璧なシステムではない。", "chars": ["JP"], "themes": ["system", "practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 6810, "head": "イングリッドの強さとJPとの違い", "body": "イングリッドを本キャラにする人は少ないだろうという見立て。そこそこ強いが、リーグに出るプロがキャラを替えるほどの強さは今のところなさそうだという。性質はJPに近くなり、JPより少し簡単だろう。JPを使う人は結局JPでよいという考え。ただしJPはとっつきにくい。", "chars": ["イングリッド", "JP"], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}], "title": "【スト6】愉快なランクマ配信", "date": "20260610", "duration": 8017}, {"id": "S0OM6ixN2K4", "game": "スト6", "summary": "スト6を遊びながら視聴者と雑談する配信。スト6の話は、ワープを多用する相手への見立てが中心。", "highlights": [{"t": 2651, "head": "ワープ多用は実質ダルシムで強くない", "body": "JP戦ではトリグラフに噛み合うワープが鬱陶しいが、やっていることは実質ダルシムと同じで、ダルシム自体が強くないという見立て。相手が何を使っていてもワープは強くなく、なぜみんなやるのか分からない、と疑問を持った。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策"]}], "title": "【スト6】流石に時オカとモンスターズはやりたい男", "date": "20260609", "duration": 6779}, {"id": "qBcQGeJYpLg", "game": "スト6", "summary": "D4CUP後の振り返り配信。リプレイを見ながら勝ちを確定できる場面を逃した試合を検証し、ジャンプ大Pでパリィを釣られた場面、判断ミス、本田を持つ案を話した。", "highlights": [{"t": 757, "head": "事前の研究と違う激早ジャンプ大P", "body": "大会本番で、事前に見ていたリプレイとは相当違う動きをされた。多くの人から対策の話を聞いていたが、激早のジャンプ大Pは事前の情報とまったく違い、あれは本当に無理だったと振り返った。", "chars": ["JP"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 2429, "head": "ヴィーハト後の起爆はワープで負ける", "body": "ヴィーハトの後に起爆を入れると、ワープで負けることがある。ワープはトリグラフにも噛み合い、その読み合いが面倒だと振り返った。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "jp", "tags": ["解説"]}, {"t": 2719, "head": "コンボ後は即インパクトで勝てた", "body": "勝てると見て攻めたが、相手にガードし切られた。最初のコンボが終わった直後に即インパクトを入れていれば勝てていた。無駄な行動を挟んだせいでそのラウンドを落とした、とリプレイを見ながら振り返った。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 3167, "head": "削り切りの判断ミスと遅らせすぎ", "body": "削り切りの判断にミスがあったと振り返った。遅らせようと考えたが、遅らせすぎて投げられた。相手がこの場面で投げてくるタイプだとは思っていなかった。", "chars": ["JP"], "themes": ["resource", "practice"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 3515, "head": "ジャンプ大Pはパリィを釣る狙い", "body": "相手の激早ジャンプ大Pは、ミスではなくパリィを釣るためのわざとの動きだと読んだ。ジャンプ大Pを出している時点で釣りに来ており、釣られないのは不可能で、パリィが多かったところを突かれた、と振り返った。", "chars": ["JP"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 3793, "head": "勝ち確を逃した原因は判断ミス", "body": "この試合は内容が悪くなかったが、勝ちを確定できる場面を逃すことが多かった、と振り返った。ラッシュが出なかった場面もあったが、コマンドミスと言えるのは最後の場面だけで、判断ミスもあったという。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 4062, "head": "寄られたくない気持ちが判断を曲げた", "body": "後から振り返ると、ゲージを使わずに進めたほうが勝率は良かった。ただ、寄られたくないという気持ちが出ており、感情の問題だった。大事な大会でひよる癖が時々出るが、それが出た感じがあった。", "chars": ["JP"], "themes": ["practice", "resource"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 4238, "head": "本田を持つ案", "body": "本田はキャミィやベガと戦えるらしい、という話。ベガはJPでも勝率は悪くないが、普通に戦えば不利だと思うので、本田を持つのは有りだと考えた。本田は頭突きをガードされても構わない点が何よりの強みだ。", "chars": ["エドモンド本田", "ベガ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】D4CUP負け負け終了の雑魚が帰宅──", "date": "20260608", "duration": 8185}, {"id": "qaQSZ0zbKuM", "game": "スト6", "summary": "大会を控えた軽めのカスタム配信。当たりたくないキャラの答え、大Kのヒット確認、練習ステージをランダムにする理由、運びコンボとステージの慣れを話した。", "highlights": [{"t": 731, "head": "当たりたくないキャラの答え", "body": "視聴者の質問に答えた場面。アレックスは多分有利だが、負けるときの負け方がとても嫌で好きではない。ほかにジュリ、ジェイミー、サガットを挙げ、ジェイミーが一番嫌だ。", "chars": ["アレックス", "ジュリ", "ジェイミー", "サガット"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2489, "head": "大Kのヒット確認はほぼしない", "body": "大Kのヒット確認を毎回しているのかという質問に、ほぼしていないと答えた。ガードされてもラッシュを出せば有利だから、という判断だ。", "chars": ["JP"], "themes": ["combo", "offense"], "side": "jp", "tags": ["Q&A"]}, {"t": 6044, "head": "ステージはランダムで練習する", "body": "トレモステージで固定にせず、ランダムで練習している。スト6は相手と自分で見えるものが違うシステムで、オフ大会ではトレモステージが基本禁止なので、固定は後々痛い。禁止の理由は、みんなトレモステージに固定すると見ている側が飽きるからだろう、という見立て。JPは画面端に届くかどうかが大事なキャラなので、普段からランダムで練習するのが大事だと考える。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 6775, "head": "運びコンはステージに慣れて選ぶ", "body": "運びコンボのうちどれが適切かを、ラヴーシュカにつなぐ場面で選ぶには、ステージにしっかり慣れていないと選べない、と話した。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["解説", "コンボ"]}], "title": "【スト6】明日から大阪なので軽めにカスタム", "date": "20260605", "duration": 7340}, {"id": "evpvUg-D5Vk", "game": "スト6", "summary": "カスタムとランクマをしながら視聴者の質問に答える配信。シューティングの意味、しゃがみ中Kなど牽制技を振る意図、画面中央の立ち回りの目標を話した。後半は大会に向けた目標にも触れた。", "highlights": [{"t": 885, "head": "意味のあるシューティングか考える", "body": "シューティングだけで勝てることはあるが、現実には打開が要る。打開は生ラッシュや、大Pなど中距離打撃からのラッシュだ。ゲージ状況を有利にする、自分のゲージを回復する、相手が攻めてくるのを止めて勝つ形にする、のどれかの意味が必要で、互いにゲージも体力も満タンなら相手はガードしてワープだけ落とせばよい。", "chars": ["JP"], "themes": ["neutral", "resource"], "side": "jp", "tags": ["解説", "Q&A"]}, {"t": 3775, "head": "中Kなど牽制技を振る意図", "body": "基本は小銭稼ぎだ。中足は相手の歩きを抑制し、判定の都合で相手の入れ込み技に勝つことがあり、そこからコンボに行ける。中Pはギリギリ届く距離で前歩きを抑制する牽制で、当たってもゲームは終わらない。JPは小技のフレームが強くないので、密着まで押し込まれないためでもある。牽制を当てると相手が飛びたくなり、その飛びを落とせる。", "chars": ["JP"], "themes": ["neutral", "antiair"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 3974, "head": "画面中央の立ち回りの最大のゴール", "body": "最大のゴールは、相手を画面端に固めてトリグラフからセットプレイに行くことだ。自分のゲージ状況が悪く端を背負っているなら、一度相手を遠くに吹っ飛ばし、シューティングでゲージを回復するのがゴールになる。", "chars": ["JP"], "themes": ["neutral", "setplay", "resource"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 5945, "head": "大会は最初の2戦が一番大事", "body": "大会の目標は準優勝以上で、当然優勝もしたい。そのためには最初の2戦が一番大事で、ファイナルまで行けるかどうかが決まる、と話した。ルーザーから上がって準優勝したこともあり、やれないことはないという考え。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談"]}], "title": "【スト6】もう大変カスタム寄りとランクマ", "date": "20260603", "duration": 6507}, {"id": "Mt7OURKQo9Q", "game": "スト6", "summary": "カスタムとランクマを交えた長時間配信。実装直後のイングリッドを相手に、ワープをどう落とすかを視聴者の質問に答える形で話した。ほかにODストリボーグのコスパ、イングリッドとの相性の見立てを語った。", "highlights": [{"t": 426, "head": "イングリッドのワープは基本ジャスパで対応", "body": "イングリッドのワープは必ず攻撃を出すので、ジャスパで対応するのが丸いという考え。しゃが大攻撃なら両方落とせるが、遅れるとワープキックを食らう。インパクトでリターンを狙う手もあるが、後ろワープに釣られると後ろワープビームで大きく食らう。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 1474, "head": "ODストリボーグはコスパがいい", "body": "ODストリボーグを多用する理由は、コスパがいいことだ。ダッシュを使うコンボと違って早くからゲージが回復し始め、使うゲージも2本で済む。", "chars": ["JP"], "themes": ["resource", "combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 2659, "head": "イングリッドとの相性は今は判断しにくい", "body": "イングリッドはワープやビームが雑音として強い一方、開発の余地が大きいキャラだろうから、今の時点では有利不利を感じ取るのは難しいかもしれない、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "patch"], "side": "jp", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】相当カスタム寄りとランクマ", "date": "20260602", "duration": 8465}, {"id": "WsUQFx1OQiA", "game": "スト6", "summary": "ランクマとカスタムの配信。視聴者の質問に答える場面が多く、前大Kの火力、伸び代の考え方、フレームの勉強、アムネジアとバーンアウトの扱い、イングリッドと豪鬼とダルシムの対策を話した。", "highlights": [{"t": 667, "head": "前大Kは火力のメインパート", "body": "前大Kは1年と少し前に強化されて以降、火力の中心になっている。大Pは始動補正が乗ってしまうが、前大Kはそれがないので、コンボの始動に使うと火力が出る。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 1287, "head": "伸び代は地上戦よりコンボの状況別選択", "body": "伸び代についての質問に、コンボだと答えた。地上戦を考えるのは先でよく、差し返しを課題と考えるのはほぼ100%間違いで、マスターからレジェンド帯で伸び代が地上戦の可能性はほぼゼロだという。当たった状況ごとに、運びコンボで画面端を固めるか、相手のゲージが2本ならバーンアウトを狙うか、SAを使うかを選べるようにする。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1595, "head": "フレームの勉強とリプレイ確認", "body": "有利不利のフレームが分からないまま地上戦を考えても進まない。フレーム表で勉強し、負けた場面は自分が遅かったのか不利でボタンを押したのかをリプレイで確かめる。流れで覚えられる人もいるが、前提知識がないなら勉強するのが早い。", "chars": ["JP"], "themes": ["practice", "system"], "side": "", "tags": ["Q&A", "練習"]}, {"t": 1938, "head": "きつい相手の対策は相手に聞くのが早い", "body": "立ち回りできつい相手への対策は、その相手に「何をすれば勝てるか」を聞くのが一番効率的だ。DMで聞くのは怖いという声には、配信のコメントなどで聞くのがいいのではないか、という見立て。", "chars": ["JP"], "themes": ["practice", "matchup"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 2305, "head": "アムネジアを撃つ人は下手、という考えを捨てる", "body": "置き攻めにアムネジアを撃たないとバレると、そこから投げを重ねられて負ける。大足が通るのも、相手がアムネジアを警戒してくれているからだ。リスクとリターンが合っているかを見て使う。撃つ人は下手という精神は捨てた方がよい。", "chars": ["JP"], "themes": ["defense", "offense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2526, "head": "バーンアウト中の凌ぎ方", "body": "バーンアウトになったら凌ぎ方を考える必要がある。インパクトに毎回SAを使う必要はなく、アムネジアで割り込める連携は通常のアムネジアで取る。前に歩くとゲージが回復するので、前に歩いたり中足を使ったりして相手に攻めさせず、距離が取れたら時間を稼ぎつつゲージを回復して、終わりを狙う。", "chars": ["JP"], "themes": ["resource", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2803, "head": "イングリッドの雑なストック貯めはトリグラフで止める", "body": "イングリッドがきついかという質問に、まだ戦えていないが、そこそこやれる部類という感触を話した。雑にストックを貯めに来る相手にはトリグラフで止めやすい。ベガ戦ほど不利にはならないという見立て。ビームは発生18フレームで、見てからのパリィはかなり難しい。", "chars": ["JP", "イングリッド"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2945, "head": "豪鬼は空中の攻撃を対空で落とす", "body": "豪鬼は体力が低いので、火力差で押し切る方針になる。空中から来る攻撃が多く、それを対空で落とせば、ダッシュ前大Kから大ストリボーグまでそのままフルコンボに行ける。対空を大事にしたい相手だ。", "chars": ["JP", "豪鬼"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2994, "head": "ダルシムのワープは見てから小Pか投げ", "body": "ダルシムのワープ連打に勝てないという質問に、見ていれば落とせると答えた。小Pか、個人的にはより投げを勧める。空中のワープなら空投げ、地上なら投げか小Pで、常に落とせるならしゃがみ小Pでもよい。腕を伸ばすジャンプ大Pを振る高さなら空投げ一択だ。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】どちらかと言えばカスタム寄りとランクマ", "date": "20260601", "duration": 6708}, {"id": "uJDuKXzhNOs", "game": "スト6", "summary": "イングリッド実装直後の配信。ワープの落とし方、近距離での中足の振り方、トリグラフ設置コンボがワープで抜けられる点、イングリッドの強さの見立て、大足ガード後の確定反撃を話した。", "highlights": [{"t": 1445, "head": "イングリッドは強いが守りが弱い、という見立て", "body": "イングリッドは強そうだが、受けが弱いので、負けるときに納得感が薄いだろうという見立て。強さの方向性は初期のベガに近く、緩い条件で火力が出る。直近の大会で勝つ必要がなければ、今から使うのはありだと話した。", "chars": ["イングリッド"], "themes": ["matchup", "patch"], "side": "", "tags": ["雑談", "調整"]}, {"t": 2028, "head": "トリグラフ設置コンボはワープで抜けられる", "body": "大ストリボーグからのいつもの設置コンボで、トリグラフの後をイングリッドのワープで抜けられて驚いた。相手がイングリッドのときはこの点を覚えておく必要がある。", "chars": ["JP", "イングリッド"], "themes": ["setplay", "matchup"], "side": "jp", "tags": ["解説", "キャラ対策"]}, {"t": 2542, "head": "イングリッド相手は近距離で中足を振らない", "body": "イングリッドの前大Pを見てジャスパするよりも、前大Pに中足をすかされて死ぬ場面のほうが多発するという話。近距離でJPの中足を安易に振らないようにし、相手が一番やりたい行動に噛み合う動きを避けることが大事だろう、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 3939, "head": "イングリッドのワープはジャスパを狙う", "body": "イングリッドのワープは、ダルシムのテレポやキンバリーのドローンと違い、必ず攻撃判定を出しながら降ってくる。とりあえずジャスパを狙い、目の前に来たのを見てから押す。インパクトは後ろワープに釣られると死ぬだろうから、やらないほうがよいという考え。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 6443, "head": "相手の大足をガードしたら前大Kで確定を取る", "body": "相手の大足をガードしたあとの確定反撃は、キャラ差が大きい。ジェイミーの大足にはJPは前大Kで確定が入る。ベガの大足にも前大Kがたいてい入るが、たまに入らない。中足で済ませがちなので、大足の確定をキャラごとに把握しておくとよい。", "chars": ["JP", "ジェイミー", "ベガ"], "themes": ["combo", "offense"], "side": "jp", "tags": ["解説", "コンボ"]}], "title": "【スト6】さらにランクマ寄りとカスタム", "date": "20260530", "duration": 7519}, {"id": "DKA_Xn9Upv0", "game": "スト6", "summary": "ランクマの配信。イングリッドを使うかどうかと大会での対策、大フラとパリィの考え方、ガイル戦の見立て、スト6の先行きの見立てを話した。", "highlights": [{"t": 56, "head": "イングリッドは固まってから使う", "body": "大会で相手がイングリッドを出してくると困るため、対戦を知らずに当たると爆死するだろう。大会がなければ使っていたが、ある程度研究が固まってから使う方針だ。強いという説が優勢だが受けは弱いと見ており、その弱さがどれだけのマイナスかが焦点になる。", "chars": ["イングリッド"], "themes": ["practice", "matchup"], "side": "", "tags": ["解説", "雑談"]}, {"t": 2604, "head": "大フラはパリィの反射を誘う技", "body": "ルークの強フラッシュナックル（大フラ）は、パリィが染みついた相手でないと技として成立しない。相手をある程度信用したうえで、思わずパリィして対応しきれないレベルだと見込んで打つ技だ。このゲームにはそういう技が多い、と解説した。", "chars": ["ルーク"], "themes": ["system", "neutral"], "side": "", "tags": ["解説"]}, {"t": 5351, "head": "ガイル戦は発売初期のイメージほど不利でない", "body": "ガイル戦はJPが結構有利とされるが、それは発売初期のイメージに引っ張られている面があり、今はガイル側もやれる、という見立て。", "chars": ["ガイル", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 9352, "head": "無印スト6は区切りになる可能性", "body": "ワールドツアーのコンテンツ追加がイングリッドで終わるとなっていたことから、無印のスト6はここで区切りになる可能性があると見た。ウルトラ版のような半新作として出す形も全然ありそうで、調整とキャラクターパスだけでは稼ぎに限りがあるため、という見立て。新作が出たら買う、とも話した。", "chars": [], "themes": ["patch"], "side": "", "tags": ["調整", "雑談"]}], "title": "【スト6】どちらかと言えばランクマ寄りとカスタム", "date": "20260529", "duration": 10800}, {"id": "wbT4DwCPJ6Q", "game": "スト6", "summary": "イングリッド実装直後の配信。コンボトライアルを進め、調整内容を確認し、ランクマをしたあと、イングリッドの通常技を一通り見た。攻めと火力は強そうだが受けは弱そうだ、という評価が中心になった。", "highlights": [{"t": 819, "head": "イングリッドは初期ベガに近い見立て", "body": "聞いた話では、イングリッドは緩めの条件で高い火力が出せ、圧のある確認を揺さぶる技で戦うキャラだという。その話を受けて神木Cは、初期のベガに近いのではないかと見た。", "chars": ["イングリッド"], "themes": ["matchup"], "side": "", "tags": ["解説"]}, {"t": 3416, "head": "投げ抜けのゲージ増加量の調整", "body": "投げ抜けをしたときのドライブゲージの増加量が減った調整を確認した。バーンアウト中に投げ抜けを積極的に狙うのは以前ほど良い選択肢ではなくなり、バーンアウト中の相手に投げを狙う理由も少なくなった、という見立て。", "chars": [], "themes": ["patch", "resource"], "side": "", "tags": ["調整", "解説"]}, {"t": 4205, "head": "大会でイングリッドが出てくるのは嫌だ", "body": "大会の相手がイングリッドを出してくると嫌だと話した。ルール上は使え、期待値もそこそこあるだろう。この強さでまだほとんど誰もまともな対策ができていないことを考えると、大会で脅威になるかもしれない、という見立て。", "chars": ["イングリッド"], "themes": ["matchup", "patch"], "side": "", "tags": ["調整", "雑談"]}, {"t": 4541, "head": "イングリッドの前大Pはヒット確認が余裕", "body": "イングリッドの通常技の性能を確認した。前大Pはヒット確認が余裕で、マジで強いと評価した。小Pは発生が短そうだとも見ていた。このあとも通常技を順に見て回った。", "chars": ["イングリッド"], "themes": ["combo", "neutral"], "side": "", "tags": ["キャラ対策", "解説"]}, {"t": 5169, "head": "大足は強そうだが受けの弱さが焦点", "body": "イングリッドの大足は発生10Fで、長さもあり強そうだと評価した。全体として強そうではあるが、受けが弱いことがどこまで響くかが焦点だろう、という見立て。", "chars": ["イングリッド"], "themes": ["matchup", "neutral"], "side": "", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】軽イングリッド→カスタム", "date": "20260528", "duration": 5363}, {"id": "dhljVsWRWBQ", "game": "スト6", "summary": "ランクマをしながらイングリッドの性能を確かめた配信。JP戦の見立て、垂直から出すソーラーフレアと当て身の評価を話した。翌日の調整でJPが大きく弱体化されないかという見立ても出た。", "highlights": [{"t": 968, "head": "イングリッドよりJPが強そうという見立て", "body": "イングリッドの通常技は弱そうなので、JPのほうが強いだろうと見た。ただし遠距離でJPを完全に封殺できる性能なら話は別で、その場合は他のキャラも突破できない最強キャラになる。そこまでの性能ではないだろう、という見立て。", "chars": ["イングリッド", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 1267, "head": "垂直ソーラーフレアは弾判定ならアムネジアに強い", "body": "イングリッドの垂直から出すソーラーフレアは強そうだと評価した。波動拳で対空できる点はJPより明確に強い。これが弾判定なら、JP戦ではあれを重ねておけばよく、アムネジアへの対策がしやすいキャラになるだろう、という見立て。", "chars": ["イングリッド", "JP"], "themes": ["matchup", "defense"], "side": "vs_jp", "tags": ["キャラ対策", "解説"]}, {"t": 1932, "head": "イングリッドの当て身は性能が微妙", "body": "イングリッドの当て身は、ガードされるとストックも溜まらず弱そうだと評価した。アムネジアより優れる点は確定リターンになることだけで、JP使いがこぞって使いそうな性能とは言いがたい。フレームはいずれ誰かが調べるだろう、とも話した。", "chars": ["イングリッド", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 2739, "head": "明日の調整でJPが大きく弱くなるか", "body": "翌日のアップデートでJPに大きな弱体化が入らないといいが、入らないだろうと見た。JPには最近調整が入ったばかりであり、大きな調整のときは事前に告知があるのが通例で、今回は告知がない、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 2849, "head": "アムネジアは0点か120点の技", "body": "アムネジアは0点か120点を出す技だと整理した。イングリッドの当て身は確定リターンで安定して70点を出すと考えていたが、ガードされることがあると知り、0点か70点の技だと評価を改めた。弱いと感じている。", "chars": ["JP", "イングリッド"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["解説", "雑談"]}, {"t": 6263, "head": "ワープを見てジャストパリィを狙う相手が増えた", "body": "画面端のOD設置攻めで、トリグラフのOD設置後のワープを見てジャストパリィを狙う相手が最近増えた。ワープしても技を振らずに降りる場面もあり、ちゃんと対策されて何をしようかと悩む、と話した。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["セットプレイ", "雑談"]}], "title": "【スト6】軽めにランクマもカスタムもやる", "date": "20260527", "duration": 6655}, {"id": "8LWKOQt_vIU", "game": "スト6", "summary": "ランクマとカスタムを続けながら視聴者の質問に答える配信。テリーとケンへの見方、JPは相手の対策の深さで勝敗が変わるという話、ミスの後のカバーの考え方を話した。", "highlights": [{"t": 3475, "head": "テリーとケンはJPにどう刺さるか", "body": "JPに対してテリーはやれる要素が揃ったキャラだが、ケンはその要素がさらに多いという見立て。テリーは置き攻めのラウンドウェイブが強く、大Pや大K周りも刺さる。ラウンドウェイブは強の弾で、アムネジアでは取れず、ジャストパリィで対処できる。", "chars": ["JP", "テリー", "ケン"], "themes": ["matchup", "setplay"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 8153, "head": "JPは相手の対策の深さで勝敗が変わる", "body": "JPは相手の対策のレベルで全てが変わるキャラだ。対策が浅い相手には足で10割削って倒し切れる。そのぶん相手に求める対策の水準がやたらと高くなり、それが嫌われる理由だという話。", "chars": ["JP"], "themes": ["matchup", "practice"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 10236, "head": "ミスの後のカバーが大事", "body": "コマンドが全く回らず出せなかった場面を受けて、神木Cは知り合いの強い格ゲーマーの名言を挙げた。格ゲーはミスった後が大事で、ミスは避けられないので、ミスの後にいかにカバーするかが重要だ。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談", "考え方"]}], "title": "【スト6】今日もランクマもカスタムもやる", "date": "20260525", "duration": 10465}, {"id": "7Vo4NfgxoFk", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。ダイヤ帯で伸び悩むときの課題の見つけ方、設置の起爆後のODの使い分け、裏投げ後の設置、マリーザ戦のグラディウス、ダルシム戦、アムネジアの読みを話した。", "highlights": [{"t": 946, "head": "ダイヤ帯の課題は他人に見てもらう", "body": "ダイヤ帯から上がれない人は、ほぼ確実に致命的な問題を抱えているので、まずそこを直すのが一番だ。例として、コンボの火力の低さや意味の薄いボタン押しを挙げた。自分で課題を探して「差し返し」と出たなら、ほぼ確実に外れているので、他の人に見てもらうのがよい。ダイヤ帯で差し返しが課題になることはありえないとも述べた。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1953, "head": "小Pを取った後のバックジャンプ", "body": "小Pを取った後に相手が最速でバックジャンプすることはあまりなく、たいてい一発何か出してから動く、という見立て。バックジャンプの空中攻撃に合わせて読みで置くならあり得るだろうとも話した。", "chars": ["JP"], "themes": ["defense", "neutral"], "side": "jp", "tags": ["Q&A", "対策"]}, {"t": 2317, "head": "設置の起爆後はODストリボーグかODトリグラフか", "body": "設置の起爆が当たった後、ODストリボーグとODトリグラフのどちらを使うかの質問に答えた。ODストリボーグ後にトリグラフ設置のほうがフレーム状況はよく、ODトリグラフ後の設置は火力が高い。最大を取る場合は、ODストリボーグのほうが高い。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 2417, "head": "裏投げの後に必ず設置するわけではない", "body": "裏投げの後は必ず設置が正解ではない、という答え。設置は不利を背負い、キャラによっては確定反撃があるので、やってはいけない相手もいる。神木Cがよく選ぶのは裏投げからの設置、ラッシュ中段、ラッシュ中足で、後ろ入れなら無敵技もガードできる。決めの場面では裏投げ後のSAや、歩いて仕切り直す選択もある。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 3672, "head": "マリーザのグラディウスに下段トルバランは割れない", "body": "マリーザ戦で、グラディウスに下段のトルバランを合わせても割れず、痛い反撃を受けた。グラディウスは足元判定の技で割れる仕様だが、トルバランは足元判定ではないため割れない。トリグラフなら割れる。", "chars": ["JP", "マリーザ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 10670, "head": "ダルシム相手のトリグラフはテレポで死ぬ", "body": "ダルシム相手のトリグラフはテレポートで逆に狩られて死ぬため、相手がテレポするタイプならなるべく減らしたほうがよい。直前の場面は、トリグラフ読みのテレポを止め続けて相手がやりにくくなったところで使ったが、それでも最後の一手はほぼ確実にトリグラフを読まれる。空中の相手を落とせる時はジャンプ中攻撃で落とすとコンボにでき、リターンが大きい。フロートが速くなってやりにくくなった。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 11038, "head": "ダルシム戦はテレポを落とすのが最優先", "body": "ダルシム戦で何より大事なのはテレポートを落とすことだ。テレポートが通り続けるなら、それだけやっていれば勝てるからだ。対応が難しいうえ、使い手が少なくて対策が後回しになりやすいため、ダルシムはランクマで強い。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 12149, "head": "アムネジアはここぞという場面で読まれやすい", "body": "アムネジアはここぞという場面で読まれやすい、という指摘に答えた。そういう場面は相手が最も警戒し、アムネジアを一番読みたい場面なので、読まれるのは当然だと話した。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["Q&A", "読み合い"]}], "title": "【スト6】ランクマもカスタムもやる", "date": "20260524", "duration": 13037}, {"id": "Zn4heiO2Pjs", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。大Pラッシュ中足を使う理由、大Pからの仕込みの使い分け、近距離トルバランの使い方、設置の自動起爆後のコンボ、読み合いとフレームの考え方を話した。", "highlights": [{"t": 2912, "head": "全て中ではなく弱弱中にする", "body": "全て中の強さではなく、弱、弱、中の順にすればよいと視聴者に教わった。全て中だと反対側に行ってしまい、できないことがあったため、地味に大きい知識だと受け取った。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["コンボ", "Q&A"]}, {"t": 3170, "head": "空投げが全キャラにないのは不思議", "body": "全キャラに空中投げ（空投げ）がないことへの疑問を話した。空投げの有無はキャラランクに響くと考えており、ほかの対戦ゲームでは全キャラ共通のシステムのはずなのに、ストリートファイターシリーズだけが当然として受け入れているのが不思議だと言った。", "chars": ["JP"], "themes": ["system"], "side": "jp", "tags": ["雑談"]}, {"t": 3488, "head": "見てジャストパリィは釣られやすい", "body": "キャミィの技を見てジャストパリィできるかという話題で、光ったのを確認してから押すことはできなくはないが、そうするとフーリガンコンビネーションに釣られてパリィしてしまうと答えた。", "chars": ["JP", "キャミィ"], "themes": ["defense", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 7944, "head": "大Pラッシュ中足を使う理由", "body": "大Pラッシュ中足の目的を聞かれて答えた。連続ガードかつ下段だからだ。相手が無敵技を狙ってラッシュを見て昇龍などを入力すると前入れになり、下段の中足を食らう。無敵技をガードせずに中足を当てて、コンボで足りる場面ではコスパがよい。連ガなのでドライブゲージも確実に削れる。", "chars": ["JP"], "themes": ["offense", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 8828, "head": "大Pの後はラッシュか弾を仕込む", "body": "大Pからラッシュを仕込む場面と、大Pだけで止める場面の使い分けの質問に、ほとんどどちらかを仕込んでいると答えた。相手に弾抜けのSAがあるときは弾はあまり撃たないようにしており、例としてジュリを挙げた。ドライブゲージが少ないときは大Pラッシュをしない。", "chars": ["JP", "ジュリ"], "themes": ["offense", "resource"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 9160, "head": "近距離のトルバランで相手を釣る", "body": "近距離で撃つトルバランは、嫌がらせとして相手の行動を釣るのに強い。神木Cは、自分が今後頑張るべきポイントだと振り返った。近い距離で撃つことで相手の飛びを釣って落とせる場面もある。", "chars": ["JP"], "themes": ["neutral", "antiair"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 10559, "head": "自動起爆後は弱トルバランを選ぶ", "body": "設置の自動起爆が当たった後のコンボで、中トルバランではなく弱トルバランを選ぶ理由を聞かれた。中トルバランは場合によって外れることがあり、確実に当たる弱トルバランを選ぶことが多い。修正後も外れることはあるという認識だ。ただ引きつけて当てれば当たるので、自分の当て方が浅いだけかもしれないとも話した。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 10796, "head": "切り返しは読み合いになっているかを疑う", "body": "切り返しの読み合いが下手という相談に、最後はじゃんけんになると答えた。ただダイヤ帯などでは、そもそも読み合いになっていない場面が多い。例えば自分が有利フレームなのにアムネジアを出しても、相手がボタンを押すはずがない。相手から見ると意味の分からない場面で暴れているだけかもしれない。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["Q&A", "読み合い"]}, {"t": 11257, "head": "コンボ締めへのアムネジアは意味がない", "body": "ガード中に相手がコンボを入れ込んでいる場面でのアムネジアは意味がない、と答えた。コンボ締めの技は、ほとんどのキャラでガードすれば大きな反撃が入るためだ。例えばキャミィのスパイラルアローはガードしきれば大きく有利になり、大Pからコンボにできる。フレームを勉強するよう助言した。", "chars": ["JP", "キャミィ"], "themes": ["defense", "system"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】まだまだMR溶かしたのでランクマ", "date": "20260523", "duration": 11580}, {"id": "Ebe_1eYUK38", "game": "スト6", "summary": "ランクマを回しながら視聴者の質問に答える長時間配信。JPとC.ヴァイパーの相性、ラヴーシュカのガード練習、アレックス戦の振り返り、アムネジア仕込みのリスクを話した。新キャラ・イングリッドの性能予想や、弱いと言いながらキャラを使うことへの考えも述べた。", "highlights": [{"t": 333, "head": "JP対C.ヴァイパーはどちらが嫌か", "body": "JPはC.ヴァイパーがやりづらいのかという視聴者の質問に答えた場面。ずらしの攻めや起き攻めでアムネジアがちょうど空振りするなどのだるさはあるが、ヴァイパーは受けが弱い。むしろヴァイパー側から見るとJPは相当嫌なはずで、JPを受けに回らせるまでがヴァイパーには大変そうだという見立て。", "chars": ["JP", "C.ヴァイパー"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 964, "head": "ラヴーシュカのガードはトレモで練習", "body": "JPのラヴーシュカをちゃんとガードできるようになりたい、トレモでレコードすればできるようになるか、という視聴者の質問への答え。JP側の動きを覚えさせてレコードし、それをガードする練習を繰り返せばよい。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "vs_jp", "tags": ["Q&A", "練習"]}, {"t": 2859, "head": "弱いと言いながら使うのは好まない", "body": "神木Cは、キャラを弱い弱いと言いながら使う人が好きではない。弱いと思うなら別のキャラを使えばよい、という考えだ。自分は性能を見る前にこのキャラを使うと決めていて、JPが弱いとされた時期にも使っていたと話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談", "考え方"]}, {"t": 3138, "head": "新キャラ・イングリッドとJPの比較", "body": "新キャラ・イングリッドの性能予想。ラッシュが遅く通常技が短いので、遠距離でJPを圧倒できる性能でなければJPのほうが強そうだ。OD当て身は飛び道具を取れて発生1Fだが、トリグラフを取って終わりだろう。SA3の弾抜けはPVの動きから、JPのSA3と似た性能だろう、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["matchup"], "side": "jp", "tags": ["雑談", "キャラ対策"]}, {"t": 3518, "head": "イングリッドは難しい上に弱い可能性", "body": "イングリッドは管理をしながら弾幕を張る必要があり、接近性能があまりないので、強くはないが難しいという見立て。アレックスに続いて、難しい上に弱い最悪のキャラになる可能性がある。JP使いがサブで触っても、頭を使うキャラを2つ使うのは無理だとなりそうな未来が見えると話した。", "chars": ["イングリッド", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["雑談"]}, {"t": 11136, "head": "アレックス戦は自分の理解不足が大きい", "body": "アレックスに負けるときは、相手の技量以上に自分がアレックスをまだ全然分かっていないことが大きい、と振り返った。当たる機会が少ないので、大会で当たるようになってから勉強しようという気持ちになりがち。アレックスの動きを見た瞬間にトリグラフを撃つ読み合いは分かりやすい、という印象。", "chars": ["JP", "アレックス"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}, {"t": 11390, "head": "大Pラッシュにアムネジアを仕込むリスク", "body": "大Pからのラッシュにアムネジアを仕込む話。仕込むこと自体はできるが、その場合は遅らせることができなくなるだろう、という見立て。ミスしてアムネジアが漏れる状況は最低で、目の前で隙をさらすリスクが大きいので、神木Cは仕込んでいない。", "chars": ["JP"], "themes": ["defense", "offense"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】裏でMR溶かしたのでランクマ", "date": "20260522", "duration": 11933}, {"id": "174JxoGAWYs", "game": "スト6", "summary": "約2時間の配信。対戦の最中の反応と雑談が大半で、JPの使い方や対策として言い切れる解説は少ない。", "highlights": [], "title": "【スト6】キャミィラシードガイル舞を厚めに募集", "date": "20260521", "duration": 7125}, {"id": "lD3PDfsalH
