 "トルバランフェイント"], "options": [["ダッシュ投げ"], ["しゃがみ中攻撃"]], "note": "パリィする相手ならパリィを釣って投げに行く。ラッシュしてくる相手にはしゃがみ中攻撃を当てる。パリィしない相手には中トルバランなどで普通に打つ。", "cites": ["{{wsmE7M2oF7M@1041}}", "{{2RL5sSXwv3A@3081}}"]}, {"name": "トルバランフェイントからトリグラフ", "when": "相手がガードを選んだ後", "route": ["トルバランフェイント", "トリグラフ"], "options": [["投げ"], ["ジャンプ攻撃"]], "note": "パリィを釣ってからトリグラフでゲージを削りに来る。パリィしているとわかれば投げに来る。2026年3月の動画。", "cites": ["{{VhKotbb94dI@52}}"]}]}, {"title": "バーンアウト中", "routes": [{"name": "バーンアウト中のトリグラフからの連携", "when": "相手がバーンアウト中", "route": ["トリグラフ", "小P", "トルバラン"], "options": [], "note": "小P、トルバランまで連続ガードになる。見てからSAを撃つのが最善で、SAゲージが1本しかなければ受け入れるしかない。2026年5月と6月の動画。", "cites": ["{{KMrV_6C9Huw@292}}", "{{tpQg36xBmD0@8706}}"]}]}, {"title": "運び・3大P", "routes": [{"name": "画面端が少し近いときの運びルート", "when": "画面中央付近から画面端へ運びたいとき・画面端が少し近い", "route": ["弱設置", "大P", "中トルバラン"], "options": [], "note": "中設置でなく弱設置にする。インパクトを混ぜながら運ぶ応用ルートは、ダッシュ前大Kの前の歩きの具合が難しい。", "cites": ["{{KC4ifg4QEtA@8098}}"]}, {"name": "3大Pヒット後のラッシュ小P", "when": "3大Pがヒットしたとき", "route": ["3大P", "ラッシュ", "小P"], "options": [["バックステップ"], ["投げ"]], "note": "ラッシュ小Pはプラスで、起き攻めにつなげられる。昇龍のないキャラ、特にEDに強い。2026年4月の動画。", "cites": ["{{fpvEhseVtV0@36}}", "{{bhoqYKGAPsA@0}}"]}, {"name": "3大Pヒット後のラッシュインパクト", "when": "ラッシュを見て昇龍や無敵技を出してくる相手", "route": ["3大P", "ラッシュインパクト"], "options": [], "note": "昇龍のないキャラに特に強く、SA3以外のリバーサルは遮れる。昇龍のないキャラがSAで返してくる場合はアムネジアで返せる。2026年4月の動画。", "cites": ["{{fpvEhseVtV0@59}}", "{{bhoqYKGAPsA@11}}", "{{bhoqYKGAPsA@22}}"]}]}, {"title": "ワープ・ラヴーシュカ", "routes": [{"name": "中Pからワープ", "when": "設置があるとき（ラッシュインパクトを狙う相手）", "route": ["中P", "ワープ"], "options": [], "note": "2026年8月の調整後。中P・中足からのキャンセル先に、起爆に加えてワープが加わった。ジャストパリィや無敵技への対応になる。", "cites": ["{{gYHNHkrNd8w@503}}", "{{R5jtd6nJRK4@1380}}"]}, {"name": "中足からワープ", "when": "設置があるとき", "route": ["中足", "ワープ"], "options": [], "note": "2026年8月の調整後。ダッシュインパクトのような行動をしてくる相手に強いはず、という見立て。", "cites": ["{{gYHNHkrNd8w@503}}", "{{R5jtd6nJRK4@1380}}", "{{j7hEDnNDJlQ@140}}"]}, {"name": "ラヴーシュカのパリィ仕込み", "when": "ラヴーシュカの固め", "route": ["小P", "パリィ", "中足"], "options": [], "note": "早すぎるとパリィが出てしまい、遅すぎるとガードできない。焦りすぎないのがコツ。", "cites": ["{{_LIvr7jcqx0@1802}}"]}]}], "reviewed": true}, {"id": "taisaku", "name": "対策", "lead": "動画の対策は、ガードで不利になる技にボタンを押す、確定を取る、ジャストパリィを合わせる、のどれかに落ち着くものが多い。配信では JP がきついキャラとして、ベガ・ジュリ・ジェイミー・ED などが時期ごとに挙がっている。", "sections": [{"title": "ダルシム：テレポを落とし、しびれを切らさない", "body": ["配信では、ダルシム戦で最優先なのはテレポートを落とすことだとしている。テレポートが通り続けるなら、それだけやっていれば勝てるからだ。対応が難しく使い手も少ないので対策が後回しになり、ダルシムはランクマで強い見立てだ。神木Cは「ワープを止める」と3回繰り返している。{{7Vo4NfgxoFk@11038}} {{Xec6eJ-w62w@3950}}", "配信では、ワープは見てから小Pか投げで落とす。空中のワープなら空投げ、地上なら投げか小Pで、常に落とせるならしゃがみ小Pでもよい。腕を伸ばすジャンプ大Pを振る高さなら空投げ一択だ。空中の相手を落とせるときはジャンプ中攻撃で落とすとコンボにできる。{{WsUQFx1OQiA@2994}} {{pe3OwQE-X9E@2284}} {{7Vo4NfgxoFk@10670}}", "配信では、トリグラフにテレポが噛み合うと JP が負けるが、トリグラフを撃つか撃たないかの権利は JP 側にあるとしている。一番大事なのはむかつかないこと、つまりしびれを切らさないことだ。2026年5月12日の配信では、しびれを切らすと絶対に負ける対戦だという実感も出ている。バーンアウト中はダルシム側がトリグラフにワープを噛み合わせたくなる一番の場面で、2026年4月の配信では、この場面を必然ではあったと振り返っている。{{iH2etZNc6zg@3925}} {{-oFFHO-E1OQ@5019}} {{Q-NTE6rpF9o@5270}}", "飛びについては時期で見立てが動いている。2025年12月の配信では、素直に飛んで空振りさせる動きで死ぬことが多く、ジャンプ大Pで突っ込むほうが期待値の高い場面が多いと気づいている。2026年9月の配信でも「結局ダルシムには飛び」としつつ、何も見ていない飛びは落とされやすいとしている。ダルシム使いは個人差が大きく、フェイントを入れる人、ワープを多用する人、全くワープしない人がいる。{{G8UaAD_ZGzo@2353}} {{rK3x2ER651c@549}} {{QTL5e1tPUHA@5628}}"]}, {"title": "イングリッド：ワープは見てジャストパリィ", "body": ["イングリッドのワープは必ず攻撃判定が出る。ガードすると不利になり、キンバリーやダルシムのテレポと違って殴らない選択肢が最初からない。見てジャストパリィをするのが基本で、外しても裏目は小さい。{{NCU2nCTFHWE@0}} {{odGhkR7MFco@53}} {{QJy4s3alemg@291}}", "ワープへのインパクトとしゃがみ大Pは、動画と配信で評価が分かれる。動画（2026年6月7日投稿）では、ワープを見てから対応すれば裏目はないとし、見た瞬間のインパクトは相手が別の動きをすると爆死するので勧めていない。2026年6月の配信では、しゃがみ大Pは両方のワープを落とせるが、遅れるとワープキックを食らうとしている。インパクトは後ろワープに釣られると、後ろワープビームで大きく食らう。2026年10月の配信では、初手に後ろワープを選ぶ相手は基本いないので初手のインパクトは通るという見立ても出ているが、2手目以降はジャストパリィを選ぶことがほとんどだ。{{NCU2nCTFHWE@12}} {{Mt7OURKQo9Q@426}} {{U1N5IuQSEvk@1971}}", "配信では、イングリッド相手に近距離で JP の中足を安易に振らない、としている。前大Pを見てジャスパするより、前大Pに中足をすかされて死ぬ場面のほうが多い。雑にストックを貯めに来る相手にはトリグラフで止めやすい。ビームは発生18フレームで、見てからのパリィはかなり難しい。JP の裏投げからの通常設置は、ストックが2つ以上あるイングリッドにはビームが確定するはずで、やってはいけない。{{uJDuKXzhNOs@2542}} {{WsUQFx1OQiA@2803}} {{QJy4s3alemg@624}}", "相性の見立ては時期で変わっている。2026年5月の配信では通常技が弱そうなので JP のほうが強いだろうとしていた。2026年7月の配信では受けの答えが自分の中に全くなく、ノリでガードしてしまうのがよくないと振り返っている。2026年9月の配信では「普通に有利なんだろうと思いつつ、なんか嫌な気持ちになることは多い」としている。{{dhljVsWRWBQ@968}} {{QTL5e1tPUHA@4021}} {{-sVAWAfLmJ4@3238}}"]}, {"title": "ベガ：デビルリバースは対空で落とし、3大Pは命がけで通す", "body": ["配信では、デビルリバースは空中で落とせるとリターンが一気に上がるとしている。2026年3月の配信では、調整で横に移動しにくくなり、裏回りでパリィや対空を誘う動きがやりにくくなったとしている。2026年7月の配信でも、移動が少なくなったので対空で落としてコンボにつなぐことを大事にしている。2026年10月の配信では、空投げはデビルリバースに負けるのでジャンプ中Pで落とし、同時飛びくらいまでならそのままフルコンボに行けるとしている。{{7TC-ZplMp7c@2370}} {{H-WQjXXkNyk@3177}} {{U1N5IuQSEvk@1683}}", "配信では、ダブルニーはガードしても確定反撃はほとんど取れない。有利ではあるので中攻撃などを振る。リスクを与えるにはバックステップや垂直ジャンプですかす動きが必要で、垂直ジャンプは噛み合えば確定が取れるが、ベガ側も垂直を見て返してくる。バックステップのほうがリスクは低く、上のレート帯ほど垂直を読まれる。{{wsmE7M2oF7M@7238}} {{PMEs-NY-iD8@1782}}", "配信では、ODサイコクラッシャーはガードすれば有利なので、怖がらずにボタンを押すとしている。遠くから連打してくる相手には垂直ジャンプやバックジャンプを置くと確定が取れることがあるが、近い距離でのバックジャンプはヘルアタックで大きく減る。ベガは3大Pをガードすると、距離を問わず確定を取れてゲーム終了になる。動画（2026年4月8日投稿）は、ベガ相手の3大Pは命をかけるつもりで出すとしている。ただしベガ相手は3大Pを通すとこちらが有利になるので、リスクを飲んで出す場面がある。{{RLq5mM2DSGU@3621}} {{fpvEhseVtV0@136}} {{fpvEhseVtV0@191}}", "相性の見立ては時期で食い違う。2026年1月の配信では、ベガはコンセプトの段階で不利で、とんでもない調整が来ない限りきついとしている。2026年4月の配信では、JP とベガは相性の補完がよく、JP ミラーが嫌なときにベガをぶつけられるとしている。2026年5月12日の配信では、ベガは得意で、一番きついのはジュリとしていた。一方、2026年7月の配信ではベガとジュリが一番大変としている。{{CqtlWQkwSbQ@3947}} {{GBiKAIdv4FQ@4952}} {{-oFFHO-E1OQ@6216}} {{H-WQjXXkNyk@2717}}"]}, {"title": "キャミィ：ストライクを盾にした飛びと、置き技の噛み合い", "body": ["配信では、JP 対キャミィは、お互いに自分が不利と感じている組み合わせだ。JP 側はキャノンストライク、通常技の対空、フーリガンが嫌で、キャミィ側は置かれた通常技にストライクが負けて爆死するのが嫌だ。JP にとってはキャラコンセプト上どうしても嫌な相手でもある。{{fZgVDyrd5gM@832}} {{-zCTOtdfbTE@7279}} {{yxaNPHz2auY@5149}}", "配信では、置き技は多めにする。ストライクと噛み合いやすいので、中足や中Kを振りすぎない。たまたま置いていた技にストライクが引っかかることが多い。対空を立ち大Pにしても、ただの前飛びには対空になっていない。{{gTpEBizr3ks@5136}} {{gTpEBizr3ks@5344}}", "ストライクへの対空は、時期で言うことが少し違う。2026年5月の配信では、ストライクは空投げに負けるのでキャミィが飛んだら必ず空投げする意識を持つとよいとしている。2026年7月の配信では、遠めからのストライクには対空が勝ちやすいが見てからは出せず、ストライク対策ではないとしている。ストライクを盾にした通常飛びは、どこまで行ってもきつい。遠めなら前大Kが合うことが多い。{{fZgVDyrd5gM@832}} {{H-WQjXXkNyk@1595}} {{nVJ1B9hi_lA@4496}}", "配信では、弱フーリガンの中段派生にしゃがみ小Pで対応すると負ける。見分けてしゃがみ大Pを出すのが一番よく、最速でなく引きつけて出すのがコツだ。見てジャストパリィしようとすると、フーリガンコンビネーションに釣られてパリィしてしまう。立ち回りの大Kは、見ていれば中Kで差し返せる。{{lD3PDfsalHI@1664}} {{Zn4heiO2Pjs@3488}} {{vn8DB9xIkEU@5252}}"]}, {"title": "ジュリ：歳破衝にジャストパリィ、ラッシュは引き中Pで止める", "body": ["ジュリの突進は、歳破衝のタイミングでジャストパリィをすると大きいリターンが入る。裏目が少ないのが利点だ。暗剣殺に派生した場合はプラス8フレームなので確定が入る。五黄殺の初弾からの歳破衝は連続ガードでパリィが出ないが、唯一の裏目の五黄殺の出し切りはジュリ側がマイナス12を背負うので、普通はやらない。{{F_AiTqOacmU@0}} {{F_AiTqOacmU@11}} {{F_AiTqOacmU@21}}", "配信でも同じ対応が出ている。大暗剣殺で突進して歳破衝まで入れ込んでくる場面では、歳破衝のタイミングでジャストパリィを入れ込むと確定が取れ、ミスしても大きな不利はない。前ステで来る人には、見てからODトルバランで歳破衝を消しつつ当てるが、飛ばれるとフルコンで負けるので相手の傾向を見る。中風破刃はガードさせてマイナス6なので、6フレームで触れる技をとりあえず押しておく。{{B5JTWjBgseo@10487}} {{SCZlskkcv3s@2560}} {{B5JTWjBgseo@9969}}", "配信では、ジュリ戦はラッシュを引き中Pで止める場面を何度もやる必要があるとしている。引き中攻撃は判定が引っ込むので、長い判定で突っ込んでくるジュリのラッシュ中Kを止めやすい。動画（2026年7月14日投稿）はマノンの SA2 の話で、跳ねる部分の隙間にラッシュやインパクトで割り込めるとし、ジュリの SA1 にも同じ対応が使えるとしている。最後までガードしきると削られるだけなので、大きな端コンボを入れる。{{-rrXNES3ACw@5995}} {{H-WQjXXkNyk@2535}} {{9A6i80KhYjw@12}} {{9A6i80KhYjw@23}}", "相性は JP にとって悪い。2026年4月の配信では豪鬼・ジュリ・キャミィのうちジュリが一番難しいとし、2026年5月の配信でも、ED を除くと一番きついのはジュリとしている。2026年9月の配信でも、ジェイミー、ベガ、ジュリの辺りが一番きついとしている。{{oENeZfFwNPg@5024}} {{-oFFHO-E1OQ@6216}} {{8fWBeWhQDKs@7946}}"]}, {"title": "ジェイミー：飲みには確定を取り、受け身を取らない", "body": ["ジェイミーがよくやるぼったくりの飲みは、後ろ投げの飲み、ODの技からの2杯飲み、リバーサルの飲みの3つだ。ジェイミー側の不利は順にマイナス24、マイナス24、マイナス27と大きい。{{GKq1l0eQpko@0}} {{i3rONIDr_9M@52}}", "これらには確定反撃を取れるキャラが多く、JP のようにサーチ技を持つキャラが一番簡単に取れる。ラッシュが使いやすいキャラならラッシュ中足、突進系のSAを持つキャラならそれでもよい。受け身を取ると反撃が届かないので、受け身を取らずに起き上がってから反撃する。{{GKq1l0eQpko@10}} {{GKq1l0eQpko@23}} {{GKq1l0eQpko@34}}", "配信では、立ち回りで、同じ技をいっぱいやってくるジェイミーやベガにバクステを置いておくと、いいことが起こりやすい。ジェイミーに飲まれると対空がきつくなるのは、通常技で対空するキャラの定めで逃れられない。{{8fWBeWhQDKs@4802}} {{3XDxwlJyKOk@8685}}", "相性の見立ては一貫して厳しい。2025年12月の配信では、かなり噛み合わせの悪い部類で、強化が入る可能性のほうが圧倒的に高いとしている。2026年1月の配信では、どんな調整が入っても得意になることは一生ない気がするとしている。2026年6月の配信では、当たりたくないキャラとしてジェイミーが一番嫌だとしている。{{RwhcgxJUps4@11569}} {{CqtlWQkwSbQ@9494}} {{qaQSZ0zbKuM@731}}"]}, {"title": "ED：遅らせ投げが効かず、強い ED には勝てない", "body": ["ED 戦では、いつもの大Pからラッシュして遅らせ投げをする流れが意味を持たない。ED の昇竜は発生13フレームで、遅らせ投げ抜けと昇竜のガードを両立できないので、割り切るしかない。配信では、ED 戦ではアムネジアも合っていないようなものだとしている。{{ff2oYUGxmBQ@7777}} {{_mOPb3s_vtI@281}} {{j0S1QsQLd44@7327}}", "距離と相性の見立ては時期で分かれる。2026年1月の配信では、ED は極まると無理だが極まるまでのハードルが高いので、大半のレート帯では強くないとしている。2026年5月12日の配信では、ED が JP にとって一番きついとしている。2026年6月の配信では、MR2200〜2300かそれ以上のかなり上の帯までは JP 有利とする。JP の大Pの間合いより少し外側が ED の得意な距離なので、そこからさらに一歩踏み込むのが大事だ。{{CqtlWQkwSbQ@3947}} {{-oFFHO-E1OQ@6216}} {{noiU5hmgPNI@1962}}", "配信では、差し返し主体のスタイルで使われると勝てる気がしない。一定以上に強い ED は別キャラのようになり、本当に勝てない。マリーザを使っていたときも、一番無理だと感じたのは ED だった。{{UjeaGpYWGxc@6729}} {{an09SU2JA3A@10332}} {{_LIvr7jcqx0@3499}}"]}, {"title": "ブランカ：遠くで光ったらインパクト", "body": ["ブランカが遠くで光ったらインパクトを入れる。ODローリングを見てからのインパクトは無理に思えるが、この距離では他に見るものがない。理想は強ローリングにジャストパリィ、手前で止まるローリングにボタン押しだが、全部は難しい。遠くで黄色く光ったらインパクトに絞ると、ODローリングで雑に近づかれにくくなる。{{5C-Lhcaaedc@0}} {{5C-Lhcaaedc@10}} {{Zx_-M_fIjjg@1}}", "配信では、近い距離でSA2ゲージのある相手のODロリにインパクトすると、SA2にキャンセルされるので注意する。JP でブランカと戦うときは、ブランカがODロリで接近したがることが多い。エアロリは裏が微妙な距離で当たると確定がなく、ODロリは最低空で当たるとブランカ有利になるので、有利かどうかを見ておく。有利でも必ずボタンを押してよいとは限らず、あえて押さない選択肢もある。{{_LIvr7jcqx0@4278}} {{H1eezSRzVzw@8779}}", "3大Pをガードされると、ブランカはアマゾンリバーランでどんな距離でも確定を取れる。配信では、ブランカ戦は大きく不利でも大きく有利でもなく、五分の印象としている。リバランが JP 戦でかなりいい仕事をする一方、画面端に行った場面や起爆が刺さる場面もちょくちょくある。{{fpvEhseVtV0@115}} {{-oFFHO-E1OQ@6940}} {{ZtF7sNSdFQ4@3275}}"]}, {"title": "キンバリー：疾駆けは一部を除いてボタンで割る", "body": ["キンバリーの疾駆けのうち、暴れつぶしになるのはしゃがみ大からの形と大Pからの形だけだ。ほかの中・大の通常技からの疾駆けは、小Pで割れる。{{LmCHCw2Knm0@0}} {{Zx_-M_fIjjg@77}}", "暴れつぶしの形と光ってきたとき以外は、ボタンを押す。押さなければ永久に押し付けられ続けるので、押さなければいけない。2026年3月の配信では、強化前はしゃがみ大攻撃からの疾駆け以外は全部ボタンを押せばよかったとしている。同じ配信では、ODの疾駆けも暴れつぶしになるという見立てが出ている。{{LmCHCw2Knm0@10}} {{Zx_-M_fIjjg@88}} {{7TC-ZplMp7c@2909}}", "配信では、飛びからの肘は、大Kで落とせるのが本当は一番よく、落とせるとコンボに行けて大きい。届く距離なら前大Kや対空も無難だ。SA2にはトリグラフでなく起爆を使う。トリグラフはSA2の弾無敵が切れた直後に当たる形になり、普通に無敵で負ける。{{fTLTYUgGTuo@5607}} {{MPaucCetMzA@1990}} {{ZtF7sNSdFQ4@2401}}"]}, {"title": "ルーク：大フラッシュナックルにはインパクト、ラッシュ止めは空振りを刺す", "body": ["配信では、ルークの大フラッシュナックルには、見てインパクトが基本だ。SAキャンセルが効くので、相手にSAがあるときは通常技かジャストパリィで止める。うっかりガードしたらドライブリバーサルが確定する。30秒対策としては、大フラにインパクトのボタンを押すのが最善だろうという見立てだ。{{H1eezSRzVzw@8580}} {{V5_ZtjBws9w@6266}}", "配信では、ラッシュ止めを振ってくる相手には、ラッシュ止めの技が全般にとても隙があるので、その空振りを大Pや大Kで刺す。ルークの大Pは前に大きく踏み込みダメージも大きく、モダンだと下がりながら出せて余計に強い。{{wsmE7M2oF7M@5698}} {{KC4ifg4QEtA@805}} {{-rrXNES3ACw@1485}}", "配信では、2026年8月の調整後、ルークとリュウがかなり強そうと見ている。JP にとっては、自身のナーフよりも、元々苦手寄りだったルークの強化が逆風だ。2026年10月の配信では、ランクマで当たる相手がルークとジェイミーに偏っている。{{zAhVM3GijPc@6571}} {{R5jtd6nJRK4@6991}} {{-vxkmHh1WQ8@4382}}"]}, {"title": "アレックス：構えを見てトリグラフ", "body": ["配信では、アレックスは構え中にガードができない。構えが見えて間に合うなら、とりあえずトリグラフを出す。アレックス側には嫌な動きで、インパクトも通りやすい。構えが見えたら積極的にトリグラフやトルバランで圧をかけ、止めていく。{{qNukk4xFZXc@2198}} {{5v6ISmOphzk@1143}} {{UbimFsDclH0@3609}}", "配信では、構え中は、普段よく使う技がほとんど当たらず、中Kやしゃがみ技は当たる。スタンピードには垂直ジャンプを噛み合わせられればよく、これが一番簡単な対処だ。構えからはコマンド投げが出ず通常投げだけで、構えから一部の技を出すと立ちに移行するのでパワーボムが来る可能性がある。{{hQ3PylyyOcY@4401}} {{2-qY9UdbDGw@4163}}", "配信では、アレックスは前に進んだところへ刺さる大Pが強いので、そこに当たる置き技を置けると対処しやすいとしている。勝ち負けが極端で、負けるときはすごい形で壊される。2026年4月の配信では、アレックスは弱いという評価が固まってきているとしつつ、よく分からないまま戦うと普通に負ける嫌なタイプとしている。2026年9月の配信では、破壊力が高く前よりだいぶ強いという感想が出ている。{{evBaj9xQWio@7523}} {{RwBFCqfbtrA@3436}} {{x37Y8lEVE8c@3728}}"]}, {"title": "ケン：迅雷脚の対応を先に覚える", "body": ["バーンアウト中の中迅雷脚は、下段択が連続ガードになっていて、初段止めでもマイナス3フレームだ。何でもよいのでボタンを押しておくと、中段にはパニッシュカウンターが取れ、初段止めには最速でも当たるか相打ちになる。{{zkfXQVg4DTg@0}} {{Zx_-M_fIjjg@22}}", "ただし例外がある。逆迅雷脚は下段択も連続ガードではないので、ボタンを押していると食らう。大迅雷脚は、発生の遅い中Pなどで暴れていると中段に勝てない。技を見分けて、中Pで暴れる、ファジーガードをするなど対応を変える。配信では、迅雷脚への対応は、ケン戦で絶対やっておくべきなのにおろそかになりがちな対策の1位で、レジェンドやプロでも普通に食らうとしている。{{zkfXQVg4DTg@21}} {{Zx_-M_fIjjg@54}} {{iH2etZNc6zg@10970}}", "配信では、ケン戦でトリグラフを撃つのは自殺行為だ。中足キャンセルを見てインパクトを出す対策もあり、キャンセル先が波動拳だと連続ガードになるが、間が空く技ならインパクトが出る。ケンはダッシュが速くトルバランやトリグラフを抜ける択が豊富で、JP にとってメタになるキャラだ。{{iH2etZNc6zg@10558}} {{XY8XQBAvQv0@7435}} {{PQjUs4D0S_A@4765}}"]}, {"title": "ガイル：目の前のブレイドは小足か大足で返す", "body": ["目の前のソニックブレイドを見過ごすと、ガイル側から強い行動をされる。ほぼ全キャラが、小足で見てから余裕で間に合い、ブレイドに当たらずパニッシュカウンターが取れる。強でも弱でも中でもODでも同じだ。{{XiF2VhStumc@0}} {{XiF2VhStumc@11}}", "JP とキンバリーは小足の判定がほとんど前に出ないので、大足で対応する。トレモで検証すると、大足は判定が前に出るキャラが多く、中央では少し後ろに下がってから出す必要がある。どの距離でも楽に出せるのは JP とキンバリーだけで、ザンギエフなどは小Pで反撃するしかなさそうだ。大足なら動かずに見てからブレイドを壊せ、リターンが大きい。{{XiF2VhStumc@22}} {{YDHEoSGwFlg@5780}} {{V5_ZtjBws9w@5082}}", "配信では、JP の弱・中ストリボーグは牽制として使える技ではないとしている。ガードされると、近めの距離ならSA1で確定を取られるキャラが多く、ガイルは距離を問わず確定がある。ガイル、DJ、ブランカのような相手には、中段でしゃがみを解除させる意味がある。その後は無敵技が来なくなり、飛ぶ選択肢が通りやすくなる。ガイル戦は JP が有利とされるが、発売初期のイメージに引っ張られている面があり、今はガイル側もやれるという見立てだ。{{DHwYs05qqek@4998}} {{lD3PDfsalHI@6319}} {{DKA_Xn9Upv0@5351}}"]}, {"title": "C.ヴァイパー：セイスモ後のインパクト、上からの攻撃は無理に落とさない", "body": ["セイスモハンマーをガードした後の対処は、時期で言い方が違う。2026年5月の配信では、ガードしたらすぐドライブインパクトのボタンを押しておくと、相手がセイスモからの攻めをやりにくくなるとしている。2026年7月の配信では、続きの技が出たかを見て、出たときだけインパクトを押すとしている。とても早く押す必要があり、遅れると返される。止まる場面で誤って出すとマイナス3で痛い。{{lD3PDfsalHI@9260}} {{UjeaGpYWGxc@9724}}", "2026年5月の配信では、ずらしの攻めや起き攻めでアムネジアが空振りするだるさはあるが、ヴァイパーは受けが弱いとしている。2026年6月の配信では、ヴァイパーをしっかり使っている人は今は JP 戦もヴァイパー有利という見方だが、神木Cはそこまでではないと見ている。2026年9月の配信では、ヴァイパーが上から足で攻撃してくる動きは頑張って落とそうとしないのがよいとし、ヴァイパー戦は不利とは思わないとしている。{{Ebe_1eYUK38@333}} {{rePYufsCK60@1167}} {{8fWBeWhQDKs@8154}}", "2025年10月の配信では、対策をしないと相当きつく、理解して慣れるまでは延々とやられ続けそうだとしていた。相手を端に追い込めば相当有利になり、ヴァイパーは受けが弱いので一度追い込めば JP が一気に勝てそうだという印象も出ている。動きの速さが大きな理由で、操作が難しく再現しにくいため、相手の連携が分からないタイプのキャラだ。{{74KzYds8YjM@1317}} {{1DaLDs_aFsc@5819}} {{OeFgpUo8gKc@4920}}"]}, {"title": "マリーザ：噛み合えば負けるので、自分からは振らない", "body": ["配信では、マリーザの大Kを中足で差し返すのは相当厳しいとしている。中足は大Kと噛み合っても、ファランクスと噛み合っても負けるので怖い。マリーザ戦は噛み合えば負ける技が多く、自分からは一切技を振らないくらい割り切るほうがよいという考えだ。{{8-mSJY7tMNQ@9292}}", "配信では、グラディウスは足元判定の技で割れる仕様だが、下段のトルバランは足元判定ではないので割れず、痛い反撃を受ける。トリグラフなら割れる。置き技に大Kが引っかかるとひどい目に遭うので、マリーザ相手には大Kを多少控えめにする。{{7Vo4NfgxoFk@3672}} {{AOaVhAk3gSw@2866}}", "配信では、マリーザ戦はものすごい勝ち方をするか、ものすごい負け方をするかの二択になるとしている。アムネジアを読まれると、一度転ばされてアムネジアを出した時点で負けるような終わり方になる。{{-rrXNES3ACw@7336}}"]}, {"title": "サガット：バーンアウト中の固めは立ってガードする", "body": ["バーンアウト中にニー固めやしゃがみ中を連打されたら、立ってガードする。しゃがんでガードするとサガット側がプラス8フレームになるが、立ってガードするとサガット側が不利になり、割り込める。ガードしたあとは下段択が来ないので、そこで立てばよい。{{kgXJu4JUL1s@0}} {{kgXJu4JUL1s@11}} {{i3rONIDr_9M@1}}", "配信では、しゃがみガードのままだと連続ガードになり、サガット側がプラ8で、ドライブゲージを使わずに削られ続ける。立ちガードに替えるとガードした側がプラ1になるので、連携の途中で立ちガードに切り替えれば、削られて負けることはなくなるはずだ。{{qNukk4xFZXc@7658}}", "配信では、中距離のサガットに対しては、見てドライブインパクトやジャストパリィを取れれば一番よいが、現実的には難しいので中Pを置くとしている。差し返しがあると危ないが、そうでなければ多くの技に勝てる。サガットは JP にとってきついキャラかどうかで見立てが揺れている。2026年4月の配信では、世間で言われるほど JP 有利とは感じないとしている。2026年9月の配信では、サガットはそこまでではないとしている。{{eC9U3U3weZ0@1673}} {{8-mSJY7tMNQ@7845}} {{8fWBeWhQDKs@7946}}"]}, {"title": "豪鬼：空中の攻撃を対空で落としてフルコンボ", "body": ["配信では、豪鬼は体力が低く、JP は火力が高いので、火力差で押し切る方針になる。一度崩すとそのまま流れで勝つことが多い。空中から来る攻撃が多く、それを対空で落とせば、ダッシュ前大Kから大ストリボーグまでそのままフルコンボに行ける。{{WsUQFx1OQiA@2945}} {{oENeZfFwNPg@5024}}", "配信では、空対空はジャンプ中Pの先端あたりで落とし、そこからラッシュと大Kでコンボする形をできるようにしておく。遠めの空対空はほぼジャンプ中P、近めはジャンプ中Kと使い分けるのが一番よい。ジャンプ中Kは素当てでコンボに行けるが届く範囲が短く、遠くで当ててフォースダウンを取る狙いならリーチの長いジャンプ中Pが向く。{{H-WQjXXkNyk@2292}} {{oENeZfFwNPg@5279}}", "配信では、一定の距離から波動を連発してくる豪鬼には、むかついて飛ぶのは避ける。飛んでも波動が間に合う。簡単な対処はODトルバランで消すことで、もう一つはジャストパリィから前飛びに行く形だ。一番いけないのは、通常ガードや通常パリィから前飛びして対空で落とされることだ。{{H-WQjXXkNyk@2113}}", "相性の見立ては時期で動いている。2026年1月の配信では、豪鬼は体力の低さが響くので今は戦える相手としている。2026年4月の配信では、豪鬼・ジュリ・キャミィの3キャラとも JP 側がやりづらい組み合わせで、ある程度は仕方がないとしている。2026年7月の配信では、豪鬼は作りからして長く JP にとって最もきついキャラで、発売直後は特に強かったが、豪鬼が弱くなるにつれ JP の火力で押し切れる場面が増えたとしている。{{CqtlWQkwSbQ@3947}} {{oENeZfFwNPg@5024}} {{H-WQjXXkNyk@2717}}"]}, {"title": "舞：SA1後の花蝶扇は、光らなければ小Pを押す", "body": ["画面端でSA1を受けたあとの攻めは、時々ぼったくりになっている。OD技からSA1を発動して溜めてきた花蝶扇は暴れつぶしだが、光らずに来た花蝶扇には小Pが最初から勝つ。直前のコンボルートを見ておき、光っていないところから来たら小Pを押す。見てからでも間に合う。{{zSauC-9QniY@0}} {{zSauC-9QniY@12}} {{i3rONIDr_9M@98}}", "2026年4月の配信でも同じ対策が出ている。直前のコンボに光る技が入っていた場合は暴れつぶしになり、光る技が入っていないなら小Pを最速で押せば勝てる。{{V5_ZtjBws9w@5613}}", "配信では、モダン舞には飛びが危ないとしている。モダンでなくても SA を持っている舞に対しては、やってはいけない行動をしたと振り返っている。2026年4月28日の配信では、プールで当たる相手としては舞とラシードが一番嫌だという見立てが出ている。2025年11月16日の配信では、SFL では舞やベガのカウンターピックが JP の出しにくさにつながっているとしている。{{iOeE6a4i3Hg@3730}} {{iOeE6a4i3Hg@9172}} {{OqBKvk1tCl8@9495}}"]}, {"title": "ラシード：三角飛びは空対空、中足は控えめに", "body": ["配信では、ラシードの三角飛びは、空対空で落とせば大きなリターンが取れる。イーグル・スパイクにはドライブインパクトが入るが、届かないことがあるので、しゃがみ中攻撃から大ストリボーグのほうが安定する。{{YDHEoSGwFlg@4154}} {{bovUPYpqM9k@4772}}", "ラシードは相手が中足をスカしてくるので、中足の打ち返しは控えめにする。ラシード戦は前々からあまり得意ではなく、無限の課題がある。3大Pはほぼ全距離で確定を取られ、本当のど先端でないと命がけになる。{{iOeE6a4i3Hg@11743}} {{fpvEhseVtV0@160}}", "2026年4月の配信では、EVOJ に向けてラシードが一番優先度の高い対策だった。ただし対戦できる相手があまり多くないため、対策しづらいという状況もあった。{{P7lgTe_au9s@4265}} {{PMEs-NY-iD8@215}} {{fQP25E3Ed9s@7820}}"]}, {"title": "エレナ：コロコロの呼び合いと、どの距離でも確定", "body": ["配信では、エレナ戦はダルシム戦に近い。ダルシムがトリグラフにワープを噛み合わせてくるのと同じように、エレナのコロコロを噛み合わされて負ける呼び合いが起きる。トリグラフに相手の転がりが重なって負けるパターンがある。{{Q-NTE6rpF9o@5801}} {{CqtlWQkwSbQ@8939}}", "2026年3月23日の配信では、調整からくるくる回る動きは中Pで適当に止めてもリターンがよくなり、エレナ戦は調整がプラスに働いているという見立てが出ている。一方、2026年4月17日の配信では、エレナ戦は経験不足で、エレナ使いを探す必要があると振り返っている。{{FrmvKucHeSE@6261}} {{Q-NTE6rpF9o@6688}}", "動画（2026年4月8日投稿）は、3大Pをガードされて距離を問わず確定を取られるキャラをブランカ・ベガ・キンバリーとしている。2026年3月29日の配信では、先日の解説でこの3キャラだけとしたのは誤りで、エレナもどんな距離でもODの技で確定を取れると訂正している。食らうとゲームが終わるほどのダメージになる。{{fpvEhseVtV0@115}} {{YDHEoSGwFlg@4897}}"]}, {"title": "テリー：ファイヤーキックからの択はしゃがみ小Pで勝つ", "body": ["中足ターゲットコンボのファイヤーキックからかけられる択は、すべてしゃがみ小Pに負ける。裏目になるのはラッシュだ。ラッシュが見えたらリバーサルが理想だが難しいので、小Pを押しておけばラッシュ以外には勝てる、と割り切る。JP の場合はしゃがみ小Pが強いので、立たなくて大丈夫だ。{{-ec3gJzxTfY@0}} {{-ec3gJzxTfY@11}} {{odGhkR7MFco@1}}", "2026年4月の配信でも、基本は立ち小Pを最速で押すとしている。JP はしゃがみ小Pで十分なので、立ちを挟まなくてよく、考えることが1つ減る。練習は、テリーにファイヤーキックからのクラックシュートとラッシュを覚えさせて試すとよい。{{B5JTWjBgseo@8710}}", "配信では、JP に対してテリーはやれる要素が揃ったキャラだが、ケンはその要素がさらに多いとしている。テリーは置き攻めのラウンドウェイブが強く、強の弾なのでアムネジアでは取れず、ジャストパリィで対処できる。{{8LWKOQt_vIU@3475}}"]}, {"title": "相手は JP の設置セットプレイにこう対応してくる", "body": ["設置の始動で JP の有利不利が変わる。ラッシュからトリグラフまで出して設置すると JP 側が6〜7フレーム不利になり、トルバランの段階で設置すると JP 側が有利になる。JP 不利の設置は、トリグラフから抜けてうまくやれば確定を取れる。JP 有利の設置からトリグラフを出されると、逆に確定を取られる。{{VXe0w9NM7Hg@11}} {{VXe0w9NM7Hg@22}} {{VhKotbb94dI@11}}", "トリグラフOD設置は、投げ、弱ワープからのジャンプ中K、弱ストリボーグの3択だ。このセットが狩れるのは、遅らせ投げ抜け、一部を除く無敵技、前飛びの3つだ。ただの前飛びはワープジャンプ中Kに狩られるが、前飛びしながらめくり技を出すと勝てる。打撃重ねは連続ガードで、このセットで最も減るのは遅らせ投げ抜けを狩られたときだ。{{KMrV_6C9Huw@10}} {{KMrV_6C9Huw@55}} {{KMrV_6C9Huw@68}} {{KMrV_6C9Huw@95}}", "大Pからの通常セットは、投げてもコンボにならないので、投げは捨て気味の択になる。詐欺飛びで JP の有利は続くが、受ける側は投げにそこまで意識を割かなくてよい。痛いのは大Kの直撃で、大Kからは中段と中足が来る。新要素の、大Pから直接ヴィーハトを起爆する連携は暴れ潰しなので、動かずジャストパリィで取れるのが最善だ。{{1NDeURlQ0dE@0}} {{KMrV_6C9Huw@132}} {{KMrV_6C9Huw@156}} {{KMrV_6C9Huw@188}}", "大Pから直接OD設置する連携は、小Pでフレームを消費し、トルバランまで連続ガードになる。ヴィーハトのエフェクトと重なって下段が見にくく、下段が来ることが多い。見た時点で、リバーサルの昇龍を出すか、引きの動作にジャストパリィを狙う。バーンアウト中も同じ連携がトリグラフから始まり、見てからSA3やSA2を撃つのが一番よい。{{KMrV_6C9Huw@233}} {{KMrV_6C9Huw@256}} {{KMrV_6C9Huw@292}}"]}, {"title": "相手は JP のシューティングと大Pラッシュにこう対策してくる", "body": ["トルバランフェイントは、パリィを釣る行動だ。パリィしているとわかれば投げに来るので、うっかりパリィしたらラッシュで逃げる。ワープ投げ・ワープ打撃は、昇竜のような無敵技を持つキャラならラッシュから昇竜で落とせ、難しければワープを見て空投げを狙う。受ける側はパリィをなるべく貼らず、弾の起爆に合わせたジャストパリィのときだけにする。{{VhKotbb94dI@52}} {{VhKotbb94dI@120}} {{VhKotbb94dI@482}}", "トリグラフには、ジャストパリィラッシュで走る手がある。初弾をジャストパリィしていれば、2発目が中トリグラフでも問題なく、密着されれば JP は実質シューティング終了になる。トリグラフを見てからSAを返せるキャラはキャミィ、エドモンド本田、ベガで、JP はそれを非常に嫌がる。弾の張り直しは JP が不利で、マイナス19、OD版でもマイナス9なので、弾をガードし続けて動けないというのは勘違いだ。{{VhKotbb94dI@262}} {{VhKotbb94dI@377}} {{VhKotbb94dI@551}}", "ODトリグラフのガード後に前ステップすると、その後の通常トリグラフが刺さってシューティングが再開する。バーンアウト中はトリグラフ後の前ステップが全キャラ確定になる。JP が最初に即起爆してくることがあるので、即ラッシュはせず、即起爆してくるタイプかを見てからラッシュする。{{VhKotbb94dI@202}} {{VhKotbb94dI@449}} {{VhKotbb94dI@177}}", "大Pラッシュを見て無敵技をガードするなら、最速で入力すると食らうので、ガードを入れながら気持ち遅らせる。タイミングは何度かやって掴むしかなく、無敵技のあるキャラは ED 以外ほぼ全員発生が同じなので、1キャラでできれば ED 以外の全員に使える。投げは JP が走り終わったタイミングで入れる。{{_mOPb3s_vtI@217}} {{_mOPb3s_vtI@248}} {{_mOPb3s_vtI@271}}"]}], "routes": [], "reviewed": true}, {"id": "kangaekata", "name": "考え方", "lead": "神木Cが繰り返し挙げるのは、新しいことの練習はランクマの外でやること、伸びしろは帯ごとにほぼ決まっていること、の2点だ。カウンターやアムネジアなどシステムの理解と、2025年10月から2026年10月までの調整への見立てを、時期順に並べる。", "sections": [{"title": "新しいことはランクマの外で練習する", "body": ["新しいことを試すとレートは下がるので、練習の場はランクマ以外に置く。神木Cは2026年6月22日の配信で、戦い方を変えて勝率が下がった視聴者に、最初は下がるものだとして、カスタムやハブで新しいことをやるときだけ練習するよう勧めた。2026年4月11日の配信でも、ある程度身についたと思えるまでバトルハブ・カスタム・カジュアルにこもるのが望ましいとし、自分はランクマ魔人なのでつい試してしまうと認めている。 {{-rrXNES3ACw@1061}} {{MPaucCetMzA@8933}}", "カスタムの勝ちとランクマの勝ちは別物だ。2026年7月31日の配信では、カスタムでレジェンドに勝てるからレジェンドに行けるという自信は危ないとしている。カスタムの相手は練習や試しをしていることが多く、ランクマとは動きが違うからだ。一方、2026年4月17日の配信では、カスタムでやり込んだキャラにはあまり負けておらず、大会に向けては対策が漏れているキャラを減らすことが大事になるという見立てを示している。 {{JdR_4go3Ihc@4319}} {{Q-NTE6rpF9o@6688}}", "練習の場は目的で選ぶ。2026年11月1日の配信では、練習にはバトルハブのほうが向くとして、中足ラッシュにリバを意識しながらバトルハブで対戦している。2026年4月23日の配信では、特定キャラの対策を積みたいときはカスタムのほうが向くとし、トレモとカスタムだけで強い人もいるが、神木C自身はランクマが好きで、やるほうが強くなると考えている。 {{AUIvAc6QVVk@2972}} {{8-mSJY7tMNQ@6522}}", "練習環境は本番に近づける。ステージはトレモステージに固定せずランダムで練習する。オフ大会ではトレモステージが基本禁止で、JPは画面端に届くかどうかが大事なキャラだからだ（2026年6月5日の配信）。2026年4月28日の配信では、機材を差し直した際にリフレッシュレートが60に戻るなど設定がリセットされ、メニュー画面で分かるほどのラグが出ていた。そのため、垂直同期をオンにして本番に多少近い状態で練習する方針にした。PSの環境で戦ったときに、PCなら相手に確認されて死んでいた場面があったという振り返りもある。 {{qaQSZ0zbKuM@6044}} {{iOeE6a4i3Hg@224}} {{iOeE6a4i3Hg@6032}}"]}, {"title": "リプレイは自分より少し上の人と、自分の負けた試合を見る", "body": ["参考にするリプレイは、最上位の選手ではなく自分より少し上の人のものがよい。神木Cはこれを繰り返し言っている。2026年5月6日の配信ではハイマス帯のJP、2026年5月17日の配信では少し上のレート帯の人を挙げ、極端に上の人は表に出ている動きの裏にどんな読み合いがあるのか分からないとする。2026年7月2日の配信では、1100帯なら1300から1500くらいの人を勧めている。 {{Wr9dUkkfM-g@8682}} {{tpQg36xBmD0@10610}} {{Xec6eJ-w62w@8548}}", "ダイヤ帯のJPは、神木Cの技振りを真似しないほうがよい。2026年3月30日の配信では、コンボは参考にしてよいが、技振りは特殊なので参考にしないほうがよく、コンボの種類を増やすのが一番だとしている。レジェンド帯を見ても意味が分からないことが多く、少し上の人を見るほうが今求められていることが見やすいという。2026年7月2日の配信でも、神木Cのリプレイはセットプレイ以外ほとんど真似できないとし、できなくて萎えてしまう恐れを理由に挙げる。 {{pe3OwQE-X9E@6441}} {{Xec6eJ-w62w@8548}}", "自分のリプレイでは、負けた場面の原因を確かめる。2026年6月1日の配信では、負けた場面は自分が遅かったのか、不利でボタンを押したのかをリプレイで確かめるよう勧めている。2026年9月30日の配信でリプレイを見返した神木Cは、咎められていないだけで垂直ジャンプをしてしまう癖に気づき、前飛びを増やす方向で考えている。2025年10月24日の配信では、リーサルの場面だけでも見直せば、同じ場面が来たときに次はリーサルを取れるようになるので意味があるとしている。 {{WsUQFx1OQiA@1595}} {{Jsg1B-3ogLY@1576}} {{-zCTOtdfbTE@9425}}", "相手のリプレイは、癖と苦しい場面の行動を見るために使う。2026年4月5日の大会の配信では、事前に見ておいた相手のリプレイが大きく効いた試合になった。2026年4月1日の配信では、相手が苦しい場面で何をするかを見ておくことが大事で、設置への起き攻めを全部リバーサルで返してくる相手もいるとする。2026年7月9日の配信では、他のJP使いのプレイは、見る時間があれば対戦してしまうのでほとんど見ないが、大会で当たる相手のリプレイは見るとしている。 {{50Y_VSxPLd4@8727}} {{dqwcwYNCios@859}} {{DHwYs05qqek@9180}}"]}, {"title": "帯ごとの伸びしろはほぼ決まっている", "body": ["ダイヤ帯からマスター手前で止まるときは、コンボ火力と基本の確定を疑う。2026年5月24日の配信では、ダイヤ帯から上がれない人はほぼ確実に致命的な問題を抱えているとし、例にコンボの火力の低さや意味の薄いボタン押しを挙げる。自分で課題を探して差し返しと出たなら、ほぼ確実に外れだ。2025年12月12日の配信では、LPが伸びないのはキャラ対策ではなく、昇竜の確定の取り方といった基本の話だとする。2026年6月29日の配信では、1200から1500の帯にいたことがなく実感はないと断ったうえで、マスター手前の停滞はコンボの火力が低いか、ボタンを押す場所（有利・不利フレーム）が悪いか、その両方が考えられるとする。 {{7Vo4NfgxoFk@946}} {{-3GEkgySYo0@546}} {{UbimFsDclH0@6330}}", "1500〜1600帯では、コンボと確定反撃を固め、セットプレイを少し覚える。2026年9月11日の配信では、JPならコンボの威力や完走率を上げ、セットプレイを1、2個覚えるよう勧めている。キャラ対策は基本いらないが、確定技には確定反撃をきちんと取り、昇龍をガードした後に焦って小Pから入っていないかを見直す。2026年8月24日の配信では、1500帯は発売初期より強い相手が増えたが、たいていコンボが安いとする。 {{8fWBeWhQDKs@9896}} {{SpasYmij-Os@2444}}", "マスターに上がった後は、手札を増やす。2026年7月21日の配信では、セットプレイの知識を入れ、仕上がっていないコンボを詰め、JPはアドリブのコンボが大事なのでアドリブの筋肉をつけるよう勧めている。2026年3月20日の配信では、1800〜2000帯でいちばん大事なのは手札を増やすことだとする。メインどころのセットプレイやコンボでも、上のレート帯まで行ってまだ使えていないものがあるという見立てだ。2026年4月20日の配信では、グラマス・ハイマス帯の伸びしろは、コンボが安い、確定反撃を取れていない、ドライブの管理が微妙、といった点に出るとする。 {{tdyU_8woXj8@348}} {{_LIvr7jcqx0@3837}} {{P7lgTe_au9s@2441}}", "地上戦の差し返しは、この帯の課題にしない。2026年5月17日の配信では、マスターからハイマスを目指すなら差し返しを頑張るのは絶対にやめるべきで、JPで差し返しを気にし出すのはレート2000でも早いとする。2026年6月1日の配信では、伸び代はコンボの状況別選択で、マスターからレジェンド帯で伸び代が地上戦の可能性はほぼゼロだとする。差し返しの手段そのものについては、2026年11月1日の配信で、基本は中攻撃で返し、相手の技によっては大Pのほうがよい場合もあるとしている。 {{tpQg36xBmD0@4386}} {{WsUQFx1OQiA@1287}} {{AUIvAc6QVVk@631}}"]}, {"title": "考えてプレイするとは、行動の理由を言えること", "body": ["考えてプレイするとは、今なぜこの技を振ったのかと問われたときに説明できる状態だ。2026年7月13日の配信では、全部の行動でなくても、特に決まり手になった攻撃に意思があるかが違うとし、怖くて後ろに下がり続けるだけなら何も考えていない状態だとする。2026年5月7日の配信では、意思を持った技振りは何に勝つ技かを理解して振ることで、その技が相手の行動にリスクを負わせられるか、相手がその行動をとる理由がある場面かを見る。2026年6月23日の配信では、調子が悪い日は自分の行動の理由を説明できないパターンが増え、長時間やるとそれが起きやすくなるという見立てだ。 {{gTpEBizr3ks@4776}} {{j0S1QsQLd44@622}} {{KC4ifg4QEtA@3033}}", "読み合いが成立していない場面を疑う。2026年5月23日の配信では、切り返しの読み合いは最後はじゃんけんになるが、ダイヤ帯などではそもそも読み合いになっていない場面が多いとしている。1ラウンド目に一度見せられた相手の行動は、最終ラウンドの最後の一手でも頭に残り、最後はこれをやってくるだろうと意識せざるをえなくなる（2026年5月14日の配信、リュウ戦）。読まれないための方法として、2026年7月31日の配信では、秒数の偶奇のようにタイムカウントで行動を決める方式を挙げ、自分の意思が介在しないので相手に読まれにくいとする。 {{Zn4heiO2Pjs@10796}} {{2-qY9UdbDGw@842}} {{JdR_4go3Ihc@7026}}", "相手ができないことを突き続け、気持ちで判断を曲げない。2026年9月25日の配信では、JPは相手ができないことを見て突き続けるのが非常に大事なキャラで、グラマス・アルマス帯でも必ず穴があるので、当たるならそればかりやるくらいでよいとする。負け方の振り返りには、有利なのに相手の圧に押されて後ろに下がってしまう例（2026年8月18日）がある。2026年6月8日の配信では、大会で寄られたくない気持ちが出て判断が曲がり、後から見るとゲージを使わずに進めたほうが勝率は良かったと振り返っている。 {{uKBhh1Wz8us@3737}} {{OuGmSoPe7e8@9176}} {{qBcQGeJYpLg@4062}}", "簡単な行動を選び、ミスの後に崩れない。2025年12月14日の配信では、簡単なことはミスが少なく再現性が高いのが強みで、どちらでも勝てる状況なら難しい行動をせず簡単なほうを選ぶべきだとする。2026年8月30日の配信でも、リーサルを狙うコンボで大Pを使う難しいルートは安定しないことがあるので、足りそうなら簡単なほうを選ぶとしている。ミスは避けられないので、ミスの後にいかにカバーするかが重要だという知り合いの強い格ゲーマーの名言も紹介している（2026年5月25日の配信）。 {{RwhcgxJUps4@13516}} {{LtVWTrXxfCI@931}} {{8LWKOQt_vIU@10236}}"]}, {"title": "勝率を上げる相手は、当たる頻度で優先順位を付ける", "body": ["勝率の低い相手を上げるのは大事だが、ランクマで多いかどうかも考える。2026年5月20日の配信では、100戦に1回しか当たらないキャラは勝率が低くても考えなくてよいが、JPの勝率が3割ならMRは一生上がらないとしている。2026年7月1日の配信でも、環境に多いキャラへの勝率が特に大事で、MRのことだけを考えるなら当たらないダルシムの勝率が3割でもよいが、大会を考えるとそれはよくないとする。2026年8月18日の配信では、まず当たることが多いキャラへの勝率を上げることが大事だとする。JPの基本の勝ち筋は、ダウンを取って設置し、投げなどで画面端に追い込んでセットプレイにつなげることだ。 {{lD3PDfsalHI@6825}} {{nVJ1B9hi_lA@5192}} {{OuGmSoPe7e8@9665}}", "苦手キャラの勝率には目安がある。2026年5月14日の配信では、苦手キャラがいること自体は普通だが、30〜40%を切るキャラがいるのはまずいとする。試合数を重ねて20〜30%なら、その使い手とカスタムをするなどして克服したほうがいい。きつい相手の対策は、その相手に何をすれば勝てるか聞くのが一番効率的だ（2026年6月1日の配信）。DMで聞くのが怖いなら、配信のコメントなどで聞くのがよい、という見立てだ。 {{2-qY9UdbDGw@7769}} {{WsUQFx1OQiA@1938}}", "相性のきつい相手への対処は、我慢や反復練習になる。2026年1月6日の配信では、どんな調整が入ってもジェイミー戦が得意になることは一生ない気がするとし、JP使いの多くが苦手だろうとする。ダルシム戦は、2025年12月17日の配信で、最近だいぶ形になってきたとしつつ、大事なのは我慢で、少しでも面倒だという気持ちが出ると負けだとする。2026年5月20日の配信では、キャミィの攻めのガードを筋トレ、つまり反復練習の類と位置づけ、ODアクセルスピンナックルは筋トレすればガードできそうな気がするという見立てだ。 {{CqtlWQkwSbQ@9494}} {{G8UaAD_ZGzo@7236}} {{lD3PDfsalHI@2180}}"]}, {"title": "ランクマは短く区切り、沼では続けない", "body": ["長時間のランクマは精度を落とす。2026年7月13日の配信では、一人で長時間続けると手癖だけのプレイになり、苛立って誰にも勝てなくなるとする。MRを上げる目的なら1日1時間、なんなら30分が目安で、1時間か30分ごとに休憩するのが本来はよいとしている。2026年6月22日の配信では、時間が長くなると雑なインパクトが増えるとして、休憩をきちんと挟むようにしたいとする。2026年3月11日の配信では、マリーザを使い始めて日が浅く、後半になるほどコンボの精度も判断も落ちるので長時間は危ないとし、次に負け越したら終えると決めて遊んでいた。 {{gTpEBizr3ks@5658}} {{-rrXNES3ACw@8006}} {{aNb1QNPPKjE@9141}}", "沼にはまったら、その日はやめる。2025年10月22日の配信では、ランクマで沼にはまった時の対処として散歩・運動・睡眠の3点を挙げ、マッサージもよいとする。無限にランクマを回しても基本的にいい結果を生まないので翌日にやるほうがよく、続けるならバトルハブやカスタムにとどめる。2025年12月14日の配信では、ランクが落ちて止まる原因として、コンボミスや、よく分からない場面でのキャンセルラッシュによる自分からのバーンアウトを挙げる。考えるのが面倒になってアムネジアを連発するのもJPではありがちだとする。 {{cDKjxzxuH6k@1916}} {{RwhcgxJUps4@2648}}", "レートの上下は大きく捉えない。2026年3月11日の配信では、1日に100上下するのは誤差で、200動くことも珍しくないとする。200落ちた日は調子が悪かった程度に捉え、300落ちたときに初めて何かやったかもしれないと考える。緊張は大会でも同じで、目標が見えたときや、あと2勝で届くような後がないときに一番強く、逃れられず、みんな通る道だ（2025年12月14日の配信）。待ち時間が空くと崩れやすい面もあり、2026年5月10日の配信では、ウィナーで負けたあとは対戦するより席を外して休憩するほうがよいのかもしれないとしている。 {{aNb1QNPPKjE@2775}} {{RwhcgxJUps4@9449}} {{yxaNPHz2auY@8203}}", "やる気が出ないときは、やらなくてよい。2026年8月30日の配信では、ゲームなのだから気が向いたときにやるもので、大会やプロを目指す目標があるなら別だが、そうでなければ楽しめるときにやればいいとする。目標になる大会がない時期は、レートを上げる以外に無理をしなくてよいという見立てだ。2026年10月7日の配信では、レートを戻せたのは喋りながらやったからで、思考を声に出せたほうが調子が出るという実感を挙げている。 {{3TayBTaG5pY@5129}} {{Itmg-znx9Lg@2714}}"]}, {"title": "大会は初戦と最初の2戦に備え、組み合わせ表は手前まで見る", "body": ["日本の大会は、序盤から相手が強い。2026年10月11日の配信では、WWは1回戦から全力の相手と当たる大会で、トップ8に入るハードルが高いとする。EVO Japan でも初戦か2回戦で2000〜2100帯と当たることが多く、記念参加者が大量にいる本家のEVOと比べて日本の大会は全部ハードルが高いと考えている。2026年4月12日の配信でも、日本の大会は野生のレジェンドが多く、最初のプールから当たる相手の最低レートでもマスターというパターンは十分ありうるという見立てだ。2026年5月10日の配信では、WW #1 は各プールにシードが2人いてプールを抜けた時点でベスト64になる構成で、ウィナー4回戦でそのプールのシード1位と当たる形になった。 {{U1N5IuQSEvk@6794}} {{vn8DB9xIkEU@5011}} {{yxaNPHz2auY@4312}}", "最初の数戦で、ファイナルまで行けるかが決まる。2026年6月3日の配信では、目標は準優勝以上で、そのためには最初の2戦が一番大事だとしている。2026年5月18日の配信では、8人のうち2人になる形なので初戦に勝てるかどうかが非常に大きいとし、初戦の組み合わせが決まったらその相手の対策を最優先で練習する方針を挙げている。1先の大会では、相手を倒す強い意思を持ち、次の相手がプロでも必ずラウンドを取る意思で臨む（2025年12月12日の配信）。 {{evpvUg-D5Vk@5945}} {{PQjUs4D0S_A@7346}} {{-3GEkgySYo0@3214}}", "組み合わせ表は手前まで見て、練習の優先度を決める。2026年4月21日の配信では、初日のベガ戦と次のチュンリー戦までをきちんと見て、大会は思い通りに進まず番狂わせが必ず起きるので、先まで読み込みすぎないとしている。2026年4月20日の配信では、トーナメント表から練習の優先度をラシード、チュンリー、ベガの順と見立て、大会はPS5環境のはずなので見てから対応するような難しい対策は避ける。2026年4月23日の配信では、勝ち上がった場合の道を先まで追うと強い相手ばかりになるが、これは出場者全員に当てはまるとしている。 {{PMEs-NY-iD8@4756}} {{P7lgTe_au9s@4265}} {{8-mSJY7tMNQ@8179}}", "目標と警戒の置き方も決めておく。2026年5月9日の配信では、優勝まであと5勝で、オフの大会に行けるのは準優勝すれば行けるくらいだろうと見て、いったん準優勝を目標にしている。マスターレートの付いていない相手に当たると、ハブを主戦場にしている相手かもしれないと警戒し、ハブは一番怖い場だとする。 {{RzX9IwFcodM@6006}} {{RzX9IwFcodM@11868}}"]}, {"title": "カウンターは出掛かり、パニッシュカウンターは後隙で決まる", "body": ["カウンターは、相手の技の出掛かりを潰したときに出る判定だ。2026年6月25日の動画では、1P側の横に黄色くカウンターの文字が出るとする。有利フレームは一律でプラス2されるので、中足がヒットしたときの有利は通常のプラス3からプラス5になり、通常では入らないコンボが入る。これがカウンター限定コンボの理屈だ。 {{zXlU2ibtKd8@0}} {{zXlU2ibtKd8@12}} {{OB71irQeRhQ@22}}", "パニッシュカウンターは、技の後隙に攻撃が当たったときに成立する。2026年6月25日の動画では、有利フレームはプラス4され、JPではパニッシュカウンターから色々な技がつながるとする。ベガの大Kは膝崩れ、マリーザの大Kは吹っ飛びなど、専用のやられになる技があり、攻撃判定が出ていなくても、JPのヴィーハトなどのワープやダルシムのワープはパニッシュカウンターになる。 {{OB71irQeRhQ@56}} {{OB71irQeRhQ@79}} {{OB71irQeRhQ@69}}", "ラッシュとの関係も押さえる。ラッシュ打撃のプラス4はカウンターの増加分と重なるので、ラッシュカウンターのコンボもある。ラッシュを止めたときは必ずカウンターになり、一部を除く攻撃判定の出ない必殺技もパニッシュカウンターになるものがあって、例としてジェイミーの飲みが挙がる（いずれも2026年6月25日の動画）。2026年5月13日の配信では、JPの中足は通常ヒットで+3、カウンターで+5になり、パニッシュカウンターは+7になるとしている。 {{OB71irQeRhQ@34}} {{OB71irQeRhQ@46}} {{84fijnCF6Io@3471}}", "カウンターとパニッシュカウンターでは、最適な始動が違う。2026年9月6日の配信では、使い分けるのが理想だが難しく、ここで火力が安くなって負けた試合があるので練習するとしている。2026年9月5日の配信では、ガードして不利3フレームで何も確定しないOD技で突っ込んでくる相手に、投げがパニッシュカウンターになった理由を説明している。相手がジャストパリィを狙ってパリィを押したところに投げを入れたからだとする。 {{rK3x2ER651c@5261}} {{x37Y8lEVE8c@1265}}"]}, {"title": "カウンターの確認は表示と音で行い、トレモのランダムで練習する", "body": ["確認の手がかりは人によって違い、自分が一番できるものを選べばよい。2026年6月25日の動画では、画面の表示、音、火花の3つを挙げ、パニッシュカウンターのときの音はかなり派手で、神木Cは主に表示の文字を見る。3つ目は、動画では火花、2026年5月13日の配信では足元の砂煙で、食い違う。2026年5月14日の配信では、砂埃を見る人もいるが、神木Cは砂埃ではほとんどできないとする。 {{OB71irQeRhQ@124}} {{84fijnCF6Io@4024}} {{2-qY9UdbDGw@4386}}", "練習はトレモでガードとヒットをランダムにして行う。2026年6月25日の動画では、実戦は状況確認が入るのでトレモのほうが難しく、トレモで確認できれば実戦でミスしないとする。2026年5月13日の配信でも、ガードとヒットをランダムにしたトレモで確認を100回こなせれば実戦でミスしないだろうという見立てだ。2026年4月24日の配信では、ガードされたら適当にもう1回押し、食らっていたら適当に動き、パニッシュカウンターならコンボに行く手順を挙げる。 {{OB71irQeRhQ@146}} {{84fijnCF6Io@4024}} {{195SUDYWv04@4127}}", "実戦では確認以外の手がかりも使う。実戦では出がかりを潰す当たり方になるため、自分が技を振ったタイミングで相手が何かしていたかという状況確認が半分ほど含まれる（2026年6月25日の動画）。超シビアなヒット確認は体力バーを見るのが昔からの鉄板で、失敗してもガードされたあとに小Pが連続ガードになるので気軽に挑戦できる（2026年7月31日の配信）。中Kはカウンターでもキャンセルできないので、次に何かボタンを押すつもりで動き、カウンターなら弱攻撃、ガードなら中足をもう1発か差し返しの中Kに回す（2026年4月24日の配信）。 {{OB71irQeRhQ@102}} {{JdR_4go3Ihc@6352}} {{195SUDYWv04@2983}}", "確認の失敗には癖がある。2026年4月6日の配信では、ガードランダムのトレモでも確認ミスが多く、特に最悪なのは食らっているのに投げを入れてしまう形で、実戦で決め打ちしてしまっているのが原因だろうという見立てだ。2026年8月15日の配信では、確認の弾からラッシュを仕込む癖は意識するほかないとする。ガードされる前提の技なら入れ込みでよいが、そこそこ当たる可能性がある場面では手を止めて確認するほうがいいとする。パニッシュカウンターを取った場面でだけ技をフェイントに切り替える動きも、実戦では出し切ってしまいがちだと振り返っている（2026年4月5日の配信）。 {{bqB0i_v7M4s@4963}} {{QAR6ElExOhY@1709}} {{V5_ZtjBws9w@4418}}"]}, {"title": "アムネジアは当て身であり、有利フレームやコンボ締めには出さない", "body": ["アムネジアは確定リターンではない当て身だ。2026年5月19日の配信では、小Pを取ると取られた側が有利になって読み合いが再発し、リターンが0になる場合があり、昇龍のように能動的に使えず逆択にしか使えないのが劣る点だとする。一方、投げや持続の長い技を取れば120点級の爆発力が出る。2026年5月16日の配信では、アムネジアは存在しているという事実そのものが強く、ほとんど撃たない相手にも読み合いの選択肢として残るとする。 {{fZgVDyrd5gM@1513}} {{iH2etZNc6zg@4660}}", "昇龍との比較は、場面で分かれる。2025年11月16日の配信では、当て身より無敵技が強いとはアムネジアの場合一概に言えず、昇龍よりアムネジアが強い状況は確かにあるとする。2026年5月6日と2026年6月29日の配信では、トータルでは昇龍のほうが強いとする。昇龍は対空に使え、キャンセルラッシュ確定がある一方、ODアムネジアは上振れたときの出力がすごい。 {{OqBKvk1tCl8@8884}} {{Wr9dUkkfM-g@8542}} {{UbimFsDclH0@2040}}", "出してはいけない場面がある。2026年5月6日の配信では、アムネジアの成功率が低い原因は、自分が先に動ける有利フレームの場面で、相手がボタンを押す確率がゼロなのに出しているからだろうとする。2026年5月23日の配信では、相手がコンボを入れ込んでいる場面でのアムネジアは意味がなく、コンボ締めの技はほとんどのキャラでガードすれば大きな反撃が入るとして、フレームの勉強を勧めている。ここぞという場面は相手が最も警戒する場面なので、読まれるのは当然だ（2026年5月24日の配信）。 {{Wr9dUkkfM-g@8542}} {{Zn4heiO2Pjs@11257}} {{7Vo4NfgxoFk@12149}}", "アムネジアの扱いは、時期ごとに見方が違う。2026年6月22日の配信では、後ろ入れで祈るより、遅らせて出された大Kはアムネジアで上書きできるタイミングが多いと試して気づいた。ただし飛び道具にはどうにもならず、ミスすると画面端に追い込まれるリスクも大きい。2026年8月4日の配信では、調整後のJPは前ほどアムネジアに頼れなくなり、リバーサルと投げ読みのバックの重要度がかなり上がったとする。2026年9月30日の配信では、リプレイを見て、勝てなくなるとアムネジア以外をしなくなることがあると振り返っている。 {{-rrXNES3ACw@5697}} {{JljSmBPaBfM@6116}} {{Jsg1B-3ogLY@2212}}"]}, {"title": "パリィは連携の割り込みに使い、インパクトは返す練習を優先し、ゲージは暇な時に見る", "body": ["パリィは、相手の連携への割り込みに使う。2026年7月31日の配信では、連携の途中でジャストパリィを取れるようになると、相手からすると攻めが非常にしづらくなるとする。2026年9月20日の配信では、起き上がりのジャストパリィは、相手が重ねてきた技に合わせて出し、リバーサルの表示が出ていれば大丈夫で、タイミングは感覚で覚える。2026年11月7日の配信では、暴れのジャストパリィは起き攻めの初段を狙うのがいちばんよく、小Pの2段目にも狙えるとかなり強いが、神木C自身もそこはあまりできていない。 {{JdR_4go3Ihc@2637}} {{evBaj9xQWio@2408}} {{8RylXGykVY4@2701}}", "パリィは思ったより難しく、頼りすぎにも注意がいる。2026年6月20日の配信では、パリィしましょうとよく言うが思ったより難しいらしく、設置されたトルバランのフェイントを意識し続けるとワープ投げなどを全部食らうとする。2026年10月23日の配信では、ジャストパリィ対空は強い手段で悪ではないが、全部をそれにするとキャミィやジェイミーのすかし投げを食らい続ける。連続ガードを組むときの小Pにパリィを仕込む技は、やらない理由がなく常にやるべきだ（2026年9月30日の配信）。 {{QJy4s3alemg@3552}} {{ff2oYUGxmBQ@5056}} {{Jsg1B-3ogLY@2332}}", "インパクトは、返す練習がセットプレイの開発より優先だ。2026年8月17日の配信では、変わったセットプレイを作りたくなる気持ちは分かるが、レートを上げたいなら優先度はかなり低く、インパクトを返す練習をしたほうがいいとする。2026年5月12日の配信では、インパクトを返す率は下のランク帯ほど高く、統計上も明確だったとする。調子が悪い時はインパクトとアムネジアが増え、そのインパクトは何も考えていないものだ（2026年7月10日の配信）。 {{mWlneLs90qQ@4797}} {{-oFFHO-E1OQ@9329}} {{H-WQjXXkNyk@3763}}", "ドライブゲージは、暇な時間に見る。2026年4月1日の配信では、ゲージは無限に見たほうがいいほど大事で、コンボを食らっている時とコンボをしている時のやることがない時間に見る。2026年3月17日の配信では、ゲージが6本のままうろうろする場面が多いと指摘し、キャンセルラッシュやOD技など何でもよいのでゲージを使いに行く意識が大事とする。2026年7月21日の配信では、インパクトの後はゲージが少し回復する前歩きが基本で、差は誤差レベルだとしている。 {{dqwcwYNCios@7726}} {{WoW4QU4Dvnk@5410}} {{tdyU_8woXj8@1086}}"]}, {"title": "パリィは専用ボタンを作り、入力の癖を直す", "body": ["パリィとインパクトは、別のボタンに割り当てる。2026年7月17日の配信では、特にパリィのボタンが大事で、神木C自身はパッドの背面のボタンにパリィもインパクトも置き、小指で押している。2026年8月17日の配信では、パリィを同時押しで出している人は専用のパリィボタンを作ったほうがよく、一時的にジャストパリィが出にくくなっても最終的には専用ボタンのほうが120%いいとする。連携を考えるよりジャストパリィを150回練習するよう勧めている。パリィは全ボタンの中で一番押しやすい場所に置き、同時押しをミスして別の技が漏れているなら専用ボタンが必要で、ミスが一切ないなら同時押しのままでよい。 {{0VlxiRZ90F0@3877}} {{mWlneLs90qQ@6580}} {{mWlneLs90qQ@7034}}", "ジャストパリィからのトリグラフは、パッドだと入力が難しい。2026年5月10日の配信では、アケコンを使ったのは1回だけで、真空の入力がうまくできず、まったく合わずにすぐパッドに戻ったとする。2026年5月4日の配信では、ジャストパリィからのトリグラフはパッドだと入力がきつく、レバーレスが一番やりやすいだろうという見立てで、パッドを使う神木Cはジャストパリィのあとはラッシュにしている。2026年8月17日の配信では、JPミラーのトリグラフ、ジャストパリィ、トリグラフはパッドでは相当難しく、レバーレスに移るタイミングとしてはありえなくもないとする。 {{yxaNPHz2auY@322}} {{E7w7piOJGE4@2402}} {{mWlneLs90qQ@8635}}", "入力の細部にも癖が出る。2026年7月2日の配信では、生のドライブラッシュは「前、パリィ、前」と入力すると最速で出て、ゲージは1本で済む。パリィの後に前を入れる入力だと最速で出ず、ゲージを1本より少し余計に使う。2026年8月30日の配信では、十字キーのコマンドは回しすぎるくらいでよいとする。2026年4月9日の配信では、しゃがみ小Pのあとの後ろ入力で別の技が出るのは、スティックだと斜めが漏れやすいからで、斜め下が入らないようにするのが基本だとする。 {{Xec6eJ-w62w@8001}} {{3TayBTaG5pY@6724}} {{hQ3PylyyOcY@2584}}", "コンボの入力は、出終わりを待ち、最速を意識しすぎない。2026年4月10日の配信では、トリグラフの後に続く技はキャンセルではないので、素早く連続で入れると早すぎ、出終わった後に入力するくらいでよい。2026年5月7日の配信では、離し入力をオンにしないとJPで時々コンボが出ないことがあるので、オンで使っている。ラッシュで飛んでしまう現象は1年目から言われていて、治らないのだろうという見立てだ（2026年7月19日の配信）。 {{SCZlskkcv3s@12196}} {{j0S1QsQLd44@7824}} {{ZJXcLmyFz-A@6118}}"]}, {"title": "JPの難しさ、サブキャラ、モダンJPの評価", "body": ["JPの難しさは、手元の忙しさではなく、覚えることと選択肢の多さにある。2025年10月22日の配信では、難しさはC.ヴァイパーのような手元の忙しさではなく覚えることが多い点で、コンボレシピが多いぶん自由度が高いとする。2025年11月16日の配信では、とっさに選ばなければならない場面が多く、選択肢が多いことが強みでもあるが、そのぶん気軽に使うのは難しいとする。2026年8月31日の配信でも、手元が忙しいタイプの難しさではないという感想だ。 {{cDKjxzxuH6k@3165}} {{OqBKvk1tCl8@8688}} {{eC9U3U3weZ0@500}}", "サブキャラは、メインのJPを使いこなしてから持つのが基本線だ。2026年8月7日の配信では、メインのJPを十分にやれていないのにサブキャラを始めるのは、伸びには良くない可能性があるという見立てだ。一方、2026年5月16日の配信では、サブキャラを使ったあとはインパクト返しがしやすくなる実感がある。2026年8月24日の配信では、ほかのキャラから乗り換えるなら取っつきやすいのはベガで、JPは覚えることが多いのが難点だとする。 {{n-Z8lBOOIvw@1455}} {{iH2etZNc6zg@655}} {{SpasYmij-Os@1438}}", "モダンJPは、2026年7月までは使う意味が薄いという評価だった。2026年4月9日の配信では、モダン適性ゼロのキャラはJPで、モダンでは使えなくなる技の影響が大きく、クラシックの攻略がほとんど応用できないという印象で、神木Cはモダンの JP を使っていないため、あくまで印象の話だとする。2026年7月1日の配信では、モダンJPはしゃがみ中がなくJPの強みがほぼ消えるとする。代わりに得られるのはワンボタンのアムネジアで、レジェンドを目標にするならまずクラシックにするよう言わざるを得ないとする。2026年7月6日の配信では、モダンを使う意味がない度合いは全キャラで最上位だと思うとする。 {{hQ3PylyyOcY@5389}} {{nVJ1B9hi_lA@3000}} {{UjeaGpYWGxc@725}}", "2026年8月の調整後は、モダンJPの評価が割れている。2026年8月4日の配信では、普通のコンボが出せるようになったことは分かるが、それだけでモダンのほうが強いと言えるレベルなのかという疑問があるとする。ワンボタンのアムネジアは割り込みが強く守りが強くなる点は認める。2026年8月6日の配信では、モダンは遠距離戦でクラシックより有利で、以前の弱点だったコンボ火力の低さは、今回クラシックとほぼ変わらないコンボが出せるようになり塞がったとする。 {{JljSmBPaBfM@3023}} {{zAhVM3GijPc@3660}}"]}, {"title": "2025年10〜12月の調整：12月の調整に向けた見立てと、調整後の評価", "body": ["2025年10月は、次の調整は大会が終わってからで、大きなナーフは来年6月という見立てだった。2025年10月14日の配信では、あるとしても大きなナーフは来年の6月ではないかとする。2025年10月15日の配信では、次の調整は去年が12月だったことからCPTの予選がすべて終わってからになりそうだとする。2025年10月16日の配信では、ブランカ・JP・舞に変更がなかったことを受け、プレミア大会が全部終わるまでカプコンは調整しないだろうとしている。 {{3XDxwlJyKOk@2445}} {{OeFgpUo8gKc@4335}} {{jn00EZFiNZw@910}}", "10月は大きなナーフは来ないという見立てだったが、2025年11月16日の配信では調整が入る見立てに変わっている。2025年11月16日の配信では、以前の弱体化ではルークのJP対策の強い技が弱くならないままJPの技だけが弱くなったことが大きな被害だったとする。同じ配信では、今はその技が弱くなっているので当時ほどの被害にはならないという見立てだ。調整は少し前の情報で入る傾向があり、今回は普通に弱体化され、その後に強化される去年と同じ流れをやりそうだとする。2025年12月9日の配信では、12月16日の調整でJPがナーフされる確率を70%と見て、弱くするなら火力面だろうとしている。 {{OqBKvk1tCl8@7364}} {{OqBKvk1tCl8@9372}} {{VhPZeZgyPLA@753}}", "2025年12月14日の配信は、調整前の最終的な見立てだ。JPは強化は絶対にないが、ナーフされないこともありうるとし、EDは弱体化されないはずがなく、結果としてJPが泳ぎやすくなることはありうるとする。一番ありそうな弱体は、ヴィーハトが始動で当たると補正がかかるのにコンボ中だと補正がかからない点へのコンボ補正だ。JPは、適当に弱くすると極端に弱いキャラになり、適当に強化するとどこかで極端に強くなるので、調整が難しい。 {{RwhcgxJUps4@6502}} {{RwhcgxJUps4@818}} {{RwhcgxJUps4@7930}}", "2025年12月15日の配信では、調整内容を受けて、EDもブランカも手つかずだったのが予想外で、大した調整は来ないだろうという予想よりさらに小さかったとする。前日の配信ではEDは弱体化されないはずがないと見ていたので、予想が外れた形だ。環境はEDが一つの環境になりそうで、サガットもかなり強いのではないかという見立てを示す。JPに救いはあるかという質問には、ないと答え、JPはただただ弱いキャラで、キャラ替えを推奨する以外に言うことはないとする。 {{Xp4MUMoThdE@1395}} {{Xp4MUMoThdE@539}} {{Xp4MUMoThdE@2339}}"]}, {"title": "2026年3〜5月の調整：3月の調整の評価の揺れと、イングリッド追加前後", "body": ["2026年3月の調整の前は、ナーフを見込む見立てが出ていた。2026年3月11日の配信では、JPに入りそうな調整として、今は始動補正だけの技にコンボ補正が付く調整を予想した。JPは調整次第で極端に振れるキャラで、今のところは強い側を引けているが、大きく弱い側に振れる可能性が怖いとする。2026年3月15日の配信では、EDは確実にナーフ、JPとブランカも多分ナーフで焦点はその程度だと予想し、EVOJまではサガットが最強になるだろうという見立てを示す。 {{aNb1QNPPKjE@1556}} {{aNb1QNPPKjE@3462}} {{DwgQ8uZJIXQ@2880}} {{DwgQ8uZJIXQ@3756}}", "2026年3月17日の配信では、調整後のJPを微ナーフ程度と評価する。中足が伸びたのは強く、調整内容は良いとして、JPは5強からは落ちたが上位3分の1ぐらいには残るという見立てだ。2026年3月21日の配信でも、調整は超強化ではなくナーフだが、軽いナーフ程度で済んだのではないかとする。EDについては、調整後の2026年3月17日の配信で、それほど下げられていないようだという見方を示している。 {{WoW4QU4Dvnk@1424}} {{WoW4QU4Dvnk@3707}} {{gzr5Bd0EwC0@1326}}", "3月の調整への評価は、3月30日の配信で言い方が変わる。2026年3月17日の配信では、トータルではナーフだがいい調整をもらったとする。2026年3月25日の配信では、JPから見てきついキャラはエド・サガット・ベガあたりだという見立てを示す。2026年3月30日の配信では、ブランカとJPがどちらもナーフを受けてブランカのほうが程度が重く、JPはエドとサガットがきつい相手であることが評価を下げるとする。 {{WoW4QU4Dvnk@4475}} {{7TC-ZplMp7c@1818}} {{pe3OwQE-X9E@5298}}", "2026年5月は、イングリッド追加の調整を見据えた見立てが出ている。2026年5月19日の配信では、イングリッド追加の調整で何が来るかが気になり、大きなナーフが来ると対策以前に勝てなくなる可能性があるとする。JPは直前に面白いおもちゃをもらったばかりなので追加の強化はほぼないと見る。JPの技のフレームを変える調整は来ないだろうと見て、ありえるのは火力を下げる調整だとする。2026年5月27日の配信では、翌日のアップデートでJPに大きな弱体化は入らないだろうと見て、大きな調整のときは事前に告知があるのが通例なのに今回は告知がないことを理由に挙げる。2026年5月28日の配信では、投げ抜けをしたときのドライブゲージの増加量が減った調整を確認し、バーンアウト中に投げ抜けを積極的に狙うのは以前ほど良い選択肢ではなくなったとする。 {{fZgVDyrd5gM@65}} {{fZgVDyrd5gM@1124}} {{dhljVsWRWBQ@2739}} {{wbT4DwCPJ6Q@3416}}"]}, {"title": "2026年7〜10月の調整：Year4の調整と、その後の評価", "body": ["2026年7月は、大きなナーフは来ないという見立てと、ヴィーハトの補正という予想が並んでいる。2026年7月2日の配信では、JPの弱体化はヴィーハトの起爆に補正が付いて火力が下がるのが一番ありそうだとする。2026年7月21日の配信では、ストリートファイター6の調整は大きなナーフを入れない方針だとする。1年目の終わりのJPのナーフが過去いちばん大きな調整だっただろうとして、大きなナーフ方向はないのではないかとする。2026年7月31日の配信では、調整前日に、ヴィーハトにコンボ補正が乗ることが一番思いつく弱体だとしている。 {{Xec6eJ-w62w@3696}} {{tdyU_8woXj8@1256}} {{JdR_4go3Ihc@389}}", "Year4の調整では、アムネジアが弱くなり、ワープキャンセルが加わった。2026年8月3日の配信では、アムネジアで投げを取った後はJP側の硬直が4F増えてプラス4になるとする。確定は基本的に小Pだけで、相手が持続投げをきちんと行うと小Pさえ繋がらない場面がある。2026年8月13日の動画でも、最も大事な調整としてアムネジアを挙げ、小Pが限界で、そこからの入れ替えは神木Cも知らず、基本は小Pからコンボにするか前飛びで対応する形になるとする。中Pや中足からのキャンセル先にワープが加わったのは強化ポイントだ（2026年8月3日の配信）。 {{gYHNHkrNd8w@430}} {{j7hEDnNDJlQ@1}} {{gYHNHkrNd8w@503}}", "大Pは弱くなり、弱ストリボーグの判定は前方に広がった。2026年8月13日の動画では、大Pの影縫いが弱くなり、以前はガードに当たっていた場面でも、大Pを空振りさせられたうえに差し返しを食らいやすくなる。2026年8月19日の動画でも、歩きが速いキャラに対して、大Pを透かされて差し返される場面が前よりかなり増えるとする。弱ストリボーグの影縫いは攻撃判定が前方に広がったが、2段目だけ当たる距離では確認が現実的でなく、初段が当たる距離ではキャラによってSAの確定を取られ、ルークはSAで取れる。 {{j7hEDnNDJlQ@24}} {{20Ut1TXnUik@13}} {{j7hEDnNDJlQ@34}}", "調整後のJPは、強い側に残るという見方と、5強レベルではなくなったという見方が並ぶ。2026年8月13日の動画では、総評として、耐えられないという状態ではなく、強い側の位置にいてくれそうだという感触を示している。同じ時期の配信では、2026年8月4日に、調整後のJPは5強レベルではなくなっただろうという見立ても出ている。2026年10月3日の配信では、アムネジアもだが大Pが一番痛いと思うが、それでも上の方のキャラなのは間違いなく、最近リプレイを見直したら、まだやれるかもしれないとする。 {{j7hEDnNDJlQ@153}} {{JljSmBPaBfM@739}} {{7FClbj2dYso@4083}}"]}], "routes": [], "reviewed": true}], "src": {"yX85TjYfcqc": {"title": "【スト6】キンバリー戦の匠 #ストリートファイター6 #スト6", "date": "20261008", "kind": "v"}, "20Ut1TXnUik": {"title": "【スト6/JP】Year4調整で大パンはどう変わったのか【一番痛い】", "date": "20260819", "kind": "v"}, "j7hEDnNDJlQ": {"title": "【スト6/JP】Year4で何が変わった？JPの調整を確認", "date": "20260813", "kind": "v"}, "odGhkR7MFco": {"title": "【スト6】一口対策動画まとめ3【テリー・ジュリ・イングリッド・マノン】", "date": "20260801", "kind": "v"}, "IKr3BxMpj88": {"title": "【スト6】変なテンションでなんか勝つ人", "date": "20260725", "kind": "v"}, "9A6i80KhYjw": {"title": "30秒キャラ対策「マノンのSA2への確定」【スト6】", "date": "20260714", "kind": "v"}, "1NDeURlQ0dE": {"title": "【スト6/JP対策】端のセットプレーへの対応って何するの？", "date": "20260706", "kind": "v"}, "KMrV_6C9Huw": {"title": "【コメントで補足あり】【スト6/JP対策】必須知識！JPのセットプレイ3種とその対応", "date": "20260627", "kind": "v"}, "OB71irQeRhQ": {"title": "【スト6】カウンター・パニッシュカウンターとは/カウンター確認のやり方", "date": "20260625", "kind": "v"}, "z <script>
const D = JSON.parse(document.getElementById("data").textContent);
const THEMES = {system:"システム理解",neutral:"立ち回り・差し合い",antiair:"対空・ジャンプ攻防",setplay:"セットプレイ（設置・起爆）",offense:"攻め・起き攻め",defense:"守り・切り返し",combo:"コンボ・確定反撃",resource:"ゲージ管理",practice:"練習法・上達",matchup:"キャラ対策",patch:"調整"};
const SIDE = {jp:["JP側","k-jp"],vs_jp:["対JP側","k-vs"]};
let side = "", q = "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hms = t => { t = +t; const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
const ymd = d => d ? `${d.slice(0,4)}年${+d.slice(4,6)}月${+d.slice(6,8)}日` : "";
const yt = (id, t) => `https://www.youtube.com/watch?v=${id}&t=${t}s`;
const sideTag = s => SIDE[s] ? `<span class="tag ${SIDE[s][1]}">${SIDE[s][0]}</span>` : "";

// すべてのポイントを1列に
const ALL = [];
D.videos.forEach(v => v.points.forEach(p => ALL.push({...p, src: v, kind: "v"})));
D.lives.forEach(l => l.highlights.forEach(h => ALL.push({...h, src: l, kind: "l"})));
const hit = p => (!side || p.side === side) && (!q || [p.head, p.body, (p.chars||[]).join(" "), p.src.title].join(" ").includes(q));

function ptHTML(p, i, showFrom) {
  const from = showFrom ? `<div class="from">出典：<a href="#/${p.kind === "v" ? "video" : "live"}/${encodeURIComponent(p.src.id)}">${esc(p.src.title)}</a>（${ymd(p.src.date)}）</div>` : "";
  return `<div class="pt" style="animation-delay:${Math.min(i, 12) * 30}ms">
    <a class="ts" href="${yt(p.src.id, p.t)}" target="_blank" rel="noopener" aria-label="${hms(p.t)} から YouTube で見る（新しいタブで開きます）">▶ ${hms(p.t)}</a>
    <div><h3>${esc(p.head)} ${sideTag(p.side)}</h3><p>${esc(p.body)}</p></div>${from}</div>`;
}

// 教科書：出典 {{ID@秒}} を時刻リンクに
function cite(text) {
  return esc(text).replace(/\{\{([\w-]{11})@(\d+)\}\}/g, (_, id, t) => {
    const s = D.src[id] || {title: id, kind: "v"};
    return `<a class="cite" href="${yt(id, t)}" target="_blank" rel="noopener" title="${esc(s.title)}（${ymd(s.date)}）" aria-label="${esc(s.title)} の ${hms(t)} から（新しいタブで開きます）">${s.kind === "l" ? "配信" : "動画"} ${hms(t)}</a>`;
  });
}
function viewBook() {
  if (!D.book.length) return `<h2>教科書</h2><p class="empty">まだ章が無い。</p>`;
  return `<h2>教科書</h2><p class="lead">動画と配信のポイントを5章にまとめた読み物。リンクを押すとその場面から再生する。</p>
  <div class="themes">${D.book.map((c, i) => `<a class="theme" href="#/ch/${c.id}" style="animation-delay:${i*30}ms"><b>第${i + 1}章 ${esc(c.name)}</b><span>${c.sections.length} 節${c.reviewed ? "" : "（下書き）"}</span></a>`).join("")}</div>`;
}
function viewChapter(id) {
  const i = D.book.findIndex(c => c.id === id), c = D.book[i];
  if (!c) return `<p class="empty">見つからない。</p>`;
  const toc = c.sections.map((s, j) => `<li><a href="#/ch/${id}/${j}">${i + 1}-${j + 1} ${esc(s.title)}</a></li>`).join("");
  const secs = c.sections.filter(s => !q || (s.title + s.body.join("")).includes(q)).map(s => {
    const j = c.sections.indexOf(s);
    return `<section class="sec" id="s${j}"><h3>${i + 1}-${j + 1} ${esc(s.title)}</h3>${s.body.map(p => `<p>${cite(p)}</p>`).join("")}</section>`;
  }).join("");
  const steps = a => a.map(x => `<span class="step">${esc(x)}</span>`).join(`<span class="arr" aria-hidden="true">＞</span>`);
  const routes = (c.routes || []).map(g => {
    const rs = g.routes.filter(r => !q || JSON.stringify(r).includes(q));
    if (!rs.length) return "";
    return `<h4 class="rg">${esc(g.title)}</h4><div class="routes">${rs.map(r => `<div class="route">
      <b>${esc(r.name)}</b>${r.when ? `<span class="when">${esc(r.when)}</span>` : ""}
      <div class="steps" aria-label="手順">${steps(r.route)}</div>
      ${(r.options || []).length ? `<div class="opts"><span class="optl">択</span><ul>${r.options.map(o => `<li><div class="steps">${steps(o)}</div></li>`).join("")}</ul></div>` : ""}
      ${r.note ? `<p class="rnote">${esc(r.note)}</p>` : ""}
      <div>${cite((r.cites || []).join(" "))}</div></div>`).join("")}</div>`;
  }).join("");
  const rblock = routes ? `<section class="sec" id="routes"><h3>ルート一覧</h3>${routes}</section>` : "";
  const rlink = (c.routes || []).length ? `<p style="margin:12px 0 0"><a href="#/ch/${id}/routes">→ ルート一覧（レシピ）へ</a></p>` : "";
  return `<a class="back" href="#/book">← 教科書</a><h2>第${i + 1}章 ${esc(c.name)}</h2>
  <div class="sum"><p style="margin:0">${esc(c.lead)}</p>${rlink}<ol class="toc">${toc}</ol></div>${rblock}${secs || `<p class="empty">当てはまる節は無い。</p>`}`;
}
function viewThemes() {
  const cnt = {}; ALL.filter(hit).forEach(p => (p.themes || []).forEach(t => cnt[t] = (cnt[t] || 0) + 1));
  return `<h2>テーマ別</h2><p class="lead">動画と配信のポイントを、テーマごとに集めた一覧。教科書の下書きの材料。</p>
  <div class="themes">${Object.entries(THEMES).map(([k, n], i) => `<a class="theme" href="#/theme/${k}" style="animation-delay:${i*30}ms"><b>${n}</b><span>${cnt[k] || 0} か所</span></a>`).join("")}</div>`;
}
function viewTheme(k) {
  const ps = ALL.filter(p => (p.themes || []).includes(k) && hit(p)).sort((a, b) => b.src.date.localeCompare(a.src.date) || a.t - b.t);
  return `<a class="back" href="#/themes">← テーマ別</a><h2>${esc(THEMES[k] || k)}</h2><p class="lead">${ps.length} か所。新しい動画から順。</p>
  ${ps.map((p, i) => ptHTML(p, i, true)).join("") || `<p class="empty">当てはまるポイントは無い。</p>`}`;
}
function cards(list, kind) {
  const f = list.filter(v => (kind === "v" ? v.points : v.highlights).some(hit));
  return f.map((v, i) => `<a class="card" href="#/${kind === "v" ? "video" : "live"}/${encodeURIComponent(v.id)}" style="animation-delay:${Math.min(i, 15)*25}ms">
    <span class="meta">${v.kind ? `<span class="tag k-x">${esc(v.kind)}</span>` : ""}${v.short ? `<span class="tag k-vs">ショート</span>` : ""}<span>${ymd(v.date)}</span></span>
    <span class="t">${esc(v.title)}</span><span class="s">${esc(v.summary)}</span></a>`).join("") || `<p class="empty">当てはまるものは無い。</p>`;
}
function viewVideos() {
  return `<h2>動画</h2><p class="lead">${D.videos.length} 本。新しい順。</p><div class="grid">${cards(D.videos, "v")}</div>`;
}
function viewLives() {
  return `<h2>配信</h2><p class="lead">${D.lives.length} 本。新しい順。</p><div class="grid">${cards(D.lives, "l")}</div>`;
}
function viewOne(kind, id) {
  const v = (kind === "v" ? D.videos : D.lives).find(x => x.id === id);
  if (!v) return `<p class="empty">見つからない。</p>`;
  const ps = (kind === "v" ? v.points : v.highlights).map(p => ({...p, src: v, kind})).filter(hit);
  return `<a class="back" href="#/${kind === "v" ? "videos" : "lives"}">← ${kind === "v" ? "動画" : "配信"}の一覧</a>
  <h2>${esc(v.title)}</h2>
  <p class="meta">${v.kind ? `<span class="tag k-x">${esc(v.kind)}</span>` : ""}<span>${ymd(v.date)}</span><span>${hms(v.duration)}</span>
   <a href="${yt(v.id, 0)}" target="_blank" rel="noopener">YouTube で開く（新しいタブで開きます）</a></p>
  ${v.version_sensitive ? `<p class="warn">⚠ ${esc(v.version_note)}</p>` : ""}
  <div class="sum"><p style="margin:0">${esc(v.summary)}</p>${v.takeaways ? `<ul>${v.takeaways.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</div>
  ${ps.map((p, i) => ptHTML(p, i, false)).join("") || `<p class="empty">当てはまるポイントは無い。</p>`}`;
}
function render() {
  const h = location.hash.replace(/^#\//, "") || "book";
  const [a, b, c] = h.split("/").map(decodeURIComponent);
  const tab = {theme: "themes", video: "videos", live: "lives", ch: "book"}[a] || a;

  }
  document.querySelectorAll("nav a").forEach(x => x.dataset.tab === tab ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));
  document.getElementById("app").innerHTML =
    a === "theme" ? viewTheme(b) : a === "videos" ? viewVideos() : a === "lives" ? viewLives() :
    a === "video" ? viewOne("v", b) : a === "live" ? viewOne("l", b) : a === "themes" ? viewThemes() : viewBook();
}
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim(); render(); });
document.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => {
  side = b.dataset.side; document.querySelectorAll("[data-side]").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
}));
addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
render();
</script>
</body>
