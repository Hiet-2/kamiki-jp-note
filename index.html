I", "game": "スト6", "summary": "キャミィ、ラシード、ガイル、舞の相手を募集して対戦する配信。キャミィのフーリガンコンビネーションへの対応をトレモで検証し、中段でしゃがみを解除させる考え方、ランクマの勝率の見方、C.ヴァイパーのセイスモをガードした後の対策を話した。", "highlights": [{"t": 1664, "head": "弱フーリガンの見分け対応を検証", "body": "キャミィの弱フーリガンの中段派生にしゃがみ小Pで対応すると負けてしまう。弱フーリガンを見分けてしゃがみ大Pを出せるのが一番よいが、それが現実的に可能かをその場で試した。最初は「多分無理」と話したが、最速ではなく引きつけて出すのが大事だと分かり、相打ちが多い感触で、意外といけるかもしれないと言い直した。", "chars": ["キャミィ", "JP"], "themes": ["defense", "matchup"], "side": "jp", "tags": ["練習", "キャラ対策"]}, {"t": 2180, "head": "キャミィの攻めのガードは筋トレ", "body": "キャミィの攻めのガードを、筋トレ、つまり反復練習の類だと位置づけた場面。ODアクセルスピンナックルは、筋トレすれば意外とガードできそうな気がするという見立て。ジャンプフーリガンからの投げについて、弱フーリガンから来ることはあるのかと疑問を口にした。", "chars": ["キャミィ", "JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["練習", "キャラ対策"]}, {"t": 6319, "head": "中段でしゃがみを解除させる意味", "body": "ガイル、DJ、ブランカのような相手に中段を振る意味の解説。連ガの連携で中段をガードさせると、しゃがみを強制的に解除させられる。その後は無敵技が来なくなり、状況によっては対空も来なくなるので、飛ぶ選択肢が通りやすくなる。", "chars": ["ガイル", "ディージェイ", "ブランカ"], "themes": ["offense", "matchup"], "side": "jp", "tags": ["解説", "キャラ対策"]}, {"t": 6825, "head": "勝率は当たる頻度で優先順位を付ける", "body": "キャラ別の勝率を上げるとき、勝率の低い相手キャラを上げるのは一番大事だが、そのキャラがランクマで多いかどうかも考える。100戦に1回しか当たらないキャラは、勝率が低くても考えなくてよい。ただしJPの勝率が3割なら、MRは一生上がらない。", "chars": ["JP"], "themes": ["practice", "resource"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 9260, "head": "セイスモのガード後はインパクトを入れ込む", "body": "C.ヴァイパーのセイスモをガードした後の対策。ガードしたらすぐドライブインパクトのボタンを押しておく。インパクトが出る場面があると、相手はセイスモからの攻めをやりにくくなるので、おすすめの対策だ。", "chars": ["C.ヴァイパー", "JP"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】キャミィラシードガイル舞を厚めに募集", "date": "20260520", "duration": 9480}, {"id": "fZgVDyrd5gM", "game": "スト6", "summary": "ランクマとカスタムをしながら視聴者の質問に答える配信。JP対キャミィの相性、アムネジアの当て身としての性質、設置・起爆ヒット後のODストリボーグを解説した。調整が来る前の見立てと、イングリッド追加への不安も話した。", "highlights": [{"t": 65, "head": "調整が来る前の見立て", "body": "大会に向けたカスタムと同じかそれ以上に、イングリッド追加の調整で何が来るかが気になっている。大きなナーフが来ると、対策以前に勝てなくなる可能性がある。一方、JPはこの前に非常に面白いおもちゃをもらったばかりなので、追加の強化はほぼないだろうという見立て。", "chars": ["JP", "イングリッド"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 832, "head": "JP対キャミィは互いに嫌なカード", "body": "JP対キャミィがしんどいという視聴者の質問への答え。お互いに自分が不利と言っている印象だ。JP側はキャノンストライク、通常技の対空、フーリガンが嫌で、キャミィ側は置かれた通常技にキャノンストライクが負けて爆死するのが嫌だ。キャノンストライクは空投げに負けるので、キャミィが飛んだら必ず空投げする意識を持つとよい。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 1124, "head": "調整はフレーム変更でなく火力下げの見立て", "body": "JPの技のフレームを変える調整は、セットプレイやラヴーシュカのコンボが全部作り直しになるので来ないだろう。ありえるのは火力を下げる調整で、コンボ中に即時補正がかかる形が考えやすい。ただ本命は何もないという見立てで、あるとすれば全キャラ共通のシステム調整の煽りを食う形。アムネジアの持続も変わらないだろう。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "解説"]}, {"t": 1513, "head": "アムネジアは確定リターンではない当て身", "body": "アムネジアを当て身として捉える解説。確定リターンではなく、小Pを取ると取られた側が有利になって読み合いが再発し、リターンが0になる場合がある。昇龍のように能動的に使えず逆択にしか使えないのも劣る点。一方、投げや持続の長い技を取れば120点級の爆発力が出る。イングリッドの当て身は、取ってリターンが0にならない代わりに、JPほどの爆発力は出ないだろう、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["defense", "system"], "side": "jp", "tags": ["解説"]}, {"t": 5417, "head": "DJは上位キャラへの相性がよい", "body": "環境の話。DJは今、かなりいい立ち位置にいる。DJ使い自身も言っているとおり、上位キャラへの相性が軒並みよいためだ、という見立て。", "chars": ["ディージェイ"], "themes": ["matchup"], "side": "", "tags": ["雑談"]}, {"t": 6116, "head": "起爆ヒット後の締めはODストリボーグ", "body": "設置・起爆ヒット後の締めで、ODトリグラフでなくODストリボーグを使う理由を聞かれた場面。最大ダメージを取るならODストリボーグが大きい。ODトリグラフからはトリグラフをもう1回つなげるが、ODストリボーグからはトリグラフのあとにODトリグラフをもう1回挟めるので、火力が下がらない。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 8083, "head": "大攻撃は読みでなく前に出そうな場面で振る", "body": "大攻撃を置いているのは読みかと聞かれ、読みというより、相手が前に出てきそうな場面で振っている感覚だと答えた。3日に1回ほど大攻撃について聞かれるが、理由は自分でも言葉にできない。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】キャミィラシードガイル舞を厚めに募集", "date": "20260519", "duration": 8455}, {"id": "PQjUs4D0S_A", "game": "スト6", "summary": "ベガのランクマのあとカスタムをした配信。JPは使わない期間が弱さに直結するという話、エレナへの見立て、ケンがJPにとってメタになる理由、キャンセルラッシュの小技、大会は初戦の勝敗が大きいという見立てを話した。", "highlights": [{"t": 986, "head": "JPは使わない期間が弱さに直結する", "body": "JPは使わない期間がそのまま弱さに直結するキャラだ。ただし神木Cは使い込みすぎていて、手なりでもそこそこ動く。期間を空けたほうが強くなることすらある、という実感を語った。JPとベガの2キャラ練習はしんどいという話の流れでの発言。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1239, "head": "エレナの強さと大会での見立て", "body": "エレナは今かなり強そうだという評価。ゲージ消費が少なくても平均火力が高い点が強みだ。ヒット確認を重ねるキャラなので、緊張する大会の場と普段の環境の違いに影響されそう、という見立て。", "chars": ["エレナ"], "themes": ["matchup"], "side": "", "tags": ["見立て"]}, {"t": 4765, "head": "ケンはJPにとってメタになるキャラ", "body": "ケンはダッシュが速く、トルバランやトリグラフを抜ける択を豊富に持つため、JPにとってメタになるキャラだ。ラッシュの速さ、一文字蹴り、中Kの3つがJPに刺さる印象がある。ケンとテリーなら、個人的にはケンのほうが嫌だ。", "chars": ["ケン", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "Q&A"]}, {"t": 5216, "head": "キャンセルラッシュ後の小技とアムネジア", "body": "視聴者が話題にしたキャンセルラッシュ後の入力の小技は、リバーサルを打たれた時だけ出る仕込みだろう、という見立て。JPでも使えるが入力が難しく、ミスするとアムネジアが出てしまうのでリスクが大きい。神木Cは自分ではあまりやれていない。", "chars": ["JP"], "themes": ["offense", "defense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 7346, "head": "大会は初戦に勝てるかが大きい", "body": "大会は8人のうち2人になる形なので、初戦に勝てるかどうかが非常に大きいという見立て。初戦の組み合わせが決まったら、その相手の対策を最優先で練習する方針を話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["大会"]}], "title": "【スト6】軽ベガランクマ→重点カスタム", "date": "20260518", "duration": 8181}, {"id": "tpQg36xBmD0", "game": "スト6", "summary": "ランクマのあと、カスタムで視聴者と対戦しながら質問に答えた配信。差し返しより確定の取りこぼしを見直す話、豪鬼でJPに飛びを落とされる相談、JPの設置・大P設置・OD設置のセットプレイへの対応解説、リプレイを参考にする相手の選び方を話した。", "highlights": [{"t": 4386, "head": "差し返しを頑張るのはやめる", "body": "マスターからハイマスを目指す視聴者への助言。差し返しを頑張ろうとしているなら絶対にやめるべきで、必要なのは差し返しではなく、ほかのことの練習だ。どのキャラでもそうだが、特にJPで差し返しを気にし出すのはレート2000でも早い。", "chars": ["JP"], "themes": ["practice", "neutral"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4576, "head": "伸び悩む原因は確定の取りこぼし", "body": "レートが上がらない人に多いのは、確定を取れていない、取れても低い火力で終わっているパターンだ。ガードした場面でつい中足だけで終わっていないか、その先まで入れるべき場面ではないかを見直す。特に勝率の低い相手との試合を見直すとよい。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "", "tags": ["Q&A", "練習"]}, {"t": 5190, "head": "豪鬼でJPに飛びを落とされる時", "body": "豪鬼でJPに飛びをほとんど落とされるという相談への答え。飛びの散らし方が足りないのだろうという見立てで、豪鬼は飛びの種類が多く、JPの対空を釣る行動ができるはずだ。種類を全部使い分けられると、JPの対空では全てに対応するのが不可能になり、前飛びに間違って対空を出すとそのまま死ぬ。", "chars": ["豪鬼", "JP"], "themes": ["matchup", "antiair"], "side": "vs_jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 7632, "head": "JPの設置セットプレイ、3択と投げ", "body": "JPの設置からのセットプレイは択がじゃんけんになるため完全対応は不可能で、完璧に凌ぐなら世界最強になるしかない、という前提で解説する。択は大きく投げ、ワープジャンプ中K、中Kからの連携の3つ。投げからはフルコンボが入りループもするので、投げ抜けか無敵技で対応する。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "vs_jp", "tags": ["解説", "セットプレイ"]}, {"t": 7860, "head": "ワープジャンプ中Kの勝ち負け", "body": "ワープジャンプ中Kは、遅らせ投げ抜けと、真上に判定のある昇龍系などを除く無敵技に勝ち、前飛びにも当たる。最速の投げ抜けは狩れない。前飛びからめくり技を振っていれば逆に勝てるため、ワープが見えたらめくり技を出すのがおすすめだ。", "chars": ["JP"], "themes": ["setplay", "antiair"], "side": "vs_jp", "tags": ["解説", "セットプレイ"]}, {"t": 8268, "head": "大P通常設置は大Kの直撃が本命", "body": "大Pから通常設置する形は、投げられてもコンボにならず詐欺飛びが残る程度なので、投げは強く意識しなくてよい。怖いのは大Kの直撃で、大きなダメージを食らう。その後に中段や中足、中足からの起爆も来る。起爆は暴れ潰しなので、動かずジャストパリィで取れると最善だ。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "vs_jp", "tags": ["解説", "セットプレイ"]}, {"t": 8526, "head": "大Pから直接OD設置の中下二択", "body": "大Pから直接OD設置する形は、しゃがみ小Pでフレームを消費し、引き中攻撃、トルバランと続けて中段と下段で崩す連続ガードの連携だ。エフェクトが重なって見にくく、下段が来る率が高い。この形が見えた時点でリバーサルで無敵技を出すか、引き中攻撃にジャストパリィを狙う。投げは気にしなくてよい。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "vs_jp", "tags": ["解説", "セットプレイ"]}, {"t": 8706, "head": "バーンアウト中の同じ連携と起爆の崩し", "body": "バーンアウト中は同じ連携がトリグラフから始まり、連続ガードになる。見てからSAを撃つのが最善で、SAゲージが1本しかなければ受け入れるしかない。大Pから直接OD設置した後の起爆の崩しは真面目にガードするのはほぼ無理だが、連続ガードなのでドライブリバーサルで抜けるのがおすすめだ。", "chars": ["JP"], "themes": ["setplay", "defense", "resource"], "side": "vs_jp", "tags": ["解説", "セットプレイ"]}, {"t": 10386, "head": "再現性のないセットプレイは勧めない", "body": "示された、遅らせてインパクトに設置を噛み合わせるセットプレイは、体感のフレームで遅らせる上、相手のインパクトのタイミングで結果も変わるため再現性が低く、実戦向きではない。使われていない連携には使われないなりの理由があり、セットプレイを考えるなら再現性を大事にするのがよい。", "chars": ["JP"], "themes": ["setplay", "practice"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 10610, "head": "リプレイは少し上の人を参考にする", "body": "他人のリプレイを参考にするなら、自分より少し上のレート帯の人が足元で勝つ上で一番参考になる。極端に上の人は、表に出ている動きの裏でどんな読み合いがあるのかが分からない。JPは上に行くほど手札が増えがちなので、手札そのものを真似するのは構わない。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】重点カスタム", "date": "20260517", "duration": 10885}, {"id": "iH2etZNc6zg", "game": "スト6", "summary": "ランクマとカスタムをしながら視聴者と雑談した配信。JP以外の練習の勧め、アムネジアは存在するだけで強いという話、ダルシム戦の心構え、リーサル問題の検討、ケン戦で避けるトリグラフと迅雷脚への対応を話した。", "highlights": [{"t": 655, "head": "JP以外のキャラを使うのも有効", "body": "JP以外が何もなくて勝てないのかと悩む視聴者への答え。ほかのキャラを使うのは意外といい手だ。サブキャラを使ったあとはインパクト返しがしやすくなる実感がある。低いレート帯の相手のほうがインパクトを多く撃ってくるからだろう、という見立て。", "chars": ["JP"], "themes": ["practice", "system"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 2182, "head": "JPの中足はガイルの中足より強い", "body": "ガイルの中足はキャンセルが効かないが、JPの中足は起爆でキャンセルできる。そのぶんJPの中足のほうが強い。ガイルの中足自体も相当強い技だが、確実にJPの中足が上だ。", "chars": ["JP", "ガイル"], "themes": ["neutral"], "side": "jp", "tags": ["解説"]}, {"t": 3925, "head": "ダルシム戦はしびれを切らさない", "body": "ダルシムのテレポートとJPのトリグラフが噛み合って負ける場面は、双方とも納得しにくい運ゲーになる。ただトリグラフを撃つか撃たないかの権利はJP側にある。ダルシム戦で一番大事なのはむかつかないことで、言い換えればしびれを切らさないことだ。", "chars": ["JP", "ダルシム"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 4660, "head": "アムネジアは存在するだけで強い", "body": "アムネジアは存在しているという事実そのものが強い。ODアムネジアをほとんど撃たない相手でも、読み合いの選択肢として残るため、どこかで警戒してしまう。アムネジア弱い論を唱える人も、その恩恵を受けている。", "chars": ["JP"], "themes": ["defense", "system"], "side": "", "tags": ["解説"]}, {"t": 7923, "head": "JPのリーサル問題を検討", "body": "JPのリーサル問題を試した。あと0.1ゲージ貯められればワンチャンスが出てくるが、補正が切れていて火力が足りず、SAゲージが絶妙に届かない。ギリギリ無理という結論になった。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 10558, "head": "ケン戦のトリグラフは自殺行為", "body": "ケン戦でトリグラフを撃つのは自殺になるので、やめたほうがいい。ケンは一文字蹴りやラッシュでJPの行動にリスクを負わせやすく、差し返しが強い上に足も速いのできつい相手だ。イヤー1の最強JPの頃から嫌な相手だった。", "chars": ["ケン", "JP"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 10970, "head": "ケンの迅雷脚への対応", "body": "ケンの迅雷脚への対応は、ケン戦で絶対やっておくべきなのにおろそかになりがちな対策の1位で、レジェンドやプロでも普通に食らう。下段にはジャストパリィも狙う。ただし、それ一本で行くといつも投げられる。反撃を遅らせすぎると相打ちになる。", "chars": ["ケン", "JP"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策", "練習"]}], "title": "【スト6】ベガランクマとJPカスタム", "date": "20260516", "duration": 11367}, {"id": "dD_rduSh-tQ", "game": "スト6", "summary": "ベガ戦のランクマのあと、視聴者や対戦相手とのカスタムマッチをした配信。視聴者の質問に答え、ラヴーシュカを含むコンボの組み方と1年目の性能、大Pの判定の変遷を話した。カスタムでは、隙をつくだけの勝ち方を練習としては良くないと振り返った。", "highlights": [{"t": 4779, "head": "ラヴーシュカのコンボと1年目の性能", "body": "視聴者の質問（ラヴーシュカを含むコンボの順番）に、大K→中足の順にすると火力が少し上がり、ほかはあまり変わらないと答えた。1年目は大Kからどこからでも入れ、この形がむしろ標準だった。当時のラヴーシュカは全体4フレームで、目の前で撃たれるとほとんどのキャラは確定を取れなかった。今は10フレーム台のはずだと話した。", "chars": ["JP"], "themes": ["combo", "patch"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 5101, "head": "大Pの判定は発売当初どうだったか", "body": "視聴者の質問に、大Pのフレームは実装当時から変わっていないと答えた。違うのは判定で、発売当初は振った後の硬直中のやられ判定がほぼなく、杖には判定がどこにもなかった。足元を狙う技ではほとんど差し返せず、本体を直接殴れる技でなければ差し返しは難しかった。今は差し返せる場面が増えた。", "chars": ["JP"], "themes": ["patch", "neutral"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 6962, "head": "SAを使った場面の振り返り", "body": "相手のゲージを考えると、走ってインパクトに行く手もあったかもしれないと振り返った。さらに、直前に使ったSAは、相手をバーンアウトにもできず、ラッシュ中は自分のドライブゲージも回復しないため微妙だったと評した。", "chars": ["JP"], "themes": ["resource", "system"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 7247, "head": "隙をつく勝ち方への振り返り", "body": "カスタムで、相手の隙をつくだけの勝ち方は大会ならよいが、練習でやってもあまりキャラは関係ないと振り返った。ただ、負けそうになるとつい出てしまう、とも話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["練習", "雑談"]}], "title": "【スト6】ベガランクマとJPカスタム", "date": "20260515", "duration": 9089}, {"id": "2-qY9UdbDGw", "game": "スト6", "summary": "ランクマ中心の配信。視聴者の質問に答え、コンボの締めにOD技を使う理由、大Kを振る基準、カウンター確認の手がかり、JP戦で相手がやると効く動き、苦手キャラの勝率の考え方を話した。アレックス戦では構えの扱いを確認した。", "highlights": [{"t": 537, "head": "コンボ締めにOD技を使う理由", "body": "視聴者の質問（コンボの締めにODストリボーグを使う理由）に、ODストリボーグのほうがゲージの回復が早く消費も少ないのでコスパがよいからで、ほかに特別な理由はないと答えた。神木Cはラッシュでドライブゲージを多く使うスタイルなので、それ以外のコンボではゲージのコスパを重視する傾向がある。", "chars": ["JP"], "themes": ["resource", "combo"], "side": "jp", "tags": ["Q&A"]}, {"t": 842, "head": "最初に見せた行動が最後まで残る", "body": "1ラウンド目で一度見せられた相手の行動は、最終ラウンドの最後の一手でも頭に残る。『最後はこれをやってくるだろう』と意識しながらやらざるを得なくなる、と話した。リュウ戦の場面だ。", "chars": ["リュウ"], "themes": ["neutral", "practice"], "side": "", "tags": ["雑談"]}, {"t": 3968, "head": "大Kを振る基準", "body": "視聴者の質問に答え、大Kは先端で当たりそうな間合い以外にも、相手が差し返しを狙って歩きが多いときに刺さりやすいと話した。ガイルのようにしゃがんでいる場面が多いキャラには刺さりにくく、先端でないと振りにくい。基本は先端でなければ振らないほうがよい。昇龍のないキャラ相手では振る機会が増える。", "chars": ["JP", "ガイル"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 4163, "head": "アレックスの構えの前提を確認", "body": "アレックス戦で、構えからはコマンド投げが出ず通常投げだけという前提を忘れがちで、認識していなかったと話した。また、構えから一部の技を出すと立ちに移行するので、パワーボムが来る可能性があるとも述べた。", "chars": ["JP", "アレックス"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 4386, "head": "カウンター確認は自分に合う方法で", "body": "視聴者の報告（カウンター確認を文字を見る方式にしたらやりやすくなった）を受け、一番見やすいものは人それぞれで、どれが自分に一番できるかを試すのがいいと答えた。砂埃を見る人もいるが、神木Cは砂埃ではほとんどできない。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 7220, "head": "JP戦で相手がやると効く動き", "body": "JP戦で相手がやると効く動きの解説。ラッシュの強いキャラ（ルークなど）が最初の段階から攻める形が一番よい動きだと答えた。設置を許したら、一度受け入れてパリィし、トルバランなどが終わったタイミングで殴りに行く。トリグラフやトルバランにジャストパリィからラッシュを決める動きもよい。張り直しの場面ではJP側が不利フレームを背負うため、ダッシュで近づくと強い。", "chars": ["JP"], "themes": ["matchup", "setplay"], "side": "vs_jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 7769, "head": "苦手キャラの勝率と克服の目安", "body": "視聴者の相談（苦手キャラ戦の勝率が低い）に答えた。苦手キャラがいること自体は普通だが、30〜40%を切るキャラがいるのはまずい。試合数を重ねたうえで20〜30%なら、その使い手とカスタムをするなどして克服したほうがいい。ランクマでその勝率なら、さすがに苦手すぎるラインだと話した。", "chars": [], "themes": ["practice", "matchup"], "side": "", "tags": ["Q&A", "練習"]}], "title": "【スト6】爆裂スランプランクマ", "date": "20260514", "duration": 8881}, {"id": "84fijnCF6Io", "game": "スト6", "summary": "ランクマを進めながら、休憩にカウンターとパニッシュカウンターの仕組み、確認のやり方、練習法を解説した配信。視聴者の質問に、パニカン後のキャンセルからの6大K、ヴィーハトのワープがめくりになる位置、飛ばれる弱点への向き合い方、空対空を答えた。最後にマノンのSAへの割り込みを紹介した。", "highlights": [{"t": 2251, "head": "パニカン後のルート選びの反省", "body": "コパ→中K→SAのルートが良かった場面で、パニカンからの中Kがうまくできないというより、とっさに選べないと反省した。しゃがみ中からODに行くより、全部中Kに替え、中KにするならそのあとSAまで行くほうがいい場面が多いという振り返りだ。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["リプレイ振り返り", "コンボ"]}, {"t": 3471, "head": "カウンターとパニカンの仕組み", "body": "カウンターは技の出掛かりを潰したときに出る判定で、JPの中足は通常ヒットなら+3、カウンターなら+5になり、弱が繋がるようになる。カウンター限定コンボの理屈はこのフレーム差だ。パニッシュカウンターは技の後隙に当てたときで+7になり、JP・ベガ・マリーザの大攻撃のように、パニカン時だけ専用のやられになる技もある。昇龍やSAの後隙でパニカン限定の大きなコンボを入れられる。", "chars": ["JP", "ベガ", "マリーザ"], "themes": ["system", "combo"], "side": "jp", "tags": ["解説", "コンボ"]}, {"t": 4024, "head": "カウンター確認の手がかりと練習法", "body": "カウンターかどうかの手がかりは3つ。キャラの下に出る黄色の表示、ヒット音（パニカンはかなり派手）、足元の砂煙（パニカンはより大きく散る）だ。神木Cは主に表示の文字を見る。実戦で確認が必要なのは主にJPの中足で、キャンセルが効かないので精度はかなり出せる。実戦は状況確認が混ざるのでトレモより簡単で、ガードとヒットをランダムにしたトレモで確認を100回こなせれば実戦でミスしないだろう、という見立て。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 5026, "head": "パニカン後はトルバランをキャンセル", "body": "パニカンしたのにトルバランを入れ込んでしまうのはもったいない、という視聴者の話に答えた。パニカンを確認してキャンセルし、6大Kへつなぐことができる。実戦でできている人はごく少なく、できればかなり上手いと話した。神木C自身も実戦ではあまりできていない。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 6022, "head": "ヴィーハトのワープがめくりになる位置", "body": "ヴィーハトのワープがめくりになる位置について、視聴者の質問に答えた。設置の後、ワープの穴の真下付近にいると、裏側に落ちてくるめくりになる。穴から離れた位置にいれば、普通に正面へ落ちてくる。穴の真下に近い微妙な位置は避けたほうがいい。", "chars": ["JP"], "themes": ["setplay", "matchup"], "side": "vs_jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 6337, "head": "飛ばれる弱点への向き合い方", "body": "視聴者から、飛ばれやすい点は割り切るしかないのかと聞かれ、弱点だから仕方なく、完璧な対応があれば最強キャラになってしまうと答えた。改善点は、相手が飛びの多いタイプかを見ること、落とせる飛びはきちんと落として飛びにリスクを与えること。トルバランに飛ぶ相手には、トルバランのフェイントを混ぜると飛びを落とせる。神木C自身の課題でもある。", "chars": ["JP"], "themes": ["antiair", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 6785, "head": "空対空にジャンプ中Kは使えるか", "body": "視聴者から、空対空にジャンプ中Kが使えるなら大Kより良いかと聞かれ、間に合うならジャンプ中Kからそのままコンボに行けるので、できる状況でコンボまで行ければ偉いと答えた。ただし神木Cは苦手で、あまりできていない。", "chars": ["JP"], "themes": ["antiair", "combo"], "side": "jp", "tags": ["Q&A"]}, {"t": 7086, "head": "イングリッド追加とJPナーフへの見立て", "body": "D4Cのオフラインは6月7日で、イングリッド追加の直後にあたる。追加のタイミングでJPがナーフされれば非常に厳しいが、そこは運だと話した。ワールドウォーリアの第2回が7月の頭なのは、5月末のイングリッド追加のあと、アトランタやコンボブレーカー、6月終わりのエボを挟むからだろうという見立ても述べた。", "chars": ["JP", "イングリッド"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 11426, "head": "マノンのSAに割り込める場面", "body": "キャラ対策の小ネタを話した。マノンのSAをガードすると端から離れてしまうが、跳ねる場面は隙間が大きく割り込める。最後までガードし切っても削りが増えるだけなので、そこで大きなコンボを入れる。ジュリのSAも同様に割り込める。削りの場面や、端から離れずに端コンボをしたい場面に向く。", "chars": ["マノン", "ジュリ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策"]}], "title": "【スト6】ランクマ→カウンター/パニカン確認のやり方", "date": "20260513", "duration": 11560}, {"id": "-oFFHO-E1OQ", "game": "スト6", "summary": "視聴者の質問に答えながらJPで対戦する配信。設置を使った詐欺飛びの連携の検証、JPできついキャラ、ブランカ戦の印象、互いにきつい組み合わせが多い理由、インパクトを返す率の話などをした。", "highlights": [{"t": 2013, "head": "設置で詐欺飛びになる連携を検証", "body": "JPの設置を使った詐欺飛びになる連携を、その場で試した。最速で入力すると起爆になってしまう。強そうで、少なくとも神木Cは見たことがない連携だ。トリグラフを重ねる形と比べ、詐欺飛びなのでSA3があっても使える点が大きい、という見立て。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 5019, "head": "ダルシム戦はしびれを切らすと負ける", "body": "ダルシム戦は、しびれを切らすと絶対に負ける対戦だという実感を述べた。この直後の場面でも、いま自分がしびれを切らしていると口にしていた。", "chars": ["ダルシム"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 5037, "head": "JPは調整が難しいキャラ", "body": "JPを弱くする調整の話題で、JPは絶妙なバランスで成り立っているキャラだと述べた。特殊系でピーキーなため、調整で多めにいじると一瞬で最弱になる可能性がある。そこが難しい。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 6216, "head": "JPがきついキャラの答え", "body": "視聴者の質問に答えた。EDが一番きついが、それを除くとジュリとベガの2キャラになる。ベガは得意なので、一番きついのはジュリだ。キャミィ戦もきつい。キャミィ側もJPをきついと言うことが多く、双方がきついと感じている印象だ。", "chars": ["JP", "ED", "ジュリ", "ベガ", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 6666, "head": "JPは互いにきつい相手が多い理由", "body": "JPで互いにきついと感じる組み合わせが多い理由を述べた。JPはピーキーなキャラで、JP側が相手をきついと感じる事情はJPを使わなければ理解しにくい。ブランカも同じだろう、という見立て。", "chars": ["JP", "ブランカ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 6940, "head": "ブランカ戦は五分の印象", "body": "視聴者にブランカ戦は五分ぐらいかと聞かれ、そういう印象だと答えた。大きく不利という印象も、大きく有利という印象もない。ブランカがとてもきつい、という感覚はない。", "chars": ["JP", "ブランカ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 8202, "head": "柔道の調整が来たらJPは相対強化", "body": "全キャラ共通で柔道がなくなる調整が来るのかが気になるところだ。もし来れば、元から柔道のないJPは相対的に強化になる。また相対強化されるのかと怒られそうだ、とも述べた。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 9329, "head": "インパクトは下のランク帯ほど返せる", "body": "ランク帯が下のほうがインパクトを返す率は高いと答えた。インパクトはどのランク帯でも見ているが、下のほうが考えることが少ないためだろう、という見立てで、統計上も明確だったと述べた。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["Q&A", "雑談"]}], "title": "【スト6】ランクマとかカスタムとか", "date": "20260512", "duration": 9574}, {"id": "yxaNPHz2auY", "game": "スト6", "summary": "WW #1に出場し、ウィナーで負けたあとにランクマで時間をつぶした配信。パッド勢かという質問、プールの組み方、ラッシュ止めの出し方、キャミィ戦の印象に答えた。負けたあとの待ち時間の過ごし方を課題に挙げた。", "highlights": [{"t": 322, "head": "パッド勢でアケコンはすぐやめた", "body": "視聴者の「パッド勢か」という質問に、ずっとパッドだと答えた。アケコンを使ったのは1回だけで、真空の入力がうまくできず試したが、まったく合わずにすぐパッドに戻った。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 4312, "head": "WW #1は各プールにシードが2人", "body": "WW #1では各プールにシードが2人いる構成で、プールを抜けた時点でベスト64になるよう組まれている。これまではプール抜けでベスト128だっただろう、という見立てで、そのためウィナー4回戦でそのプールのシード1位と当たる形になった。以前ならウィナー3回戦ぐらいで当たったはずだ。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["雑談"]}, {"t": 4652, "head": "ラッシュ止めは見てからでなく置き", "body": "ドライブラッシュを止める技は見てから出すのではなく置きで出しているか、という視聴者の質問に、ほぼ置きだと答えた。相手がかなり遠いときだけ、見てから出すこともある。", "chars": ["JP"], "themes": ["defense", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 5149, "head": "キャミィ戦は嫌な気持ちになりやすい", "body": "キャミィ戦は、JP側としてかなり嫌な気持ちになりやすい組み合わせだと述べた。キャミィ側もJPにあまり良い印象を持っていない印象がある。", "chars": ["JP", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 8203, "head": "ウィナーで負けた後の過ごし方", "body": "ウィナーで負けて待ち時間が空くと、その間にダラダラやってしまい、崩れやすい。対戦するより、席を外して休憩するほうがよいのかもしれない、という振り返り。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談"]}], "title": "【スト6】WW #1→負けたので軽くランクマ", "date": "20260510", "duration": 8437}, {"id": "RzX9IwFcodM", "game": "スト6", "summary": "朝10時開始のD4CUP第三回予選に出場した配信。視聴者の質問に答えてセットプレイの見立てを話し、待ち時間にはマスターレートの付いていない相手への警戒を語った。準優勝し、オフの大会に行けそうだと話して終えた。", "highlights": [{"t": 2053, "head": "調整後の新しい設置セットプレイ", "body": "調整後に使えるようになった新しいセットプレイを問われ、設置のあとに中Pを置いてラッシュしていれば、勝手に止まって起爆できる形は強そうだという見立てを話した。続けて、セットプレイ自体はそれほど変わっていないだろう、起爆だからだ、とも話した。", "chars": ["JP"], "themes": ["setplay", "patch"], "side": "jp", "tags": ["Q&A", "セットプレイ", "調整"]}, {"t": 6006, "head": "オフに行くにはまず準優勝が目標", "body": "優勝まではあと5勝。オフの大会に行けるのは、準優勝すれば行けるくらいだろうと見て、いったん準優勝を目標にしていると話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["大会", "雑談"]}, {"t": 11868, "head": "マスターレート無しの相手は警戒", "body": "大会でマスターレートの付いていない相手に当たると、ハブを主戦場にしている相手かもしれないと警戒する。ハブは一番怖い場だと話した。神木C自身はハブをあまり使わない。", "chars": ["JP"], "themes": ["practice"], "side": "", "tags": ["大会", "雑談"]}, {"t": 20930, "head": "ダルシム戦はワープの読み合いが特殊", "body": "ダルシム戦を振り返り、ダルシムは他のキャラと読み合いの方向が違うと話した。トリグラフにワープが噛み合うと死ぬという要素がある。ワープを待っていたところ、それを読まれて逆のタイミングでワープされた、と振り返った。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "setplay"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}], "title": "【スト6】10時～D4CUP第三回予選", "date": "20260509", "duration": 21045}, {"id": "j0S1QsQLd44", "game": "スト6", "summary": "ベガとJPを使う配信。視聴者の「意思を持った技振り」の質問に、何に勝つ技かを意識して振ると答えた。ほかに、ベガ戦の起き攻めへの見立て、コンボを連打で入力してしまう癖、手元が忙しいキャラへの考え、離し入力の設定、ベガの中Kの強さなどを話した。", "highlights": [{"t": 622, "head": "意思を持った技振りとは", "body": "視聴者の「意思を持った技振り」の質問に答えた。何に勝つ技かを理解して振ればよい。見るのは、その技が相手の行動にリスクを負わせられるか、相手がその行動をとる理由がある場面か、という点。その意識はロジカルである必要はなく、ある程度感覚的でもよい。", "chars": [], "themes": ["practice", "neutral"], "side": "", "tags": ["Q&A", "解説"]}, {"t": 2220, "head": "ベガの起き攻めはリバサ暴れに弱い", "body": "このレート帯の相手は、起き上がりにほぼ何かしらのボタンを押す。そのため大フィストの後にラッシュから遅らせ中段を出すと、小Pを出されてカウンターになるパターンが多く、弱くなっている。大フィストの後にラッシュをすれば、相手は何かしてくると思ったほうがよい、という感覚。", "chars": ["ベガ"], "themes": ["offense", "defense"], "side": "", "tags": ["解説"]}, {"t": 2619, "head": "ベガの中Kで差し返せる", "body": "相手の技をベガの中Kで差し返せることに驚き、この一本で生きていけそうだと評した。JPで同じ差し返しをするのはほぼ不可能だという比較も述べた。", "chars": ["ベガ", "JP"], "themes": ["neutral"], "side": "", "tags": ["雑談"]}, {"t": 3488, "head": "コンボを連打で入力してしまう癖", "body": "コンボの入力は1回だけ押すほうがよく、連打ではだめだと分かっていても、慣れていないほど怖くて連打してしまう。慣れると連打しなくなるが、慣れるまではつい連打になる。格ゲーあるあるだと述べた。", "chars": [], "themes": ["practice", "combo"], "side": "", "tags": ["Q&A", "練習"]}, {"t": 3881, "head": "手元が忙しいキャラが苦手", "body": "手元が忙しいキャラは昔から嫌いだと述べた。JPは難しいとよく言われるが、手元は忙しくない。いちばん手元が忙しいキャラはC.ヴァイパーだという考えだ。", "chars": ["JP", "C.ヴァイパー"], "themes": ["practice"], "side": "jp", "tags": ["雑談"]}, {"t": 7327, "head": "ED戦はベガとJPのどちらがよいか", "body": "ED戦に出すのはベガとJPのどちらがよいか、結構悩ましいラインだと話し、個人的にはベガのほうがよさそうだと見た。ED戦ではアムネジアは合っていないようなものだとも述べた。", "chars": ["ED", "ベガ", "JP"], "themes": ["matchup"], "side": "", "tags": ["キャラ対策"]}, {"t": 7824, "head": "離し入力はオンかオフか", "body": "離し入力をオンにしないと、JPで時々コンボが出ない経験が多く、オンで使っている。一時期は誤爆が嫌でオフにしていたが、コンボが出ないパターンがちょくちょく起きたため、またオンに戻した。", "chars": ["JP"], "themes": ["system", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】明日は休むJPベガランクマ", "date": "20260507", "duration": 11995}, {"id": "Wr9dUkkfM-g", "game": "スト6", "summary": "視聴者のコメントに答えながらJPで対戦する配信。設置後の大Kと大Pの入れ込み、アムネジアと昇龍拳の違い、リプレイで学ぶ相手の選び方、トルバランと通常技の評価を話した。", "highlights": [{"t": 7316, "head": "設置後の大Kは大Pまで入れ込まない", "body": "大Kはヒット確認が簡単で、SA2に行く場面以外は大Kで止める。ヒットならしゃがみ中Pから起爆、ガードなら中段を出す。大Pまで入れ込むと、相手が上を入れっぱなしの場合に大Pが空振りし、マイナス10ほどの大きな不利を背負うため、基本は入れ込まない。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 8542, "head": "アムネジアは有利フレームで出していないか", "body": "アムネジアの成功率が低い原因は、自分が先に動ける有利フレームの場面で、相手がボタンを押す確率がゼロなのに出しているからだろう、という見立て。他キャラのフレームをざっくり勉強するとよい。昇龍拳は中足ラッシュから連係を組まなかった場面に確定を取れるが、アムネジアは当て身で確定に使えない。トータルでは昇龍拳が強いとの見解。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 8682, "head": "リプレイは自分より少し上のJPを見る", "body": "リプレイで学ぶなら、極端に上の相手を見ても「すごい」で終わって吸収できない。真似できるのは自分より少し上、ハイマス帯のJPだ。見るポイントは無限に出てくるので整理して、すぐ取り入れるものに絞るのがよい、と話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 9073, "head": "トルバランは波動としては弱い", "body": "「JPの弾は強くない」というコメントへの答え。トルバラン単体を波動として見ると、出し切りしかなく弱い。強さはヴィーハトやトリグラフなどの設置と合わせた削りと崩しにある。フェイントでパリィを釣ったり弾を消したりできる。相手の位置に着いてから判定が出るため、ラッシュの強いキャラには突き抜けられる。", "chars": ["JP"], "themes": ["neutral", "setplay"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 9318, "head": "JPは中間距離の通常技が強い", "body": "JPは通常技が強く、特に大Pがギリギリ届くか届かないかの中間距離が強い。密着は弱く、小技のフレームが重い。引き出しが無限にあるキャラで、浅いところに引き出しを置いておかないといけないのが大変だと話した。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】現実逃避JPベガランクマ", "date": "20260506", "duration": 10346}, {"id": "E7w7piOJGE4", "game": "スト6", "summary": "JPとベガでランクマをする配信。ほとんどがランクマの実況で、見どころは視聴者の質問に答えた使用デバイスの話と、JPのジャストパリィからのトリグラフがレバーレス向きという話、確定反撃の使い分けの3か所だ。", "highlights": [{"t": 1949, "head": "使用デバイスはビクトリックスのパッド", "body": "視聴者の質問に、使用デバイスはビクトリックスのパッド（BFG）だと答えた。ストはずっとこのパッドでやっていて、スト6の発売前に3か月だけスト5をやった頃からこのパッドを使っている。", "chars": ["JP"], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 2402, "head": "JPのジャスパからトリグラフはレバーレス向き", "body": "JPでよくあるジャストパリィからのトリグラフは、パッドだと入力がきつい。レバーレスが一番やりやすいと思うので、JPに向いたデバイスだろう、という見立て。神木C自身はパッドで入力できる気がしないため、ジャストパリィのあとはラッシュにしている。", "chars": ["JP"], "themes": ["practice", "offense"], "side": "jp", "tags": ["Q&A"]}, {"t": 8284, "head": "JPの確定反撃は技を使い分ける", "body": "確定反撃に大足を使う発想は、JPを使っているとなかなか身につかない。JPでは発生の遅い技は確定に使えないため、相手のマイナスフレームと距離に応じて、中足、中K、大P、大Kなどを使い分ける。より高いダメージが入る場面ではそちらを選ぶ、とも話した。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】もっと休みたい JPベガランクマ", "date": "20260504", "duration": 10454}, {"id": "XY8XQBAvQv0", "game": "スト6", "summary": "JPとベガでランクマを回す配信。新キャラ イングリッドへの見立てを話し、後半は視聴者のリプレイを見ながら、崩し後のバーンアウト、アムネジア後の設置、ケン戦の中足キャンセルへのインパクト、中Pの使い方、大Kの入れ込みを助言した。", "highlights": [{"t": 4844, "head": "イングリッドは通常技とラッシュ次第", "body": "新キャラのイングリッドは触らず、Twitterで流れてくる情報だけを見て、明らかに弱そうだと判断した。通常技が弱く、ラッシュが遅いのは致命的だろう、という見立て。", "chars": ["イングリッド"], "themes": ["patch"], "side": "", "tags": ["雑談"]}, {"t": 7126, "head": "リプレイ振り返り：崩し後とアムネジア後", "body": "視聴者のリプレイを見ながらの助言。崩しが通った場面でリーサルに足りないなら、相手をバーンアウトさせたほうがその後の勝率は高くなるはず、という見立て。アムネジアが当たった後は、トルバランなどで距離を離しつつ設置するとよい。端から出る手段が前飛びとアムネジアだけだと、対応がすごく難しくなる。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 7435, "head": "ケン戦は中足キャンセルにインパクト", "body": "ケンの中足キャンセルを見てインパクトを出す対策がある。キャンセル先が波動拳だと連続ガードになるが、間が空く技ならインパクトが出る。踏み込むのが怖いという相談には、ケンは大Pや大Kで差し返しやすいキャラなので、一歩ずつ踏み込んで技を振ることが大事だろう、と答えた。", "chars": ["JP", "ケン"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 7644, "head": "中Pは置き技でなくラッシュ止め", "body": "「中Pを立ち回りで触れていない」という質問への答え。中Pは置き技ではなく、主にラッシュ止めやフレームトラップで使う技、という考え。判定は強いが、置き技としてはそれほど強くない。神木Cの対戦でも中Pを置くことはほぼないという。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 7816, "head": "大Kから大Pの入れ込みは状況次第", "body": "「大Kから大Pまで入れ込むのか」という質問への答え。入れ込まなくても、大Kが当たれば中攻撃へつなげられる。ラヴーシュカに行くなら入れ込んだほうがよい。ただし大Kだけ当たって大Pが外れてしまうと死ぬので、注意が必要だ。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】よく寝た JPベガランクマ", "date": "20260503", "duration": 12946}, {"id": "b3Zfr0Fwz6E", "game": "スト6", "summary": "EVOJ後のランクマ配信。大会で負けた試合の反省を話しながら、JPとベガでランクマを回した。今回のアクトはJPとベガを使っていく方針を語った。", "highlights": [{"t": 118, "head": "大Pの連携が見切られた試合の反省", "body": "大Pの連携や大Pラッシュからの遅らせ大Kが通っていたが、途中から大Pの連携をガードされるようになった。相手は遅らせに後ろジャンプを合わせ、前歩きガードから大Kで確定を取る動きに変わったが、自分は動きをすぐ変えられなかった。これを最大の敗因とし、後ろジャンプに変えたと分かった時点で最速大Kで固めに行くべきだったと振り返った。", "chars": ["JP"], "themes": ["offense", "neutral"], "side": "jp", "tags": ["リプレイ振り返り", "解説"]}, {"t": 255, "head": "読みを忘れて負けた最後の一戦", "body": "前日に立てた読みどおりの行動を相手がしたのに、その場で読みを忘れて垂直ジャンプをしなかったため負けた。リバーサルを押してくる癖を読んで垂直をしていれば勝てていた、という見立て。運が悪い負けではなく、内容のある反省点が残る、いい負け方だったと振り返った。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 396, "head": "今回のアクトはJPとベガを使う", "body": "このアクトはJPとベガを使っていきたいと話した。アクトの最初はあまりベガを回さず、JPをレジェンドにしたらベガを回す予定で、ベガもレジェンドにしたい考え。", "chars": ["JP", "ベガ"], "themes": ["practice"], "side": "", "tags": ["雑談"]}], "title": "【スト6】EVOJお疲れさまでした　JPベガランクマ", "date": "20260502", "duration": 5332}, {"id": "iOeE6a4i3Hg", "game": "スト6", "summary": "EVOJ前のカスタム配信。練習環境のラグ設定の見直し、PCとPS環境の差、プールで当たりそうな相手への見立て、ラシード戦での中足の使い方を話した。", "highlights": [{"t": 224, "head": "練習環境のラグ設定を本番に近づける", "body": "対戦中に動きが重いと感じ、機材を差し直した際にディスプレイ側のリフレッシュレートが60に戻るなど設定がリセットされていたと気付いた。メニュー画面で分かるほどのラグだった。垂直同期はオンにして、本番に多少近い状態で練習する方針にした。", "chars": ["JP"], "themes": ["practice"], "side": "", "tags": ["練習"]}, {"t": 3064, "head": "当たるコツは前に来そうな所で大攻撃", "body": "磁石がついているのかと聞かれ、吸い込まれるとよく言われると答えた。コツもみんなに聞かれるが自分でも答えられず、言えるのは前に来そうなところで大攻撃を振ろう、ということだけだと話した。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 3730, "head": "モダン舞には飛びが危ない", "body": "対戦中、モダン舞に飛ぶと危ないと実感し、特に飛びを気をつけた方がいい相手だと話した。直後には、モダンでなくてもSAを持っている舞に対してやってはいけない行動をしたと振り返った。", "chars": ["JP", "舞"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 6032, "head": "PCとPSの環境差を意識した練習", "body": "PSの環境で戦い、PCなら相手に確認されて死んでいた場面があったと振り返った。PCとPS環境の差を意識した練習は大事だろう、という見立て。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["練習", "雑談"]}, {"t": 9172, "head": "プールの見立て：舞とラシードが嫌", "body": "プールの反対側の山に2100帯のモダン舞が急に現れた、と話した。プール決勝の相手が2択で、どちらが来るか全然分からない。2人とも2100ぐらいで一番困る。舞にもラシードにも負けないのは相当無理で、プールで当たる相手としては一番嫌な気がする、という見立て。", "chars": ["JP", "舞", "ラシード"], "themes": ["matchup"], "side": "jp", "tags": ["大会見立て"]}, {"t": 11743, "head": "ラシード戦のまとめ：中足は控えめに", "body": "ラシード戦のあと、相手が中足をスカしてくるので、中足の打ち返しは控えめにした方が良さそうだとまとめた。ラシード戦は前々からあまり得意ではなく、無限の課題がある気がすると話した。", "chars": ["JP", "ラシード"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}], "title": "【スト6】永遠にEVOJに向けてカスタムしていく", "date": "20260428", "duration": 11857}, {"id": "fQP25E3Ed9s", "game": "スト6", "summary": "EVOJ前のカスタム配信。コンボルートの比較、チュンリー戦でのラッシュの通り方、トルバランの使い方、SFLでJPが見られなくなった理由の見立てを話した。", "highlights": [{"t": 2164, "head": "コンボルートのダメージを見比べる", "body": "同じ状況からのコンボを複数のルートで試し、ダメージを見比べた。ゲージ回収が約0.95本あり、バーンアウトもしないで済む方が高ダメージだと確認し、そちらを選んだ。バーンアウトしないなら一度走ってODトルバランに行ったほうがいいのか、と考える場面もあった。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["コンボ", "練習"]}, {"t": 4472, "head": "チュンリー戦：中段ラッシュは暴れが多い", "body": "チュンリー戦は相手が硬く、試合時間が長くなって疲れると話した。重ならない系の中段を狙うタイプのラッシュは、相手が暴れてくる率がかなり高いようで、そこを突いている場面だった。", "chars": ["JP", "春麗"], "themes": ["matchup", "offense"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 6080, "head": "SFLでJPが見られなくなった理由の見立て", "body": "SFLでJPが見られなくなった理由は、エドがきついことが大きかったのだろう、という見立て。エドかベガはどのチームにも必ずいたため、不利な側になったときに出しづらすぎたのだろうと話した。", "chars": ["JP", "ED", "ベガ"], "themes": ["matchup", "patch"], "side": "jp", "tags": ["雑談", "大会見立て"]}, {"t": 7684, "head": "トルバランが突き抜けられる場面はトリグラフ", "body": "対戦後、トルバランをひたすら突き抜けられたと振り返り、あの形はやめた方がよさそうだと話した。指摘を受け、その場面はトリグラフでよいのかと納得してメモした。", "chars": ["JP"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["Q&A", "リプレイ振り返り"]}, {"t": 7820, "head": "プールで当たりそうな相手はベガとラシード", "body": "自分のプールで当たりそうな相手はベガと、2100前後のラシードだと話した。ラシードが一番優先度は高いが、対戦できる相手があまり多くないため対策しづらい、と語った。", "chars": ["JP", "ベガ", "ラシード"], "themes": ["matchup"], "side": "jp", "tags": ["大会見立て"]}, {"t": 9845, "head": "ODトルバランを無駄に使わない", "body": "ある場面を確かめ、弱トルバランかトリグラフで足りるところで、ODトルバランを無駄に使ってしまうことがあると気付き、良くないと反省した。ただしこれもタイミングの問題で、少し離れると結果が変わってしまうため怖いとも話した。", "chars": ["JP"], "themes": ["neutral", "resource"], "side": "jp", "tags": ["練習", "リプレイ振り返り"]}], "title": "【スト6】永遠にEVOJに向けてカスタムしていく", "date": "20260425", "duration": 10326}, {"id": "195SUDYWv04", "game": "スト6", "summary": "EVOJ前のカスタム配信。視聴者の質問に答えながら、ラヴーシュカをパリィされた後の投げ、中Kがカウンターしたときの手順、中足のカウンター確認の練習法を話し、イングリッドの評価やJPの調整への見立ても語った。", "highlights": [{"t": 2756, "head": "ラヴーシュカをパリィされた後の投げ", "body": "ラヴーシュカをパリィしてきた相手を投げる目安への答え。距離が近いなら最速の前歩き投げ、遠いなら最速のラッシュ投げが分かりやすい。難しいのは最初の2段をガードした直後の投げで、気持ち待つことが大事そうだ、という見立て。実戦のリプレイ操作で何フレ遅らせれば入るかを確かめるのが分かりやすい、とも話した。", "chars": ["JP"], "themes": ["offense", "practice"], "side": "jp", "tags": ["Q&A", "コンボ", "練習"]}, {"t": 2983, "head": "中Kがカウンターしたときの手順", "body": "中Kのカウンター時に弱攻撃を押せないという質問への答え。中Kはカウンターでもキャンセルできないので、次に何かボタンを押すつもりで動く。カウンターなら弱攻撃、ガードなら中足をもう1発か差し返しの中Kに回す。トレモでヒット状況をランダムにして練習する。練習にはバトルハブが便利そう、とも話した。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4127, "head": "中足のカウンター確認の練習法", "body": "トレモでヒット状況をランダムにし、ガードされたら適当にもう1回押し、食らっていたら適当に動き、パニッシュカウンターならコンボに行く。実戦のパニッシュカウンターは動いたところに当たった状況から判断できるので、これができればほぼ対応できるだろう、という見立て。通常のカウンターはエフェクトが地味で見分けにくい。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["練習", "解説"]}, {"t": 5480, "head": "イングリッドの評価の分かれ目", "body": "イングリッドの評価についての答え。紹介映像は強そうに見えるものなので判断は保留する。注目点はビームの性能、SA2の設置技の汎用性、OD版の当て身が1フレ発生のように切り返しに使えるかで、使えれば評価は高い。JPと比べると、昇龍対空とビームがある代わりに通常技が短くSA2も微妙なキャラ、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["patch", "matchup"], "side": "", "tags": ["調整", "雑談"]}, {"t": 6010, "head": "JPの調整とヘイトへの見立て", "body": "調整はイングリッドが来るタイミングだろうと見て、JPがどんな調整を受けるかで身の振り方を考える必要があるという話。大きな調整は来ないとは思うが分からず、ヘイトが高いので追加の弱体化は常に覚悟しておく。JP使いが「難しい」と言っても、相手側から見れば結果が出ている以上は関係なく、擁護としては逆効果、という話。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 6797, "head": "組み合わせ表の確定時期の見立て", "body": "大会の組み合わせ表の最終確定は、去年が初日の4日前だったことから、今年は単純計算で来週の月曜になりそうだが、翌日に出る可能性もある。申請が出なければプール自体は変わらないが、先で当たる相手が変わる可能性や、ほかのプールから移ってくる可能性がある。", "chars": [], "themes": ["practice"], "side": "", "tags": ["大会", "雑談"]}], "title": "【スト6】一生EVOJに向けてカスタムしていく", "date": "20260424", "duration": 8539}, {"id": "8-mSJY7tMNQ", "game": "スト6", "summary": "EVOJ前のカスタム配信。対戦しながら視聴者の質問に答え、A.K.I.の対策、置き技の大攻撃の意図、ランクマの考え方、マリーザ戦、アムネジアの強みを話した。公開されたイングリッドの映像への見立ても語った。", "highlights": [{"t": 933, "head": "イングリッド初見は好みの仕上がり", "body": "イングリッドの紹介映像を見ての感想。JP使いが好みそうな仕上がりに見えるが、どんなキャラかは現状では判断できない。焦点はSA2の設置技の性能で、ビームは強そうだが溜めが必要に見える。", "chars": ["JP", "イングリッド"], "themes": ["patch"], "side": "", "tags": ["雑談", "調整"]}, {"t": 1146, "head": "A.K.I.は転ばせて投げ中心に", "body": "A.K.I.は受けが弱いキャラなので、一度転ばせて距離を詰め、投げを中心に攻めると詰ませやすいだろう、という見立て。OD技での切り返しは投げを抜けられないためだ。一方で判定が強く、特に空中技の判定が強いので飛びが強い。", "chars": ["A.K.I."], "themes": ["matchup", "offense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2999, "head": "イングリッドの当て身が評価の鍵", "body": "イングリッドは通常技が弱くJPでいいという声に対し、昇龍対空のような無敵対空に加え、ビーム・当て身・SAの設置技がどれだけ強いかが焦点と見る。特に当て身の性能が重要そうだ。説明文では弾も取れるがヒット数が多いと取れないとあり、OD波動は取れず単発の牽制波動は取れるだろう、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["patch", "matchup"], "side": "", "tags": ["調整", "雑談"]}, {"t": 5895, "head": "置き技の大攻撃の狙い", "body": "立ち回りで置いている大攻撃の意図を聞かれ、言語化できていない感覚だと答えた。どのゲームでも特定の技を言語化できない形で使うことが多かったという。相手が吸い込まれるように当たってほしいという狙いで、空振りを誘って相手がダッシュしてくる狙いは薄く、ラッシュしてきたところに当たることを期待している。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 6522, "head": "ランクマをやる・やらないの考え方", "body": "ランクマは義務ではなく、目標を達成した場合など理由があるならやらなくてよい。トレモとカスタムだけで強い人もいる。神木C自身はランクマが好きで、やる方が強くなると考えている。特定キャラの対策を積みたいときはカスタムの方が向く。", "chars": [], "themes": ["practice"], "side": "", "tags": ["雑談", "練習"]}, {"t": 7845, "head": "JP対サガットは有利と感じない", "body": "JP対サガットについて、世間で言われるほどJP側が有利とは感じないという感想。サガットはどこまで行っても苦手だという実感がある。", "chars": ["JP", "サガット"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 8179, "head": "EVOJの勝ち上がりの道は全員濃い", "body": "自分が勝ち上がった場合の組み合わせ表を先まで追うと、強い相手ばかりになる。ただしこれは出場者全員に当てはまる。EVOは後半になるほど道が濃くなり、プロしか残らないという見立て。", "chars": [], "themes": ["practice"], "side": "", "tags": ["大会", "雑談"]}, {"t": 8993, "head": "Year1のJPの大Pは強すぎた", "body": "Year1のJPは大Pが強すぎた。足元に判定がほとんど残らず、リーチのある技を持たないキャラは差し返せなかった。今は足元に判定が残り、中足などで差し返しやすい。今使うコンボにはYear1から生まれたものがあるが、当時は誰も使っていなかった。", "chars": ["JP"], "themes": ["neutral", "patch"], "side": "jp", "tags": ["雑談", "調整"]}, {"t": 9292, "head": "マリーザ戦は噛み合えば負ける", "body": "マリーザの大Kを中足で差し返すのは相当厳しい。中足は大Kと噛み合っても、ファランクスと噛み合っても負けるので怖い。マリーザ戦は噛み合えば負ける技が多く仕方がないので、自分からは一切技を振らないくらい割り切る方がよいという考え。", "chars": ["JP", "マリーザ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 9928, "head": "アムネジアにしかない強み", "body": "アムネジアは取った後に特定のコンボへ行ける点が唯一無二の強みだ。対空なども含めたトータルでは昇龍拳がよいと今は思うが、それでもアムネジアにしかない強みは間違いなくある。取った後に確定が入る技なら位置を入れ替えたり、リーサルならSAにつなげたりできる。", "chars": ["JP"], "themes": ["defense", "combo"], "side": "jp", "tags": ["解説", "雑談"]}], "title": "【スト6】まだまだEVOJに向けてカスタムしていく", "date": "20260423", "duration": 10534}, {"id": "PMEs-NY-iD8", "game": "スト6", "summary": "EVOJ前のカスタム配信。プールの見通しや、ベガ戦の垂直ジャンプ、PS5で対戦できる環境の話、トーナメント表の見方、OD技の2段ジャストパリィの練習にも触れた。", "highlights": [{"t": 215, "head": "EVOJのプールの見通しと対策", "body": "プールの見通しは、ウィナー側で約1700のベガの人と当たりそうで、勝つと約2000のラシードの人と当たりそう、というもの。そのためチュンリーとラシードあたりの対策が大事そうだ。上がってくる相手によってはテリーも一応やっておいた方がよさそうだと話した。", "chars": ["JP", "ベガ", "ラシード", "チュンリー"], "themes": ["matchup"], "side": "jp", "tags": ["大会", "キャラ対策"]}, {"t": 1782, "head": "ベガ戦の垂直ジャンプとバクステ", "body": "ベガ戦で垂直ジャンプは大事かという質問への答え。ダブルニープレスや大Pに噛み合えば確定が取れてコンボに行けるので大事だが、ベガ側も垂直を見て弱攻撃や対空のジャンプ中Pからコンボに行ける。バックステップの方がリスクは低く、垂直を対空で落とされるならバックステップに切り替える。上のレート帯ほど垂直を読まれる。", "chars": ["JP", "ベガ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 3294, "head": "PS5で対戦できる環境を使いたい", "body": "PS5で対戦できる環境があるなら使っておきたいという話。自宅でPS5を出して繋ぎ直して対戦するのは面倒で、環境が用意されている方が楽だ。自宅でやるなら、Steamで入力遅延の軽減をオフにするなど細かい調整で近づける手もあるが、神木C自身はやっていない。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["練習", "雑談"]}, {"t": 4756, "head": "トーナメント表は手前まで見る", "body": "組み合わせ表は、まず初日のベガ戦と、その次のチュンリー戦までをきちんと見る。ルーザーズに落ちた場合は落ちてから考える。大会は思い通りに進まず、あの人が負けたという番狂わせが必ず起きるので、先まで読み込みすぎないという考え。", "chars": [], "themes": ["practice"], "side": "", "tags": ["大会", "雑談"]}, {"t": 8921, "head": "OD技の2段ジャストパリィ練習", "body": "OD技を2段ジャストパリィしておくと、SAで返せるという地味なやり込みポイントがある。難易度は高いが、暇なときに練習する分には良さそうだ。神木C自身もまだ2段ジャストパリィができていない、と話した。", "chars": ["JP"], "themes": ["defense", "practice"], "side": "jp", "tags": ["練習", "解説"]}], "title": "【スト6】EVOJに向けてカスタムしていく", "date": "20260421", "duration": 9340}, {"id": "P7lgTe_au9s", "game": "スト6", "summary": "EVOJのトーナメント表を見て、ベガのランクマから、ラシードとチュンリー対策の練習に切り替えると決めた配信。視聴者の質問にも答え、大Pからのトルバランの入れ込み、連携を入れ込んだ後のコンボ、設置後の起き攻めでの大Kの扱いを話した。", "highlights": [{"t": 2441, "head": "グラマス帯の伸びしろの見立て", "body": "グラマスやハイマス帯では、伸びしろの出どころはある程度決まっている気がする、という見立て。JPならコンボが安い、確定反撃を取れていない、ドライブの管理が微妙、といった点を挙げた。", "chars": ["JP"], "themes": ["practice", "resource"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 3085, "head": "メインはJP、ベガはサブ", "body": "JPとベガはダブルメインかという視聴者の問いに、JPがメインでベガはサブと答えた。ベガがまだまだいけると感じたらダブルメインも考えなくはないが、現状はJPメインだ。JPのミラーが嫌い、という話も添えた。", "chars": ["JP", "ベガ"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 4265, "head": "EVOJに向けた練習の優先度", "body": "EVOJのトーナメント表を見て、練習の優先度を決めた。プールの当たり方から、ラシード、チュンリー、ベガの順に優先するだろう、という見立てで、ベガは一旦封印してラシードとチュンリー対策に向かう。大会はPS5環境のはずなので、見てから対応するような難しい対策は避ける。", "chars": ["JP", "ラシード", "春麗", "ベガ"], "themes": ["practice", "matchup"], "side": "jp", "tags": ["大会", "練習"]}, {"t": 4779, "head": "大Pからトルバランを入れ込む場面の考え方", "body": "大Pからトルバランを入れ込んでパニカンのリターンを取れない、という質問への答え。固めの時は本人も入れ込むことが多いが、毎回ではない。大Pを押した時に相手が動いているのが見えたら一瞬落ち着くとよい。パニカンやカウンターの可能性が高いので、入れ込むにしてもラッシュなどにする手がある。パニカンを確認してトルバランをキャンセルし、大Kでリターンを取ることもできるが難しい。", "chars": ["JP"], "themes": ["offense", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 5222, "head": "連携を入れ込んで大Pが当たった時のコンボ", "body": "連携を最後まで入れ込み、相手が大Pを食らった状態になった時のコンボ選択の質問に答えた。中央ではほとんどやらないため答えを忘れたと断った上で、ド密着なら中足で地面に貼り付けて、いつものコンボにつなげられると話した。これが一番簡単だろう、という見立て。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 6773, "head": "設置後の起き攻めで大Kを入れ込まない理由", "body": "大Pから設置の起き攻めで、大Kを打ち切って中足にすべきかという質問への答え。入れ込まない方がよい。入れ込むと、相手が上を入れっぱなしにしていた時にマイナス10台の大きな不利を背負うからだ。大K、大P、SA2とつなぎたい時だけ入れ込み、基本は大Kだけ打ち切って、当たっていれば中足や中段、暴れ潰しに行く。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】EVOJのトナメ見たりランクマしたりする", "date": "20260420", "duration": 7899}, {"id": "H1eezSRzVzw", "game": "スト6", "summary": "ベガとJPでランクマを回しながら、視聴者の質問に答えた配信。ジュリの突進へのジャストパリィ、ルークのフラッシュナックル対策、JPでのブランカ戦、JPミラーの読み合い、対空の大Pからのキャンセルを話した。", "highlights": [{"t": 4380, "head": "JP使いが昇龍対空のキャラを避ける理由", "body": "JP使いは通常技対空に慣れきっているため、元々昇龍系のキャラを使っていた人がJPを使い始めたケース以外では、昇龍対空のキャラはあまり使いたくないと思っているだろう、という見立て。", "chars": ["JP"], "themes": ["antiair"], "side": "jp", "tags": ["雑談"]}, {"t": 7640, "head": "ガチの対策動画をどう考えるか", "body": "30秒ではないガチの対策動画をという要望に対し、どのレベル感を想定するかが難しく、感覚派なので悩むと話した。30秒対策は誰でも見たらすぐできることがコンセプトで、改めて考えること自体は実力向上につながっているため、やるのはありかもしれない、という考え。", "chars": [], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 8299, "head": "ジュリの歳破衝にはジャストパリィ", "body": "ジュリが歳破衝で突っ込んでくる場面の対処を補足した。そのままガードしても大きな不利は背負わない。ジャストパリィを狙うと大きい反撃が入り、ベガは特に大きい。ジャストにならずパリィになっても8フレ有利で確定が取れる。唯一の裏目は連携を出し切られることで、パリィすると不利を背負って投げられるだろうが、この択はジュリ側がマイナス12を背負う危険なものだ。", "chars": ["ジュリ"], "themes": ["defense", "system"], "side": "", "tags": ["解説", "キャラ対策"]}, {"t": 8580, "head": "ルークのフラッシュナックルへの対処", "body": "ルークが大フラッシュナックルで有利を取りに来る場面の対処。基本は見てインパクトだが、SAキャンセルが効くのでSAで返される。相手にSAがある時は通常技かジャストパリィで止める。うっかりガードした時はドライブリバーサルが確定するので、ゲージに余裕があればリバーサルで状況をリセットする。", "chars": ["ルーク"], "themes": ["matchup", "defense"], "side": "", "tags": ["解説", "キャラ対策"]}, {"t": 8779, "head": "JPでブランカと戦う時の注意", "body": "JPでブランカと戦う時の話。ブランカはODロリで接近したがることが多い。エアロリは裏が微妙な距離で当たると確定がなく、ODロリは最低空で当たるとブランカ有利になるため、こちらが有利かどうかは見ておきたい。有利でも必ずボタンを押してよいとは限らず、あえて押さない選択肢もありえる。", "chars": ["JP", "ブランカ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 9265, "head": "JPミラーのしょうもない読み合い", "body": "JPミラーで一番しょうもない読み合いの話。大Pからストリボーグにつなぐコンボの後にトリグラフ設置を最速で出すと、相手のリバーサルのトリグラフにパニカンが取れる。トリグラフをガードしたら、ノーマルのトリグラフはガードした側が有利なので、基本はトリグラフを打ち返す。理想はジャストパリィのトリグラフだが、本人はできない。", "chars": ["JP"], "themes": ["setplay", "defense"], "side": "jp", "tags": ["Q&A", "JPミラー"]}, {"t": 9830, "head": "対空の大Pからのキャンセルは何がよいか", "body": "対空の大Pからのキャンセルは何がよいか、という質問への答え。一番ありえないのは通常の設置で、相手がちゃんとしていれば確定を取られる。自分はいつもトルバランで、フェイントか出し切りにする。相手の動きで使い分け、何もしてこない相手なら出し切り。OD設置は少し不利だが確定は取られず、それもありだ。", "chars": ["JP"], "themes": ["antiair", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】宇宙一治安の良いランクマとかカスタムとか", "date": "20260419", "duration": 12230}, {"id": "B5JTWjBgseo", "game": "スト6", "summary": "ベガのランクマをしながら、視聴者のリクエストに答えて解説した配信。テリーのファイヤーキックからの攻めへの対応、自分がよく使う差し返し、大足の確定反撃、ジュリの技へのジャストパリィなどを話した。", "highlights": [{"t": 8710, "head": "ファイヤーキックからの攻めには小P", "body": "テリーのファイヤーキックからの攻めへの対応。基本は立ち小Pを最速で押す。ラッシュを見てドライブリバーサルが理想だが難しく、小Pを押しておけばラッシュ以外には勝てるつもりでよい。JPはしゃがみ小Pで十分なので、立ちを挟まなくてよく、考えることが1つ減る。練習は、テリーにファイヤーキックからのクラックシュートとラッシュを覚えさせて試すとよい、という見立て。", "chars": ["テリー", "JP"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "Q&A"]}, {"t": 9251, "head": "オート差し返しの距離と使い方", "body": "自分がよく使うオート差し返しの紹介。いい距離で振ると、相手が小技で暴れてきたところにちょうど勝つ。相手が最速の中足で打ち返してきたら負けるが、4フレほど遅れると勝てる。画面端でよく使い、試合の決まり手になることが多い。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 9763, "head": "大足の確定は中Kから入る", "body": "大足の確定反撃で、頭を使わずに済むのは中Kだ。マイナス10しかない大足には大技が要らず、先端気味の距離でも中Kなら届くので、この手の大足には中Kから入る。ほかのつなぎ方もできるが、確認が面倒でゲージ効率もよいため、基本はODストリボーグまで入れ込む。中Kがガードされても、ODストリボーグなら有利が取れて攻めを続けられる。", "chars": ["JP"], "themes": ["combo", "neutral"], "side": "jp", "tags": ["解説", "コンボ"]}, {"t": 9969, "head": "ジュリの中風破刃に6フレ技を押す", "body": "ジュリの中風破刃はガードさせてマイナス6なので、届くか分からなくても、6フレで触れる技をとりあえず押しておくのが意外と大事だ。届かなければどうせ技は出ず、届けば当たって得をする、という考え方。", "chars": ["ジュリ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 10487, "head": "ジュリの突進にはジャストパリィを入れ込む", "body": "ジュリが大暗剣殺で突進し、最後の歳破衝まで入れ込んでくる場面。その歳破衝のタイミングでジャストパリィを入れ込むと確定が取れる。ミスしてガードやただのパリィになっても大きな不利はない。最大の裏目は大暗剣殺だけで止められることだが、ジュリ側がマイナス12を背負う極大リスクの択で、初手でやってくることはよほどない、という見立て。", "chars": ["ジュリ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】ベガランクマとかJPカスタムとか", "date": "20260418", "duration": 10743}, {"id": "Q-NTE6rpF9o", "game": "スト6", "summary": "D4CUP第二回予選に出た配信。ルーザー側に回ったあとダルシムに勝ってトップ128に進み、次のエレナ戦で敗れた。エレナ戦の呼び合い、カスタムで練習したキャラには負けにくいこと、次の大きな大会EVO Japanに向けた優先順位を話した。", "highlights": [{"t": 3916, "head": "大P設置の入力ミスで確定反撃を受けた", "body": "直前の対戦で、大Pからの設置を狙って入力を誤り、しゃがみ大攻撃が出て確定反撃を受け、そのまま負けた、と振り返った場面。しょうもないミスで、いちばんやってしまいたくない負け方だった。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["リプレイ振り返り", "セットプレイ"]}, {"t": 5270, "head": "ダルシム戦のバーンアウト中の読み合い", "body": "ダルシム戦を終えて、バーンアウト中はダルシム側がトリグラフにワープを噛み合わせたくなる一番のシーンで、必然ではあった、と振り返った。この試合はぎりぎりで勝ち、トップ128に残った。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "resource"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}, {"t": 5801, "head": "エレナ戦はコロコロの呼び合いが難しい", "body": "JP対エレナを、ダルシム戦に近いと見た。ダルシムがトリグラフにワープを噛み合わせてくるのと同じように、エレナのコロコロを噛み合わされて負ける呼び合いが起きていて、そこが難しいと振り返った。", "chars": ["JP", "エレナ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}, {"t": 6688, "head": "カスタムで練習したキャラには負けにくい", "body": "カスタムマッチでやり込んだキャラにはあまり負けておらず、この日もダルシムには勝った。大会に向けては、対策が漏れているキャラをなるべく減らすことがこれから大事になるだろう、という見立て。エレナ戦は経験不足で、エレナ使いを探す必要があると振り返った。", "chars": ["JP", "エレナ"], "themes": ["practice", "matchup"], "side": "", "tags": ["練習", "考え方"]}, {"t": 7213, "head": "テリー戦の敗因は大きなコンボミス", "body": "この日テリーに負けた試合は、大きなコンボミスが原因で、カスタムで練習したかどうかとは関係ないと話した。その後にもう1戦落としたのは自分の責任だった。流れが悪くなる以前に、コンボミスのあとバーンアウトを取られて負けた、いちばんやってはいけないタイプのコンボミスだったと振り返った。", "chars": ["JP", "テリー"], "themes": ["combo", "practice"], "side": "", "tags": ["リプレイ振り返り"]}, {"t": 8581, "head": "次の大きな大会はEVO Japan", "body": "次にある大きな大会はEVO Japanで、組み合わせが出たら、そこで当たりそうなキャラの対策を最優先にする。エレナは今のままでは上位勢に勝てなそうなので、練習が必要という見立てを話した。", "chars": ["エレナ"], "themes": ["practice", "matchup"], "side": "", "tags": ["大会", "練習"]}], "title": "【スト6】D4CUP第二回予選→負けたので軽ランクマ", "date": "20260417", "duration": 9383}, {"id": "vSWEsptAeec", "game": "スト6", "summary": "ベガでのランクマ中心の配信で、翌日の大会に向けた話もした。JPについては、対空無敵の有無、キャミィ戦のベガとJPの比較、ダルシム戦でのトリグラフとワープの噛み合いを話した。30秒対策の動画ネタに向かないキャラの話もした。", "highlights": [{"t": 2068, "head": "対空無敵がないのはJPとダルシムだけか", "body": "対空無敵のある技を持たないキャラを挙げていくなかで、ダルシムのブラストは無敵がなく判定が強いだけだと知った。対空無敵がないのはダルシムとJPだけになるだろう、という見立てだった。", "chars": ["JP", "ダルシム"], "themes": ["antiair", "defense"], "side": "jp", "tags": ["雑談"]}, {"t": 2393, "head": "キャミィ戦はJPよりベガが楽そう", "body": "キャミィ戦の有利不利を、キャミィ使いが出した個人的な表で見た。その表ではベガは有利、JPは微有利とされていた。神木Cは、サイコの技がある分ベガのほうがよいのでは、という印象を持っていた。", "chars": ["JP", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 6030, "head": "30秒対策にできないキャラ", "body": "30秒対策の動画ネタとして、ダルシムは「ワープを落とそう」くらいしか言えないと感じた。これまでに30秒対策を検討して無理だと結論したのはジュリとキャミィで、普通に強い普通のキャラなので「ここはこう」と言える要素がない、と話した。", "chars": ["ダルシム", "ジュリ", "キャミィ"], "themes": ["matchup"], "side": "", "tags": ["雑談", "動画ネタ"]}, {"t": 8130, "head": "ダルシム戦はワープを待って投げる", "body": "ダルシム戦は嫌いではない。ダルシムのワープがトリグラフに噛み合うと終わるが、そこをうまく待って投げたりするとよい。この日はそのタイミングが合わず、逆にトリグラフにワープを噛み合わされて負けた。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}], "title": "【スト6】ベガランクマとかJPカスタムとか", "date": "20260416", "duration": 9220}, {"id": "RwBFCqfbtrA", "game": "スト6", "summary": "ベガのランクマ中心の配信。アレックスやエドの対策の質問に触れつつ、JPについてはヴィーハトの挙動への見方と、画面端に追い詰める時間が長いことに関連して前飛びからの垂直空投げを話した。30秒対策の動画に出さない対策の基準にも触れた。", "highlights": [{"t": 962, "head": "アレックスに勝てないときの心得", "body": "視聴者から、アレックスに勝てないので「これだけは知っておくべき」という対策を聞かれた。構えが見えたらガードし、構え中はガードができないので、とりあえず弾やトリグラフを追っておくといいことが起きやすい、と答えた。", "chars": ["JP", "アレックス"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 2852, "head": "JPのヴィーハトの挙動は仕様か", "body": "視聴者から、JPのヴィーハトの挙動が仕様だったと指摘を受けた。仕様のはずがないと考え、仕様なら仕様、違うなら違うと早めに宣言してほしいと話した。ブランカもJPも特殊な状況が起きやすいので予定外の挙動が出やすいのかもしれないが、直すのは一瞬で終わりそうだ、という見立て。", "chars": ["JP"], "themes": ["patch", "system"], "side": "jp", "tags": ["調整"]}, {"t": 3436, "head": "アレックスは当たって嫌なキャラ", "body": "アレックスは弱いという評価が固まってきているが、よく分からないまま戦うと普通に負けるので、いちばん嫌なタイプのキャラだ。大会で当たっても「ラッキー」とはならない。このゲームにはそう思えるキャラがいない、とも付け加えた。", "chars": ["アレックス"], "themes": ["matchup"], "side": "", "tags": ["キャラ対策", "雑談"]}, {"t": 6503, "head": "前飛びからの垂直空投げで端に戻す", "body": "自分の追い詰め時間が長い理由は分からないとしたうえで、JPは前飛びを重ねたとき、相手が前ジャンプしていれば垂直空投げで相手を画面端に戻せるので、追い詰める時間が増えやすいかもしれない、と話した。相手がめくり技を出していると食らうので、その点には注意が要る。中央に投げてしまうという視聴者には、バックジャンプから投げているのだろうと答えた。", "chars": ["JP"], "themes": ["antiair", "offense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 7657, "head": "30秒対策に出さない対策の基準", "body": "エド戦で話題に出た難しい対策は、30秒対策として出すと「難しすぎる」「できれば苦労しない」と怒られるので出さない、と判断した。裏がない対策がよく、「こうすると、ただし相手にも裏がある」という対策は優先度が下がる気がする、という個人的な見方を話した。", "chars": ["ED"], "themes": ["practice", "matchup"], "side": "", "tags": ["考え方", "動画ネタ"]}], "title": "【スト6】神木ベガ　動画ネタも考えたい", "date": "20260415", "duration": 12312}, {"id": "GBiKAIdv4FQ", "game": "スト6", "summary": "ランクマとカスタムを回しながら視聴者の質問に答える配信。差し返しに使う技の選び方、設置と一緒にどう攻めるか、ラッシュを止める技、JP使いがベガも使う理由を話した。後半はカスタム後に、SAに行く形の少なさや空投げ・大足を使うべきことを振り返った。", "highlights": [{"t": 1273, "head": "ジャストパリィのバグ修正への期待", "body": "明日のメンテナンスで、ジャストパリィの補正がヴィーハトのときにかからないバグが直ればという話。主な問題はジャストパリィ後にラッシュが出ない件だろうという見立てで、画面端でSAをガードしたときはラッシュを出さず、大攻撃から入るようにしている。JP固有のバグはやり込むほど致命的になるので、早めの修正を望んだ。", "chars": ["JP"], "themes": ["patch", "system"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 2538, "head": "JPに移行中の人へ：弾と設置から", "body": "JPへ移行中の視聴者への助言。JPは難しいが、とりあえず弾を撃つことと、ダウンを取ったらなるべく設置することをやれば、それなりに形になるだろうという見立て。", "chars": ["JP"], "themes": ["practice", "setplay"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 3020, "head": "差し返しは基本中K、長い技には大P", "body": "差し返しにどの技を使うかという質問への答え。基本は中Kで、足元判定との兼ね合いから、ほとんどの場合は中Kのほうが差し返しやすい。猶予が長く判定が残り、リーチもある技に対しては大Pで差し返す。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 4526, "head": "設置と一緒にどう攻めるか", "body": "設置と一緒に攻める形ができないという質問への答え。距離による。近ければ、設置してから徐々に前へ歩く行動でも許されるだろうという見立て。設置したからこうしなければならないという形はなく、何でもできる時間が来たという意識でよい。無理に攻撃せず、歩いて自分のゲージを回収してもよい。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 4707, "head": "ラッシュを止める技は大体中攻撃", "body": "ラッシュを止めるのに使う技はキャラごとに使い分けるべきかという質問への答え。細かく考えず、大体は中攻撃で止めてよい。中Pや中Kは判定が強いのでその良さが出やすい。スタンダードはしゃがみ中攻撃。", "chars": ["JP"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["Q&A"]}, {"t": 4952, "head": "JP使いがベガも使う理由", "body": "JP使いはベガも使いがちという話への答え。JPとベガは相性の補完がよく、JPミラーが嫌なときにベガをぶつけられる。ベガは対空ができるのが強みで、JPのキャラクター性が好きな人はベガも好きだろう、という見立て。", "chars": ["JP", "ベガ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 7202, "head": "カスタム後：SAに行く形が少ない", "body": "カスタムの振り返り。ルートだけではないが、SAに行くルートの少なさが課題だと話した。JPは入れ込みがちなのでインパクトが通りやすい。画面中央のチャンスでもSAに行く状況がほとんど発生せず、大Pと中攻撃しか振っていなかった。画面端で固める場面がなかったので、そこは分かりにくいとも話した。", "chars": ["JP"], "themes": ["combo", "resource", "practice"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 7392, "head": "空投げと大足は使ったほうがいい", "body": "空投げも大足も一度も使ったことがないという相手に、強いので使ったほうがいいと答えた。空投げは実質的なリターンが非常に高い。アムネジアを嫌って垂直ジャンプをしてくる相手が多いので、その意味でも使う価値がある。", "chars": ["JP"], "themes": ["offense", "antiair"], "side": "jp", "tags": ["解説"]}, {"t": 7589, "head": "大Pキャンセルラッシュは強い", "body": "JPといえばシューティングのイメージが強く、大Pキャンセルラッシュは忘れがちだが強い。今回2300に上がれたのは、ほぼ遅らせた大Pラッシュが刺さりまくったおかげだろう、という実感を話した。", "chars": ["JP"], "themes": ["offense", "combo"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】レジェJP カスタムとか質問とか募集", "date": "20260414", "duration": 7925}, {"id": "vn8DB9xIkEU", "game": "スト6", "summary": "2300到達の直後に開いたカスタム中心の配信。リリー戦ではヴィーハトの設置後にOD技をジャストパリィする大切さを話した。モダンキャミィは課題のキャラで、設置の通し方、差し返し、飛びへの対空が出ない問題を振り返った。", "highlights": [{"t": 3001, "head": "リリー戦はOD技をジャストパリィ", "body": "リリー戦の質問への答え。ヴィーハトを設置すると、リリーはOD コンドルスパイアで抜けたくなる。ヴィーハトを貼って立ち回りに戻ったら、OD コンドルスパイアを見てジャストパリィする。これがいちばん大事で、ミスしてもよいから試みる。一度でも成功すれば、リリー側はやりづらくなる。", "chars": ["JP", "リリー"], "themes": ["matchup", "setplay"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 3318, "head": "モダンキャミィが課題のキャラ", "body": "モダンキャミィに勝てず、本当に苦手だと話した。最近の大会でも大体キャミィに負けている。JPとキャミィの組み合わせは最初期からの課題だ、という話。", "chars": ["JP", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 4185, "head": "モダンキャミィ戦の設置の通し方", "body": "設置を通したいという質問への答え。神木C自身は安全寄りの設置しかしない方で、ぼったくる設置が少ない。モダンキャミィはぼったくって勝つ行動がしづらい相手だという見立て。ヴィーハトを置いた時にキャノンストライクで飛んでくることが結構あるだろうから、置いた後に大攻撃を出すのがありえる。特に今は大攻撃から起爆できる。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "setplay"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 4560, "head": "アムネジア後の有利不利を把握する", "body": "JPをしっかり使いたいなら、アムネジアを取った後にどの技が確定するか、有利か不利かをそこそこ把握したほうがいい。ここで取り逃している場面がある。", "chars": ["JP"], "themes": ["defense", "combo"], "side": "jp", "tags": ["解説", "練習"]}, {"t": 5011, "head": "大会序盤の相手のレート帯の見立て", "body": "大会の初日は記念参加の人も多く、マスターに届いていない人としか当たらない回もある。本家のEVOではほぼそうなるが、日本の大会では野生のレジェンドが多く、最初のプールから当たる相手の最低レートでもマスターというパターンも十分ありえる、という見立て。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["雑談"]}, {"t": 5252, "head": "キャミィの大Kは中Kで差し返す", "body": "モダンキャミィ戦の振り返り。立ち回りの大Kは見ていれば差し返せそうで、差し返しの技は中Kだ。JPは中Kが圧倒的に便利だという考え。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 6605, "head": "キャミィの飛びに対空が出ない", "body": "モダンキャミィの飛びに対して対空が出なさすぎる、と振り返った場面。傾向ははっきりしているが、そこへ対応するのは難しいと話した。カスタムを通じて、課題がはっきりした気がする、と話した。", "chars": ["JP", "キャミィ"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}], "title": "【スト6】レジェJP 2300なったからカスタム", "date": "20260412", "duration": 7762}, {"id": "MPaucCetMzA", "game": "スト6", "summary": "ランクマとカスタムを回しながら視聴者の質問に答えた長い配信。大Pラッシュを遅らせる使い方、ガードさせた後の選択肢、設置するタイミング、画面端での設置とドライブゲージの目安、新しいことを試すときの練習の場所などを話した。", "highlights": [{"t": 1990, "head": "キンバリーの飛びに大Kで対空", "body": "キンバリー戦で、相手が手前で肘落としを出してくる前提を踏まえ、飛びに大Kで対空することをもっと意識しなければと振り返った場面。この点が上手な相手が増えてきたという実感も話した。", "chars": ["JP", "キンバリー"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["キャラ対策", "リプレイ振り返り"]}, {"t": 2672, "head": "大Pラッシュを遅らせる型が自分の中で流行り", "body": "視聴者から大Pラッシュの動画が役立っていると言われ、神木Cは、最近は大Pラッシュを遅らせる型が自分の中で流行っていると話した。相手がみんな小Pを押してくるから、という理由だった。", "chars": ["JP"], "themes": ["offense", "combo"], "side": "jp", "tags": ["解説"]}, {"t": 4097, "head": "レジェンドボーダー終盤の見立て", "body": "今アクトのレジェンドボーダーの終盤について。最後にゴールデンウィークが入るので、少し上がるだろうという予想。ただし最終日の5月1日はEVO Japanの初日なので、そこではほとんど動かないのではないか、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["雑談"]}, {"t": 7314, "head": "設置はどんなときにするか", "body": "設置するタイミングの質問への答え。技を無理やり引っかけて当てた後のコンボの締めが基本になる。立ち回りで適当に設置するのも強いが、相手がそれなりに強くなると厳しい。OD トリグラフをガードさせた後や、暴れの通常技を当てた後にも置く。", "chars": ["JP"], "themes": ["setplay"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 7640, "head": "画面端に追い込んだら下がらない", "body": "相手を画面端に追い込んだのに、自分から下がっていってしまう人は結構多い。どのキャラでもそうだが、特にJPは画面を走ると大きなリターンが出やすいので、戦略的な理由がなければあえて下がらないほうがいい、と話した。", "chars": ["JP"], "themes": ["offense", "neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 8617, "head": "画面端の設置はドライブゲージ3本が目安", "body": "画面端でトリグラフから設置するときの、ドライブゲージの目安の話。トリグラフを撃った時点で3本ほどあれば同じセットプレイをループできるので、それを基準にしている。2本ぎりぎりだと終わった後にゲージが厳しい。択が通ったときにもう一度同じセットプレイができるかで判断する。", "chars": ["JP"], "themes": ["resource", "setplay"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 8933, "head": "新しいことはランクマ以外で身につける", "body": "新しいことを試すときはレートが下がる。レートが下がるのが嫌なら、バトルハブ・カスタム・カジュアルで、ある程度身についたと思えるまでこもるのがよい。自分はランクマ魔人なのでつい試してしまうが、本来はそういう使い方が望ましいはずだと話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 9394, "head": "大Pラッシュをガードさせた後の選択肢", "body": "大Pラッシュをガードさせた後の選択肢は何かという質問への答え。無敵技をガードできる遅らせ投げ、最速の技に勝つダッシュ大Kなどが選択肢になる。ざっくりは遅らせ投げなどで、細かい使い分けは動画を見てもらいたいと話した。", "chars": ["JP"], "themes": ["offense", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 10493, "head": "大Pのあとはラッシュ、OD設置はしない", "body": "中央の大PからのOD設置について聞かれ、全くしないので言語化できないと答えた。相手がインパクトを押していると、OD技でゲージを使ったうえにインパクトを食らい、大きくゲージを失う。中央で大Pをガードさせたら、ほぼラッシュに行く。", "chars": ["JP"], "themes": ["offense", "resource"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】レジェJP 今日こそ二桁順位に戻したい気持ち", "date": "20260411", "duration": 10827}, {"id": "SCZlskkcv3s", "game": "スト6", "summary": "ランクマを3時間半続けながら視聴者の質問に答えた配信。ラッシュを止める読みと距離の限界、ジュリ戦の考え方、設置がある場面の対空とコンボ、ジャストパリィされる連携への対処、トリグラフ後の入力のコツを話した。強い人は無敵技の思い切りがよいという見立ても述べた。", "highlights": [{"t": 1805, "head": "ラッシュ止めの読みと距離の限界", "body": "ラッシュを止められた理由への答え。直前の試合で相手がパリィにラッシュを仕込んでいたため、大Pからトルバランのフェイントにもパリィラッシュが入っているはずだと読み、一瞬待って落とした。反応だけでラッシュを止められるかという質問には、遠い距離なら止められるが、大Pのフェイントの距離では厳しいと答えた。", "chars": ["JP"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2319, "head": "強い人は無敵技の思い切りがいい", "body": "強い人は他のゲームでも、無敵技を打つ思い切りがよいという見立て。伸び悩む人ほど昇龍拳を打つのが下手、という妙な思い込みを持っていることもありそうだという印象。昇龍拳がうまいは他人が言うと悪口になりがちだが、実際には褒め言葉であり、超大事なことだ。", "chars": [], "themes": ["defense", "practice"], "side": "", "tags": ["雑談"]}, {"t": 2560, "head": "JP対ジュリは相手の迫り方で対応を変える", "body": "JPでジュリと戦うのは難しいという質問への答え。そもそも噛み合いが悪く、ある程度は仕方がないと考える。ジュリがどう迫ってくるかを見て対応を変えるのが大事で、前ステで来る人にはODトルバランで歳破衝を消しつつ確定を取り、前飛びには空投げを入れる。ODトルバランを読んで飛ばれるとフルコンで負けるため、相手の傾向を見る。", "chars": ["JP", "ジュリ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 4159, "head": "設置中の対空はコンボにならない", "body": "設置がある状態で飛ばれ、しゃがみ大Pで対空した場合の質問への答え。ただの飛びを落としても、フォースダウンにならない限りコンボはつながらない仕様で、設置があっても変わらない。コンボではODストリボーグを使う。ラッシュは3本使い、コンボが終わるまで回復しないが、ODストリボーグは2本で済み回復もすぐ始まるので、ゲージ効率とコンボ安定のために選んでいる。", "chars": ["JP"], "themes": ["antiair", "combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 6105, "head": "ジャストパリィされる連携は投げで返す", "body": "密着のOD設置がジャストパリィされがちで、新しい択も増やしたいという質問への答え。ジャストパリィや無敵技を許容できること自体が強みだ。ジャストパリィしてくる相手には投げを通せばよく、それで相手がパリィしにくくなれば、素ガードに対して中下段の択をかけられる。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 12196, "head": "トリグラフ後の入力は出終わりを待つ", "body": "画面端でトリグラフから先へつなぐのが安定しないという質問への答え。トリグラフの後に続く技はキャンセルではないので、素早く連続で入れると早すぎる。トリグラフが出てから次の技が出るように入力し、キャンセルとは別の感覚だと意識する。猶予は結構あるので、心に余裕を持ち、トリグラフが出終わった後に入力するくらいでよい。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】レジェJP 二桁順位にしたい気持ち", "date": "20260410", "duration": 12917}, {"id": "hQ3PylyyOcY", "game": "スト6", "summary": "JPのランクマ配信。しゃがみ小Pから後ろ入力へ移るときの暴発への質問に答え、アレックスの構えへの見立て、モダンでのJPの適性を話した。", "highlights": [{"t": 2584, "head": "しゃがみ小Pの後の後ろ入力が暴発する", "body": "しゃがみ小Pのあとに後ろへ入れる動きで、別の技が出てしまうという質問への答え。使うコントローラーにもよるが、スティックだと斜めが漏れやすいだろう。十字キーなら、下を入れた後にちゃんと後ろを入れる。どちらも斜め下が入らないようにするのが基本で、アナログスティックだと難しそうなので、一度ニュートラルに戻すことになるだろう。", "chars": ["JP"], "themes": ["practice", "offense"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4401, "head": "アレックスの構え中は中Kとしゃがみ技", "body": "アレックス戦の見立て。ブレイカースタンスに入られると、普段よく使う技がほとんど当たらず、中Kやしゃがみ技は当たる。構えが遠くで見えたらトリグラフを撃てばよさそうだ。スタンピードには垂直ジャンプを噛み合わせられればよく、これがいちばん簡単な対処だ。", "chars": ["JP", "アレックス"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 5389, "head": "モダン適性ゼロのキャラはJPという見立て", "body": "モダン適性ゼロのキャラといえばJPだという見立て。モダンでは使えなくなる技の影響が大きく、クラシックの攻略がほとんど応用できないうえ、攻略もクラシックの人と共有しにくい。そのうえ火力が低いキャラという印象だ。神木Cはモダンの JP を使っていないため、あくまで印象の話だ。", "chars": ["JP"], "themes": ["system"], "side": "", "tags": ["雑談"]}], "title": "【スト6】レジェJP 今日もランクマ", "date": "20260409", "duration": 8413}, {"id": "oENeZfFwNPg", "game": "スト6", "summary": "JPのランクマ配信。視聴者の質問に答え、中P起爆の使いどころ、豪鬼・ジュリ・キャミィ戦の意識点、豪鬼への空対空にジャンプ中Pを使う理由を話した。強いキャラに人が集まる環境とJPの特殊性についての見立ても述べた。", "highlights": [{"t": 3188, "head": "中P起爆は使いすぎると合わせられる", "body": "中Pを使うかという質問に、よく使うと答えた。ただ中P起爆は誰もが使いたくなるため、そのタイミングに飛びやインパクトを合わせる人が増え、以前ほど無条件には使えなくなった。飛びが噛み合う相手には落とす対応も要るという考え。キャミィのアクセルスピンナックルが適当な中Pで止まる点は大きいが、キャミィ戦はまだ試せていない。", "chars": ["JP", "キャミィ"], "themes": ["setplay", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 5024, "head": "豪鬼・ジュリ・キャミィ戦の意識点", "body": "豪鬼・ジュリ・キャミィ戦で意識することへの答え。豪鬼は体力が9000しかないため、一度崩すとそのまま流れで勝つことが多い。ジュリはいちばん難しいと思う、という見立てで、ラッシュは頑張って止めたい。歳破衝の後に前ステで来る人には、見てからODトルバランを打つと技を消しつつ当てられるが、飛ばれると食らうので傾向を見る。3キャラともJP側がやりづらい組み合わせで、ある程度は仕方がないと思ったほうがよい。", "chars": ["JP", "豪鬼", "ジュリ", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5279, "head": "豪鬼への空対空はジャンプ中P", "body": "豪鬼への空対空はジャンプ大Kかという質問に、ジャンプ中Pだと答えた。ジャンプ中Kは素当てでコンボに行けるが届く範囲が短い。遠くで当ててフォースダウンを取る狙いなら、リーチの長いジャンプ中Pが向く。通常の飛びへの空対空ではジャンプ中Kが一般には推されるが、神木Cはつい中Pを使ってしまう。", "chars": ["JP", "豪鬼"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 7024, "head": "強いキャラに人が集まる中でJPは残る", "body": "操作感が近い別キャラに移りやすいキャラ群は、そのときいちばん強いキャラにみんなが移り、最強が決まるとそのキャラばかりになるという見立て。JPは特殊で同じ操作感のキャラが他にいないため、最も弱かった時期でも、勝つことを最優先する人以外はJPに残っていた。", "chars": ["JP"], "themes": ["patch"], "side": "", "tags": ["雑談"]}], "title": "【スト6】レジェJP 今日はランクマ", "date": "20260408", "duration": 12098}, {"id": "bqB0i_v7M4s", "game": "スト6", "summary": "ランクマをしながら雑談する配信。JPミラーを避けるためのサブキャラの検討と、トレモでガードをランダムにして確認ミスを振り返った場面がある。", "highlights": [{"t": 2104, "head": "JPミラーを避けるサブキャラの候補", "body": "JPミラーは好きではないと話し、ミラーを避けるためのサブキャラを持ちたいと考えている。候補としては今ならベガだろう、という見立て。ベガにはJPを、JPにはベガを出したい気持ちが強まっている。", "chars": ["JP", "ベガ"], "themes": ["practice"], "side": "jp", "tags": ["雑談"]}, {"t": 4963, "head": "ガードランダムで確認ミスを振り返る", "body": "トレモでガードをランダムにして練習した。確認はできるはずなのに、いまだにミスが多く、特に最悪なのは、食らっているのに投げを入れてしまう形だと話した。実戦で決め打ちしてしまっているのが原因だろう、という見立て。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["練習", "振り返り"]}], "title": "【スト6】レジェJP 今日も軽カスタム", "date": "20260406", "duration": 5748}, {"id": "50Y_VSxPLd4", "game": "スト6", "summary": "D4CUPに出場した配信。対戦の合間に相手のリプレイを見返しながら勝ち上がった。", "highlights": [{"t": 8727, "head": "事前のリプレイ確認が効いた試合", "body": "事前に見ておいた相手のリプレイがとても効いた試合だったと、対戦直後に振り返った。この規模の大会で上位まで残るのは久しぶりで、ここで勝てて自分のやり方は間違っていなかったと思えた、という感想。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["リプレイ振り返り", "雑談"]}, {"t": 10064, "head": "次の相手のリプレイを見返す", "body": "次の対戦相手のキャミィのリプレイを見返した場面。ラッシュ中段をジャストパリィされて負けた記憶があり、ただの飛びが多いのでキャノンストライクを怖がりすぎないほうがよい、何もしてこない場面では大Kが手堅いだろう、という見立て。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 11495, "head": "SAがあるなら前投げからの設置は避ける", "body": "相手にSAが1本でもあるなら、前投げからの設置はしないほうがよい、という見立て。神木C自身は、ほとんど後ろ投げしか使っていない。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["セットプレイ", "雑談"]}], "title": "【スト6】D4CUP　出る", "date": "20260405", "duration": 12495}, {"id": "V5_ZtjBws9w", "game": "スト6", "summary": "視聴者参加のカスタムを挟みながら、ほかのキャラへの「30秒でできる対策」を考える配信。ガイル・ジェイミー・舞への対策を整理し、キャミィとルークへの考えも話した。パニカン時の技の出し方を練習しようと振り返る場面もある。", "highlights": [{"t": 1918, "head": "JP限定のキャミィ対策", "body": "キャミィに汎用で使える30秒の対策は思いつかない、と前置きしたうえで、JP限定の話として、通常技キャンセルで来る攻めにはアムネジアを押しておけばインパクトを食らわない、という見立て。ただしラッシュ大Pなどのディレイキャンセルだけは、アムネジアに割られないものがあるはず、という認識で、実戦では見たことがないと話した。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 4019, "head": "ODストリボーグで締めると火力が伸びる", "body": "最大の火力を狙うなら、締めにODストリボーグを使うほうがよい。ODストリボーグならODトリグラフ、ODトリグラフ、トリグラフまで続けて入る。ODトルバランだと、その後のODトリグラフが入らないか、入っても終わりになる。手癖でやっているが理屈としては合っているはず、という見立て。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["コンボ", "解説"]}, {"t": 4418, "head": "パニカン時だけフェイントにする練習", "body": "パニッシュカウンターを取った場面でだけ、技をフェイントに切り替える動きを練習しようと思い出した場面。トレモではできなくはないが、実戦でパニカンを取ると、そのまま出し切ってしまいがちだと振り返った。", "chars": ["JP"], "themes": ["practice", "neutral"], "side": "jp", "tags": ["練習", "雑談"]}, {"t": 5082, "head": "ガイルの目の前ブレイドは小足で返す", "body": "ガイルに目の前でソニックブレイドを撃たれたとき、見過ごすと強い展開にされてしまう。小足なら見てから間に合い、ブレイドに当たらずパニッシュカウンターが取れる。大足は、JPとキンバリーなら判定が前に出ないので、動かずに見てからブレイドを壊せ、リターンが大きい。", "chars": ["JP", "ガイル"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 5296, "head": "ジェイミーの飲み行動には確定がある", "body": "ジェイミーがよくやる「後ろ投げ飲み」「リバ飲み」などのぼったくり行動は、ジェイミー側が大きなマイナスフレームを背負う。確定反撃を取れるキャラが多く、JPのようにサーチ技を持つキャラは、そのサーチ技で取るのがいちばん簡単だ。", "chars": ["JP", "ジェイミー"], "themes": ["matchup", "combo"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 5613, "head": "舞の花蝶扇は光らなければ小Pで勝つ", "body": "画面端で舞に起き攻めされ、花蝶扇を溜めて来る場面の対策。直前のコンボに光る技が入っていた場合は暴れつぶしになる。光る技が入っていないなら、小Pを最速で押せば勝てる。前のコンボの経路を見ておいて判断する、超簡単な30秒の対策だ。", "chars": ["JP", "舞"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 6266, "head": "ルークの大フラにはインパクト", "body": "ルーク戦の30秒対策としては、大フラッシュナックルにドライブインパクトのボタンを押すのが最善だろう、という見立て。ゲージに余裕があればパリィでもよいだろう、という見立てもある。SAを持っているときは、インパクトに限らずボタンを押しても勝てる。", "chars": ["JP", "ルーク"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】レジェJP　軽カスタム", "date": "20260405", "duration": 7842}, {"id": "bovUPYpqM9k", "game": "スト6", "summary": "ランクマ中心の配信。JPで戦いながら、遠距離戦に飽きて負ける傾向、ラシード戦での反撃の選び方、苦手なダルシム戦、エドモンド本田の評価について話した。", "highlights": [{"t": 2084, "head": "遠距離戦に飽きて負ける傾向", "body": "遠距離でちまちま戦う展開に飽きて、別の行動を取ってしまったと振り返った場面。負けるときは基本的に、途中で飽きて行動を取ってしまうことが原因で、こらえるのが難しい、という自己分析だ。", "chars": ["JP"], "themes": ["practice", "neutral"], "side": "jp", "tags": ["雑談", "リプレイ振り返り"]}, {"t": 4772, "head": "ラシード戦はインパクトか中攻撃か", "body": "ラシードのイーグル・スパイクにはドライブインパクトが入るため、インパクトから入ることのほうが多い気がする、という。ただしインパクトは届かないことがあるので、しゃがみ中攻撃から大ストリボーグのほうが安定する、という整理だ。", "chars": ["JP", "ラシード"], "themes": ["matchup", "combo"], "side": "jp", "tags": ["キャラ対策", "コンボ"]}, {"t": 7339, "head": "苦手なダルシム戦でトリグラフがスカる", "body": "このダルシムの相手はとても苦手だと感じた。ダルシムのパンチで軸が微妙にずれ、トリグラフがスカることがいつもある。本来はしゃがみ中攻撃からトリグラフを入れたいが、それも苦手だ。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "combo"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 7972, "head": "エドモンド本田は本当に弱いのか", "body": "エドモンド本田はキャラランクではいつも下位にいるが、中Pやジャンプ大Pなど、通常技の性能がかなり高いものがあると感じている。本当に弱いのか、と疑問を持った場面。", "chars": ["エドモンド本田"], "themes": ["matchup"], "side": "jp", "tags": ["雑談"]}], "title": "【スト6】レジェJP 早め配信おじさん", "date": "20260403", "duration": 8875}, {"id": "qNukk4xFZXc", "game": "スト6", "summary": "ランクマをしながら雑談する配信。アレックス対策の見立てを話し、終盤にサガットへの1分対策を実演した。", "highlights": [{"t": 2198, "head": "アレックスの構えにはトリグラフ", "body": "アレックスが構え中はガードできないので、構えが見えたらトリグラフを出しておく。アレックス側には嫌な動きで、インパクトも通りやすい。ダイヤ帯から1500〜1700あたりにかけてはアレックスが多いだろう、という見立て。", "chars": ["JP", "アレックス"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 7658, "head": "サガット対策：連ガ中は立ちガードに替える", "body": "しゃがみガードのままだと連続ガードになり、相手がプラ8でドライブゲージを使わずに削られ続ける。立ちガードに替えるとガードした側がプラ1になるので、連携の途中で立ちガードに切り替えれば、削られて負けることはなくなるはず、という対策。", "chars": ["サガット"], "themes": ["matchup", "defense"], "side": "jp", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】レジェJP 今日もショートを投稿した", "date": "20260402", "duration": 7848}, {"id": "dqwcwYNCios", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答え、視聴者のリプレイも振り返る配信。マスター帯でJPが勝てない時の見直し点、パリィ後にラッシュが最速で入らない不具合、相手をバーンアウトさせるドライブゲージの使い方、ゲージを見るタイミングを話した。", "highlights": [{"t": 495, "head": "マスターでJPが勝てない時の見直し点", "body": "マスターに上がったばかりでJPが勝てないという質問への答え。まず自分の連携を確実にこなせているかを見直す。次に、リバーサルが分からないからとりあえず全部ボタンを押す、飛ぶといった癖がないかを確かめる、という順だ。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "jp", "tags": ["Q&A"]}, {"t": 859, "head": "リプレイで相手の癖を見抜く", "body": "視聴者のリプレイの振り返り。ラッシュを止めに来てインパクトを返すタイプには、起爆を入れ込まないのが理想だった。相手が苦しい場面で何をするかを見ておくことが大事で、設置への起き攻めを全部リバーサルで返してくる相手もいる。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 3585, "head": "パリィ後にラッシュが最速で入らない不具合", "body": "SAや無敵技をパリィした後に、ラッシュが最速でうまく入らないバグが今ある。そのため、ラッシュで最大火力を取ろうとするとかえってミスしやすい。", "chars": ["JP"], "themes": ["patch", "system"], "side": "", "tags": ["調整"]}, {"t": 3792, "head": "遅らせ投げ抜けで無敵技をガードする", "body": "大Kキャンセルラッシュの後の守りについての質問への答え。神木Cは基本、遅らせ投げ抜けで相手の無敵技をガードする。相手が小Pや遅らせを出しているのを見たら、大Kや遅らせの大攻撃でリスクを負わせる。詳しくはYouTubeに上げた動画を見てほしいと案内した。", "chars": ["JP"], "themes": ["defense"], "side": "jp", "tags": ["Q&A"]}, {"t": 4322, "head": "大攻撃を振る基準は相手が前に出たい場面", "body": "大攻撃をどういう基準で振るかという質問への答え。相手が前に来たい場面かどうかで判断する。バーンアウト中、インパクト後、投げ抜け後などでやれる意識は持っているが、感覚の部分も大きいと話した。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 6026, "head": "相手のゲージを削ってバーンアウトへ", "body": "視聴者のリプレイの振り返り。相手がバーンアウト直前なら、どのガードでもバーンアウトする形まで攻めるのは有りだ。パリィで相手のゲージが回復した場面では、パリィ・弾・技をガードさせて削りたい。起爆を早めに入れ、バーンアウトを取れる状態にするほうがよい。", "chars": ["JP"], "themes": ["resource", "offense"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 6556, "head": "相手はバーンアウトさせ自分はしない", "body": "リプレイの振り返り。ドライブゲージを贅沢に使いすぎたのが課題だった。弾のパリィや、自分の弾をパリィさせて釣ること、確定反撃のSAで相手のゲージを削る。相手をバーンアウトさせ自分はしない方針を重視する。JPはこれがかなり強く、ラッシュに行けない状況を作れると相手の行動を制限できる。", "chars": ["JP"], "themes": ["resource"], "side": "jp", "tags": ["リプレイ振り返り", "解説"]}, {"t": 7726, "head": "ドライブゲージを見るのは暇な時", "body": "ドライブゲージは無限に見たほうがいいほど大事だ。コンボを食らっている時とコンボをしている時は、特にやることがない暇な時間で、その間は基本ゲージを見る。ゲージを見るタイミングは、状況が変わらない暇な時だと答えた。", "chars": [], "themes": ["resource", "practice"], "side": "", "tags": ["Q&A", "解説"]}, {"t": 8701, "head": "ドライブゲージが満タンのままは損", "body": "自分のドライブゲージが6本の満タンのままなのは損をしている。6本になったら、何らかの形で使いたいという考え方だ。キャンセルしてトリグラフを出す、OD技に使うといった例を挙げた。", "chars": ["JP"], "themes": ["resource"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】レジェJP 大会動画投稿しました", "date": "20260401", "duration": 11408}, {"id": "5v6ISmOphzk", "game": "スト6", "summary": "ランクマをしながら視聴者と話す配信。アレックス戦の見立て、ドライブゲージの削りが以前より弱くなった話、ラヴーシュカにパリィを仕込むべきかという質問への答えが中心で、大半は対戦中の実況と雑談だった。", "highlights": [{"t": 1143, "head": "アレックス戦は構えを見てトリグラフ", "body": "アレックスは構え中にガードができないらしく、構えが見えて間に合うなら、とりあえずトリグラフで取ればよい。シューティングへの耐性は低そうだ、という見立て。", "chars": ["アレックス", "JP"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 2613, "head": "ドライブゲージの削りが弱くなった", "body": "JPの大攻撃でドライブゲージを削る量が以前より弱くなっていると話した。大攻撃を3回ガードさせても、以前の2発分ほどしか減らなかったという感触。", "chars": ["JP"], "themes": ["patch", "resource"], "side": "jp", "tags": ["調整"]}, {"t": 4421, "head": "ラヴーシュカのパリィ仕込みは毎回やる", "body": "ラヴーシュカのパリィ仕込みを毎回したほうがいいかという質問への答え。仕込める場面は全部仕込んだほうがよく、あえてやらない理由はない。コンボから発動する場面が典型で、慣れるとそこまで難しくない。ただしミスの被害が大きく、難しい場面ではやらない理由もある。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A"]}], "title": "【スト6】レジェJP せいぜい1時くらいまで", "date": "20260331", "duration": 9905}, {"id": "pe3OwQE-X9E", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える長い配信。パニッシュカウンターを取られる入れ込みの対処、ダルシム戦の考え方、投げ抜けのコツ、ダイヤ帯の上達法、ベガ対策、調整後のキャラ評価を話した。", "highlights": [{"t": 2124, "head": "入れ込みがパニカンになった時の対応", "body": "技を入れ込んでパニッシュカウンターになってしまう場合の使い分けへの答え。入れ込んでしまったら仕方がないので、当たっていればそのまま出す。当たりそうな場面では、そもそも入れ込まない。ガードさせるつもりがパニカンだった時は、確認してフェイントにできるはずだが難しい。", "chars": ["JP"], "themes": ["offense", "combo"], "side": "jp", "tags": ["Q&A"]}, {"t": 2284, "head": "ダルシム戦はワープに空投げ、空対空を頑張る", "body": "ダルシム戦は、ワープに空投げがある分JPはましだが、それでもだるい相手だ。空対空でフロートを落とせれば、そこから攻撃を入れられるので空対空を頑張りたい。起き攻めでもワープでも、地上ワープ以外は基本、空投げでよい。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 2785, "head": "大Pパニカンから位置を入れ替えるルート", "body": "大Pのパニッシュカウンターから画面の位置を入れ替えるルートはあるかという質問への答え。いちばん簡単な型は、大Pから設置につなぐものだ。大P直設置でも、大Pからトリグラフ設置でもよい。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 4633, "head": "投げ抜けは押さないほどよい", "body": "投げ抜けのコツを聞かれ、投げ抜けは押さなければ押さないほどよいとされていると答えた。投げを食らうより、投げ抜けを狩る打撃を食らうほうがリターンが5倍ほど大きく、一度で4000〜5000ほど減って負けることもある。ただし全く抜けないと見抜かれるので、基本は少なめにする。", "chars": ["JP"], "themes": ["defense"], "side": "", "tags": ["Q&A", "解説"]}, {"t": 5298, "head": "調整後の強キャラ評価とJPの位置", "body": "調整でブランカとJPはどちらも結構なナーフを受け、ブランカのほうが程度が重い。JPは前々から強いが、エドとサガットがきつい相手であることが評価を下げる、という見立て。強キャラの最上位はエドとサガットまでは確実で、残りの枠はJP・テリー・バイパーなどで意見が分かれる、という見立て。", "chars": ["JP", "ブランカ"], "themes": ["patch"], "side": "", "tags": ["調整"]}, {"t": 6441, "head": "ダイヤ帯のJPは技振りを真似しない", "body": "ダイヤ帯のJPが強くなるためにやるべきことへの答え。コンボは参考にしてよいが、神木Cの技振りは特殊なので参考にしないほうがよい。コンボの種類を増やすのが一番だ。上の人のリプレイは大事だが、レジェンド帯を見ても意味が分からないことが多く、少し上の人を見ると今求められていることが見やすい。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 6746, "head": "怖くて下がり続けて画面端を背負わない", "body": "ガードやリバーサルで何をされているか分からず、とりあえず上入れっぱなしにしたりボタンを押したりする癖は避ける。立ち回りでは大Pや中攻撃が届く距離にいたほうがよいのに、怖くて後ろに下がり続け、勝手に画面端を背負う人が多い。", "chars": ["JP"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 8884, "head": "ベガ対策はデビルリバースを対空で落とす", "body": "ベガが苦手な時のコツの質問への答え。デビルリバースを対空で落とせるとかなりやりやすい。今回は移動距離が減り、対空すると裏に落ちてパニカンを取られる場面がかなり減った。ダブルニープレスには、バックステップや垂直ジャンプを置くと振りにくくなる。", "chars": ["ベガ"], "themes": ["matchup", "antiair"], "side": "", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】レジェJP 疲労回復", "date": "20260330", "duration": 12373}, {"id": "YDHEoSGwFlg", "game": "スト6", "summary": "広島大会から帰った日の配信。トレモでガイルの空振りに対する大足の確定反撃をキャラごとに検証し、30秒対策の動画ネタを視聴者と考えた。大会の試合の反省、ラシードの三角飛びへの対策、3大Pの確定反撃キャラの訂正も話した。", "highlights": [{"t": 2726, "head": "大会で勝てた場面の振り返り", "body": "広島大会の試合を振り返り、小Pから直接ODストリボーグを入れ込めば勝てた場面だったと反省した。小PからODストリボーグが最も簡単なルートで、ODストリボーグは好きでよく使う。別の試合では、パリィを出しすぎて途中から投げられ続けたことが良くなかったと振り返った。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["リプレイ振り返り"]}, {"t": 4154, "head": "ラシードの三角飛びは空対空で落とす", "body": "ラシードの三角飛びは初心者殺しかもしれないが、空対空で落とせば大きなリターンが取れる。短い対策動画に入れるなら簡単な部類に入る、という見立て。", "chars": ["ラシード"], "themes": ["antiair", "matchup"], "side": "", "tags": ["キャラ対策"]}, {"t": 4897, "head": "どの距離でも確定のあるキャラの訂正", "body": "先日の3大Pの解説で、ガードされるとどの距離でも確定反撃を取られるのはベガ・ブランカ・キンバリーだけと述べたが、誤りだった。ランクマの対戦で、エレナもどんな距離でもODの技で確定を取れることに気づいた。食らうとゲームが終わるほどのダメージになる。", "chars": ["JP", "エレナ"], "themes": ["combo", "matchup"], "side": "jp", "tags": ["解説"]}, {"t": 5780, "head": "ガイルの空振りに大足で反撃する検証", "body": "ガイルのソニックブレイドの空振りに大足で確定反撃を取る方法を、トレモでキャラごとに検証した。大足は判定が前に出るキャラが多く、中央では少し後ろに下がってから出す必要がある。どの距離でも楽に出せるのはJPとキンバリーだけで、ザンギエフなどは小Pで反撃するしかなさそう、という見立て。", "chars": ["JP", "ガイル", "キンバリー"], "themes": ["combo", "matchup"], "side": "jp", "tags": ["練習", "キャラ対策"]}], "title": "【スト6】レジェJP　広島から帰還", "date": "20260329", "duration": 8372}, {"id": "7TC-ZplMp7c", "game": "スト6", "summary": "ランクマをしながら次の動画ネタを考える配信。ラッシュ大Kのタイミング、ベガのデビルリバース調整、キンバリーの疾駆け対策と起き攻め対策を話し、後半は3大Pの使い方を解説した。", "highlights": [{"t": 1566, "head": "ラッシュ大Kのタイミングの変え方", "body": "ラッシュ大Kは、相手の行動に合わせてタイミングを変える。最速の小Pを出す相手には、大Pからラッシュ大Kと出すと、小Pを振った相手に当たる。投げ抜けを早めに入れてくる相手には、少し遅らせた大Kがちょうど勝ってカウンターになり、リターンが大きい。遅らせ投げが抜けられるなら、さらに遅く出す。", "chars": ["JP"], "themes": ["offense"], "side": "jp", "tags": ["Q&A"]}, {"t": 1818, "head": "強キャラの見立てとJPがきついキャラ", "body": "エドは最強格だが、使いこなすまでに時間がかかるキャラだ、という見立て。サガットもかなり強い。JPから見てきついキャラは、エド・サガット・ベガあたりだろう、という見立て。", "chars": ["JP", "ED", "サガット"], "themes": ["matchup", "patch"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 2370, "head": "ベガのデビルリバースが落としやすくなった", "body": "ベガはデビルリバースを空中で落とせると一気にリターンが上がる。今回の調整でデビルリバースが横に移動しにくくなり、裏回りでパリィや対空を誘う動きがやりにくくなったため、通常技で見ていれば落ちることが多くなった。ただし、かなり近めで対空しないと落ちない。", "chars": ["JP", "ベガ"], "themes": ["patch", "antiair", "matchup"], "side": "jp", "tags": ["調整", "キャラ対策"]}, {"t": 2909, "head": "キンバリーの疾駆けはボタンで割れる", "body": "キンバリーの疾駆けは、しゃがみ大攻撃からのものと大Pからのもの、ODのものが暴れ潰しになる。それ以外の、中攻撃などからの通常の疾駆けは、小Pなどのボタンを押せば割れる。押さないと食らい続ける。強化前は、しゃがみ大攻撃からの疾駆け以外は全部ボタンを押せばよかった。", "chars": ["JP", "キンバリー"], "themes": ["defense", "matchup"], "side": "", "tags": ["キャラ対策", "解説"]}, {"t": 3422, "head": "3大Pの使い方：リスクと起き攻めと確定", "body": "3大Pは当たっても試合は終わらないが、ガードされるとマイナス14フレームで、距離によっては試合が終わるほど反撃を受ける。リーチが長く、歩きの多い相手に刺さる。ほぼ先端なら多くのキャラに確定がなく、反撃のボタンを押した相手を罰せられる。当たればラッシュ小Pで起き攻めに行け、リバーサルを狩れるので昇龍のないキャラやエドに強い。ベガ・ブランカ・キンバリーは距離を問わず確定を取られ、ベガには無理に振らなくてよい。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】軽めランクマカスタム　次の動画ネタも考える", "date": "20260325", "duration": 5182}, {"id": "DiIybykNHnA", "game": "スト6", "summary": "ランクマとカスタムをしながら視聴者の質問に答える配信。ドライブゲージを大胆に使う理由、大Kを置く場面、リバーサル大Kが刺さる場面、設置後に歩いたあとの動きを解説した。休憩をはさんで後半に大Kの話をまとめて行った。", "highlights": [{"t": 3686, "head": "ゲージを大胆に使う理由", "body": "ドライブゲージを大胆に使う理由は、JPがゲージを稼ぎやすいキャラだからだ。ゲージが尽きかけても、シューティングで距離を取ったり投げを通したりするうちに回復するため、残っていればそのまま使う場面が多い。", "chars": ["JP"], "themes": ["resource"], "side": "jp", "tags": ["Q&A"]}, {"t": 5128, "head": "大Kを置く場面", "body": "大Kは当てに行く技ではなく、前に出てくる相手に置く技だ。ダッシュで来る場面やラッシュで来そうな距離では、ほぼ見ずに置いても当たる。投げ抜け後やインパクトガード後の、お互い前に出たくなる微妙な距離にも置く。判定が強く、技がぶつかれば大体JPが勝つ。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["解説"]}, {"t": 5524, "head": "リバサ大Kが刺さる場面", "body": "相手の起き攻めが重なっていない場面では、リバーサルで大Kを出すと勝てることがある。バーンアウト中などに、前歩きや投げを混ぜて重ねてこない相手に効く。無限に重ねられる起き攻めには普段は使わない。", "chars": ["JP"], "themes": ["defense"], "side": "jp", "tags": ["解説"]}, {"t": 6250, "head": "設置後に歩いたあとの動き", "body": "中央で設置し、相手が後ろに歩いて何も起きない展開では、ラインが上がった時点でリターンなので、立ち回りに戻りがちでよい。できればもう一度ダウンを取って設置し直すのが一番おいしいが、前歩きでドライブゲージを回復しつつラインが上がっていれば十分、という考え方だ。", "chars": ["JP"], "themes": ["setplay", "resource"], "side": "jp", "tags": ["Q&A"]}], "title": "【スト6】レジェJP　軽めランクマカスタム", "date": "20260324", "duration": 6396}, {"id": "FrmvKucHeSE", "game": "スト6", "summary": "ゆなっこ杯の対戦とその後のランクマを配信した。ドライブゲージを見て前に出るか距離を取るかを決める考え方の質問に答え、エレナ戦は調整でやりやすくなったという見立ても話した。残りは対戦中の実況が中心。", "highlights": [{"t": 1131, "head": "前に出るか撃つかはゲージで決める", "body": "前に出て攻めるかシューティングかは、ドライブゲージの残りで決める。余裕がなければ距離を取って回復し、置き攻めを通せば勝てる場面ならそのまま攻める。自分が残り1本でも、相手がバーンアウトで何でもできそうなら攻める。神木C自身は前に出ることが多いJPだと見ている。", "chars": ["JP"], "themes": ["resource", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 6261, "head": "エレナ戦は調整で止めやすくなった", "body": "エレナのくるくる回る動きは、これまでよく見ていないと止められず面倒だった。今回の調整から中Pで適当に止めてもリターンが良くなったため、エレナ戦は調整がプラスに働いているという見立て。", "chars": ["JP", "エレナ"], "themes": ["matchup", "patch"], "side": "jp", "tags": ["キャラ対策", "調整"]}], "title": "【スト6】ゆなっこ杯→終わったらランクマ", "date": "20260323", "duration": 11452}, {"id": "gzr5Bd0EwC0", "game": "スト6", "summary": "イベント帰りのランクマ配信。調整後のJPの新しい起爆の使い方と見立て、前投げ・裏投げの後の設置に確定があること、中足起爆が刺さる理由を話した。終盤は1分キャラ対策としてケンのバーンアウト狩りへの対応を解説した。", "highlights": [{"t": 1326, "head": "調整後のJPと新しい起爆ルート", "body": "調整は超強化ではなくナーフで、軽いナーフ程度で済んだのではという見立て。新しい起爆は、大Kからだと連続ガード、中Pからと中足からの起爆は暴れ潰しになる。起爆の発生はフレーム表で19Fだが18Fという説もある。対策は起爆に合わせてジャストパリィのボタンを押すことだろう、という見立て。", "chars": ["JP"], "themes": ["patch", "setplay"], "side": "jp", "tags": ["調整", "解説"]}, {"t": 2081, "head": "前投げ後の設置は甘く、確定がある", "body": "前投げのあとの設置は甘い行動で、意外と確定がある、というJP使い向けのポイント。OD設置ならまだしも通常設置は特に甘い。前投げ設置は止めてくる相手も多い。", "chars": ["JP"], "themes": ["setplay", "combo"], "side": "vs_jp", "tags": ["解説", "セットプレイ"]}, {"t": 3414, "head": "中足起爆は暴れを狙う相手に刺さる", "body": "中足の初段をガードさせた後に、ワンガードで暴れる相手が多い。そこへ中足起爆が刺さる。今のところ刺さるが、1か月後に刺さるかは分からない、という見立て。", "chars": ["JP"], "themes": ["offense", "setplay"], "side": "jp", "tags": ["解説", "セットプレイ"]}, {"t": 4577, "head": "裏投げ後の通常設置にトリグラフかSA", "body": "JPのミラーでは、裏投げの後の通常設置にトリグラフかSAが確定する。神木Cはこれを1分キャラ対策シリーズの第2弾として話し、ハイパーボッタクリコードと呼んだ。", "chars": ["JP"], "themes": ["setplay", "combo"], "side": "vs_jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 6708, "head": "ケンのバーンアウト狩りは何かボタンを押す", "body": "バーンアウト中にケンの迅雷脚で責められたときの簡単な対策。中迅雷脚の下段は連続ガードになり、初段止めでもマイナス3なので、何でもよいのでボタンを押しておく。弱迅雷脚の下段は連ガでなく食らう点と、発生の遅い技で暴れると強迅雷脚の中段に負ける点に注意する。", "chars": ["ケン"], "themes": ["defense", "resource"], "side": "jp", "tags": ["キャラ対策", "解説"]}], "title": "【スト6】レジェJP イベント帰り", "date": "20260321", "duration": 6979}, {"id": "_LIvr7jcqx0", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。ラヴーシュカのパリィ仕込みのコツ、いちばん簡単なコンボ、1800〜2000帯で大事なこと、ブランカ対策、大Kの振り方の予告を話した。調整直後で、パリィ後のラッシュの不具合も検証した。", "highlights": [{"t": 1308, "head": "パリィ後にラッシュが出にくい件を検証", "body": "無敵技をパリィでガードした後にラッシュが出にくいという話を、チャットから受けて試した。最速で入力すると出ず、2回目や3回目で出る場面があり、最速を狙わなければ2回目で決まった。バグか自分の入力かは判断がつかなかった。", "chars": ["JP"], "themes": ["patch", "system"], "side": "jp", "tags": ["調整", "検証"]}, {"t": 1802, "head": "ラヴーシュカのパリィ仕込みのコツ", "body": "コツは感覚的で、焦りすぎないことに尽きる。小P、パリィ、中足の順に押し、早すぎるとパリィが出てしまい、遅すぎるとガードできない。トレモで繰り返し試す。パリィを中Pや中足と別のボタンに置くと多少やりやすい。", "chars": ["JP"], "themes": ["practice", "offense"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 1924, "head": "JPのいちばん簡単なコンボ", "body": "始動の通常技は大Pでもしゃがみ中攻撃でも中Kでも何でもよく、そこからラッシュで大ストリボーグ、トルバラン、トリグラフ設置とつなぎ、あとは弾を撃つ。SAがありリーサルが見えるならSAを入れる。JPのコンボの基礎になる型だろう、という見立て。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 3499, "head": "マリーザで一番きつかったのはED", "body": "マリーザを使っていて一番無理だと感じたのはEDで、JPでもきついがマリーザはその2倍ぐらい無理だった。ただしEDは練度の影響が大きく、相手が上澄みでなければ戦える、という見立て。", "chars": ["JP", "ED"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 3837, "head": "1800〜2000帯は手札を増やす", "body": "1800〜2000帯のJPで大事なことへの答え。いちばん大事なのは手札を増やすことだ。メインどころのセットプレイやコンボでも、上のレート帯まで行ってまだ使えていないものがあるという見立てで、場面ごとに適切な手札を選べるようにする。", "chars": ["JP"], "themes": ["practice", "setplay"], "side": "jp", "tags": ["Q&A"]}, {"t": 4044, "head": "大Kは相手が前に出たいときに振る", "body": "大Kの使い方は何度も聞かれ、考えがまとまったので動画にしたいと話した。予告として、相手が前に歩きたくなるタイミングで振る。ラッシュや前ステをしたくなる場面が代表例で、そこに届く技を持つキャラはほぼおらず、置くと当たりやすい。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4278, "head": "ブランカ対策は遠くで光ったらインパクト", "body": "簡単な1分対策として、遠くで黄色く光ったらインパクト、を合言葉にする。理想は強ロリにジャストパリィ、手前で止まるロリにボタンを押すこと。近い距離でSA2ゲージがある相手のODロリにインパクトすると、SA2にキャンセルされるので注意。", "chars": ["ブランカ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】レジェJP 質問無限募集", "date": "20260320", "duration": 7455}, {"id": "WoW4QU4Dvnk", "game": "スト6", "summary": "JPに調整が入った日のランクマ配信。調整内容を読みながら、中P起爆・中足起爆の手応えとJPの立ち位置を話した。視聴者のリプレイを見て、パリィへの対処・中Kの振り方・ドライブゲージの使い方を助言し、しゃがみ中Kのリーチと信用技にも答えた。", "highlights": [{"t": 802, "head": "設置後の暴れに中足起爆で返せる", "body": "設置をガードさせたあとに暴れてくる相手が多かったが、中足起爆などでリスクを負わせられるようになったのは強い、という実感。画面端まで考えると中P起爆と中足起爆は強力で、中P起爆は立ち回りの場面で効きそうだ、という見立て。", "chars": ["JP"], "themes": ["patch", "setplay"], "side": "jp", "tags": ["調整"]}, {"t": 1424, "head": "JPの調整は微ナーフ程度と評価", "body": "今回のJPの調整は微ナーフ程度だと見る。中足が伸びたのは強く、調整内容は良いと思う、という評価。JPは全然強いままだ。同じような立場だったブランカはかなり下げられ、EDはそれほど下げられていないようだ、という見方も示した。", "chars": ["JP", "ブランカ", "ED"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 3707, "head": "JPは5強から落ち上位3分の1か", "body": "今回の調整で、JPは5強からは落ちただろうが、上位3分の1ぐらいには残るのではないか、という見立て。ある程度の位置に落ち着かないと、調整におびえ続けることになる。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 4475, "head": "調整後のJPはいい調整をもらった", "body": "調整後のJPは、トータルではナーフだが、いい調整をもらったという評価。JPはまだまだやれる。熱いのは中P起爆と中足起爆。起爆を絡めた連携はまだ思いついておらず、誰かが考えるのを待つ、と話した。", "chars": ["JP"], "themes": ["patch", "setplay"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 5083, "head": "パリィ癖の相手にはワープ投げを見せる", "body": "視聴者のリプレイを見ながらの助言。相手がワープや設置を見てパリィしてしまう癖がついているので、一度ワープ投げを見せたほうがよさそうだ、という見立て。弾を見てずっとパリィしている相手には、フェイントトルバランをもっと混ぜたほうがよい。", "chars": ["JP"], "themes": ["offense", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "Q&A"]}, {"t": 5117, "head": "中Kを振る距離が合っていない", "body": "視聴者のリプレイで、中Kの振り方を指摘した。強い技だが、差し返しの形になりやすいのは、中足をガードさせたあとのような距離で相手の打ち返しに振るときだ。見たリプレイの距離では厳しいだろう、という見立て。あまり牽制で使う技ではない、とも答えた。", "chars": ["JP"], "themes": ["neutral", "practi
