ce"], "side": "jp", "tags": ["リプレイ振り返り", "Q&A"]}, {"t": 5410, "head": "ドライブゲージを満タンで腐らせない", "body": "視聴者のリプレイで、ドライブゲージが6本のままうろうろする場面が多いと指摘した。キャンセルラッシュやOD技など何でもよいので、ゲージを使いに行く意識が大事だ。", "chars": ["JP"], "themes": ["resource", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "Q&A"]}, {"t": 5560, "head": "弾を撃つだけでは解決しない", "body": "怖くなると後ろに下がって弾を撃ちたくなるが、このキャラで弾を撃つだけでは解決しない。相手が苛立ってボタンを押したり、適当に飛んだりしない限り弾は当たらない。結局、打撃が大事だ。", "chars": ["JP"], "themes": ["neutral", "practice"], "side": "jp", "tags": ["リプレイ振り返り", "Q&A"]}, {"t": 5869, "head": "上のレート帯では技を振ると負ける", "body": "技をあまり振っていない印象だという視聴者の指摘に、自分では結構振っている方だと答えた。上のレート帯では差し返しの精度が高い相手が出てきて、技を押すと負けるから、という考え。", "chars": ["JP"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["Q&A", "立ち回り"]}, {"t": 6270, "head": "コンボはラッシュよりOD技が得", "body": "コンボにドライブラッシュを使うルートでは、コンボが終わるまでドライブゲージが回復しない。OD技を使うルートなら早くから回復が始まり、ダメージも大差ない。コスパはOD技の方がよいと考える。ゲージ状況と個人の考え方で選べばよい。", "chars": ["JP"], "themes": ["combo", "resource"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 11972, "head": "しゃがみ中Kのリーチと信用技", "body": "しゃがみ中Kは信用してよく、リーチは全キャラで2番目か3番目に長い。信用技は中足、中K、中P。中Pは信頼度が高く、ギリギリ届く手前の距離が一番強い。先シーズンまでの画面端の投げ絡みのセットプレイは、覚えなくてよい。", "chars": ["JP"], "themes": ["neutral", "setplay"], "side": "jp", "tags": ["Q&A", "立ち回り"]}], "title": "【スト6】JPは敗けておりません", "date": "20260317", "duration": 12248}, {"id": "DwgQ8uZJIXQ", "game": "スト6", "summary": "ランクマを中心に、視聴者と話しながら進めた配信。調整を前に、EDは確実に下がり、JPとブランカも下がるだろうと予想した。次の大会までのバージョンはサガットが最強になるという見立てと、マリーザの強化案も話した。", "highlights": [{"t": 2880, "head": "次の調整はEDが確実、JPも下がる予想", "body": "次の調整の予想を話した。EDは確実にナーフされるだろう。JPとブランカも多分ナーフだが、焦点はその程度だ。マリーザはバフしかありえないだろう、ザンギエフも下げる項目がなくバフのみかもしれない、という見立て。", "chars": ["JP", "ED", "ブランカ", "マリーザ"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 3756, "head": "エボジまではサガットが最強か", "body": "エボジまでのバージョンの予想。EDが大きく下げられ、JPとブランカも程度は不明だが下げられる。他の中堅キャラにとんでもない強化が入らない限り、サガットが最強になるだろう、という見立て。", "chars": ["JP", "ED", "ブランカ", "サガット"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 6901, "head": "マリーザの強化案は生ラッシュ中Kの先", "body": "マリーザの強化案として、生ラッシュ中Kから引き大Pを経て、中央でもグラディウスのSAまでほぼ確実につながるようにすべきだという考え。中Kの与える硬直を1F伸ばす、引き大Pの発生を早くする、先行入力を効きやすくする、といった調整を挙げた。", "chars": ["マリーザ"], "themes": ["patch", "combo"], "side": "", "tags": ["調整", "雑談"]}], "title": "【スト6】神ーザ 調整におびえる", "date": "20260315", "duration": 9797}, {"id": "CMQGr6ZDDDA", "game": "スト6", "summary": "マリーザを使ったランクマ中心の配信。カプコンカップ決勝の感想などの雑談が大半で、見どころとして立てられる解説は無い。", "highlights": [], "title": "【スト6】神ーザ CC面白かった～", "date": "20260314", "duration": 4423}, {"id": "aNb1QNPPKjE", "game": "スト6", "summary": "調整を前に、マリーザでランクマを回しながら視聴者の質問に答える配信。JPにどんな調整が入りうるかの予想、JPを使う人への影響への思い、ランクマのレートの動き方を話した。後半は長時間プレイで精度が落ちる点にも触れた。", "highlights": [{"t": 1556, "head": "JPに入りそうな調整の予想", "body": "調整が入るとしたらどこかという質問への答え。共通の調整では、ラッシュの中段まわりが変わりそうだと予想した。JP単体では、今は始動補正だけの技にコンボ補正が付く調整がありそうだという。ラヴーシュカがコンボ専用になる調整も、可能性は低いがゼロではないだろう、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 2342, "head": "JP使いがつらくならない調整であってほしい", "body": "JPは性能そのものが好きで使う人が多いタイプのキャラで、使っている人がつらくなる調整でなければいいと話した。神木C自身はキャラクター性が好きでJPを使っているが、性能が好きで使う人も多く、その人たちが離れてしまうのは困る、という考え。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 2775, "head": "ランクマのレートは1日100の上下が誤差", "body": "マスターレートが大きく動く日についての答え。1日に100上下するのは誤差で、200動くことも珍しくない。200落ちた日は調子が悪かった程度に捉え、300落ちたときに初めて何かやったかもしれないと考える。", "chars": [], "themes": ["practice"], "side": "", "tags": ["Q&A", "練習"]}, {"t": 3462, "head": "JPは調整次第で極端に振れるキャラ", "body": "JPは強さが極端に振れるキャラで、今のところは強い側を引けている。ただ、次の調整の内容によっては大きく弱い側に振れる可能性があり、それが怖いと話した。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 9141, "head": "長時間プレイは後半ほど精度が落ちる", "body": "マリーザを使い始めて日が浅いこともあり、後半になるほどコンボの精度が下がる。判断も落ちるので、長時間プレイは危ないと振り返った。次に負け越したら終えると決めて遊んでいた。", "chars": ["マリーザ"], "themes": ["practice"], "side": "", "tags": ["練習", "雑談"]}], "title": "【スト6】神ーザ 無限質問募集男", "date": "20260311", "duration": 9358}, {"id": "CqtlWQkwSbQ", "game": "スト6", "summary": "JPのランクマに視聴者との雑談を交えた長時間の配信。ベガ・ED・豪鬼との相性、OD設置を対空後に使う考え方、ジェイミー戦が今後も楽にならないという見立てを話した。", "highlights": [{"t": 3947, "head": "JPの苦手はベガとED", "body": "豪鬼は体力の低さが響くので、今は戦える相手になっているという。苦手なのはベガとEDで、EDは極まると無理だが、極まるまでのハードルが高いので大半のレート帯では強くない。ベガはコンセプトの段階で不利で、とんでもない調整が来ない限りきつい相手だろう、と話した。", "chars": ["JP", "ベガ", "ED"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 6067, "head": "OD設置は対空後に入れたい", "body": "OD設置を出せるのが嬉しくてボタンを押したくなるが、不利なので本来は押してはいけない。対空したときにOD設置を入れるのを意識したいが、まだあまりできていない。ODはゲージを使うので、ゲージ状況を見る必要がある。とりあえず出すのはよくない。", "chars": ["JP"], "themes": ["setplay", "resource"], "side": "jp", "tags": ["セットプレイ", "解説"]}, {"t": 8939, "head": "ダルシム戦はトリグラフにワープが重なる", "body": "ダルシム戦では、トリグラフを撃つとたまたま相手がワープしていて、そのまま負ける場面が多い。エレナも、トリグラフに相手の転がりが重なって負けるパターンがあり、傾向が近いキャラだと話した。", "chars": ["JP", "ダルシム", "エレナ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 9494, "head": "ジェイミー戦は今後も楽にならない", "body": "どんな調整が入っても、ジェイミー戦が得意になることは一生ない気がすると話した。JP使いの多くが苦手だろう。今後はJPが弱体化される側、ジェイミーが強化される側になりやすく、この組み合わせは今がいちばん楽だろうという見立て。ただジェイミーが最強になることはないだろう。", "chars": ["JP", "ジェイミー"], "themes": ["matchup", "patch"], "side": "jp", "tags": ["キャラ対策", "調整"]}], "title": "【スト6】宇宙一治安の良いランクマ配信", "date": "20260106", "duration": 10503}, {"id": "BrB4x5IvVws", "game": "スト6", "summary": "ランクマ中心の配信。相手のケンの昇龍をガードしたあとのリーサルを探し、前ステで入れ替えてから大Kを入れる形を確認した。ほかに初見の相手へのラッシュの当て方を話した。", "highlights": [{"t": 521, "head": "初見の相手には大Pラッシュで様子を見る", "body": "初見の相手には、まず大Pラッシュを当てて、昇龍を打つかどうかを確かめたい、という考えを話した。知っている相手に対しても同じ確認はする。", "chars": ["JP"], "themes": ["offense", "neutral"], "side": "jp", "tags": ["解説"]}, {"t": 6631, "head": "ケンの昇龍は前ステで入れ替える", "body": "ケンの昇龍をガードした後のリーサルを視聴者に尋ねた場面。前ステで入れ替えてから大Kを入れるルートを教わり、ケンの昇龍は入れ替えられるのかと納得した。上に吹っ飛ぶタイプの昇龍には、いつもやりがちなインパクトより前ステの入れ替えのほうが正しい、と振り返った。", "chars": ["JP", "ケン"], "themes": ["combo", "offense"], "side": "jp", "tags": ["リプレイ振り返り", "コンボ"]}], "title": "【スト6】【スト6】ランクマかカスタム　明日はドラクエやりたい", "date": "20251221", "duration": 8076}, {"id": "G8UaAD_ZGzo", "game": "スト6", "summary": "ランクマからカスタムまで通した配信。ダルシム戦では飛び込みの考え方を振り返り、メンタル面の我慢を語った。カスタムではアブニマーチとインパクトの発生の関係を話した。", "highlights": [{"t": 2353, "head": "ダルシム戦はジャンプ大Pで突っ込む", "body": "ダルシム戦で、素直に飛んで空振りさせる動きをして死ぬことが多かったと振り返った。今日はジャンプ大Pで突っ込んだほうが期待値の高い場面が多いと気づいた。ダルシムは対空が弱いと見て飛んだが、相手が対空を頑張ろうとしても、ジャンプ大Pなら勝てることもあった。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 7236, "head": "ダルシム戦は我慢が大事", "body": "ダルシム戦は最近だいぶ形になってきた気がすると話し、大事なのは我慢だと述べた。少しでも面倒だという気持ちが出ると負けで、相当にメンタルの削り合いになる。", "chars": ["JP", "ダルシム"], "themes": ["matchup", "practice"], "side": "jp", "tags": ["キャラ対策", "解説"]}, {"t": 7596, "head": "アブニマーチとインパクトは発生が同じ", "body": "前投げからのアブニマーチは、インパクトが重なる連携ならアブニマーチも同じように重なる。アブニマーチの発生がインパクトと同じためだ。重なっている相手に飛べないのは仕方がないと話した。インパクトならインパクトで返し、アブニマーチなら飛ぶ、と対応を分ける。", "chars": ["JP"], "themes": ["offense", "defense"], "side": "", "tags": ["Q&A", "解説"]}], "title": "【スト6】ランクマ→カスタム　マックス2時くらいまで", "date": "20251217", "duration": 8759}, {"id": "N702pQcdd4g", "game": "スト6", "summary": "ランクマとカスタムの配信。ランクマ中の実況が中心で、解説や対策の話は少ない。", "highlights": [], "title": "【スト6】多分沼を抜けたランクマ　とかカスタム", "date": "20251216", "duration": 7356}, {"id": "Xp4MUMoThdE", "game": "スト6", "summary": "調整発表の直後のランクマ配信。エドとブランカが手つかずだったことへの感想、JPの先行きの見立て、バクステに技を仕込む使い方、コマンドを回す相手へのワープなどを話した。", "highlights": [{"t": 539, "head": "調整後はエドとサガットが強そう", "body": "調整内容を受けた直後の、環境の見立て。EDはさすがに一つの環境になりそうだが、サガットもかなり強いのではないか、という見立てを話した。", "chars": ["ED", "サガット"], "themes": ["patch"], "side": "", "tags": ["調整"]}, {"t": 1130, "head": "JPが終わったら次はマリーザ", "body": "JPが調整で本当に終わったらどのキャラに行くか、という質問への答え。今はマリーザかなと思っていると答えた。ただしJPが本当に使い物にならなくなれば、ゲーム自体をやめる可能性もそこそこある、とも話した。", "chars": ["JP", "マリーザ"], "themes": ["patch"], "side": "jp", "tags": ["Q&A", "雑談"]}, {"t": 1395, "head": "エドとブランカが手つかずだった", "body": "調整では、エドもブランカも全く手つかずだったのが予想外だった。大した調整は来ないだろうとは多くの人が思っていたが、それよりさらに小さかった、という感想。", "chars": ["ED", "ブランカ"], "themes": ["patch"], "side": "", "tags": ["調整"]}, {"t": 2339, "head": "JPに救いはあるかという質問", "body": "JPに救いはあるかという質問に、ないと答えた。JPはただただ弱いキャラで、キャラ替えを推奨する以外に言うことはない。キャラの良さを全キャラで一番消されているキャラだ、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 3611, "head": "バクステに技を仕込む使い方", "body": "バクステに技を仕込む使い方の質問への答え。ジェイミーなど突進技で突っ込んでくるキャラには有効だと思うが、自分はあまりできていない。仕込むなら大Kがよさそうだが、ラッシュ中足と同じく相手がしゃがむ姿勢になると当たらず、リリーのような背の低いキャラには刺さりにくい。", "chars": ["JP", "ジェイミー", "リリー"], "themes": ["defense", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 4079, "head": "JPの大足はマイナス6", "body": "JPの大足は、他キャラの大足がマイナス10や11になるのとは違い、マイナス6というフレームになっている。同じ数字にされたら何に使うのか分からなくなる技で、いかれた技だと思いつつありがたく使っている。大足としては扱われていない技だろう、という見立て。", "chars": ["JP"], "themes": ["neutral", "system"], "side": "jp", "tags": ["解説"]}, {"t": 4455, "head": "バクステに中Kを仕込む報告", "body": "視聴者から、リプレイを見て開幕の立ち中攻撃のあとのバクステに中Kを仕込むとしっかり止まった、大Pはベガが速くて間に合わなかった、という報告があった。神木Cは、バクステが出るタイミングでボタンを1つ押しておく手がある、という見立てを述べた。", "chars": ["JP", "ベガ"], "themes": ["defense", "practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 5830, "head": "回してくる相手にはワープが有効", "body": "相手が必ずコマンドを回していると読めるなら、コンボの最後だけワープにするのが最大の対策だという助言。相手を観察するときは、まず何よりも、食らっている間とガードしている間に何をしているかを見るべきだ、と話した。", "chars": ["JP"], "themes": ["setplay", "matchup"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】なんか寿命が延びたキャラでランクマッチ", "date": "20251215", "duration": 13360}, {"id": "RwhcgxJUps4", "game": "スト6", "summary": "調整直前の長時間ランクマ配信。JPがどう調整されるかの見立て、ヴィーハト後の拾い、スランプの原因、ランクマの緊張、簡単な行動を選ぶ考え方などを視聴者の質問に答えて話した。", "highlights": [{"t": 818, "head": "JPが調整されるならどこか", "body": "JPが調整されるならどこかと聞かれ、難しいと前置きして答えた。一番ありそうなのは、ヴィーハトが始動で当たると補正がかかるのにコンボ中だと補正がかからない点にコンボ補正が入ることだ、という見立て。中段については、発生20〜22Fでフルコンに行く中段をガードして有利なのはおかしく、ガードされて不利でよいという考え。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 1171, "head": "引き中の使い方", "body": "引き中をあまり使えていないと話した。判定が引っ込むので、ジュリのラッシュ中Kを止めるなら引き中がよいが、ほかの使い道はあまり認知できていない、とも話した。視聴者から、五分の状況で下がりながら出すと割といいことがある、と教わり、下がり大Pや下がり大Kをやりがちな場面で出す手を、有りだと受け止めた。", "chars": ["JP", "ジュリ"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["Q&A", "解説"]}, {"t": 2648, "head": "ランクが落ちて止まる原因", "body": "コンボも立ち回りも変えていないのにランクが落ちて止まっている、という質問への答え。誰にでもあるスランプとしたうえで、コンボミスや、よく分からない場面でのキャンセルラッシュで自分からバーンアウトして負け筋を作っていることが多い気がする、と答えた。考えるのが面倒になってアムネジアを連発するのもJPではありがちで、自分も下がっているときに多い。", "chars": ["JP"], "themes": ["practice", "resource"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4545, "head": "ヴィーハト後は大ストリボーグか大Pか", "body": "ヴィーハトが当たった後を、大ストリボーグにするか大Pにするかの使い分けの質問。一言で言えば、間に合えば大ストリボーグ、間に合わなければ大Pと答えた。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["Q&A", "コンボ"]}, {"t": 5730, "head": "立ち大攻撃の振り方は言葉にできない", "body": "立ち大攻撃の振り方を教えてほしいという質問に、感覚で振っていて言葉では説明できないと答えた。企業秘密や意地悪ではなく、本当に言語化できない。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["Q&A"]}, {"t": 6502, "head": "調整前のJPとエドの見立て", "body": "調整前の見立て。JPはあまりナーフされないことはあるかもしれないが、強化は絶対にないだろう。一方でEDは弱体化されないはずがなく、結果としてJPが泳ぎやすくなることはありうる、という見立て。", "chars": ["JP", "ED"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 7930, "head": "JPの調整が難しい理由", "body": "JPは、適当に弱くすると極端に弱いキャラになり、適当に強化するとどこかで極端に強くなるので、調整が難しい。競技シーンからほぼ消えたことを開発がどう見るかで、弱体化されない可能性もそこそこある。設置のフレームを変えるとセットプレイを作り直しになるため、フレームを変える調整はやらないだろう、という見立て。", "chars": ["JP"], "themes": ["patch", "setplay"], "side": "jp", "tags": ["Q&A", "調整"]}, {"t": 8298, "head": "トルバランのフェイントは消えない", "body": "JPを嫌う人の調整案でよく聞くのがトルバランのフェイント消去だが、消すとありえないほど弱い技になる。このキャラの魂のようなものなので、調整するわけがなく絶対にないだろう、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 9449, "head": "ランクマの緊張は逃れられない", "body": "ランクマで緊張するという質問への答え。大会でも同じで、目標が見えたときや、あと2勝で届くような後がないときに一番緊張する。この緊張は逃れられず、みんな通る道だ、と話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 11569, "head": "JPから見たジェイミーは噛み合わせが悪い", "body": "JPから見てジェイミーはかなり噛み合わせの悪い部類のキャラで、嫌な気持ちになることが多い。しかもジェイミーは強化が入る可能性のほうが圧倒的に高いキャラで、強化されれば嫌だと話した。", "chars": ["JP", "ジェイミー"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 13516, "head": "簡単な行動を選ぶほうがいい", "body": "簡単なことは、ミスが少なく再現性が高いという強みだと話した。大会の大事な場面で操作ミスをして負ける危険が少ない。どちらでも勝てる状況なら、難しい行動をせず、100%簡単な方を選ぶべきだ。", "chars": ["JP"], "themes": ["practice", "neutral"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】余命2日かもしれないキャラでランクマッチ", "date": "20251214", "duration": 14264}, {"id": "-3GEkgySYo0", "game": "スト6", "summary": "ランクマの長時間配信。ダイヤ帯でLPが伸びない視聴者へのアドバイス、1先の大会で勝つための考え方、大Pラッシュ後の相手のSAを振り返った。", "highlights": [{"t": 546, "head": "LPが伸びないときは何が問題かを考える", "body": "ダイヤ帯でLPが伸びない視聴者に、LPが増えないのは勝てていないということで、どこが問題かを考えたほうがよいと答えた。キャラ対策のような話ではなく、昇竜の確定の取り方といった基本の部分の話だと話した。", "chars": ["JP"], "themes": ["practice", "system"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 3214, "head": "1先の大会は倒す意思を持つ", "body": "1先の大会に出る視聴者のコツの質問に、相手を倒すという強い意思を持つことだと答えた。1先はプロがダイヤ帯に負けることも珍しくないため、次の相手がプロでも、必ずラウンドを取る意思で臨む。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "考え方"]}, {"t": 3800, "head": "大Pラッシュ後は相手がSAを出したくなる", "body": "大Pラッシュの最後の瞬間は、相手がSAを出したくなる場面だと話した。先日の大会では、大Pラッシュに相手のリバーサルを出され続けたため、大Pラッシュにアムネジアを仕込んだが、その時だけ相手はSAを出した。", "chars": ["JP"], "themes": ["offense", "defense"], "side": "jp", "tags": ["リプレイ振り返り"]}], "title": "【スト6】暗くて深い沼ランクマッチ", "date": "20251212", "duration": 12303}, {"id": "VhPZeZgyPLA", "game": "スト6", "summary": "ランクマの配信。12月16日の調整を控え、JPが弱体化される確率とその中身を予想した。ほかに、好きで使う人が多いキャラを弱くしすぎる難しさと、コンボを落とす原因としてのキャンセルの遅れを話した。", "highlights": [{"t": 753, "head": "12月16日の調整はナーフ確率70%と予想", "body": "12月16日の調整でJPがナーフされる確率を70%と見ている。弱くするなら火力面だろうという見立てで、トリグラフの最低火力を下げる、ヴィーハトにかかっている補正をコンボにもかける、が考えやすいとした。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 1392, "head": "好きで使う人が多いキャラは弱くしすぎると離れる", "body": "ブランカやJPのように、そのキャラが好きで使う人が結構いるキャラは、ただ極端に弱くして楽しくなくすると、その人たちが離れてしまう。調整の難しさはそこにあるという話。", "chars": ["JP", "ブランカ"], "themes": ["patch"], "side": "jp", "tags": ["調整", "雑談"]}, {"t": 6711, "head": "コンボを落とす原因はキャンセルの遅れ", "body": "コンボが落ちる原因として、視聴者の指摘を受けてキャンセルの遅れを確かめた。意図的にキャンセルを遅らせて試すと、アムネジア後の裏投げのような微妙な遅らせを無意識のうちにやっていることがあり、キャンセルは最速で入れるという話。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["Q&A", "コンボ"]}], "title": "【スト6】爆沼脱出ランクマッチ", "date": "20251209", "duration": 9024}, {"id": "iUJrwYyFtfY", "game": "スト6", "summary": "ランクマを中心にした長時間の配信。", "highlights": [], "title": "【スト6】超絶激烈ハイパー爆沼ランクマッチ", "date": "20251208", "duration": 10493}, {"id": "OqBKvk1tCl8", "game": "スト6", "summary": "ランクマをしながら雑談とチャットの質問に答える配信。次の調整での弱体化の見立て、JPの難しさ、アムネジアと昇龍の比較、SFLでJPが出にくい理由を話した。", "highlights": [{"t": 1096, "head": "弾の撃ち合いになった相手への意識", "body": "苦手な相手への意識点を聞かれ、特別なことはなく普通にやると答えた。弾の撃ち合いになるとトルバランフェイント以外は基本負けるので、相手が撃ち合いの展開に入ったら付き合わないことが必要だ。ほかは、中段をガードしたら確定反撃をきちんと取るといった細かい点で、昇龍の確定反撃は十分に待たないと確定にならないので注意する。", "chars": ["JP"], "themes": ["neutral", "defense"], "side": "jp", "tags": ["Q&A"]}, {"t": 7364, "head": "弱体化の見立て：前回ほどの被害ではない", "body": "以前の弱体化では、ルークのJP対策の強い技が弱くならないまま、JPの技だけが弱くなったことが大きな被害だった。今はその技が弱くなっているので、JPの技が弱くなっても当時ほどの大被害にはならないという見立て。ただしマノン戦は一気にきつくなると見ている。弱体化されたら痛いが、絶望的というほどではない。", "chars": ["JP", "マノン", "ルーク"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 8688, "head": "JPは選択肢が多く気軽には使えない", "body": "JPを使った人が「意外と難しい」と言う例が最近は多い気がする、と話した。JPはかなり難しいキャラで、左手が忙しいという難しさではなく、とっさに選ばなければならない場面が多い。選択肢がとても多いことが強みでもあるが、そのぶん気軽に使うのは難しいキャラになりがちだと話した。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["解説"]}, {"t": 8884, "head": "アムネジアと昇龍はどちらが強いか", "body": "当て身より無敵技のほうが強いとは、アムネジアの場合は一概に言えず、昇龍よりアムネジアが強い状況は確かにある。攻めを食らっている時や対空には使えず昇龍が優れる場面もあるが、インパクトを返せるような性能はアムネジアならではだ。小Pや中Pを取った場合はもう一度読み合いになる難しさがあり、うまく通した時のリターンは大きい。", "chars": ["JP"], "themes": ["defense", "system"], "side": "jp", "tags": ["解説"]}, {"t": 9372, "head": "調整は少し前の情報で入る傾向がある", "body": "最近は「JPは難しいかもしれない」「競技からも消えた」という空気がある。しかし調整は少し前の情報で入る傾向があり、調整案はすでにできているだろう。今回は普通に弱体化され、その後に「JPがかわいそう」という空気で強化される、去年と全く同じ流れをやりそうな気がする、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整"]}, {"t": 9495, "head": "プロでJPが出にくい理由はカウンターピック", "body": "プロでJPを使う人が少ないのは弱体化が見えているからか、という質問に、SFLではカウンターピックされるからだと答えた。舞やベガのように、カウンターで来られるときついキャラがいて、全チームにその片方がいる。そのためアウェイ側では置きにくく、ホーム側で被せる使い方になる。ただし被せのためだけに練度を上げるのは、覚えることの多いキャラでは難しいという話。", "chars": ["JP", "舞", "ベガ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A"]}], "title": "【スト6】レジェンドJP　軽ランクマ→カスタムのつもり", "date": "20251116", "duration": 9905}, {"id": "-zCTOtdfbTE", "game": "スト6", "summary": "ランクマ配信。ODトリグラフが入らなかった場面の振り返り、キャミィ戦の見立て、JPの個性、リーサル場面を見直す意味の質問への答えを話した。", "highlights": [{"t": 766, "head": "ODトリグラフが入らなかった場面の振り返り", "body": "ODトリグラフを入れたいときに普通のコンボをそのままやろうとして入らないことがあるので、入るかどうかを見なければならないと話した。コンボカウントの都合で入らなかったのかと気づいた場面。", "chars": ["JP"], "themes": ["combo"], "side": "jp", "tags": ["コンボ"]}, {"t": 7279, "head": "JPのキャミィ戦はコンセプト上きつい", "body": "JPでのキャミィ戦はかなりきついという話に、キャラコンセプト上どうしても嫌な相手だと答えた。一方で、キャミィ相手に「ガン不利」と言わずに済む現状に、JPがどれほど強く作られているかが表れている、という見立て。", "chars": ["JP", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 7559, "head": "JPは使い手ごとに個性が出る", "body": "JPは使い手ごとに立ち回りが違い、個性が出やすいキャラだ。個性が出やすいのはいいことだと考えている。ただし、キャラがある程度強くなければ個性が出やすい状況にはならない。", "chars": ["JP"], "themes": ["neutral"], "side": "jp", "tags": ["雑談"]}, {"t": 9425, "head": "リーサルの場面だけでもリプレイを見直す意味", "body": "リプレイを見直すのが嫌いな視聴者から、リーサルの場面を見直すだけでもMRの上昇につながるかという質問があった。神木Cは、同じ場面が来たときに次はリーサルを取れるようになるから意味がある、と答えた。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】レジェンドJP　筋肉痛ランクマ", "date": "20251024", "duration": 9629}, {"id": "cDKjxzxuH6k", "game": "スト6", "summary": "ランクマ配信。ランクマで沼にはまった時の対処、JPの難しさの中身、ヴァイパーの評価の見立て、設置への大攻撃重ねとジャストパリィの質問に答えた。", "highlights": [{"t": 1916, "head": "ランクマ沼にはまった時にすること", "body": "ランクマで沼にはまった時の対処を聞かれ、散歩・運動・睡眠の3点を挙げた。マッサージもよい。ランクマを続けても絶対にいいことはないので、その日はやめて翌日にやるほうがよく、続けるならバトルハブやカスタムにとどめる。早起きしてからやるのも勧めた。無限にランクマを回しても基本的にいい結果を生まない。", "chars": ["JP"], "themes": ["practice"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 3165, "head": "JPの難しさは覚えることの多さ", "body": "JPの難しさは、C.ヴァイパーのような手元の忙しさではなく、覚えることが多い点にある。コンボレシピが多いぶん、自由度が高いとも言える。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["解説"]}, {"t": 5914, "head": "ヴァイパーの評価は今後上がるという見立て", "body": "ヴァイパーはそれなりの強さが絶対にあり、動かせるなら使うのは全然ありだ。今後、最終的には評価がかなり上がるだろう。評価が上がると「強すぎる」という声が出て、使い手側から「そんなに強いなら自分で使えばいい」と返されるが、あまりに難しいので使えない、という未来が見える。", "chars": ["C.ヴァイパー"], "themes": ["patch"], "side": "", "tags": ["雑談"]}, {"t": 7945, "head": "設置への大攻撃重ねとジャストパリィ", "body": "大Pの後のノーマル設置に大攻撃を重ねる時、ジャストパリィをケアして間を空けてから重ねることはあるか、という質問に、自分はやらないと答えた。ジャストパリィをケアするなら、重ねずに投げに行く。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】レジェンドJP　おはようランクマ", "date": "20251022", "duration": 8971}, {"id": "fgWekCPccbI", "game": "スト6", "summary": "ランクマを回しながら雑談する配信。C.ヴァイパーが環境でどういう位置に入るかの予想と、豪鬼が減った理由の見立てを話した。", "highlights": [{"t": 3987, "head": "C.ヴァイパーは攻めが強く守りが弱い", "body": "C.ヴァイパーは受けが弱いのは間違いなく、そこが弱点になるという予想。一方で攻めの性能がかなり高く、使いこなせればレートが上がりやすいだろうという見立てを話した。", "chars": ["C.ヴァイパー"], "themes": ["matchup"], "side": "", "tags": ["キャラ対策", "雑談"]}, {"t": 5100, "head": "豪鬼が減ったのはリュウが強いから", "body": "最近豪鬼を見かけなくなったと話した。リュウが強くなったことで、あえて豪鬼を使う必要が薄れたからだろうという見立て。豪鬼にしかできないことは複数あるが、それで選ぶ価値があるかという話になる、とも触れた。", "chars": ["豪鬼", "リュウ"], "themes": ["matchup"], "side": "", "tags": ["雑談"]}], "title": "【スト6】レジェンドJP　おねむランクマ", "date": "20251021", "duration": 5554}, {"id": "1DaLDs_aFsc", "game": "スト6", "summary": "ランクマを回しながら雑談する配信。ゲームの話はC.ヴァイパーの見立てが中心で、慣れるまでやられ続ける難しさと、動かせる人には勝ちやすいという見方を話した。", "highlights": [{"t": 5819, "head": "C.ヴァイパーは慣れるまでやられ続ける", "body": "C.ヴァイパーは理解して慣れるまでは、延々とやられ続けそうだという見立てを話した。対処はかなり難しい。相手を端に追い込めば相当有利になる。", "chars": ["C.ヴァイパー"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 7305, "head": "C.ヴァイパーは動かせれば勝ちやすい", "body": "C.ヴァイパーは、動かせる人にとっては今かなり勝ちやすいだろうという見立て。殺傷力がとても高く、そもそも動かすハードルが高いキャラだと話した。", "chars": ["C.ヴァイパー"], "themes": ["matchup"], "side": "", "tags": ["キャラ対策", "雑談"]}], "title": "【スト6】レジェンドJP　チルランクマ", "date": "20251019", "duration": 9731}, {"id": "74KzYds8YjM", "game": "スト6", "summary": "ランクマ中心の配信。C.ヴァイパーを相手にした感想として、対策が要るキャラだと話した。", "highlights": [{"t": 1317, "head": "C.ヴァイパーは対策必須のキャラ", "body": "C.ヴァイパーは対策をしないと相当きついキャラだという見立て。動きの速さが大きな理由だ。操作が難しく再現がしにくいため、相手の連携が分からないタイプで、そうしたキャラは久しぶりだと振り返った。", "chars": ["C.ヴァイパー"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策"]}], "title": "【スト6】レジェンドJP　週末は大会", "date": "20251017", "duration": 1534}, {"id": "jn00EZFiNZw", "game": "スト6", "summary": "ランクマを回しながら、調整の有無や時期の見立てを話す配信。調整は大会日程が終わってからだろうという予想、過去の調整で起きた不具合の振り返り、このゲームは勢いが大事で受けに徹して勝つのは難しいという話をした。", "highlights": [{"t": 910, "head": "調整は大会が終わってから、という見立て", "body": "今回の調整でブランカにもJPにも舞にも変更がなかった。ないだろうと予想していたとおりだった。プレミア大会が全部終わるまではカプコンは調整しないだろう、入るとしても今月末の中国が終わってからだろう、という見立て。リーグの通常節が終わってからが一番ありそうだとも話した。", "chars": ["JP", "ブランカ", "舞"], "themes": ["patch"], "side": "", "tags": ["調整", "雑談"]}, {"t": 1347, "head": "去年12月の調整で確定が中Kだけに", "body": "去年の12月ごろの調整を振り返った。それまでインパクトで取れていた確定が、突然中Kでしか取れなくなった。普通にバグで、約半月そのままだった。", "chars": [], "themes": ["patch", "combo"], "side": "", "tags": ["調整", "雑談"]}, {"t": 4109, "head": "勢いが大事なゲーム、受けに徹して勝つのは難しい", "body": "このゲームは勢いが大事で、相手の勢いを止められないと大変なことになる。受けに向いたキャラを使っていても、受けに徹して勝てている人は2、3人ほどという話。ラッシュなど攻め方が無限にあり、ガードしていても基本的にいいことが起きないゲームだから、受けは難しいという考え。", "chars": [], "themes": ["defense", "system"], "side": "", "tags": ["解説", "雑談"]}], "title": "【スト6】レジェンドJP　多分ランクマ", "date": "20251016", "duration": 7307}, {"id": "OeFgpUo8gKc", "game": "スト6", "summary": "C.ヴァイパー実装日の配信。触ってみて難しさと評価の見立てを話した。JPが弱体化されなかったことや次の調整時期の予想にも触れ、視聴者の質問にはアムネジアを取ったあとの動きで答えた。", "highlights": [{"t": 1377, "head": "ヴァイパーは難しく強さも不透明", "body": "C.ヴァイパーは思っていた5倍ほど難しいキャラだと振り返った。強さは今のところ不透明で、この手のキャラは実装初日に強さが分かるわけがない。さらに、相手の行動に疑問を持っても自分で再現して調べにくい難しさがある、という見立て。", "chars": ["C.ヴァイパー"], "themes": ["patch"], "side": "", "tags": ["雑談", "見立て"]}, {"t": 1791, "head": "ヴァイパーの評価は固まるのに時間がかかる", "body": "EDも、危険な要素を大量に持っていたのに、実装日はあまり強くないとされ、最初の1か月ほどは評価が微妙だった。C.ヴァイパーも評価が固まるのに時間がかかるだろう。今の時点では弱いとも強いとも言えない。", "chars": ["C.ヴァイパー", "ED"], "themes": ["patch"], "side": "", "tags": ["調整", "見立て"]}, {"t": 1989, "head": "メカザンギのバーンアウトが見分けにくい", "body": "メカザンギと当たった経験から、バーンアウトしているかどうかが見た目で分かりにくいと感じた。ゲージを見れば分かるが、ゲージ以外では判断しにくい。", "chars": ["ザンギエフ"], "themes": ["matchup", "resource"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 4335, "head": "次の調整は12月でCPT後という見立て", "body": "次の調整は、去年が12月だったことから、CPTの予選がすべて終わってからだろう、という見立て。今年は10月終わりの中国が最後の予選なので、その後になりそうだ。調整があれば嬉しい反面、JPはナーフされうるキャラなので怖くもある。", "chars": ["JP"], "themes": ["patch"], "side": "", "tags": ["調整", "見立て"]}, {"t": 4620, "head": "大足の連携は食らい逃げと見分けにくい", "body": "大足から連続ガードにつなぐ連携は、食らい逃げが対策として成立するため、相手がミスで食らったのか意図して食らい逃げしたのか分かりにくい。食らったあとに後ろ受け身をしたなら食らい逃げだと思うようにしている。ミスで食らっている相手なら中攻撃を押せばよいが、判断は難しい。", "chars": ["JP"], "themes": ["offense", "defense"], "side": "jp", "tags": ["解説", "振り返り"]}, {"t": 4920, "head": "今ヴァイパーを使わない3つの理由", "body": "今ヴァイパーを使わない理由は3つ。中国の大会が控えていてJPも弱くされなかったので使う理由がない、評価が固まってからでもよい、とても難しい。対戦については、ヴァイパーは受けが弱いので、一度追い込めばJPが一気に勝てそうな印象だと話した。", "chars": ["C.ヴァイパー", "JP"], "themes": ["matchup", "patch"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 5928, "head": "アムネジアを取ったあとの連携の質問", "body": "画面中央でアムネジアを取ったあと着地に中段を仕掛けるのはどういう連携か、という質問への答え。前ジャンプから中下段をかけると、アムネジアの弾とトルバランが連続ガードになり、中下段をかけられる連携だったと思う、という見立て。続く質問には、よく使う2つの動きを実演した。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}, {"t": 8702, "head": "ブランカは大きなナーフを受けていない", "body": "ブランカの一番すごいところは、一度も大きめのナーフを受けていないことだ。ナーフ自体はされている。1年目の最初にSA2と人形の強さが知られたが、ほとんど調整されなかった。次こそはナーフされるだろうと思われ続けても、されていない。", "chars": ["ブランカ"], "themes": ["patch", "matchup"], "side": "", "tags": ["調整", "雑談"]}], "title": "【スト6】レジェンドJP　30秒だけヴァイパー見てからランクマ", "date": "20251015", "duration": 11288}, {"id": "3XDxwlJyKOk", "game": "スト6", "summary": "ランクマを回しながら、C.ヴァイパー追加を前にした見立てや次の調整の予想を話す配信。ヴィーハトの強さ、ジェイミー戦のきつさ、トリグラフの当たり判定の検証も取り上げた。", "highlights": [{"t": 638, "head": "C.ヴァイパーを触る時期の見立て", "body": "C.ヴァイパーは触りたいが、本格的に触るのは11月に入ってからと話した。そのころには半月ほど経って評価が見えているので、弱いとなっていれば触らない。印象は、攻めが強そうに見える一方、無敵技が不便そうな要素もある、というもの。", "chars": ["C.ヴァイパー"], "themes": ["patch"], "side": "", "tags": ["調整", "雑談"]}, {"t": 2048, "head": "次の調整は小さいという見立て", "body": "次の調整は、本当のことを言えば何もないと思う。あっても少しの調整で、大きな調整が入る可能性は低いという見立て。ナーフの候補はJP、ブランカ、ED、可能性は低いがベガも挙げた。強化はエレナで、ガイルとザンギエフが微妙なライン。", "chars": ["JP", "ブランカ", "ED", "ベガ", "エレナ"], "themes": ["patch"], "side": "", "tags": ["調整", "見立て"]}, {"t": 2445, "head": "大きなナーフは来年6月という見立て", "body": "次の調整で大きなナーフは来ないと思い、あるとしても来年の6月ではないか、という見立て。JPが大きく弱くなっても、使い続ける人は一定数いるという話もした。", "chars": ["JP"], "themes": ["patch"], "side": "", "tags": ["調整", "見立て"]}, {"t": 5477, "head": "トリグラフが当たる条件を検証", "body": "しゃがみ中攻撃からトリグラフが当たるかを、実際に試して確かめた。しゃがみ中攻撃だと必ず当たるが、別の通常技だと下まで判定がなく当たらないことがある。中Kも同じで、判定と発生の関係かな、と話した。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["検証", "練習"]}, {"t": 8586, "head": "JPの強さはヴィーハトの比重が高い", "body": "JPの強さのうちヴィーハトが占める割合は大きい。ミラーで戦うとヴィーハトの強さを実感する。JPは中央でも中攻撃の連打で連続ガードを作れるキャラなので、なおさら感じやすい。", "chars": ["JP"], "themes": ["setplay", "neutral"], "side": "jp", "tags": ["解説", "雑談"]}, {"t": 8685, "head": "ジェイミー戦はきつい", "body": "ジェイミーに飲まれると対空がきつくなるのは、通常技で対空するキャラの定めで逃れられない。その意味でジェイミー戦はきつく、やりにくい対戦だ。", "chars": ["JP", "ジェイミー"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["キャラ対策", "Q&A"]}], "title": "【スト6】レジェンドJP　病み上がりマン", "date": "20251014", "duration": 9906}, {"id": "-DOe9xRz-cI", "game": "スト6", "summary": "ランクマを回す配信。前日の深夜に思いついた連携を試しながら説明した。入力がブレやすく、うまく決まらない場面もあった。", "highlights": [{"t": 5618, "head": "深夜に思いついた連携の説明", "body": "前日の深夜に思いついた連携を、試しながら説明した。連続ガードで削ったあとに、前ステップからインパクトなどを狙う形が強いだろう、という見立て。ただ入力がブレやすく、うまく決まらない場面があった。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["セットプレイ", "解説"]}], "title": "【スト6】レジェンドJP　ランクマとかカスタムとか", "date": "20251006", "duration": 7308}, {"id": "38L7HJO3Awc", "game": "スト6", "summary": "ランクマを回しながら視聴者と雑談する配信。コンボを、ほかの人のレシピも見ながら検証し、入力の簡単な型を覚える方針を話した。設置を両方中設置にそろえるコンボも試した。", "highlights": [{"t": 3868, "head": "コンボは簡単な型を覚える", "body": "コンボを検証し、いちばん高いのはほかの人のルートだが、こちらのルートでも足りると確かめた。やっていることはややこしいが入力は簡単で、画面端ならいつでもできるので、覚えるならこちらだという見立て。実戦でその場面になると入力を間違えてしまいそうだとも振り返った。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["解説", "コンボ"]}, {"t": 5472, "head": "設置を両方中設置にそろえるコンボ", "body": "設置を弱と強で打ち分けず、両方中設置にそろえると、考えることが1つ減ってコマンドも簡単になる。普段のコンボより300前後高いと見積もった。", "chars": ["JP"], "themes": ["combo", "setplay"], "side": "jp", "tags": ["コンボ", "検証"]}], "title": "【スト6】レジェンドJP　明日はWW", "date": "20251004", "duration": 7881}, {"id": "3VKK8INtQSs", "game": "スト6", "summary": "ランクマ配信。途中で、初心者にどのキャラを勧めるかという質問に答え、JPは初心者に勧めにくく、モダンならホンダ・ブランカ・マリーザなどが良いという見立てを話した。", "highlights": [{"t": 4232, "head": "初心者にJPは勧めにくい", "body": "JPは初心者相手なら弾を撃っていれば勝てる場面もあるが、不自由な面があり、覚えることも多いので、ガチの初心者に勧めるのは微妙だ。とにかく勝つ経験をしたいなら、モダンのエドモンド本田・ブランカ・マリーザの3強という見立てで、リリーもモダンでやることが簡単だ。好きなキャラを使うことはモチベーションに関わるので大事だが、好きなキャラが弱い場合は一概に勧められない。", "chars": ["JP", "エドモンド本田", "ブランカ", "マリーザ", "リリー"], "themes": ["practice"], "side": "", "tags": ["Q&A"]}], "title": "【スト6】レジェJP　ランクマとかカスタムとか　同時配信始めました", "date": "20251003", "duration": 11313}], "book": [{"id": "tachimawari", "name": "立ち回り", "lead": "JPの立ち回りは、中間距離の通常技（大P・中K・大K）で相手の前進を止め、ダウンを取ったら設置とラインを上げる流れが軸になる。ドライブゲージの残りで前に出るか撃つかを決める。", "sections": [{"title": "中間距離は大Pがぎりぎり届く間合いで振る", "body": ["2026年5月〜7月の配信では、JPは通常技が強く、中でも大Pがぎりぎり届くかどうかの中間距離がいちばん強い。密着は小技のフレームが重くて弱い。中央では大P・中P・中足を振り回し、リターンが直接大きいのは大Pで、ダウンが取れたら設置につなげる。 {{Wr9dUkkfM-g@9318}} {{Xec6eJ-w62w@8646}} {{4vJjrBXQ7NY@682}}", "3大Pは、リーチの長い下段で、差し返しを見てうろつく歩きの多い相手に刺さる。ガードされるとマイナ14になり、近距離なら試合が終わるほどの反撃を受ける。ど先端で当てればほぼ全キャラに確定反撃がなく、押し置きができる。2026年4月の動画での説明だ。 {{fpvEhseVtV0@11}} {{fpvEhseVtV0@24}} {{fpvEhseVtV0@0}}", "2026年7月〜11月の配信では、大Pは先端だとしゃがみの相手に当たらないため、ほぼ置き技として使い、相手の前歩きに刺さる位置に置く。一歩踏み込んでガードさせにいくつもりで振る。空振りが多いときも、実感より1歩踏み込むくらいでよい。 {{AUIvAc6QVVk@3837}} {{evBaj9xQWio@1897}} {{gTpEBizr3ks@4632}}", "2026年8月の動画では、Year4の調整で大Pが弱くなったとしている。下がりをレコードして大Pを振ると相手がかなり下がる。発生の早いキャラや歩きの速いキャラには、透かされて差し返される場面が前より増える。2026年8月の配信でも、春麗のような足の速いキャラには大きく下がられるが、JPやサガットのような足の遅いキャラへの影響は大きくないという見立てが出ている。「先端なら確定がない」とした2026年4月の動画は、この調整より前のものだ。 {{20Ut1TXnUik@0}} {{j7hEDnNDJlQ@104}} {{gYHNHkrNd8w@3127}}"]}, {"title": "差し返しは中K、ラッシュ止めは中攻撃", "body": ["差し返しは基本的に中Kで返す。神木Cがよく使うのは、マイナ3の状況から8フレの中Kを振る行動で、いい距離なら相手の小技暴れにちょうど勝つ。相手の打ち返しが4フレほど遅れても勝ち、決まり手になる場面が多い。相手が最速の中足で打ち返すと負けるが、JPの中足は全キャラで一番長いので、先端で当てれば勝つ。 {{uRveIeiCzyo@0}} {{uRveIeiCzyo@32}} {{uRveIeiCzyo@21}}", "中Kは足元の判定が強く、大Pが届かない距離でも相手の技の足元に残った判定を殴れる。余裕を持った反応でも差し返しが成立し、大足への確定反撃でもいちばん頭を使わずに使える。ガードされても有利なので攻めを続けられる。 {{uRveIeiCzyo@58}} {{uRveIeiCzyo@68}} {{uRveIeiCzyo@103}}", "2026年4月〜5月の配信では、ラッシュを止める技も大体は中攻撃で、スタンダードはしゃがみ中攻撃になる。止めるときは見てからではなく、ほぼ置きで出す。中Pは置き技ではなくラッシュ止めとフレームトラップの技で、神木Cの対戦でも置くことはほぼない。 {{GBiKAIdv4FQ@4707}} {{yxaNPHz2auY@4652}} {{XY8XQBAvQv0@7644}}", "2026年4月の配信では、長い技を持つ相手には大Pで差し返すとしている。2026年6月の動画では中Kでの差し返しを解説しているが、配信は違う。2026年5月の配信では、マスターからハイマスを目指す視聴者へ「差し返しを頑張るのはやめる」ことを勧めている。2026年7月の配信でも、歩きの遅いJPで差し返し主体は難しいとしている。 {{GBiKAIdv4FQ@3020}} {{tpQg36xBmD0@4386}} {{gTpEBizr3ks@2388}}"]}, {"title": "大Kは前に出たい相手に置く", "body": ["2026年3月〜9月の配信では、大Kは当てに行く技ではなく、前に出てくる相手に置く技だ。ラッシュや前ステで来そうな距離、投げ抜けの後、インパクトをガードさせた後など、お互い前に出たくなる場面で置くと当たる。何度も質問され、繰り返し同じ基準を答えている。 {{_LIvr7jcqx0@4044}} {{DiIybykNHnA@5128}} {{M-hVEg_phXA@3863}}", "2026年4月〜6月の配信では、振る基準は言葉にできず感覚だという答えも繰り返し出ている。読みというより、相手が前に出そうな場面で振る感覚で、磁石のように吸い込まれると言われることにも、コツは前に来そうなところで振ることだけだとしている。 {{fZgVDyrd5gM@8083}} {{-rrXNES3ACw@4382}} {{iOeE6a4i3Hg@3064}}", "2026年5月〜9月の配信では、距離の目安は、相手の中足がぎりぎり届かない距離だ。ガイルのようにしゃがみが多いキャラには刺さりにくく、先端でないと振らない。昇龍のないキャラ相手では振る機会が増える。マリーザのグラディウスのように、大Kが置き技に引っかかると大きく負けるキャラには控えめにする。 {{8fWBeWhQDKs@9003}} {{2-qY9UdbDGw@3968}} {{AOaVhAk3gSw@2866}}", "2026年6月の配信では、大Kは相手から差し返しにくく強いとしている。2026年9月の配信では、Year1の頃は無限に振ってよかったが、今は差し返されるので距離を考える必要があるとしている。中足で相手の後ろ下がりを咎めておくと、大Kを当てやすくなる。2026年3月の配信では、相手の起き攻めが重なっていない場面で、リバーサルの大Kが勝つことがあるとしている。 {{fTLTYUgGTuo@1706}} {{evBaj9xQWio@6815}} {{DiIybykNHnA@5524}}"]}, {"title": "大Pラッシュと遅らせ大Kで固める", "body": ["大Pラッシュの後は、何もしないでガードすると相手の無敵技をガードできる。SAでも同じだ。大Pラッシュ中足は連続ガードかつ下段なので、前入れで昇龍を入力した相手に中足が当たる。相手は大Pラッシュに無敵技を打ちにくくなり、JP側に有利な状況になる。 {{_mOPb3s_vtI@24}} {{2RL5sSXwv3A@892}} {{Zn4heiO2Pjs@7944}}", "対JPの動画では、大Pラッシュを見て無敵技をガードするなら入力を遅らせ、JPが走り終わったあたりで投げを入れる、とされている。これに対してJP側は、大Kを大きく遅らせて出す。この読み合いはJP側のリターンが大きく、相手がドライブリバーサルを出してもゲージの交換にしかならない。 {{_mOPb3s_vtI@217}} {{_mOPb3s_vtI@271}} {{_mOPb3s_vtI@78}}", "2026年4月〜9月の配信では、遅らせた大攻撃からの差しは、ゲージが回復するうえに火力も出て得が大きい。ただし2026年5月の対戦では、相手が遅らせに後ろジャンプを合わせ、前歩きガードから大Kで確定を取る形に変えてきた。後ろジャンプに変えたと分かった時点で、最速の大Kで固めに行くべきだったと振り返っている。ラッシュ後の守りは、遅らせ投げ抜けで相手の無敵技をガードするのが基本だ。 {{Jsg1B-3ogLY@3113}} {{b3Zfr0Fwz6E@118}} {{dqwcwYNCios@3792}}", "2026年4月〜9月の配信では、大Pや中攻撃からのラッシュ大Kは連続ガードにならず、昇龍を持つ相手には昇龍が入るので強くない。しゃがみ中ラッシュ小PもJPは連ガを作れない。やるなら大Pからにする。ラッシュ大Pのときはトルバランを仕込まない。大P・ラッシュ・大Pの連携は読み合いの割がいいが、ゲージ消費は激しい。中央で大Pをガードさせたらほぼラッシュに行き、OD設置はしない。相手がインパクトを押していると、ゲージを使ったうえでインパクトを食らう。 {{2RL5sSXwv3A@467}} {{uKBhh1Wz8us@4275}} {{MPaucCetMzA@10493}}"]}, {"title": "設置してラインを上げ、端を目指す", "body": ["2026年3月〜9月の配信では、地上のラインの上げ方は、設置して歩く。設置すると相手が何もできなくなる。設置後に相手が下がっても、歩いてラインを上げ、ドライブゲージを回復してまたヴィーハトを置く。中央で設置してラインが上がった時点でリターンで、前歩きでゲージを回復できていれば十分だ。 {{M-hVEg_phXA@7163}} {{evBaj9xQWio@4275}} {{DiIybykNHnA@6250}}", "2026年3月〜10月の配信では、設置前の判断軸は自分のゲージだ。ゲージがなければシューティングで時間を稼いで溜め、余裕があれば前歩きでラインを上げる。神木Cは相手と中Pがぎりぎり届くか届かない距離を好み、ライン上げを選ぶことが多い。ゲージが足りないときは、設置して前に出ながら回収し、後ろに下がらない。 {{QTL5e1tPUHA@1800}} {{FrmvKucHeSE@1131}} {{Itmg-znx9Lg@1759}}", "2026年1月〜8月の配信では、設置を置くのは確定を取られにくいタイミングにする。設置自体は直接ダメージにならないので、適当に置いてばかりいると近づかれ、ゲージを払ってダメージを受ける。OD設置はゲージを2本使うため、その後の自分のゲージを見る必要がある。不利なので、とりあえず出すのはよくなく、対空の後に入れたい。 {{zAhVM3GijPc@4963}} {{fTLTYUgGTuo@3706}} {{CqtlWQkwSbQ@6067}}", "2026年4月〜6月の配信では、中央の立ち回りの最大のゴールは、相手を画面端に固めてトリグラフからセットプレイに行くことだ。端に追い込んだのに自分から下がる人は多く、戦略的な理由がなければ下がらない。端の設置は、トリグラフを撃った時点でドライブゲージが3本ほどあり、同じセットプレイをもう一度できる状態が目安になる。 {{evpvUg-D5Vk@3974}} {{MPaucCetMzA@7640}} {{MPaucCetMzA@8617}}"]}, {"title": "シューティングは意味を持たせて撃つ", "body": ["2026年9月の配信では、神木Cはシューティングが得意でも好みでもなく、ふだんはあまりやらない。JPはシューティング主体か近づくかの個人差が大きく、好きなほう、強く使えるほうで決めてよい。画面端にきちんと詰める展開のほうが、シューティング展開より勝ちが多い気がするという見立ても出ている。 {{Jsg1B-3ogLY@1212}} {{M-hVEg_phXA@711}} {{Jsg1B-3ogLY@3734}}", "2026年3月〜6月の配信では、弾を撃つだけでは解決しない。相手が苛立ってボタンを押すか適当に飛ばない限り弾は当たらず、結局は打撃が大事だ。シューティングには、ゲージ状況を有利にする、自分のゲージを回復する、相手が攻めてくるのを止める、のどれかの意味が要る。互いにゲージも体力も満タンなら、相手はガードしてワープだけ落とせばよい。 {{WoW4QU4Dvnk@5560}} {{evpvUg-D5Vk@885}}", "2026年4月〜7月の配信では、遠距離でちまちま戦う展開に飽きて別の行動を取り、負けるのが傾向になっている。ワープだけを見て待つ相手には、ワープせずそのまま弾を撃ち続ける。弾から弾へ間を空けずに出す練習も要る。間が空くと、その分だけ相手の飛びが当たるフレームが増える。 {{bovUPYpqM9k@2084}} {{tdyU_8woXj8@2101}} {{Xec6eJ-w62w@7825}}", "2025年11月〜2026年5月の配信では、弾の撃ち合いになるとトルバランフェイント以外は基本負けるので、撃ち合いに付き合わない。トルバラン単体は波動として弱く、強さはヴィーハトやトリグラフなどの設置と合わせた削りと崩しにある。対JPの動画では、弾の張り直しの場面はJPが不利でマイナ19（OD版でもマイナ9）なので、設置をやり直す限り相手は歩けるとしている。 {{OqBKvk1tCl8@1096}} {{Wr9dUkkfM-g@9073}} {{VhKotbb94dI@551}}"]}, {"title": "トルバランのフェイントでパリィを釣る", "body": ["2026年6月〜9月の配信では、弾の使いどころでいちばん多いのは、大Pからのトルバランのフェイントだ。パリィした相手にはダッシュ投げにつなぎ、ラッシュしてくる相手にはしゃがみ中攻撃を当てる。パリィしない相手と分かれば、中トルバランなどで普通に撃ってゲージを削る。 {{wsmE7M2oF7M@1041}} {{2RL5sSXwv3A@3081}} {{evBaj9xQWio@9699}}", "対JPの動画でも、フェイントはパリィを釣る行動で、パリィと分かれば投げに来るので、うっかりパリィしたらラッシュで逃げるとされている。受ける側はパリィをなるべく貼らないのが基本だが、フェイントかどうかの見分けはかなり難しい。パリィを張る相手には、フェイントでパリィを誘ってしゃがみ中で止める形がJP有利になりやすい。 {{VhKotbb94dI@52}} {{VhKotbb94dI@482}} {{2RL5sSXwv3A@5496}}", "2026年5月の配信では、近距離で撃つトルバランは、相手の行動を釣る嫌がらせに強い。トルバランに飛ぶ相手には、フェイントを混ぜると飛びを落とせる。 {{Zn4heiO2Pjs@9160}} {{84fijnCF6Io@6337}}", "ODトルバランの評価は、配信の中で変わっている。2026年4月の配信では、弱トルバランやトリグラフで足りるところでODを使う無駄を反省している。2026年8月の配信では、ODトルバランからの発動を相手の頭に刷り込めれば強いと評価を改めた。2026年9月の配信では、相手のラッシュで突き抜けられる場面が出て、そこをトルバランの弱いところだとしている。 {{fQP25E3Ed9s@9845}} {{OuGmSoPe7e8@10107}} {{RsQ9LmSpnOA@3864}}"]}, {"title": "ストリボーグはゲージ効率と調整で評価が変わる", "body": ["2026年3月〜7月の配信では、コンボにドライブラッシュを使うと、終わるまでドライブゲージが回復しない。ODストリボーグで済ませると、使うゲージは2本で回復も早くから始まり、ダメージも大差ない。神木Cは大Pからのラッシュにゲージを使うことが多く、コンボ自体はODストリボーグで済ませることが多い。 {{WoW4QU4Dvnk@6270}} {{Mt7OURKQo9Q@1474}} {{nVJ1B9hi_lA@444}}", "2026年4月〜5月の配信では、最大火力を狙うときも、締めはODストリボーグがよい。ODトリグラフ、ODトリグラフ、トリグラフまで続けて入る。設置の起爆が当たった後は、ODストリボーグのあとにトリグラフ設置のほうがフレーム状況がよく、ODトリグラフのあとの設置は火力が高い。 {{V5_ZtjBws9w@4019}} {{7Vo4NfgxoFk@2317}}", "牽制としての評価は時期で分かれる。2026年7月の配信では、弱・中ストリボーグはガードされたときのマイナスが大きく、近めの距離でSA1の確定を取られるキャラが多く、牽制には向かないとしている。強ストリボーグはガードさせて有利だが発生が遅く、置き技として使う。 {{DHwYs05qqek@4998}}", "2026年8月の調整後は、弱とODのストリボーグの判定が前方に広がり、大Pに対してぎりぎり当たる距離の牽制として強そうだと見ている。ただし食い込んで2段目だけが当たる距離だと、ルークのSAなどで確定を取られるため、先端を見極めて振る前提になる。動画では、アムネジアと大Pの弱体化は痛いが、ストリボーグは牽制技としては強そうだとしている。 {{gYHNHkrNd8w@790}} {{gYHNHkrNd8w@2498}} {{j7hEDnNDJlQ@129}}"]}, {"title": "対空は落とせるものを落とし、間に合わなければジャストパリィ", "body": ["2026年6月〜10月の配信では、対空はできるだけ落とし、間に合いそうにないときはジャストパリィで受ける。空投げができると強い。JPは空投げと前大Kの対空を使い分けるのが一番で、ジャストパリィ対空は最初に持っておきたい手札になる。ただし全部をジャストパリィ対空にすると、キャミィやジェイミーのすかし投げを食らい続ける。 {{KC4ifg4QEtA@705}} {{ff2oYUGxmBQ@5056}}", "2026年4月〜7月の配信では、立ち大Pの対空は、キャノンストライクと噛み合う場面はあっても、ただの前飛びには対空になっていない。キンバリーの肘は、落とせる距離なら大Kで落とすのがいちばんよく、コンボに行ける。豪鬼への空対空は、遠くで当ててフォースダウンを取るならリーチの長いジャンプ中Pが向き、ジャンプ中Kは素当てでコンボに行けるが届く範囲が短い。 {{gTpEBizr3ks@5344}} {{fTLTYUgGTuo@5607}} {{oENeZfFwNPg@5279}}", "2026年5月の配信では、飛ばれやすいのはJPの弱点で、割り切るしかない。改善点は、相手が飛びの多いタイプかを見ること、落とせる飛びをきちんと落として飛びにリスクを与えることだ。空対空にジャンプ中Kが間に合えばコンボに行けるが、神木C自身はあまりできていない。 {{84fijnCF6Io@6337}} {{84fijnCF6Io@6785}}", "対空の無敵については、2026年4月の配信で、対空無敵がないのはJPとダルシムだけという見立てが出ている。2026年8月の配信では、キャラごとに無敵技の対空がよいことはあるのかという質問に、JPの場合は通常技ではなくアムネジアで対空すると答えている。2026年8月の動画では、前大Kが垂直ジャンプに対してめり込み気味に対空したときに2段目が当たるようになったとしている。 {{vSWEsptAeec@2068}} {{R5jtd6nJRK4@2578}} {{j7hEDnNDJlQ@92}}"]}, {"title": "ジャンプは中Pと前飛びを使い分ける", "body": ["2026年6月〜8月の配信では、ジャンプ中Pは非常に長く、垂直ジャンプから振ると相手の行動を抑制する効果が高い。判定は強くないので、相手が対空技を出していれば負けるが、何もせずに着地すれば対空技の隙に確定を取れる。 {{OuGmSoPe7e8@1477}} {{-rrXNES3ACw@2081}}", "2026年7月の配信では、前ジャンプを選ぶのは、波動拳を持つキャラに対して、キャンセルできない技で微妙な距離になり、次は波動拳が来るという読みが立つときが多い。リバサで前飛びは普通しないが、投げを読んだときは選択肢になる。リバサジャンプしかしないのはダメで、一切やってはいけないわけでもない。 {{QTL5e1tPUHA@2230}} {{QTL5e1tPUHA@2735}}", "2026年4月〜9月の配信では、咎められていないだけで垂直ジャンプをする癖があり、前飛びを増やす方向で考えている。JPは前飛びを重ねたとき、相手が前ジャンプしていれば垂直空投げで相手を画面端に戻せるが、めくり技を出されると食らう。相手が垂直ジャンプをよく出すなら、空投げで落とし続けるのが有効だ。 {{Jsg1B-3ogLY@1576}} {{RwBFCqfbtrA@6503}} {{uKBhh1Wz8us@3737}}"]}, {"title": "アムネジアは当て身であり、確定の技ではない", "body": ["2026年5月の配信では、アムネジアは確定リターンではない当て身だ。小Pを取ると、取られた側が有利になって読み合いが再発し、リターンが0になる場合がある。一方、投げや持続の長い技を取れば爆発力が出る。0点か120点の技だ。存在するだけで強く、ODアムネジアをほとんど撃たない相手でも、どこかで警戒してしまう。 {{fZgVDyrd5gM@1513}} {{dhljVsWRWBQ@2849}} {{iH2etZNc6zg@4660}}", "2026年4月〜6月の配信では、昇龍拳との比較では、トータルでは昇龍拳が強いという見解が出ている。昇龍は無敵以外の面でも安定した対空技で、キャンセルラッシュ確定もある。それでもアムネジアは取った後に特定のコンボへ行ける点が唯一無二で、上振れたときの出力が大きい。取った後にどの技が確定するか、有利か不利かは把握しておく。 {{UbimFsDclH0@2040}} {{8-mSJY7tMNQ@9928}} {{vn8DB9xIkEU@4560}}", "2026年5月の配信では、出してはいけない場面がある。自分が先に動ける有利フレームで出すと、相手がボタンを押す確率がゼロなので当たらない。コンボ締めの技はほとんどのキャラでガードすれば大きな反撃が入るため、そこへのアムネジアは意味がない。大Pラッシュに仕込むと、ミスして目の前で隙をさらすリスクが大きい。 {{Wr9dUkkfM-g@8542}} {{Zn4heiO2Pjs@11257}} {{Ebe_1eYUK38@11390}}", "2026年8月の動画では、アムネジアは小Pが限界で、今回の調整で最も大事な変更だとしている。2026年8月の配信でも、前ほどアムネジアに頼れなくなり、リバーサルと投げ読みのバックの重要度がかなり上がったという見立てだ。2026年11月の配信では、ジャストパリィを嫌がられて投げを重ねられても、アムネジアで入れ替えられる選択肢が残るとしている。 {{j7hEDnNDJlQ@1}} {{JljSmBPaBfM@6116}} {{8RylXGykVY4@3273}}"]}, {"title": "ジャストパリィとインパクトは割り込みに使う", "body": ["2026年7月〜11月の配信では、パリィは相手の連携への割り込みに使う。連携の途中でジャストパリィを取れるようになると、相手は攻めにくくなる。起き上がりのジャストパリィは、相手が重ねてきた技に合わせ、リバーサルの表示が出ていれば大丈夫だ。暴れのジャストパリィは起き攻めの初段を狙う。 {{JdR_4go3Ihc@2637}} {{evBaj9xQWio@2408}} {{8RylXGykVY4@2701}}", "2026年5月〜9月の配信では、光ったのを見てからのジャストパリィは、キャミィのフーリガンコンビネーションに釣られやすい。ジャンプ大Pも、パリィを釣るための行動として来ることがある。JPミラーでは、トリグラフをジャストパリィしてトリグラフを返せるようになると、撃ち合いがかなり有利になる。 {{Zn4heiO2Pjs@3488}} {{qBcQGeJYpLg@3515}} {{uKBhh1Wz8us@4964}}", "2026年6月〜10月の配信では、確定反撃の始動は、大体インパクトにする。リーサルがあるときはラッシュから入り、相手がバーンアウトしていなければインパクトから入ってゲージを削る。インパクトでの割り込みは読みで、相手が普通に大Pを出していたら負ける。バーンアウト中のインパクトは、相手がいちばん警戒している時間帯なので返されるリスクがやや高い。 {{8fWBeWhQDKs@5031}} {{2RL5sSXwv3A@3926}} {{ff2oYUGxmBQ@4520}}", "2026年4月〜7月の配信では、インパクトの後は、前ステより前歩きのほうがドライブゲージが少し回復する。差は誤差レベルだ。早掛けにはボタンを押すのと同じくらい、ジャストパリィを見せることが大事になる。OD技を2段ジャストパリィしておくとSAで返せるが、難度は高い。 {{tdyU_8woXj8@1086}} {{UbimFsDclH0@4527}} {{PMEs-NY-iD8@8921}}"]}, {"title": "ワープはジャストパリィで見て返し、ダルシム戦はテレポを落とす", "body": ["イングリッドのワープは、キンバリーやダルシムのテレポと違い、必ず攻撃判定が出る。ガードすると不利になる。見てからジャストパリィをするとよく、外しても裏目がない。2026年6月と8月の動画で同じことを繰り返している。 {{NCU2nCTFHWE@0}} {{NCU2nCTFHWE@12}} {{odGhkR7MFco@53}}", "インパクトの扱いは、動画と配信で食い違う。2026年6月・8月の動画では、ワープを見た瞬間のインパクトは、相手が別の動きをすると爆発するのでおすすめしないとしている。2026年6月の配信では、インパクトは最もリターンが出るが、外すと終わるとしている。2026年10月の配信では、初手に後ろワープを選ぶ相手は基本いないので初手はインパクトが通り、2手目以降はジャストパリィを選ぶことがほとんどだとしている。 {{odGhkR7MFco@75}} {{QJy4s3alemg@291}} {{U1N5IuQSEvk@1971}}", "しゃがみ大Pでもワープに対応できるが、遅れると前蹴りを食らう。2026年6月の動画の概要欄では非推奨としている。2026年5月の配信では、近距離でJPの中足を安易に振るのを避けるとしている。前大Pを見てジャストパリィするより、中足をすかされて負ける場面のほうが多い。 {{NCU2nCTFHWE@22}} {{uJDuKXzhNOs@2542}}", "2026年3月〜5月の配信では、ダルシム戦は、テレポを落とすことが最優先になる。ワープには空投げが使え、地上ワープ以外は基本空投げでよい。空対空でフロートを落とせば、攻撃を入れられる。ダルシム相手のトリグラフはテレポで狩られるため、相手がテレポするタイプならなるべく減らす。 {{7Vo4NfgxoFk@11038}} {{pe3OwQE-X9E@2284}} {{7Vo4NfgxoFk@10670}}"]}, {"title": "ドライブゲージは使いに行き、バーンアウトは相手にさせる", "body": ["2026年3月〜9月の配信では、ドライブゲージが6本の満タンは損をしている状態で、キャンセルしてトリグラフを出す、OD技に使うなど、何かの形で使いに行く。JPはシューティングで距離を取ったり投げを通したりするうちにゲージが回復するので、残っていれば大胆に使う場面が多い。 {{uKBhh1Wz8us@3477}} {{WoW4QU4Dvnk@5410}} {{DiIybykNHnA@3686}}", "2025年12月〜2026年4月の配信では、相手をバーンアウトさせ、自分はしない方針が重視されている。JPはこれがかなり強く、相手がラッシュに行けない状況を作れると行動を制限できる。削る手段は、弾のパリィ、自分の弾をパリィさせて釣ること、確定反撃のSAだ。自分から落ちる原因としては、よく分からない場面でのキャンセルラッシュが挙げられている。 {{dqwcwYNCios@6556}} {{dqwcwYNCios@6026}} {{RwhcgxJUps4@2648}}", "2026年8月〜9月の配信では、バーンアウトさせた後は、SAをやりたくて無理に近づかず、削って当たったらSAを入れる形でよい。生ラッシュで入ると止められて逆転されるので、ゲージに余裕があれば連続ガードになる形で入る。大PからのODトルバランも強い形だ。補正切り行動は、バーンアウト中の相手以外にはあまり使えない。 {{uKBhh1Wz8us@2964}} {{uKBhh1Wz8us@3295}} {{mWlneLs90qQ@3060}}", "自分がバーンアウト中に固められたときの動画の対処もある。サガットのしゃがみ中連打は、立ってガードするとサガット側が不利になり割り込める。ケンの迅雷脚は、中迅雷脚の下段が連続ガードで初段止めでもマイナ3なので、何でもよいのでボタンを押しておく。2026年3月の配信では、JPの大攻撃のゲージ削りが以前より弱くなったという感触も出ている。 {{i3rONIDr_9M@1}} {{Zx_-M_fIjjg@22}} {{5v6ISmOphzk@2613}}"]}, {"title": "画面端と起き攻めの守り、簡単な行動を選ぶ", "body": ["2026年3月〜11月の配信では、画面端を背負ったときは、昇竜の届く距離からは攻めを仕掛けられないので、大足などで我慢して凌ぐか、前飛びや垂直ジャンプで通す。暴れをうまく通せれば、そこからSAにつなぐ。怖くて後ろに下がり続け、勝手に画面端を背負う人が多い。有利なのに圧に押されて下がるのも、ありがちな負け方だ。 {{2vL4Q5qBTwE@5899}} {{pe3OwQE-X9E@6746}} {{OuGmSoPe7e8@9176}}", "2026年7月〜9月の配信では、端の守りは、起き攻めの傾向を見て対応を変える。投げを重ねてくる相手にはバックで避け、本当に面倒なときはアムネジアを使う。壁端で投げとシミーのどちらを見るかは、シミーを見て無限投げで負けたなら読み負けでしかたがない。読み合いを読まれないために、秒数の偶奇のようなタイムカウントで行動を決める方式を挙げ、自分でも取り入れてみるとしている。 {{uKBhh1Wz8us@3530}} {{JdR_4go3Ihc@6757}} {{JdR_4go3Ihc@7026}}", "2026年3月〜9月の配信では、弾を重ねられ続けるときは、リバーサルで起こす。切り返しは最後はじゃんけんだが、ダイヤ帯などではそもそも読み合いになっていない場面が多い。自分が有利フレームなのにアムネジアを出しても、相手はボタンを押さない。投げ抜けは、投げ抜けを狩る打撃を食らうリターンが大きいので、押さないほどよい。 {{8fWBeWhQDKs@6165}} {{Zn4heiO2Pjs@10796}} {{pe3OwQE-X9E@4633}}", "2025年10月〜12月の配信では、このゲームは勢いが大事で、受けに徹して勝てている人は2、3人ほどだ。簡単な行動はミスが少なく再現性が高いので、どちらでも勝てる状況なら難しい行動をせず簡単なほうを選ぶ。 {{jn00EZFiNZw@4109}} {{RwhcgxJUps4@13516}}"]}, {"title": "キャラ別の立ち回りの要点", "body": ["ベガ戦は、デビルリバースを空中で落とせるとリターンが上がる。2026年3月の配信では、調整でデビルリバースが横に移動しにくくなり、通常技で見ていれば落ちることが多くなったとしている。2026年10月の配信では、空投げはデビルリバースに負けるのでジャンプ中Pで落とし、同時飛びくらいまでならそのままフルコンボに行けるとしている。2026年7月の配信では、ダブルニーを打たれにくくするため、バックステップを他のキャラ戦より多めに使うとしている。 {{7TC-ZplMp7c@2370}} {{U1N5IuQSEvk@1683}} {{H-WQjXXkNyk@3177}}", "2026年5月・7月の配信では、キャミィ戦はお互いにきつい組み合わせだとしている。キャノンストライクは置いた通常技に引っかかることが多いので、中足や中Kを振りすぎず、置きを多めにする。キャノンストライクは空投げに負けるので、飛んだら空投げする意識を持つ。2026年7月の配信では、キャノンストライクを盾にした通常飛びを繰り返される展開が、いちばんきついとしている。 {{gTpEBizr3ks@5136}} {{fZgVDyrd5gM@832}} {{Xec6eJ-w62w@5380}}", "2026年5月の配信では、ケン戦でトリグラフを撃つのは自殺行為で、迅雷脚への対応はおろそかになりがちな対策の1位だとしている。下段にはジャストパリィも狙うが、それ一本だと投げられる。バーンアウト中の迅雷脚には、2026年3月の動画でボタンを押しておく対処を示している。 {{iH2etZNc6zg@10558}} {{iH2etZNc6zg@10970}} {{zkfXQVg4DTg@0}}", "ジュリの歳破衝にはジャストパリィで大きいリターンが入り、唯一の裏目は五黄殺の出し切りだ。テリーの中足ターゲットコンボのファイヤーキックからの択は、JPならしゃがみ小Pで勝て、裏目になるのはラッシュだけだ。舞のSA1後の起き攻めで溜めてくる攻めは、光らずに来たら小Pが最初から勝つ。いずれも2026年4月・5月の動画の内容だ。 {{F_AiTqOacmU@0}} {{F_AiTqOacmU@21}} {{-ec3gJzxTfY@0}} {{zSauC-9QniY@12}}"]}], "routes": [], "reviewed": true}, {"id": "combo", "name": "コンボ", "lead": "JPのコンボは、確定反撃の技選び、カウンターの確認、ドライブゲージの配分で火力が決まる。", "sections": [{"title": "確定反撃は技を使い分け、大足には中Kを使う", "body": ["JPの確定反撃は、相手のマイナスフレームと距離に応じて中足、中K、大P、大Kを使い分ける。発生の遅い技は確定に使えず、確定に大足を使う発想はJPを使っていると身につきにくい。{{E7w7piOJGE4@8284}}", "大足への確定は、中Kがいちばん頭を使わずに済む。2026年4月の配信では、マイナス10の大足には先端気味の距離でも中Kが届くとし、基本はODストリボーグまで入れ込む。中Kがガードされても、ODストリボーグなら有利が取れて攻めを続けられる。2026年6月の動画でも、JPは大足への確定が難しくなりがちで、中Kが頭を使わない手段として挙がっている。{{B5JTWjBgseo@9763}} {{uRveIeiCzyo@68}}", "大足への確定はキャラ差が大きい。2026年5月の配信では、ジェイミーの大足には前大Kで確定が入り、ベガの大足にもたいてい入るが、たまに入らない。中足で済ませがちなので、大足の確定をキャラごとに把握しておく。{{uJDuKXzhNOs@6443}}", "確定反撃の始動は、大体インパクトにする。リーサルがあるときはラッシュから入り、相手がバーンアウトしていなければインパクトから入ってゲージを削る。ラシードのイーグル・スパイクにはインパクトが入るが、届かないことがあり、しゃがみ中攻撃から大ストリボーグのほうが安定する。2025年10月の配信は、前年12月ごろの調整でインパクトで取れていた確定が中Kだけになり、約半月そのままだったと振り返っている。{{8fWBeWhQDKs@5031}} {{bovUPYpqM9k@4772}} {{jn00EZFiNZw@1347}}"]}, {"title": "どの距離でも確定を取られるキャラを知っておく", "body": ["3大Pはど先端で当てれば、ほぼ全てのキャラに確定反撃がなく、押し置きができる。近距離でガードされるとゲームが終わることがある。{{fpvEhseVtV0@24}}", "2026年4月の動画では、距離を問わず確定が取れるキャラはブランカ、ベガ、キンバリーとされ、ラシードもほぼ全距離で確定を取られるので命がけになる。{{fpvEhseVtV0@115}} {{fpvEhseVtV0@160}}", "この一覧は後の配信で変わっている。2026年3月29日の配信で神木Cは、先日の3大Pの解説（ベガ、ブランカ、キンバリーだけ）を誤りと訂正した。エレナもどの距離でもODの技で確定を取れ、食らうとゲームが終わるほどのダメージになる。2026年11月21日の配信でも、シャーロスチの先端への確定について、一部の技を除けば全距離で確定があるのはブランカ、ベガ、エレナだろうという見立てが出ている。この配信の一覧にキンバリーは入っていない。{{YDHEoSGwFlg@4897}} {{yTBD_tabZpk@4874}}"]}, {"title": "ジェイミーの飲み、ガイルのブレイド、SAの隙に確定を取る", "body": ["ジェイミーのぼったくり飲みは3つある。後ろ投げ後の飲み、OD酔疾歩からの2杯目、リバーサルの飲みで、ジェイミー側の不利は順にマイナス24、マイナス24、マイナス27だ。確定反撃を持つキャラが多く、JPのようにサーチ技のあるキャラがいちばん簡単に取れる。{{GKq1l0eQpko@0}} {{GKq1l0eQpko@10}} {{i3rONIDr_9M@52}}", "受け身を取ると反撃が届かないので、ジェイミー戦は受け身を取らずに起き上がってから反撃する。ラッシュが強いキャラはラッシュ中足でも咎められる。2026年4月5日の配信でも、後ろ投げ飲みとリバ飲みの確定をサーチ技で取るのがいちばん簡単だとしている。{{GKq1l0eQpko@34}} {{i3rONIDr_9M@76}} {{V5_ZtjBws9w@5296}}", "ガイルの目の前ブレイドは、ほぼ全キャラが小足で見てから間に合い、ブレイドに当たらずパニッシュカウンターが取れる。JPとキンバリーは小足の判定がほとんど前に出ないので大足で取る。トレモの検証では、大足は判定が前に出るキャラが多く中央では少し後ろに下がってから出す必要があり、どの距離でも楽に出せるのはJPとキンバリーだけという見立てだ。{{i3rONIDr_9M@28}} {{YDHEoSGwFlg@5780}}", "マノンのSA2の跳ねる部分には、ラッシュで割り込んだりインパクトを出したりできる。最後までガードしきってもゲージが削られるだけなので、大きな端コンボを入れる。連続ガードが切れるSAはジュリのSA1、マノンのSA2、春麗のSA2だけという見立てだ。ジュリとマノンのSAは切れ目にインパクトで割り込める隙間があり、警戒せず切れ目で確定を取る。{{9A6i80KhYjw@12}} {{odGhkR7MFco@96}} {{nVJ1B9hi_lA@9756}}"]}, {"title": "カウンターとパニッシュカウンターの仕組み", "body": ["カウンターは技の出がかりを潰したときの判定で、有利が一律プラス2フレーム増える。JPの中足は通常ヒットだとプラス3、カウンターだとプラス5になり、通常では入らないコンボが入る。カウンター限定コンボの理屈はこのフレーム差だ。{{zXlU2ibtKd8@12}} {{OB71irQeRhQ@22}} {{84fijnCF6Io@3471}}", "ラッシュ打撃のプラス4とカウンターの増加分は重なるので、ラッシュカウンターのコンボもある。ラッシュを止めたときは必ずカウンターになる。攻撃判定の出ない必殺技にもパニッシュカウンターになるものがあり、例としてジェイミーの飲みが挙がる。{{OB71irQeRhQ@34}} {{OB71irQeRhQ@46}}", "パニッシュカウンターは技の後隙に当てたときの判定だ。2026年6月の動画では、有利フレームがプラス4される。2026年5月の配信ではプラス7という数字も出ており、動画とは食い違う。JPではパニッシュカウンターから色々な技がつながる。{{OB71irQeRhQ@79}} {{84fijnCF6Io@3471}}", "ベガの大Kは膝崩れ、マリーザの大Kは吹っ飛びなど、パニッシュカウンターのときだけ専用のやられになる技がある。専用のやられは大きな反撃が入る技と覚えておく。昇龍拳やSAの後隙を刺す場面が分かりやすく、パニッシュカウンター限定の大きなコンボを入れられる。{{OB71irQeRhQ@91}} {{84fijnCF6Io@3471}}"]}, {"title": "カウンターの確認は表示を見て、トレモのランダムで練習する", "body": ["確認の方法は人によって違い、画面の表示、音、火花の3つがある。パニッシュカウンターの音はかなり派手だ。神木Cは主に、パニッシュカウンターという文字の表示を見て確認する。通常のカウンターはエフェクトが地味で見分けにくい。{{OB71irQeRhQ@124}} {{195SUDYWv04@4127}}", "練習はトレモで、ヒット状況をランダムにする。ガードされたら適当にもう1回押し、食らっていたら適当に動き、パニッシュカウンターならコンボに行く。実戦は出がかりを潰す当たり方になり、自分が技を振ったタイミングで相手が何かしていたかという状況確認が半分ほど含まれるので、トレモのほうが難しい。ここで確認できれば実戦でミスしない。{{OB71irQeRhQ@146}} {{OB71irQeRhQ@102}} {{195SUDYWv04@4127}}", "中Kはカウンターでもキャンセルできないので、次に何かボタンを押すつもりで動く。カウンターなら弱攻撃、ガードなら中足をもう1発か差し返しの中Kに回す。{{195SUDYWv04@2983}}", "超シビアなヒット確認は、体力バーを見るのが昔からの鉄板だ。確認に失敗してもガードされたあとに小Pが連続ガードになるので、リスクは大きくなく、気軽に挑戦できる。大Kのヒット確認はほぼしない。ガードされてもラッシュを出せば有利だからだ。{{JdR_4go3Ihc@6352}} {{qaQSZ0zbKuM@2489}}"]}, {"title": "入れ込みがパニッシュカウンターになったときの扱い", "body": ["大Pからトルバランを入れ込む場面では、大Pを押したときに相手が動いているのが見えたら一瞬落ち着く。パニッシュカウンターやカウンターの可能性が高く、入れ込むにしてもラッシュなどにする手がある。パニッシュカウンターを確認してトルバランをキャンセルし、6大Kや大Kでリターンを取ることもできるが、実戦でできている人はごく少なく、神木C自身もあまりできていない。{{P7lgTe_au9s@4779}} {{84fijnCF6Io@5026}}", "入れ込んでパニッシュカウンターになってしまったら、当たっていればそのまま出す。当たりそうな場面では、そもそも入れ込まない。確認の弾からラッシュを仕込む癖は、直し方が意識するほかない。ガードされる前提の技なら入れ込みで構わず、そこそこ当たる場面では手を止めて確認する。{{pe3OwQE-X9E@2124}} {{QAR6ElExOhY@1709}}", "パニッシュカウンター後のルートは複数ある。大Pのパニッシュカウンターから位置を入れ替えるいちばん簡単な型は、大Pから設置につなぐ形で、大P直設置でも大Pからトリグラフ設置でもよい。ラッシュ中段のパニッシュカウンターからは前大Kがつながるが、先端で当てると届かない。大Pのパニッシュカウンターでは、前大Kを飛び道具のフェイントとして出せるようになった。{{pe3OwQE-X9E@2785}} {{2RL5sSXwv3A@4287}} {{fTLTYUgGTuo@2930}}", "カウンターとパニッシュカウンターでは最適な始動が違い、使い分けるのが理想だが難しい。2026年5月の配信では、コパ、中K、SAのルートが良かった場面でとっさに選べなかったと振り返り、全部中Kに替えて中KにするならSAまで行くほうがいい場面が多いとしている。2026年9月の配信でも、ここで火力が安くなって負けた試合があるとして練習課題にしている。{{84fijnCF6Io@2251}} {{rK3x2ER651c@5261}}"]}, {"title": "コンボの基本型と始動技の選び方", "body": ["いちばん簡単なコンボは、始動が大Pでもしゃがみ中攻撃でも中Kでもよく、そこからラッシュで大ストリボーグ、トルバラン、トリグラフ設置とつなぎ、あとは弾を撃つ型だ。SAがありリーサルが見えるならSAを入れる。{{_LIvr7jcqx0@1924}}", "前大Kは火力のメインパートだ。約1年前に強化されて以降、火力の中心になっていて、大Pは始動補正が乗るが前大Kは乗らないので、始動に使うと火力が出る。中央のキャンセルラッシュ前大Kから大ストリボーグが入るのは横幅の大きいキャラで、エドモンド本田、ブランカ、ザンギエフだろうという見立てがあり、マリーザには入らなかった。火力はわずかに上がるだけで誤差の範囲だ。{{WsUQFx1OQiA@667}} {{AOaVhAk3gSw@3317}}", "2025年10月の配信では、いちばん高いのはほかの人のルートだが、入力が簡単で画面端ならいつでもできるルートでも足りると確かめている。設置を弱と強で打ち分けず両方中設置にそろえると、考えることが1つ減り、普段のコンボより300前後高いという見積もりだ。{{38L7HJO3Awc@3868}} {{38L7HJO3Awc@5472}}", "火力が低いと読み合いの回数が増え、火力差で負ける。本来しゃがみ中Pが当たる場面で小Pで済ませるのが典型だ。レートが上がらない人に多いのは、確定を取れていない、取れても低い火力で終わっているパターンで、ガードした場面で中足だけで終わっていないかを見直す。{{UbimFsDclH0@6330}} {{tpQg36xBmD0@4576}}"]}, {"title": "ドライブゲージはラッシュよりOD技に使う", "body": ["コンボにドライブラッシュを使うと、コンボが終わるまでドライブゲージが回復しない。OD技を使うルートなら早くから回復が始まり、ダメージも大差ないので、コスパはOD技のほうがよい。ラッシュは3本使い、ODストリボーグは2本で済む。{{WoW4QU4Dvnk@6270}} {{SCZlskkcv3s@4159}} {{Mt7OURKQo9Q@1474}}", "締めはODストリボーグにする。ODストリボーグならODトリグラフ、ODトリグラフ、トリグラフまで続けて入るが、ODトルバランだとその後のODトリグラフが入らないか、入っても終わりになる。起爆ヒット後も、ODトリグラフからはトリグラフを1回しかつなげないが、ODストリボーグからはトリグラフのあとにODトリグラフをもう1回挟めるので火力が下がらない。{{V5_ZtjBws9w@4019}} {{fZgVDyrd5gM@6116}} {{7Vo4NfgxoFk@2317}}", "神木Cは大Pからのラッシュにゲージを使うことが多いので、コンボ自体はODストリボーグで済ませる。中央インパクトからのコンボでラッシュを入れるとゲージ効率が悪く、中央ならあえてやる必要はないという見立てだ。大型キャラ相手に全部ストリボーグにするやり方は、やること自体が極めて簡単で、やらない理由はない。{{nVJ1B9hi_lA@444}} {{M-hVEg_phXA@7865}} {{x3yXrFHODpY@1841}}", "入力の難度には差がある。遅らせて入れる大ストリボーグは相当慣れないとミスしやすく、大会のレベルでも大Pからトリグラフにつなぐ形などで妥協していることが多いだろうという見立てだ。ODストリボーグから先は、ギリギリの距離だと届くかの判断が相当難しく、トレモでもできるか怪しい。ラッシュ後のストリボーグ2回は、拾いやすさが中ストリボーグのほうが若干上で、好み程度の差だ。{{fTLTYUgGTuo@2009}} {{ZJXcLmyFz-A@2252}} {{0VlxiRZ90F0@6110}}"]}, {"title": "運び、設置後、トリグラフ後のコンボ", "body": ["画面中央から端へ運ぶときは、通常技と設置を挟んで前へ運ぶ。画面端が少し近いときは中設置でなく弱設置にして、大P、中トルバランとつなぐ。相手のインパクトを返した後は、ゲージを使ってよいなら設置を絡めた運び、使いたくないなら大Pから大ストリボーグのルートがよい。運びコンボはステージにしっかり慣れていないと選べない。{{KC4ifg4QEtA@8098}} {{rePYufsCK60@3441}} {{qaQSZ0zbKuM@6775}}", "設置の自動起爆後は、中トルバランが場合によって外れるので、確実に当たる弱トルバランを選ぶことが多い。修正後も外れることはあるが、引きつけて当てれば当たる。中トルバランまで含む連続技は、全て中でなく弱、弱、中の順にすると、反対側に行ってしまう問題を避けられる。{{Zn4heiO2Pjs@10559}} {{Zn4heiO2Pjs@2912}}", "トリグラフの後に続く技はキャンセルではないので、素早く連続で入れると早すぎる。トリグラフが出終わった後に入力するくらいでよく、猶予は多い。トリグラフが当たる条件は次のとおりだ。しゃがみ中攻撃からなら必ず当たるが、別の通常技だと下まで判定がなく当たらないことがあり、中Kも同じだ。ダルシム戦では、パンチで軸がずれてトリグラフがスカることがいつもある。{{SCZlskkcv3s@12196}} {{3XDxwlJyKOk@5477}} {{bovUPYpqM9k@7339}}", "設置がある状態でしゃがみ大Pの対空が当たっても、フォースダウンにならない限りコンボはつながらず、設置があっても変わらない。前大Kの拾いは、少し遅らせる必要があり、浮きの高さによって変えなければならないので、JP使いの伸びしろの代表だ。{{SCZlskkcv3s@4159}} {{4vJjrBXQ7NY@1096}}"]}, {"title": "リーサルとバーンアウトでは簡単で確実なルートを選ぶ", "body": ["リーサルを狙うコンボで大Pを使う難しいルートは安定しないことがあるので、足りそうなら簡単なほうを選ぶ。1つ前の時点でリーサルかどうか確証がなかった場面では、連携が決まらなくても確実にリーサルになる削りを選んでいる。{{LtVWTrXxfCI@931}} {{4vJjrBXQ7NY@2565}}", "2026年7月の配信では、さっさとSA3まで行っていればリーサルだったのに、SA2へ行って無駄な悩みが発生したと振り返っている。別の試合では、甘いアブニマーチを出したのは勝ち急ぎで、普通にコンボして設置するのがよかった。2026年5月の配信でJPのリーサル問題を試した結果は、補正が切れていてSAゲージが絶妙に届かず、ギリギリ無理だった。{{DHwYs05qqek@7709}} {{an09SU2JA3A@9383}} {{iH2etZNc6zg@7923}}", "補正切り行動は、パリィを釣られた場合に投げられる形になっていない限り、バーンアウト中の相手以外にはあまり使えない。補正切りが多い人だと覚えられて通らなくなり、飛ばれて潰されるパターンも多い。2026年8月の配信ではバーンアウト中の相手に使うなら1種類で足りるとしており、2026年7月の配信では最近は減らすよう周りに言われているとしている。{{mWlneLs90qQ@3060}} {{suzckUKhzyk@1796}}", "当たった状況ごとに、運びコンボで画面端を固めるか、相手のゲージが2本ならバーンアウトを狙うか、SAを使うかを選べるようにする。同じ状況から複数のルートを試し、ゲージ回収が約0.95本あってバーンアウトもしないで済むルートのほうが高ダメージだと確かめた例がある。2026年4月のカスタム後は、SAに行く形が少ないことを課題にしている。{{WsUQFx1OQiA@1287}} {{fQP25E3Ed9s@2164}} {{GBiKAIdv4FQ@7202}}"]}, {"title": "アムネジア、対空、昇龍ガード後のコンボ", "body": ["アムネジアは、取った後に特定のコンボへ行けることが唯一無二の強みだ。取った後に確定が入る技なら位置を入れ替えたり、リーサルならSAにつなげたりできる。アムネジアを取った後にどの技が確定するか、有利か不利かをそこそこ把握しておく。{{8-mSJY7tMNQ@9928}} {{vn8DB9xIkEU@4560}}", "アムネジアをガードさせた後が強い理由は、誰も確定を知らないことだ。レジェンド帯でも確定を取ってくる相手は5人に1人ぐらいだ。アムネジアから中K、SAとつなぐ連携は、あまりダメージが減らず、ゲージを削りたいとき用になる。ジラントからのアムネジアは、成功するほうがおかしく、決まれば儲けものと思う。本当の正解はジラントから直接SAをキャンセルすることだ。{{gTpEBizr3ks@4251}} {{4vJjrBXQ7NY@5855}} {{wsmE7M2oF7M@4844}}", "豪鬼戦では、空対空や対空で落とすとフルコンボに行ける。ジャンプ中Pの先端あたりで落とし、そこからラッシュと大Kでコンボする形はできるようにしておく。遠めの空対空はほぼジャンプ中P、近めはジャンプ中Kと使い分ける。間に合うならジャンプ中Kからそのままコンボに行けるが、神木Cは苦手であまりできていない。{{H-WQjXXkNyk@2292}} {{84fijnCF6Io@6785}}", "対空の大Pからのキャンセルは、通常の設置がいちばんありえず、相手がちゃんとしていれば確定を取られる。神木Cはいつもトルバランで、フェイントか出し切りにする。ケンの昇龍をガードした後のリーサルは、いつもやりがちなインパクトより、前ステで入れ替えてから大Kを入れるルートのほうが正しい。ヴィーハトが当たった後は、間に合えば大ストリボーグ、間に合わなければ大Pだ。{{H1eezSRzVzw@9830}} {{BrB4x5IvVws@6631}} {{RwhcgxJUps4@4545}}"]}, {"title": "コンボの精度を上げる", "body": ["JPで伸び代になるのはコンボだ。マスター到達後は、セットプレイと仕上がっていないコンボを固め、火力をなるべく上げる。JPはアドリブのコンボがとても大事なキャラなので、アドリブの筋肉をつける。アルマスでも1800や2000のあたりはコンボ精度の差が大きく、調子が悪いときは普段しない操作ミスが増える。{{tdyU_8woXj8@348}} {{M-hVEg_phXA@4619}} {{8fWBeWhQDKs@9896}}", "コンボの入力は1回だけ押すほうがよく、慣れていないほど怖くて連打してしまう。離し入力はオンにしないとJPで時々コンボが出ないので、オンで使っている。コンボが落ちる原因として、キャンセルの遅れがある。アムネジア後の裏投げのような微妙な遅らせを無意識にやっていることがあり、キャンセルは最速で入れる。{{j0S1QsQLd44@3488}} {{j0S1QsQLd44@7824}} {{VhPZeZgyPLA@6711}}", "ODトリグラフを入れたいときに普通のコンボをそのままやると入らないことがあり、入るかどうかを見なければならない。コンボの成功率が低いときは、しゃがみの時点でボタンを押すのが早く、焦っている。2026年4月のテリー戦は、大きなコンボミスのあとバーンアウトを取られて負けた、いちばんやってはいけないタイプのコンボミスだった。{{-zCTOtdfbTE@766}} {{tNI_1RdQb9E@202}} {{Q-NTE6rpF9o@7213}}", "JPの難しさは、手元の忙しさでなく、コンボレシピが多く覚えることが多い点にある。ダイヤ帯のJPは、コンボは参考にしてよいが、神木Cの技振りは特殊なので参考にしないほうがよく、コンボの種類を増やすのがいちばんだ。{{cDKjxzxuH6k@3165}} {{pe3OwQE-X9E@6441}}"]}], "routes": [{"title": "基本コンボ", "routes": [{"name": "いちばん簡単な基本形", "when": "始動の通常技（大P・しゃがみ中攻撃・中Kなど）がヒット", "route": ["大P", "ラッシュ", "大ストリボーグ", "トルバラン", "トリグラフ設置"], "options": [], "note": "始動は大Pでもしゃがみ中攻撃でも中Kでもよい。このあとは弾を撃つ。SAがありリーサルが見えるならSAを入れる。", "cites": ["{{_LIvr7jcqx0@1924}}"]}, {"name": "小Pから直接ODストリボーグ", "when": "小Pがヒット", "route": ["小P", "ODストリボーグ"], "options": [], "note": "いちばん簡単なルートとして挙がっている。", "cites": ["{{YDHEoSGwFlg@2726}}"]}, {"name": "最大火力の締め（ODストリボーグ）", "when": "最大の火力を狙うとき", "route": ["ODストリボーグ", "ODトリグラフ", "ODトリグラフ", "トリグラフ"], "options": [], "note": "ODトルバランで締めると、そのあとのODトリグラフが入らないか、入っても終わりになる。", "cites": ["{{V5_ZtjBws9w@4019}}"]}, {"name": "空対空で落としてフルコン", "when": "豪鬼戦などで、ジャンプ中Pの先端あたりで空対空が当たった", "route": ["ジャンプ中P", "ラッシュ", "大K"], "options": [], "note": "ダルシムのフロートを落としたときも同じコンボになる。遠めの空対空はほぼジャンプ中P、近めはジャンプ中K。", "cites": ["{{H-WQjXXkNyk@2292}}"]}]}, {"title": "確定反撃", "routes": [{"name": "大足への確定は中Kから", "when": "マイナス10ほどの大足をガード。先端気味の距離でも届く", "route": ["中K", "ODストリボーグ"], "options": [], "note": "ほかのつなぎ方もできるが、確認が面倒でゲージ効率もよいので基本はODストリボーグまで入れ込む。中Kがガードされても、ODストリボーグなら有利が取れて攻めを続けられる。", "cites": ["{{B5JTWjBgseo@9763}}"]}, {"name": "ケンの昇龍ガード後は前ステで入れ替え", "when": "ケンの昇龍（上に吹っ飛ぶタイプ）をガードした後のリーサル", "route": ["前ステ", "大K"], "options": [], "note": "いつもやりがちなインパクトより、前ステの入れ替えのほうが正しい。視聴者に教わったルート。", "cites": ["{{BrB4x5IvVws@6631}}"]}, {"name": "ラシードのイーグル・スパイク後", "when": "対ラシード。インパクトが届かない距離", "route": ["しゃがみ中攻撃", "大ストリボーグ"], "options": [], "note": "イーグル・スパイクにはドライブインパクトが入るが、届かないことがあるので、しゃがみ中攻撃から大ストリボーグのほうが安定する。", "cites": ["{{bovUPYpqM9k@4772}}"]}]}, {"title": "カウンター・パニッシュカウンター", "routes": [{"name": "パニカンから小P・中K・SA", "when": "パニッシュカウンターを取った場面", "route": ["小P", "中K", "SA"], "options": [], "note": "しゃがみ中からODに行くより、全部中Kに替え、中KにするならそのあとSAまで行くほうがいい場面が多い。", "cites": ["{{84fijnCF6Io@2251}}"]}, {"name": "大Pパニカンでトルバランをキャンセル", "when": "大Pからトルバランを入れ込んだらパニッシュカウンターだった", "route": ["大P", "トルバランをキャンセル", "前大K"], "options": [], "note": "パニカンを確認してからキャンセルする。実戦でできている人はごく少なく難しい。", "cites": ["{{84fijnCF6Io@5026}}", "{{P7lgTe_au9s@4779}}"]}, {"name": "ラッシュ中段のパニカンから前大K", "when": "ラッシュ中段がパニッシュカウンター", "route": ["ラッシュ中段", "前大K"], "options": [], "note": "先端で当てると前大Kが届かないので、微妙な場面もある。", "cites": ["{{2RL5sSXwv3A@4287}}"]}, {"name": "中Kがカウンターしたとき", "when": "中Kがカウンターヒット", "route": ["中K", "弱攻撃"], "options": [], "note": "中Kはカウンターでもキャンセルできないので、次に何かボタンを押すつもりで動く。ガードなら中足をもう1発か差し返しの中K。", "cites": ["{{195SUDYWv04@2983}}"]}]}, {"title": "運び・画面端", "routes": [{"name": "中央から端へ運ぶ（設置を挟む）", "when": "画面中央付近から画面端へ運びたい。画面端が少し近いとき", "route": ["弱設置", "大P", "中トルバラン"], "options": [], "note": "通常技と設置を挟んで前へ運ぶ形。画面端が少し近いときは、中設置でなく弱設置にする。", "cites": ["{{KC4ifg4QEtA@8098}}"]}, {"name": "インパクト返し後の運び（ゲージを使わない）", "when": "相手のインパクトを返した後、画面端まで届かない位置。ゲージを使いたくない", "route": ["大P", "大ストリボーグ"], "options": [], "note": "インパクト返しの直後は大Pが入らない場面がある。ゲージを使ってよいなら設置を絡めた運びのルートもある。", "cites": ["{{rePYufsCK60@3441}}"]}, {"name": "画面端の前大Kから中ストリボーグ", "when": "画面端", "route": ["前大K", "中ストリボーグ"], "options": [], "note": "前大Kの高さを誤ると中ストリボーグが変にディレイする。拾うには少し遅らせる必要があり、浮きの高さで変える。", "cites": ["{{4vJjrBXQ7NY@1096}}"]}, {"name": "中央で前大Kから大ストリボーグ", "when": "中央。横幅の大きいキャラ（エドモンド本田・ブランカ・ザンギエフ）", "route": ["キャンセルラッシュ", "前大K", "大ストリボーグ"], "options": [], "note": "マリーザには入らなかった。火力は誤差の範囲なので無理に狙わなくてよい。", "cites": ["{{AOaVhAk3gSw@3317}}"]}, {"name": "ダッシュ引き中攻撃からラヴーシュカ", "when": "引き中攻撃の単発が当たった", "route": ["ダッシュ引き中攻撃", "ラヴーシュカ"], "options": [], "note": "強いが、コマンドが難しくミスの代償が大きいので本人はあまりやらない。", "cites": ["{{wsmE7M2oF7M@1484}}"]}]}, {"title": "設置後・トリグラフ後", "routes": [{"name": "大Pパニカンから設置で位置を入れ替える", "when": "大Pがパニッシュカウンター。画面の位置を入れ替えたい", "route": ["大P", "設置"], "options": [], "note": "いちばん簡単な型。大P直設置でよい。", "cites": ["{{pe3OwQE-X9E@2785}}"]}, {"name": "大Pパニカンからトリグラフ設置で位置を入れ替える", "when": "大Pがパニッシュカウンター。画面の位置を入れ替えたい", "route": ["大P", "トリグラフ設置"], "options": [], "note": "大P直設置と並ぶ、簡単な型。", "cites": ["{{pe3OwQE-X9E@2785}}"]}, {"name": "起爆ヒット後の締め（最大ダメージ）", "when": "設置・起爆がヒットした後。最大ダメージを取る", "route": ["ODストリボーグ", "トリグラフ", "ODトリグラフ"], "options": [], "note": "ODトリグラフで締めるとトリグラフを1回つなげるだけだが、ODストリボーグならトリグラフのあとにODトリグラフをもう1回挟めるので火力が下がらない。", "cites": ["{{fZgVDyrd5gM@6116}}"]}, {"name": "起爆ヒット後のフレーム重視の締め", "when": "設置の起爆が当たった後。フレーム状況を重視", "route": ["ODストリボーグ", "トリグラフ設置"], "options": [], "note": "ODトリグラフ後の設置は火力が高い。最大を取るならODストリボーグのほうが高い。", "cites": ["{{7Vo4NfgxoFk@2317}}"]}, {"name": "対空大Pからトルバラン", "when": "対空の大Pが当たった", "route": ["対空大P", "トルバラン"], "options": [], "note": "フェイントか出し切りにする。何もしてこない相手なら出し切り。通常の設置は確定を取られうる。OD設置は少し不利だが確定は取られない。", "cites": ["{{H1eezSRzVzw@9830}}"]}]}, {"title": "リーサル・SAへ", "routes": [{"name": "アムネジアから中K・SA", "when": "ゲージを削りたいとき", "route": ["アムネジア", "中K", "SA"], "options": [], "note": "ダメージはあまり減らない。ゲージ削り用の連携。", "cites": ["{{4vJjrBXQ7NY@5855}}"]}, {"name": "ジラントから直接SAをキャンセル", "when": "ジラントからアムネジアが間に合わないとき", "route": ["ジラント", "SA"], "options": [], "note": "ジラントからのアムネジアは、決まれば儲けもの。本当の正解はジラントから直接SAをキャンセルすること。", "cites": ["{{wsmE7M2oF7M@4844}}"]}, {"name": "ODトルバランからSA2", "when": "ODトルバランからSA2につなぐ場面", "route": ["ODトルバラン", "SA2"], "options": [], "note": "最速でリバーサルを入れられると、ブランカとラシードは抜けられる。", "cites": ["{{-sVAWAfLmJ4@3606}}"]}]}], "reviewed": true}, {"id": "setplay", "name": "セットプレイ", "lead": "JPのセットプレイは、ダウンを取って設置し、画面端に追い込んで一度の読み合いに勝つ形が土台になる。そのうえで大Pラッシュ、起爆、ワープ、パリィへの対策を、相手と時期に合わせて使い分ける。", "sections": [{"title": "設置の基本：ダウンを取ったら置き、歩いてラインを上げる", "body": ["JPの基本の勝ち筋は、ダウンを取って設置し、投げなどで画面端に追い込んでセットプレイにつなぐことだ。2026年8月18日の配信で、神木Cはどこまで行ってもこれだとしている。2026年10月24日の配信では、勝ち方は画面端のシューティングで倒す形とセットプレイで一気に勝つ形の2つで、どちらも大Pから大ストリボのコンボが前提になる。 {{OuGmSoPe7e8@9665}} {{4kt8x5v_xcg@4655}}", "JPに移行中の人には、まず弾を撃ち、ダウンを取ったらなるべく設置することを勧めている（2026年4月14日の配信）。設置したから何かをしなければならないという形はなく、何でもできる時間が来たという意識でよい。近ければ設置から徐々に前へ歩けばよく、無理に攻撃せず、歩いて自分のゲージを回収してもよい。 {{GBiKAIdv4FQ@2538}} {{GBiKAIdv4FQ@4526}}", "設置後に相手が下がってやることがなくなる展開では、歩いてラインを上げ、ゲージを回復してさらにヴィーハトを置く。地上のラインの上げ方を聞かれた2026年9月12日の配信でも、答えは設置して歩く、のみだった。設置すると相手が何もできなくなるためだ。ラインが上がった時点でリターンなので立ち回りに戻ってよく、もう一度ダウンを取って設置し直せれば最もおいしい（2026年3月24日の配信）。 {{evBaj9xQWio@4275}} {{M-hVEg_phXA@7163}} {{DiIybykNHnA@6250}}", "ゲージがない場面でも、設置して前に出ながら回収し、後ろに下がらない（2026年10月7日の配信）。相手を画面端に追い込んだ後も、戦略的な理由がなければ下がらないほうがよい（2026年4月11日の配信）。2026年9月30日のリプレイ振り返りでは、シューティング展開よりも画面端に詰める展開のほうが勝ちが多い、という見立てが出ている。 {{Itmg-znx9Lg@1759}} {{MPaucCetMzA@7640}} {{Jsg1B-3ogLY@3734}}"]}, {"title": "設置のタイミングと種類：安全第一、OD設置はゲージを見て選ぶ", "body": ["設置は、確定を取られにくいタイミングで置く。自分のゲージに余裕があれば置く、という程度でよく、設置自体は直接ダメージにならないので、適当に置き続けると近づかれてゲージを払う側になる（2026年8月6日の配信）。基本は、技を無理やり引っかけて当てた後のコンボの締めだ。OD トリグラフをガードさせた後や、暴れの通常技を当てた後にも置く（2026年4月11日の配信）。 {{zAhVM3GijPc@4963}} {{MPaucCetMzA@7314}}", "強設置と中設置の優劣は諸説ある。ベガのように距離を詰めるのが得意な相手には中設置が良さそうな場面が多く、強設置には起爆したときに良い当たり方をする利点がある（2026年7月8日の配信）。設置を弱と強で打ち分けず両方中設置にそろえると、考えることが1つ減ってコマンドも簡単になり、普段のコンボより300前後高いと見積もっている（2025年10月4日の配信）。画面端が少し近いときは、中設置でなく弱設置にして大P、中トルバランとつなぐ（2026年6月23日の配信）。 {{QTL5e1tPUHA@6938}} {{38L7HJO3Awc@5472}} {{KC4ifg4QEtA@8098}}", "OD設置はゲージを2本消費するので、その後の自分のゲージをよく見る必要がある。押し込んでいる場面や、相手が画面端から出ようとして飛んだのを落とした後はOD設置のほうが状況がよい。ただし相手がうっかりパリィを張るタイプなら、通常のトルバランのほうがよいことがほとんどだ（2026年6月25日の配信）。OD設置は不利なので、出せるからといって押してはならず、対空した場面で入れることを意識したい（2026年1月6日の配信）。 {{fTLTYUgGTuo@2971}} {{fTLTYUgGTuo@3706}} {{CqtlWQkwSbQ@6067}}", "大Pから直接OD設置する形は、出どころによって評価が違う。2026年6月27日の動画は、これを小Pでフレームを消費して連続ガードにつなぐJPの連携として扱っている。一方、配信では、見立てが2つ出ている。中央の大PからのOD設置は全くせずほぼラッシュに行く（2026年4月11日）。そもそも強い行動だと思っておらず、見られていれば確定反撃で全てを失う（2026年8月17日）。 {{KMrV_6C9Huw@233}} {{MPaucCetMzA@10493}} {{mWlneLs90qQ@5617}}"]}, {"title": "投げ後の設置：前投げは避け、裏投げは相手を選ぶ", "body": ["前投げからの設置は甘い行動で、確定がある。2026年3月21日の配信では、OD設置ならまだしも通常設置は特に甘く、前投げ設置を止めてくる相手も多いとしている。相手にSAが1本でもあるなら前投げからの設置は避け、神木Cはほとんど後ろ投げしか使っていない（2026年4月5日の配信）。 {{gzr5Bd0EwC0@2081}} {{50Y_VSxPLd4@11495}}", "裏投げの後も、必ず設置が正解とは限らない。設置は不利を背負い、キャラによっては確定反撃があるので、やってはいけない相手もいる。神木Cがよく選ぶのは裏投げからの設置、ラッシュ中段、ラッシュ中足で、後ろ入れなら無敵技もガードできる。決めの場面では、裏投げ後のSAや、歩いて仕切り直す選択もある（2026年5月24日の配信）。 {{7Vo4NfgxoFk@2417}}", "イングリッドはストックが2つ以上あるとビームが確定するので、裏投げからの通常設置はやってはいけない。JPの裏投げ設置は確定する場面が多いが、取れる人は少ないので、取れないと分かった相手には使い倒してよい。イングリッドは分かりやすい部類で、取ってくる人が多そうだという見立てだ（2026年6月20日の配信）。 {{QJy4s3alemg@624}}", "JPミラーでは、裏投げの後の通常設置にトリグラフかSAが確定する（2026年3月21日の配信）。大Pからストリボーグにつなぐコンボの後にトリグラフ設置を最速で出すと、相手のリバーサルのトリグラフにパニカンが取れる。トリグラフをガードしたら、ノーマルのトリグラフはガードした側が有利なので、基本は打ち返す（2026年4月19日の配信）。 {{gzr5Bd0EwC0@4577}} {{H1eezSRzVzw@9265}}"]}, {"title": "起爆：調整後の新しい形、読まれ始めた形、負ける場面", "body": ["2026年3月21日の配信では、調整後の新しい起爆について、大Kからだと連続ガード、中Pからと中足からの起爆は暴れ潰しになる、としている。調整は超強化ではなくナーフで、軽いナーフ程度で済んだのではという見立てだ。対策は起爆に合わせてジャストパリィのボタンを押すことだろう、ともしている。2026年3月17日の配信でも、設置をガードさせた後に暴れる相手に、中足起爆などでリスクを負わせられるようになったのは強いとしている。 {{gzr5Bd0EwC0@1326}} {{WoW4QU4Dvnk@802}}", "起爆は時期が進むと読まれ始める。2026年3月21日の配信では、中足の初段をガードさせた後にワンガードで暴れる相手へ中足起爆が刺さるが、1か月後に刺さるかは分からないとしていた。2026年4月8日の配信では、中P起爆は誰もが使いたくなるため、そのタイミングに飛びやインパクトを合わせる人が増え、以前ほど無条件には使えなくなったとしている。 {{gzr5Bd0EwC0@3414}} {{oENeZfFwNPg@3188}}", "設置の後は、何もしなくても1回起爆を見せておくと相手が動きにくくなるので、常に見せるようにしている。飛びが多い相手には起爆からコンボになるが、ラッシュで設置を突き抜けてくる相手もいる（2026年8月31日の配信）。設置後の大Kは、ヒットならしゃがみ中Pから起爆、ガードなら中段を出す。大Pまで入れ込むと、相手が上入れっぱなしのときに大Pが空振りしてマイナス10台の不利を背負うため、入れ込むのはSA2まで行きたいときだけだ。 {{eC9U3U3weZ0@2185}} {{Wr9dUkkfM-g@7316}} {{P7lgTe_au9s@6773}}", "起爆には負ける場面もある。ヴィーハトの後に起爆を入れるとワープで負けることがあり、ワープはトリグラフにも噛み合うので読み合いが面倒だ（2026年6月8日の配信）。キンバリーのSA2にはトリグラフが弾無敵の切れた直後に当たって無敵で負けるが、起爆に替えると当たる（2026年9月26日の配信）。起爆がヒットした後の締めは、最大ダメージならODストリボーグが大きい（2026年5月19日の配信）。 {{qBcQGeJYpLg@2429}} {{ZtF7sNSdFQ4@2401}} {{fZgVDyrd5gM@6116}}"]}, {"title": "大Pと中K：固めの入口になる技の使い方", "body": ["大Pは、隙の大きい技をガードさせた後に使い、ラッシュなどで攻めを迫る形が強い。リーチは思ったより短く、先端だとしゃがみに当たらないので、神木Cはほぼ置き技として使い、相手の前歩きに刺さるよう置く（2026年11月1日の配信）。中央で大攻撃をガードさせる流れは大Pからラッシュして大攻撃を出す形が多く、素で出す大攻撃は置き技として使うことがほとんどだ（2026年10月24日の配信）。 {{AUIvAc6QVVk@3837}} {{4kt8x5v_xcg@462}}", "3大Pが当たると状況がよく、ラッシュ小Pに行ける。ラッシュ小Pはプラスで、バックステップや投げを絡めた起き攻めにつなげられる（2026年4月8日の動画）。ダウンを取れれば、昇龍を持たないキャラや ED のように昇龍が遅いキャラにかなり強い。昇龍のあるキャラでも、ラッシュインパクトから読み合いができ、SA3以外のリバーサルは遮れる。 {{fpvEhseVtV0@36}} {{bhoqYKGAPsA@22}} {{fpvEhseVtV0@181}}", "大Pがパニッシュカウンターになったときは、位置を入れ替えるいちばん簡単な型として、大P直設置か大Pからトリグラフ設置がある（2026年3月30日の配信）。入れ込みがパニカンになった場合は、当たっていればそのまま出し、当たりそうな場面ではそもそも入れ込まない。大Pを押したときに相手が動いているのが見えたら、一瞬落ち着き、入れ込むにしてもラッシュなどにする手がある（2026年4月20日の配信）。 {{pe3OwQE-X9E@2785}} {{pe3OwQE-X9E@2124}} {{P7lgTe_au9s@4779}}", "中Kは陰に隠れがちだが強い。主な用途は、フレームマジックで下段に勝つ使い方と差し返しの2つで、ガードされても有利なので攻めを続けられる（2026年6月11日の動画）。設置後のつなぎは、連続ガードで好みの範囲ではあるが、当たったときの火力が高い中Kを選ぶ（2026年7月3日の配信）。しゃがみ中Kは信用してよく、リーチは全キャラで2番目か3番目に長い（2026年3月17日の配信）。 {{uRveIeiCzyo@45}} {{uRveIeiCzyo@103}} {{4vJjrBXQ7NY@5130}} {{WoW4QU4Dvnk@11972}}"]}, {"title": "大Pラッシュ後の読み合い：遅らせ投げが基本、小Pには大Kで返す", "body": ["大Pラッシュをした時点で、JP側が有利になっている。神木Cが最もよく使うのは、ラヴーシュカで崩しに行く場面と連携を組む場面で、後の形はラヴーシュカの固めとラッシュ中段が中心だ（2026年3月3日の動画）。 {{k7wcmJH9vuQ@0}} {{_mOPb3s_vtI@0}}", "大Pラッシュ後の基本は遅らせ投げだ。何もしないでガードすれば、昇龍やSAなどの無敵技をガードできる。遅らせ投げの弱点は相手の小Pに負けることだ。配信でも、ラッシュの後は相手が後ろ入れで昇龍を出せることから、遅らせたラッシュ投げをすることが最も多い（2026年6月25日）。 {{_mOPb3s_vtI@24}} {{k7wcmJH9vuQ@11}} {{fTLTYUgGTuo@3327}}", "小Pや遅らせ投げ抜けに勝つのは、大Pラッシュ大Kだ。ガードされても、ラヴーシュカの固めに行ける。嫌がって昇龍を出せば遅らせ投げでガードされるかもしれず、相手にとっては難しい読み合いになる。大Kを大きく遅らせて出す形も混ぜる。相手がドライブリバーサルを出せばゲージの交換にはなるが、JP側に仕込みがあるので完璧な対処ではない。 {{k7wcmJH9vuQ@22}} {{_mOPb3s_vtI@46}} {{_mOPb3s_vtI@78}}", "大Pラッシュ中足と大Pラッシュ小足は連続ガードになり、相手がSA1や昇龍を狙っても出ない。昇龍のコマンドの6が入っていると中足の下段を食らう。無敵技をガードせずに中足を当て、コンボで足りる場面ではコスパがよい。ガイル、ディージェイのようなためキャラには、連ガ下段が特に有効だ。ためキャラは、SAでない無敵技を出すために上を入れた時点で下段を食らう（2026年5月23日の配信も、連続ガードかつ下段なのでドライブゲージも確実に削れるとしている）。 {{_mOPb3s_vtI@103}} {{_mOPb3s_vtI@147}} {{Zn4heiO2Pjs@7944}}"]}, {"title": "大Pラッシュの使い分け：相手を見て変え、見切られたら変える", "body": ["大Pラッシュに相手が何をするかは、1〜2回やれば分かる。散らす人もいるが、大体はとっさの反応なので手なりの行動が多い。初見の相手には、まず大Pラッシュを当てて昇龍を打つかどうかを確かめたい。知っている相手にも同じ確認をする（2025年12月21日の配信）。 {{_mOPb3s_vtI@182}} {{BrB4x5IvVws@521}}", "ラッシュ大Kのタイミングは、相手の行動に合わせて変える。最速の小Pを出す相手には、大Pからラッシュ大Kと出すと小Pを振った相手に当たる。投げ抜けを早めに入れる相手には、少し遅らせた大Kがちょうど勝ってカウンターになる。遅らせ投げが抜けられるなら、さらに遅く出す（2026年3月25日の配信）。2026年4月11日の配信では、相手がみんな小Pを押してくるため、大Pラッシュを遅らせる型が自分の中で流行っているとしている。 {{7TC-ZplMp7c@1566}} {{MPaucCetMzA@2672}}", "通らなくなる場面もある。2026年5月2日の配信では、大Pの連携や遅らせ大Kが通っていたが、途中から相手が遅らせに後ろジャンプを合わせ、前歩きガードから大Kで確定を取る動きに変わった。神木Cはこれを最大の敗因とし、後ろジャンプに変えたと分かった時点で最速大Kで固めに行くべきだったと振り返っている。2025年12月12日の配信では、リバーサルを出され続けて大Pラッシュにアムネジアを仕込み、その時だけ相手がSAを出したとしている。2026年5月22日の配信では、仕込むと遅らせられず、ミスで漏れる隙のリスクも大きいので仕込んでいない。 {{b3Zfr0Fwz6E@118}} {{-3GEkgySYo0@3800}} {{Ebe_1eYUK38@11390}}", "ラッシュ大Kの評価は、動画と配信で食い違っている。2026年3月の動画は、遅らせ投げ抜けに勝つ手として大Pラッシュ大Kを挙げている。配信では、大Pや中攻撃からのラッシュ大Kは絶対に連ガにならず、昇龍を持つ相手には昇龍が入る連携なので強くない、という見立てが出ている（2026年6月21日）。2026年11月20日の配信では、大Pガード後のキャンセルラッシュは、ラッシュ遅らせ投げ、ラッシュ大K、ラッシュ中足の3つから判断するとしている。 {{_mOPb3s_vtI@46}} {{2RL5sSXwv3A@467}} {{2vL4Q5qBTwE@6583}}"]}, {"title": "連続ガードと崩し：中段、パリィ仕込み、投げ、大足", "body": ["連続ガードの連携で中段をガードさせると、しゃがみを強制的に解除させられる。ガイル、ディージェイ、ブランカのような相手には、その後は無敵技が来なくなり、状況によっては対空も来なくなるので、飛ぶ選択肢が通りやすくなる（2026年5月20日の配信）。 {{lD3PDfsalHI@6319}}", "連続ガードを組むときの小Pにパリィを仕込む技は、やらない理由がないので常にやるべきだ。神木Cは、できていない試合はサボっているだけだと振り返っている（2026年9月30日の配信）。ラヴーシュカのパリィ仕込みのコツは、焦りすぎないことに尽きる。小P、パリィ、中足の順に押し、早すぎるとパリィが出てしまい、遅すぎるとガードできない。トレモで繰り返し試し、パリィを中Pや中足と別のボタンに置くと多少やりやすい（2026年3月20日の配信）。 {{Jsg1B-3ogLY@2332}} {{_LIvr7jcqx0@1802}}", "ラヴーシュカをパリィしてきた相手を投げる目安は、距離が近いなら最速の前歩き投げ、遠いなら最速のラッシュ投げだ。難しいのは最初の2段をガードした直後の投げで、気持ち待つことが大事そうだ（2026年4月24日の配信）。重ならない系の中段を狙うタイプのラッシュは、相手が暴れてくる率がかなり高く、チュンリー戦ではそこを突く場面があった（2026年4月25日の配信）。 {{195SUDYWv04@2756}} {{fQP25E3Ed9s@4472}}", "小Pからの大足は、小P大足が中央でもつながる相手キャラなら積極的に狙い、そうでないキャラでは悩みどころになる。相手がきちんとガードできるのか、わざと食らうタイプなのかを見て使う（2026年11月7日の配信）。大足から連続ガードにつなぐ連携は、食らい逃げが対策として成立するので、ミスで食らったのか食らい逃げなのか分かりにくい。食らった後に後ろ受け身をしたなら食らい逃げと見る（2025年10月15日の配信）。 {{8RylXGykVY4@4214}} {{OeFgpUo8gKc@4620}}"]}, {"title": "パリィとの読み合い：フェイントで釣り、投げを混ぜる", "body": ["大Pをガードさせた後のトルバランのフェイントは、パリィを釣る行動だ。思わずパリィする人なら、そのまま投げに行ける。パリィする人かどうかの様子見も兼ねており、パリィしないと分かれば、中トルバランなどで普通に打ってゲージを削りつつ崩す（2026年6月21日の配信）。弾の使いどころでいちばん多いのも、大Pからのトルバランのフェイントで、パリィしてダッシュ投げにつなぐ。ラッシュしてくる相手にはしゃがみ中攻撃を当てる（2026年7月14日の配信）。 {{2RL5sSXwv3A@3081}} {{wsmE7M2oF7M@1041}}", "フェイントの読み合いは、まずトルバランを出して様子を見て、相手がラッシュを張る型か、ラッシュしてくる型か、止まったときだけボタンを押す型かで対応を変える。インパクトも暴れも読み合いの形に合わせられるので、裏目ではない（2026年9月20日の配信）。パリィを張る相手には、大Pトルバランの択がJP有利になりがちで、最終的に相手は何もしない選択が増えるという見立てだ（2026年6月21日の配信）。 {{evBaj9xQWio@9699}} {{2RL5sSXwv3A@5496}}", "セットプレイには投げを混ぜる。投げを入れないと、相手はパリィか昇龍に絞れて安定してしまう。毎回同じ行動だと読まれるので、投げを混ぜるだけでジャストパリィされる回数は減るはずだ（2026年8月15日の配信）。ジャストパリィしてくる相手には投げを通せばよく、相手がパリィしにくくなれば、素ガードに中下段の択をかけられる（2026年4月10日の配信）。ワープやパリィをする癖がついた相手には、一度ワープ投げを見せるのもよい（2026年3月17日の配信）。 {{QAR6ElExOhY@2392}} {{SCZlskkcv3s@6105}} {{WoW4QU4Dvnk@5083}}", "パリィにリスクを付けられる連携は少ない。稼働最初期からあるODトルバランからトリグラフの通常設置は、パリィされても投げで拾える（2026年8月15日の配信）。ジャストパリィを嫌がられて投げを重ねられても、アムネジアで入れ替えられるが、小Pなどを最速で暴れる相手には無力で、最後は読み合いになる（2026年11月7日の配信）。置き攻めにアムネジアを撃たないとバレると、投げを重ねられて負けるので、アムネジアを撃つ人は下手という考えは捨てたほうがよい（2026年6月1日の配信）。 {{QAR6ElExOhY@2083}} {{8RylXGykVY4@3273}} {{WsUQFx1OQiA@2305}}"]}, {"title": "ワープ：使い道と、見られ始めた対応", "body": ["ワープの使い道は、見てジャストパリィをしてくる相手や、無敵技で割り込んでくる相手への対応が真っ先に浮かぶ。ラッシュ後に中Pが出てしまい、ダッシュインパクトを受ける場面への対応にもなる（2026年8月6日の配信）。2026年8月3日の配信では、調整で中Pや中足のキャンセル先が起爆だけでなくワープにも広がった。中足起爆をジャストパリィされると補正が乗らず相手のリターンが大きかったが、ワープでかわすのが1つの答えだ。 {{zAhVM3GijPc@4663}} {{gYHNHkrNd8w@503}} {{R5jtd6nJRK4@1380}}", "2026年8月13日の動画では、中足ワープや大Kワープなどは、ダッシュインパクトのような行動をしてくる相手にかなり強いはずで、特に読み合いを仕掛けられる点がよいとしている。ストリボーグは多くのキャラがSAで確定を取れるので、先端の手前の距離を見極めて使う。 {{j7hEDnNDJlQ@140}}", "ワープは対策も進んでいる。2026年5月27日の配信では、画面端のOD設置攻めで、トリグラフのOD設置後のワープを見てジャストパリィを狙う相手が最近増えたとしている。ワープしても技を振らずに降りる場面もある。2026年9月12日の配信では、ワープからのジャンプ中攻撃で裏に回る攻めを、ワープを見て少し前に歩いて空かしてくる相手がいる、上のレート帯には実際にいるとしている。 {{dhljVsWRWBQ@6263}} {{M-hVEg_phXA@8714}}", "相手が必ずコマンドを回していると読めるなら、コンボの最後だけワープにするのが最大の対策だ。相手を観察するときは、まず食らっている間とガードしている間に何をしているかを見る（2025年12月15日の配信）。画面端のセットプレイで引き中がワープに化けやすいのは、小Pの直後に引き中へ直接行こうとして暴発するためだ。いったんニュートラルに戻してから出すと化けにくい（2026年7月31日の配信）。 {{Xp4MUMoThdE@5830}} {{JdR_4go3Ihc@6100}}"]}, {"title": "画面端のセットプレイ：トリグラフOD設置からの択とゲージの目安", "body": ["画面端でトリグラフからOD設置するときは、トリグラフを撃った時点でドライブゲージが3本ほどあれば同じセットプレイをループできるので、それを基準にしている。2本ぎりぎりだと終わった後にゲージが厳しい。択が通ったときにもう一度同じセットプレイができるかで判断する（2026年4月11日の配信）。 {{MPaucCetMzA@8617}}", "トリグラフOD設置からの択は、時期で数え方が違う。2026年5月17日の配信では、択は投げ、ワープジャンプ中K、中Kからの連携の3つで、じゃんけんになるため完全対応は不可能だとしている。2026年6月27日の動画では、同じトリグラフOD設置の3択を、投げ、弱ワープからのジャンプ中K、弱ストリボーグとしている。 {{tpQg36xBmD0@7632}} {{KMrV_6C9Huw@10}}", "投げからはフルコンボが入り、もう一度ループさせることもできる。ワープジャンプ中Kは、遅らせ投げ抜けと、真上に判定のある昇龍系などを除く無敵技に勝ち、前飛びにも当たる。ただし最速の投げ抜けは狩れず、前飛びからめくり技を振られていると負ける。打撃重ねは連ガで、飛んでも暴れても食らい、ガードしてもリバーサルのOD昇龍は出ない。 {{KMrV_6C9Huw@27}} {{tpQg36xBmD0@7860}} {{KMrV_6C9Huw@95}}", "壁端で投げとシミーのどちらを見るのがリスクが低いかと聞かれ、シミーを見るのが正しい判断だと答えている。シミーを見て無限投げで負けたなら読み負けでしかたがなく、投げをしていたら相手がシミーで爆散した可能性もある（2026年7月31日の配信）。設置への大攻撃重ねでは、ジャストパリィをケアして間を空けることはせず、ケアするなら重ねずに投げに行く（2025年10月22日の配信）。 {{JdR_4go3Ihc@6757}} {{cDKjxzxuH6k@7945}}"]}, {"title": "詐欺飛びと補正切り：リターンと読まれ方", "body": ["詐欺飛びに毎回行ける起き攻めは、普通にかなり強い。ジャストパリィがあるので詐欺飛びの価値が落ちる面はあるが、本来はかなり強い（2026年8月17日の配信）。設置が絡む詐欺飛びは、大Pが当たった高さや設置が直撃したタイミングのフレームが影響する。大P設置からの前投げは、タイミングによって詐欺飛びになったりならなかったりする（2026年8月24日の配信）。 {{mWlneLs90qQ@10587}} {{SpasYmij-Os@1994}}", "OD トルバランがヒットした後は、良い選択肢が少なくなりがちだ。視聴者から、相手が後ろ受け身を取る前提で画面中央から詐欺飛びに行けるのではというリプレイが送られ、実際に試した。ジャンプ弱Kの詐欺飛びは、表になっているか裏になっているかがやっている側にも分からないので、めくらない前提の表の択として割り切って使うのもよい（2026年9月5日の配信）。 {{x37Y8lEVE8c@1440}} {{x37Y8lEVE8c@1909}}", "設置で詐欺飛びになる連携は、最速で入力すると起爆になってしまう。神木Cが見たことがない連携で、トリグラフを重ねる形と比べ、詐欺飛びなのでSA3があっても使える点が大きい（2026年5月12日の配信）。前飛びを重ねたとき、相手が前ジャンプしていれば垂直空投げで相手を画面端に戻せるので、追い詰める時間が増えやすいかもしれない、としている。相手がめくり技を出していると食らう（2026年4月15日の配信）。 {{-oFFHO-E1OQ@2013}} {{RwBFCqfbtrA@6503}}", "補正切りは、多用すると見切られる。補正切りが多い人だと覚えられると通らなくなることがある。神木C自身も勝てる場面ではやるが、飛ばれて潰されるパターンも多く、最近は減らすよう周りに言われている（2026年7月15日の配信）。補正切り投げは、理屈では見て飛べる行動で、飛ばれるとフルコンを食らうので、確実に飛べる相手ならやらないほうがよい。ただ飛べない相手が多いので、自分はよくやる（2026年7月14日の配信）。 {{suzckUKhzyk@1796}} {{wsmE7M2oF7M@7062}}"]}, {"title": "相手キャラ別の注意：ダルシム、イングリッド、リリー、ED ほか", "body": ["ダルシムには、ワープ（テレポート）を止めないとやりたい放題される。画面端の設置の起き攻めであえて小足を混ぜるとよいだろうという見立てだ。遠距離のトリグラフは控えめにして、降ってくるところに合わせないと痛い目を見る（2026年7月2日の配信）。ダルシム戦はトリグラフにワープが噛み合うと死ぬ要素があり、逆のタイミングでワープされた試合もあった（2026年5月9日の配信）。2026年3月の動画では、ダルシムは前ステップが非常に長く、通常トリグラフにも当たりやすいが、2発目にテレポートが噛み合うとJP側にもリスクがあるとしている。 {{Xec6eJ-w62w@3950}} {{RzX9IwFcodM@20930}} {{VhKotbb94dI@346}}", "イングリッドは、大ストリボーグからのいつもの設置コンボで、トリグラフの後をイングリッドのワープで抜けられる（2026年5月30日の配信）。テリーはJPに対してやれる要素が揃ったキャラで、ケンはその要素がさらに多い。テリーのラウンドウェイブは強の弾で、アムネジアでは取れず、ジャストパリィで対処する（2026年5月25日の配信）。ケンの昇龍のように上に吹っ飛ぶタイプには、インパクトより前ステで入れ替えるほうが正しい（2025年12月21日の配信）。 {{uJDuKXzhNOs@2028}} {{8LWKOQt_vIU@3475}} {{BrB4x5IvVws@6631}}", "リリー戦は、ヴィーハトを貼って立ち回りに戻ったら、OD コンドルスパイアを見てジャストパリィするのがいちばん大事で、ミスしてもよいから試みる。一度でも成功すれば、リリー側はやりづらくなる。モダンキャミィ戦は、神木Cが安全寄りの設置しかしない前提で、置いた後に大攻撃を出す手がある。キャノンストライクで飛んでくることが多そうで、今は大攻撃から起爆できる（2026年4月12日の配信）。 {{vn8DB9xIkEU@3001}} {{vn8DB9xIkEU@4185}}", "ED戦では、いつもの大Pからラッシュして遅らせ投げをする流れが意味を持たず、ED専用の何かを考える必要がある（2026年10月23日の配信）。A.K.I.は受けが弱いので、一度転ばせて距離を詰め、投げを中心に攻めると詰ませやすい。一方で判定が強く、特に空中技の判定が強いので飛びが強い（2026年4月23日の配信）。相手の大足をガードしたときの確定反撃はキャラ差が大きく、ジェイミーの大足には前大Kが入り、ベガの大足にもたいてい入るがたまに入らない（2026年5月30日の配信）。 {{ff2oYUGxmBQ@7777}} {{8-mSJY7tMNQ@1146}} {{uJDuKXzhNOs@6443}}"]}, {"title": "相手はこう返してくる：設置とシューティングへの対応", "body": ["設置は、始動で有利不利が変わる。2026年3月の動画では、ラッシュからトリグラフまで出して設置するとJP側が6〜7フレ不利になり、トルバランの段階で設置するとJP側が有利になる。JP不利の設置はトリグラフから抜けられると確定を取られ、JP有利の設置からトリグラフを出すと、逆にJP側が確定を取る。ただし動画の概要欄は、以降の調整で変わっている可能性を注意している。 {{VhKotbb94dI@11}} {{VXe0w9NM7Hg@11}} {{VXe0w9NM7Hg@22}}", "相手は、ワープ投げ・ワープ打撃を昇龍や空投げで落とそうとする。トルバランフェイントはパリィを釣る行動で、JPはその後トリグラフでゲージを削りに来る。パリィしているとわかれば投げに来るので、相手は、うっかりパリィしたらラッシュで逃げる。それを読んでジャンプ攻撃で降ってくることも多く、択掛けになる。受ける側は、パリィを弾の起爆に合わせたジャストパリィのときだけにし、トルバランにはパリィしないほうがよい。釣られるとゲージが減る上にワープ投げを食らうリスクがある。 {{VhKotbb94dI@120}} {{VhKotbb94dI@52}} {{VhKotbb94dI@482}}", "2026年3月の動画では、弾の張り直しの場面はJPが不利だとしている。マイナス19、OD版でもマイナス9で、設置をやり直す限り歩ける隙間がある。波動のあるキャラは張り直しにOD波動などで割り込める。2026年5月14日の配信では、ラッシュの強いキャラは最初の段階から攻める形が最も効くとしている。設置を許したら一度受け入れてパリィし、トルバランなどが終わったタイミングで殴りに行く。張り直しの場面はJP側が不利フレームを背負うので、ダッシュで近づくと強い。 {{VhKotbb94dI@551}} {{VhKotbb94dI@177}} {{2-qY9UdbDGw@7220}}"]}, {"title": "相手はこう返してくる：大Pからのセットへの対応", "body": ["大Pからの通常セットは、投げてもコンボにならないので、相手は投げを捨て気味にしてくる。詐欺飛びでJPの有利は続くが、投げにそこまで意識を割かない。2026年6月27日の動画でも、2026年7月6日の動画でも同じ扱いだ。痛いのは大Kの直撃で、大Kから中段が来るほか、新要素として大Kから中足を出す選択肢もある。 {{KMrV_6C9Huw@132}} {{KMrV_6C9Huw@156}} {{1NDeURlQ0dE@0}}", "大Pから直接ヴィーハトを起爆する連携は暴れ潰しなので、相手は動かず、起爆を見てジャストパリィするのが最もよい。起爆へのジャストパリィは補正がかからず、爆発のダメージを与えられる強みがある。起爆からラヴーシュカにつなぐ形は、真面目にガードするのはほぼ無理なので、相手はドライブリバーサルで返すのがおすすめだ。 {{KMrV_6C9Huw@188}} {{KMrV_6C9Huw@222}}", "大Pから直接OD設置する形は、小Pでフレームを消費し、トルバランまで連ガになる。トルバランはヴィーハトのエフェクトと重なって見にくく、特に下段が見にくいので、下段が来ることが多い。相手はこの形が見えた時点で、リバーサルの昇龍か、引き中攻撃へのジャストパリィを狙い、ガードしてからドライブリバーサルを出す。投げは気にしない（2026年5月17日の配信も同じ見立てだ）。 {{KMrV_6C9Huw@233}} {{KMrV_6C9Huw@256}} {{tpQg36xBmD0@8526}}", "バーンアウト中も、トリグラフから始まる同じ連携が来て、小P、トルバランまで連ガになる。相手はトリグラフを見てからSA3やSA2を撃つのが最もよいが、SAゲージが1本しかなければ受け入れるしかない。ヴィーハトのワープは、設置の後に穴の真下付近にいると裏側に落ちてくるめくりになり、穴から離れていれば正面に落ちる（2026年5月13日の配信）。 {{KMrV_6C9Huw@292}} {{tpQg36xBmD0@8706}} {{84fijnCF6Io@6022}}"]}, {"title": "セットプレイの優先順位と注意：再現性、手札、入力ミス", "body": ["変わったセットプレイを作りたくなる気持ちは分かるが、レートを上げたいなら優先度はかなり低く、インパクトを返す練習のほうがよい（2026年8月17日の配信）。遅らせてインパクトに設置を噛み合わせるセットプレイは、体感のフレームで遅らせる上、相手のインパクトのタイミングで結果も変わるので、再現性が低く実戦向きではない。使われていない連携には、使われないなりの理由がある（2026年5月17日の配信）。 {{mWlneLs90qQ@4797}} {{tpQg36xBmD0@10386}}", "1800〜2000帯のJPで大事なのは、手札を増やすことだ。メインどころのセットプレイやコンボでも、上のレート帯まで行ってまだ使えていないものがある。場面ごとに適切な手札を選べるようにする（2026年3月20日の配信）。JPでマスターに上がったばかりの人は、セットプレイをあまり覚えていない可能性があるので、その知識を入れる。コンボも仕上がっていないものを詰め、JPはアドリブのコンボが大事なので、アドリブの筋肉をつける（2026年7月21日の配信）。 {{_LIvr7jcqx0@3837}} {{tdyU_8woXj8@348}}", "入力の暴発にも気をつける。大Pからの設置を狙って入力を誤り、しゃがみ大攻撃が出て確定反撃を受けて負けた試合があった（2026年4月17日の配信）。しゃがみ小Pの後に後ろへ入れる動きで別の技が出る場合、スティックだと斜めが漏れやすい。十字キーなら下を入れた後にちゃんと後ろを入れ、どちらも斜め下が入らないようにするのが基本だ（2026年4月9日の配信）。ジャストパリィからのトリグラフは、パッドだと入力がきつく、レバーレスが一番やりやすいという見立てだ。神木Cはパッドで入力できる気がしないため、ジャストパリィのあとはラッシュにしている（2026年5月4日の配信）。 {{Q-NTE6rpF9o@3916}} {{hQ3PylyyOcY@2584}} {{E7w7piOJGE4@2402}}", "苦し紛れの一発逆転連携は、悪くない。試した連携の見立てでは、リバーサルのパリィはなかなか狙われないだろう（2026年9月10日の配信）。2025年10月6日の配信では、連続ガードで削った後に前ステップからインパクトなどを狙う連携を、深夜に思いついた形として試した。強いだろうという見立てだが、入力がブレやすく、うまく決まらない場面があった。 {{-sVAWAfLmJ4@1033}} {{-DOe9xRz-cI@5618}}"]}], "routes": [{"title": "トリグラフOD設置", "routes": [{"name": "トリグラフOD設置の3択", "when": "トリグラフからOD設置した後", "route": ["トリグラフ", "OD設置"], "options": [["投げ"], ["弱ワープ", "ジャンプ中K"], ["弱ストリボーグ"]], "note": "2026年6月の動画。投げはコンボが入りループもする。遅らせ投げ抜け・一部を除く無敵技・前飛びが狩れるが、最速の投げ抜けは狩れず、真上に判定のある昇龍系の無敵技は相手が勝つ。前飛びにはめくり技を出すとワープジャンプ中Kに勝てる。", "cites": ["{{KMrV_6C9Huw@10}}", "{{KMrV_6C9Huw@55}}", "{{KMrV_6C9Huw@68}}"]}]}, {"title": "大P設置", "routes": [{"name": "大Pから通常設置", "when": "大Pの後", "route": ["大P", "通常設置"], "options": [["大K", "中段"], ["大K", "中足"], ["大K", "中足", "起爆"]], "note": "投げてもコンボにならず、詐欺飛びでJP有利が続く程度なので、投げは捨て気味の択。本命は大Kの直撃。起爆は暴れ潰しになる。2026年5月と6月の動画。", "cites": ["{{KMrV_6C9Huw@132}}", "{{KMrV_6C9Huw@156}}", "{{tpQg36xBmD0@8268}}"]}, {"name": "大Pから直接OD設置の連続ガード連携", "when": "大Pの後", "route": ["大P", "OD設置"], "options": [["しゃがみ小P", "引き中攻撃", "トルバラン"]], "note": "しゃがみ小Pでフレームを消費し、引き中攻撃、トルバランと続けて中段と下段で崩す連続ガードの連携。エフェクトが重なって見にくく、下段が来る率が高い。2026年5月と6月の動画。", "cites": ["{{KMrV_6C9Huw@233}}", "{{tpQg36xBmD0@8526}}"]}, {"name": "大Pパニッシュカウンターから設置", "when": "大Pがパニッシュカウンターになったとき（画面の位置を入れ替えたい場面）", "route": ["大P", "設置"], "options": [], "note": "位置を入れ替えるルートでいちばん簡単な型。大P直設置でも、大Pからトリグラフ設置でもよい。", "cites": ["{{pe3OwQE-X9E@2785}}"]}, {"name": "大Pパニッシュカウンターからトリグラフ設置", "when": "大Pがパニッシュカウンターになったとき（画面の位置を入れ替えたい場面）", "route": ["大P", "トリグラフ設置"], "options": [], "note": "", "cites": ["{{pe3OwQE-X9E@2785}}"]}, {"name": "大P設置からの前投げ", "when": "大Pで設置が直撃した後", "route": ["大P", "設置", "前投げ"], "options": [], "note": "一応詐欺飛びになるが、大Pが当たった高さや設置が直撃したタイミングのフレームで、詐欺飛びになったりならなかったりする。", "cites": ["{{SpasYmij-Os@1994}}"]}]}, {"title": "設置後の起き攻め", "routes": [{"name": "設置後の大Kがヒットしたとき", "when": "設置後の大Kがヒット", "route": ["大K", "しゃがみ中P", "起爆"], "options": [], "note": "大Pまで入れ込むと、相手が上を入れっぱなしの場合に大Pが空振りし、マイナス10ほどの大きな不利を背負う。SA2に行く場面以外は大Kで止める。", "cites": ["{{Wr9dUkkfM-g@7316}}", "{{P7lgTe_au9s@6773}}"]}, {"name": "設置後の大Kがガードされたとき", "when": "設置後の大Kがガードされた", "route": ["大K", "中段"], "options": [], "note": "大Kはヒット確認が簡単。ヒットなら中足・中段・暴れ潰しにも行ける。", "cites": ["{{Wr9dUkkfM-g@7316}}", "{{P7lgTe_au9s@6773}}"]}, {"name": "設置からのつなぎは中K", "when": "設置の後", "route": ["設置", "中K"], "options": [], "note": "引き中攻撃も連続ガードで好みの範囲だが、当たったときの火力は中Kのほうが高く、引き中攻撃からの連携もやりづらい。", "cites": ["{{4vJjrBXQ7NY@5130}}"]}, {"name": "画面端のセットプレイの小Pから引き中攻撃", "when": "画面端のセットプレイ", "route": ["小P", "引き中攻撃"], "options": [], "note": "小Pの直後に引き中へ直接行こうとするとワープが暴発する。小Pの後にいったんニュートラルに戻してから出すと化けにくい。", "cites": ["{{JdR_4go3Ihc@6100}}"]}, {"name": "設置の後に中Pを置いてラッシュ", "when": "設置の後", "route": ["設置", "中P", "ラッシュ", "起爆"], "options": [], "note": "2026年5月の調整後。中Pを置いてラッシュしていれば、勝手に止まって起爆できる形は強そう、という見立て。", "cites": ["{{RzX9IwFcodM@2053}}"]}]}, {"title": "起爆の連携", "routes": [{"name": "大Pから直接起爆", "when": "大Pの後", "route": ["大P", "起爆"], "options": [], "note": "暴れ潰しになる。起爆を見てジャストパリィできるのが最もよい。2026年6月の動画。", "cites": ["{{KMrV_6C9Huw@188}}"]}, {"name": "起爆からラヴーシュカ", "when": "", "route": ["起爆", "ラヴーシュカ"], "options": [], "note": "真面目にガードするのはほぼ無理。ドライブリバーサルは当たる。2026年6月の動画。", "cites": ["{{KMrV_6C9Huw@222}}"]}, {"name": "大Kから起爆", "when": "", "route": ["大K", "起爆"], "options": [], "note": "2026年3月の調整直後。連続ガードになる。対策は起爆に合わせたジャストパリィ。", "cites": ["{{gzr5Bd0EwC0@1326}}"]}, {"name": "中足起爆", "when": "中足の初段をガードさせた後", "route": ["中足", "起爆"], "options": [], "note": "2026年3月の調整直後。ワンガードで暴れる相手が多く、そこに刺さる。中Pからの起爆も暴れ潰しになる。", "cites": ["{{gzr5Bd0EwC0@3414}}", "{{gzr5Bd0EwC0@1326}}", "{{WoW4QU4Dvnk@802}}"]}, {"name": "起爆ヒット後の締めはODストリボーグ", "when": "設置・起爆ヒット後の締めで最大ダメージを取りたいとき", "route": ["OD ストリボーグ", "トリグラフ", "OD トリグラフ"], "options": [], "note": "ODトリグラフからはトリグラフをもう1回つなげるが、ODストリボーグからはトリグラフのあとにODトリグラフをもう1回挟めるので、火力が下がらない。", "cites": ["{{fZgVDyrd5gM@6116}}"]}]}, {"title": "投げ後の設置", "routes": [{"name": "裏投げから通常設置", "when": "裏投げの後", "route": ["裏投げ", "通常設置"], "options": [], "note": "設置は不利を背負い、キャラによっては確定反撃がある。JPミラーではトリグラフかSAが確定し、ストックが2つ以上あるイングリッドにはビームが確定する。必ず設置するわけではなく、ラッシュ中段、ラッシュ中足、SA、歩いて仕切り直す選択もある。", "cites": ["{{7Vo4NfgxoFk@2417}}", "{{gzr5Bd0EwC0@4577}}", "{{QJy4s3alemg@624}}"]}, {"name": "前投げから通常設置", "when": "前投げの後", "route": ["前投げ", "通常設置"], "options": [], "note": "甘い行動で、意外と確定がある。止めてくる相手も多く、相手にSAが1本でもあるなら避ける。", "cites": ["{{gzr5Bd0EwC0@2081}}", "{{50Y_VSxPLd4@11495}}"]}]}, {"title": "設置の始動", "routes"
