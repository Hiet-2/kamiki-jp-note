002225188924}}{{dc:1285810788199694408/1518598055371472987}}{{dc:1285810788199694408/1518598521542934720}}"], "clips": []}, {"title": "画面端と起き攻めの守り、簡単な行動を選ぶ", "body": ["@jpdc 2024年9月の投稿では、端へ追いつめられた場面で上手い人が4中Pを空振りしているのは何かいいことがあるのか、という質問に、判定が強いので差し返されにくく技の打ち合いでも勝ちやすい、ヒット時はタゲコンからSA2につなげて入れ替えることもできる、という答えがあった。{{dc:1285810788199694408/1286619940979478582}}{{dc:1285810788199694408/1286626080882692188}}", "@jpdc 2026年4月の投稿では、シミーや様子見の相手への防御択として、ワンガードアムネジア、強K暴れ、立ち強P→OD弾→SA2、前ジャンプ、ファジー大PからOD弾かキャンセルラッシュ引中Pが挙がった。垂直ジャンプには上をガン見してガンガードし、時々引き中Pで暴れる。後ろ下がりシミーにはODアブニマーチをぶっぱなすと、試した人から決まったという報告が複数あった。{{dc:1285810788199694408/1489535146322296883}}{{dc:1285810788199694408/1489536239945256960}}{{dc:1285810788199694408/1489540595532824657}}{{dc:1285810788199694408/1489541269330853908}}{{dc:1285810788199694408/1489983572113756191}}", "@jpdc 2026年4月の投稿では、端を背負ったときの立ち回りとして、相手の前歩きや歩くタイミングに合わせて中Kラッシュや中KODストリボーグで追い返し、少し歩いて自分の後ろに空間を持たせて差し返しも狙う、という例が挙がった。大Kを振ってSA2で入れ替えを狙う、弱強のOD設置から立ち中P・中K起爆を狙う話もあった。{{dc:1285800688097562715/1491815667161108591}}{{dc:1285800688097562715/1491818849505378476}}", "@oukoku 2025年11月の投稿では、画面端の被起き攻めの対処として、前ジャンプを通す（バクステや遅らせグラップはその下位互換）、相手のジャンプには空投げを合わせてラッシュ中段、ODアムネジアは相手の重ねが甘いと不発になるので土壇場で頼らない、リバサは中足でなく大Kタゲコン→弱ストリボーグでゲージ削りとライン押しをする（SA2があれば入れ替えもできる）、という考えが出た。{{dc:1438530301566390462/1438530301566390462}}{{dc:1438530301566390462/1438554050118287430}}"], "clips": []}, {"title": "SA2（ラヴーシュカ）を使うタイミング", "body": ["@jpdc 2024年9月〜2025年7月の投稿では、SA2はリーサルのほか、相手体力6割未満で中攻撃以上がヒットしたら使い、相手の受け方の癖を読んで補正切りコンボで揺さぶる、通用しなさそうなら運びコンボで端に追い詰める、という使い方が挙がった。ランクが高い人ほどSA2を多く使っているというデータもあるという。{{dc:1285800688097562715/1286607892086132747}}{{dc:1285800688097562715/1286607949720191026}}{{dc:1285800688097562715/1395279473074503724}}{{dc:1285800688097562715/1395333623334305832}}", "@jpdc 2026年2月の投稿では、自分のドライブゲージが3本以下で画面中央近くで技が当たったとき、運びコンボでSA2を使うかという質問に、SAゲージを回したいので2本たまったらすぐ使う、使う回数を増やした方がよい、という答えがあった。一方、最近は相手のガードが上手くDリバのポイントも押さえているので、相手がバーンアウト確定の2本以下で使い、3本あるとストリボーグを振りやすいのでSA2は控えめという答えもあった。{{dc:1285810788199694408/1476412313476005919}}{{dc:1285810788199694408/1476541143515791361}}{{dc:1285810788199694408/1476740448792870973}}", "@oukoku 2026年1月の投稿では、SA2を回しやすくするには、大Kのタゲコンを振り回すのが一番手っ取り早く、置きにも起き攻めの重ねにも使えるとされた。ラッシュ止めは、行動の終わり際（相手が攻撃をガードしたあとなど）を見るのが要点だという。{{dc:1458368997287395361/1458393603268153576}}", "@oukoku 2026年2月の投稿では、プラチナ帯の立ち回りとして、しゃがみ中Pはコンボ練習の意味でもとりあえず振る、SA2が撃てるようになったら失敗してもいいので無理やりでも発動させに行く（前ジャンプ大Kから立ち大Kのタゲコン、生ラッシュしゃがみ中P、引き中Pのタゲコンなど）、立ち中Pをなるべく先端で当てる、が挙げられた。{{dc:1472835293932687451/1472835293932687451}}{{dc:1472835293932687451/1473291639077343274}}", "@oukoku 2026年2月の投稿では、SA2を使えていないという指摘があり、大K大P→SA2や大P→ODトルバラン→SA2で相手を崩し、相手がバーンアウトしているなら大P→ODトルバラン→SA2が連ガでとても強いとされた。SA3でリーサルが見える場面でも、体力が4〜5割残っているなら自分ならSA2を使うが、判断は難しくSA3を選ぶこともあるという。強K強Pが先端で連ガが作れないときは強P→ODトルバラン→SA2に切り替える。{{dc:1469554726164103363/1470711036695937206}}{{dc:1469554726164103363/1470723950064701481}}{{dc:1469554726164103363/1470749752332255377}}"], "clips": []}, {"title": "3大P・4中P・立ち大Kの使いどころ", "body": ["@jpdc 2024年9月の投稿では、強5K→強5P→SA2→5中K→ステップ3強Pでダウンを取ると、相手の復帰に合わせてSA2が足元に降ってくるので、補正切りでそこからまたコンボに行けるという使い方が紹介された。また、弱ストリボーグがヒットしたあとにラッシュ3強Pで埋めようとしたが、その場受け身をされるとアウトだったという話があり、後ろ受け身限定の埋めなら使いどころは限られる、という受け止めだった。{{dc:1285810788199694408/1287576402069291059}}{{dc:1285810788199694408/1287594668086919269}}{{dc:1285810788199694408/1287596760109154417}}"], "clips": []}], "reviewed": true}, {"id": "combo", "name": "コンボ", "lead": "JPのコンボは、確定反撃の技選び、カウンターの確認、ドライブゲージの配分で火力が決まる。", "sections": [{"title": "ジェイミーの飲み、ガイルのブレイド、SAの隙に確定を取る", "body": ["マノンのSA2の跳ねる部分には、ラッシュで割り込んだりインパクトを出したりできる。最後までガードしきってもゲージが削られるだけなので、大きな端コンボを入れる。連続ガードが切れるSAはジュリのSA1、マノンのSA2、春麗のSA2だけという見立てだ。ジュリとマノンのSAは切れ目にインパクトで割り込める隙間があり、警戒せず切れ目で確定を取る。{{9A6i80KhYjw@12}} {{odGhkR7MFco@96}} {{nVJ1B9hi_lA@9756}}", "@ryusei 2026年7月の動画では、視聴者の研究として紹介された、ダルシムのSA2に対するJPの最大確反が試される。確反にはドライブインパクトが入るが、目押しが必要になる。最速で撃つと弾に当たるので、弾が画面外に消えた後くらいに撃つのがよいという。{{yXbMl1Js0w4@13}}{{yXbMl1Js0w4@47}}{{yXbMl1Js0w4@86}}"], "clips": []}, {"title": "カウンターとパニッシュカウンターの仕組み", "body": ["@jpdc 2026年1月の投稿では、中央でOD無敵技などをガードして密着の大Pパニカンから行くコンボとして、大Pパニカン、大小設置、中K中スト、微歩き、中小設置、大P中弾、バクステ、中弾、棘、SA2かSA3が、見た中で最大という答えがあった。大中設置にすると大設置が画面端に近すぎて消えるのではという。立ち中Kだと大中設置が消え、2中Pなら設置のタイミング次第で残るという報告もあった。{{dc:1285810788199694408/1461544886950957067}}{{dc:1285810788199694408/1461548608699764901}}{{dc:1285810788199694408/1461549822673813514}}"], "clips": []}, {"title": "コンボの基本型と始動技の選び方", "body": ["@ryusei 2026年1月の動画では、SA2からのガード不能連携は小技始動からも入るとされる。字幕では、小技からのダメージは2700ぐらいで十分とされ、補正がかかる小技始動でもダメージを稼げる。中攻撃始動は、ガード不能にならないルートがあるので、引き中Pのルートを選ぶ。{{hXb9uM0bOco@357}}{{hXb9uM0bOco@493}}{{hXb9uM0bOco@580}}", "@jpdc 2024年9月の投稿では、アップデートで立中Kがヒット+1から+3になり、立中Kキャンセルラッシュ立大Kがつながるようになった。この調整で中K>ラヴーシュカ>中足もつながるようになり、2中Pカウンターや2中P確定場面で2中P>中K>SA2コンボができるようになったという。{{dc:1285810788199694408/1287982259663667294}}{{dc:1285810788199694408/1287983105159860356}}{{dc:1285810788199694408/1287985714172133478}}{{dc:1285810788199694408/1287986402272874589}}", "@jpdc 2025年9月の投稿では、モダンで生ラッシュの引き中Pや中Kで触りに行ったヒット時のコンボとして、ラッシュ4中Pは+9、ラッシュ中Kは+7を作れるので、間に合う攻撃ならヒット確認からコンボできるという答えがあった。手軽なのはラッシュ4中P→4中Pタゲコンで、ラヴーシュカがあればタゲコンから発動してよい。ラッシュ中Kの+7はモダンでは旨みが薄いという。{{dc:1285864637199286312/1416106698896314539}}{{dc:1285864637199286312/1416119772474511380}}", "@jpdc 2025年9月の投稿では、SA2コンボを1つも覚えていない人に、まず大TC→SA2→2弱P→中足連打が、ヒットでもガードでも使えて簡単という答えがあった。別の答えでは、ジラント（強K・強P）→SA2→2中K→強K・強P→強ヴィーハト→強K・強P＋弱トリグラフ→強ストリボーグから、中央なら中トルバラン→強トリグラフ、端なら前歩き→強P→トリグラフに繋ぐ形が示された。{{dc:1285864637199286312/1418442278275645482}}{{dc:1285864637199286312/1418445481889234974}}{{dc:1285864637199286312/1418768747832803398}}", "@jpdc 2025年11月の投稿では、SA2からインパクトを2回入れられるルートを知りたいという質問に、アップデートでできなくなった、調整されたという答えが2件あった。質問者はトレモで探していた時間が無駄になったという。{{dc:1285810788199694408/1444256594182541364}}{{dc:1285810788199694408/1444256750642532352}}{{dc:1285810788199694408/1444256815620554793}}{{dc:1285810788199694408/1444266757454823485}}", "@jpdc 2026年2月〜2026年3月の投稿では、インパクト壁バウンド後のコンボとして、しゃがみ中P、遅らせ前大K、中ストリボーグ、大P、設置かトリグラフ、OD設置が挙がった。SA3があるときはトリグラフ後に弱ストリボーグからSA3がつながり、ゲージに余裕があれば立ち大Pの後にODトルバラン、トリグラフもいけるという。また壁バウンド後の最終ラウンドでは、棘、OD設置から投げ択に行くか、設置をガードさせてSA2に行くという案があった。{{dc:1285810788199694408/1476213926328012955}}{{dc:1285810788199694408/1476215491327557743}}{{dc:1285810788199694408/1476269729407832123}}{{dc:1285810788199694408/1480925018396426432}}", "@jpdc 2026年4月の投稿では、クラシックでJPを始めた人に、2中P＞CR＞2強P＞強ストリボーグ＞中トルバラン＞強トリグラフ（＞ザプリェット）が基本の高火力コンボ、グロームストレルカ（TC）＞ODストリボーグ＞強トリグラフも取りやすい始動で良い、と紹介された。ジラント＞ラヴーシュカ＞2中K＞強K＞2強P＞強ヴィーハト＞強P＞インパクト＞強トリグラフは、状況の縛りがほぼなく削りも強いという。{{dc:1285800688097562715/1492479131085045760}}{{dc:1285800688097562715/1492485285110480937}}", "@jpdc 2026年5月の投稿では、画面端で大Kタゲコンでなく大K→2中Pにする理由として、ダメージが高いからという答えがあった。大KTCの2発目は500、屈中Pは600だが、有利フレームは大Kタゲコンのほうが多く、SA2に行くときは大KタゲコンSA2で+11、屈中P SA2で+6（どちらも「確か」）という。{{dc:1285864637199286312/1503646050416726108}}{{dc:1285864637199286312/1503646509164531764}}{{dc:1285864637199286312/1503647256958472272}}", "@jpdc 2026年6月の投稿では、画面端で大Kタゲコン→ラヴーシュカ→大Kタゲコン→通常設置のあとに、大Pインパクトと大Kタゲコン→トリグラフのどちらがよいかは、相手と自分のDゲージを見て判断するという答えがあった。ラヴーシュカ中の大Kタゲコンと大K→2大Pの違いはダメージで、補正が重いので大差はないが2大Pのほうが高いという。{{dc:1285864637199286312/1519197513050230875}}{{dc:1285864637199286312/1519197811428556850}}{{dc:1285864637199286312/1519214186364796958}}", "@jpdc 2026年10月の投稿では、コンボに引き中Pタゲコンを入れる利点として、小技からラッシュで伸ばすとき、ゲージ溜めでコマ投げに行くまでの体力調整、SA2につなぎやすいこと、立ち中KSAなどのコマンドが苦手な人でもタゲコンでコマンドを作る準備がしやすいことが挙がった。小技からCRでSA2に行くなら中TCルートのほうが高いこともあり(Dゲージ3本以下と仮定)、その状況以外では基本火力が低いのでゲージ貯め以外には使わないほうがよいという。{{dc:1285810788199694408/1558715822665498635}}{{dc:1285810788199694408/1558716478667235369}}{{dc:1285810788199694408/1558717366102265960}}{{dc:1285810788199694408/1558717676854181919}}{{dc:1285810788199694408/1558719620150726707}}{{dc:1285810788199694408/1558721168230326415}}", "@jpdc 2026年10月の投稿では、コパ→ラッシュ→コパの後に立ち中Kがよいとされる理由が話題になり、強Kにいける、しゃがみ中PだとSA2発動後に中足が確定しないという答えがあった。質問者は、CRしゃがみ大→強ストリボーグなら2中Pでも変わらないが2中Pラッシュだと大Kがつながらないのかと確認していた。単発の硬直差は2中Pが良くても中Kは後隙が長くキャンセルすれば中Kのほうが有利が大きく、大Pもヒットで+3だがラッシュ大Pから大ストリボーグがつながるという説明もあった。{{dc:1285810788199694408/1558731560486707241}}{{dc:1285810788199694408/1558735963252068433}}{{dc:1285810788199694408/1558736304814952449}}{{dc:1285810788199694408/1558736325241475093}}{{dc:1285810788199694408/1558741995416195154}}"], "clips": [{"ch": "jpdc", "c": "1285864546984005693", "m": "1424627331649245184", "a": "緋月", "d": "20251006", "x": "全ゲージ使用のラヴーシュカ画面端コンボ、1個目よりも2個目の方がダメージが「69」のみ高かったです 誤差程度ですし既出かもしれませんが…"}, {"ch": "jpdc", "c": "1285864546984005693", "m": "1462804006735712370", "a": "KAZUNE", "d": "20260119", "x": "ODストリボーグ初段キャンセルSA2から入れ替え、詐欺飛び、F式 既出でしたらすみません"}, {"ch": "jpdc", "c": "1285810788199694408", "m": "1558719620150726707", "a": "オフトンスキーpc", "d": "20261011", "x": "実は小技からCRでSA2に行くときなら中TCルートのほうが高かったりします。（Dゲージ3本以下と仮定）"}]}, {"title": "ドライブゲージはラッシュよりOD技に使う", "body": ["@ryusei 2026年1月の動画では、SA2の効果が切れたあとにコンボでドライブゲージを回収できる点を、この連携の優秀なところに挙げている。{{hXb9uM0bOco@654}}"], "clips": []}, {"title": "運び、設置後、トリグラフ後のコンボ", "body": ["@jpdc 2024年9月の投稿では、画面端のSA2最大コンボとして、大K大P→SA2→しゃがみ大P→大K→大P→OD設置→大P→弱トルバラン→前ステ→OD設置→大P→強トルバラン→弱ストリボーグ→ラッシュしゃがみ大P→キャンセルしゃがみ大P→トリグラフ→3大Pで4184が紹介された。{{dc:1285864546984005693/1286152060043268159}}", "@jpdc 2024年9月の投稿では、立ち大POD弾からSA2を発動して弾が当たっていた時のレシピについて、セットプレイ紹介のところにODトルバラン→SA2ヒット時のコンボ（セットプレイ）が紹介されている、という案内があった。同じ状況で屈中K連打が地上ヒットになるか空中に浮くかの違いは、中央だと地上くらい、端だと空中くらいになるという。{{dc:1285810788199694408/1288463702206451743}}{{dc:1285810788199694408/1288684403983253557}}{{dc:1285810788199694408/1288763506459414588}}", "@jpdc 2024年9月の投稿では、新たに追加された立中Kラヴーシュカからの運びコンの始動として、ラッシュ屈中P、屈中Pカウンター確認、確反の屈弱Pのほかに、カウンター確認できるならラッシュ2中Kカウンター・ラッシュ6中Kカウンター、強Kカウンターからもつながる、という指摘があった。ラヴーシュカに行きたい時はタゲコンまで入れ込むことが多いという。{{dc:1285810788199694408/1289032959227203667}}{{dc:1285810788199694408/1289042870564556842}}{{dc:1285810788199694408/1289106496453349428}}", "@jpdc 2024年10月の投稿では、画面端の大Pパニカンから1ゲージ回収するルートと、フルゲージを使ってSA2にもできるルートが紹介された。後者は最速入力でよく簡単めだが、最初の弱ストリボーグを中ストリボーグにできればもっと高くなるものの、ODトリグラフまで入れるのが難しいため妥協したという。{{dc:1285864546984005693/1292858520282337290}}{{dc:1285864546984005693/1293164738187886623}}", "@jpdc 2024年10月の投稿では、中央から大スト→ODトリグラフ→cSA2に繋ぐレシピとして、中攻撃など→CRしゃがみ大P→大スト→中トルバラン→ODトリグラフ→cSA2→強ヴィーハト→前ジャンプ→前ステ→中スト→中ストで3948という例が示された。{{dc:1285864637199286312/1294927276051398696}}{{dc:1285864637199286312/1294945634687778888}}", "@jpdc 2025年1月の投稿では、SA2をガードさせて発動したコンボの途中でヒットした時に何で拾うかを聞く質問に、SA2の最後の弾が当たると同時くらいに大ストリボーグでよい、ガード不能の場合などは事前にトレモで何が入るか決めておくとよい、という答えがあった。{{dc:1285810788199694408/1331850795913580625}}{{dc:1285810788199694408/1331860988617687081}}", "@jpdc 2025年2月の投稿では、SA2のコンボで画面端から運ぶより入れ替えの方が簡単では、という疑問に、画面端なら入れ替えた方が相手もJPも端に近くなり状況がよくなる、中央付近なら運びコンボが有効、という答えがあった。端から端への運びには意味がないという認識で一致した。{{dc:1285810788199694408/1342091395757772800}}{{dc:1285810788199694408/1343107966035038323}}{{dc:1285810788199694408/1343297405616914464}}", "@jpdc 2025年3月の投稿では、中央で大P→ODトルバランヒット時にSA2へ運ぶルートを問われ、中央ならトルバラン発動最速の中足で地上やられになるので普段のコンボ、端なら弱ストで最大を取るかF式に行くという答えがあった。中央のインパクトコンボは、ジラントSA2屈中P強設置5強Pインパクト強スト中弾強「棘」などで、より運ぶなら強ストからラッシュして起き攻めだという。{{dc:1285810788199694408/1351247184099545179}}{{dc:1285810788199694408/1351442573620674591}}", "@jpdc 2025年3月の投稿では、画面端に自分が追い込まれている状況で、大P先端ODトルバランSA2がヒットしたときのコンボを問われ、前ステ中スト前ステ中設置バクステ前ステから、中段か下段の弾で入れ替えて2択を迫れるという答えがあった。ただし、もっといいフレーム消費があったはずなので後で確認するとも言われた。{{dc:1285810788199694408/1351444695481319515}}{{dc:1285810788199694408/1351445710536704020}}{{dc:1285810788199694408/1351445794984820748}}", "@jpdc 2025年4月の投稿では、画面中央でODトルバランからSA2の連続ガード連携で、通常技の崩しがヒットした場合に設置してコンボへ行けないという悩みが出た。答えとして、なんか>ODトルバランSA2>前ステ>中スト>立ち中K（スカ）>大設置>「ふがし」>ワープ>ジャンプ大K（詐欺飛び）という難しめの形と、距離限定でODトルバランSA2>中足>いつものコンボが挙がった。{{dc:1285810788199694408/1356536648011218944}}{{dc:1285810788199694408/1356806554380275773}}", "@jpdc 2025年6月の投稿では、設置を前大Kで拾ったときにOD弾かOD「棘」からSA2に繋ぐ質問に、OD「棘」→キャンセルSA2→強設置→前ジャンプ→前ステ→中スト→中ストという「いつものレシピ」は入らないのかという確認があり、入るという答えがあった。別の答えでは、OD弾→OD「棘」→SA2でそのレシピに行け、弾を経由せずにSA2へ行くルートは知らないという。{{dc:1285864637199286312/1378860923497746552}}{{dc:1285864637199286312/1378943061119336618}}{{dc:1285864637199286312/1378946272672874547}}{{dc:1285864637199286312/1379226587442053200}}", "@jpdc 2025年8月の投稿では、SA2後にインパクト起爆から大ストリボーグへ繋ぐコンボとして、大タゲコン→SA2→中K→大設置→大P→インパクト→大ボーグが挙がった。インパクトを混ぜてもコンボカウントはあまり回らないので、探せば面白いコンボが出そうという。{{dc:1285864637199286312/1406564322553102377}}{{dc:1285864637199286312/1406566466467139635}}{{dc:1285864637199286312/1406695091837603960}}", "@jpdc 2025年8月の投稿では、SA1締めと比べて60ダメージ落ちるが、設置済みで密着3F有利になるSA2締めのコンボが紹介された。コンボ補正が重くなるほどSA2締めが有利になり、同じルートで最大を狙うとSA2締めが4935、SA1締めが4547だった。ただSAゲージ1本で300〜400しか変わらず、ゲージ効率ではあまり使わないかもしれないという。{{dc:1285864546984005693/1409506283572428921}}{{dc:1285864546984005693/1409510430023618570}}", "@jpdc 2025年8月の投稿では、中央でSA2がヒットしたときの運びコンボとして、SA2→立ち中K→前ステ→強Pキャンセル弱設置→前ステ→強Pキャンセル中トルバラン→設置ヒット→前ステ→6強Kキャンセル強ストが基本とされた。ただ6強Kが2ヒットして失敗することがあり、強K強Pタゲコンを使う後ろ2つのルートを使う人もいる。運び距離が長いのは生ラッシュ6強Kキャンセル強ストのルートという。{{dc:1285864637199286312/1410568339377491988}}{{dc:1285864637199286312/1410578144624250943}}{{dc:1285864637199286312/1410588941408538684}}", "@jpdc 2025年8月の投稿では、SA2発動のあと中足でなく立中Kにする利点が問われ、最速で繋ぐと中足では繋がらないコンボがあるから、という答えがあった。端背負いで中足から前ステ2回のルートだとSA2が確定でなくなるという説も出たが、端限定ではなく、ダメージも中足のほうが高かったと訂正された。{{dc:1285864637199286312/1410576952154390578}}{{dc:1285864637199286312/1410577638166102118}}{{dc:1285864637199286312/1410581475572842627}}{{dc:1285864637199286312/1410581790267277372}}{{dc:1285864637199286312/1410584070068502548}}", "@jpdc 2025年10月の投稿では、画面端を背負って大K始動のSA2を当てたときの入れ替え設置コンボを聞かれ（のちに自分がバーンアウトしている状況と補足された）、中足を当てたあと前ジャンプで入れ替えてヴィーハト強設置から大Pインパクト、または大Kタゲコントリグラフから強ストリボーグという案が出た。簡単でよく使うといい、入れ替えストリボーグの形で入れ替えができたという。{{dc:1285810788199694408/1426830691013754942}}{{dc:1285810788199694408/1426841491174592572}}{{dc:1285810788199694408/1426841868045516920}}{{dc:1285810788199694408/1426849709598707792}}", "@jpdc 2026年1月の投稿では、画面端のSA2コンボとして、SA2、中足、大K、下大P、設置、大K大Pタゲコン、トリグラフ、強ストリボーグが挙がった。これに対し、画面端ならトリグラフのあと前大Kが入るので、そこから中スト、大P、設置かトリグラフもおすすめという答えがあった。{{dc:1285810788199694408/1464323198777692290}}{{dc:1285810788199694408/1464323323084279851}}{{dc:1285810788199694408/1464323746109325323}}", "@jpdc 2026年1月の投稿では、端で設置を起爆したあと前大K、中弾、大Pとつなぐコンボについて、端から少し離れたところで前大Kを高めに当てると中弾から大Pが当たるという答えがあった。よく使う形として、大K（タゲコンか屈中P）、手動起爆、前大K、中弾、大Pが挙がり、ラヴーシュカの締めや端で大P設置のあとにも使うという。{{dc:1285810788199694408/1466404610376859846}}{{dc:1285810788199694408/1466436831368183994}}{{dc:1285810788199694408/1466437019436585000}}", "@jpdc 2026年4月の投稿では、SA2発動前にODトルバランを挟むと各ルート300くらいダメージが上がるという紹介のコンボを、立ち中Kを使う運びコンボに適用できるかという質問に、確かフレームの関係で立ち中KだとODトルバランの2発目で相手が浮いてしまうので、立ち中Kをしゃがみ中Kに変えるとうまくいく、という答えがあった。質問者はまだ完走できていないが、しゃがみ中Kでつながりそうな雰囲気になったと返した。{{dc:1285810788199694408/1489815040990380072}}{{dc:1285810788199694408/1489818623814926407}}{{dc:1285810788199694408/1489822663143854100}}", "@jpdc 2026年6月の投稿では、中央から運びながらインパクトを当てるSA2ルートとして、ジラント→ラヴーシュカ→2中K→ジラント→キャンセル強ヴィーハト→強P→キャンセルインパクト→自動起爆ヒット→強トリグラフが挙がった。運びというより相手だけを飛ばす簡単ルートで、ジラントより大K・しゃがみ大Pのほうが少し減るが、通常技埋めは安定しにくいという。{{dc:1285864637199286312/1521110916844748991}}{{dc:1285864637199286312/1521112770118942800}}{{dc:1285864637199286312/1521113646502117408}}{{dc:1285864637199286312/1521114814804525107}}", "@jpdc 2026年6月の投稿では、中央から運びつつインパクトを当てるSA2ルートとして、ジラントSA2→立ち中K→前ステ→2大P→キャンセル中設置→前ステ→2大P→キャンセルインパクト→前大K→中設置が挙がった。前ステでラインが上がり、最後の中設置の後はラッシュ中足などが埋まって設置起き攻めになる。インパクトを抜けば最大限運ぶルートと途中まで同じで、使い分けられるという。{{dc:1285864637199286312/1521110916844748991}}{{dc:1285864637199286312/1521317993080946869}}", "@jpdc 2026年7月の投稿では、ラヴーシュカ（SA2）の連携を実戦で何種類に絞るかという質問に、ミスしてアドリブが必要にならなければ基本3つ、たくさん覚えると頭がこんがらがる、という答えがあった。当たったとき用は中央インパクト、中央運インパクト、中央ODトゲ後、入れ替えインパクト、入れ替えF式、端空中拾い（F式）の6個で、ガード時は連ガを2個ほど覚えれば十分という。{{dc:1285810788199694408/1527210352117415947}}{{dc:1285810788199694408/1527211218580934708}}{{dc:1285810788199694408/1527213566430810182}}", "@jpdc 2026年7月の投稿では、ラヴーシュカの連携を10種類ほど（インパクトルート、運びルート、リーサル用のOD棘発動、端のインパクトF式など）使い分けるという答えがあった。最初は3種類だけで、やりたいことを増やして手札を増やした。ガード発動は中央連ガ、端連ガ、OD弾発動の連ガだけで9割の人は崩れる、投げの補正切りが強いのでおすすめという。{{dc:1285810788199694408/1527262355556270160}}{{dc:1285810788199694408/1527280897039269960}}{{dc:1285810788199694408/1527280958892675193}}", "@jpdc 2026年7月の投稿では、強P→OD弾→SA2のガード発動ルートで、前J強Pから前J弱Kで崩した後、設置を絡める猶予がないときの〆の質問があった。質問者は強P強ボーグ弾棘〆（SA2のおかげで繋がり約2970ダメージ）で丸いかと尋ね、普通に大ボーグで拾うのが丸い、という答えがあった。{{dc:1285810788199694408/1528349286751014932}}{{dc:1285810788199694408/1528628614856445954}}", "@jpdc 2026年11月の投稿では、SA2の運びコンボとして、SA2発動→2中K→前ステ→5大P弱設置→前ステ→5大P→中弾→前ステ→6大Kの2段目のみ→大ボーグ→前ステ→5大Pで半分ほど運べるという例が出た。5中K→前ステ→2大Pキャンセル中設置→前ステ→大Kタゲコン→前ジャンプ→J中K→ラッシュ大P強ボーグも簡単で割と運ぶという。{{dc:1285864637199286312/1573893344378228899}}{{dc:1285864637199286312/1573894590446960741}}{{dc:1285864637199286312/1573894624395792405}}{{dc:1285864637199286312/1573940741481435217}}", "@oukoku 2025年5月の投稿では、画面端でパニカンした時にOD設置で位置を入れ替えるコンボとして、立ち強P→OD設置→立ち中K→起爆→前ステ→6強K→中ストリボーグ→立ち強P、が紹介された。SA2を使わないルートで、ほかのルートも動画で紹介されているという。{{dc:1373507879407063101/1373507879407063101}}{{dc:1373507879407063101/1373516204974542989}}", "@oukoku 2024年2月の投稿では、4中P→中P→ラヴーシュカ→強K→強P→強ヴィーハトを壁際で入れると強ヴィーハトが画面外設置になってつながらないという質問に、JP側が画面端を背負っているときは画面外に設置されるので、設置後にジラントや各種必殺技で吹っ飛ばせば手前に落ちる、という答えがあった。端での強設置後すぐ起爆するとつながらないのは仕様のようで、中設置にすれば手前に落ちて拾えるという。{{dc:1200611284408881324/1210129391968063490}}{{dc:1200611284408881324/1210326697786867762}}{{dc:1200611284408881324/1210443553927340062}}{{dc:1200611284408881324/1210528784441151528}}"], "clips": []}, {"title": "リーサルとバーンアウトでは簡単で確実なルートを選ぶ", "body": ["2026年7月の配信では、さっさとSA3まで行っていればリーサルだったのに、SA2へ行って無駄な悩みが発生したと振り返っている。別の試合では、甘いアブニマーチを出したのは勝ち急ぎで、普通にコンボして設置するのがよかった。2026年5月の配信でJPのリーサル問題を試した結果は、補正が切れていてSAゲージが絶妙に届かず、ギリギリ無理だった。{{DHwYs05qqek@7709}} {{an09SU2JA3A@9383}} {{iH2etZNc6zg@7923}}", "@ryusei 2026年8月の動画では、バーンアウト中にヒットしたとき、ゲージの状況を見てルートを選ぶ話が出た。ラヴーシュカで相手のドライブが1本ほどで割れるなら、そちらへ行っていいという。{{6fIBrUEaMyQ@297}}{{6fIBrUEaMyQ@313}}{{6fIBrUEaMyQ@342}}", "@ryusei 2026年9月の動画では、浮かせた後にSA1・SA2・SA3を選べるルートがあり、リーサルの判断を後半まで引っ張れると話された。考える時間が伸びて、リーサルミスが減るとされた。{{Lc1NGGRQTGw@317}}{{Lc1NGGRQTGw@332}}", "@ryusei 2026年1月の動画では、SA2からのガード不能連携を、リーサルに届かないときの手札として挙げている。大Pなどからは普通にフルコンボのほうが減る場面もあるが、相手がバーンアウト中で、小技や中攻撃から入る場面ならやる価値があるという。{{hXb9uM0bOco@344}}{{hXb9uM0bOco@640}}", "@ryusei 2026年10月の動画では、画面端でバーンアウトさせ、SA2が溜まる場面なら、ラヴーシュカを持っておくのはほぼ勝ちだと話された。{{uubdHE64DtM@1032}}{{uubdHE64DtM@1048}}", "@nandene 2025年9月の動画では、SA2をガードさせた時点で相手のドライブゲージが2本以下なら、連ガ連携でバーンアウトを確定させられると話している。相手がバーンアウトしているときも、SA2は崩しとして強い。{{aI6OgnkAk9o@67}} {{aI6OgnkAk9o@221}}", "@jpdc 2024年11月の投稿では、ゲージの縛りなしで小P始動のリーサルコンボを聞く質問に、小P3回→キャンセルラッシュ立ち小P→しゃがみ中P→ODストリボーグ→SA1が2095、SA2から大設置→前ステ前飛び→弱ストリボーグ→中ストリボーグが2729、しゃがみ中P→しゃがみ大P→大ストリボーグ→中大トルバラン→トリグラフ→SA3が3861、という答えがあった。{{dc:1285810788199694408/1304970837174255616}}{{dc:1285810788199694408/1304972155896856576}}{{dc:1285810788199694408/1304974970778288260}}", "@jpdc 2025年4月の投稿では、ドライブゲージを4本以上残したままリーサルを取ってしまったときに、あえて伸ばす例として、舞のSA2ガード後に2強P>強ストリボーグ>前ステ>ラッシュ6強K>CR強P>強P>CR2強P>「棘」>SA3で6147になる形が紹介された。伸ばす必要のない場面でもあり、咄嗟に伸ばせるよう練習するという。{{dc:1285810788199694408/1363101079067295847}}{{dc:1285810788199694408/1363111916423352551}}{{dc:1285810788199694408/1363315932625375374}}", "@jpdc 2025年8月の投稿では、画面端のリーサルでSA2締めが少ない理由に、SA2で締めるとダメージが安定せず場合によってSA1より下がる、手慣れたコンボで確実に締めるほうがよい、という答えがあった。コンボ補正が重い状態ではSA2のほうが優位になり、大PからSA2なら弱スト→設置→中スト→「棘」→「棘」→弱ストがメジャーだという。{{dc:1285864637199286312/1409160528273739827}}{{dc:1285864637199286312/1409187687222480959}}{{dc:1285864637199286312/1409191464868646973}}{{dc:1285864637199286312/1409196340361170996}}", "@jpdc 2025年8月の投稿では、大Pパニカンの簡易コンボは、密着だったり離れすぎていたりすると繋がらず、端を背負った位置から画面中央くらいまでならリーサルを狙える。ルートを少し変えればSA1だけやSA3締めもできるという。トリグラフ締め→OD設置→立K→弱ストヒットからは、SA2で倒しきれる場合と、セットプレイに行く場合の2通りが紹介された。{{dc:1285864546984005693/1410199115853463614}}{{dc:1285864546984005693/1410203450700075150}}", "@jpdc 2026年1月の投稿では、強ストリボーグ→前ステ→生ラッシュ前大KからSA2に繋ぐルートとして、強スト→前ステ→生ラッシュ強P→CR強K→強P→キャンセルSA2→弱スト→設置→中スト→トリグラフ→トリグラフ→弱ストが示された。CR強Pの時点で画面端に着いている距離に限るという。{{dc:1285864637199286312/1462490710870720597}}{{dc:1285864637199286312/1462658190263980198}}", "@jpdc 2026年1月〜2026年2月の投稿では、ラヴーシュカを使えない人に、簡単で安定するコンボとして、ジラント＞ラヴーシュカ＞中足＞ジラント＞強ヴィーハト＞強P＞インパクト＞ヴィーハトの自動起爆がヒット＞強トリグラフ（全て最速）が紹介された。3000後半のダメージで、発動中にDゲージが回復し、相手のDゲージも2本弱削れる。教わった人は友人とカスタム戦を60戦ほどやって、やっと1回リーサルで使えたという。{{dc:1285800688097562715/1466397905093918887}}{{dc:1285800688097562715/1467892801206227151}}", "@jpdc 2026年3月の投稿では、OD棘→SA2からの最大ダメージ（質問の条件は「SAゲージなし、バーンアウト時」）の質問に、地上と空中でコンボが変わるかもしれないが知っているものとして、大P▶OD棘▶SA2▶中スト▶設置▶中スト×3という答えがあった。{{dc:1285810788199694408/1486424305641324674}}{{dc:1285810788199694408/1486514902964109504}}", "@jpdc 2026年5月の投稿では、SA2発動からのコンボで中足→大K→2大P→設置より減るルートとして、引き中PTCや屈強PからのSA2で、大K→中K→強設置→大K→屈強P→強弾→前大K→大ストが挙がった。{{dc:1285864637199286312/1503610769701474444}}{{dc:1285864637199286312/1503613559056236645}}", "@jpdc 2026年7月の投稿では、同じ画面端の状況で、SA2を使うルートとして、ジラント→SA2→大K→しゃがみ大→設置→大K大P→弱弾→しゃがみ弱PのF消費→前大K→棘→通常設置が挙がった。ジラントキャンセルSA2から中足・大K・2大Pキャンセル設置・弱トリグラフ・ODトルバランまで伸ばす案や、SA2でDゲージを回復しながら起き攻めする案もあった。{{dc:1285810788199694408/1524210625197248623}}{{dc:1285810788199694408/1524211360437637390}}{{dc:1285810788199694408/1524213563860979912}}", "@jpdc 2026年7月の投稿では、SA2締めのコンボを高くする方法として、CRで前大Kを3回当て、SA2コンボの中ボーグ2回をトリグラフ2回に変えると4924で、70ほどダメージが上がるという答えがあった。{{dc:1285864637199286312/1525903084750897363}}{{dc:1285864637199286312/1526064846401961985}}"], "clips": [{"ch": "jpdc", "c": "1285864546984005693", "m": "1410203450700075150", "a": "あめーば", "d": "20250827", "x": "トリグラフ〆→OD設置→立K→弱ストヒット時のセットプレイでSA2で倒しきれそうな場合のコンボと倒しきれなさそうな場合以前ゼンさんが紹介されていたセットプレイに…"}, {"ch": "jpdc", "c": "1285864637199286312", "m": "1525772719973466162", "a": "たにつー", "d": "20260712", "x": "jpのSA2〆のコンボってこれより高くできたりしますかね？"}, {"ch": "jpdc", "c": "1285864637199286312", "m": "1525903084750897363", "a": "ちこね", "d": "20260713", "x": "CRで前大k3回して、SA2コンボを中ボーグ2回から→トリグラフ2回へ変更すると、4924で70ぐらいダメージ上がります！ (編集済) 2026年7月13日月曜…"}]}, {"title": "アムネジア、対空、昇龍ガード後のコンボ", "body": ["@ryusei 2025年11月の動画では、昇龍をガードしたあとにインパクトを入れ、OD設置につなぐ連携が試された。無敵技をガードしたあとのインパクトは、JPではラヴーシュカが付くので価値が高いと話している。{{tsEEb9-973g@16}}{{tsEEb9-973g@438}}", "@nandene 2025年8月の動画では、画面端で相手の通常技をガードしているときにSA2がたまっていれば、巻き込み引き中Pの出し切りから入れ替えコンボを狙えると話す。{{hgk0BqRRCo0@125}}", "@jpdc 2025年3月の投稿では、フルリソースで相手の投げをアムネジアで取ると、豪鬼のHP46％から倒せる（4140ちょうど）というコンボが紹介された。SA2からSA1を割と簡単なコンボで繋げて4140ダメージを出せる、とも書かれている。{{dc:1285864546984005693/1351508927283466300}}{{dc:1285864546984005693/1351509078119153728}}", "@jpdc 2025年3月の投稿では、SA2を発動してドライブリバーサルをガードしたときのコンボとして、2弱Pキャンセル強設置から、強Pインパクトか、強「KTC」強ストリボーグが紹介された。{{dc:1285810788199694408/1352168680485683212}}{{dc:1285810788199694408/1352345472370479134}}", "@jpdc 2025年4月の投稿では、コマ投げをアムネジアで取った後のSA3以外のリーサル（2ラウンド72秒）は、前大K→前ステ×2→前大K→中ストリボーグ→大P→SA2→弱ストリボーグ→設置→中ストリボーグ×2→「棘」で3090のリーサル、SA1→SA1でも3080のリーサルになる。{{dc:1292666373314707456/1363063302657409054}}{{dc:1292666373314707456/1363067037886447736}}", "@jpdc 2025年5月の投稿では、大P ODトルバラン SA2がヒットしたあと、中足が届けば中足で地上喰らい判定にしていつものコンボに行けるという答えがあった。別の答えでは、前ステ→中スト→前ステ→中設置→垂直ジャンプ攻撃でフレーム消費→前中Kで両受身に対応でき、最大はSA2→垂直ジャンプ攻撃→強設置→前ステ→立ち中Kなどという。{{dc:1285864637199286312/1373956174772441128}}{{dc:1285864637199286312/1373964034470056027}}{{dc:1285864637199286312/1373983606439018627}}{{dc:1285864637199286312/1373984201417687193}}", "@jpdc 2025年6月の投稿では、画面端で設置+15のときにリュウにOD昇竜を打たれた場合のコンボが挙がった。屈大P→大スト→立大Pは生の大スト始動が安定、ダメージ重視はラッシュ強K→強K→2中P→ODボーグ→ラッシュ6強K→中ボーグ→強P、咄嗟なら強K→6強K→中ボーグ→強P。相手ゲージ3本以下ならラヴーシュカからインパクトコンボでBOを狙うという。{{dc:1285864637199286312/1381001023308435517}}{{dc:1285864637199286312/1381066684848275518}}{{dc:1285864637199286312/1381096727343399072}}{{dc:1285864637199286312/1381158156331126814}}", "@jpdc 2025年8月の投稿では、画面端でルークのOD昇竜をガードした後の最大として、5大P→弱強設置→5中K→中スト→微歩きOD設置→5大P→中バラン→ODグラフ→SA3で6180という例が出た。ゲージを使いすぎではという疑問に、ラッシュ前大Kから入ってSA2からF式に行く案が答えられた。{{dc:1285864637199286312/1411385667950477465}}{{dc:1285864637199286312/1411388363524542606}}", "@jpdc 2025年10月の投稿では、インパクトを通常アムネジアで取った後（3ラウンド目終盤）のリーサルは、2強PからSA2、アムネジアを地上ヒットさせてOD「棘」「棘」で〆る形があった。別の形は2大P→SA2→立中K→前ジャンプ→2大P→設置→ジラント→弱トルバラン…で、最後に弱ストリボーグも入るはず。{{dc:1292666373314707456/1428170885100998746}}{{dc:1292666373314707456/1428171897929072752}}{{dc:1292666373314707456/1428273875782864907}}", "@jpdc 2025年12月の投稿では、アムネジア後（1ラウンド目43秒）でSAを使ってよい場合は、投げが再持続のとき以外はリバーサルのSA1でリーサルになり、追撃でもう一度SA1が入る。SA2なら立ち中K→SA2→しゃがみ中K→立ち大K→しゃがみ大Kでリーサル。{{dc:1292666373314707456/1455522129016520817}}{{dc:1292666373314707456/1455528223155814483}}{{dc:1292666373314707456/1455833644987056128}}", "@jpdc 2026年5月の投稿では、画面端の投げをアムネジアで取ったあとのSA2を使った入れ替えコンボとして、立中K→SA2→屈大P→屈小P→屈大P→強設置→大タゲコン→弱トリグラフ→前ステ→前大K→中ボーグ→大P→設置（ダメージ重視）などが示された。弱設置→前ジャンプで安定させる形もあり、インパクトルートは状況があまりよくないという。{{dc:1285864637199286312/1504349182926786591}}{{dc:1285864637199286312/1504381232614735982}}", "@jpdc 2026年6月の投稿では、ラッシュ大P→OD弾SA2がうっかりヒットしたときのお気に入りの初見殺しとして、OD弾SA2ヒット→前ステ→中ボーグ→前ステ→中設置→垂直ジャンプ中K（フレーム消費）→着地後前中Kが紹介された。前中Kが当たると設置が自動起爆してヒットし、大ボーグまで入る。ランクマではヒット率が良いという。{{dc:1285864637199286312/1516459050278326574}}{{dc:1285864637199286312/1516652960614977667}}", "@jpdc 2026年6月の投稿では、ラッシュ大P→OD弾SA2がヒットしたときのノーゲージのコンボとして、大P→OD弾→SA2→垂直J中K→大設置→前ステ→立ち中K→中弾→「棘」→「棘」が挙がった。距離限定のようで難しいという。{{dc:1285864637199286312/1516459050278326574}}{{dc:1285864637199286312/1516740180772520086}}"], "clips": []}, {"title": "コンボの精度を上げる", "body": ["@jpdc 2024年9月の投稿では、JPのコンボカウント値を調べた表が出た。始動値・上限値・加算値があり、上限値で参照するのは、その技の加算前の値になる。ヴィーハトが0でラヴーシュカが1とみられ、ラヴーシュカは各段が当たるごとに+1される。ラヴーシュカコンボ中にトリグラフを連打すると当たらなくなるのは、この値のためだという。{{dc:1286267508164399157/1289579999585898546}}{{dc:1286267508164399157/1289597763851390986}}{{dc:1286267508164399157/1289600229234184296}}{{dc:1286267508164399157/1289605378148929656}}{{dc:1286267508164399157/1289605785210454129}}", "@jpdc 2024年10月の投稿では、大量にあるJPのコンボをどう覚えるかという質問に、全部覚える必要はなく、後ろのパーツはほとんど同じものが多い、まず小技始動（>弱ストリボーグ）、中技始動（>中ストリボーグ）、ラッシュから、インパクト壁ドンからの設置、SA2コンボぐらいを覚え、あとは実戦で気になったら調べればよい、という答えがあった。自分のコンボに近くて優秀なものを選んで増やしていく人もいた。{{dc:1285810788199694408/1291368384851873862}}{{dc:1285810788199694408/1291396277455556668}}{{dc:1285810788199694408/1291399480041803819}}{{dc:1285810788199694408/1291451769087463548}}", "@jpdc 2024年10月の投稿では、4中Pタゲコンラヴーシュカでヴィーハトが暴発する時の入力について、真空コマンドの最後の横が入っていないことが多いので最後の横を意識する、失敗した時のキーディスプレイを見て直す、という答えがあった。Pボタンの部分を保険でパリィボタンにしておくと、成功ならラヴーシュカ、ミスならアブニマーチになり、ヴィーハトが出るよりましという。{{dc:1285810788199694408/1294903377905451029}}{{dc:1285810788199694408/1294912633274765403}}{{dc:1285810788199694408/1294946587868401717}}", "@jpdc 2024年10月の投稿では、SA2（ラヴーシュカ）の発動中に中・強トルバランは使えないのか、という質問に、使えない、という答えがあった。{{dc:1285810788199694408/1297933488736964739}}{{dc:1285810788199694408/1297934178511355976}}", "@jpdc 2025年2月の投稿では、JPのSA2はパリィボタンで入力した方がよいのかという質問に、アブニマーチが出てもヴィーハトが出ても動かれたら危険度は誤差なので、言うほど重要ではなく、出しやすいボタンで押せばよい、という答えがあった。{{dc:1285810788199694408/1336654792147210291}}{{dc:1285810788199694408/1336685872522985532}}", "@jpdc 2025年3月〜2025年4月の投稿では、ヴィーハトが画面内にあるときにSA2のコマンドにP2つ押しを使うと、ODトリグラフが出てしまう。設置がないときは普通にOD設置になる。OD技の優先度が一番高くなるためで、ボタン1つ押しならSA2になるが、2つ押しだとODトリグラフが優先されるという。{{dc:1286267508164399157/1356267232329732127}}{{dc:1286267508164399157/1356271771464241213}}{{dc:1286267508164399157/1356281988700700682}}{{dc:1286267508164399157/1356416365342228651}}", "@jpdc 2025年4月の投稿では、ゆっくり214214+P2つと入力すると設置があってもSA2が出るのは、SAコマンドの受付時間より22の受付時間の方が短く、その間くらいのタイミングだと22が成立せずSAが発動するからだという。起爆が出ないのは、コマンドの優先度がOD必殺技、SA、必殺技の順だからだという説明があった。{{dc:1286267508164399157/1356416365342228651}}{{dc:1286267508164399157/1356490987802853418}}", "@jpdc 2025年9月の投稿では、SA2の運びコンボで前ステ前大Kが2ヒットしてしまう原因として、6強K→強ストのルートはコンボのすべてを1Fも隙間なく出さなければならないのでミスしやすい、という答えがあった。{{dc:1285864637199286312/1417884257975795873}}{{dc:1285864637199286312/1417885187567784116}}", "@jpdc 2025年10月の投稿では、加算値（コンボ値）が溜まった状態でのODトルバランからSA2のコンボは、最初のレシピ以上は入らないだろうという答えがあった。ODトルバランの時点でコンボ値が17で、上限値がそれより高い技（弱・中ストリボーグ100、トリグラフ26、ODトリグラフ2段目100、ラヴーシュカ100、ヴィーハト100、3強P20、チェルノボーグ1000）の中で拾う必要があるという。{{dc:1285864637199286312/1425551630589366544}}{{dc:1285864637199286312/1425611998330355854}}", "@jpdc 2025年12月の投稿では、強K強Pのタゲコンから SA2に行くとき、1段目から相手がインパクトを打っていてもコマンドを作ってしまいSA2が出て返せないという質問に、トレモで慣れるしかないという答えがあった。ガードリバーサルでインパクト（ディレイ8Fくらい）と何もしないを設定し、弱Pをガードさせてから強K強Pタゲコンを入れ、インパクトなら返し、何もしなければSA2にする練習が提案された。{{dc:1285810788199694408/1445107189684633681}}{{dc:1285810788199694408/1445323079986319442}}{{dc:1285810788199694408/1445388098673578035}}", "@jpdc 2026年1月の投稿では、SA2発動、中足、前ステ、大Pとつなぐ際に、大Pの直前のSA2の弾が当たらず無敵技を割り込まれたという報告があった。中Kにするとつながった。中足は前に進む分、前ステで相手を大きく押し出してしまうのが原因では、届くなら中Kが安定（ダメージは中足）という答えがあり、質問者は中Kに統一するという。{{dc:1285810788199694408/1457206915321954405}}{{dc:1285810788199694408/1457209727711707259}}{{dc:1285810788199694408/1457210123276783810}}{{dc:1285810788199694408/1457213008995422433}}", "@jpdc 2026年1月の投稿では、OD設置を2回使うSA2前の遅らせが必要なコンボは、成功率が低いとき、2回目のOD設置の後の大Pを微遅らせにするのを意識するとやりやすいという。{{dc:1292666373314707456/1464966437058777110}}{{dc:1292666373314707456/1464967004225142826}}{{dc:1292666373314707456/1464967738358239304}}", "@jpdc 2026年3月の投稿では、大K大Pのタゲコンの途中でSA2のレバーを回していて、相手のインパクトが見えて押してもSAの入力猶予が間に合ってSA2が出てパニカンされるという相談に、大Kがヒットしたかだけ確認してから回す、タゲコンは入れ込みでよく、ヒット確認してから大Pを押すと遅くてつながらない、当たっていればキャンセルラッシュでコンボ、ガードなら黙る、という案が出た。SAの受付は11フレームあるので前入れっぱなしでは防げないという。{{dc:1285810788199694408/1482930739552194734}}{{dc:1285810788199694408/1482936618108063865}}{{dc:1285810788199694408/1482941034588668077}}{{dc:1285810788199694408/1482943693982928947}}{{dc:1285810788199694408/1482944080148168877}}", "@jpdc 2026年4月の投稿では、JPの毎日の基礎練について、壁際最大コンボと大Pパニカン時のコンボをひたすらやる、中足などのヒット確認コンボも欠かさない、苦手なコパパニカン→中K→SA2を繰り返す（SAの高速入力の練習にもなる）、という答えがあった。{{dc:1285810788199694408/1495368182393737266}}{{dc:1285810788199694408/1495709318371082240}}{{dc:1285810788199694408/1495709504900300933}}{{dc:1285810788199694408/1496327163161612459}}", "@jpdc 2026年8月の投稿では、画面端のSA2＞弱P＞屈中足＞昇り弱Kのうち、昇り弱Kだけヒットしたときの練習をトレモでしたいという質問に、「すべてガード」「しゃがみガードのみ」「ガードリバサSA1」の設定でできるはず、という答えがあった。{{dc:1285800688097562715/1542943346425733220}}{{dc:1285800688097562715/1542943735942348823}}{{dc:1285800688097562715/1542948858319867937}}", "@jpdc 2026年11月の投稿では、浮いた相手に立ち大P→SA2をやると設置が出てしまうという相談に、原因はコマンドが遅いか大Pが速いかの2パターンで、他ゲームでコマンドに慣れているなら大Pが速いので遅らせて押すとよいという答えがあった。空中拾い大P→SA2はトレモ設定でタイミングを練習し、空中で当てるストリボーグは単発ヒットになるなど地上と勝手が違う。画面端の大ストリボーグで浮かせたあとは、遅らせ大Pで安定したという。{{dc:1285810788199694408/1567878615499280437}}{{dc:1285810788199694408/1567879287762190417}}{{dc:1285810788199694408/1567880055458111639}}{{dc:1285810788199694408/1567882739775049820}}{{dc:1285810788199694408/1567882920792694836}}", "@jpdc 2026年11月の投稿では、ODトリグラフからSA2に行くルートで中ボーグが2回入らない問題に、弱・中ストリボーグの2段目はコンボ上限値が高めに設定されているのでどんなレシピでも基本は拾え、拾えないのは届いていないか遅いからで、おそらく入力が遅いという答えがあった。{{dc:1285864637199286312/1573739670225952908}}{{dc:1285864637199286312/1573824428972839005}}"], "clips": [{"ch": "jpdc", "c": "1285864637199286312", "m": "1425551630589366544", "a": "ぽてんす", "d": "20251009", "x": "加算値溜まった状態でのODバラン>SA2のコンボを教えて頂きたいです。 動画のコンボから入れれるとなお良い..."}, {"ch": "jpdc", "c": "1285810788199694408", "m": "1457207691448549499", "a": "ふゆのちはる(家居ますよ‼️)", "d": "20260104", "x": "このシーン、「SA2発動＞中足＞前ステ＞大P＞～」で繋げようとしたところ、大Pの直前のSA2弾が当たらなかった？せいで無敵を割り込まれてしまいました。 中足を中…"}]}, {"title": "補正切り・SAゲージ回収とコンボの仕組み", "body": ["@oukoku 2025年8月〜2025年12月の投稿では、弱トルバランは中ストリボーグより少しだけSAゲージの回収が多いという。SA2ゲージからフルゲージを使ったスタンコンボでは、中ストリボーグ2回だとSA3がギリギリたまらないが、1回目を弱トルバランにするとSA3がたまるという。{{dc:1455480556988010637/1455875754922344482}}{{dc:1405470686788452352/1405474510777618443}}"], "clips": [{"ch": "jpdc", "c": "1419546661121822790", "m": "1536069412480884778", "a": "たっつん", "d": "20260810", "x": "ジラント→引中P→SA2からのフルリソースでの補正切り中下です 深夜テンションの産物なので実用性はわかりません 一応合計で６１８６出ております（計算ミスしていた…"}]}, {"title": "SA2（ラヴーシュカ）とドライブリバーサルまわりのコンボ", "body": ["@jpdc 2024年9月の投稿では、「ジラントからSA2（レンガ）を戻してほしい」という声に、端ならいつも通り行け、中央もキャラ限定で行ける上にラッシュ4中Pでできるので困っていない、という答えがあった。中央の強K強P>SA2>2弱P>2中K>前歩き投げで、だいたいパニカン投げが通るという。{{dc:1285800688097562715/1286278785959858219}}{{dc:1285800688097562715/1286279043989241988}}{{dc:1285800688097562715/1286279211891560529}}", "@jpdc 2024年9月の投稿では、SA2を発動して相手のドライブリバーサルをガードした時の最大コンボを聞く質問があった（マリーザ・ディージェイ・春麗・ガイル・ダルシム以外）。小P>弱設置>前ステ>大P>中弾>前ステ>前大K>大ストリボーグ～の運びコンが最大で2500ぐらい、強P>強設置>強K強PTC>弱トリグラフ>強ストリボーグ…は小技始動でないのでそこそこ減るが、SA2が遅くなったため今は小技でないと確定しない、という答えがあった。{{dc:1285810788199694408/1286734032658239509}}{{dc:1285810788199694408/1286740114252365874}}{{dc:1285810788199694408/1287302632905379882}}{{dc:1285810788199694408/1287303496034685062}}", "@jpdc 2024年9月の投稿では、ドライブリバーサルのあとに何もしなければラヴーシュカ初段が当たるキャラとして、ツイートの情報では「DJ、ダルシム、マリーザ、春麗、ガイル」が挙げられた。実際に検証すると、ルーク・マリーザ・DJ・ガイル・春麗・ダルシム・ベガに当たり、リリー・JP・ジュリは距離が遠いと当たらず、ジェイミー・マノン・キンバリーほか多くのキャラには当たらなかったという。強K先端からのTCからだと当たらないという。{{dc:1285810788199694408/1287304206201393154}}{{dc:1285810788199694408/1287304464436297822}}{{dc:1285810788199694408/1287704329893052468}}", "@jpdc 2024年9月の投稿では、MR1500くらいまで通用するというたいじ式のラヴーシュカ連携が紹介された。始動は+8F以上の技（立ち中Kなど）で、キャンセルSA2から設置・起爆につなぎ、最後はインパクトかアブニマーチの二択になる。パリィ押しっぱなしの相手にはインパクトが通らないため、ODアブニマーチの方が通りやすいという。{{dc:1285864546984005693/1288350431369756763}}{{dc:1285864546984005693/1288358838130577431}}", "@jpdc 2024年12月の投稿では、調整後のパニカン投げは2040、SA2の弾が1個乗ると2240、2個で2440なので火力は下がらないという計算があった。一方、端でSA2発動後のパニカン投げがかなり弱くなったという声に、コパ→歩いてちょい遅らせ裏投げでギリギリ解決でき、発動即の裏投げだけは弱いがワンガード以降で代替すれば気にしすぎなくてよい、という答えがあった。{{dc:1285800688097562715/1313002349836632084}}{{dc:1285800688097562715/1313179522916548608}}{{dc:1285800688097562715/1313793487845724170}}", "@jpdc 2024年12月の投稿では、SA2発動中のパニカン投げのあとに重ねの中段が出せるという海外の投稿が紹介された。ただし受け身を取られると当たらず、画面端ではコパンが当たらない模様だという指摘があった。{{dc:1285800688097562715/1313542960406593577}}{{dc:1285800688097562715/1313553290457251862}}{{dc:1285800688097562715/1313553408367525919}}", "@jpdc 2026年8月の投稿では、ラヴーシュカを打った後のリバーサルが嫌で毎回ガードを入れているが、これでよいのかという相談に、大Kタゲコンからのラヴーシュカならコパ＞パリィを素早く押し、リバーサルはパリィ、ガードならコパで連ガを作れる、という答えがあった。相談者は試したところ、できたと報告した。{{dc:1285800688097562715/1540361113584009216}}{{dc:1285800688097562715/1540362271790989332}}{{dc:1285800688097562715/1540386142770167909}}", "@jpdc 2026年8月の投稿では、ドライブリバーサルへの確定として、5小K＞大設置＞大KTC＞弱棘＞大ストリボーグ（2300、相手のDゲージが3本ほど削れる）が挙がった。JPのようにDリバにSA2の初弾が当たってパニカンになるキャラは小技を挟まなくてよく、2小P＞2大Pで2310になる、という指摘もあった。{{dc:1285800688097562715/1540394014207905813}}{{dc:1285800688097562715/1540550692849320067}}{{dc:1285800688097562715/1540728552851374242}}{{dc:1285800688097562715/1540731334211805314}}", "@oukoku 2026年10月〜2026年11月の投稿では、SA2を使ったヒット時の基本コンボとして、SA2→しゃがみ中K→大K大Pのタゲコン→強設置→大K大Pのタゲコン→弱トリグラフが紹介された。弱トリグラフでコンボ中の設置が自動で爆破して当たり、そこから強ストリボーグ→中トルバランのいつものルートに行けるという。{{dc:1564325473582850203/1564325473582850203}}{{dc:1564325473582850203/1566374238749859940}}", "@oukoku 2026年11月の投稿では、SA2のあとに相手のDゲージを2本分削りたいときは、SA2→しゃがみ中K→大K大Pのタゲコン→強設置→大Pかしゃがみ大P→インパクト→強トリグラフだという。壁を背負っているときは、SA2→しゃがみ中K→前ジャンプ→しゃがみ大P→強設置で、そのあとは大K大PのタゲコンでDゲージを削るコンボでもよいとされた。{{dc:1564325473582850203/1566374238749859940}}", "@oukoku 2026年5月の投稿では、SA2を使うコンボとして、大K大Pのタゲコン→SA2→しゃがみ中K→大K→大P→強設置が挙げられ、そこから大P→インパクト→トリグラフ、または大Kのタゲコン→弱トリグラフ→大ストリボーグ→中トルバラン→トリグラフに分岐するという。{{dc:1504426715567358084/1504439994444550274}}", "@oukoku 2026年1月の投稿では、SA2の基本コンボとして、SA2→中足→大K→しゃがみ大P→強設置→大K大P→弱トリグラフ→強ストリボーグ→中トルバラン→強トリグラフ、または強設置→大P→インパクト→強トリグラフが挙げられた。大K大PからSA2に行く始動だと最初に中足を入れないとコンボにならず、全部最速でよいという。{{dc:1464151222108946568/1464151222108946568}}{{dc:1464151222108946568/1464156311817031743}}{{dc:1464151222108946568/1464177253536759901}}{{dc:1464151222108946568/1464203924348338267}}{{dc:1464151222108946568/1464210625818263588}}", "@oukoku 2026年1月の投稿では、画面端のSA2が入ったあとのコンボとして、ヒット確認して前ステを数回→大ストリボーグ→中トルバラン→ODトリグラフ→トリグラフでリーサルになるという。大ストリボーグからSA2へ行くなら、大ストリボーグ→中トルバラン→ODトリグラフ→SA2→強設置→前ジャンプ前ステ→中ストリボーグ→中ストリボーグだという。{{dc:1460193614863925451/1460193614863925451}}{{dc:1460193614863925451/1460238395908554896}}{{dc:1460193614863925451/1460393542047498373}}", "@oukoku 2025年9月の投稿では、SA2が地上当てでないときのコンボとして、前大K→中ストリボーグ→大PからSA2の場合は、弱ストリボーグ→中ストリボーグ×3、または弱ストリボーグ→中ストリボーグ→設置→立ち小Pでフレーム消費→詐欺飛び+F式という答えがあった。ODトリグラフからSA2の場合は、大設置→前ステ前ジャンプ→中ストリボーグ×2だという。{{dc:1419499768387862540/1419499768387862540}}{{dc:1419499768387862540/1419542590772088913}}", "@oukoku 2025年9月の投稿では、大P→ODトルバランからSA2をキャンセルで出し、トルバランがヒットしていた場合のコンボとして、ODトルバラン→SA2→前ステ→中ストリボーグ→「弱強設置」→（立ち弱K）→中ストリボーグ→（前大K）→強トリグラフ→強トリグラフで2840ダメージという答えがあった。前ステ→中ストリボーグがどの距離でもすっぽ抜けないという。{{dc:1418927314821058602/1418927314821058602}}{{dc:1418927314821058602/1419076482600407261}}{{dc:1418927314821058602/1419186067315228813}}", "@oukoku 2025年9月の投稿では、SA2の運びコンボとして、SA2→立ち中足→前ステ→しゃがみ大P→弱設置→前ステ→大P→中トルバラン→前ステ→前大K（1段当て）→大ストリボーグが運べてダメージもなかなかだという。画面端以外では質問者の指摘どおり拾えないので、ラッシュ前大K→トリグラフ→設置などにするという。{{dc:1415522369082101882/1415522369082101882}}{{dc:1415522369082101882/1416065056147374111}}{{dc:1415522369082101882/1416378715004342293}}", "@oukoku 2025年7月の投稿では、ラヴーシュカのコンボで大ストリボーグを決めたあと、ラッシュ前大K→中ストリボーグ→大Pがつながらないという相談に、トリグラフで浮かせているのでコンボカウントに引っかかっているのではという指摘があった。浮かせてからヴィーハト→大ストリボーグだとラッシュ6大K→中ストリボーグ→大Pはできないらしく、大K大Pのあとのトリグラフを弱トルバランにすると入るが、全部最速でないとつながらないという。{{dc:1397376979770146900/1397376979770146900}}{{dc:1397376979770146900/1397478636646305843}}{{dc:1397376979770146900/1397480874668199997}}{{dc:1397376979770146900/1397616492450938992}}", "@oukoku 2025年4月の投稿では、画面中央付近で大KP（タゲコン）ヒット⇒SA2⇒屈中K⇒大K⇒屈大P⇒大設置⇒大KP⇒弱弾⇒大ストリボーグ、のコンボが、設置に当たった相手が奥へ飛んで大ストリボーグが当たらないことがあるという質問に、始動の大Kの距離は関係なく、入力が遅れると設置に当たって跳ね返る時の高度が変わり、大ストリボーグの2ヒットが難しくなったり奥に飛んだりするようだという答えがあった。大ストリボーグの前の弱弾を弱トリグラフ（棘）にするとほとんどミスしないという。{{dc:1366417434256605325/1366417434256605325}}{{dc:1366417434256605325/1366432662100643869}}", "@oukoku 2025年4月の投稿では、チュートリアルコンボ（上級4）のようにODトルバランからSA2をつなげられないという質問に、ODトルバランが当たった時にキャンセルができるようになるのでそこを意識して練習するとよく、密着の時はODトルバランを撃ったらすぐにSA2のコマンドを作り始めるという答えがあった。質問者はそのとおりにして、簡易コマンドを意識したらミスはあるものの出せるようになったという。{{dc:1365563625439367218/1365563625439367218}}{{dc:1365563625439367218/1365842835936641064}}{{dc:1365563625439367218/1365858270971166802}}{{dc:1365563625439367218/1365869485583765555}}{{dc:1365563625439367218/1366001808043937802}}", "@oukoku 2025年11月の投稿では、DR2Mk,2Mp,SA2から何がつながるか分からないという相談に、基本的には何もつながらず、フレーム的にはしゃがみ中Pがつながるが届かないという答えがあった。質問者は生ラッシュTCからつなげることにした。小ネタとして、密着でラッシュ中足を当てるとSA2から立ちコパがつながるが、実用性はほぼないという。{{dc:1200611284408881324/1437587780321546293}}{{dc:1200611284408881324/1438073539768090644}}{{dc:1200611284408881324/1438073661876604959}}{{dc:1200611284408881324/1438160340792639658}}{{dc:1200611284408881324/1438570957227954317}}"], "clips": [{"ch": "oukoku", "g": "1182838025038872637", "c": "1200611284408881324", "m": "1437587780321546293", "a": "エルデシュ_クラシックJP_マスター", "d": "20251111", "x": "DR2Mk,2Mp,SA2から何がつながるかよく分かってない…"}]}, {"title": "始動別のコンボ（ODトルバラン・スタン・アブニマーチ）", "body": ["@jpdc 2024年10月の投稿では、画面端のスタン後のコンボとして、OD設置>中弾>フレーム消費の下大K>OD設置>大P>強弾>弱ストリボーグ>トリグラフ>SA3またはSA1が挙がった。トリグラフをODにするとSA2につなげられる。ダメージはSA3が6160、SA2が5300（さらにSA1につなぐと5900）、SA1が4760という。{{dc:1285810788199694408/1292404966161387583}}{{dc:1285810788199694408/1292413929536098324}}", "@jpdc 2026年6月の投稿では、ODトルバラン→SA2がヒットしたときの新コンボとして、SA2→垂直ジャンプ攻撃空振り→強ヴィーハト設置→前ステ→弱P×2空振り→中ストリボーグ→ヴィーハトヒット→強トリグラフ→強トリグラフの2860が紹介された。ザンギエフ・本田・ブランカ・マリーザ・サガット・アレックスにはトリグラフ2回当てができず、画面端なら前ステ設置から+5の投げが可能という。{{dc:1285864546984005693/1519015754001940671}}", "@oukoku 2026年7月の投稿では、大P→大ストリボーグ→中トルバラン→ODトリグラフ→SA2→大設置→前ステ→前ジャンプ→中ストリボーグ2回で4100ダメージというルートの伸ばし方を聞かれた。多分と前置きしつつ、リーサルならODトリグラフを使わないルートの方が高く、ODトリグラフのルートは設置から中ストリボーグ2回が最大だという答えがあった。{{dc:1531632218378731520/1531632218378731520}}{{dc:1531632218378731520/1531632920534454363}}{{dc:1531632218378731520/1531633998068187168}}{{dc:1531632218378731520/1531634139403522068}}", "@oukoku 2026年5月の投稿では、大P→ODトルバランをキャンセルしてSA2を発動し、ODトルバランがヒットしていた場合の伸ばし方が議論された。ノーゲージの高いルートは大P→ODトルバラン→SA2→（垂直ジャンプ中K）→大設置→前ステ→（立ち中K）→中トルバラン→トリグラフ2回だが、距離限定で難しい。安定ルートは、ODトルバラン→SA2→前ステ→中ストリボーグ→設置→中ストリボーグ→強トリグラフ2回の2840ダメージで、これもたまに入らないという。{{dc:1507716076262133790/1507716076262133790}}{{dc:1507716076262133790/1507736667510018100}}{{dc:1507716076262133790/1507736796736524379}}{{dc:1507716076262133790/1507736815657029682}}{{dc:1507716076262133790/1508358173210443796}}{{dc:1507716076262133790/1508358280718843904}}"], "clips": []}, {"title": "調整のあとに見つかったコンボ", "body": ["@jpdc 2026年8月の投稿では、屈弱P→SA2→屈中P→弱設置→前J攻撃（フレーム消費）→中ストリボーグ→OD設置で入れ替えつつ+42になるが、どうかという案が出された。{{dc:1288023709122039818/1533684476171784294}}", "@oukoku 2025年7月の投稿では、Year1からの変化点として、SA3からの前ステインパクトかコマ投げの択ができなくなった（+44Fから+20数Fへ大幅減）、小P→小P→SA2がつながらない、SA2のダブルインパクトコンボができなくなった、画面端のODアムネジアからのコンボはできるがダメージが大幅に減った、SA2→大Kがつながらない（中Kはつながる）、が挙がった。{{dc:1392023418991284335/1392023418991284335}}{{dc:1392023418991284335/1392470583173709935}}{{dc:1392023418991284335/1392472170613178450}}", "@oukoku 2024年5月の投稿では、22日の調整後にジラント→SA2→立ち強Kがつながらなくなり、しゃがみ中Pか立ち中Kなら入るという。画面端の浮いた相手への大P→SA2→弱ストリボーグは確認でき、投げから拾うコンボは安くなり、画面端のSA2最大ルートはつながらなくなったという。{{dc:1200611284408881324/1242678910358126616}}{{dc:1200611284408881324/1242679134568841229}}{{dc:1200611284408881324/1242679267536535582}}{{dc:1200611284408881324/1242680534480719944}}{{dc:1200611284408881324/1242680610137575474}}{{dc:1200611284408881324/1242684869293899876}}", "@oukoku 2024年5月の投稿では、22日の調整後の変化として、SA2の各段のガード硬直が少なくなっていそうで全弾連ガは無理かもしれない、SA2のインパクト2回連携ができない、ODストリボーグが22Fから19Fになった、という書き込みがあった。端のODストリボーグを前から大Pで拾えたかという疑問も出ている。端で大Kを当てたときはキャンセルラッシュなしでODストリボーグからコンボを伸ばせて便利だという。SA3後の有利は23Fだがしかも遠いという。{{dc:1200611284408881324/1242685345326170122}}{{dc:1200611284408881324/1242685673937567844}}{{dc:1200611284408881324/1242686966961672212}}{{dc:1200611284408881324/1242687625244966933}}{{dc:1200611284408881324/1242688672772522004}}{{dc:1200611284408881324/1242699181269979186}}"], "clips": []}, {"title": "この場面で倒しきれるか（リーサルの相談）", "body": ["@jpdc 2024年10月の投稿では、大竜巻をガードした後のリーサル探しで、コンボパーツを尽くしても+40ダメージ程度が最大でリーサルにならず、おそらく解なしという見方が出た。同じ状況をトレモで再現した人は、リーサルではないが画面端でSA2をODトルバランのガード上から発動した時と同じような、凌ぎにくい状況は作れると書いている。{{dc:1292666373314707456/1293234693185077390}}{{dc:1292666373314707456/1293264239133458442}}{{dc:1292666373314707456/1293279600750891049}}", "@jpdc 2024年10月の投稿では、大Pパニカンからのリーサル（Dゲージ約0.9本）は、SA2を使えばリーサルになり、中強設置を置けるならSA1でもリーサルという答えが出た。質問者は生ラッシュを挟んでいたが、生ラッシュでも大K→しゃがみ強Pと判断できれば同程度のダメージが出る。{{dc:1292666373314707456/1295246728538099713}}{{dc:1292666373314707456/1295249688622010389}}{{dc:1292666373314707456/1295249886153019444}}{{dc:1292666373314707456/1295252419717894246}}{{dc:1292666373314707456/1295261752967299104}}", "@jpdc 2024年11月の投稿では、空中でのヴィーハトヒットから（2ラウンド目70カウント）は、大ストリ前ステラッシュ前大K、CR大P、CR大P大P弱「棘」、SA3で5347ダメージとなりリーサルになった。SA1・SA2でのリーサルは情報が求められ、SA2なら別のルートのほうが高そうという返答もあった。{{dc:1292666373314707456/1311219009496289291}}{{dc:1292666373314707456/1311236712277741612}}{{dc:1292666373314707456/1311252912126689352}}", "@jpdc 2024年12月の投稿では、投げが通った後のSA1でのリーサル（2ラウンド目の80秒くらい）は、いろいろ試してもSA1だと超ギリギリで足りず、ラッシュ拾いから前大K中スト大PのSA2にするしかない、という答えだった。{{dc:1292666373314707456/1316453239708848150}}{{dc:1292666373314707456/1317935085676396585}}{{dc:1292666373314707456/1317942098984570910}}", "@jpdc 2025年4月の投稿では、しゃがみ中Pカウンターからのリーサル（1ラウンド目残り60秒）は、SA1最大が3899、SA2でも4520でミリ残りで、なさそうという。画面端が近ければあるはずで、端に近いかどうかで火力が大きく変わる。{{dc:1292666373314707456/1360298071409430628}}{{dc:1292666373314707456/1360312336933716110}}{{dc:1292666373314707456/1360682545494360146}}{{dc:1292666373314707456/1360682599089045687}}{{dc:1292666373314707456/1360682696610943057}}", "@jpdc 2025年7月の投稿では、6大K対空から（1ラウンド目残り47秒）は、SA1だと3779止まりだったが、前大K→キャンセルラッシュ→大P→大スト→中トルバラン→ODトリグラフ→SA2→強設置…でリーサルになった。SA1のリーサルは前大K2回のルートで、盲点だったという。{{dc:1292666373314707456/1394074487703732305}}{{dc:1292666373314707456/1394081416693678080}}{{dc:1292666373314707456/1394234645503021179}}{{dc:1292666373314707456/1394261619659505754}}", "@jpdc 2025年8月の投稿では、3ラウンド目69秒のスタン中は、設置＞ジャンプ強K＞強K＞小足（フレーム消費）＞ラッシュ6強K＞弱トルバラン…とつなぎ、SA2を挟んでトリグラフ×2＞弱ストでリーサル。SA2まで貯める簡単な形で、難しい形ならもっと出るかもという。{{dc:1292666373314707456/1404168085560229929}}{{dc:1292666373314707456/1404168432647409816}}{{dc:1292666373314707456/1404171383319171122}}{{dc:1292666373314707456/1404171716657418342}}", "@jpdc 2025年10月の投稿では、キンバリーのSA3をガードした後（3ラウンド目81秒）は、5546まで出たが届かなかった。SA2を使うルートならリーサルで、SA3はほんの少しだけ貯まらない。ジャンプ消費で入れる形で、最後を弱「グル」→トリグラフ3回目にすると10伸びた。{{dc:1292666373314707456/1426577592244244582}}{{dc:1292666373314707456/1426616851747573904}}{{dc:1292666373314707456/1426619223928733899}}{{dc:1292666373314707456/1426621374990123018}}{{dc:1292666373314707456/1426622346818617388}}", "@jpdc 2025年11月の投稿では、ODトルバランSA2で崩れた後（ラウンド3残り60秒）は、ワープして着地後OD弱強設置、しゃがみ大P中ストリボーグ、J中K大P ODトルバランSA1で4580出るという答えがあった。{{dc:1292666373314707456/1434829410774679684}}{{dc:1292666373314707456/1434848989131571303}}", "@jpdc 2025年11月の投稿では、SA2後のドライブリバーサルをガードした時（3ラウンド残り71秒）のリーサルは、屈弱P→大P→強設置→大Kタゲコン→弱トリグラフ→強ストリボーグ→生ラッシュ前大K…→ODトルバラン→トリグラフ→弱ストリボーグで倒しきれた。{{dc:1292666373314707456/1437064686322450463}}{{dc:1292666373314707456/1437070351933767792}}{{dc:1292666373314707456/1437075144920141855}}", "@jpdc 2025年11月の投稿では、インパクトパニカン後（2ラウンド目81秒）でSA2本のリーサルは、4660まで出ても届かなかった。確定削り込みならリーサルで、最後のマイクロウォークをせず弱ストを中ストにしてもリーサルになるという。{{dc:1292666373314707456/1444565756808400937}}{{dc:1292666373314707456/1444580954214498446}}", "@jpdc 2025年12月の投稿では、立強Kに2中Pがパニカンした後（1ラウンド目68秒）にミリ残る場面は、地上でSA2に行ければ余裕で足りるという。しゃがみ中Pから直接走ると足りず、立中Kを挟む必要があった。大Kに行ければギリギリ貯まるとも言われた。{{dc:1292666373314707456/1451174315289608232}}{{dc:1292666373314707456/1451178537502380106}}{{dc:1292666373314707456/1451180459126947952}}{{dc:1292666373314707456/1451180529360834570}}", "@jpdc 2025年12月の投稿では、設置が当たったところ（1R目残り29秒）は、ジャンプ中K→ラッシュ前大Kc大ストリボーグ→大P高め拾い→大P→SA1でリーサル。確実なのは前大KcODストリボーグ→ODトリグラフSA2から大設置など。ノーゲージは見つからず、SAなしは3710まで。{{dc:1292666373314707456/1452340189174169621}}{{d
