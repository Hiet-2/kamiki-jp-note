<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JP 攻略ノート：SA2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6; --paper2:#ebe4d6; --card:#fffdf8; --ink:#1d1b18; --ink2:#4a453d; --rule:#8c8374;
  --accent:#8a1c1c; --accent-bg:#f6e3df; --jp:#1f4e79; --jp-bg:#e2ecf5; --vs:#7a4a00; --vs-bg:#f7ead2;
  --focus:#ffd43d;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-size:18px;line-height:1.7;
  word-break:auto-phrase;text-wrap:pretty;
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(140,131,116,.13) 33px 34px)}
a{color:var(--jp)}
:focus-visible{outline:3px solid var(--ink);background:var(--focus)}
header{border-bottom:3px double var(--ink);background:var(--paper);position:sticky;top:0;z-index:5}
.hd{max-width:1080px;margin:0 auto;padding:16px 24px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.logo{font-family:"Zen Old Mincho",serif;font-size:32px;line-height:1.2;margin:0;letter-spacing:.04em}
.logo small{display:block;font-family:"Zen Kaku Gothic New";font-size:14px;letter-spacing:.1em;color:var(--ink2);font-weight:700}
nav{display:flex;gap:4px;margin-left:auto}
nav a{display:block;padding:10px 18px;text-decoration:none;color:var(--ink);font-weight:700;border:1px solid var(--rule);border-bottom:none;background:var(--paper2);border-radius:8px 8px 0 0;min-height:44px}
nav a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:240px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:16px;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:24px}
h2{font-family:"Zen Old Mincho",serif;font-size:28px;line-height:1.4;margin:8px 0 16px;text-wrap:balance}
.lead{color:var(--ink2);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;
  animation:rise .4s both;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink)}
.card .t{font-weight:700;line-height:1.5}
.card .s{font-size:16px;color:var(--ink2)}
.meta{font-size:16px;color:var(--ink2);display:flex;gap:4px 12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:1px 10px;border-radius:999px;border:1px solid currentColor}
.k-jp{color:var(--jp);background:var(--jp-bg)} .k-c0{color:#3d5a1e;background:#e6efd9} .k-c1{color:#5b2a86;background:#eee3f7} .k-c2{color:#0b5d5e;background:#dcefef} .k-c3{color:#8a4b00;background:#f7e6cf} .k-c4{color:#28408a;background:#e2e8f7}
.clips{margin:14px 0 4px;border:1px solid var(--rule);border-radius:10px;padding:8px 14px}
.clips summary{cursor:pointer;font-weight:700}
.clips ul{margin:8px 0 2px;padding-left:0;list-style:none}
.clips li{padding:6px 0;border-top:1px dashed var(--rule);line-height:1.6}
.clips li a{font-weight:700;margin-right:10px;white-space:nowrap}
.clips li span{color:inherit;opacity:.85} .said .tag{margin-right:8px;vertical-align:1px} .chips+.chips{padding-left:12px;border-left:1px solid var(--rule)} .k-vs{color:var(--vs);background:var(--vs-bg)} .k-x{color:var(--accent);background:var(--accent-bg)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.theme{background:var(--card);border:1px solid var(--rule);border-left:8px solid var(--ink);border-radius:8px;padding:14px 18px;text-decoration:none;color:var(--ink);animation:rise .4s both}
.theme b{font-size:20px;display:block}
.theme span{font-size:16px;color:var(--ink2)}
.pt{display:grid;grid-template-columns:96px 1fr;gap:4px 16px;padding:16px 0;border-top:1px solid var(--rule);animation:rise .35s both}
.pt:first-of-type{border-top:2px solid var(--ink)}
.ts{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;align-self:start;padding-top:2px}
.pt h3{margin:0;font-size:20px;line-height:1.5}
.pt p{margin:4px 0 0}
.pt .from{grid-column:2;font-size:16px;color:var(--ink2)}
.pt .from a{color:var(--ink2)}
.sum{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 24px;margin:0 0 24px}
.sum ul{margin:8px 0 0;padding-left:1.2em}
.warn{font-size:16px;color:var(--vs);background:var(--vs-bg);border:1px solid var(--vs);border-radius:8px;padding:8px 14px;margin:0 0 16px}
.back{display:inline-block;margin-bottom:8px;font-weight:700}
.empty{color:var(--ink2);padding:24px 0}
.toc{margin:12px 0 0;padding-left:0;list-style:none;columns:2 280px;column-gap:32px}
.toc li{break-inside:avoid;margin:2px 0}
.sec{padding:16px 0;border-top:1px solid var(--rule);scroll-margin-top:150px}
.sec:first-of-type{border-top:2px solid var(--ink)}
.sec h3{font-size:22px;line-height:1.5;margin:0 0 8px;scroll-margin-top:140px}
.sec p{margin:0 0 12px;max-width:44em}
.cite{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin:0 2px;text-decoration:none;line-height:1.6;white-space:nowrap}
.cite:hover{text-decoration:underline}
.rg{font-size:18px;margin:20px 0 8px;padding-left:10px;border-left:6px solid var(--jp)}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.route{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.route b{font-size:18px;line-height:1.4}
.when{font-size:16px;color:var(--ink2)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;line-height:1.4}
.step{display:inline-block;background:var(--jp-bg);color:var(--jp);border:1px solid var(--jp);border-radius:6px;padding:2px 8px;font-weight:700;font-size:16px}
.arr{color:var(--ink2);font-weight:700;padding:0 2px}
.opts{display:flex;gap:8px;align-items:flex-start}
.optl{flex:none;font-size:14px;font-weight:700;color:var(--vs);background:var(--vs-bg);border:1px solid var(--vs);border-radius:999px;padding:1px 10px;margin-top:3px}
.opts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rnote{margin:0;font-size:16px;color:var(--ink2)}
@media (max-width:767px){.routes{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:767px){.hd{padding:12px 16px 0}.logo{font-size:26px}nav{margin-left:0}nav a{padding:8px 12px}main,.bar{padding-left:16px;padding-right:16px}.pt{grid-template-columns:1fr}.pt .from{grid-column:1}}
.foot{border-top:3px double var(--ink);background:var(--paper)}.foot div{max-width:1080px;margin:0 auto;padding:16px 24px 32px;font-size:16px;color:var(--ink2)}.foot p{margin:0 0 8px}
/* ---- 入口の図（教科書の入口・キャラ対・状況・技） ---- */
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 32px}
.entry{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:end;background:var(--ink);color:var(--paper);text-decoration:none;border:1px solid var(--ink);border-radius:12px;padding:14px 20px 18px;animation:rise .4s both;transition:transform .15s,box-shadow .15s}
.entry:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--accent)}
.entry .eh{grid-column:1/-1;font-weight:900;font-size:20px;letter-spacing:.12em}
.entry b{font-family:"Zen Old Mincho",serif;font-size:56px;line-height:1;color:#ffd9cf}
.entry span:last-child{font-size:16px;line-height:1.5;color:#ece6da;padding-bottom:4px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.chap{background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--ink);border-radius:10px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;animation:rise .4s both}
.chh{text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.chh .cn{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
.chh b{font-family:"Zen Old Mincho",serif;font-size:26px;line-height:1.35}
.chh:hover b{text-decoration:underline;text-underline-offset:4px}
.chh .cm{font-size:16px;color:var(--ink2)}
.sbar{display:flex;height:10px;border:1px solid var(--ink);border-radius:5px;overflow:hidden}
.sbar i{background:currentColor;min-width:3px}
.slg{font-size:14px;line-height:1.5;color:var(--ink2);margin-top:-4px}
.chs{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chs a{display:inline-block;padding:3px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:16px;line-height:1.5}
.chs a:hover{border-color:var(--ink);background:var(--paper2);text-decoration:underline}
.chr{font-weight:700;font-size:16px;margin-top:2px}
.vsort{margin:0 0 16px}
.vtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.vt{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 12px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:120px;animation:rise .35s both;transition:transform .12s,box-shadow .12s,border-color .12s}
.vt::before{content:"";position:absolute;inset:-1px auto -1px -1px;width:7px;background:var(--accent);border-radius:10px 0 0 10px}
.vt:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink);border-color:var(--ink)}
.vn{font-family:"Zen Old Mincho",serif;font-size:22px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.vsub{font-size:16px;line-height:1.45;color:var(--ink2)}
.vm{display:block;height:8px;background:var(--paper2);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-top:auto}
.vm i{display:block;height:100%;background:var(--ink)}
.vc{font-size:16px;font-weight:700}
.vw{font-size:14px;line-height:1.45;color:var(--ink2)}
.vstrip{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px;padding:10px 0;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule)}
.vstrip a{font-size:16px;line-height:1.5;padding:3px 11px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--card)}
.vstrip a:hover{border-color:var(--ink);text-decoration:underline}
.vstrip a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vh{font-size:44px;line-height:1.25;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vh small{font-family:"JetBrains Mono",monospace;font-size:18px;color:#fff;background:var(--accent);padding:2px 12px;border-radius:6px;letter-spacing:.12em}
.pn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 0;font-weight:700}
.fv{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:24px;align-items:start}
.smap{display:flex;flex-direction:column;gap:18px}
.sg h3{font-size:18px;line-height:1.4;margin:0 0 6px}
.sg h3 small{display:block;font-size:14px;font-weight:400;color:var(--ink2)}
.sb{display:flex;flex-direction:column;gap:4px}
.sb a{display:block;padding:8px 12px;border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;line-height:1.45}
.sb a:hover{border-left-color:var(--ink);text-decoration:underline}
.sb a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink);border-left-color:var(--accent)}
.fpane{position:sticky;top:var(--hd,170px)}
.flow{background:var(--card);border:1px solid var(--ink);border-radius:12px;overflow:hidden;animation:rise .3s both}
.fs{background:var(--ink);color:var(--paper);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.fs b{font-family:"Zen Old Mincho",serif;font-size:24px;line-height:1.35}
.fsl{font-size:14px;font-weight:700;letter-spacing:.14em}
.fs .fsl{color:#ffd9cf}
.fw{font-size:16px;line-height:1.5;color:#ece6da}
.fb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.fl,.fk{display:flex;flex-direction:column;gap:6px}
.fb .fsl{color:var(--accent)}
.fc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.fn{background:var(--jp-bg);color:var(--jp);border:1px solid var(--jp);border-radius:6px;padding:4px 10px;font-weight:700;font-size:16px;line-height:1.4}
.fa{color:var(--ink2);font-weight:900;padding:0 2px}
.fk ul{list-style:none;margin:0 0 0 10px;padding:0 0 0 20px;border-left:3px solid var(--vs);display:flex;flex-direction:column;gap:8px}
.fk li{position:relative}
.fk li::before{content:"";position:absolute;left:-20px;top:16px;width:16px;border-top:3px solid var(--vs)}
.fk .fn{background:var(--vs-bg);color:var(--vs);border-color:var(--vs)}
.fct{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:24px}
.mvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mv{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:1px solid var(--ink);border-bottom-width:4px;border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;transition:transform .1s,border-bottom-width .1s;animation:rise .35s both}
.mv:hover b{text-decoration:underline}
.mv:active{transform:translateY(2px);border-bottom-width:2px}
.mv b{font-size:18px;line-height:1.35}
mark{background:#ffe08a;color:var(--ink);padding:0 2px;border-radius:3px}
.mh{font-size:18px;line-height:1.5;margin:0 0 8px}
@media (max-width:767px){header{position:static}nav{flex-wrap:wrap}.fv{grid-template-columns:1fr}.fpane{position:static}.vh{font-size:34px}.entry b{font-size:44px}.chaps{grid-template-columns:1fr}.flows{grid-template-columns:1fr}}
/* 書き直した段落（見出し＋箇条書き） */
.sec .pa{margin:0 0 20px;max-width:44em}
.sec .pa .lh{margin:0;font-size:18px;line-height:1.6}
.pa .lh b{font-weight:700}
.pl{margin:4px 0 0;padding-left:1.4em}
.pl li{margin:3px 0;line-height:1.7}
.pl li::marker{color:var(--accent)}
/* 節の結論：✓ 使える（節の頭）／✕ 使えない（節の終わり） */
.vd{background:var(--card);border:1px solid var(--rule);border-left:6px solid;border-radius:10px;padding:12px 18px;margin:8px 0 24px;max-width:52em}
.vd.vu{border-left-color:#1e5d2b}.vd.vx{border-left-color:var(--accent);margin-top:20px}
.vd h3{font-size:18px;line-height:1.4;margin:0 0 6px}
.vu h3{color:#1e5d2b}.vx h3{color:var(--accent)}
.vd ul{margin:0;padding-left:1.2em}
.vd li{margin:6px 0;line-height:1.6}
.vu li::marker{color:#1e5d2b}.vx li::marker{color:var(--accent)}
.vdt{font-weight:700}
.vdn{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--ink2)}
.vv{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:14px;font-weight:700}
.vv .ok{color:#1e5d2b}.vv .ng{color:var(--accent)}

</style>
<style id="topic-links-css">.topics{padding-top:0}.topics .tl{font-size:14px;font-weight:700;color:var(--ink2)}.topics a{font-size:15px;padding:4px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}.topics a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}</style>
</head>
<body>
<header>
  <div class="hd">
    <h1 class="logo"><small id="subtitle"></small><span id="title"></span></h1>
    <nav aria-label="切り替え">
      <a href="#/book" data-tab="book">教科書</a>
      <a href="#/vs" data-tab="vs">キャラ対</a>
      <a href="#/flow" data-tab="flow">状況</a>
      <a href="#/moves" data-tab="moves">技</a>
      <a href="#/themes" data-tab="themes">テーマ別</a>
      <a href="#/videos" data-tab="videos">動画</a>
      <a href="#/lives" data-tab="lives">配信</a>
    </nav>
  </div>
  <div class="bar">
    <input id="q" type="search" aria-label="言葉で探す">
    <div class="chips" role="group" aria-label="誰向けの話か" id="sides"></div>
    <div class="chips" role="group" aria-label="誰の話か" id="whos"></div>
  </div>
  <div class="bar topics" id="topic-links"><span class="tl">話題ごとのページ</span><div class="chips"><a href="index.html">全体</a><a href="sa2.html" aria-current="page">SA2</a><a href="amnesia.html">アムネジア</a><a href="modern.html">モダン・クラシック</a></div></div>
</header>

<script type="application/json" id="data">{"videos": [{"id": "pH0OO3NED0M", "title": "【スト6】MR2400JPが教えるyear4JPコンボ動画！レジェンドまでこれ一本！！！", "date": "20261126", "duration": 1210, "views": 154, "short": false, "ch": "rerin", "kind": "JP講座", "level": "中級", "summary": "MR2400に届いたレリンが、モダンJP準拠で、始動技・状況ごとのコンボを紹介する動画。レシピと補足は画面の字幕で示していて、このノートでは字幕から読んだ手順を場面ごとに書いた。モダンとクラシックでコンボはほぼ変わらないので、クラシックでも使えるという。", "takeaways": ["Year4でモダンJPが大きく強化され、モダンでもクラシックとほぼ同じコンボが使える", "弱アシストのコンボは自動確認だが、しゃがみ弱Pから↓アシスト弱で連打キャンセルするときは自動確認ではない", "立ち中Kからのキャンセルラッシュは、しゃがみ弱Pなら連続ガード、しゃがみ中Pでは連続ガードにならない", "近い場所の自動起爆は生ラッシュの攻撃が空振りするので、直接前大Kで拾う", "無敵技をガードした後のコンボは距離ごとに4つ（汎用・中央ノーSA最大・端付近・端密着）"], "characters": ["JP"], "themes": ["combo", "system"], "version_sensitive": true, "version_note": "2026年11月の動画（Year4 が始まった直後に撮ったもの）。具体的なコンボ・ダメージは、のちの調整で変わる可能性がある", "points": [{"t": 109, "head": "小技・中技始動（モダン準拠）：小技始動のリーサル", "body": "小技がヒットしてリーサルが見えるとき。レシピ：アシスト弱 → キャンセルラッシュ → 弱P → 立ち中K → キャンセルラッシュ → 立ち大K → 前大K → 中トルバラン → SA3。最後の中トルバランをSA1にすることもできる。SA2を使うときは前大Kの部分をしゃがみ大Pに変え、しゃがみ大P→SA2とつないだら立ち大Kにつなぐ。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 312, "head": "生ラッシュ：大ストリボーグからのリーサル", "body": "ラッシュしゃがみ中Pがヒット。空中から拾ったときのリーサルにも使える（最大ではない）。レシピ：ラッシュ → しゃがみ中P → 立ち中K → キャンセルラッシュ → しゃがみ大P → 大ストリボーグ → 生ラッシュ → 前大K → キャンセルラッシュ → 立ち大P（高め拾い） → 立ち大P → トリグラフ → SA3。ラッシュしゃがみ中P→立ち中Kが大事で、そこだけ覚えておけば大丈夫。立ち大Pの高め拾いは難しいが、ほかでも使うテクニック。モダンでは大ストリボーグを使わない地上伸ばしのほうが高くなる場合がある。SA3の最大は大ストリボーグのルートだが、火力があまり変わらないので、SA2ルートの火力が大きい地上伸ばしをまず選びたい。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 370, "head": "生ラッシュ：しゃがみ中Pカウンターから画面端へ・SA2", "body": "生ラッシュしゃがみ中Pがカウンター。画面端に届くときのリーサル。レシピ：生ラッシュ → しゃがみ中P（カウンター） → ジラント → キャンセルラッシュ → 立ち大K → 前大K → キャンセルラッシュ → 立ち大K → 前大K → 中ストリボーグ → 大P → SA2 → 弱ストリボーグ → 弱設置 → 中ストリボーグ → トリグラフ → トリグラフ → 弱ストリボーグ。画面端の立ち大P拾いからのSA2発動は、だいたい同じルート。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 406, "head": "生ラッシュ：生ラッシュ中段", "body": "生ラッシュの中段がヒット。レシピ：生ラッシュ → 中段 → しゃがみ中P → アシスト中（ODストリボーグまで） → 強トリグラフ。アシスト中を連打しない（連打するとSA2が出る）。モダンはアシスト中のコンボを使う（画面端の大K始動のコンボでも使う）。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 587, "head": "SA2（ラヴーシュカ）：インパクトで削るルート", "body": "SA2を使う。レシピ：ジラント → SA2 → 中足 → 立ち大K → しゃがみ大P → 強設置 → 大攻撃 → インパクト → 強設置。本人が主に使う3つのルートの1つ目。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 608, "head": "SA2（ラヴーシュカ）：ドライブゲージを回復する汎用ルート", "body": "SA2を使う。レシピ：ジラント → SA2 → 中足 → 立ち大K → しゃがみ大P → 強設置 → ジラント → 弱トリグラフ → 大ストリボーグ → 中トルバラン → 強設置。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 632, "head": "SA2（ラヴーシュカ）：遠めの飛びから", "body": "遠めの飛びからジャンプ中Pが当たった。レシピ：ジャンプ中P → 生ラッシュ → しゃがみ弱P → 立ち中K → …（この先は画面の字幕に「etc」とだけある）。ジャンプ中Pからのつなぎが特殊。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 647, "head": "SA2（ラヴーシュカ）：入れ替えルート", "body": "SA2で位置を入れ替えたい。レシピ：SA2 → 中足 → 前ジャンプ → しゃがみ大P → 強設置 → 大攻撃 → インパクト → 前大K → 中ストリボーグ → 立ち大P → …（この先は画面の字幕に「etc」とだけある）。入れ替えは、大Kの部分を前ジャンプに変えるだけ。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 961, "head": "ジャストパリィ後・無敵技をガードした後：無敵技ガード後：画面端密着", "body": "画面端密着で無敵技をガードした。レシピ：ラッシュ → 前大K → 弱トルバラン → 前大K → 中ストリボーグ → 立ち大P → キャンセルラッシュ → しゃがみ大P → キャンセルラッシュ → しゃがみ大P → SA2 → 弱ストリボーグ → 弱設置 → 中ストリボーグ → トリグラフ → トリグラフ → 弱ストリボーグ。キャンセルラッシュしゃがみ大P→SA2の後のルートは、大P拾い→SA2のときと同じ。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 1164, "head": "スタン：大ストリボーグからSA2（おすすめしない）", "body": "大ストリボーグからSA2を使う。レシピ：大ストリボーグ → 中トルバラン → ODトリグラフ → SA2 → 強設置 → 前ステップ → 前ジャンプ → 中ストリボーグ → 中ストリボーグ。本人が「紹介したくなかった」ルート。地上で伸ばせる場合は、こちらのほうが安くなる。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "huo-oLXvTsA", "title": "合計一万減るJPのみんぐ式が犯罪級の強さで驚愕するりゅうせい【スト6】", "date": "20261124", "duration": 699, "views": 31860, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "りゅうせいが紹介した、みんぐさんの連携を検証する動画。ヴィーハト設置のあとにバックステップから前大Kを入れ込むと、ガードされても確定反撃を受けず、当たればフルコンボになる。字幕では、ノーゲージで5500点台、SA1・SA2・CAを使うと6000〜7700点台まで減るという。", "takeaways": ["設置後のバックステップ前大Kは、ガードされても確定反撃を受けにくい", "しゃがみガードでも立ちガードでも、守る側が損をしやすい", "前ステップから設置する簡単なルートでも、字幕では5500点台減る", "弱点は、前ジャンプ、無敵技、最速の暴れ"], "characters": ["JP"], "themes": ["setplay", "offense", "combo"], "version_sensitive": true, "version_note": "2026年11月の動画。フレームやダメージの数字に依存する連携で、動画の中でも調整されそうだと話している。のちの調整で変わっている可能性がある", "points": [{"t": 256, "head": "SA1・SA2でもよく減る", "body": "SA1を使うと6000点ほど、SA2でも6500点ほど減る。字幕では、投げを入れたら6000点減るくらいの感覚だと話している。数字がおかしいと笑っている。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "-H1xISaRJww", "title": "シーズン1から眠っていた衝撃のハメ連携に困惑するりゅうせい【スト6】", "date": "20261102", "duration": 816, "views": 42999, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "りゅうせいが、視聴者の研究として紹介された、ODトルバランからのF式連携を検証する動画。中足と小Pの2択や、登りジャンプ弱Kを使った崩しが、SA2を使わなくても成立する形を確かめる。連携はまだ増えるだろうと話している。", "takeaways": ["ODトルバランなどのあとに、中段と下段の2択を仕掛ける", "字幕では、中足ガードはプラス5フレーム、SA2発動はプラス9フレームで連続ガードになる", "標準キャラにも入る形を見つけて、使えるようになった", "忘れないように、連携を覚えておく大切さを話す"], "characters": ["JP"], "themes": ["setplay", "offense", "resource"], "version_sensitive": true, "version_note": "2026年11月の動画。フレームや連携の成立条件に依存する内容で、動画の中でも調整で修正されるかもしれないと話している。のちの調整で変わっている可能性がある", "points": [{"t": 316, "head": "SA2発動と中足で連続ガード", "body": "字幕では、SA2の発動がプラス9フレーム、中足ガードがプラス5フレームで、立ち小Pまで連続ガードになる。連続ガードなので、相手は動けない。", "themes": ["setplay", "offense", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 498, "head": "なぜこの形がうれしいのか", "body": "通常のキャラクターには、SA2発動のあとにF式がつながらない。大型キャラだと入る。標準キャラは入らず困っていた。ダッシュ引き中発動やODトルバランの発動なら入るが、大SA2のあとも入るなら使いたい、という説明だ。", "themes": ["setplay", "resource", "matchup"], "chars": ["JP"], "side": "jp"}]}, {"id": "uubdHE64DtM", "title": "禁断のハメ完成でJP新時代に突入した事に驚愕するりゅうせい【スト6】", "date": "20261007", "duration": 1097, "views": 49831, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、SA2を使わずに字幕で「F式」と出る連携へ行くルートを、りゅうせいが検証する動画。インパクトからのルート、キャラごとのジャンプ攻撃、シミーからの形まで試す。", "takeaways": ["視聴者の研究で、SA2なしでも設置の状況に持っていける", "始動技によって有利フレームが変わり、連携が成立するかが決まる", "インパクトからのルートもりゅうせいが作った", "キャラごとにジャンプ攻撃を変える", "ダメージが落ちても、ルートを持っておくことが大事だと話す"], "characters": ["JP"], "themes": ["setplay", "combo", "resource", "matchup"], "version_sensitive": true, "version_note": "2026年10月の動画。具体的なフレーム・コンボ・ダメージに依存するため、のちの調整で変わっている可能性がある", "points": [{"t": 28, "head": "視聴者の研究：SA2なしで連携に行ける", "body": "視聴者から、SAを使わなくてもOD設置から詐欺飛び、連携に行けるルートが届いたと紹介される。字幕では連携が「F式」などと出るが、意味は字幕から確定できない。", "themes": ["setplay", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 70, "head": "崩したあとにSAが溜まっていれば攻めに使える", "body": "紹介された投稿では、SA2なしでOD設置、詐欺飛び、連携が完成したと説明される。崩したあとにSAが溜まれば、SA攻めに移れるとも書かれている。", "themes": ["setplay", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 104, "head": "ラヴーシュカしか使わなくてもこの状況に行ける", "body": "ラヴーシュカしか使わなくても、この設置状況に持っていけばいいとわかる。実戦でありそうな場面だと話す。", "themes": ["setplay", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 1032, "head": "画面端でも同じルートが入る", "body": "画面中央で使っているルートを、画面端でもそのまま使えると気づく。SA2が溜まる場面なら、バーンアウトさせてからラヴーシュカを持っておくのは、ほぼ勝ちだと話す。", "themes": ["setplay", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "RUnApYarDS4", "title": "JPの強行動を徹底解説します【りゅうせい・スト6】", "date": "20260926", "duration": 671, "views": 24036, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "JPの強さを、Dゲージコントロール、SAゲージ回収、ヴィーハト設置、シンプル火力の4つに分けて解説する動画。設置で2対1の状況を作り、ロングゲームにしてから地上で勝負する形がJPの強みだと話す。", "takeaways": ["大Pからトルバランのフェイントでパリィを釣れる", "弾と設置でドライブとSAゲージを回収する", "ヴィーハト設置の2対1が一番強い時間", "JPの勝率は設置状況の多さで決まる"], "characters": ["JP"], "themes": ["system", "resource", "setplay", "offense"], "version_sensitive": true, "version_note": "2026年9月の動画。ダメージの数字や設置後の攻めなど具体的な内容に依存するため、のちの調整で変わっている可能性がある", "points": [{"t": 215, "head": "ラヴーシュカで強い時間を作る", "body": "SAが貯まるとラヴーシュカで絶対的な2択が始まる。強い時間を作るための準備という感覚だ。スト5のユリアンと同じく、道中で削って最後にリーサルを取る形で、JPではそれがラヴーシュカになる。SA2を1ラウンドに2回出す方が強いと感じていて、ここは好みが出る。", "themes": ["resource", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "Lc1NGGRQTGw", "title": "JPが実戦で使うコンボ全て教えます【りゅうせい・スト6】", "date": "20260923", "duration": 2168, "views": 76129, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "りゅうせいがJPの実戦で使うコンボを、小P始動から設置中、インパクト始動、画面端、無敵技ガード後、SA2まで場面別に紹介する講座。2026年8月の調整での強化点にも触れる。", "takeaways": ["小P始動は、しゃがみ小Pより立ち小Pで繋ぐ", "SA1は最速で出すと空振りするので、遅らせて出す", "インパクトからのOD設置ルートは、ゲージを回収しやすい", "画面端のスタンやODトルバランなど、状況別の最大ルートがある", "ラヴーシュカが当たると、ドライブゲージがほぼ全回復する"], "characters": ["JP"], "themes": ["combo", "setplay", "resource", "patch"], "version_sensitive": true, "version_note": "2026年9月の動画。2026年8月3日の調整より後の内容だが、具体的なフレームやコンボに依存するため、調整で変わっている可能性がある", "points": [{"t": 201, "head": "SA1は最速で出すと空振りする", "body": "ストリボーグまで繋いだら、SA1、SA2、SA3のどれも繋がる。SA1は最速で出すと空振りするので、遅らせて出すのが当てるコツだ。怖い場合は前ステップからSA1を出すと、全部最速入力でも繋がる。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 317, "head": "リーサルの判断を後半まで引っ張る", "body": "画面端のコンボは、しゃがみ中Pからラッシュ前大Kのルートまで行けることを1つのゴールにしてよい。浮かせた後のあるルートでは、最後にSA1・SA2・SA3を選べる。リーサルの判断を後半まで引っ張れて、考える時間が伸びるので、リーサルミスが減る。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 1995, "head": "SA2ラヴーシュカのコンボ", "body": "SA2のコンボは数が多すぎるので、実戦で押さえておけば使えるルートだけを紹介している。ラヴーシュカが当たると、ドライブゲージがほぼ全回復するくらいの認識でよい。ルートが複雑なので、ゴールを統一するとミスが減ると話す。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "rJiaob7ZXGs", "title": "「キャラランク上がる」ゲームを破壊する凶悪連携を武器商人が開発しました【りゅうせい・スト6】", "date": "20260921", "duration": 1289, "views": 55893, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、設置を使った凶悪な連携を、りゅうせいが検証する動画。中足を刻んでも行ける、中段でも下段でも崩れたら行ける、といった条件を確かめ、最後に対策側は上ガードか下ガードを運で選ぶしかないと話す。", "takeaways": ["起き上がりの両方に対応した、汎用性の高い連携が見つかる", "大きいキャラには、ジャンプ中Kから入る", "受け身を取られると、密着でないと続かない", "中段でも下段でも崩れたら、同じ連携に行ける", "対策側は、上ガードか下ガードを運で選ぶしかない"], "characters": ["JP"], "themes": ["setplay", "combo", "offense", "matchup"], "version_sensitive": true, "version_note": "2026年9月の動画。具体的なフレーム・コンボ・ダメージに依存するため、のちの調整で変わっている可能性がある", "points": [{"t": 1171, "head": "バーンアウト中でもラヴーシュカがあれば使える", "body": "バーンアウトしていても、ラヴーシュカを持っているときは、全部この連携に行っていいくらい強いと話す。", "themes": ["resource", "setplay"], "chars": ["JP"], "side": "jp"}]}, {"id": "6fIBrUEaMyQ", "title": "JP天才武器商人の革命に大満足のりゅうせい【スト６】", "date": "20260831", "duration": 485, "views": 37418, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、設置を使った新連携をりゅうせいが検証する動画。設置の位置や強さで入るかどうかが変わり、距離が遠いと入らない場面も確かめる。", "takeaways": ["字幕では、設置の位置と強さで数字が42か43に変わると話す", "弱の設置はだめで、中か強が必要だと確かめる", "OD設置の方が、ガードされた後も攻めが続く", "遠い距離では入らず、画面端なら入る", "ゲージの状況を見て、選ぶルートを変える"], "characters": ["JP"], "themes": ["setplay", "combo", "resource"], "version_sensitive": true, "version_note": "2026年8月の動画。具体的なフレーム・コンボ・ダメージに依存するため、のちの調整で変わっている可能性がある", "points": [{"t": 297, "head": "バーンアウト中はゲージを見て選ぶ", "body": "バーンアウト中にヒットしたとき、どのルートに行くか悩むと話す。ラヴーシュカで相手のドライブが1本ほどで割れるなら、行ってしまっていい。", "themes": ["resource", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "ragTngpJioE", "title": "【緊急】弱体化調整でJPが終了しました【りゅうせい・スト６】", "date": "20260803", "duration": 1039, "views": 58569, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "2026年8月3日のバトル調整のパッチノートを、りゅうせいが1項目ずつ読み、JPの使い手として評価する動画。ODアムネジアの硬直増加と立ち強Pの変更を大きな弱体化と受け止め、ストリボーグなどの強化には使い道を探す。", "takeaways": ["ODアムネジアは、投げを受けたときのJP側の硬直が4F増え、投げの入れ替えの強みが減った", "立ち強Pのガード待機判定が遅くなり、ガードさせた後のリターンが下がる", "弱・中・OD ストリボーグは、ガード待機判定が遅くなる代わりにリーチが伸びた", "ワープ（ヴィーハト・アクノ）はキャンセル元が増えたが、使い道はまだ見つかっていない", "総評は、結構弱くなった。強化点は正直あまり嬉しくない"], "characters": ["JP"], "themes": ["patch", "system", "setplay", "neutral"], "version_sensitive": true, "version_note": "2026年8月3日の調整内容を、公開日当日に読み上げた動画。調整直後の第一印象が中心で、のちの検証で評価が変わっている可能性がある", "points": [{"t": 192, "head": "しゃがみ中KからSA2の形ができなくなった", "body": "以前は、しゃがみ中KからSA2を発動して、効率のいいコンボを決める形があった。その形が、できなくなった。+4Fを取ったときのSA2発動パターンを、JP研究員の視聴者に募集している。", "themes": ["combo", "patch"], "chars": ["JP"], "side": "jp"}]}, {"id": "odGhkR7MFco", "kind": "キャラ対策", "level": "中級", "summary": "テリー・ジュリ・イングリッド・マノンの嫌な行動への一口対策をまとめた動画。テリーのファイヤーキックからの択、ジュリの五黄殺からの歳破衝、イングリッドのワープ、マノンの SA2 への対処を、短く1つずつ示す。", "takeaways": ["テリーの択は小Pで勝てる", "ジュリの突進にジャストパリィ", "マノンのSA2は最後まで守らない"], "characters": ["テリー", "ジュリ", "イングリッド", "マノン"], "themes": ["matchup", "defense"], "version_sensitive": true, "version_note": "2026年8月の動画。各キャラの性能前提のため、調整で変わっている可能性がある", "points": [{"t": 85, "head": "マノンのSA2は普通にガードしない", "body": "マノンの SA2 を普通にガードすると、端から離れてしまい、普通の端コンボがしにくくなる。", "themes": ["matchup", "defense"], "chars": ["マノン"], "side": ""}, {"t": 96, "head": "SA2の跳ねる所は隙が大きい", "body": "マノンの SA2 の跳ねるところはフレームが大きく空いていて、ラッシュで割り込んだり、インパクトを入れたりできる。最後までガードしきってもゲージが削られるだけなので、大きな端コンボを入れるようにする。ジュリの SA1 も同じだ。", "themes": ["matchup", "combo", "resource"], "chars": ["マノン", "ジュリ"], "side": ""}], "title": "【スト6】一口対策動画まとめ3【テリー・ジュリ・イングリッド・マノン】", "date": "20260801", "duration": 117, "views": 1393, "short": false, "ch": "kamiki"}, {"id": "yXbMl1Js0w4", "title": "ダルシム限定のJPドリームコンボを発見した武器商人に感動するりゅうせい【スト6】", "date": "20260722", "duration": 494, "views": 11983, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "中級", "summary": "視聴者の研究として紹介された、ダルシムのSA2に対するJPの最大確反を、りゅうせいが試す動画。ドライブインパクトの目押しや、設置から大Pにつなぐ形を確かめ、ダルシムがSA2を溜めていた場合の対応も見る。", "takeaways": ["ダルシムのSA2への最大確反に、ドライブインパクトが入る", "インパクトは目押しで、弾が画面外に消えた後くらいに撃つ", "SA2を溜められていたら、設置して大Pで弾を消す", "大Pに統一すると減りは少し落ちるが、楽になる"], "characters": ["JP"], "themes": ["combo", "matchup", "setplay"], "version_sensitive": true, "version_note": "2026年7月の動画。2026年8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 13, "head": "ダルシムのSA2への最大確反を試す", "body": "視聴者の研究として紹介された、ダルシムのSA2に対する最大の確反を見る。字幕では「最大」と言っている。実際に入るのを見て、驚いている。", "themes": ["combo", "matchup"], "chars": ["JP"], "side": "jp"}, {"t": 47, "head": "確反にドライブインパクトが入る", "body": "確反の中にインパクトが入ると分かり、想像を超えたと驚く。ダルシム戦ではSA2を撃たれることが多いので、確定を調べているかが問われると話す。", "themes": ["combo", "matchup"], "chars": ["JP"], "side": "jp"}, {"t": 216, "head": "SA2を溜められていた場合は設置して大P", "body": "ダルシムがSA2を溜めていた場合はどうするかを考える。溜めている間は、大Pが当たると弾が消える。そこで設置してから大Pを入れる形になる。", "themes": ["combo", "matchup", "setplay"], "chars": ["JP"], "side": "jp"}, {"t": 390, "head": "ダルシム戦のSA2への反撃はこれだった", "body": "ダルシム戦のSA2に対する反撃は、これだったと結論づける。実戦で決めたいと話す。", "themes": ["combo", "matchup"], "chars": ["JP"], "side": "jp"}]}, {"id": "9A6i80KhYjw", "kind": "キャラ対策", "level": "中級", "summary": "マノンのSA2への確定反撃を30秒で説明するショート。普通にガードすると端から離れるが、跳ねる部分に大きな隙間があり、割り込むか、最後までガードせず大きい端コンを入れる。ジュリのSA1も同じ。", "takeaways": ["SA2の跳ねる部分は大きく隙間がある", "割り込むか大きい端コンを入れる", "ジュリのSA1も同じ"], "characters": ["マノン"], "themes": ["matchup", "combo"], "version_sensitive": true, "version_note": "2026年7月の動画。マノンのSA2が調整で変わっている可能性がある", "points": [{"t": 0, "head": "SA2の跳ねる部分は隙間が大きい", "body": "マノンのSA2を普通にガードすると、端から離れて普通の端コンがしにくい。実は跳ねる部分のフレームがめちゃくちゃ空いている。", "themes": ["matchup"], "chars": ["マノン"], "side": ""}], "title": "30秒キャラ対策「マノンのSA2への確定」【スト6】", "date": "20260714", "duration": 30, "views": 16294, "short": true, "ch": "kamiki"}, {"id": "KMrV_6C9Huw", "kind": "JP対策", "level": "上級", "summary": "JPのセットプレイ3種（一番おなじみのセット・大P後の通常セット・大Pから直接のOD設置）と、それぞれへの対応を解説する動画。最終的にはじゃんけんなので完全な対応は無理だと前置きし、各択を狩れる行動と避けたい行動を示す。バーンアウト中の同じ連携にも触れる。", "takeaways": ["設置後は結局じゃんけん", "OD設置は連ガで暴れが負ける", "大P直接のOD設置は警戒して返す"], "characters": ["JP"], "themes": ["setplay", "defense", "offense"], "version_sensitive": true, "version_note": "2026年6月の動画で語られたJPのセットプレイ。調整で変わっている可能性がある", "points": [{"t": 222, "head": "起爆からのラヴーシュカはリバーサルで返す", "body": "起爆からラヴーシュカにつなぐ形は、真面目にガードするのはほぼ無理だ。ドライブリバーサルが当たるので、様子見されない限り、崩しに来たと判断してドライブリバーサルで返すのがおすすめ。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "vs_jp"}, {"t": 292, "head": "バーンアウト中も同じ連携が来る", "body": "バーンアウト中も全く同じ連携が来る。トリグラフから始まり、小P、トルバランまで連ガになる。できるならトリグラフを見てから、SA3 や SA2 を撃つのが一番よい。", "themes": ["setplay", "resource", "defense"], "chars": ["JP"], "side": "vs_jp"}], "title": "【コメントで補足あり】【スト6/JP対策】必須知識！JPのセットプレイ3種とその対応", "date": "20260627", "duration": 318, "views": 15917, "short": false, "ch": "kamiki"}, {"id": "e7Q0yLE3Wlc", "title": "JPとイングリッドの明確な違いについて解説するりゅうせい【スト6】", "date": "20260607", "duration": 592, "views": 16078, "short": false, "ch": "ryusei", "kind": "講座", "level": "全般", "summary": "新キャラのイングリッドを触りながら、JPとの違いを話す動画。違いはフィジカルで、JPは技が強すぎて対策されても殴り勝てると見る。結論として、メインキャラはJPで続けると話す。", "takeaways": ["イングリッドとJPの違いはフィジカル", "イングリッドは通常技が短い", "JPは対策されても殴り勝てる", "メインキャラはJPで続ける"], "characters": ["JP", "イングリッド"], "themes": ["matchup", "neutral"], "version_sensitive": true, "version_note": "2026年6月の動画。2026年8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 311, "head": "イングリッドは火力が高い", "body": "火力が高く、最後までキャラクターを支える要素になる。この技さえ当てれば試合を取り切れる、という瞬間が増えるはずだ。SA2もしっかり択になっていて、期待できると話す。", "themes": ["matchup", "combo"], "chars": ["イングリッド"], "side": ""}, {"t": 338, "head": "投げの攻防からSA2で崩すコンセプト", "body": "イングリッドは、投げの攻防からSA2で崩すコンセプトだろうと見る。大攻撃から発動するなど、期待値の高い読み合いを仕掛けられる。", "themes": ["matchup", "offense"], "chars": ["JP", "イングリッド"], "side": ""}]}, {"id": "6KiwTTmt84Y", "title": "JPのハメが酷すぎてリスナーがアンチ化するりゅうせい配信【スト6】", "date": "20260513", "duration": 858, "views": 24256, "short": false, "ch": "ryusei", "kind": "プレイ", "level": "上級", "summary": "mochi先生が作った連携を、実戦で狙っていく配信のダイジェスト。連携の成功を確かめながら、SA1の使いどころやSAゲージの回収、ゲージを抱えたまま負けないことなどを、プレイの合間に解説する。", "takeaways": ["mochi先生の連携を実戦で使い、新しいルートを試合中に出せた", "SA1はコンボには使わず、最終局面のリーサルで使う", "コンボを途中で切ると、SAゲージを回収できる", "ゲージを残したまま負けるのは、もったいない"], "characters": ["JP"], "themes": ["setplay", "resource", "combo"], "version_sensitive": true, "version_note": "2026年5月の動画。2026年8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 523, "head": "コンボを切るとSAゲージを回収できる", "body": "ラヴーシュカのコンボは強いが、コンボを途中で切った方がSAゲージを回収できるというメリットがあると話す。", "themes": ["resource", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "A48h7RIMk2k", "title": "JP武器商人から完全二択ハメを伝授されて徹底研究するりゅうせい【スト6】", "date": "20260423", "duration": 812, "views": 17911, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、択を重ねるセットプレイを、りゅうせいが試して詰める動画。「F式」の使いどころ、垂直ジャンプにする理由、ガードされたときの形を確かめ、欠陥が見つかった連携はボツにして別の連携に切り替える。", "takeaways": ["F式は、ガードされても有利で、崩れても減る", "垂直ジャンプにすると、前ジャンプよりフレームが良い", "相手の防御方法や理解度で、連携を変える", "欠陥が見つかった連携は、使わずに切り捨てる"], "characters": ["JP"], "themes": ["setplay", "offense", "resource"], "version_sensitive": true, "version_note": "2026年4月の動画。2026年8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 330, "head": "崩した後にラヴーシュカを2回使える", "body": "崩した後にSA2が溜まり、ラヴーシュカのコンボ後にもFができる。字幕では、1回の流れでSAゲージを4本使えると話している。崩れた場合は約4000点だと言う。", "themes": ["setplay", "resource", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "fzQGv9jGRJQ", "title": "【緊急】大型アプデでJPが超絶弱体化して絶望するりゅうせい【スト6】", "date": "20260317", "duration": 734, "views": 35811, "short": false, "ch": "ryusei", "kind": "講座", "level": "全般", "summary": "2026年3月17日のバトル調整で入ったJPの変更を、調整リストを読み上げながら確認する動画。投げ後の攻めやしゃがみ中Pが大きく弱体化した一方、ヴィーハト起爆のキャンセル追加は強化だと評価する。", "takeaways": ["画面端の前投げの有利が下がり、投げ後の攻めが弱体化", "設置後の追撃はドライブラッシュが前提になった", "しゃがみ中Pは差し返されやすくなった", "起爆（ヴィーハト・チェーニ）が立ち中P・中足などから出せるようになった", "SA2ラヴーシュカは調整されなかった"], "characters": ["JP"], "themes": ["patch", "setplay", "offense"], "version_sensitive": true, "version_note": "2026年3月の動画。2026年3月17日の調整の直後の内容で、2026年8月3日の調整より前のため、調整で変わっている可能性がある", "points": [{"t": 562, "head": "SA2ラヴーシュカは調整なし", "body": "SA2ラヴーシュカは調整されなかった。ラヴーシュカが調整されていたらきつかったと話す。これが残っている限り、JPは強いだろうと見る。", "themes": ["patch"], "chars": ["JP"], "side": "jp"}]}, {"id": "_mOPb3s_vtI", "kind": "JP講座", "level": "上級", "summary": "JP の大Pラッシュからの読み合いを、JP 側のメリットと相手側の対処の両面から解説する。大Pラッシュは相手の無敵技をガードでき、遅らせ投げ抜けには大Pラッシュ大Kが勝つ。後半は、遅らせ投げ抜けのタイミングを何度かやって掴む方法を説明する。", "takeaways": ["大Pラッシュは相手の無敵技をガードできる", "遅らせ投げ抜けには大Pラッシュ大Kが勝つ", "遅らせ投げ抜けは何度かやって感覚を掴む"], "characters": ["JP"], "themes": ["offense", "defense", "practice"], "version_sensitive": true, "version_note": "2026年3月の動画（配信は2026年2月）。JP の大Pラッシュ後の読み合いとフレームが前提で、調整で変わっている可能性がある", "points": [{"t": 0, "head": "大Pラッシュはラヴーシュカの崩しや連携構成に使う", "body": "神木Cが大Pラッシュを最もよく使う場面は、ラヴーシュカで崩しに行くときと、連携を組むときだ。大Pラッシュをした時点で JP 側が有利になっている。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 46, "head": "遅らせ投げ抜けには大Pラッシュ大Kで勝つ", "body": "遅らせ投げ抜けに勝つのは大Pラッシュ大Kだ。大Kをガードされるとラヴーシュカの固めに行ける。嫌がって昇竜を出せば遅らせ投げでガードされるかもしれず、相手にとっては非常に難しい読み合いになる。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】全actレジェンドJPが教える、大Pラッシュの読み合いについて【配信切り抜き】", "date": "20260303", "duration": 296, "views": 4467, "short": false, "ch": "kamiki"}, {"id": "k7wcmJH9vuQ", "kind": "JP講座", "level": "中級", "summary": "配信でJPの大Pラッシュからの択を説明した切り抜き。大Pラッシュを当てた時点でJP側が有利で、遅らせ投げ・大攻撃・ラヴーシュカの固めを使い分けて相手を迷わせる。", "takeaways": ["大Pラッシュの時点でJP有利", "遅らせ投げは相手の小Pに負ける", "大攻撃で遅らせ投げの穴を埋める"], "characters": ["JP"], "themes": ["offense", "setplay"], "version_sensitive": true, "version_note": "2026年3月の動画。JPの性能や調整で変わっている可能性がある", "points": [{"t": 0, "head": "大Pラッシュ後はラヴーシュカの固めかラッシュ中段", "body": "一番よく使うのは、ラヴーシュカで連係を組む形と、ラッシュ中段に行く形。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}, {"t": 22, "head": "遅らせ投げに負ける小Pには大Pラッシュ後の大攻撃", "body": "遅らせ投げが小Pに負けるので、それに勝つ選択肢として大Pラッシュ後の大攻撃を使う。これをガードされても、ラヴーシュカの固めに行ける。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}], "title": "【スト6/JP】大Pラッシュ、とは", "date": "20260303", "duration": 51, "views": 6301, "short": true, "ch": "kamiki"}, {"id": "BEplhfuLv4I", "title": "萎えて諦めてしまう捨てゲーニキにガチ説教するりゅうせい【スト6】", "date": "20260303", "duration": 1258, "views": 13913, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "JP を使う視聴者のランクマのリプレイを見て、りゅうせいがコーチングする動画。設置の流れ、弾を打たない意識、飛びのテスト、キャンセルラッシュのコンボ練習、ラヴーシュカの使いどころを順に指摘する。最後は勝ち試合も見て、勝ちパターンを確かめる。", "takeaways": ["ダウンを取ったら設置に行き、少し前に歩いて弾が消えない位置を取る", "相手は勝手に飛んでくるので、弾は反射で打たない", "正面飛びとめくり飛びで、相手が対空を出すかテストする", "キャンセルラッシュを使うコンボはトレモで反復する"], "characters": ["JP"], "themes": ["setplay", "neutral", "antiair", "combo", "resource", "practice"], "version_sensitive": true, "version_note": "2026年3月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 1074, "head": "連続ガードでない連携は隙になる", "body": "連続ガードになっていない連携は、相手に切り返されるポイントになる。隙を作るので、できればラヴーシュカに行きたかった場面だと言う。字幕が荒れていて、切り返しの手段は読み取れない。", "themes": ["setplay", "offense"], "chars": ["JP"], "side": "jp"}, {"t": 1103, "head": "ラヴーシュカは大きく取れる場面で使う", "body": "ゲージが溜まったら（字幕では「2溜まったら」）、大きく取れるポイントでは、とりあえず発動してよい。", "themes": ["resource", "offense"], "chars": ["JP"], "side": "jp"}, {"t": 1167, "head": "バクステ設置とラヴーシュカの崩し", "body": "後ろステップから設置に行く形をすすめる。地上の技を当てる過程を飛ばして設置の状況を作れ、距離を取りたいときに使える。ラヴーシュカは、相手がガード練習をしていないとガードしきれず、通りやすいと言う。", "themes": ["setplay", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "tXrlw3jpnDQ", "title": "【最強】レジェンドJP使いが立中Pの最強の使い方を解説！！ストリートファイター６【スト6】", "date": "20260228", "duration": 600, "views": 6969, "short": false, "ch": "nandene", "kind": "JP講座", "level": "上級", "summary": "JPの立ち中Pの使い方を、空振りを減らす練習、ドライブゲージ回復、設置中の置き、大Pの差し返し対策の4つで解説する動画。マスター未満やMR1500以下には難しい技で、設置の使い方が分かるMR1600ごろからで遅くないと話す。", "takeaways": ["牽制技が噛み合う原因はほとんどが空振り", "立ち中Pはガードさせるとドライブゲージが約0.5本回復する", "設置中の立ち中P置きはガードされても約1本回復する", "大Pを差し返す相手には立ち中Pで先端を当てる", "MR1600ごろから使うのでも遅くない"], "characters": ["JP"], "themes": ["neutral", "resource", "setplay", "practice"], "version_sensitive": true, "version_note": "2026年2月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 225, "head": "ガードされても約1本回復し、次の攻めにつながる", "body": "立ち中Pのガード分と設置のガード分で、ゲージが約1本回復する。そのままラッシュで寄ったり、設置ガードからの詐欺飛びでジャンプ大Kをガードさせて打撃と投げの2択にいける。SA2で自分のゲージを回復しつつ崩す手もある。", "themes": ["setplay", "resource", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "mmJusdic1Yg", "title": "MRが絶対上がる！JPの地上戦・弾打ち理論をプロが完全解説【りゅうせい・スト6】", "date": "20260217", "duration": 2231, "views": 61003, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "中級", "summary": "りゅうせいがJPの地上戦と弾打ち（シューティング）の考え方を解説する講座。中足と大Pの使い方、設置の回数、ドライブゲージの管理、弾を撃つ時のフレームの見方を順に話す。", "takeaways": ["差し合いは危険な距離に入らず、中足ヒット後や有利を取った後は大Pをガードさせる", "勝率が高い試合は設置の回数が多い。立ち回りでもOD設置を使ってよい", "弾はヒットよりドライブゲージの回復が目的。連射せず、マイナスフレームでボタンを押さない", "設置の後は弾ではなく打撃で行く"], "characters": ["JP"], "themes": ["neutral", "setplay", "resource", "defense", "offense"], "version_sensitive": true, "version_note": "2026年2月の動画。2026年8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 999, "head": "ドライブゲージを削り、バーンアウトからラヴーシュカへ", "body": "大Pを一発ガードさせて、相手のドライブゲージの回復を止める。ゲージが3.5本ほどの相手に一発ガードさせ、キャンセルラッシュすれば割れる状況を作るのは強い。パリィで逃げる相手には大Pからのトルバランのフェイントが刺さり、バーンアウトさせてラヴーシュカに繋げるのが分かりやすい勝ちパターンだ。", "themes": ["resource", "neutral"], "chars": ["JP"], "side": "jp"}, {"t": 1139, "head": "技がガードでもSAゲージが溜まる長期戦", "body": "殴るほどSAゲージが溜まるので、技がヒットしなくてもよい。JPはSA2が他のキャラより強いので、時間をかけてSA2を貯めて倒す戦い方が成立する。負けない選択肢を取って試合を長引かせる方がJPは強く、最近はタイムアップが増えたと話す。", "themes": ["resource", "neutral"], "chars": ["JP"], "side": "jp"}]}, {"id": "UBsoBb01LOw", "title": "噂のJP墓場連携を研究したらぶっ壊れすぎて驚愕するりゅうせい【スト6】", "date": "20260211", "duration": 721, "views": 15337, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として、JP墓場連携を紹介しながら検証する動画。ガードの上から完全2択になる一方、ガードされると不利で、キャラの体格によって入るかが分かれる。画面端は全キャラに入り、中央ではキャラを見極めて使う。", "takeaways": ["ガードの上から完全2択になる", "ガードされるとマイナスで、パニッシュカウンターの投げが怖い", "大きいキャラは画面中央でも連携が組める", "入るかどうかはキャラごとに違う", "画面端は全キャラに入る"], "characters": ["JP"], "themes": ["setplay", "offense", "matchup", "resource"], "version_sensitive": true, "version_note": "2026年2月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 301, "head": "相手がバーンアウトした時", "body": "相手がバーンアウトしている場合は、SA2発動からの削りより、1回走ってからの削りの方が高いこともわかったと話す。字幕が荒れており、条件は読み取れない。相手のドライブゲージが回復していなければ、シューティングして設置した方が削れそうだとも話す。", "themes": ["resource", "setplay"], "chars": ["JP"], "side": "jp"}]}, {"id": "qpkmEdkXC9M", "title": "絶対無理とJPのリーサル諦めてたら誠さんが降臨して解決してくれました【りゅうせい・スト6】", "date": "20260208", "duration": 515, "views": 7908, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として、画面端まで運ぶ難しいJPのコンボルートを紹介し、りゅうせいが再現に挑戦する動画。起爆のヒットからジャンプ中Kを使うルートで、距離調整と1〜2フレームの目押しが要る。何度も失敗した末に成功し、難易度は相当高いと話す。", "takeaways": ["自力では見つけられなかったルートを視聴者が見つけた", "起爆のヒット後にジャンプ中Kを使う", "距離調整が非常にシビア", "1〜2フレームの目押しが必要", "再現に時間がかかる高難度コンボ"], "characters": ["JP"], "themes": ["combo", "practice"], "version_sensitive": true, "version_note": "2026年2月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 57, "head": "自力では見つけられなかった状況", "body": "起爆のヒット後、画面端が遠く、SA2を使っても足りないと考える。前日にたくさん探したが見つからなかったと話す。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 192, "head": "SA2までのコンボルートが大事", "body": "SA2までのコンボルートが大事だと話す。ドライブラッシュを使うルートだが、字幕が荒れており、技の順番は読み取れない。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "RPQg5ZnqTqo", "title": "システムに喧嘩売るJP武器商人のセットプレイに驚愕するりゅうせい【スト6】", "date": "20260206", "duration": 529, "views": 24258, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として、インパクトで返しにくいJPのセットプレイを紹介する動画。起爆を重ねてインパクトを割る形で、返すには反応が必要だが猶予は短い。ジャストパリィへの対応や、補正切りの追撃も検討する。", "takeaways": ["インパクトが割れる形のセットプレイ", "返すには反応が必要で、猶予が短い", "インパクトを返す習慣のある相手に刺さる", "補正切りの追撃にジャンプ中Kと強ストリボーグを使う", "アブニマーチは補正切りの手段としては弱い"], "characters": ["JP"], "themes": ["setplay", "offense", "system"], "version_sensitive": true, "version_note": "2026年2月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 168, "head": "飛び道具の間はSAゲージが溜まらない", "body": "ラヴーシュカの連携は、飛び道具が出ている間、SAゲージが溜まらない。インパクトの後のOD設置の起爆から、ゲージ回収が始まる。", "themes": ["resource", "setplay"], "chars": ["JP"], "side": "jp"}]}, {"id": "hXb9uM0bOco", "title": "「JPの特権！」再評価された確定ガー不連携がエグすぎて歓喜するりゅうせい【スト6】", "date": "20260124", "duration": 715, "views": 15921, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "SA2からの確定ガード不能連携を、視聴者の意見を取り入れながら再評価する動画。ガードの難しさ、ダメージの比較、小技・中攻撃始動での入り方、使いどころを検証し、リーサルに届かないときの手札として有力だと結論づける。", "takeaways": ["SA2からのガード不能連携は、ガードの仕方が分かっていてもほぼ食らう", "相手の対処は空対空で、地上対空はできない", "小技始動からも中攻撃始動からも入るルートがある", "大Pなどからは普通にフルコンボのほうが減る場面もある", "リーサルに届かないとき、バーンアウト中の小技・中攻撃始動で使う"], "characters": ["JP"], "themes": ["combo", "offense", "resource"], "version_sensitive": true, "version_note": "2026年1月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 34, "head": "SA2からのガード不能連携を再評価する", "body": "JP使いの意見を募りつつ、SA2からの確定ガード不能連携は強いのではないかと考える。確定ダメージのようなもので、いざという場面でできれば試合を決められると話す。", "themes": ["combo", "offense"], "chars": ["JP"], "side": "jp"}, {"t": 654, "head": "ドライブゲージも回収できる", "body": "SA2の効果が切れたあと、切れた分のコンボでドライブゲージが溜まって回収できる。ここも優秀な点だと話す。", "themes": ["resource", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "YinJdLW7MAQ", "title": "「JPまだ伸びるの！？」武器商人が開発した超おしゃれな最大ルートに感動するりゅうせい【スト6】", "date": "20260119", "duration": 652, "views": 20158, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、ドライブゲージがたっぷりあるときの最大ルートを、りゅうせいが検証する動画。字幕では4000台後半のダメージが出る。難しい目押しも多く、実戦でどこまで使えるかを話しつつ、難度の高いルートの練習もする。", "takeaways": ["視聴者の研究として最大ルートが紹介される", "字幕では最大ダメージが4760、4830と更新される", "SA1・SA2・SA3のどれでも行けるルートがある", "目押しが多く、1か所のミスでつながらない", "実戦では、簡単な設置ルートのほうが使いやすい場面もある"], "characters": ["JP"], "themes": ["combo", "resource", "practice"], "version_sensitive": true, "version_note": "2026年1月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 55, "head": "手持ちのルートでは足りない", "body": "手持ちのルートを試すが、SA1を使っても足りない。視聴者の研究者から設置を使うルートを教わり、SA2につなぐルートがあることに驚く。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 188, "head": "SAを問わず使える", "body": "字幕では、SA1、SA2、SA3のどれにでも行けるルートだと確認する。字幕では、最大ダメージは4760から4830に更新される。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 388, "head": "SA2の最大ルートは設置を入れる", "body": "SA2を使う最大ルートでは、設置を入れたほうが高い。字幕では4080から4110に伸びる。発動後にゲージが残り、少し伸ばしたい場面で使えると話す。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "6EvRH7Su0Wg", "title": "「予想を超えてきた」JP武器商人が神セットプレイを開発して驚愕するりゅうせい【スト6】", "date": "20260109", "duration": 780, "views": 27533, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、設置を使ったJPの連続ガード連携を試す動画。ガードさせたあとにバーンアウトさせ、ゲージを温存したまま攻める形を詰めていく。字幕が荒れていて、技の並びの細部は確定できない。", "takeaways": ["設置からの連続ガード連携を視聴者の研究として紹介", "最速入力で組めて目押しが要らないことを評価", "バーンアウトさせると、ゲージ差が大きく付く", "相手だけ割れてラヴーシュカを受けてもらう形を最強候補と話す"], "characters": ["JP"], "themes": ["setplay", "resource", "offense"], "version_sensitive": true, "version_note": "2026年1月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。具体的なフレームやゲージ消費に依存する内容である", "points": [{"t": 663, "head": "相手だけ割れてラヴーシュカを受けてもらう", "body": "自分が割れなくてよい。相手だけ割れてラヴーシュカを受けてもらい、ゲージを温存したまま攻めるのが最強かもしれないと話す。", "themes": ["resource", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "LWbd0EOcF5w", "title": "「翔のプレイは宝」翔JPの完成度が高すぎて感動するりゅうせい【スト6】", "date": "20251229", "duration": 671, "views": 82499, "short": false, "ch": "ryusei", "kind": "プレイ", "level": "上級", "summary": "りゅうせいの解説では、プロの翔の JP のリプレイから、ガイル戦とルーク戦を見て、歩きガード、ゲージの使い方、ジャストパリィ、ラヴーシュカの使いどころを拾っていく。最後に、歩きガードがうまい理由を、技のリーチと相手の反応の観察から説明する。", "takeaways": ["翔は立ち合いが硬く、歩きガードで被弾しない", "ゲージに余裕があるときは、キャンセルラッシュで入って投げを仕掛ける", "技を当てたい気持ちを我慢して、まずガードする", "歩きガードは、技のリーチを覚えて危険な間合いで細かく入れる"], "characters": ["JP"], "themes": ["neutral", "defense", "resource", "offense"], "version_sensitive": true, "version_note": "2025年12月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 327, "head": "ラヴーシュカはドライブラッシュを挟まずに使う", "body": "ラヴーシュカをドライブラッシュを挟まずに発動すると、ゲージが大きく回復する。字幕では、ゲージが「めちゃくちゃ回復する」と言っている。", "themes": ["resource", "offense"], "chars": ["JP", "ルーク"], "side": "jp"}]}, {"id": "rXwyfFqjDrw", "title": "この世で最も無駄なJPコンボを学んでキレるりゅうせい【スト6】", "date": "20251212", "duration": 671, "views": 8152, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "視聴者が送ってきた、実用性の低いJPのネタコンボを試す動画。ジャンプ中Kを連続で当てる形、SA2のあとに挑発するコンボなどを試し、最後に実践で練習した方がよい最大ルートにも触れる。", "takeaways": ["ジャンプ中Kを連続で当てるコンボは、補正で全く減らない", "実践で練習するならしゃがみ中Pからトリグラフのルート", "OD設置を使えば4回当てるルートもある", "本人は、ネタとして紹介していて、実用性は低いと話す"], "characters": ["JP"], "themes": ["combo", "practice"], "version_sensitive": true, "version_note": "2025年12月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。コンボは補正やフレームに依存する", "points": [{"t": 362, "head": "SA2のあとに挑発してラヴーシュカを当てる", "body": "Xで見かけたという、SA2のあとに挑発するとラヴーシュカが4回当たるコンボを試す。字幕では前半のルートは聞き取れない。挑発は必要なく、挑発なしでもできると確かめる。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "YBH6eV6PRPM", "title": "異次元の地上戦を魅せたあくたがわ戦を解説するりゅうせい【スト6・CPTWW】", "date": "20251202", "duration": 818, "views": 39082, "short": false, "ch": "ryusei", "kind": "プレイ", "level": "上級", "summary": "CPT ワールドウォーリアの TOP8 で当たったあくたがわ戦を、自分の試合を見返しながら解説する動画。差し返しと置き技、JP 狩りの前ジャンプ、SA2 を軸にしたゲージ計画など、相手の地上戦の圧に対して何を考えて動いたかを話す。", "takeaways": ["相手は空振りを差し返し、前に出ると置き技が先にある", "JP がシューティングや設置をしたい距離を前ジャンプで狙われる", "トルバランは SA2 を発動するための布石にもなる", "バーンアウトを狙える場面はシューティングで削り切る"], "characters": ["JP"], "themes": ["neutral", "antiair", "resource", "matchup", "offense"], "version_sensitive": true, "version_note": "2025年12月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 176, "head": "画面端では下がってゲージを貯め、SA2 を狙う", "body": "画面端に来たので、一旦下がってゲージを貯め、もう一度 SA2 を撃つ計画を立てた。SA ゲージは1.8本ほどだったので、シューティングで時間を使い、遠距離でゲージを稼ぐ。", "themes": ["resource", "neutral"], "chars": ["JP"], "side": "jp"}, {"t": 361, "head": "トルバランを撃つ理由は SA2 を発動するため", "body": "トルバランをガードさせれば SA2 を発動でき、相手がバーンアウト状態になる。SA2 を使えばほぼ勝ちだが、相手はそこまで読んで弾抜けを狙ってくる。トルバランを見られているということで、相手のレベルの高さを示している。", "themes": ["resource", "neutral", "matchup"], "chars": ["JP"], "side": "jp"}, {"t": 672, "head": "大Pをキャンセルしなかったのは相手の SA2 が怖いから", "body": "大Pをキャンセルしない理由は、相手の SA2 の割り込み精度が高かったから。食らうと画面中央まで戻される。相手があくたがわでなければキャンセルしていたかもしれない、とも話す。", "themes": ["neutral", "matchup"], "chars": ["JP"], "side": "jp"}]}, {"id": "tsEEb9-973g", "title": "ハメ開発力が高すぎてついにシステムを破壊したJP研究員に驚愕するりゅうせい【スト６】", "date": "20251115", "duration": 482, "views": 12569, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、設置とヴィーハトの起爆を重ねて、ジャストパリィしないとバーンアウトが確定する連携を試す動画。ヴィーハトが攻撃を担当し、本体は様子を見られる点を高く評価する。字幕が荒れており、細部は要確認。", "takeaways": ["設置の起爆を重ねると、ジャストパリィしないとバーンアウトが確定する", "ヴィーハトに攻撃させ、本体は様子見できるのが理想", "無敵技との読み合いをしなくて済み、安全", "無敵技をガードしたあとは、インパクトで割る形が価値が高い"], "characters": ["JP"], "themes": ["setplay", "resource", "offense"], "version_sensitive": true, "version_note": "2025年11月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。フレームの重なりに依存する内容である", "points": [{"t": 438, "head": "無敵技ガード後のインパクトは価値が高い", "body": "無敵技をガードしたあとは、インパクトを出すのが最適なことが多い。JPはラヴーシュカが付いてくるので、他のキャラより価値が高い。選べるようにしたいと話す。", "themes": ["resource", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "o_E9F7DRYac", "title": "JP武器商人が神の間合いでハメるセットプレイを開発して感動するりゅうせい【スト６】", "date": "20251108", "duration": 608, "views": 9806, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "上級", "summary": "視聴者の研究として紹介された、弾を重ねて連続ガードで固めるセットプレイを試す動画。相手のSA1やSA2を無効化しつつ、読み合いをさせずに一方的に攻める考え方を話す。", "takeaways": ["弾を重ねて、相手のSA1を無効化しながら連続ガードで攻める", "リーチの短いキャラのSA2は、少し下がると届かない", "当たればノーゲージのコンボでドライブゲージが回収できる", "連携に1フレームでも隙間があると負ける。相手に抵抗させない形を選ぶ"], "characters": ["JP"], "themes": ["setplay", "offense", "resource"], "version_sensitive": true, "version_note": "2025年11月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 119, "head": "弾の重ねで相手のSA1を無効化する", "body": "JPが戦いにくいのは、弾に対して無敵技で返される状態だと話す。SA1なら弾を重ねておけばいい。ルークのSA2のように弾が消えてしまう状態は面倒だと話す。", "themes": ["setplay", "defense"], "chars": ["JP"], "side": "jp"}, {"t": 176, "head": "リーチの短いキャラなら他のSA2も無効化できるか探す", "body": "この連携で、他のキャラのSA2も無効化できるかを探る。当たらなければ相手のSA2を無効化できるので、リーチの短いキャラの確認が重要だと話す。", "themes": ["setplay", "matchup"], "chars": ["JP"], "side": "jp"}, {"t": 214, "head": "豪は前進するので当たる。バイパーで試す", "body": "豪のSA2は前進するので当たってしまうと話す。相当リーチの短いキャラでないとだめだとして、バイパーのSA2で試す。", "themes": ["setplay", "matchup"], "chars": ["JP"], "side": "vs_jp"}]}, {"id": "nyFNgnzjV3M", "title": "これ一本で全てわかるJPコンボ講座【りゅうせい・スト６】", "date": "20251025", "duration": 1503, "views": 151769, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "りゅうせいがYear3時点のJPコンボを、小技始動・中攻撃始動・画面端・SA2・インパクト始動などの場面別に紹介する講座。ゲージを使わないルートと最大ダメージのルートを見比べながら進む。", "takeaways": ["小技を繋ぐ時は、しゃがみ小Pより立ち小Pの方がリーチが長い", "画面端のコンボは、ラッシュ前大Kを入れると火力が伸びる", "トリグラフの後に通常設置を置くと、投げから追撃できる", "天狗コンは、歩いてドライブゲージを回収しながら火力を出す", "無敵技をガードした後は、しゃがみ大Kを当てておけば火力が出る"], "characters": ["JP"], "themes": ["combo", "setplay", "resource"], "version_sensitive": true, "version_note": "2025年10月の動画。2026年8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 655, "head": "SA2のコンボは別動画、ドライブゲージを2本奪うルート", "body": "SA2を使うルートは数が多すぎるので、専用のラヴーシュカ動画を作ったと話す（概要欄にリンク）。ラヴーシュカを発動して設置からフレーム消費を絡める形は、全部最速入力でよい。相手のドライブゲージを2本奪えるルートがあり、さらに削るルートでは2.5本ほど奪える。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "7K1G-oy2RHQ", "title": "【緊急】ヴァイパー追加の陰に隠れてJPが強化された事に歓喜するりゅうせい", "date": "20251016", "duration": 546, "views": 11981, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "2025年10月15日のアップデートで入った、OD トルバランの調整を解説する動画。コンボ中に浮いた相手へ空振りしていた現象が減り、クラシックでもモダンでもコンボが安定するという。", "takeaways": ["OD トルバランに、コンボ中のみヒットする攻撃判定が付いた", "浮かせた後のOD トルバランが空振りする現象が減った", "弱・中のトルバランも当たりやすくなる、という最初の理解は勘違いだった", "調整の強さよりも、次の調整での弱体化を心配している"], "characters": ["JP"], "themes": ["patch", "combo"], "version_sensitive": true, "version_note": "2025年10月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。調整を解説する回で、のちの調整で変わっている可能性が高い", "points": [{"t": 132, "head": "画面中央のOD トルバランからSA2も選びやすい", "body": "画面中央のコンボでは、浮かせた後にOD トルバランを1段で止めてSA2につなぐ場合がある。OD トルバランが空振りしにくいという信頼感があるので、自信を持って選べると話す。", "themes": ["combo", "patch"], "chars": ["JP"], "side": "jp"}, {"t": 405, "head": "OD トルバランからつなぐルートが増える", "body": "OD トルバランが当たりやすくなったことで、浮かせた後にSA1もつなげられる。OD トルバランからトリグラフ、SA2へのルートもある。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "qV-KgJ9Uwrw", "title": "【ゲージ別】レジェンドJPが設置後にやるべき行動解説！ストリートファイター６【スト６】", "date": "20250925", "duration": 548, "views": 9161, "short": false, "ch": "nandene", "kind": "JP講座", "level": "中級", "summary": "JPが設置をした後の行動を、自分のドライブゲージの本数別に解説する動画。冒頭では、設置に対して後ろ下がりする相手に追いかけず、無限設置などで相手に攻めさせる考え方を話す。", "takeaways": ["下がる相手をラッシュで追いかけない", "5本以上は設置からラッシュで攻める", "3、4本は無限設置で回復し、近い相手には置きを置く", "1、2本は置きからの無限設置で時間を稼ぐ", "設置直前の置きは、ガードされても約1本回復する"], "characters": ["JP"], "themes": ["setplay", "resource", "neutral", "offense"], "version_sensitive": true, "version_note": "2025年9月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 283, "head": "置きのガード分と設置のガード分で約1本回復", "body": "このゲージ状況でも、相手が設置の内側にいるときは、歩きを止める置き技が強い。通常技のガード分と設置のガード分で、ゲージが約1本回復する。SA2があるときは、置きの後の設置ガードから前ジャンプで、立ち小KからSA2を発動して崩す手もある。", "themes": ["setplay", "resource", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "aI6OgnkAk9o", "title": "【SA2】レジェンドJPがラヴーシュカの強い発動タイミングを解説！！【スト6】", "date": "20250913", "duration": 539, "views": 16732, "short": false, "ch": "nandene", "kind": "JP講座", "level": "上級", "summary": "JPのSA2、ラヴーシュカの強い発動タイミングを、相手のドライブゲージが2本以下のとき、画面端のコンボ後にパニッシュカウンター投げで倒せるとき、相手がバーンアウトしているときの3つで解説する動画。マスター未満はSA3にゲージを回すほうが勝率が高いと話す。", "takeaways": ["マスター未満はSA3にゲージを回すほうが安定する", "相手のゲージが2本以下なら、ガードさせて連ガを組めば確定でバーンアウト", "画面端のコンボ後は、2発目の弾の後に投げにいく", "相手がバーンアウト中なら、起き上がり発動から中足を差し込むと崩せる", "それ以外のときはSA2を保持し、リーサル用に残す"], "characters": ["JP"], "themes": ["resource", "offense", "combo", "setplay"], "version_sensitive": true, "version_note": "2025年9月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 0, "head": "SA2は発動タイミングを絞って使う", "body": "SA2の連携やコンボは知っていても、いつ発動すればいいか分からない人に向けた動画だ。コンボや基礎ができていないマスター未満は、不安定なSA2より、確実に高ダメージが入るSA3にゲージを回すほうが勝率が高い。", "themes": ["resource", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 55, "head": "相手のゲージが2本以下なら連ガを組む", "body": "SA2をガードさせた時点で、相手のドライブゲージが2本以下なら、連ガ連携を組めば相手は確定でバーンアウトする。途中でドライブリバーサルを打たれても、バーンアウトする。様子見は、確定バーンアウトの機会を逃す行為だと話す。", "themes": ["resource", "offense", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 110, "head": "画面端のコンボ後、パニカン投げで倒せる体力なら", "body": "画面端でコンボを伸ばし切り、相手がパニッシュカウンター投げで死ぬ体力のとき、起き上がりでSA2を発動すれば、9割の確率で倒せる方法があると話す。", "themes": ["offense", "combo", "setplay"], "chars": ["JP"], "side": "jp"}, {"t": 137, "head": "発動後すぐ投げにいかない", "body": "SA2発動後すぐに投げにいかない。最初の弾と2発目の弾の間に、相手が前ジャンプするかガードやパリィするかの2択が発生するので、投げにいくと2分の1で前ジャンプを通す。", "themes": ["offense", "setplay"], "chars": ["JP"], "side": "jp"}, {"t": 221, "head": "相手がバーンアウトしているとき", "body": "相手がバーンアウトしているときにSA2を発動すると、ほとんどの相手が勝手に崩れる。立ち小KからSA2を発動する場合は、中足か前ジャンプの連携がある。", "themes": ["offense", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 474, "head": "SA2は強い状況だけで吐き、リーサル用に残す", "body": "SA2はストリートファイター6で最強のSA2だと話す。ただ、今回紹介した状況のときだけ吐き、それ以外は保持して、最後のラウンドでいつでもリーサルで吐けるようにするほうが安定する。考えなしにSA2を吐くより、リーサルのためにSA3を残すほうが勝率は高い。", "themes": ["resource", "practice"], "chars": ["JP"], "side": "jp"}]}, {"id": "U4PkEEcJGzI", "title": "【最強】レジェンドJPが立大Kの最強の使い方を解説！【スト６】", "date": "20250907", "duration": 649, "views": 17144, "short": false, "ch": "nandene", "kind": "JP講座", "level": "中級", "summary": "JPの立ち強Kを、立ち回りで使う方法に絞って解説する動画。相手が不利を背負う場面を逆に利用する「無限フレーム」の考え方から、立ち強Kの打ち返しと、立ち強Kから大足につなぐ形を紹介する。", "takeaways": ["立ち強Kはヒット+7・ガード+2の強い性能だが、発生は12Fと遅い（字幕では）", "相手が不利を背負う連携をガードしたら、中足などの小さい技でなく立ち強Kで打ち返す手がある", "立ち強Kのあとの大足は先端で当たり、ガードされても反撃を受けにくい", "ガードを固めたり下がる相手には強いが、暴れる相手には潰される"], "characters": ["JP"], "themes": ["neutral", "resource", "offense"], "version_sensitive": true, "version_note": "2025年9月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。フレームやゲージ量の数字は字幕が荒れている", "points": [{"t": 442, "head": "端でSA2を持っているときの立ち強K", "body": "SA2を持っているとき、端で立ち強Kを当てると、入れ替えから狙う価値がとても高いと話す。", "themes": ["offense", "system"], "chars": ["JP"], "side": "jp"}]}, {"id": "ErtcjEw-Qa4", "title": "【キャラ対策】レジェンドJPがルーク戦を実戦付きで解説！【スト6】", "date": "20250902", "duration": 520, "views": 5103, "short": false, "ch": "nandene", "kind": "JP講座", "level": "中級", "summary": "JPでルークと戦うときの考え方を、弾ジャスパラッシュ、差し返し、必須知識の3つに分けて解説し、実戦で見せる動画。サプレッサー、強フラッシュナックル、起き攻めへの対応を挙げる。", "takeaways": ["ルークが弾を撃ったら、ジャスパラッシュを一度は見せたい", "ルーク戦は差し返しがトップクラスに大事", "サプレッサーは止めにいかず、ラッシュを見たら垂直ジャンプを置く", "強フラッシュナックルにはインパクト。ただし相手のSAゲージは見ておく", "起き上がりにアムネジアを打たず、対空を見る"], "characters": ["JP"], "themes": ["matchup", "neutral", "antiair", "defense"], "version_sensitive": true, "version_note": "2025年9月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。ルークの技の性能や確定反撃の話は、調整で変わっている可能性がある", "points": [{"t": 186, "head": "サプレッサーをインパクトで返す", "body": "SA2がたまっているとき、サプレッサーを読んでインパクトを当てると、字幕ではゲージを4本持っていける。ただし、相手がラッシュからサプレッサーを撃っていなかったら普通に返される。リスクは大きいと話す。", "themes": ["defense", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 335, "head": "実戦：SA2のあとにパニカン投げでリーサル", "body": "入れ替えのあと、パニッシュカウンターの投げでリーサルを狙うプランを立てる。SA2を使うと相手が普段よりパリィを押すようになるので、パニカン投げでのリーサルはおすすめだと話す。", "themes": ["offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "hgk0BqRRCo0", "title": "【最強】レジェンドJPがノーマル引き中Pの最強の使い方を解説！【スト6】", "date": "20250830", "duration": 422, "views": 14324, "short": false, "ch": "nandene", "kind": "JP講座", "level": "中級", "summary": "JPのノーマル引き中Pの使い方を解説する動画。相手の通常技の空振りに差し込む「巻き込み引き中P」を中心に、基本性能と実戦での使いどころを紹介する。", "takeaways": ["引き中Pは判定が小さく、差し返されにくい", "ラッシュ止めはリーチが長く発生も早いしゃがみ中Pのほうが使われる", "巻き込み引き中Pで、相手の通常技の空振りに差し込める", "空振りしても差し返されにくく、2段目派生も出ない"], "characters": ["JP"], "themes": ["neutral", "offense", "combo"], "version_sensitive": true, "version_note": "2025年8月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。コンボやフレームの話は、調整で変わっている可能性がある", "points": [{"t": 125, "head": "通常技を連続でガードさせてくる相手に刺さる", "body": "相手が通常技を連続で出し、最後の技が空振りのときに刺さる。特に画面端で相手の通常技をガードしているとき、SA2がたまっていれば、引き中Pの出し切りから入れ替えコンボを狙えると話す。", "themes": ["offense", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "mUocml2F7yc", "title": "【防御】最終レジェンドJPが防御法＆画面端の抜け方を徹底解説！！【画面端脱出】", "date": "20250715", "duration": 791, "views": 27484, "short": false, "ch": "nandene", "kind": "JP講座", "level": "全般", "summary": "設置が盤面にない前提で、JPの防御法と画面端からの抜け方を解説する動画。逆択の立ち強K、ラッシュガードアムネジアなど防御の引き出しを増やし、組み合わせて読まれにくくする。画面端の脱出方法は3つ紹介し、最後に実戦も見せる。", "takeaways": ["防御は引き出しを増やして組み合わせる", "起き上がりのODアムネジアは様子見に弱く、逆択の立ち強Kが刺さる", "ラッシュガードアムネジアで相手の2択を拒否できる", "画面端は設置の起爆に合わせて前ステで抜けられる"], "characters": ["JP"], "themes": ["defense", "resource", "setplay", "neutral"], "version_sensitive": true, "version_note": "2025年7月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 134, "head": "逆択の立ち強K", "body": "置き攻めや攻撃をガードさせられたあと、様子見をする相手にとても強い。ヒットしたらキャンセルラッシュからコンボにいける。SA2があれば、そのまま発動して入れ替えコンボからセットプレイに行ける。", "themes": ["defense", "offense"], "chars": ["JP"], "side": "jp"}]}, {"id": "GCa9lNVWY-M", "title": "【JP使い必見】レジェンドJPが設置の強い使い方解説！【スト６】", "date": "20250618", "duration": 700, "views": 32010, "short": false, "ch": "nandene", "kind": "JP講座", "level": "全般", "summary": "JPの設置を使った強い攻めを4つに絞って解説する動画。ラッシュからの強制二択、前ステップ強襲、疑似詐欺飛び、追いラッシュ二択を取り上げ、後半で実戦での使い方を見せる。", "takeaways": ["設置の起爆前にラッシュで攻めると、ガードされても二度崩せる", "起爆のガード硬直中に前ステップで入ると、ノーゲージで二択に行ける", "起爆の直前にジャンプすると、対空が潰れ、画面端の入れ替えにも使える", "ゲージがある時は、追いラッシュ二択で強く攻められる", "設置の使い方は、勝率を大きく左右する"], "characters": ["JP"], "themes": ["setplay", "offense", "resource"], "version_sensitive": true, "version_note": "2025年6月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 244, "head": "崩す時は少し間を空ける", "body": "崩したい時は、起爆ガードの硬直から小技で暴れられないように、少しだけ間を空けて打撃を重ねてダメージを取る。SA2がたまっている時は、この硬直を使ってSA2のルートも組めると話す。", "themes": ["setplay", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "7K9u3PcWeL8", "title": "【ヒット率90%超え】完全復活、真・なんでねースペシャルオリジンを最終レジェンドJPが解説！【感動】", "date": "20250611", "duration": 445, "views": 13561, "short": false, "ch": "nandene", "kind": "JP講座", "level": "上級", "summary": "2025年6月5日の調整で使えなくなった連携「なんでねースペシャルオリジン」を作り直した、「真・なんでねースペシャルオリジン」の紹介動画。ヒット率が高いこと、ジャストパリィが取りにくいことを2つの強みとして挙げ、実戦で何度も当てる。", "takeaways": ["6月5日の調整で、旧オリジンの途中の大足後に受け身が取れて距離が離れ、使えなくなった", "新しい連携は、途中で打撃を挟んでからアブニマーチで閉める", "打撃もアブニマーチも最速4F技で、暴れられない", "コンボの切れ目が分かりにくく、ガードやパリィをされても投げが当たる", "調整後のジャストパリィの仕様が、この連携の取りにくさを高めている"], "characters": ["JP"], "themes": ["setplay", "combo", "offense"], "version_sensitive": true, "version_note": "2025年6月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。連携の成立やヒット率は、当時の仕様に依存する", "points": [{"t": 150, "head": "狙える場面は限られる", "body": "旧オリジンと違い、入れ替えからは狙えず、崩した瞬間にも狙えない。SA2のワンコンボで殺しきれない時に狙うと、ほとんどの相手が食らうと話す。", "themes": ["setplay", "combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "x5FrEpiVY2c", "title": "【完全版】最終レジェンドJPによるコンボ＆セットプレイ解説！【year3対応】", "date": "20250509", "duration": 1186, "views": 124637, "short": false, "ch": "nandene", "kind": "JP講座", "level": "全般", "summary": "最終レジェンドに到達したなんでねーが、普段の試合で使うコンボとセットプレイを場面別に紹介する動画。コンボは小技・中技・大技・設置・インパクト・スタン・SA2・対空・飛びに分け、後半でOD設置を使ったセットプレイを解説する。", "takeaways": ["コンボは火力よりミスしにくさを優先する", "リーサルの場面ではゲージを使い切って伸ばす", "画面端か中央か、ゲージ量で使うコンボが変わる", "OD設置からは連続ガードで強制2択を迫れる"], "characters": ["JP"], "themes": ["combo", "setplay", "resource"], "version_sensitive": true, "version_note": "2025年5月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。概要欄によると、2025年6月5日のアップデート後もコンボ内容は同じでよい", "points": [{"t": 14, "head": "基本のコンボはしゃがみ小Pを連打して入力", "body": "基本のコンボは、しゃがみ小Pを連打しながらコマンドを入力すると成功しやすい。ガード後の確定反撃や、画面端で相手の技をプラス4フレーム以上取ったときに使う。ゲージがあるときは、キャンセルラッシュでコンボを伸ばしたり、SA2で入れ替えたりできる。相手がリーサルのときは、必ずゲージを全部使ってコンボを伸ばし切る。", "themes": ["combo", "resource"], "chars": ["JP"], "side": "jp"}, {"t": 172, "head": "コンボは火力よりミスしないことが一番大事", "body": "ダッシュしゃがみ中Pは、相手のラッシュ止めをつぶせる。字幕では、距離が足りなくてコンボミスにつながることがあるため、個人的には火力が低めでも安定する形で統一しているという。コンボは火力より、いかにミスしないかが一番大事で、SA2につなぐなど融通もきくと話す。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 717, "head": "バーンアウト中はSA2の連続ガードで崩す", "body": "バーンアウト中は、SA2につなぐルート1本でよい。SAを回されても安全で、レジェンド帯でも崩れない人は少数だと話す。通常時は別のルートがあるが、ODゲージを3本使うので注意する。", "themes": ["combo", "setplay", "resource"], "chars": ["JP"], "side": "jp"}]}, {"id": "TTBX6_0F0L8", "title": "【ヒット率90%】最強連携なんでねースペシャル・オリジンを解説", "date": "20250503", "duration": 393, "views": 9357, "short": false, "ch": "nandene", "kind": "JP講座", "level": "中級", "summary": "なんでねーが自作した連携「なんでねースペシャル」を解説する動画。起き上がりへの一度のセットプレイで実質2回の択を迫れるため、ヒット率が高いと話す。バーンアウト中の相手には別ルートがある。", "takeaways": ["一度のセットプレイで実質2択を迫れる", "ガード・パリィ側にはアブニマーチを当てる", "一度食らった相手には2度目も通りやすい", "バーンアウト中は大足から別ルートに変わる"], "characters": ["JP"], "themes": ["setplay", "offense"], "version_sensitive": true, "version_note": "2025年5月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある", "points": [{"t": 331, "head": "バーンアウト相手の実戦例とSA2", "body": "バーンアウトの相手に、実戦で大足から高火力が入る場面を見せる。SA2で相手が崩れた瞬間にも出せるのが強みだと話す。個人的には中段より下段のほうが当てやすいと言う。", "themes": ["setplay", "combo"], "chars": ["JP"], "side": "jp"}]}], "lives": [{"id": "4kt8x5v_xcg", "game": "スト6", "summary": "ランクマで2300を目指しながら視聴者の質問に答える配信。中央で大攻撃をガードさせる方法と、JPの勝ちパターンの考え方に答えた。コマ投げを持つキャラの対策についての考えも話した。", "highlights": [{"t": 4655, "head": "JPの勝ちパターンと立ち回りの目標", "body": "JPの勝ちパターンが分からないという質問への答え。勝ち方は2つで、1つは画面端でシューティングして完全に倒す形。もう1つはセットプレイで、一度読み合いに勝てば大きなリターンで一気に勝てる。どちらも大Pから大ストリボのコンボが前提になる。大P、しゃがみ中P、中攻撃などを当てて吹き飛ばすことをまず目標にする。インパクトを相手の入れ込みに当ててから攻める形や、ラヴーシュカで崩す形も挙げた。", "chars": ["JP", "アルジュン"], "themes": ["offense", "setplay", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】ぼちぼち2300にしたいランクマ", "date": "20261024", "duration": 9182, "ch": "kamiki"}, {"id": "ZtF7sNSdFQ4", "game": "スト6", "summary": "だらだらとランクマを回した配信。キンバリーのSA2に対して、トリグラフでなく起爆を使う理由を示し、ブランカとJPの相性という質問にも答えた。ランクマ中の実況が大半を占める。", "highlights": [{"t": 2401, "head": "キンバリーSA2にはトリグラフでなく起爆", "body": "視聴者の、トリグラフではだめなのかという質問への答え。トリグラフは、キンバリーのSA2の弾無敵が切れた直後に当たる形になるため、普通に無敵で負ける。ヴィーハトの起爆に替えると当たる、と実際に試して示した。この内容をショート動画にする案も出した。", "chars": ["JP", "キンバリー"], "themes": ["setplay", "matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策", "セットプレイ"]}], "title": "【スト6】だらだらランクマ", "date": "20260926", "duration": 3407, "ch": "kamiki"}, {"id": "-sVAWAfLmJ4", "game": "スト6", "summary": "MR2200を目指してランクマを続ける配信。視聴者が見つけたトルバラン後の連携を試し、イングリッド戦の体感に答え、ODトルバランからSA2につなぐ場面でのリバーサルのキャラ差に触れた。", "highlights": [{"t": 3606, "head": "ODトルバランからSA2でリバ抜け", "body": "ODトルバランからSA2につなぐ場面で、最速でリバーサルを入れられると、ブランカとラシードは抜けられてしまう。リバーサルの性能にキャラごとの差があることに疑問も口にした。", "chars": ["JP", "ブランカ", "ラシード"], "themes": ["combo", "defense"], "side": "jp", "tags": ["解説"]}], "title": "【スト6】JPのMRが2200になる配信", "date": "20260910", "duration": 5465, "ch": "kamiki"}, {"id": "R5jtd6nJRK4", "game": "スト6", "summary": "調整直後の様子見のランクマ配信。視聴者の質問に答えてワープキャンセルの使い道を話し、アムネジアが警戒されすぎる状況に触れた。終盤でレジェンドに戻って配信を終えた。", "highlights": [{"t": 6991, "head": "ワープキャンセルの悪さと苦手キャラの強化", "body": "ワープキャンセルで悪さができそうかという質問に、できると思うと答えた。ラヴーシュカ中の連携などが後々出てくるだろうという見立て。ジャストパリィを狙ってくる人が非常に多かったので、中Pワープでかわせるのは大きい。JPは強いと見ているが、元々苦手寄りだったルークとジェイミーの強化は逆風と話した。", "chars": ["JP", "ルーク", "ジェイミー"], "themes": ["patch", "matchup"], "side": "jp", "tags": ["Q&A", "調整"]}], "title": "【スト6】ニューイヤー様子見JP", "date": "20260803", "duration": 9427, "ch": "kamiki"}, {"id": "wsmE7M2oF7M", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える長時間の配信。トルバランの使いどころ、引き中攻撃の考え方、ルーク戦のラッシュ止め対策、補正切り投げの是非、ベガのダブルニーをガードした後の動きを話した。", "highlights": [{"t": 1484, "head": "引き中攻撃は使いどころが未確定", "body": "引き中攻撃はほとんど使わず、使いどころが分かっていない。相手の連携への割り込みや、下がって技を空かす使い方がよいのだろう、という見立て。ダッシュ引き中の単発からラヴーシュカにつなぐ形は強いが、コマンドが難しくミスの代償が大きいので自分はあまりやらない。", "chars": ["JP"], "themes": ["neutral", "combo"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】ショート投稿したからランクマ", "date": "20260714", "duration": 13119, "ch": "kamiki"}, {"id": "DHwYs05qqek", "game": "スト6", "summary": "ランクマを遊びながら進めた配信。ストリボーグをガードされたときの不利の大きさと使い方、リーサルでSA3を選ぶ判断、他のJP使いのプレイを見ない理由を話した。", "highlights": [{"t": 7709, "head": "リーサルはSA3へ直行すべきだった", "body": "さっさとSA3まで行っていれば、それでリーサルだった。神木Cは、SA2へ行ったせいで無駄な悩みが発生した、と振り返った。", "chars": ["JP"], "themes": ["resource", "combo"], "side": "jp", "tags": ["リプレイ振り返り"]}], "title": "【スト6】明日色々やりたいから早めランクマ", "date": "20260709", "duration": 10941, "ch": "kamiki"}, {"id": "nVJ1B9hi_lA", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。EWCの予選の勝ち上がり計算、コンボのゲージ配分、モダンの各キャラの評価、立ち中Kの強さ、キャミィ対策、レート上げの考え方を話した。終盤は連続ガードが切れるSAの話をした。", "highlights": [{"t": 9756, "head": "連続ガードが切れるSAは少ない", "body": "連続ガードが切れるSAは、ジュリのSA1、マノンのSA2、チュンリーのSA2だけだろう、という見立てを示した。ジュリとマノンのSAは、切れ目にインパクトで割り込めるほどの隙間があるので警戒しなくてよく、切れ目で確定を取るのがよい。マノンのSAをガードしきると、画面端から離れてしまう。", "chars": ["JP", "ジュリ", "マノン", "春麗"], "themes": ["combo", "defense"], "side": "vs_jp", "tags": ["解説", "調整"]}], "title": "【スト6】なんかフランスに行く無職男性ランクマ", "date": "20260701", "duration": 10411, "ch": "kamiki"}, {"id": "qaQSZ0zbKuM", "game": "スト6", "summary": "大会を控えた軽めのカスタム配信。当たりたくないキャラの答え、大Kのヒット確認、練習ステージをランダムにする理由、運びコンボとステージの慣れを話した。", "highlights": [{"t": 6775, "head": "運びコンはステージに慣れて選ぶ", "body": "運びコンボのうちどれが適切かを、ラヴーシュカにつなぐ場面で選ぶには、ステージにしっかり慣れていないと選べない、と話した。", "chars": ["JP"], "themes": ["combo", "practice"], "side": "jp", "tags": ["解説", "コンボ"]}], "title": "【スト6】明日から大阪なので軽めにカスタム", "date": "20260605", "duration": 7340, "ch": "kamiki"}, {"id": "Ebe_1eYUK38", "game": "スト6", "summary": "ランクマを回しながら視聴者の質問に答える長時間配信。JPとC.ヴァイパーの相性、ラヴーシュカのガード練習、アレックス戦の振り返り、アムネジア仕込みのリスクを話した。新キャラ・イングリッドの性能予想や、弱いと言いながらキャラを使うことへの考えも述べた。", "highlights": [{"t": 964, "head": "ラヴーシュカのガードはトレモで練習", "body": "JPのラヴーシュカをちゃんとガードできるようになりたい、トレモでレコードすればできるようになるか、という視聴者の質問への答え。JP側の動きを覚えさせてレコードし、それをガードする練習を繰り返せばよい。", "chars": ["JP"], "themes": ["practice", "defense"], "side": "vs_jp", "tags": ["Q&A", "練習"]}], "title": "【スト6】裏でMR溶かしたのでランクマ", "date": "20260522", "duration": 11933, "ch": "kamiki"}, {"id": "fZgVDyrd5gM", "game": "スト6", "summary": "ランクマとカスタムをしながら視聴者の質問に答える配信。JP対キャミィの相性、アムネジアの当て身としての性質、設置・起爆ヒット後のODストリボーグを解説した。調整が来る前の見立てと、イングリッド追加への不安も話した。", "highlights": [{"t": 1124, "head": "調整はフレーム変更でなく火力下げの見立て", "body": "JPの技のフレームを変える調整は、セットプレイやラヴーシュカのコンボが全部作り直しになるので来ないだろう。ありえるのは火力を下げる調整で、コンボ中に即時補正がかかる形が考えやすい。ただ本命は何もないという見立てで、あるとすれば全キャラ共通のシステム調整の煽りを食う形。アムネジアの持続も変わらないだろう。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["調整", "解説"]}], "title": "【スト6】キャミィラシードガイル舞を厚めに募集", "date": "20260519", "duration": 8455, "ch": "kamiki"}, {"id": "dD_rduSh-tQ", "game": "スト6", "summary": "ベガ戦のランクマのあと、視聴者や対戦相手とのカスタムマッチをした配信。視聴者の質問に答え、ラヴーシュカを含むコンボの組み方と1年目の性能、大Pの判定の変遷を話した。カスタムでは、隙をつくだけの勝ち方を練習としては良くないと振り返った。", "highlights": [{"t": 4779, "head": "ラヴーシュカのコンボと1年目の性能", "body": "視聴者の質問（ラヴーシュカを含むコンボの順番）に、大K→中足の順にすると火力が少し上がり、ほかはあまり変わらないと答えた。1年目は大Kからどこからでも入れ、この形がむしろ標準だった。当時のラヴーシュカは全体4フレームで、目の前で撃たれるとほとんどのキャラは確定を取れなかった。今は10フレーム台のはずだと話した。", "chars": ["JP"], "themes": ["combo", "patch"], "side": "jp", "tags": ["Q&A", "コンボ"]}], "title": "【スト6】ベガランクマとJPカスタム", "date": "20260515", "duration": 9089, "ch": "kamiki"}, {"id": "Wr9dUkkfM-g", "game": "スト6", "summary": "視聴者のコメントに答えながらJPで対戦する配信。設置後の大Kと大Pの入れ込み、アムネジアと昇龍拳の違い、リプレイで学ぶ相手の選び方、トルバランと通常技の評価を話した。", "highlights": [{"t": 7316, "head": "設置後の大Kは大Pまで入れ込まない", "body": "大Kはヒット確認が簡単で、SA2に行く場面以外は大Kで止める。ヒットならしゃがみ中Pから起爆、ガードなら中段を出す。大Pまで入れ込むと、相手が上を入れっぱなしの場合に大Pが空振りし、マイナス10ほどの大きな不利を背負うため、基本は入れ込まない。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】現実逃避JPベガランクマ", "date": "20260506", "duration": 10346, "ch": "kamiki"}, {"id": "XY8XQBAvQv0", "game": "スト6", "summary": "JPとベガでランクマを回す配信。新キャラ イングリッドへの見立てを話し、後半は視聴者のリプレイを見ながら、崩し後のバーンアウト、アムネジア後の設置、ケン戦の中足キャンセルへのインパクト、中Pの使い方、大Kの入れ込みを助言した。", "highlights": [{"t": 7816, "head": "大Kから大Pの入れ込みは状況次第", "body": "「大Kから大Pまで入れ込むのか」という質問への答え。入れ込まなくても、大Kが当たれば中攻撃へつなげられる。ラヴーシュカに行くなら入れ込んだほうがよい。ただし大Kだけ当たって大Pが外れてしまうと死ぬので、注意が必要だ。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】よく寝た JPベガランクマ", "date": "20260503", "duration": 12946, "ch": "kamiki"}, {"id": "195SUDYWv04", "game": "スト6", "summary": "EVOJ前のカスタム配信。視聴者の質問に答えながら、ラヴーシュカをパリィされた後の投げ、中Kがカウンターしたときの手順、中足のカウンター確認の練習法を話し、イングリッドの評価やJPの調整への見立ても語った。", "highlights": [{"t": 2756, "head": "ラヴーシュカをパリィされた後の投げ", "body": "ラヴーシュカをパリィしてきた相手を投げる目安への答え。距離が近いなら最速の前歩き投げ、遠いなら最速のラッシュ投げが分かりやすい。難しいのは最初の2段をガードした直後の投げで、気持ち待つことが大事そうだ、という見立て。実戦のリプレイ操作で何フレ遅らせれば入るかを確かめるのが分かりやすい、とも話した。", "chars": ["JP"], "themes": ["offense", "practice"], "side": "jp", "tags": ["Q&A", "コンボ", "練習"]}, {"t": 5480, "head": "イングリッドの評価の分かれ目", "body": "イングリッドの評価についての答え。紹介映像は強そうに見えるものなので判断は保留する。注目点はビームの性能、SA2の設置技の汎用性、OD版の当て身が1フレ発生のように切り返しに使えるかで、使えれば評価は高い。JPと比べると、昇龍対空とビームがある代わりに通常技が短くSA2も微妙なキャラ、という見立て。", "chars": ["JP", "イングリッド"], "themes": ["patch", "matchup"], "side": "", "tags": ["調整", "雑談"]}], "title": "【スト6】一生EVOJに向けてカスタムしていく", "date": "20260424", "duration": 8539, "ch": "kamiki"}, {"id": "8-mSJY7tMNQ", "game": "スト6", "summary": "EVOJ前のカスタム配信。対戦しながら視聴者の質問に答え、A.K.I.の対策、置き技の大攻撃の意図、ランクマの考え方、マリーザ戦、アムネジアの強みを話した。公開されたイングリッドの映像への見立ても語った。", "highlights": [{"t": 933, "head": "イングリッド初見は好みの仕上がり", "body": "イングリッドの紹介映像を見ての感想。JP使いが好みそうな仕上がりに見えるが、どんなキャラかは現状では判断できない。焦点はSA2の設置技の性能で、ビームは強そうだが溜めが必要に見える。", "chars": ["JP", "イングリッド"], "themes": ["patch"], "side": "", "tags": ["雑談", "調整"]}], "title": "【スト6】まだまだEVOJに向けてカスタムしていく", "date": "20260423", "duration": 10534, "ch": "kamiki"}, {"id": "P7lgTe_au9s", "game": "スト6", "summary": "EVOJのトーナメント表を見て、ベガのランクマから、ラシードとチュンリー対策の練習に切り替えると決めた配信。視聴者の質問にも答え、大Pからのトルバランの入れ込み、連携を入れ込んだ後のコンボ、設置後の起き攻めでの大Kの扱いを話した。", "highlights": [{"t": 6773, "head": "設置後の起き攻めで大Kを入れ込まない理由", "body": "大Pから設置の起き攻めで、大Kを打ち切って中足にすべきかという質問への答え。入れ込まない方がよい。入れ込むと、相手が上を入れっぱなしにしていた時にマイナス10台の大きな不利を背負うからだ。大K、大P、SA2とつなぎたい時だけ入れ込み、基本は大Kだけ打ち切って、当たっていれば中足や中段、暴れ潰しに行く。", "chars": ["JP"], "themes": ["setplay", "offense"], "side": "jp", "tags": ["Q&A", "セットプレイ"]}], "title": "【スト6】EVOJのトナメ見たりランクマしたりする", "date": "20260420", "duration": 7899, "ch": "kamiki"}, {"id": "5v6ISmOphzk", "game": "スト6", "summary": "ランクマをしながら視聴者と話す配信。アレックス戦の見立て、ドライブゲージの削りが以前より弱くなった話、ラヴーシュカにパリィを仕込むべきかという質問への答えが中心で、大半は対戦中の実況と雑談だった。", "highlights": [{"t": 4421, "head": "ラヴーシュカのパリィ仕込みは毎回やる", "body": "ラヴーシュカのパリィ仕込みを毎回したほうがいいかという質問への答え。仕込める場面は全部仕込んだほうがよく、あえてやらない理由はない。コンボから発動する場面が典型で、慣れるとそこまで難しくない。ただしミスの被害が大きく、難しい場面ではやらない理由もある。", "chars": ["JP"], "themes": ["practice", "combo"], "side": "jp", "tags": ["Q&A"]}], "title": "【スト6】レジェJP せいぜい1時くらいまで", "date": "20260331", "duration": 9905, "ch": "kamiki"}, {"id": "_LIvr7jcqx0", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。ラヴーシュカのパリィ仕込みのコツ、いちばん簡単なコンボ、1800〜2000帯で大事なこと、ブランカ対策、大Kの振り方の予告を話した。調整直後で、パリィ後のラッシュの不具合も検証した。", "highlights": [{"t": 1802, "head": "ラヴーシュカのパリィ仕込みのコツ", "body": "コツは感覚的で、焦りすぎないことに尽きる。小P、パリィ、中足の順に押し、早すぎるとパリィが出てしまい、遅すぎるとガードできない。トレモで繰り返し試す。パリィを中Pや中足と別のボタンに置くと多少やりやすい。", "chars": ["JP"], "themes": ["practice", "offense"], "side": "jp", "tags": ["Q&A", "練習"]}, {"t": 4278, "head": "ブランカ対策は遠くで光ったらインパクト", "body": "簡単な1分対策として、遠くで黄色く光ったらインパクト、を合言葉にする。理想は強ロリにジャストパリィ、手前で止まるロリにボタンを押すこと。近い距離でSA2ゲージがある相手のODロリにインパクトすると、SA2にキャンセルされるので注意。", "chars": ["ブランカ"], "themes": ["matchup"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}], "title": "【スト6】レジェJP 質問無限募集", "date": "20260320", "duration": 7455, "ch": "kamiki"}, {"id": "aNb1QNPPKjE", "game": "スト6", "summary": "調整を前に、マリーザでランクマを回しながら視聴者の質問に答える配信。JPにどんな調整が入りうるかの予想、JPを使う人への影響への思い、ランクマのレートの動き方を話した。後半は長時間プレイで精度が落ちる点にも触れた。", "highlights": [{"t": 1556, "head": "JPに入りそうな調整の予想", "body": "調整が入るとしたらどこかという質問への答え。共通の調整では、ラッシュの中段まわりが変わりそうだと予想した。JP単体では、今は始動補正だけの技にコンボ補正が付く調整がありそうだという。ラヴーシュカがコンボ専用になる調整も、可能性は低いがゼロではないだろう、という見立て。", "chars": ["JP"], "themes": ["patch"], "side": "jp", "tags": ["Q&A", "調整"]}], "title": "【スト6】神ーザ 無限質問募集男", "date": "20260311", "duration": 9358, "ch": "kamiki"}, {"id": "OeFgpUo8gKc", "game": "スト6", "summary": "C.ヴァイパー実装日の配信。触ってみて難しさと評価の見立てを話した。JPが弱体化されなかったことや次の調整時期の予想にも触れ、視聴者の質問にはアムネジアを取ったあとの動きで答えた。", "highlights": [{"t": 8702, "head": "ブランカは大きなナーフを受けていない", "body": "ブランカの一番すごいところは、一度も大きめのナーフを受けていないことだ。ナーフ自体はされている。1年目の最初にSA2と人形の強さが知られたが、ほとんど調整されなかった。次こそはナーフされるだろうと思われ続けても、されていない。", "chars": ["ブランカ"], "themes": ["patch", "matchup"], "side": "", "tags": ["調整", "雑談"]}], "title": "【スト6】レジェンドJP　30秒だけヴァイパー見てからランクマ", "date": "20251015", "duration": 11288, "ch": "kamiki"}], "book": [{"id": "tachimawari", "name": "立ち回り", "lead": "JPの立ち回りは、中間距離の通常技（大P・中K・大K）で相手の前進を止め、ダウンを取ったら設置とラインを上げる流れが軸になる。ドライブゲージの残りで前に出るか撃つかを決める。", "sections": [{"title": "差し返しは中K、ラッシュ止めは中攻撃", "body": ["@jpdc 2024年11月の投稿では、相手のラッシュ止めを狩る行動として、弱ストリボーグの先端を当てるのがよいと聞いたことがある、という話があった（答えた人も詳しくなく多分、と断っている）。ラッシュからODストリボーグという手もあるとして、ほぼ全キャラに対応する「ラッシュ止め返し」のコンボ（SA2ではなくSA1でもトリグラフ〆でもよい）を紹介したツイートも共有された。{{dc:1285810788199694408/1302201829618225242}}{{dc:1285810788199694408/1302206911063654422}}{{dc:1285810788199694408/1302932350736535633}}{{dc:1285810788199694408/1302933786131959850}}", "@jpdc 2025年7月の投稿では、上手いJPのリプレイでよく見る引き中Pの使いどころとして、画面端を背負っているときの逆択に使うことが多いという答えがあった。ほかに、4中Pからタゲコン>ストリボーグでドライブゲージを削る、差し返しで4中Pを振ってSA2を発動する、という使い方も挙がった。{{dc:1285810788199694408/1393534394228146229}}{{dc:1285810788199694408/1393596852921827400}}"], "clips": []}, {"title": "シューティングは意味を持たせて撃つ", "body": ["@ryusei 2025年12月の動画では、画面端で一旦下がってゲージを貯め、SA2 を撃つ計画を立てている。SA ゲージが1.8本ほどなら、シューティングで時間を使って遠距離でゲージを稼ぐ。{{YBH6eV6PRPM@176}}", "@oukoku 2026年1月の投稿では、モダンJPでダイヤ帯の壁に当たっているという相談に、ダイヤ5の回答者が、シューティングへの対処がうまそうな相手には前へ歩いて画面端まで追い詰める（JPは画面端も強い）、立大Pは当てればシューティングに行けるので積極的に振る、SA2を積極的に使うために立大Kを空振りでも使う、と答えた。{{dc:1200611284408881324/1464498391747788911}}{{dc:1200611284408881324/1467083162629705830}}"], "clips": []}, {"title": "ジャストパリィとインパクトは割り込みに使う", "body": ["@jpdc 2024年12月の投稿では、SA2の暗転返しで強トリグラフを打ったつもりが中トリグラフが出た理由について、暗転前に中トリグラフがすでに成立していて、それが漏れたという説明があった。強トリグラフだと優先度が共通で上書きできず、OD技やSAなら上書きできるので、ODトリグラフで倒しきれる場合はそれが解だが、ギリギリ倒しきれないと相手有利になりそうという。{{dc:1285810788199694408/1321076929633194006}}{{dc:1285810788199694408/1321082679889760340}}{{dc:1285810788199694408/1321082794520084522}}", "@jpdc 2026年4月の投稿では、1ラウンド目をSA2で取った後の2ラウンド目、自分の体力がミリのときにSAゲージを貯めるため返されやすいインパクトを打つのはどうかという質問に、ミリからでも逆転できるので皆あきらめていない、通れば端コンボからセットプレイで殺せるし、返されてもゲージが溜まるのでインパクトはありだ、という答えがあった。{{dc:1285810788199694408/1489948474509361232}}{{dc:1285810788199694408/1489978120156217424}}"], "clips": []}, {"title": "ドライブゲージは使いに行き、バーンアウトは相手にさせる", "body": ["@ryusei 2026年2月の動画では、大Pを一発ガードさせて相手のドライブゲージの回復を止める考え方が示された。パリィで逃げる相手には大Pからのトルバランのフェイントが刺さり、バーンアウトさせてラヴーシュカに繋げるのが分かりやすい勝ちパターンだと話された。{{mmJusdic1Yg@999}}{{mmJusdic1Yg@1125}}", "@nandene 2025年9月の動画では、マスター未満はSA2よりSA3にゲージを回すほうが勝率が高いと話している。SA2は強い状況だけで吐き、それ以外は最後のラウンドのリーサルのために保持する。{{aI6OgnkAk9o@14}} {{aI6OgnkAk9o@474}}", "@jpdc 2024年11月の投稿では、SA2の使い方について、基本は相手のバーンアウト中の崩しに使い、状況によってはバーンアウトを狙う、削る、削りつつ接近して崩す用途もある、という答えがあった。遠距離で相手がバーンアウトしているが体力は負けている時は、ODトリグラフキャンセルSA2で触り、ラッシュで触って画面を押しつつ設置も置いて近距離の有利状況を作るという。{{dc:1285810788199694408/1304050984632451083}}{{dc:1285810788199694408/1304053481954349116}}{{dc:1285810788199694408/1304053990303993866}}{{dc:1285810788199694408/1304056486015799307}}", "@jpdc 2025年3月の投稿では、マスター上がるまでのJPのドライブゲージの使い途として、OD>弾SA2、しゃが中P>ODスト、立ち中Kラッシュ、リーサルを伸ばす時が挙がり、OD設置も強いと補足された。ダイヤ後半ではラッシュ中足と弾フェイント→ラッシュ投げ、ODコマ投げに助けられたという声もあった。{{dc:1285810788199694408/1351460926498541639}}{{dc:1285810788199694408/1351461341566603359}}{{dc:1285810788199694408/1351461699131281428}}{{dc:1285810788199694408/1351462033291477006}}", "@jpdc 2025年6月の投稿では、SAゲージの使用割合について、SA2使用率80%を目指してもいいと言われるくらいなので、もっと使ってよいという答えがあった。SA2は強く打てる場面では常に打ちたいという声もあり、SAを抱えてリーサルでSA3を使うことが多い人は、SA2を積極的に狙うと話した。{{dc:1285810788199694408/1386716207524216922}}{{dc:1285810788199694408/1386862764386947204}}{{dc:1285810788199694408/1386880172896161903}}{{dc:1285810788199694408/1387022703449604136}}", "@jpdc 2025年10月の投稿では、相手のバーンアウト中のSAの使い方が相談された。SA2の生撃ちは、弾をガードさせて削る考えや、撃ったあとにコンドルで突っ込まれるのをケアすればありという意見があった。SA1の暴れは答えが割れ、一人は撃ちたいが相手が起き攻めをあまりしないなら中足や立中K→ストリボーグも考える、もう一人は警戒されて50%の読み合いなので自分ならしない、と答えた。{{dc:1285811750960369738/1429528899758461019}}{{dc:1285811750960369738/1429635885489455174}}{{dc:1285811750960369738/1429719050254290955}}", "@jpdc 2025年10月の投稿では、2ラウンド目の終盤にSA3でバーンアウトを取りに行ってよいかという質問には、相手に苦手意識があるなら倒し切りを狙って撃つ、自信がなければゲージを惜しまず使うという答えがあった。SA2コンボで節約できるかもという指摘もあった。SA2に繋ぐ場面では、ODトルバランをガードさせ、ガード硬直中に設置→ワープ→大K→ジラント→SA2と入れ込めば連ガが組めるという案が出て、質問者は目から鱗だったとのこと。{{dc:1285811750960369738/1429528899758461019}}{{dc:1285811750960369738/1429635885489455174}}{{dc:1285811750960369738/1429719050254290955}}{{dc:1285811750960369738/1429783921809424414}}", "@jpdc 2026年6月の投稿では、JPのDリバをガードした後の安定行動の質問に、投げか2弱P中Kという答えがあった。投げはドライブゲージを削れ、2弱P中Kはダメージ優先で、状況次第では2弱P中K→SA2もゲージを一気に削れるという。{{dc:1285810788199694408/1518598
