e の記事（りゅうせいが動画で紹介）より。", "cites": ["{{KDj4rmRN3AA@500}}"]}]}, {"title": "無敵技ガード後の反撃：エレナ（OD設置+4の起き攻め）", "ch": "ryusei", "routes": [{"name": "SA2をガード", "when": "OD設置+4の起き攻めで、相手のSA2をガードした後", "route": ["前大K", "待ち前大K", "中ストリボーグ", "大P"], "options": [], "note": "きたるふぁさんの note の記事（りゅうせいが動画で紹介）より。", "cites": ["{{KDj4rmRN3AA@515}}"]}]}, {"title": "無敵技ガード後の反撃：サガット（OD設置+4の起き攻め）", "ch": "ryusei", "routes": [{"name": "SA2をガード", "when": "OD設置+4の起き攻めで、相手のSA2をガードした後", "route": ["前大K", "待ち前大K", "中ストリボーグ", "大P"], "options": [], "note": "きたるふぁさんの note の記事（りゅうせいが動画で紹介）より。", "cites": ["{{KDj4rmRN3AA@514}}"]}]}, {"title": "無敵技ガード後の反撃：C.ヴァイパー（OD設置+4の起き攻め）", "ch": "ryusei", "routes": [{"name": "SA2をガード", "when": "OD設置+4の起き攻めで、相手のSA2をガードした後", "route": ["前大K", "待ち前大K", "中ストリボーグ", "大P"], "options": [], "note": "きたるふぁさんの note の記事（りゅうせいが動画で紹介）より。", "cites": ["{{KDj4rmRN3AA@501}}", "{{KDj4rmRN3AA@514}}"]}]}, {"title": "無敵技ガード後の反撃：アレックス（OD設置+4の起き攻め）", "ch": "ryusei", "routes": [{"name": "SA2をガード", "when": "OD設置+4の起き攻めで、相手のSA2をガードした後", "route": ["ラッシュ", "前大K", "待ち前大K", "中ストリボーグ", "大P"], "options": [], "note": "きたるふぁさんの note の記事（りゅうせいが動画で紹介）より。", "cites": ["{{KDj4rmRN3AA@501}}", "{{KDj4rmRN3AA@503}}"]}]}], "reviewed": true}, {"id": "setplay", "name": "セットプレイ", "lead": "JPのセットプレイは、ダウンを取って設置し、画面端に追い込んで一度の読み合いに勝つ形が土台になる。そのうえで大Pラッシュ、起爆、ワープ、パリィへの対策を、相手と時期に合わせて使い分ける。", "sections": [{"title": "設置のタイミングと種類：安全第一、OD設置はゲージを見て選ぶ", "body": ["@oukoku 2025年5月の投稿では、OD設置の適切な使い方を尋ねる質問に、敵に触るため（バーンアウトが近い時や、次に触ってSA2で崩してリーサルを狙う時）、端から逃げるため（TPで入れ替える、OD設置の圧で投げやジャンプを通す）、ラインを上げるため、という使い方が挙がった。せっかくOD設置が通ったのにラインを下げたり、中央付近で何もしないのは勿体ないという。{{dc:1372282642359386233/1372282642359386233}}{{dc:1372282642359386233/1373929422385709138}}"], "clips": []}, {"title": "投げ後の設置：前投げは避け、裏投げは相手を選ぶ", "body": ["@jpdc 2025年3月の投稿では、前投げからトリグラフを重ねる利点を問われ、ガードされてもJP側が+1、ヒットすれば前大Kで追撃して3000以上減らせ、最速で重なるという答えがあった。弾属性なのでSA1を潰せる。SAの無敵はSA1が弾以外に無敵、SA2とSA3は完全無敵（自強化や何か出す系は無敵なし）なので、バーンアウト中のラシードでSAゲージが2あってもトリグラフ重ねには対応できないという。{{dc:1285810788199694408/1353341431527247962}}{{dc:1285810788199694408/1353370489585930261}}{{dc:1285810788199694408/1353370899268632668}}{{dc:1285810788199694408/1353392740213330000}}{{dc:1285810788199694408/1353514924525228062}}{{dc:1285810788199694408/1353605325651054624}}", "@jpdc 2025年10月の投稿では、画面端で通常の裏投げをした後の+29Fからの行動として、ラッシュ中段、ラッシュディレイ中足、ラッシュを伸ばして投げ、何か埋めたいなら前ステ立ち中Kからキャンセル、SA2があれば生SA2が挙がった。ラッシュからガードして遅らせ投げも有効で、パリィにはパニカン投げ、OD昇竜はガード、グラップは抜けてゲージ回収できるが、ファジージャンプには入れ替えられるという。{{dc:1285810788199694408/1428024848009134222}}{{dc:1285810788199694408/1428316092601995375}}{{dc:1285810788199694408/1428537459146358804}}{{dc:1285810788199694408/1428537749040005231}}"], "clips": []}, {"title": "起爆：調整後の新しい形、読まれ始めた形、負ける場面", "body": ["設置の後は、何もしなくても1回起爆を見せておくと相手が動きにくくなるので、常に見せるようにしている。飛びが多い相手には起爆からコンボになるが、ラッシュで設置を突き抜けてくる相手もいる（2026年8月31日の配信）。設置後の大Kは、ヒットならしゃがみ中Pから起爆、ガードなら中段を出す。大Pまで入れ込むと、相手が上入れっぱなしのときに大Pが空振りしてマイナス10台の不利を背負うため、入れ込むのはSA2まで行きたいときだけだ。 {{eC9U3U3weZ0@2185}} {{Wr9dUkkfM-g@7316}} {{P7lgTe_au9s@6773}}", "起爆には負ける場面もある。ヴィーハトの後に起爆を入れるとワープで負けることがあり、ワープはトリグラフにも噛み合うので読み合いが面倒だ（2026年6月8日の配信）。キンバリーのSA2にはトリグラフが弾無敵の切れた直後に当たって無敵で負けるが、起爆に替えると当たる（2026年9月26日の配信）。起爆がヒットした後の締めは、最大ダメージならODストリボーグが大きい（2026年5月19日の配信）。 {{qBcQGeJYpLg@2429}} {{ZtF7sNSdFQ4@2401}} {{fZgVDyrd5gM@6116}}"], "clips": []}, {"title": "大Pラッシュ後の読み合い：遅らせ投げが基本、小Pには大Kで返す", "body": ["大Pラッシュをした時点で、JP側が有利になっている。神木Cが最もよく使うのは、ラヴーシュカで崩しに行く場面と連携を組む場面で、後の形はラヴーシュカの固めとラッシュ中段が中心だ（2026年3月3日の動画）。 {{k7wcmJH9vuQ@0}} {{_mOPb3s_vtI@0}}", "小Pや遅らせ投げ抜けに勝つのは、大Pラッシュ大Kだ。ガードされても、ラヴーシュカの固めに行ける。嫌がって昇龍を出せば遅らせ投げでガードされるかもしれず、相手にとっては難しい読み合いになる。大Kを大きく遅らせて出す形も混ぜる。相手がドライブリバーサルを出せばゲージの交換にはなるが、JP側に仕込みがあるので完璧な対処ではない。 {{k7wcmJH9vuQ@22}} {{_mOPb3s_vtI@46}} {{_mOPb3s_vtI@78}}"], "clips": []}, {"title": "連続ガードと崩し：中段、パリィ仕込み、投げ、大足", "body": ["連続ガードを組むときの小Pにパリィを仕込む技は、やらない理由がないので常にやるべきだ。神木Cは、できていない試合はサボっているだけだと振り返っている（2026年9月30日の配信）。ラヴーシュカのパリィ仕込みのコツは、焦りすぎないことに尽きる。小P、パリィ、中足の順に押し、早すぎるとパリィが出てしまい、遅すぎるとガードできない。トレモで繰り返し試し、パリィを中Pや中足と別のボタンに置くと多少やりやすい（2026年3月20日の配信）。 {{Jsg1B-3ogLY@2332}} {{_LIvr7jcqx0@1802}}", "ラヴーシュカをパリィしてきた相手を投げる目安は、距離が近いなら最速の前歩き投げ、遠いなら最速のラッシュ投げだ。難しいのは最初の2段をガードした直後の投げで、気持ち待つことが大事そうだ（2026年4月24日の配信）。重ならない系の中段を狙うタイプのラッシュは、相手が暴れてくる率がかなり高く、チュンリー戦ではそこを突く場面があった（2026年4月25日の配信）。 {{195SUDYWv04@2756}} {{fQP25E3Ed9s@4472}}", "@ryusei 2026年11月の動画では、ODトルバランなどのあとに、中足と立ち小Pの2択を仕掛ける連携を検証した。字幕では、SA2の発動がプラス9フレーム、中足ガードがプラス5フレームで、立ち小Pまで連続ガードになる。{{-H1xISaRJww@295}} {{-H1xISaRJww@316}}", "@ryusei 2026年10月の動画では、視聴者の研究として紹介された、起爆ガードからのF式連携を検証した。起爆をガードさせたあとに、下段か登りジャンプ弱Kの中段で2択をかけ、連続ガードにする。SA2を使わなくても成立する。{{M0xdxw-bTYE@0}} {{M0xdxw-bTYE@88}} {{M0xdxw-bTYE@134}}", "@jpdc 2024年11月の投稿では、SA2のガード不能またはガード困難の連携が紹介された。DR立大K→しゃがみ大PからSA2、立中Kで弱設置→前ステ→しゃがみ中P→中足と繋ぐ。相手が背の高いJPやDJの場合は弱設置でないと繋がらない。ランクマで試すと、パリィ押しっぱなしと無敵技ガチャガチャ以外はくらい、相手がバーンアウト中はかなり有効という。{{dc:1285864581478088776/1301589126512119869}}{{dc:1285864581478088776/1301881661721415700}}", "@jpdc 2024年11月の投稿では、大K→大Pがガードされた時にSA2を発動して連ガでODゲージを削るレシピについて、端なら全キャラに強K強P>SA2>2弱P>中足>中足で、中央ならでかめのキャラに限る、という答えがあった。3回目の中足でSA3に割り込まれるのは本来割り込めないはずなのでおそらく入力が遅いためで、トリグラフの直後に足が出ているかで失敗を見分け、タイミングを覚えた方がよいという。{{dc:1285810788199694408/1307698304267714601}}{{dc:1285810788199694408/1307717310366220351}}{{dc:1285810788199694408/1308255642737442916}}{{dc:1285810788199694408/1308259187238764584}}{{dc:1285810788199694408/1308260790167408710}}{{dc:1285810788199694408/1308268572769914940}}", "@jpdc 2024年12月の投稿では、ODトルバランをスパキャンしてSA2を出すメリットとして、固めではODトルバラン→SA2→前飛びJ大P→中足〜が連ガになるという答えがあった。凌ぎ方を知らなければほぼ100%崩れる強力な固めで、コンボでもF式に行ける。端の攻めでは多用するという。{{dc:1285864637199286312/1317390063088173077}}{{dc:1285864637199286312/1317396102038687814}}", "@jpdc 2024年12月の投稿では、大P→OD弾→ジャンプ大P→しゃがみ中Kのガード困難連携が連ガかを聞く質問に、大P>OD弾は通常時は連ガではないのでラッシュ大Pで始めるとよい、OD弾>SA2>J大P>中足は連ガで、J大Pで切れるなら暗転後最速で前飛びできていない、という答えがあった。全部最速でよく、中央だと間合いで相手を押し出して連ガが切れることがあるので端でやるのがよいという。{{dc:1285810788199694408/1317404417393299498}}{{dc:1285810788199694408/1317414897029746709}}{{dc:1285810788199694408/1317415321799229501}}{{dc:1285810788199694408/1317415994184040499}}{{dc:1285810788199694408/1317416382350233630}}", "@jpdc 2025年1月の投稿では、強K強Pタゲコン>SA2>しゃがみ弱P>中P+中Kと入力すると、暗転中に相手がDリバをしていればパリィが出て、していなければしゃがみ弱Pが出るという技が話題になった。通常でやるのは難しいがSA2の暗転があるとやりやすく、2弱P>中P+中K>2中K>2中Kで、中足にDリバされてもガードできるという。{{dc:1285800688097562715/1325119668155056180}}{{dc:1285800688097562715/1325424630185328721}}{{dc:1285800688097562715/1325610345250816035}}", "@jpdc 2025年1月〜2025年2月の投稿では、ラッシュ4中P（密着）からラヴーシュカを出すと、ガードで+8Fになり、全キャラ相手に画面中央でもしゃがみ弱P→中足→中足まで連ガになる。問題はパリィされると発動を止められないこと。立ち中Kからキャンセルラッシュ4中Pで繋ぐ形はコマンドが容易で、非連ガなのでDゲージが回復するが、無敵技で割り込まれるという。{{dc:1285864581478088776/1332661680462626877}}{{dc:1285864581478088776/1335184585239035955}}", "@jpdc 2025年1月の投稿では、大KタゲコンからSA2を出して、しゃがみ弱P・大足・中足と繋ぐ形の狙いが問われた。中央でゲージを削る（レンガ）ルートがそれしかないからという答えがあり、動画でもラヴーシュカ3発目の下段弾が当たっていた。大足にパリィを仕込めるのでは、という記憶ベースの答えもあった。{{dc:1285864637199286312/1333140455659147365}}{{dc:1285864637199286312/1333442235005534282}}{{dc:1285864637199286312/1333641142885023796}}{{dc:1285864637199286312/1334010498177564744}}", "@jpdc 2025年2月の投稿では、「JPでこの行動をしている時は勝ちやすい」ものを問われ、大P OD設置がお手軽で強いという感想が出た。答えとして、(中K>)ラッシュ4中P>SA2>2弱P>2中K>2中Kが紹介され、画面中央でも全キャラ相手に連続ガードの連携になり、1600くらいまでなら崩せるという。{{dc:1285810788199694408/1344215291353239584}}{{dc:1285810788199694408/1344216953174102148}}", "@jpdc 2025年3月の投稿では、ガード困難な連携のまとめとして、画面端で強P→通常設置（+15F）から強K強Pタゲコン→SA2→2弱P→キャンセル起爆→2中Kと、画面端でSA2→2弱P→中K→キャンセルラッシュ2中Kの2つが挙がった。{{dc:1285864581478088776/1345302887860932650}}{{dc:1285864581478088776/1348274014698606622}}", "@jpdc 2025年3月の投稿では、大会中継のバーンアウト削りが全て連続ガードかという質問に、上にある黄色い薄いゲージが消えるまでが連続ガード（レンガ）という見分け方が示された。例として、OD弾、OD弾、大ストリボーグ、中Kまでが連続ガードで、そこで途切れたあとのSA2は連続ガードだったという。{{dc:1285810788199694408/1346740657430990879}}{{dc:1285810788199694408/1346748017478467634}}{{dc:1285810788199694408/1346748448086425640}}{{dc:1285810788199694408/1346835701915979848}}", "@jpdc 2025年4月の投稿では、引き中PからのSA2は中央でも連続ガードになって強そうなのにあまり使われない理由を問われ、ラッシュ4中P>SA2を愛用しているという答えがあった。ラッシュからでないと安定して+4F以上にならず、生だと入力が遅れてディレイキャンセルになり+3などになる、という確認もあった。{{dc:1285810788199694408/1360802457294471368}}{{dc:1285810788199694408/1361188989830168759}}{{dc:1285810788199694408/1361209133050761287}}", "@jpdc 2025年4月の投稿では、強K強Pタゲコン→SA2→しゃがみ弱P（パリィ仕込み）→中足の連ガ連携が、しゃがみ弱PのガードからDリバで返される問題に、中足を連打せず早めの単押しにすればDリバのときに中足が出ないという答えがあった。中足の発生途中のリバや、SA暗転後に4F遅らせたリバには、確か対応できなかったはずという指摘もあった。{{dc:1285864637199286312/1361941931860557916}}{{dc:1285864637199286312/1362420390705496345}}{{dc:1285864637199286312/1362764878070153489}}", "@jpdc 2025年4月の投稿では、ラヴーシュカをガード中の相手を投げるタイミングの目安として、ラヴーシュカの弾がパリィされて「キン」と鳴った直後に投げを押すとよいという答えがあった。{{dc:1285864637199286312/1364158318465253377}}{{dc:1285864637199286312/1364597592209625178}}", "@jpdc 2025年5月の投稿では、画面端でガード中の相手への大KTC→SA2→2弱P→2中K→2中Kの崩しに対するドライブリバーサルのケアとして、TCへのドライブリバーサルは2弱P>パリィ>2中Kにするとパリィできることがあるという。2弱Pへのドライブリバーサルはほぼやられたら負けで、2中Kへのドライブリバーサルは、2回目の2中Kを連打でなく目押しにするとガードできるという。{{dc:1285810788199694408/1369741339532464130}}{{dc:1285810788199694408/1369788471828418603}}{{dc:1285810788199694408/1369912058690277387}}", "@jpdc 2025年5月の投稿では、画面端で大Kタゲコン→SA2→しゃがコパ→しゃが中K×4が連続ガードになるとき、最初のコパを立ち小Kにするとどこまで連続ガードかという質問に、立ち弱K>中足×2までは連続ガードという答えがあった。少し距離が離れたときは立ち弱K始動でよいという。{{dc:1285810788199694408/1374909864375222343}}{{dc:1285810788199694408/1376302584989487248}}", "@jpdc 2025年5月の投稿では、ガードの上からラヴーシュカを発動して崩したあとのコンボとして、画面中央なら大ストリボーグ、画面端なら前大K大ストリボーグが挙がった。ラヴーシュカ発動後に技2回までなら設置が間に合うと覚えるとよく、発動>屈弱P>屈中Kなら屈中Kを振るタイミングまでにヒットしていればヴィーハトが間に合う。中足がガードされたら、もう一度中足を振り、当たれば5強Pインパクトで削るか、大足ODヴィーハトで起き攻めするのが丸いという。{{dc:1285810788199694408/1375588911350284529}}{{dc:1285810788199694408/1375620618711470182}}{{dc:1285810788199694408/1375677173259702333}}{{dc:1285810788199694408/1376883949984415754}}{{dc:1285810788199694408/1376902301943332963}}", "@jpdc 2025年6月の投稿では、相手がバーンアウト中のSA2連続ガード連携として、SA2>2中K>2弱P>2中Kが安定した連続ガードで、2中Kがヒットしたら強設置>強K強Pタゲコン>弱トリグラフ>強ストまでヒットするという答えがあった。ガード練習をしている相手にはSA2>2中K>2弱P>6中Kがほぼ確でヒットする。バーンアウトになった技は通常ガードと同じフレームなので、タゲコン強Pでバーンアウトしたら2弱Pスタートにしないと連続ガードにならないという。{{dc:1285810788199694408/1386507289032396821}}{{dc:1285810788199694408/1386509683296047124}}", "@jpdc 2025年6月の投稿では、ラヴーシュカ後に+5で設置する起き攻めの中段のレシピとして、大TC→SA2→中足→前ステ→設置→大ストリボーグ→前ステ→立ちコパ→弱設置→中段が書き込まれた。{{dc:1285864581478088776/1387599680812351508}}{{dc:1285864581478088776/1387697541818351668}}", "@jpdc 2025年7月の投稿では、今バージョンから屈強Kで受け身が取れるようになり、ジラント→ラヴーシュカ→屈弱P→屈強K→屈中足の連ガ連携は屈強Kがヒットしても起き攻めに繋がらなくなった、という指摘があった。ODトルバランからラヴーシュカを出して連ガ連携を組むほうが強いのでは、という問いに、ヒット連携でJ強K→ジラント→ラヴーシュカ→2中K→…→強トリグラフが3885ダメージでDゲージを1.9本削るという答えがあった。{{dc:1285864637199286312/1390297991226851429}}{{dc:1285864637199286312/1390302087145066506}}", "@jpdc 2025年7月の投稿では、強K強Pタゲコン→SA2→2弱Pキャンセル起爆→中足が、前バージョンでは中段ラヴーシュカの球から中足が1Fしか空かずほぼガード不能だったのに、今は3F空いてガードされるという報告があった。ラヴーシュカの全体Fが増え、強K強P→SA2から連ガにできるのが5Fまでになったためという説明があった。起爆ヴィーハトを立ちガードしているかの違いという見方もあった。{{dc:1285864637199286312/1394441272634114149}}{{dc:1285864637199286312/1394598372593111081}}{{dc:1285864637199286312/1395758222748684471}}", "@jpdc 2025年7月の投稿では、大K大Pタゲコン後のラヴーシュカで連ガになるルートが問われ、相手が端背負いなら2小P→中足→中足まで、中央なら2小P→大足→中足までという答えがあった。ザンギ・ブランカ・マリーザ・本田・DJ・JPは中央でも中足ルートとされたが、別の投稿で連ガにならないのはJP・ザンギ・マリーザ・DJだけに訂正され、大型キャラは中足ルート一択という。{{dc:1285864637199286312/1397431934711365806}}{{dc:1285864637199286312/1397432868996911125}}{{dc:1285864637199286312/1397433941685829774}}{{dc:1285864637199286312/1397434897072914443}}{{dc:1285864637199286312/1397465552678686793}}", "@jpdc 2025年7月の投稿では、ラヴーシュカをジラントから発動してしゃがみ弱Pが届かない場合の対処が問われ、届かないときはODトルバランから発動しているという答えがあった。パリィされた後の投げのタイミングはコツをつかめばできるという。{{dc:1285864637199286312/1397466331237974078}}{{dc:1285864637199286312/1397466521428688947}}{{dc:1285864637199286312/1397516322824388679}}", "@jpdc 2025年8月の投稿では、大Kからタゲコン、SA2に入ったあとのしゃがみ小Pでの連続ガード中にDリバを警戒して崩せないという質問に、暗転返しのDリバは小Pと同時くらいにパリィを押すと、Dリバ発動時の画面硬直を利用して自動パリィできるが、その後は読み合いになるという答えがあった。Dリバを本当に避けたいときは、歩き回ってSA2の弾が連続ヒットするころに小足でちょっかいをかけるという。{{dc:1285810788199694408/1402498861565476975}}{{dc:1285810788199694408/1402502541757120563}}", "@jpdc 2025年8月の投稿では、SA2からしゃがみ小P、しゃがみ中足連打の連携がパリィ押しっぱなしだと崩れるのはなぜかという質問に、連続ガード中はパリィが出ないという答えと、パリィを押しっぱなしにして取り続けていれば普通は崩れないという答えがあった。例外は、パリィを確認して投げられる場合、パリィ直前にドライブゲージが0.5本なくバーンアウトして中下段択が通る場合、パリィが間に合わず連続ガードをさばく場合という。{{dc:1285810788199694408/1410966689025101835}}{{dc:1285810788199694408/1410968547022340186}}{{dc:1285810788199694408/1410972664029249558}}", "@jpdc 2025年9月の投稿では、大K大P、SA2、中足とすると中足をパリィされてバックジャンプで抜けられるという質問に、SA2後の中足をしゃがみ小Pにすると連続ガードになるという答えがあった。パリィを押してくるならパニカン投げが取れ、受ける側もDリバ、ジャンプ、グラップなど選択肢があるので読み合いという。パリィ読みなら最速ラッシュで投げすればだいたい投げられるという。{{dc:1285810788199694408/1418055004756902011}}{{dc:1285810788199694408/1418066476950229122}}{{dc:1285810788199694408/1418070285525188711}}{{dc:1285810788199694408/1418072804640690290}}", "@jpdc 2025年10月の投稿では、OD昇竜をガードした後のSA2連携として、インパクト→SA2→5小P→インパクト→OD設置→4中Pで+41になる形が紹介された。パリィにはディレイでジャストパリィを取らないとバーンアウトし、無敵技にはガード、ガード後は見てから打撃を重ねてバーンアウトさせられるが、かなり状況は限られるという。{{dc:1285864581478088776/1426186699217571901}}", "@jpdc 2025年10月の投稿では、大P大Kのタゲコンをガードさせたあと（SA2なし）の行動として、弱ストリボーグで連続ガード削り、タゲコンで止めてガード、中下の弾でぼったくる、OD弾で読み合い、パリィが多ければ弾フェイントから投げ、たまにODストリボーグ、バーンアウト中なら中段タゲコンへの派生が挙がった。固まる、パリィ、インパクトを使う相手にはアブニマーチも刺さるが、弱ストリボーグは連続ガードでなく読まれるとインパクトが確定するという。{{dc:1285810788199694408/1429729043502075988}}{{dc:1285810788199694408/1429729926327832687}}{{dc:1285810788199694408/1429730251876995144}}{{dc:1285810788199694408/1429813746502602842}}", "@jpdc 2025年11月の投稿では、JPのSA2中に相手がパリィ長押しだと投げられないという質問に、ガードやパリィの硬直中は投げ無敵がつくので、SA2の間を縫って投げる必要があり、弾がパリィされたのが見えた瞬間に投げを押すくらいのタイミングだという答えがあった。SA2をパリィで受けてパニカン投げされるのが被害最小かという質問には、最小はガードかDリバだが、崩されたり読まれたりするリスクを考えてパニカン投げを受け入れるのも状況次第でありという答えがあった。{{dc:1285810788199694408/1437001247180722186}}{{dc:1285810788199694408/1437001997810143252}}{{dc:1285810788199694408/1437002968049127525}}{{dc:1285810788199694408/1437003953194668252}}{{dc:1285810788199694408/1437005390830112798}}", "@jpdc 2025年12月の投稿では、SA2をガードさせたあとDリバで凌がれるのは連続ガードを作れていないからかという質問に、Dリバは連続ガードとあまり関係なく、作ってもDリバされると終わりという答えがあった。最初だけ連続ガードを作りに行き、Dリバしてきたら様子見する。Dリバを読んでガードすればラヴーシュカが当たるのでコンボに行け、パニカン投げはパリィ押しっぱなしへの対応だという。{{dc:1285810788199694408/1450276846431375423}}{{dc:1285810788199694408/1450284919405285470}}{{dc:1285810788199694408/1450292327011713076}}", "@jpdc 2026年1月の投稿では、打撃をガードさせてSA2を発動したとき相手がDリバしてくる場面が多く、Dリバをガードしたあとのおすすめを聞かれ、強K強Pのタゲコン始動なら、小P、強P、強設置、強P、インパクト、強トリグラフがドライブゲージを約5本削れるという答えがあった。{{dc:1285810788199694408/1458841397045231688}}{{dc:1285810788199694408/1459007862838919272}}", "@jpdc 2026年1月〜2026年2月の投稿では、立ち中Kを4中Pにするだけでそこまで連ガになるサラダバー式がすごい、またラッシュ4中Pラヴーシュカからの中下択は入れ替えにも使えてよい、という感想が出た。{{dc:1285864581478088776/1459168914641522884}}{{dc:1285864581478088776/1467993222226776146}}", "@jpdc 2026年1月の投稿では、JPのSA2がパリィでガードされているときに投げが通るタイミングを聞かれ、パリィの音が鳴り終わってから次のパリィの音が鳴る直前くらいに投げられるという答えがあった。トレモでSA2の1〜4発目それぞれで投げを試すと感覚がつかめ、フレームメーターで隙間のタイミングを観測したら感覚に落とし込めたという声もあった。{{dc:1285810788199694408/1464582228859293762}}{{dc:1285810788199694408/1464584040794296446}}{{dc:1285810788199694408/1464587335575273583}}", "@jpdc 2026年1月の投稿では、SA2中は弾を撃てず、大K大Pのあとにコマ投げ（アブニマーチ）は連続技としてはつながらないという答えがあった。ただし、インパクトを打ってくる相手には毎回それで取れているという声もあった。ラッシュ攻撃のあとならコマ投げがつながるので、SAゲージ回収のときに使うという。{{dc:1285810788199694408/1466733328274292816}}{{dc:1285810788199694408/1466733424248098899}}{{dc:1285810788199694408/1466733839572271196}}{{dc:1285810788199694408/1466733936754298971}}{{dc:1285810788199694408/1466734098331598929}}{{dc:1285810788199694408/1466734354976866429}}", "@jpdc 2026年2月の投稿では、相手がバーンアウト中のラヴーシュカ崩しで、強K強Pタゲコン、SA2、2中K、2弱P、6中Kと続けると、最後の中段が空喰らいされることがあるという報告があった。中足をガードした後に上入れっぱなしだと空喰らいになるため、中足、2弱P、中足も混ぜる必要があり、2弱Pを立ちガードされると+17Fになり6中Kが空喰らいになるらしいという。{{dc:1285810788199694408/1470764272593403965}}{{dc:1285810788199694408/1470768102244483257}}{{dc:1285810788199694408/1470774078712320224}}", "@jpdc 2026年2月の投稿では、詐欺飛びができないときでも、ほぼ全てのSAに対応しつつ削るか崩す連携が紹介された。防げないのはダルシムとリリィのSA2だけで、バーンアウト中の相手に+38〜45の状況でラヴーシュカを出すと、詰みに近い状況を結構作れるかもしれないという。{{dc:1285864581478088776/1471139425588219904}}", "@jpdc 2026年3月の投稿では、ODトルバランからSA2を発動する連携の強みとして、ODトルバラン、SA2、ジャンプ強P、中足までが連続ガードなので、相手はパリィや無敵技での暴れができないという答えがあった。ガードの練習も必要になるという。{{dc:1285810788199694408/1477603219428610178}}{{dc:1285810788199694408/1477640662152380496}}", "@jpdc 2026年4月の投稿では、画面端でSA2の固めをガードさせ、ガードを見てインパクトを入れる連携が紹介された。インパクトを見てから無敵技で切り返されそうという声があり、大KTCインパクトは連続ガードではない、それだとインパクトの硬直をSA2で上書きして大きなマイナスになりそうという指摘もあった。{{dc:1285810788199694408/1489200568416206898}}{{dc:1285810788199694408/1489230518729048084}}{{dc:1285810788199694408/1489241808088072302}}{{dc:1285810788199694408/1489242300080066841}}", "@jpdc 2026年4月の投稿では、ODトルバラン→SA2→J強P→中足の連続ガード連携は画面中央でもできるかという質問に、大P先端ガードの間合いだと長さが足りず連続ガードを作れないのでジャンプ大Kにするといい、先端でなければ中央でもジャンプ大Pで連続ガードを作れる、という答えがあった。{{dc:1285810788199694408/1497641036141301854}}{{dc:1285810788199694408/1497773918088331304}}{{dc:1285810788199694408/1497894362586022048}}", "@jpdc 2026年6月の投稿では、画面端の大Kタゲコンからのラヴーシュカ発動で、2回目の中足の場面でリバされることが多い問題に、そこは読み合いになっていた気がする、リバをガードできている人はリプレイで見たことがないので多分無理、という答えがあった。リバを読むなら何もしないか、リバを吐いたらバーンアウトになる状況でSA2を吐くことになるのでは、という。相手にDゲージがあるときは崩すより削ってバーンアウトを狙い、リバを吐かれたらおいしいと考えるという。{{dc:1285864637199286312/1511295287812161677}}{{dc:1285864637199286312/1511295458541178920}}{{dc:1285864637199286312/1511296118544269412}}{{dc:1285864637199286312/1511296569469829173}}", "@jpdc 2026年7月の投稿では、SA2を発動したとき相手が手前方向入力のままでもガードできるのはなぜかという質問に、連続ガードの場合は上下段さえ合っていればガードは継続される、上段・中段のみの連続ガードなら初段をガードしていればレバーから手を離してもガードになる、という答えがあった。{{dc:1285810788199694408/1529223340659839137}}{{dc:1285810788199694408/1529266436990697663}}", "@jpdc 2026年7月の投稿では、画面端で立ち大K大P後にSA2を発動し、しゃがみ小P・しゃがみ中K後のジャンプ小Kが当たらずパニカン投げを受けるという質問に、墓場連携は立ちガードされていると投げが確定するのではという答えがあった。{{dc:1285810788199694408/1531636516395417630}}{{dc:1285810788199694408/1531643578042814527}}{{dc:1285810788199694408/1531649681090809878}}", "@jpdc 2026年7月の投稿では、画面端の大KのTCガードからのSA2は、密着で大Kをガードさせないと発動後の2弱Pが当たらないという質問に、届かないと思ったらSA2を出さない、出して届かなければ相手のパリィ投げとDリバガードの読み合いをする、設置ガード後など密着になりやすい所で出すという答えがあった。{{dc:1285810788199694408/1531913733343809666}}{{dc:1285810788199694408/1531981643617931304}}{{dc:1285810788199694408/1532014190364197044}}", "@jpdc 2026年8月の投稿では、中央でOD弾SA2発動からジャンプ弱Kを深めに当てて中段に行く連携が連ガにならずパリィを挟まれる問題に、ラヴーシュカの1発目にJPが乗ったときに弱Kを入力すると中段が連ガになりやすいという答えがあった。OD弾が近いとラヴーシュカが外れて連ガにならないという。{{dc:1285864637199286312/1534496946494898276}}{{dc:1285864637199286312/1534503306632757291}}{{dc:1285864637199286312/1534509113084477440}}", "@jpdc 2026年8月の投稿では、前大K▶中ストリボーグ▶大P▶トルバランのあとのSA2について、中トルバランからだと初弾が起き上がりに重なり、初弾ガード後のしゃがみ弱Pで2発目まで連ガになるという説明があった。パリィしていなければ中足でSA2の2発目の中段と下段がほぼ同時に来てガードが難しく、していれば中足は出さずパリィ投げかシミーを繰り返す。強トルバランからは初弾が重ならず投げられるとも言ったが、あとで試すと投げに行けず、記憶違いかもしれないと述べた。{{dc:1285810788199694408/1536017104384299138}}{{dc:1285810788199694408/1536028875207876718}}{{dc:1285810788199694408/1536030243477913662}}{{dc:1285810788199694408/1536037080478515200}}{{dc:1285810788199694408/1536037569521782905}}", "@jpdc 2026年8月の投稿では、JPが端背負いのときに引き中Pや大Kがヒットしたあとの、SA2入れ替えのガード困難連携が紹介された。下りJ弱Kを深めに当てると最大+10Fになりコンボが継続してしまう。相手が中下をガードしたあとは設置の2つ目が暴れを潰す。画面中央でも可能で、崩した後は大ストで拾え、相手の立ちしゃがみに関係なく行えるという。{{dc:1285864581478088776/1537103171858595840}}", "@jpdc 2026年8月の投稿では、SA2を使うタイミングという質問に、ダメージを取りたいとき・端背負いで入れ替えたいとき・バーンアウトを狙うとき・ぼったくり補正切りで勝ちを狙うとき、状況依存ではバーンアウトした相手を削り倒すときや体力僅かの相手を崩すときという答えがあった。生で撃つと回避されやすいのでODトルバランをガードさせながらか、ジラントやグロームストレルカから発動する。バーンアウトしていない相手には、発動後は一旦ガードを固め、連ガに入ってから中下段で崩すという。{{dc:1285810788199694408/1540042506299773030}}{{dc:1285810788199694408/1540044735501049936}}{{dc:1285810788199694408/1540048893293764770}}", "@jpdc 2026年9月の投稿では、SA2→コパ→生ラッシュ→コパ→小足のほぼガード不能の連携が簡単にガードされるという相談に、生ラッシュの部分が遅れている(パリィを出すまでが1F遅く、パリィ時間も最短より1F長く、計2F)という答えがあった。コパ硬直の終わり際に入力を始める意識で練習し、フレームメーターでコパとラッシュの間に隙間がなく、紫の部分(パリィ硬直)が3Fに収まっていれば成功だという。{{dc:1285810788199694408/1551613355205198016}}{{dc:1285810788199694408/1551636028887138337}}{{dc:1285810788199694408/1551636312749252750}}", "@jpdc 2026年10月の投稿では、SA2をパリィされたときの対処という質問に、歩き投げが安牌で、一応投げられるタイミングがあるのでそこで投げるという答えがあった。{{dc:1285810788199694408/1558032626777067574}}{{dc:1285810788199694408/1558033579173482517}}{{dc:1285810788199694408/1558033646139740172}}", "@jpdc 2026年11月の投稿では、大Kタゲコンからのコンボ、SA2を発動するときのSA2の最初にDリバは読み合いになっていないというのはなぜかという質問に、連ガにするときに使う小技にパリィを仕込めるからだという答えがあった。パリィを仕込んでおいてもDリバのときコパンが出ないのは、コパンの入力がDリバの暗転で消えるからだという。{{dc:1285810788199694408/1566712992475779086}}{{dc:1285810788199694408/1566715432373850137}}{{dc:1285810788199694408/1566743689399898145}}{{dc:1285810788199694408/1566768250434490482}}", "@jpdc 2026年11月の投稿では、大KタゲコンからSA2を発動したあとガードを崩す基本として、通常時の中央はしゃがみコパ→大足→中足、通常時の端はしゃがみコパ→中足→中足、バーンアウト時は中足→しゃがみコパ→中段という答えがあった。相手がパリィしていたら前ステップから様子見がほぼ最適解だという。端以外の大Kタゲコン発動は相手がきちんとしていればそれほど強くない連携なので、最近はOD弾発動にする人が多いという。{{dc:1285810788199694408/1570566996867817534}}{{dc:1285810788199694408/1570572143492866199}}{{dc:1285810788199694408/1570572158961189016}}{{dc:1285810788199694408/1570573872602808333}}", "@jpdc 2026年11月の投稿では、SA2を先端のジラントのガード後に発動するとコパが当たらない場合の扱いという質問に、バーンアウト中以外はコパが届かない距離の発動は崩しにならず、様子見してパリィ投げかリバガードの読み合いにするくらいしかない、前ジャンプすればJ弱Kが届くと思う、という答えがあった。無敵で割り込まれる、パリィを貼りっぱなしの相手もいるので、自分のゲージ回復で時間を稼ぎたいとき以外はやる意味が薄いという。高身長キャラなら中央でもコパ・中足・中足が連ガになるという。{{dc:1285810788199694408/1570584549065490465}}{{dc:1285810788199694408/1570585250810040463}}{{dc:1285810788199694408/1570585420721422387}}{{dc:1285810788199694408/1570585665132040384}}{{dc:1285810788199694408/1570586130842124362}}{{dc:1285810788199694408/1570587157104435295}}", "@oukoku 2024年2月の投稿では、大K→大P（ジラント）をガードされたあと何をすればよいかという質問に、2ゲージあればラヴーシュカ、連続ガードでドライブゲージを削れる連携を練習する、ノーゲージならキャンセルラッシュ小足・各種キャンセル必殺技・何もしない様子見を気分で使い分ける、という答えがあった。{{dc:1200611284408881324/1205058737740709898}}{{dc:1200611284408881324/1205060230568874026}}{{dc:1200611284408881324/1205060398185848842}}{{dc:1200611284408881324/1205060840953352192}}", "@oukoku 2025年4月の投稿では、ガードさせた大P＞ODトルバランキャンセルSA2＞前J大P＞中足の連携で、中足が相手を押してラヴーシュカの範囲から外れるという相談に、ODトルバランの最速キャンセルなら連携は問題なくガードさせられるという答えがあった。質問者が試すと、最初の大Pをガードさせる距離が近いとだめで、距離がずれると外れるシビアな連携だったという。{{dc:1200611284408881324/1362809401726992496}}{{dc:1200611284408881324/1362996236868784323}}{{dc:1200611284408881324/1363434801717182666}}"], "clips": [{"ch": "jpdc", "c": "1285864581478088776", "m": "1285943183338901548", "a": "みのーり", "d": "20240918", "x": "SA2からの補正切り大好きです"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1534270429617848441", "a": "くきおれ", "d": "20260805", "x": "SA2終了後にちょうど暴れに中段が埋まって詐欺飛びにも設置にも移行できて強いかもと思ったので…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1537103171858595840", "a": "九条ミアナ", "d": "20260812", "x": "JP端背負い時に引き中Pや大Kがヒットした時のSA2入れ替えガード困難連携 下りJ弱Kを深めに当ててしまうと最大+10Fとなり中足含めコンボ継続してしまいます。…"}, {"ch": "jpdc", "c": "1285864637199286312", "m": "1551063335242432614", "a": "たにつー", "d": "20260920", "x": "近距離でODトルバランSA2行った時ってどういうルートがありますか？"}, {"ch": "jpdc", "c": "1285810788199694408", "m": "1551613355205198016", "a": "メメ", "d": "20260922", "x": "SA2>コパ>生ラッシュ>コパ>小足のほぼガー不連携の組み方が下手で結構簡単にガード出来てしまうのですが、どこがダメなのかどなたか分かりますかね...？"}]}, {"title": "パリィとの読み合い：フェイントで釣り、投げを混ぜる", "body": ["@jpdc 2024年9月〜2024年10月の投稿では、アムネジアやラヴーシュカのあとにパリィし続ける相手を掴めない理由は、相手のガードと同時に投げると投げがスカるため、という答えがあった。ガードの一瞬あとに前歩きを挟んで投げる、ラヴーシュカの弾が当たる少し前に投げる、2段目から3段目が当たるまでの間に投げる、パリィの「キン」という音を聞いてから投げる、といったコツが挙がり、トレモで練習するのがよいという。{{dc:1285810788199694408/1290294107956183210}}{{dc:1285810788199694408/1290295767365586994}}{{dc:1285810788199694408/1290298487191240736}}{{dc:1285810788199694408/1295402333659856927}}{{dc:1285810788199694408/1295413146265190495}}{{dc:1285810788199694408/1295557437507506186}}", "@jpdc 2026年3月の投稿では、SA2のあと小P、中足、中足の連続ガードコンボで、小Pのところにパリィを仕込んでDリバをパリィで返すタイミングを聞かれ、同時押しでは出ず、2小P、パリィ、中足の順に素早く押すという答えがあった。2小Pの途中でパリィを押すので、何もなければ中足が出て、Dリバで時間が止まったときだけパリィが出る。ただし、この連携は連続ガードで相手が無敵技を出せないので、そもそも成立しないという。{{dc:1285810788199694408/1481978960622518375}}{{dc:1285810788199694408/1481980258805747794}}{{dc:1285810788199694408/1481980759156981790}}{{dc:1285810788199694408/1481981645513818163}}", "@jpdc 2026年3月の投稿では、似た連携として、大Pラッシュ、大K、素早くアムネジアと入力すると、相手がリバーサルしたらアムネジアが出て、何もなければ大Kをガードさせられるという話があった。SA2後のパリィ仕込みよりかなり難しく、失敗すると何もない空間でアムネジアを出すことになる。無敵技やSAには大Kをくらうという。BO時の起き攻めにアムネジアを仕込む小足もあるという。{{dc:1285810788199694408/1481982209278869605}}{{dc:1285810788199694408/1481983287844143155}}{{dc:1285810788199694408/1482903654838177998}}", "@oukoku 2025年7月の投稿では、セットプレイ中にパリィを押しっぱなしにされる相手には、パリィにどう対処するかより、それまでに投げ多めで攻めてパリィ自体にリスクを感じさせることが大事という答えがあった。連携中はパリィ押しっぱなしが安牌なので、連ガ連携か投げるタイミングを練習するとよく、大体の連携は設置やSA2が当たる直前にしか投げられないので、トレモでタイミングをつかむとよいという。{{dc:1389961233028878418/1389961233028878418}}{{dc:1389961233028878418/1391653886166827018}}"], "clips": []}, {"title": "ワープ：使い道と、見られ始めた対応", "body": ["@jpdc 2024年9月の投稿では、ODトルバランからSA2がヒットしたときは、前ステ→中スト→投げ（フレーム消費）→強設置が安定してダメージも出るという。その先は、弱棘→ワープ→詐欺飛び（両受け身対応）、2小P→F式（後ろのみ・ガード+1F）、シューティングに分かれ、状況で選ぶと紹介された。{{dc:1285864581478088776/1286744254437130312}}", "@jpdc 2026年8月の投稿では、調整後、ラヴーシュカヒット中にキャンセルでワープを出して悪さができそうで、F式が凶悪になっているのではという話が出た。設置→大Kタゲコン→ラヴーシュカ→小足キャンセルワープで中下択をかけると、最初の小足ワープジャンプ攻撃の時点でガードが間に合わないと死ぬ。中足でも行けたが、基本は相手がバーンアウトしているときだけという。{{dc:1288023709122039818/1533686317827887234}}{{dc:1288023709122039818/1533687832437325974}}{{dc:1288023709122039818/1533687939161264189}}{{dc:1288023709122039818/1533688020060868812}}{{dc:1288023709122039818/1533689538218819706}}{{dc:1288023709122039818/1533692394997027047}}"], "clips": [{"ch": "jpdc", "c": "1285864581478088776", "m": "1286744254437130312", "a": "BaRiki", "d": "20240921", "x": "ODトルバランSA2ヒット時のとりコレ 前ステ→中スト→投げ(F消費)→強設置 が安定かつそこそこダメージ出ると思います  弱棘→ワープ→詐欺飛び(両受け身対応…"}]}, {"title": "画面端のセットプレイ：トリグラフOD設置からの択とゲージの目安", "body": ["@nandene 2025年9月の動画では、画面端のコンボを伸ばし切り、相手がパニッシュカウンター投げで死ぬ体力なら、起き上がりでSA2を発動すると話している。最初の弾と2発目の弾の間に中足を差し込み、2発目をガードやパリィした後に投げにいく。{{aI6OgnkAk9o@124}} {{aI6OgnkAk9o@165}} {{aI6OgnkAk9o@194}}", "@jpdc 2024年9月の投稿では、画面端でODトルバランからSA2がヒットしたときのセットプレイが紹介された。最初のトリグラフは中ストリボーグでも可能で、中下の2回択が+9F、バーンアウト時は連ガになる。弱ワープで無敵をケアしたF式も可能という。{{dc:1285864581478088776/1286026238884053122}}", "@jpdc 2025年1月の投稿では、画面端限定で、大P→ODトルバラン→SA2がヒットしていた場合の入れ替え→中下段が紹介された。先端すぎるとテレポートで入れ替わらないことがあり、2回目の設置は弱設置より大設置がよい。画面中央でも、相手が後ろ受け身をしていなければできるが、追撃は変える必要があるという。{{dc:1285864581478088776/1326734787473576009}}{{dc:1285864581478088776/1326739871557226526}}{{dc:1285864581478088776/1326741380336451635}}", "@jpdc 2025年1月〜2025年2月の投稿では、端背負いからの裏投げ→SA2→上りJ中Kというセットプレイがあるのかという質問に、セットプレイというより読み合いの一種で、リバサ前ジャンプでラヴーシュカから逃げようとする相手を咎める手段、という答えがあった。{{dc:1285810788199694408/1334808438257094706}}{{dc:1285810788199694408/1334925910029238282}}", "@jpdc 2025年4月の投稿では、画面端での通常設置からのセットプレイとして、大P設置（+15）からの形が紹介された。大Kターゲットコンボ→SA2→しゃがみ小P設置起爆→中足で中下がガード困難、ラッシュ投げで+41の詐欺飛び、ラッシュ引き中Pは4Fと相打ち（ただしOD昇竜確定）、ラッシュしゃがみ小Pは持続が当たって+4でシミー可能（OD昇竜確定）という。大Pが高めに当たると+16になり、一部の形ができなくなる。{{dc:1285810788199694408/1356826823543099475}}{{dc:1285810788199694408/1356841584984985671}}", "@jpdc 2025年7月の投稿では、最終ラウンドで自分のゲージが5.2本近くあり、画面端の相手にいつものコンボを入れたあとの設置起き攻めを問われた。相手の体力が残り5割で、こちらのSAゲージが3本あればシミーが通ればリーサルになりそうなので、ノーマル設置+15Fからラッシュ2弱P>シミーを狙うという答えがあった。相手のドライブゲージが少ないなら、同じ設置から強K強Pタゲコン>SA2>2弱P>キャンセル起爆>2中Kのガード困難連携もよいという。{{dc:1285810788199694408/1391713437775822959}}{{dc:1285810788199694408/1391715928525242462}}", "@jpdc 2025年8月の投稿では、ODトルバランがヒットしてのSA2発動後にも、以前紹介されたセットプレイが使えた。+6なので最速投げだとスカって体感の投げ重ねになるが、そこからいつも通りコンボに行けるという。{{dc:1285864581478088776/1410199963954315374}}", "@jpdc 2025年12月の投稿では、端でOD設置をめくり当てするネタが紹介された。前ジャンプJ中Kがその場でめくりをくらった後に拾えて安定し、設置ガード後のJ中K透かしは+42Fで安全に端を抜けられる。ただ受け身をされると対策になるので、相手が端で受け身をしない人か見て使うかを決め、受け身をサボらない人にはSA2後に中足→ワンガード投げにするという。{{dc:1285864581478088776/1448950094677409864}}{{dc:1285864581478088776/1449404506646253732}}{{dc:1285864581478088776/1449410218277732464}}", "@jpdc 2025年12月の投稿では、設置めくり当ての改良版が出た。条件は端のインパクト、または中央の強スト→ラッシュ前大Kを一番端に近い位置で当てたときで、SA2→バックジャンプ投げ→2中K→弱強設置→3大P→弱ワープJ中K。相手が3大Pの起き上がりに後ろ入れっぱなしだと、めくらず表でガードされる。SA2後の中足は中下がほぼ同時に来るのでガード困難になるという。{{dc:1285864581478088776/1449762269440245872}}", "@jpdc 2026年4月の投稿では、画面端でSA2がヒットしたあと、中足→立ち中K→キャンセルインパクト→OD設置とすると+22が作れて中段持続になり、しゃがみコパから自動起爆がコンボになる。たまに見せるセットプレイとしてはかなり強いかもしれないという。{{dc:1285864581478088776/1495746793500049419}}", "@jpdc 2026年5月の投稿では、画面端の大P→「棘」→OD設置で+4を取る形から、掴みからのコンボ、5中K→弱ボーグ→2中K、4中P→弱ボーグ→2中P→大TC→SA2連携の3つで読み合う形が紹介された。どれもリターンが高く、打撃が当たればゲージのある限りループする。5中Kは当たると大きく減り、4中PはDゲージ削りの択になる。弱点は、無敵読みでガードやワープされても最大コンボが難しく、アドリブになることという。{{dc:1285864637199286312/1503189357492965397}}{{dc:1285864637199286312/1503283590241189938}}", "@jpdc 2026年6月の投稿では、画面端の5大P→ODヴィーハトからの起き攻めへの入り方として、端まで一度運んでいれば、通常設置締めのあと大K重ねや中段で崩し、設置起爆後に前大Kで拾う形があるという答えがあった。大P拾いからの設置セットアップへの入り方は、普通の運びコンボのほか、設置ヒットからの拾い、SA2運び、前大K対空コンボ、インパクト、端背負いアムネジアの後ろ投げなどがある。{{dc:1285864637199286312/1516670583922753680}}{{dc:1285864637199286312/1516671183536263259}}{{dc:1285864637199286312/1516746987377000609}}", "@oukoku 2025年12月の投稿では、画面端の大P空中拾い→通常設置（+15f）のあとは、遅らせ大K大P TC→SA2→しゃがみ小P→起爆→中足がガード困難な連携で、ガードされたことがないという。遅らせ大K大P TCがヒットしていれば起爆→前大Kとつなぎ、確認できなくても起爆を当てれば+10あるので攻めを継続できる。リーサルが見えたときは補正切り大TC3段目の中下の択を使い、当たればラッキー程度という。{{dc:1447591780555165910/1447785478576148480}}", "@oukoku 2025年6月の投稿では、画面端で弱ストリボーグが当たったあとの攻めとして、詐欺インパクトがおすすめという意見があった。相手に無敵がなければ強ストリボーグも面白く、適当にTC引き中→SA2→2中P→中足→中足→立ち弱Kなどで連ガも作れるという。{{dc:1384259452852502538/1384259452852502538}}{{dc:1384259452852502538/1385099231404097638}}{{dc:1384259452852502538/1386309311021449371}}", "@oukoku 2025年5月〜2025年6月の投稿では、画面端の処理を尋ねる質問に、モダンの回答者は端に追い詰めて密着が作れるなら基本は柔道にして、投げを基本に中トルバランとインパクトで択をかけるという。相手のドライブゲージが切れそうな時やバーンアウト中はODトルバランで圧をかけ、強K＞強P＞ラヴーシュカで削りを狙うこともある。端でガードさせてからラヴーシュカを狙うとDリバや無敵技が飛んできやすいので、一度ガードする方がよい場合が多いという。{{dc:1371309587679940638/1371309587679940638}}{{dc:1371309587679940638/1381201362884362250}}"], "clips": [{"ch": "jpdc", "c": "1285864581478088776", "m": "1286026238884053122", "a": "BaRiki", "d": "20240919", "x": "画面端ODトルバランSA2ヒット時のセットプレイ 最初のトリグラフは中ストリボーグでも可能 中下2回択って+9F、バーンアウト時連ガ 弱ワープで無敵ケアのF式可…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1326734787473576009", "a": "もふ", "d": "20250109", "x": "既出だったらすみません、画面端限定ですがこれどうですか 大P ODトルバラン SA2がヒットしてた場合の入れ替え→中下段です あまりにも先端過ぎるとTPで入れ替…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1410199963954315374", "a": "あめーば", "d": "20250827", "x": "以前コンボ紹介で紹介されていたセットプレイODトルバヒットSA2発動からもいけそうでした。＋6なので最速投げだとスカってしまい体感の投げ重ねになってしまいますが…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1448950094677409864", "a": "九条ミアナ", "d": "20251212", "x": "端でOD設置をめくり当てするネタ（既出でしたらすみません） SA2後2回目の中足はがばいです（2回目の中足を遅らせ投げ変更で投げ抜け後SA2最後の中段が起き攻め…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1449762269440245872", "a": "九条ミアナ", "d": "20251214", "x": "設置めくり当て改良してみました。 条件は端のインパクト、中央の強スト→ラッシュ前大Kを一番端に近い位置で当てた時。 SA2後のレシピは SA2→バックジャンプ投…"}]}, {"title": "詐欺飛びと補正切り：リターンと読まれ方", "body": ["@ryusei 2026年10月の動画では、視聴者の研究として、SA2を使わずにOD設置から詐欺飛び、連携へ行くルートが紹介された。始動技によって有利フレームが変わり、連携が成立するかが決まる。ダメージが落ちる場面でも、ルートを持っておくことが大事だと話している。{{uubdHE64DtM@28}}{{uubdHE64DtM@199}}{{uubdHE64DtM@972}}", "@jpdc 2024年9月の投稿では、画面端SA2のF式で2回目のジャンプ攻撃をしゃがんでいる相手に当てる方法を聞く質問に、ヴィーハト設置が最速になっていないと詐欺飛びが+41Fになって高めにヒットしてしまう、との答えがあった。中ストリボーグをトリグラフに、立小Pをしゃがみ小Pに変えるとガード後も+1F取れるといい、実際にしゃがみにも当たった。{{dc:1285810788199694408/1288846835150229557}}{{dc:1285810788199694408/1288887024215916546}}{{dc:1285810788199694408/1289016619506470943}}{{dc:1285810788199694408/1289094582050754621}}", "@jpdc 2024年9月の投稿では、ラヴーシュカ後の投げ補正切りが紹介された。SA2→2中P→強K→4中P-中P→キャンセルOD中強設置（+2F）→投げ→設置ヒット→強P→キャンセルOD弱強トリグラフ→強トリグラフで、中パリィ押しっぱなしの人に刺さる。ノーキャンセル強設置（+4F）のゲージ温存版もあるが、バレやすい。{{dc:1285864637199286312/1290156348356694036}}{{dc:1285864637199286312/1290161765484728391}}{{dc:1285864637199286312/1290162892267716618}}", "@jpdc 2024年10月の投稿では、F式のルート例として、大P拾い→トリグラフ→OD設置→2大P→弱ワープ→J大K→J弱K、SA2からならSA2→弱K→インパクト→設置→2弱Pでフレーム消費→ジャンプ、などが挙がった。{{dc:1285864637199286312/1296488405135265815}}{{dc:1285864637199286312/1296489296034795600}}{{dc:1285864637199286312/1296492066662256751}}", "@jpdc 2024年10月の投稿では、SA2のあと中足→立ち強K→4中P-4中P→キャンセルOD設置→投げと繋ぐ、投げ補正切り連携が紹介された。投げ前が-2F程度の不利フレームなので、ラヴーシュカヒット中にSAを回す相手のSAもガードできる。パリィ押しっぱなしならパニカン投げで、初見にはまず通る。中足を2中Pにすれば+2Fからの投げになるという。{{dc:1285864581478088776/1298255576131829760}}", "@jpdc 2025年4月の投稿では、設置+15Fからのタゲコン→SA2がヒットしていたときのフォローとして、（ノーマル設置+15F後）強K強Pタゲコン→SA2→2弱P→ワープジャンプ強K→強P→設置→強P→インパクト→設置ヒット→6強K→中ストリボーグ、という繋ぎが紹介された。{{dc:1286267508164399157/1357507583753191434}}", "@jpdc 2025年9月の投稿では、SA2の補正切りで設置→投げ→起爆ヒットに繋ぐレシピとして、大TC→SA2→しゃがみ中P→大K→引き中PTC→中大設置→投げ→大Pが挙がった。初手を中足にすると設置後-2Fになり、相手がリバサSAを入れ込んでいた場合はこちらが不利なのでパリィで対処できる。超ぼったくりだが、知らない相手にはかなり通るという。ゲージが足りないときはノーキャンセル強設置で投げる形もある。{{dc:1285864637199286312/1411943264952651848}}{{dc:1285864637199286312/1411959305921499176}}{{dc:1285864637199286312/1411976635615547462}}", "@jpdc 2025年9月の投稿では、端で浮かせて大P拾いからSA2ルートに行ったあとの起き攻めとして、SA2→弱ボーグ→中ボーグ→設置→立弱P→J大K→J弱Kか中足が挙がった。J大Kは詐欺飛びになり、その後は中下段の二択になるという。{{dc:1285864637199286312/1418781842437312582}}{{dc:1285864637199286312/1418786725425320017}}", "@jpdc 2025年9月〜2025年10月の投稿では、ジラントなどからSA2→2中K→5強P→ジラント→インパクトの補正切りで、ラヴーシュカ4発目が最後のジラントの後に当たるとインパクトまでコンボになる、という質問が出た。ド密着で始動すると2中Kで相手を押して4発目のヒットが遅れるためで、2中Kを立ち中Kにすれば補正切りになるという答えだった。{{dc:1419546661121822790/1421365305950867618}}{{dc:1419546661121822790/1433050188821565460}}{{dc:1419546661121822790/1433377155034775612}}", "@jpdc 2025年11月の投稿では、設置+15のあと、ガードの上から大KタゲコンSA2をしようとしてタゲコンが当たってしまったときのF式セットプレイが紹介された。SA2→立ち中K→弱スト（ノーキャン）→通常設置→立ち小P（フレーム消費）→前ジャンプ大K→前ジャンプ小Kで、詐欺飛びは+42あるという。{{dc:1285864581478088776/1439514454109716561}}", "@jpdc 2025年11月の投稿では、大Pヒット時のOD弾SA2で、大Pが先端から中間の距離のときに詐欺飛びが行けた。中央と端で密着ヒットを調べても43Fしか見つからず、ネタ連携として置いたという。{{dc:1285864581478088776/1439642422840660108}}", "@jpdc 2026年3月の投稿では、SA2からOD設置つきの詐欺飛びに行くルートの質問に、画面端でジラント発動SA2→立ち中K→前ステ→しゃがみ大P通常設置→大ストリボーグ→投げフレーム消費→OD設置がF式の詐欺飛びになるという答えがあった。SA2のヒット時にゲージを1本削るので、相手がバーンアウトするときにやると強いという。{{dc:1285810788199694408/1487233076605227169}}{{dc:1285810788199694408/1487248184215343134}}", "@jpdc 2026年3月の投稿では、SA2の補正切り連携が2つ紹介された。画面端のラヴーシュカ補正切りは崩した後にシューティングの状況を作れるが、キャミィ・テリー・ベガ・リリィのSA2とダルシムのSA2・SA3には負ける。中央のラヴーシュカ補正切りはワープ補正切りと違って弾抜けをケアできないが、運びのコストが低く、SA1はケアできるという。{{dc:1285864581478088776/1488507207384563753}}", "@jpdc 2026年4月の投稿では、SA2の連ガからF式に行くレシピとして、強P→キャンセルラッシュ4中P→SA2→2弱P→2中K（ここまで連ガ）→登り弱Kジャンプか2中Kが挙がった。引き中P始動の形で、画面端なら4中P始動でなくてもF式になるのでは、という見方も出た。{{dc:1285864637199286312/1490610967967563848}}{{dc:1285864637199286312/1490613563956400170}}{{dc:1285864637199286312/1490613760535171152}}{{dc:1285864637199286312/1490614554194088008}}", "@jpdc 2026年4月の投稿では、キャンセルラッシュからSA2を出してしまい、ドライブゲージが回復しないときのための補正切りが紹介された。2弱Kのヒット硬直が短いのでコンボが切れ、中足とラヴーシュカ4発目の中段でガードが難しくなる。中足起爆が追加されてできるようになったという。MR2000の人3人に試して全部通ったとのこと。{{dc:1419546661121822790/1499023462868586637}}{{dc:1419546661121822790/1499332180969525348}}", "@jpdc 2026年6月の投稿では、画面端の補正切りからの「墓場連携」が紹介された。通ればDゲージなしで設置起き攻めができ、垂直F式にすることでノーゲージの設置起き攻めになる。初見でパリィしてくる人は少なく、パリィされたときは投げか前ジャンプで無敵や投げ抜けを狩るのがよさそうという。舞のSA1とダルシム・リリーのSA2は×とされた。{{dc:1285864637199286312/1513848841512816781}}", "@jpdc 2026年8月の投稿では、画面端のOD弾ヒットから発動したSA2を最速入力すると+67になり、最速のOD設置→前ステで密着+5になる（動画は1F遅く+4だった）という。{{dc:1285864581478088776/1535687470832812102}}", "@jpdc 2026年8月の投稿では、ODアムネジア（+4）→屈弱P×3→DR前中KかDR中足→屈中P→SA2で、補正切り・中下択・連ガ・入れ替えができて強いのではという案が出た。ただダメージから復帰するときにパリィを単押ししておけば、割と全部に対応できるのではとも書かれている。{{dc:1419546661121822790/1537377366974660629}}", "@jpdc 2026年8月の投稿では、SA2→2中K→強K→2中K→強設置とするラヴーシュカ補正切りで、-1Fから前投げを出す形が紹介された。前投げ→設置ヒット→強P→ODトルバラン→SA1などに繋がり、画面端なら+4F設置と同じレシピが入る。投げ前が-1Fなので、SAで割り込まれてもガードできるという。{{dc:1419546661121822790/1540688615758372934}}", "@jpdc 2026年9月の投稿では、JPの連携について、ヴィーハト設置からフレームを消費して生ラヴーシュカが抜けられないようにしているという指摘があった。大P＞弱ストリボーグ＞弱K（F消費）＞OD設置＞前ジャンプ弱K＞昇り垂直弱K（F式）のルートも示され、+11を取るのは難しいが受け身両対応という。最初のJ弱K次第で繋がらなかったり連ガにならなかったりと、難度はかなり高い。{{dc:1285800688097562715/1545758173367898224}}{{dc:1285800688097562715/1545778592175235252}}{{dc:1285800688097562715/1545779691607302185}}", "@jpdc 2026年9月の投稿では、画面中央で汎用性の高いF式連携が紹介された。SA2の最終弾から弱ストリボーグで当たれば成立し、咄嗟の崩しからでも対応できる。起き上がり両対応で、状況が限られていた中央のF式が狙える場面がかなり増えるので、中央F式のレシピはこれに統一してもよいかもしれないという。{{dc:1285864581478088776/1549428348931801088}}", "@jpdc 2026年9月の投稿では、SA2からインパクトを挟んで詐欺飛びのF式に行くルートとして、SA2発動→立弱Kキャンセルインパクト→設置→屈弱Pで+42だったはず、という答えがあった。別の答えでは、立弱K→インパクト→設置→しゃがみ小Pでフレーム消費→F式と、立弱K→インパクト→引き中P消費→OD設置→F式の2つがあるはず、とされた。{{dc:1285864637199286312/1553263152769273937}}{{dc:1285864637199286312/1553263697236066386}}{{dc:1285864637199286312/1553263758330298399}}", "@jpdc 2026年11月の投稿では、モダンJPの中アシストのSA2漏れから、大P→中ストリボーグ→前跳び→弱設置とすると、設置付きで+42Fを取れ詐欺跳びに行ける。F式は無理で、J大K→中足→（5Fほど空けて誘爆）となり、2889ダメージで火力は低いが簡単なので、誤爆したときのリカバー程度に使えるという。{{dc:1285864581478088776/1572171035598520441}}", "@oukoku 2024年2月の投稿では、画面端でコパンか小足を当てたあとのSA2補正切りコンボが共有された。強トルバランから前ステしたあとは、インパクトかコマ投げがおすすめだという。{{dc:1204625782387908679/1208446012558020672}}", "@oukoku 2024年5月の投稿では、次のアップデートで終わりそうなので今のうちにランクで使ってほしい連携が挙げられた。大K大P→SA2→小K→インパクト→設置→2小P（フレーム消費）→ジャンプ大K、大K大P→2大P→前ステ（フレーム消費）→6大K→設置→2小P（フレーム消費）→ジャンプ大Kなどである。{{dc:1204625782387908679/1236312353101058220}}{{dc:1204625782387908679/1236312878663864360}}{{dc:1204625782387908679/1236313068053594204}}", "@oukoku 2024年5月の投稿では、調整後のSA2詐欺飛びの「F式」コンボとして、ODストリボーグ1段目キャンセルSA2→大P→ノーキャンセル中ストリボーグ→設置→立ち弱K→ジャンプ大K→ジャンプ弱Kか中K、が紹介された。従来のF式よりダメージは少し落ちるが、ドライブゲージの効率がよいという。{{dc:1200611284408881324/1246007539015880725}}", "@oukoku 2024年6月の投稿では、調整後に使えそうなルートとして、大K→大P→SA2→小K→インパクト→設置→2小P（フレーム消費）→ジャンプ大K、と、大K→大P→2大P→前ステ（フレーム消費）→6大K→設置→2小P（フレーム消費）→ジャンプ大Kが挙げられた。この二つは調整前と同じで、他のルートは2中Kと5大Kの順番を変えれば使えそうだという。{{dc:1200611284408881324/1246447991586422805}}{{dc:1200611284408881324/1246448282511605872}}{{dc:1200611284408881324/1246448494877872168}}{{dc:1200611284408881324/1246448858222039090}}"], "clips": [{"ch": "jpdc", "c": "1285810788199694408", "m": "1288846835150229557", "a": "きせ", "d": "20240926", "x": "質問失礼します。 このような画面端SA2のF式？で2回目のジャンプ攻撃をしゃがんでる相手にあてる方法あれば教えていただきたいです。"}, {"ch": "jpdc", "c": "1285864637199286312", "m": "1418781842437312582", "a": "豚の丸焼き", "d": "20250920", "x": "端で浮かせて大Pで拾ってSA2ルートに行くとき、とりあえずこのコンボをやってるんですけど、他にいい起き攻めがつくコンボとかセットプレイってあったりしますか？"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1439514454109716561", "a": "onitthi", "d": "20251116", "x": "クリップのお試しがてらに撮ってみました。既出な気はしますが、設置+15の後ガードの上から大KタゲコンSA2しようとしたときにタゲコンが当たっちゃったなぁ...っ…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1439642422840660108", "a": "九条ミアナ", "d": "20251117", "x": "大Pヒット時のOD弾SA2で大Pが先端から中間の時に詐欺飛び行けました。 中央と端で密着ヒット調べたのですが43Fしか見つけれずネタ連携として置いてきます。"}, {"ch": "jpdc", "c": "1419546661121822790", "m": "1499023452802256976", "a": "ガーカス", "d": "20260429", "x": "やべ、キャンセルラッシュからSA2やっちゃった ドライブゲージ回復しないじゃん  ってなった時用の補正切り 2弱Kのヒット硬直が短いのでコンボが切れてる 中足と…"}, {"ch": "jpdc", "c": "1285864581478088776", "m": "1535687470832812102", "a": "シュカ", "d": "20260809", "x": "端のOD弾ヒット発動SA2から最速入力で+67 最速OD設置前ステで密着+５（動画は1F遅くて+4）"}, {"ch": "jpdc", "c": "1419546661121822790", "m": "1537377366974660629", "a": "ノーワン", "d": "20260813", "x": "ODアムネジア(+4) > 屈弱P*3 > DR前中K or DR中足 > 屈中P > SA2で補正切り、中下択、連ガ、入れ替えで強いかなと思ったんですが ダメ…"}, {"ch": "oukoku", "g": "1182838025038872637", "c": "1200611284408881324", "m": "1246007539015880725", "a": "夢見弖ねこむ CJP MR1600", "d": "20240531", "x": "JP調整後のSA2詐欺飛びF式コンボルートです。（従来のF式よりダメージは若干落ちてるけど、Dゲージ効率良き） ODスト1段目キャンセルSA2→大P→ノーキャン…"}]}, {"title": "相手キャラ別の注意：ダルシム、イングリッド、リリー、ED ほか", "body": ["@ryusei 2025年11月の動画では、リーチの短いキャラ相手に、少し下がってから設置して固める形が試された。豪のようにSA2が前進するキャラには当たってしまう。{{o_E9F7DRYac@214}}{{o_E9F7DRYac@371}}", "@jpdc 2025年8月の投稿では、サガットも太いキャラなので、画面中央で強K強Pタゲコン→SA2から2弱P→2中K→2中Kが連ガになるという報告があった。{{dc:1288023709122039818/1402281129612148966}}"], "clips": []}, {"title": "相手はこう返してくる：大Pからのセットへの対応", "body": ["大Pから直接ヴィーハトを起爆する連携は暴れ潰しなので、相手は動かず、起爆を見てジャストパリィするのが最もよい。起爆へのジャストパリィは補正がかからず、爆発のダメージを与えられる強みがある。起爆からラヴーシュカにつなぐ形は、真面目にガードするのはほぼ無理なので、相手はドライブリバーサルで返すのがおすすめだ。 {{KMrV_6C9Huw@188}} {{KMrV_6C9Huw@222}}", "バーンアウト中も、トリグラフから始まる同じ連携が来て、小P、トルバランまで連ガになる。相手はトリグラフを見てからSA3やSA2を撃つのが最もよいが、SAゲージが1本しかなければ受け入れるしかない。ヴィーハトのワープは、設置の後に穴の真下付近にいると裏側に落ちてくるめくりになり、穴から離れていれば正面に落ちる（2026年5月13日の配信）。 {{KMrV_6C9Huw@292}} {{tpQg36xBmD0@8706}} {{84fijnCF6Io@6022}}"], "clips": []}, {"title": "セットプレイの優先順位と注意：再現性、手札、入力ミス", "body": ["@ryusei 2026年9月の動画では、条件が緩く、どこからでも行ける連携が紹介された。練習すればすぐできると話している。また、バーンアウト中でもラヴーシュカがあれば使えるという。{{rJiaob7ZXGs@884}}{{rJiaob7ZXGs@902}}{{rJiaob7ZXGs@1171}}", "@nandene 2025年6月の動画では、この連携は、入れ替えからも、崩した直後にも狙えない。SA2のワンコンボで殺しきれない時に狙うと、ほとんどの相手が食らうという。字幕では、打撃がヒットすれば約4000ダメージだ。{{7K9u3PcWeL8@136}}{{7K9u3PcWeL8@150}}{{7K9u3PcWeL8@163}}", "@jpdc 2025年2月の投稿では、「セットプレイ紹介」に書かれた中K>ラッシュ4中P>SA2をやるようになってからMRが100上がった、1500〜1600帯ならとても刺さる、という報告があった。{{dc:1285800688097562715/1335534468953542728}}", "@jpdc 2025年3月の投稿では、JPの立ち回りへの指摘として、相手がBOしそうなときはそんなにトリグラフを重ねなくてよい、ラヴーシュカ中に相手がパリィできないゲージ量になったらレンガを組む必要はない、生ラッシュを使う、という点が挙がった。設置後はキャンセルできる中技で前歩きを咎めて対空し、削りが見えているときは詐欺飛びから入る、無敵のないキャラにシミーをしすぎ、という指摘もあった。{{dc:1285811529157185548/1349442075795652679}}", "@jpdc 2025年7月の投稿では、JPで意識する点として、差し返しが狙えない場合は技を振って相手を近づかせない、「2があるとき」は積極的にラヴーシュカを使う、という指摘があった。ODアムネジアでコマ投げを取ったときは前ステ裏投げ、端で中段を取ったときは基本的に裏投げ、JPミラーは生ラッシュ多めでもよい、という内容も添えられた。{{dc:1285811529157185548/1390982897472639056}}", "@jpdc 2026年2月の投稿では、JPで有名な連携の通称として、gain式（強P、OD設置+25F、2弱Pでフレーム消費、4中Pを2回、中下弾の択）と、たいじ式（SA2、中K、前ステ、強Pキャンセル弱設置、前ステ、強K強Pタゲコン、2中Pキャンセルアブニマーチかインパクト）が紹介された。F式はギルティギア勢のFさんから来ているはずで、ストリートファイター由来の名前ではないという。{{dc:1285810788199694408/1475345579608510495}}{{dc:1285810788199694408/1475348569061064807}}{{dc:1285810788199694408/1475348868617994271}}", "@jpdc 2026年11月の投稿では、画面端の設置セットプレイが覚えづらく、SA2の打ちどころが見つからないという悩みに、慣れるまではラヴーシュカ連携は1、2個でいい、という答えがあった。本人は、コンボ、コパ中足連打、コンボ＞インパクトダブルアップの3つを覚えており、F式に行く形は、ジラントからの始動しか練習していないため実戦で当てられないという。{{dc:1285800688097562715/1567787089444085871}}{{dc:1285800688097562715/1567787245883228292}}{{dc:1285800688097562715/1567789133089476689}}{{dc:1285800688097562715/1567789665761628232}}", "@oukoku 2025年6月の投稿では、コマ投げのコマンドを入力しているのに出ないという質問に、ヴィーハトの設置中やラヴーシュカの発動中はコマ投げを出せない仕様だという答えがあり、質問者は疑問が解消したと返した。{{dc:1200611284408881324/1384221941614907473}}{{dc:1200611284408881324/1384260313104519219}}{{dc:1200611284408881324/1384263901222404096}}"], "clips": []}, {"title": "アムネジア・アブニマーチからのセットプレイ", "body": ["@jpdc 2025年1月の投稿では、アブニマーチを使うセットプレイとして、SA2→中足→大P→強設置→前ステ→大K→大P→2大P→アブニマ、SA2→中足→大K→2大P→強設置→大足→しゃがみ弱P→大K→アブニマ、画面端の前投げ→アブニマが挙がった。端の前投げ後すぐのアブニマーチが最強といい、前投げ→ラッシュ2強P→アブニマーチは無敵以外では割り込めないという。{{dc:1285864637199286312/1324798326335344671}}{{dc:1285864637199286312/1325077187727986739}}{{dc:1285864637199286312/1326035735312338954}}", "@jpdc 2025年2月の投稿では、詐欺飛びのJ大Kや、詐欺飛びのジャンプ攻撃から屈大P、ジャストパリィのコパ、ワープ後、ラヴーシュカ最終弾のガード後からのアブニマーチが挙がった。ジャストパリィのあとの大P→大K大P→アブニマーチは補正切りになるという。{{dc:1339509176694603809/1339532587479334983}}{{dc:1339509176694603809/1339532829469442098}}{{dc:1339509176694603809/1339534361078534154}}{{dc:1339509176694603809/1339558005276147743}}{{dc:1339509176694603809/1339560776385564784}}{{dc:1339509176694603809/1339567785864466563}}", "@jpdc 2025年4月の投稿では、いちばん有名なたいじ式として、SA2→中K→前ステ→強P→キャンセル弱設置→前ステ→強K強Pタゲコン→2中P→キャンセルODアブニマーチが挙がった。応用で、2中Pに変えて、なるべく引き付けて前ジャンプ強P→アブニマーチにしても埋まっているという。{{dc:1339509176694603809/1364616897475117158}}"], "clips": []}, {"title": "SA2・SA3のあとの起き攻め", "body": ["@jpdc 2024年10月の投稿では、SA2のあと、最後のジャンプで攻撃ボタンを押すと裏、押さないと表になるネタが紹介された。裏からの前ジャンプで表の択もできる。ただ2P側だと裏の択が再現できず、バグか仕様かは分からないという。{{dc:1285864581478088776/1290348758743126018}}{{dc:1285864581478088776/1290351655879053383}}", "@jpdc 2024年10月の投稿では、SA2の起き攻めに決まったレシピはなく、相手がだいたいパリィするのでそれを投げる、飛ばれないよう中足を振る、という答えがあった。別の答えでは、端のコンボ〆からSA2を出すと1発目の弾が起き上がりに重なり無敵技をケアでき、連ガにならず4F以上空かない間隔で中足を振って中下段とジャンプ阻止を兼ね、そのあと最速2中Pで崩すか投げるという。{{dc:1285864637199286312/1298876288710475777}}{{dc:1285864637199286312/1298882631928123393}}", "@jpdc 2024年10月の投稿では、SA2をコンボで使ってもダメージは伸びないが、起き攻めに使えば崩せたり相手のミスで無からダメージを取れる、という考えが示された。中央から運ぶためにSA2を使うより、ドライブゲージ4本で端まで運んでから起き攻めSA2を狙うほうがランクでは勝ちやすいという。{{dc:1285864637199286312/1298882631928123393}}", "@jpdc 2025年3月の投稿では、SA2のコンボで大足OD設置から表裏に行く連携として、大Kターゲットコンボ>SA2>中足>5大K>2大P>弱強設置>大足が紹介され、最速の中アクノで裏に回れるという。画面端ならターゲットコンボ発動>中足>5大P>OD設置（強度問わず）>大足>中アクノで捲れるという。{{dc:1285810788199694408/1355360134913720370}}{{dc:1285810788199694408/1355360849371463800}}{{dc:1285810788199694408/1355360967336394853}}{{dc:1285810788199694408/1355363293820223529}}", "@jpdc 2026年5月の投稿では、「mochi式」のもう1つは、+35〜45FでSA2の起き攻めをする形だと説明された。この状況なら、ダルシムとリリーのSA2以外をすべて拒否できる。BOの相手には安全にガード困難連携ができ、大体のコンボ締めから行けるので使う場面が多いという。{{dc:1285864637199286312/1504084149190000716}}{{dc:1285864637199286312/1504375207962476675}}", "@jpdc 2026年5月の投稿では、BO中の相手へのヒット発動SA2で、2中P→強設置→前ステ→中K→ワープのガード困難は、2中Pと立ち中Kの入れ替えはおそらくなく、最初の2中Pが先端ぎみだと成立しないという答えがあった。密着でないときは立ち中K→強設置→前ステ立ち中K→ワープで入れっぱなしを殴れるという。{{dc:1285864637199286312/1505886582157344880}}{{dc:1285864637199286312/1506847694683897926}}", "@oukoku 2026年4月の投稿では、中央のSA2で小パン→大足のレンガ連携から大足で相手が転んだあと、パリィしないタイプには起き上がりに素の中段を重ねるとほぼ確実に崩れるという答えがあった。パリィしてくる人には、SA2最後の中段の前に、投げか下段の2択をかけるという。{{dc:1495744927257071818/1495744927257071818}}{{dc:1495744927257071818/1496529640209125459}}", "@oukoku 2026年1月の投稿では、ジラント（大Kタゲコン）→SA2で密着でないときの行動として、中足連打で崩しに行く、無敵やリバーサルを警戒して様子見してから投げや中段を打つ（SA2の1発目をガードさせたところが目安）、歩き投げ、めくり攻撃が挙げられた。{{dc:1458368997287395361/1459847405263519786}}{{dc:1458368997287395361/1459855540887748772}}", "@oukoku 2026年2月の投稿では、SA2のあとのガー不連携ができなかったという相談に、そのガー不連携はジラントがド密着のときに使えるもので、当たり方が密着でなかったためガー不にならなかったという答えがあった。無理にガー不に行くなら、キャンセルラッシュでもう一度ジラントに行ってド密着にする必要があり、ガー不でもパリィで防がれるのでバーンアウトしていないときは過信しないほうがよいという。{{dc:1471120064018382950/1471120064018382950}}{{dc:1471120064018382950/1471156007555043409}}", "@oukoku 2025年9月の投稿では、SA2を出したあと相手が常にパリィを押していて投げがスカるのが怖くて押せないという相談に、「キンッ」というパリィの音が鳴り終わるころに投げると投げられるので、トレモで試してタイミングをつかむとよいという答えがあった。{{dc:1419250841407328377/1419250841407328377}}{{dc:1419250841407328377/1419560594930929685}}", "@oukoku 2026年5月の投稿では、JPがSA2をガードさせている時の連携を尋ねる質問に、大Kタゲコンからは屈コパン→中足→中足or中足→中段が多く、OD玉からはOD玉1段目キャンセルSA2→ジャンプ大K→中足or小足をよくやるという答えがあった。{{dc:1503709854211244034/1503709854211244034}}{{dc:1503709854211244034/1504326093510021221}}", "@oukoku 2026年4月の投稿では、JPのSA2のあとの連携として、強K>強P>SA2→2弱P→2強K→2中K→2弱P→強P、強K>強P>SA2→2中K→2中P→6中K、強K>強P>ODトルバラン（弾）>SA2始動から前J弱K→6中K→強ストリボーグ、の3つが挙がった。2つ目はかなり難しいので割り込みが大事で、3つ目はJ弱Kをガードしたあと、Dリバもありだという。{{dc:1493451469704265821/1493451469704265821}}{{dc:1493451469704265821/1493976390486458538}}", "@oukoku 2024年5月の投稿では、22日の調整後にSA2の全弾連ガード連携として、ラッシュ大P→SA2→4中PTC→小K→2中K→2中Kが紹介された。SA2後の引き中が当たる距離までめり込ませないと始まらないが、小K後は+15、最初の2中K後も+14で、大KTCまで行けば相手のドライブゲージをかなり削れるという。小K後は後ろからの弾が相手を引き付けるので、パリィを張る相手にはここで投げもできるという。{{dc:1200611284408881324/1242711816476430358}}{{dc:1200611284408881324/1242712454664945764}}", "@oukoku 2024年6月の投稿では、SA2の弾は34F・72F・110F・148Fに着弾し、SA2の硬直は13F、弾のガード硬直は20Fで、各弾の間に18Fの隙間があるとまとめられた。ガードストップは弱9F・中11F・大13Fで、SA2の弾には影響しないため、技をガードさせたほうが2発目の弾が早く着弾するという。{{dc:1200611284408881324/1249385142217084968}}", "@oukoku 2024年6月の投稿では、SA2を絡めた疑似ガー不連携の研究として、DR→立ち強K→ストップ→しゃがみ弱Kで、中段の2F後に下段が着弾する形は作れたが、しゃがみ弱Kから何もつながらなかった。DRしゃがみ中K→しゃがみ中Kの形は、DRしゃがみ中Kが+1Fのため連続ガードにならず失敗した。中段と下段が同時に来ると上段扱いになるので、完全なガー不は基本的に無理だという指摘もあった。{{dc:1200611284408881324/1249385142217084968}}{{dc:1200611284408881324/1249387504155758622}}{{dc:1200611284408881324/1249913917250076723}}", "@oukoku 2024年6月の投稿では、JPのSA3のフレームが変わって以前のような起き攻めがなくなり、OD設置をする人が多いという。ただし、ルークSA1、マノンSA1、キンバリーのOD影すくい、ジュリSA1、キャミィSA1・SA3、リュウSA1、ホンダSA2、ブランカのSA2発動中のSA1、ガイルの弱SA1、ダルシムの大P・大K、ラシードSA1には返されるので注意、という書き込みがあった。{{dc:1200611284408881324/1251833208572743690}}"], "clips": [{"ch": "oukoku", "g": "1182838025038872637", "c": "1458368997287395361", "m": "1459855540887748772", "a": "beco CJP1700", "d": "20260111", "x": "ジラント(大Kタゲコン)▶︎SA2が密着じゃない時の行動は  ・そのまま中足連打で崩しに行く ・無敵、リバ警戒で様子見してから投げや中段を打つ(SA2の一発目を…"}]}, {"title": "インパクトに勝つ連携", " es": ["{{aI6OgnkAk9o@146}}", "{{aI6OgnkAk9o@182}}", "{{aI6OgnkAk9o@196}}", "{{aI6OgnkAk9o@206}}"]}]}], "reviewed": true}, {"id": "taisaku", "name": "対策", "lead": "動画の対策は、ガードで不利になる技にボタンを押す、確定を取る、ジャストパリィを合わせる、のどれかに落ち着くものが多い。配信では JP がきついキャラとして、ベガ・ジュリ・ジェイミー・ED などが時期ごとに挙がっている。", "sections": [{"title": "ダルシム：テレポを落とし、しびれを切らさない", "body": ["@ryusei 2026年7月の動画では、ダルシムにSA2を溜められていた場合の対応も見られる。溜めている間は大Pが当たると弾が消えるので、設置して大Pを入れる形になる。設置の後は、大Kより大Pの方がよいと話される。{{yXbMl1Js0w4@216}}{{yXbMl1Js0w4@240}}{{yXbMl1Js0w4@255}}"], "clips": []}, {"title": "ジュリ：歳破衝にジャストパリィ、ラッシュは引き中Pで止める", "body": ["配信では、ジュリ戦はラッシュを引き中Pで止める場面を何度もやる必要があるとしている。引き中攻撃は判定が引っ込むので、長い判定で突っ込んでくるジュリのラッシュ中Kを止めやすい。動画（2026年7月14日投稿）はマノンの SA2 の話で、跳ねる部分の隙間にラッシュやインパクトで割り込めるとし、ジュリの SA1 にも同じ対応が使えるとしている。最後までガードしきると削られるだけなので、大きな端コンボを入れる。{{-rrXNES3ACw@5995}} {{H-WQjXXkNyk@2535}} {{9A6i80KhYjw@12}} {{9A6i80KhYjw@23}}"], "clips": []}, {"title": "ブランカ：遠くで光ったらインパクト", "body": ["配信では、近い距離でSA2ゲージのある相手のODロリにインパクトすると、SA2にキャンセルされるので注意する。JP でブランカと戦うときは、ブランカがODロリで接近したがることが多い。エアロリは裏が微妙な距離で当たると確定がなく、ODロリは最低空で当たるとブランカ有利になるので、有利かどうかを見ておく。有利でも必ずボタンを押してよいとは限らず、あえて押さない選択肢もある。{{_LIvr7jcqx0@4278}} {{H1eezSRzVzw@8779}}"], "clips": []}, {"title": "キンバリー：疾駆けは一部を除いてボタンで割る", "body": ["配信では、飛びからの肘は、大Kで落とせるのが本当は一番よく、落とせるとコンボに行けて大きい。届く距離なら前大Kや対空も無難だ。SA2にはトリグラフでなく起爆を使う。トリグラフはSA2の弾無敵が切れた直後に当たる形になり、普通に無敵で負ける。{{fTLTYUgGTuo@5607}} {{MPaucCetMzA@1990}} {{ZtF7sNSdFQ4@2401}}", "@jpdc 2024年12月の投稿では、キンバリー対策として、大Pをガードしたあとに弧空を入れ込んでいるのを読んでODアムネジアを入れ込んだときのコンボが、実戦では使えないと思うがとして紹介された。Dゲージはコンボ終わりで3本ちょっと減り、全SAに派生できる。トリグラフは1〜2F遅らせ、SA2の追撃はリプライに貼られた方にするとダメージが変わらず距離を取れるという。{{dc:1286267508164399157/1313495886655131728}}"], "clips": []}, {"title": "豪鬼：空中の攻撃を対空で落としてフルコンボ", "body": ["@jpdc 2026年3月の投稿では、豪鬼戦の意識として、波動は地も空もパリィしてジャストパリィ率を高め、ラッシュしてくるのを咎める、中足を起点にしてくるなら立ち中Kで差し返す、端で歩きシミーするなら前入れのタイミングで屈中Pや立ち中Kを刺す、遠目から弱波動を撃つ人にはリーサルの時に見てからSA2で確定させられることがある、という答えがあった。{{dc:1285810788199694408/1486335896252055593}}"], "clips": []}, {"title": "ザンギエフ", "body": ["@jpdc 2025年12月の投稿では、ザンギエフの起き上がりに何かをしてからバクステを入れておくとSA2とSA3の両方に対応できる方法が問われた。生ラッシュからだったという答えがあり、画面端の前投げからラッシュでも、弱ストリボーグのヒット後でもできたという。{{dc:1285864637199286312/1446837552878456842}}{{dc:1285864637199286312/1446838332423143498}}{{dc:1285864637199286312/1446838421665484800}}{{dc:1285864637199286312/1446840245797519470}}"], "clips": []}, {"title": "相手は JP の設置セットプレイにこう対応してくる", "body": ["大Pから直接OD設置する連携は、小Pでフレームを消費し、トルバランまで連続ガードになる。ヴィーハトのエフェクトと重なって下段が見にくく、下段が来ることが多い。見た時点で、リバーサルの昇龍を出すか、引きの動作にジャストパリィを狙う。バーンアウト中も同じ連携がトリグラフから始まり、見てからSA3やSA2を撃つのが一番よい。{{KMrV_6C9Huw@233}} {{KMrV_6C9Huw@256}} {{KMrV_6C9Huw@292}}"], "clips": []}, {"title": "相手は JP のSA2（ラヴーシュカ）にこう対応してくる", "body": ["@oukoku 2026年3月の投稿では、JPのSA2の連携でコパのタイミングにドライブリバーサルをしたら、パリィで防がれたという相談があった。SA2発動の硬直中にコパをパリィで上書きしているためで、暗転直後や直前のリバーサルは見てからや仕込みパリィで防がれる。1ガード目を見てからリバーサルをすれば、ほぼ確実に凌げるという。{{dc:1479722730797662370/1479722730797662370}}{{dc:1479722730797662370/1479747579070648421}}{{dc:1479722730797662370/1479748152553902172}}{{dc:1479722730797662370/1480089572087038005}}", "@oukoku 2026年1月の投稿では、ラヴーシュカをガードしつつパリィを押しっぱなしにしても、いつのまにか中足などの打撃を食らうという質問に、連ガでもしゃがみを入れていないと下段が、立ちを入れていないと中段がガードできないという答えがあった。しゃがんだり立ったりしながらパリィを押し続けると、連ガならガードでき、連ガが解けたらパリィが出るので、タイミングをずらされても対応できるという。{{dc:1460954842083098689/1460954842083098689}}{{dc:1460954842083098689/1460956795207159819}}{{dc:1460954842083098689/1460957208568266919}}"], "clips": []}], "reviewed": true}, {"id": "kangaekata", "name": "考え方", "lead": "神木Cが繰り返し挙げるのは、新しいことの練習はランクマの外でやること、伸びしろは帯ごとにほぼ決まっていること、の2点だ。カウンターやアムネジアなどシステムの理解と、2025年10月から2026年10月までの調整への見立てを、時期順に並べる。", "sections": [{"title": "新しいことはランクマの外で練習する", "body": ["@jpdc 2026年6月の投稿では、密着の強タゲコンをガードさせた上からSA2を発動した後に、即Dリバされたときの対応をトレモで練習する設定の質問に、ダミー設定をすべてガード、ドライブリバーサルをガード発動、発動ディレイを30fにするとできた、という答えがあった。ガードリバーサルのカウント2では発動前の強タゲコン後にリバが出てしまうため、ざっくり33f程度のディレイを入れているという。{{dc:1285810788199694408/1517371692131942410}}{{dc:1285810788199694408/1517376781110349854}}{{dc:1285810788199694408/1517377624933011537}}{{dc:1285810788199694408/1517380089636065471}}{{dc:1285810788199694408/1517511667301486782}}"], "clips": []}, {"title": "帯ごとの伸びしろはほぼ決まっている", "body": ["@jpdc 2026年1月の投稿では、プラチナから上がれないという相談に、ダイヤ2のJP使いが、SAゲージをきちんと使うこと（弱P×2から弱ストリボーグ>SA3、しゃがみ中Pからのラッシュコンボの締めのSA3）と、ラヴーシュカコンボを1つ覚えることを挙げた。別の人は、対空は下強PからのOD設置や弾、前大Kからのフルコンができると勝てるようになったという。{{dc:1285800688097562715/1466320030521102403}}{{dc:1285800688097562715/1466327706349211834}}{{dc:1285800688097562715/1466329594901696512}}{{dc:1285800688097562715/1466353914717933630}}", "@jpdc 2026年4月の投稿では、マスター上がりたてで1200〜1300台まで落ちた後に1500へどう戻したかという質問に、6アクトかけて地道に戻した、対空とラッシュ止めで戻した、SA2を回し続けた、対空とラッシュ止めとシューティングでグラマスまで行った、シューティングをせず設置後に前歩きやラッシュ大Kで触りに行った、と答えが割れた。{{dc:1285800688097562715/1492080847061520494}}{{dc:1285800688097562715/1492084398604943380}}{{dc:1285800688097562715/1492085999747072030}}{{dc:1285800688097562715/1492088763168587827}}{{dc:1285800688097562715/1492089017838338049}}{{dc:1285800688097562715/1492128592484765887}}", "@jpdc 2026年6月の投稿では、マスターまで行って1400帯にいる人が何から練習するかという質問に、画面端へ必ず追い詰める意志を持ち、SA2の運びコンや入れ替えコン、画面端でインパクトを返した後の入れ替えコンを完璧にしていた、柔道ができなくなっても画面端はまだ強力、という答えがあった。大P通常設置かOD設置をはじめとする画面端のセットプレイや、リーサルのためのSA1のコンボも覚え始めた時期だという。{{dc:1285810788199694408/1512120347451724047}}{{dc:1285810788199694408/1512140487254085823}}", "@jpdc 2026年7月の投稿では、ダイヤ3〜4でマスターまでに身につけた技能は何かという質問に、中足をとにかく差し込む、コンボを高くなくてもよいから完走する、ラヴーシュカの簡単なコンボを1つ覚える、豪鬼が多いので遠めの百鬼にJ中P対空などの簡単な対策を覚える、という答えがあった。起き攻めは、その帯はフレーム差を無視した無茶なリバサ行動が多いので、しっかり埋める練習が要るという。{{dc:1285810788199694408/1530838239173283916}}{{dc:1285810788199694408/1530838927500640387}}{{dc:1285810788199694408/1530841956312416366}}"], "clips": []}, {"title": "JPの難しさ、サブキャラ、モダンJPの評価", "body": ["@jpdc 2025年7月の投稿では、プラチナで始めたばかりのモダンJPが何から覚えるかという質問に、強ボタン2回→オートSP→強トリグラフのコンボと、弱ボタン2回→SPのコンボの2つができれば足りるという答えがあった。SA2のラヴーシュカはとても強いのでたくさん使い、基本コンボは弱・強のアシストコンボを加えるとよい。弱2回→SPからSA3がつながることは、小さな隙からもリーサルになるので覚えるとお得だという。{{dc:1285810788199694408/1389541207763320852}}{{dc:1285810788199694408/1389542369325617212}}{{dc:1285810788199694408/1389934660615803000}}", "@jpdc 2025年7月の投稿では、Year1のJPはコパンからラヴーシュカを発動でき、インパクトも2発入った時代だったという。画面端を背負ってコパを当てればSA2が発動し、入れ替えてDゲージ3本を削ってゲームセットしていたという。補正なしのODトリグラフからSA3が入り、立ち大Kのあとにコパを2回刻めたという話も出た。{{dc:1285800688097562715/1389585001150021642}}{{dc:1285800688097562715/1389589181415690390}}{{dc:1285800688097562715/1389630116388147262}}{{dc:1285800688097562715/1389630296676372490}}{{dc:1285800688097562715/1389630531037171912}}", "@jpdc 2025年7月の投稿では、直近の調整でナーフこそあれ強化はないのにJPの評価が高い理由として、ケン・舞・エド・豪鬼などは立ち回りや端を弱体化され、ベガは強かった部分の代わりにおもちゃを得た一方、JPは立ち回り・ゲージ削り・SA2・画面端の設置起き攻めの期待値が高いままだから、という見方があった。{{dc:1285800688097562715/1391622787973517444}}{{dc:1285800688097562715/1391929145683869799}}", "@oukoku 2025年6月の投稿では、調整の内容を見て、生ラッシュ中足の火力が下がり（80%）、画面端の連携で中下の崩しに20%の補正がかかるのはかなり痛いという声があった。ガードさせてSA2を打ち、中足で崩した時にも補正がかかるのかという質問には「合ってると思います」と返事があった。中足の補正と大足の受け身可で、ラヴーシュカの連携も全体的に弱体化していそうだという声もあった。{{dc:1200611284408881324/1379673639619792917}}{{dc:1200611284408881324/1379673737657450514}}{{dc:1200611284408881324/1379701155952726046}}{{dc:1200611284408881324/1379703704927731843}}{{dc:1200611284408881324/1379704720037515274}}{{dc:1200611284408881324/1379707076464611378}}"], "clips": []}, {"title": "2026年3〜5月の調整：3月の調整の評価の揺れと、イングリッド追加前後", "body": ["@jpdc 2026年3月の投稿では、17日の調整について、画面端の設置投げからのコンボがナーフされ、投げ後の前大Kが入らなくなってダメージが下がりそう、大K大PタゲコンのDゲージ削りが2500減った、という指摘があった。一方で、トルバランの拾い性能など新しいおもちゃが増えSA2も死んでいないので結論は強化という声や、プラマイでややマイナス、2中Pの弱体化が痛いという見方もあった。{{dc:1285800688097562715/1483284749614317588}}{{dc:1285800688097562715/1483313838844678236}}{{dc:1285800688097562715/1483314481957437550}}{{dc:1285800688097562715/1483299394739634236}}{{dc:1285800688097562715/1483320739036926063}}{{dc:1285800688097562715/1483320797773693080}}", "@oukoku 2026年3月の投稿では、3月17日の調整を見て、投げ関連は弱くなった代わりに「おもちゃ」がだいぶ強いのでまだやれる、という声があった。SA2のフレームが変わってコンボが全部変わった時に比べれば、もはや強化とまで言えるという。画面端で投げたあとのトリグラフの持続ができなくなるという指摘もあった。{{dc:1200611284408881324/1483303130262274109}}{{dc:1200611284408881324/1483346044334112940}}{{dc:1200611284408881324/1483346135685795911}}"], "clips": []}], "reviewed": true}], "src": {"yX85TjYfcqc": {"title": "【スト6】キンバリー戦の匠 #ストリートファイター6 #スト6", "date": "20261008", "kind": "v" <script>
const D = JSON.parse(document.getElementById("data").textContent);
const M = D.meta;
const THEMES = M.themes;
const SIDE = Object.fromEntries(M.sides.map(([k, n], i) => [k, [n, i ? "k-vs" : "k-jp"]]));
const CH = Object.fromEntries(D.channels.map((c, i) => [c.id, [c.name, "k-c" + (i % 5)]]));
const DEF = M.defaultCh;
const multi = D.channels.length > 1;
let side = "", who = "", q = "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hms = t => { t = +t; const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
const ymd = d => d ? `${d.slice(0,4)}年${+d.slice(4,6)}月${+d.slice(6,8)}日` : "";
const yt = (id, t) => `https://www.youtube.com/watch?v=${id}&t=${t}s`;
const sideTag = s => SIDE[s] ? `<span class="tag ${SIDE[s][1]}">${SIDE[s][0]}</span>` : "";
const chOf = c => c || DEF;
const chTag = c => multi && CH[chOf(c)] ? `<span class="tag ${CH[chOf(c)][1]}">${esc(CH[chOf(c)][0])}</span>` : "";
// 教科書の段落：頭の「@チャンネルID 」が話し手。無ければ既定のチャンネル
const said = p => { const m = /^@([\w-]+) /.exec(p); return m ? [m[1], p.slice(m[0].length)] : [DEF, p]; };

// 見出し・検索欄・ボタン・フッター
document.title = M.title;
document.getElementById("title").textContent = M.title;
document.getElementById("subtitle").textContent = M.subtitle || "";
document.getElementById("q").placeholder = M.searchHint || "言葉で探す";
document.getElementById("sides").innerHTML = `<button data-side="" aria-pressed="true">すべて</button>` +
  M.sides.map(([k, n]) => `<button data-side="${esc(k)}" aria-pressed="false">${esc(n)}</button>`).join("");
document.getElementById("whos").innerHTML = multi ? `<button data-who="" aria-pressed="true">全員</button>` +
  D.channels.map(c => `<button data-who="${esc(c.id)}" aria-pressed="false">${esc(c.name)}</button>`).join("") : "";
if (!multi) document.getElementById("whos").remove();
if (!D.lives.length) document.querySelector('nav a[data-tab="lives"]').remove();
if (!D.book.length) document.querySelector('nav a[data-tab="book"]').remove();

// ---- 入口の図：キャラ対（タイル）・状況（流れ図）・技（ボタン）----
// キャラ対策の章：config の matchupCh、無ければ id が taisaku か、章名に「対策」を含む章
const VSI = (() => { const k = D.book.findIndex(c => c.id === (M.matchupCh || "taisaku")); return k >= 0 ? k : D.book.findIndex(c => /対策/.test(c.name)); })();
const VSC = D.book[VSI];
// 節名「ルーク」「ダルシム：テレポを落とし…」はキャラ。「：」が無くて長い節（「相手は JP の…」）は全般
const vsName = s => { const k = s.title.indexOf("："); return k >= 0 ? [s.title.slice(0, k), s.title.slice(k + 1)] : [s.title, ""]; };
const isChar = s => s.title.includes("：") || s.title.length <= 12;
// ルートを1列に（章・グループ・番号つき）。番号は絞り込みに関係なく固定
const RT = [];
D.book.forEach((c, i) => (c.routes || []).forEach(g => g.routes.forEach(r => RT.push({c, i, g, r, k: RT.length}))));
// 技のボタン：config の moves、無ければルートの手順に2回以上出る語
const MV = (M.moves && M.moves.length) ? M.moves : (() => {
  const n = {}; RT.forEach(x => [x.r.route, ...(x.r.options || [])].flat().forEach(s => n[s] = (n[s] || 0) + 1));
  return Object.entries(n).filter(([, v]) => v >= 2).sort((a, b) => b[1] - a[1]).slice(0, 24).map(([s]) => ({g: "ルートに出る技", n: s, q: [s]}));
})();
if (!VSC) document.querySelector('nav a[data-tab="vs"]').remove();
if (!RT.length) document.querySelector('nav a[data-tab="flow"]').remove();
if (!MV.length) document.querySelector('nav a[data-tab="moves"]').remove();
document.getElementById("foot").innerHTML = (M.footer || []).map(h => `<p>${h}</p>`).join("");

// すべてのポイントを1列に
const ALL = [];
D.videos.forEach(v => v.points.forEach(p => ALL.push({...p, src: v, kind: "v"})));
D.lives.forEach(l => l.highlights.forEach(h => ALL.push({...h, src: l, kind: "l"})));
const hit = p => (!who || chOf(p.src.ch) === who) && (!side || p.side === side) &&
  (!q || [p.head, p.body, (p.chars||[]).join(" "), p.src.title].join(" ").includes(q));

function ptHTML(p, i, showFrom) {
  const from = showFrom ? `<div class="from">${chTag(p.src.ch)} 出典：<a href="#/${p.kind === "v" ? "video" : "live"}/${encodeURIComponent(p.src.id)}">${esc(p.src.title)}</a>（${ymd(p.src.date)}）</div>` : "";
  return `<div class="pt" style="animation-delay:${Math.min(i, 12) * 30}ms">
    <a class="ts" href="${yt(p.src.id, p.t)}" target="_blank" rel="noopener" aria-label="${hms(p.t)} から YouTube で見る（新しいタブで開きます）">▶ ${hms(p.t)}</a>
    <div><h3>${esc(p.head)} ${sideTag(p.side)}</h3><p>${esc(p.body)}</p></div>${from}</div>`;
}
// 教科書：出典 {{ID@秒}} を時刻リンクに。{{dc:チャンネルID/メッセージID}} は Discord の投稿へのリンク（D.dc に投稿者・日付）
function cite(text) {
  // 続けて並んだ Discord の出典も新しい順に（段落の並びと見た目をそろえる）
  text = String(text ?? "").replace(/\{\{dc:\d+\/\d+\}\}(?:\s*\{\{dc:\d+\/\d+\}\})+/g, run => run.match(/\{\{dc:\d+\/\d+\}\}/g).sort((a, b) => dcDate(b) - dcDate(a)).join(" "));
  return esc(text).replace(/\{\{([\w-]{11})@(\d+)\}\}/g, (_, id, t) => {
    const s = D.src[id] || {title: id, kind: "v"};
    return `<a class="cite" href="${yt(id, t)}" target="_blank" rel="noopener" title="${esc(s.title)}（${ymd(s.date)}）" aria-label="${esc(s.title)} の ${hms(t)} から（新しいタブで開きます）">${s.kind === "l" ? "配信" : "動画"} ${hms(t)}</a>`;
  }).replace(/\{\{dc:(\d+)\/(\d+)\}\}/g, (_, c, m) => {
    const s = (D.dc || {})[m] || {}, d = s.d ? `${+s.d.slice(0,4)}/${+s.d.slice(4,6)}/${+s.d.slice(6,8)}` : "";
    // サーバーが2つ以上のとき：D.dc の g（サーバーID）・s（サーバー名）。無ければ config の dcGuild・dcName
    return `<a class="cite" href="https://discord.com/channels/${s.g || M.dcGuild}/${c}/${m}" target="_blank" rel="noopener" title="${esc(s.s || M.dcName || "Discord")} #${esc(s.c || "")}" aria-label="${esc(s.a || "")} さんの ${d} の投稿${s.v ? "（動画あり）" : ""}（Discord・新しいタブで開きます）">${s.v ? "▶ " : ""}${esc(s.a || "投稿")} ${d}</a>`;
  });
}
// Discord の投稿を出典にする段落は新しい順に並べる（2026-11-27 本人の指示）。動画の段落は今の順のまま前に置く
// 段落の日付＝出典にしている投稿（{{dc:…}}）のいちばん新しい日付
const isDc = p => /\{\{dc:/.test(p);
const dcDate = p => Math.max(0, ...[...p.matchAll(/\{\{dc:\d+\/(\d+)\}\}/g)].map(m => +(((D.dc || {})[m[1]] || {}).d || 0)));
const newestDc = (list, get) => [...list.filter(x => !isDc(get(x))), ...list.filter(x => isDc(get(x))).sort((a, b) => dcDate(get(b)) - dcDate(get(a)))];
const ordered = ps => newestDc(ps, x => x[1]);
// 段落：改行があれば「1行目＝見出し、「- 」で始まる行＝箇条」（build_note.py --rewrites で書き直した段落）。無ければ今までどおり1つの段落
const paraHTML = (tag, p, fmt = cite) => {
  const ls = p.split("\n").filter(l => l.trim());
  if (ls.length < 2) return `<p class="said">${tag}${fmt(p)}</p>`;
  return `<div class="said pa"><p class="lh">${tag}<b>${fmt(ls[0])}</b></p><ul class="pl">${ls.slice(1).map(l => `<li>${fmt(l.replace(/^-\s*/, ""))}</li>`).join("")}</ul></div>`;
};
// 節の末尾の「この節のクリップ」：Discord の投稿（動画つき）へのリンクと一言。新しい順
const dcd = d => `${+d.slice(0,4)}/${+d.slice(4,6)}/${+d.slice(6,8)}`;
const clipsHTML = s => {
  const cs = (s.clips || []).filter(k => (!who || k.ch === who) && (!q || (k.x + k.a).includes(q) || (s.title + s.body.join("")).includes(q))).sort((a, b) => +(b.d || 0) - +(a.d || 0));
  if (!cs.length) return "";
  return `<details class="clips"><summary>この節のクリップ（${cs.length}）</summary><ul>${cs.map(k => `<li><a href="https://discord.com/channels/${k.g || M.dcGuild}/${k.c}/${k.m}" target="_blank" rel="noopener" aria-label="${esc(k.a)} さんの ${dcd(k.d)} の動画つき投稿（Discord・新しいタブで開きます）">▶ ${esc(k.a)} ${dcd(k.d)}</a>${k.x ? `<span>${esc(k.x)}</span>` : ""}</li>`).join("")}</ul></details>`;
};
// 話し手ごとの段落の数（多い順）と、その割合の帯。帯の下に名前と数を文字でも出す（色だけで分けない）
const spk = list => { const n = {}; list.forEach(([w]) => n[w] = (n[w] || 0) + 1); return Object.entries(n).sort((a, b) => b[1] - a[1]); };
const nameOf = w => (CH[w] || [w])[0];
const barHTML = pairs => multi && pairs.length ? `<span class="sbar" aria-hidden="true">${pairs.map(([w, n]) => `<i class="${(CH[w] || [])[1] || ""}" style="flex:${n}"></i>`).join("")}</span><span class="slg">${pairs.map(([w, n]) => `${esc(nameOf(w))} ${n}`).join("・")}</span>` : "";
function entryHTML() {
  const e = [];

    a === "moves" && MV.length ? viewMoves() : a === "move" && MV.length ? viewMove(b) :
    a === "theme" ? viewTheme(b) : a === "videos" ? viewVideos() : a === "lives" ? viewLives() :
    a === "video" ? viewOne("v", b) : a === "live" ? viewOne("l", b) : a === "themes" ? viewThemes() : viewBook();
  // 狭い画面では、状況を押したら流れ図のところまで下げる
  if (a === "flow" && b !== undefined && matchMedia("(max-width:767px)").matches) document.getElementById("fpane")?.scrollIntoView();
}
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-vsort]"); if (b) { vsSort = b.dataset.vsort; render(); }
});
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim(); render(); });
document.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => {
  side = b.dataset.side; document.querySelectorAll("[data-side]").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
}));
document.querySelectorAll("[data-who]").forEach(b => b.addEventListener("click", () => {
  who = b.dataset.who; document.querySelectorAll("[data-who]").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
}));
addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
render();
</script>
</body>
