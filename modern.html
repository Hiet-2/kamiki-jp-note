<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JP 攻略ノート：モダン・クラシック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6; --paper2:#ebe4d6; --card:#fffdf8; --ink:#1d1b18; --ink2:#4a453d; --rule:#8c8374;
  --accent:#8a1c1c; --accent-bg:#f6e3df; --jp:#1f4e79; --jp-bg:#e2ecf5; --vs:#7a4a00; --vs-bg:#f7ead2;
  --focus:#ffd43d;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-size:18px;line-height:1.7;
  word-break:auto-phrase;text-wrap:pretty;
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(140,131,116,.13) 33px 34px)}
a{color:var(--jp)}
:focus-visible{outline:3px solid var(--ink);background:var(--focus)}
header{border-bottom:3px double var(--ink);background:var(--paper);position:sticky;top:0;z-index:5}
.hd{max-width:1080px;margin:0 auto;padding:16px 24px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.logo{font-family:"Zen Old Mincho",serif;font-size:32px;line-height:1.2;margin:0;letter-spacing:.04em}
.logo small{display:block;font-family:"Zen Kaku Gothic New";font-size:14px;letter-spacing:.1em;color:var(--ink2);font-weight:700}
nav{display:flex;gap:4px;margin-left:auto}
nav a{display:block;padding:10px 18px;text-decoration:none;color:var(--ink);font-weight:700;border:1px solid var(--rule);border-bottom:none;background:var(--paper2);border-radius:8px 8px 0 0;min-height:44px}
nav a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);min-width:240px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:16px;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:24px}
h2{font-family:"Zen Old Mincho",serif;font-size:28px;line-height:1.4;margin:8px 0 16px;text-wrap:balance}
.lead{color:var(--ink2);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;
  animation:rise .4s both;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink)}
.card .t{font-weight:700;line-height:1.5}
.card .s{font-size:16px;color:var(--ink2)}
.meta{font-size:16px;color:var(--ink2);display:flex;gap:4px 12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:1px 10px;border-radius:999px;border:1px solid currentColor}
.k-jp{color:var(--jp);background:var(--jp-bg)} .k-c0{color:#3d5a1e;background:#e6efd9} .k-c1{color:#5b2a86;background:#eee3f7} .k-c2{color:#0b5d5e;background:#dcefef} .k-c3{color:#8a4b00;background:#f7e6cf} .k-c4{color:#28408a;background:#e2e8f7} .k-c5{color:#6b2a4e;background:#f6e2ec}
.clips{margin:14px 0 4px;border:1px solid var(--rule);border-radius:10px;padding:8px 14px}
.clips summary{cursor:pointer;font-weight:700}
.clips ul{margin:8px 0 2px;padding-left:0;list-style:none}
.clips li{padding:6px 0;border-top:1px dashed var(--rule);line-height:1.6}
.clips li a{font-weight:700;margin-right:10px;white-space:nowrap}
.clips li span{color:inherit;opacity:.85} .said .tag{margin-right:8px;vertical-align:1px} .chips+.chips{padding-left:12px;border-left:1px solid var(--rule)} .k-vs{color:var(--vs);background:var(--vs-bg)} .k-x{color:var(--accent);background:var(--accent-bg)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.theme{background:var(--card);border:1px solid var(--rule);border-left:8px solid var(--ink);border-radius:8px;padding:14px 18px;text-decoration:none;color:var(--ink);animation:rise .4s both}
.theme b{font-size:20px;display:block}
.theme span{font-size:16px;color:var(--ink2)}
.pt{display:grid;grid-template-columns:96px 1fr;gap:4px 16px;padding:16px 0;border-top:1px solid var(--rule);animation:rise .35s both}
.pt:first-of-type{border-top:2px solid var(--ink)}
.ts{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;align-self:start;padding-top:2px}
.pt h3{margin:0;font-size:20px;line-height:1.5}
.pt p{margin:4px 0 0}
.pt .from{grid-column:2;font-size:16px;color:var(--ink2)}
.pt .from a{color:var(--ink2)}
.sum{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 24px;margin:0 0 24px}
.sum ul{margin:8px 0 0;padding-left:1.2em}
.warn{font-size:16px;color:var(--vs);background:var(--vs-bg);border:1px solid var(--vs);border-radius:8px;padding:8px 14px;margin:0 0 16px}
.back{display:inline-block;margin-bottom:8px;font-weight:700}
.empty{color:var(--ink2);padding:24px 0}
.toc{margin:12px 0 0;padding-left:0;list-style:none;columns:2 280px;column-gap:32px}
.toc li{break-inside:avoid;margin:2px 0}
.sec{padding:16px 0;border-top:1px solid var(--rule);scroll-margin-top:150px}
.sec:first-of-type{border-top:2px solid var(--ink)}
.sec h3{font-size:22px;line-height:1.5;margin:0 0 8px;scroll-margin-top:140px}
.sec p{margin:0 0 12px;max-width:44em}
.cite{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin:0 2px;text-decoration:none;line-height:1.6;white-space:nowrap}
.cite:hover{text-decoration:underline}
.rg{font-size:18px;margin:20px 0 8px;padding-left:10px;border-left:6px solid var(--jp)}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.route{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.route b{font-size:18px;line-height:1.4}
.when{font-size:16px;color:var(--ink2)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;line-height:1.4}
.step{display:inline-block;background:var(--jp-bg);color:var(--jp);border:1px solid var(--jp);border-radius:6px;padding:2px 8px;font-weight:700;font-size:16px}
.arr{color:var(--ink2);font-weight:700;padding:0 2px}
.opts{display:flex;gap:8px;align-items:flex-start}
.optl{flex:none;font-size:14px;font-weight:700;color:var(--vs);background:var(--vs-bg);border:1px solid var(--vs);border-radius:999px;padding:1px 10px;margin-top:3px}
.opts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rnote{margin:0;font-size:16px;color:var(--ink2)}
@media (max-width:767px){.routes{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:767px){.hd{padding:12px 16px 0}.logo{font-size:26px}nav{margin-left:0}nav a{padding:8px 12px}main,.bar{padding-left:16px;padding-right:16px}.pt{grid-template-columns:1fr}.pt .from{grid-column:1}}
.foot{border-top:3px double var(--ink);background:var(--paper)}.foot div{max-width:1080px;margin:0 auto;padding:16px 24px 32px;font-size:16px;color:var(--ink2)}.foot p{margin:0 0 8px}
/* ---- 入口の図（教科書の入口・キャラ対・状況・技） ---- */
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 32px}
.entry{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:end;background:var(--ink);color:var(--paper);text-decoration:none;border:1px solid var(--ink);border-radius:12px;padding:14px 20px 18px;animation:rise .4s both;transition:transform .15s,box-shadow .15s}
.entry:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--accent)}
.entry .eh{grid-column:1/-1;font-weight:900;font-size:20px;letter-spacing:.12em}
.entry b{font-family:"Zen Old Mincho",serif;font-size:56px;line-height:1;color:#ffd9cf}
.entry span:last-child{font-size:16px;line-height:1.5;color:#ece6da;padding-bottom:4px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.chap{background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--ink);border-radius:10px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;animation:rise .4s both}
.chh{text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.chh .cn{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
.chh b{font-family:"Zen Old Mincho",serif;font-size:26px;line-height:1.35}
.chh:hover b{text-decoration:underline;text-underline-offset:4px}
.chh .cm{font-size:16px;color:var(--ink2)}
.sbar{display:flex;height:10px;border:1px solid var(--ink);border-radius:5px;overflow:hidden}
.sbar i{background:currentColor;min-width:3px}
.slg{font-size:14px;line-height:1.5;color:var(--ink2);margin-top:-4px}
.chs{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chs a{display:inline-block;padding:3px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:16px;line-height:1.5}
.chs a:hover{border-color:var(--ink);background:var(--paper2);text-decoration:underline}
.chr{font-weight:700;font-size:16px;margin-top:2px}
.vsort{margin:0 0 16px}
.vtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.vt{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 12px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:120px;animation:rise .35s both;transition:transform .12s,box-shadow .12s,border-color .12s}
.vt::before{content:"";position:absolute;inset:-1px auto -1px -1px;width:7px;background:var(--accent);border-radius:10px 0 0 10px}
.vt:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink);border-color:var(--ink)}
.vn{font-family:"Zen Old Mincho",serif;font-size:22px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.vsub{font-size:16px;line-height:1.45;color:var(--ink2)}
.vm{display:block;height:8px;background:var(--paper2);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-top:auto}
.vm i{display:block;height:100%;background:var(--ink)}
.vc{font-size:16px;font-weight:700}
.vw{font-size:14px;line-height:1.45;color:var(--ink2)}
.vstrip{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px;padding:10px 0;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule)}
.vstrip a{font-size:16px;line-height:1.5;padding:3px 11px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--card)}
.vstrip a:hover{border-color:var(--ink);text-decoration:underline}
.vstrip a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vh{font-size:44px;line-height:1.25;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vh small{font-family:"JetBrains Mono",monospace;font-size:18px;color:#fff;background:var(--accent);padding:2px 12px;border-radius:6px;letter-spacing:.12em}
.pn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 0;font-weight:700}
.fv{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:24px;align-items:start}
.smap{display:flex;flex-direction:column;gap:18px}
.sg h3{font-size:18px;line-height:1.4;margin:0 0 6px}
.sg h3 small{display:block;font-size:14px;font-weight:400;color:var(--ink2)}
.sb{display:flex;flex-direction:column;gap:4px}
.sb a{display:block;padding:8px 12px;border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;line-height:1.45}
.sb a:hover{border-left-color:var(--ink);text-decoration:underline}
.sb a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink);border-left-color:var(--accent)}
.fpane{position:sticky;top:var(--hd,170px)}
.flow{background:var(--card);border:1px solid var(--ink);border-radius:12px;overflow:hidden;animation:rise .3s both}
.fs{background:var(--ink);color:var(--paper);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.fs b{font-family:"Zen Old Mincho",serif;font-size:24px;line-height:1.35}
.fsl{font-size:14px;font-weight:700;letter-spacing:.14em}
.fs .fsl{color:#ffd9cf}
.fw{font-size:16px;line-height:1.5;color:#ece6da}
.fb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.fl,.fk{display:flex;flex-direction:column;gap:6px}
.fb .fsl{color:var(--accent)}
.fc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.fn{background:var(--jp-bg);color:var(--jp);border:1px solid var(--jp);border-radius:6px;padding:4px 10px;font-weight:700;font-size:16px;line-height:1.4}
.fa{color:var(--ink2);font-weight:900;padding:0 2px}
.fk ul{list-style:none;margin:0 0 0 10px;padding:0 0 0 20px;border-left:3px solid var(--vs);display:flex;flex-direction:column;gap:8px}
.fk li{position:relative}
.fk li::before{content:"";position:absolute;left:-20px;top:16px;width:16px;border-top:3px solid var(--vs)}
.fk .fn{background:var(--vs-bg);color:var(--vs);border-color:var(--vs)}
.fct{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:24px}
.mvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mv{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:1px solid var(--ink);border-bottom-width:4px;border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;transition:transform .1s,border-bottom-width .1s;animation:rise .35s both}
.mv:hover b{text-decoration:underline}
.mv:active{transform:translateY(2px);border-bottom-width:2px}
.mv b{font-size:18px;line-height:1.35}
mark{background:#ffe08a;color:var(--ink);padding:0 2px;border-radius:3px}
.mh{font-size:18px;line-height:1.5;margin:0 0 8px}
@media (max-width:767px){header{position:static}nav{flex-wrap:wrap}.fv{grid-template-columns:1fr}.fpane{position:static}.vh{font-size:34px}.entry b{font-size:44px}.chaps{grid-template-columns:1fr}.flows{grid-template-columns:1fr}}
/* 書き直した段落（見出し＋箇条書き） */
.sec .pa{margin:0 0 20px;max-width:44em}
.sec .pa .lh{margin:0;font-size:18px;line-height:1.6}
.pa .lh b{font-weight:700}
.pl{margin:4px 0 0;padding-left:1.4em}
.pl li{margin:3px 0;line-height:1.7}
.pl li::marker{color:var(--accent)}
/* 節の結論：✓ 使える（節の頭）／✕ 使えない（節の終わり） */
.vd{background:var(--card);border:1px solid var(--rule);border-left:6px solid;border-radius:10px;padding:12px 18px;margin:8px 0 24px;max-width:52em}
.vd.vu{border-left-color:#1e5d2b}.vd.vx{border-left-color:var(--accent);margin-top:20px}
.vd h3{font-size:18px;line-height:1.4;margin:0 0 6px}
.vu h3{color:#1e5d2b}.vx h3{color:var(--accent)}
.vd ul{margin:0;padding-left:1.2em}
.vd li{margin:6px 0;line-height:1.6}
.vu li::marker{color:#1e5d2b}.vx li::marker{color:var(--accent)}
.vdt{font-weight:700}
.vdn{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--ink2)}
.vv{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:14px;font-weight:700}
.vv .ok{color:#1e5d2b}.vv .ng{color:var(--accent)}

</style>
<style id="topic-links-css">.topics{padding-top:0}.topics .tl{font-size:14px;font-weight:700;color:var(--ink2)}.topics a{font-size:15px;padding:4px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}.topics a[aria-current=page]{background:var(--ink);color:var(--paper);border-color:var(--ink)}</style>
</head>
<body>
<header>
  <div class="hd">
    <h1 class="logo"><small id="subtitle"></small><span id="title"></span></h1>
    <nav aria-label="切り替え">
      <a href="#/book" data-tab="book">教科書</a>
      <a href="#/vs" data-tab="vs">キャラ対</a>
      <a href="#/flow" data-tab="flow">状況</a>
      <a href="#/moves" data-tab="moves">技</a>
      <a href="#/themes" data-tab="themes">テーマ別</a>
      <a href="#/videos" data-tab="videos">動画</a>
      <a href="#/lives" data-tab="lives">配信</a>
    </nav>
  </div>
  <div class="bar">
    <input id="q" type="search" aria-label="言葉で探す">
    <div class="chips" role="group" aria-label="誰向けの話か" id="sides"></div>
    <div class="chips" role="group" aria-label="誰の話か" id="whos"></div>
  </div>
  <div class="bar topics" id="topic-links"><span class="tl">話題ごとのページ</span><div class="chips"><a href="index.html">全体</a><a href="sa2.html">SA2</a><a href="amnesia.html">アムネジア</a><a href="modern.html" aria-current="page">モダン・クラシック</a></div></div>
</header>

<script type="application/json" id="data">{"videos": [{"id": "pH0OO3NED0M", "title": "【スト6】MR2400JPが教えるyear4JPコンボ動画！レジェンドまでこれ一本！！！", "date": "20261126", "duration": 1210, "views": 154, "short": false, "ch": "rerin", "kind": "JP講座", "level": "中級", "summary": "MR2400に届いたレリンが、モダンJP準拠で、始動技・状況ごとのコンボを紹介する動画。レシピと補足は画面の字幕で示していて、このノートでは字幕から読んだ手順を場面ごとに書いた。モダンとクラシックでコンボはほぼ変わらないので、クラシックでも使えるという。", "takeaways": ["Year4でモダンJPが大きく強化され、モダンでもクラシックとほぼ同じコンボが使える", "弱アシストのコンボは自動確認だが、しゃがみ弱Pから↓アシスト弱で連打キャンセルするときは自動確認ではない", "立ち中Kからのキャンセルラッシュは、しゃがみ弱Pなら連続ガード、しゃがみ中Pでは連続ガードにならない", "近い場所の自動起爆は生ラッシュの攻撃が空振りするので、直接前大Kで拾う", "無敵技をガードした後のコンボは距離ごとに4つ（汎用・中央ノーSA最大・端付近・端密着）"], "characters": ["JP"], "themes": ["combo", "system"], "version_sensitive": true, "version_note": "2026年11月の動画（Year4 が始まった直後に撮ったもの）。具体的なコンボ・ダメージは、のちの調整で変わる可能性がある", "points": [{"t": 2, "head": "モダンJP準拠のコンボ動画", "body": "MR2400を達成した記念のコンボ動画。Year4でモダンJPが大きく強化されたので、今はモダンJPを使っていて、内容もモダン準拠だと話す。モダンとクラシックでコンボはほぼ変わらないので、クラシックJPの人にも参考になる。", "themes": ["system", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 70, "head": "小技・中技始動（モダン準拠）：弱アシストの基本", "body": "密着で有利なときなど。レシピ：しゃがみ弱P → ↓アシスト弱。弱アシストのコンボは自動確認で、ボタンを連打していればコンボになる。しゃがみ弱Pから↓アシスト弱で連打キャンセル（連キャン）するときは自動確認ではないので注意。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 109, "head": "小技・中技始動（モダン準拠）：小技始動のリーサル", "body": "小技がヒットしてリーサルが見えるとき。レシピ：アシスト弱 → キャンセルラッシュ → 弱P → 立ち中K → キャンセルラッシュ → 立ち大K → 前大K → 中トルバラン → SA3。最後の中トルバランをSA1にすることもできる。SA2を使うときは前大Kの部分をしゃがみ大Pに変え、しゃがみ大P→SA2とつないだら立ち大Kにつなぐ。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 188, "head": "小技・中技始動（モダン準拠）：中技始動（アシスト中）", "body": "中技がヒット。レシピ：アシスト中 → キャンセルラッシュ → しゃがみ大P → 大ストリボーグ → 中トルバラン → 強トリグラフ。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 200, "head": "小技・中技始動（モダン準拠）：中技始動（立ち中K）", "body": "立ち中Kがヒット。レシピ：立ち中K → キャンセルラッシュ → しゃがみ大P → 大ストリボーグ → 中トルバラン → 強トリグラフ。リーサルが見えるなら、小技のときのように地上で伸ばすのがおすすめ。立ち中Kからのキャンセルラッシュは、しゃがみ弱Pなら連続ガードが組めるが、しゃがみ中Pからは連続ガードにならない。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 298, "head": "生ラッシュ：生ラッシュ立ち弱Pのパニッシュカウンター", "body": "相手が技を空振っていた。レシピ：生ラッシュ → 立ち弱P（パニッシュカウンター） → 大K → しゃがみ中P → ODストリボーグ → 強トリグラフ。状況確認でパニカンのコンボを選ぶ。モダンでは、しゃがみ中P→ODストリボーグはアシスト中ボタンをちょい押しして出す。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 312, "head": "生ラッシュ：大ストリボーグからのリーサル", "body": "ラッシュしゃがみ中Pがヒット。空中から拾ったときのリーサルにも使える（最大ではない）。レシピ：ラッシュ → しゃがみ中P → 立ち中K → キャンセルラッシュ → しゃがみ大P → 大ストリボーグ → 生ラッシュ → 前大K → キャンセルラッシュ → 立ち大P（高め拾い） → 立ち大P → トリグラフ → SA3。ラッシュしゃがみ中P→立ち中Kが大事で、そこだけ覚えておけば大丈夫。立ち大Pの高め拾いは難しいが、ほかでも使うテクニック。モダンでは大ストリボーグを使わない地上伸ばしのほうが高くなる場合がある。SA3の最大は大ストリボーグのルートだが、火力があまり変わらないので、SA2ルートの火力が大きい地上伸ばしをまず選びたい。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 406, "head": "生ラッシュ：生ラッシュ中段", "body": "生ラッシュの中段がヒット。レシピ：生ラッシュ → 中段 → しゃがみ中P → アシスト中（ODストリボーグまで） → 強トリグラフ。アシスト中を連打しない（連打するとSA2が出る）。モダンはアシスト中のコンボを使う（画面端の大K始動のコンボでも使う）。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}, {"t": 733, "head": "設置から拾う：画面端で拾う", "body": "画面端で設置から拾う。レシピ：生ラッシュ → 前大K → 中ストリボーグ → 前大K → 中ストリボーグ → 立ち大P → …（この先は画面の字幕に「etc」とだけある）。モダンでは1回目の中ストリボーグを弱弾（弱トルバラン）にしたほうが火力が高いが、設置から拾う場合は弱弾が空振りしがちなので非推奨。", "themes": ["combo"], "chars": ["JP"], "side": "jp"}]}, {"id": "OAXgT9gZZ20", "title": "魔改造されたモダンJPに可能性を感じるりゅうせい【スト6】", "date": "20260813", "duration": 670, "views": 36244, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "モダン操作の JP を実機で触りながら、可能性を語る動画。ワンボタンの必殺技とアシストコンボに注目し、対空、弾抜け、ラッシュ止めがやりやすくなると見る。慣れるまでの時間が課題だとも言う。", "takeaways": ["モダンでは、めくり飛びへの対空が押すだけで出せる", "モダンでは、ワンボタンのトリグラフで弾抜けが間に合う", "モダンでは、アシストボタンで立ちのまましゃがみ技が出せ、ラッシュ止めがしやすい", "慣れるまでの時間が課題"], "characters": ["JP"], "themes": ["system", "antiair", "defense", "combo"], "version_sensitive": true, "version_note": "2026年8月の動画で、調整直後のモダン JP の印象。フレームやダメージの数値は字幕が荒れていて、のちの調整や検証で変わっている可能性がある", "points": [{"t": 54, "head": "モダンでは立ち中Pが無い", "body": "モダンでは、立ち中Pが無いようだ（りゅうせいは確かめながら話している）。無くなった分の恩恵は受けている、と見る。", "themes": ["system"], "chars": ["JP"], "side": "jp"}, {"t": 97, "head": "モダンでは同キャラ戦のトリグラフが簡単", "body": "モダンでは、JP 同キャラ戦で、トリグラフからジャストパリィ、トリグラフにつなぐ形が簡単になりそうだと言う。", "themes": ["system", "matchup"], "chars": ["JP"], "side": "jp"}, {"t": 138, "head": "モダンではめくり飛びへの対空が簡単", "body": "モダンでは、めくり飛びに対する SA の対空が、押すだけで出せるほど簡単。めくりにも出ることに驚く。", "themes": ["antiair", "system"], "chars": ["JP"], "side": "jp"}, {"t": 209, "head": "モダンではワンボタンのトリグラフで弾抜けが間に合う", "body": "モダンでは、ワンボタンのトリグラフで、弾を見てから弾抜けが間に合った。フェイントにも釣られなかった。クラシックでもできるが、モダンのほうが精度が上がると言う。", "themes": ["neutral", "defense", "system"], "chars": ["JP"], "side": "jp"}, {"t": 282, "head": "モダンのトリグラフは補正が入る", "body": "モダンでも補正は入る。字幕では、モダンのトリグラフ（ワンボタン）が768点で、補正は72%という数字が出る。字幕が荒れていて、数値の中身は確かでない。ワンボタンのほうが、下を入れて出すより強いと言う。", "themes": ["combo", "system"], "chars": ["JP"], "side": "jp"}, {"t": 330, "head": "モダンでも手動で出せる", "body": "モダンでは、手動入力（コマンド）でも必殺技を出せる。火力を出したいときは手動にしてもよい。", "themes": ["system", "combo"], "chars": ["JP"], "side": "jp"}, {"t": 426, "head": "モダンではトリグラフを出した後に位置を変えられる", "body": "モダンでは、トリグラフを出した後に位置を決められる。普通のコマンドでは出す位置が固定になる。受付の猶予は長くないので、悪用はしにくそうだと言う。", "themes": ["system", "neutral"], "chars": ["JP"], "side": "jp"}, {"t": 456, "head": "モダンでは立ちのまましゃがみ中が出せる", "body": "モダンのアシストボタンでは、立ちのままでしゃがみ中攻撃が出せる。ラッシュ止めでしゃがみ中を出すとき、立ちからだと一度しゃがみを経由するので、字幕では「実質8フレームか9フレーム」で遅くなる。アシストなら歩きながら出せ、しゃがんでいるのを相手に悟られない。", "themes": ["defense", "system"], "chars": ["JP"], "side": "jp"}, {"t": 482, "head": "モダンではしゃがみ状態から大Pも出せる", "body": "モダンでは、しゃがんだ状態で大Pも出せる。一方、中Kは立ちながら中攻撃ボタンで出す形のようだ。操作がこんがらがりそうだとも言う。", "themes": ["system"], "chars": ["JP"], "side": "jp"}, {"t": 533, "head": "モダン JP の評価と課題", "body": "考えるほど、モダン JP は強いのではないかと思うと言う。ただ慣れるまでの時間が長く、クラシックのりゅうせいには操作が難しい。立ちから出せる点は、歩き回りながらラッシュを止められる強みだと見る。", "themes": ["system"], "chars": ["JP"], "side": "jp"}, {"t": 561, "head": "モダンのアシストコンボはラッシュ止めに強い", "body": "モダンでは、JP のアシストコンボが強い。ラッシュ止めの精度が上がるはずだと言う。アムネジアがあるので、走ってくる相手への対応場面が増えると見る。", "themes": ["defense", "system"], "chars": ["JP"], "side": "jp"}, {"t": 592, "head": "モダンではインパクト返しがやりやすい", "body": "モダンでは、インパクト返しがやりやすい。割られたときの生存率も高くなるはずだと言う。", "themes": ["defense", "system"], "chars": ["JP"], "side": "jp"}]}, {"id": "7K1G-oy2RHQ", "title": "【緊急】ヴァイパー追加の陰に隠れてJPが強化された事に歓喜するりゅうせい", "date": "20251016", "duration": 546, "views": 11981, "short": false, "ch": "ryusei", "kind": "JP講座", "level": "全般", "summary": "2025年10月15日のアップデートで入った、OD トルバランの調整を解説する動画。コンボ中に浮いた相手へ空振りしていた現象が減り、クラシックでもモダンでもコンボが安定するという。", "takeaways": ["OD トルバランに、コンボ中のみヒットする攻撃判定が付いた", "浮かせた後のOD トルバランが空振りする現象が減った", "弱・中のトルバランも当たりやすくなる、という最初の理解は勘違いだった", "調整の強さよりも、次の調整での弱体化を心配している"], "characters": ["JP"], "themes": ["patch", "combo"], "version_sensitive": true, "version_note": "2025年10月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。調整を解説する回で、のちの調整で変わっている可能性が高い", "points": [{"t": 176, "head": "モダンでも助かる調整", "body": "クラシックだけでなくモダンにも助かる調整だと話す。モダンの大アシストコンボは、OD トルバランを通るルートで、トリグラフやSA3につなぐ火力コンボだと説明する（字幕が荒く、ルートの細部は不確か）。", "themes": ["combo", "patch"], "chars": ["JP"], "side": "jp"}]}, {"id": "2g1j5iORvj8", "title": "【最強技】レジェンドJPが使う最強武器、中足を徹底解説！【スト6】", "date": "20250820", "duration": 632, "views": 14281, "short": false, "ch": "nandene", "kind": "JP講座", "level": "中級", "summary": "JPの中足の使い方を解説する動画。ガードさせたあとの逆択打ち返し、中足の連打、中足ヒットからのラッシュ中足、空振りからの立ち中K入れ込みを紹介する。", "takeaways": ["中足をガードさせたあとは、相手の打ち返しを見て行動を変える", "相手が中足や大技で打ち返してくるなら、入れ込みで潰せる", "中足がヒットしたあとやバーンアウト中は、連打が強い", "中足を空振ったら、立ち中Kを入れ込んで差し返しを狙う"], "characters": ["JP"], "themes": ["neutral", "offense", "resource"], "version_sensitive": true, "version_note": "2025年8月の動画。2026年3月17日と8月3日の調整より前の内容で、調整で変わっている可能性がある。フレームの数字を前提にした話は、調整で変わっている可能性がある", "points": [{"t": 439, "head": "実戦：エド戦の初手", "body": "クラシックのエドには、初手の↘強Pが強いが、モダンのエドには刺さらないので我慢する。ラッシュ立ち強Kからの大足は、相手に確定反撃がなくて強いと話す。", "themes": ["matchup"], "chars": ["JP"], "side": "jp"}]}], "lives": [{"id": "zAhVM3GijPc", "game": "スト6", "summary": "JPとベガでランクマをしながら視聴者の質問に答える配信。調整後のJPについて、アムネジアの弱体化と持続投げへの備え、モダンの強み、キャンセルワープの使い道、設置を置くタイミング、調整後の環境の見立てを話した。", "highlights": [{"t": 3660, "head": "モダンJPの強みは手軽さ", "body": "モダンはトリグラフの強度を後から選べるが、クラシックと比べて強いかという質問への答え。遠距離戦ではクラシックだと相当きつい側面があり、モダンはワンボタンで出せてコマンド入力の手間も少ないため、かなり有利だ。以前はコンボ火力の低さが弱点だったが、今回クラシックとほぼ変わらないコンボが出せるようになり、その穴が塞がった。", "chars": ["JP"], "themes": ["system", "neutral"], "side": "jp", "tags": ["Q&A", "解説"]}], "title": "【スト6】JP・ベガランクマ→FF14", "date": "20260806", "duration": 14658, "ch": "kamiki"}, {"id": "JljSmBPaBfM", "game": "スト6", "summary": "調整直後のJPでランクマをしながら話す配信。新しいJPの評価、調整後の環境の見立て、モダンJPが強いという声への疑問、アムネジアに頼れなくなった後の立ち回りを話した。終盤はベガも使った。", "highlights": [{"t": 3023, "head": "モダンJPが強いという声に疑問", "body": "モダンJPが今なぜ必要なのか、という話題。普通のコンボが出せるようになったことは分かっているが、それだけでモダンのほうが強いと言えるレベルなのかという疑問がある。ワンボタンのアムネジアは割り込みが強く、守りが強くなる点は認める。JPはモダンのほうが強いと言う人は多いが、正直な感想は本当かというものだ。", "chars": ["JP"], "themes": ["system", "defense"], "side": "jp", "tags": ["Q&A", "雑談"]}], "title": "【スト6】軽ランクマ　もしかしたらベガも", "date": "20260804", "duration": 6949, "ch": "kamiki"}, {"id": "UjeaGpYWGxc", "game": "スト6", "summary": "ランクマ配信。モダンJPの評価、切断を晒さないほうがよいという考え、差し返し主体のEDへの苦手意識を話した。終盤にC.ヴァイパー対策として、セイスモハンマーをガードした後の対処を解説した。", "highlights": [{"t": 725, "head": "モダンJPは使う意味が薄い", "body": "モダンJPの話。JPが強いのでモダンでもそこそこやれる可能性はあるが、クラシックと比べた時に使う意味がない度合いは全キャラで最上位だと思う、という見立て。モダンJPでレジェンドに到達した人は1人か2人いる。", "chars": ["JP"], "themes": ["system"], "side": "", "tags": ["Q&A", "雑談"]}], "title": "【スト6】ジム行ったからランクマやる", "date": "20260706", "duration": 9969, "ch": "kamiki"}, {"id": "Xec6eJ-w62w", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。JPの弱体化の見立て、ダルシム戦とキャミィ戦の話、モダンのキャラ選びの相談に答えた。終盤は視聴者のリプレイを見て、動きのテンポ、設置後のラッシュの是非、参考にするリプレイの選び方を解説した。", "highlights": [{"t": 6977, "head": "モダンで始めるならどのキャラか", "body": "モダンで始めて上を目指したいという相談に答えた。モダンは不便の少ない適性の高いキャラを選ぶのが大事。鉄板はリリー、マリーザ、エドモンド本田、ザンギエフの4キャラ。ヴァイパーも適性は高いが、モダンでも難しい。モダンJPはアルマスなどを目標にするなら全くお勧めできない。", "chars": ["JP", "リリー", "マリーザ", "エドモンド本田", "ザンギエフ", "C.ヴァイパー"], "themes": ["practice"], "side": "jp", "tags": ["Q&A"]}], "title": "【スト6】クソデカパフェ食べたからランクマ", "date": "20260702", "duration": 8830, "ch": "kamiki"}, {"id": "nVJ1B9hi_lA", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。EWCの予選の勝ち上がり計算、コンボのゲージ配分、モダンの各キャラの評価、立ち中Kの強さ、キャミィ対策、レート上げの考え方を話した。終盤は連続ガードが切れるSAの話をした。", "highlights": [{"t": 2642, "head": "モダンは完成度の低いキャラがいる", "body": "初期キャラのモダンは完成度が低いキャラが結構いると話した。追加キャラはモダンにも力を入れて作られているようだ。モダンリリーとモダンルークは完成されている。一方、モダンキンバリー、モダンJP、モダンダルシムは、モダンを使う意味がほとんどないキャラになったのが残念だとした。", "chars": ["JP", "リリー", "ルーク", "キンバリー", "ダルシム"], "themes": ["system"], "side": "jp", "tags": ["解説", "雑談"]}, {"t": 3000, "head": "モダンJPは使う意味がほぼない", "body": "モダンJPはモダンを使う意味がほぼないキャラだと話した。しゃがみ中がなく、JPの強みがほぼ消えている。代わりに得られるのはワンボタンのアムネジアで、対空のアムネジアなどが出せる。マスターやハイマスターまでを目指すならやってよいキャラだが、レジェンドを目標にするならまずクラシックにするよう言わざるを得ない。", "chars": ["JP"], "themes": ["system", "practice"], "side": "jp", "tags": ["解説", "Q&A"]}], "title": "【スト6】なんかフランスに行く無職男性ランクマ", "date": "20260701", "duration": 10411, "ch": "kamiki"}, {"id": "KC4ifg4QEtA", "game": "スト6", "summary": "ランクマ中心の配信。対空が間に合わないときのジャストパリィ対空の考え方、ルークの大Pの強さ、運びたいときのコンボルートの実演を話した。調子が悪い日の振り返りも出た。", "highlights": [{"t": 805, "head": "ルークの大Pは強い", "body": "ルークの大Pは前に大きく踏み込み、ダメージも大きい。モダンルークの強さを支える技で、クラシックでも十分に強いが、モダンルークを使う理由があるのはこの技の影響が大きい。", "chars": ["ルーク"], "themes": ["matchup"], "side": "vs_jp", "tags": ["キャラ対策"]}], "title": "【スト6】ランクマ 二桁順位にしたい", "date": "20260623", "duration": 10637, "ch": "kamiki"}, {"id": "-rrXNES3ACw", "game": "スト6", "summary": "ランクマ中心の配信。新しいことの練習の場所、各キャラの大Pの強さ、JPの苦手キャラとサブキャラ、立ち大Kの振りどころの質問、アムネジアの使い方を話した。長時間でインパクトが雑になる反省も出た。", "highlights": [{"t": 1485, "head": "各キャラの大Pの強さを比べる", "body": "大Pの性能はJPが全キャラ最強クラスだろう、という見立て。強い大Pの持ち主は、JPとケンが確定で、EDも強い。ルークの大Pはモダンだと下がりながら出せて余計に強い。ジェイミーは強いが方向性が違う。エドモンド本田の大Pも強い。大Pは大体のキャラが強い技だ。", "chars": ["JP", "ケン", "ED", "ルーク", "ジェイミー", "エドモンド本田"], "themes": ["neutral", "matchup"], "side": "jp", "tags": ["雑談"]}], "title": "【スト6】ランクマ 二桁順位にしたい", "date": "20260622", "duration": 9232, "ch": "kamiki"}, {"id": "aeQXHzc2tzI", "game": "スト6", "summary": "ランクマをしながら視聴者の質問に答える配信。モダンでC.ヴァイパーを始める相談、モダンとクラシックの違い、イングリッドの強さの見立てを話した。終盤はホンダのコンボトライアルを試して配信を終えた。", "highlights": [{"t": 2742, "head": "モダンのC.ヴァイパーは強いので使えばよい", "body": "モダンでC.ヴァイパーを始めるのはどうか、という視聴者の質問への答え。モダンのC.ヴァイパーは強いので使えばよい。モダンが弱いキャラなら使う意味がないと言うこともあるが、このキャラは使う意味がある。モダンのJPはマスターを目指すだけなら構わないが、JPと比べてキャラパワーは圧倒的に低く、教えられる人も少ない。2000や2100のレジェンドを目指すならやめたほうがよい。", "chars": ["C.ヴァイパー", "JP"], "themes": ["practice"], "side": "", "tags": ["Q&A", "雑談"]}, {"t": 3300, "head": "モダンとクラシックは別キャラ", "body": "モダンとクラシックは別キャラという印象で、クラシックと同じ戦い方をして勝手に切れる人が多い。モダンJPで強くなりたい人にまずモダンをやめるよう言わざるを得ない状況は良くないという考えだ。ワンボタンSAなどの強烈な強さはあるが、強さと弱さのバランスは悪く、完璧なシステムではない。", "chars": ["JP"], "themes": ["system", "practice"], "side": "", "tags": ["Q&A", "雑談"]}], "title": "【スト6】愉快なランクマ配信", "date": "20260610", "duration": 8017, "ch": "kamiki"}, {"id": "iOeE6a4i3Hg", "game": "スト6", "summary": "EVOJ前のカスタム配信。練習環境のラグ設定の見直し、PCとPS環境の差、プールで当たりそうな相手への見立て、ラシード戦での中足の使い方を話した。", "highlights": [{"t": 3730, "head": "モダン舞には飛びが危ない", "body": "対戦中、モダン舞に飛ぶと危ないと実感し、特に飛びを気をつけた方がいい相手だと話した。直後には、モダンでなくてもSAを持っている舞に対してやってはいけない行動をしたと振り返った。", "chars": ["JP", "舞"], "themes": ["matchup", "antiair"], "side": "jp", "tags": ["キャラ対策"]}, {"t": 9172, "head": "プールの見立て：舞とラシードが嫌", "body": "プールの反対側の山に2100帯のモダン舞が急に現れた、と話した。プール決勝の相手が2択で、どちらが来るか全然分からない。2人とも2100ぐらいで一番困る。舞にもラシードにも負けないのは相当無理で、プールで当たる相手としては一番嫌な気がする、という見立て。", "chars": ["JP", "舞", "ラシード"], "themes": ["matchup"], "side": "jp", "tags": ["大会見立て"]}], "title": "【スト6】永遠にEVOJに向けてカスタムしていく", "date": "20260428", "duration": 11857, "ch": "kamiki"}, {"id": "vn8DB9xIkEU", "game": "スト6", "summary": "2300到達の直後に開いたカスタム中心の配信。リリー戦ではヴィーハトの設置後にOD技をジャストパリィする大切さを話した。モダンキャミィは課題のキャラで、設置の通し方、差し返し、飛びへの対空が出ない問題を振り返った。", "highlights": [{"t": 3318, "head": "モダンキャミィが課題のキャラ", "body": "モダンキャミィに勝てず、本当に苦手だと話した。最近の大会でも大体キャミィに負けている。JPとキャミィの組み合わせは最初期からの課題だ、という話。", "chars": ["JP", "キャミィ"], "themes": ["matchup"], "side": "jp", "tags": ["キャラ対策", "雑談"]}, {"t": 4185, "head": "モダンキャミィ戦の設置の通し方", "body": "設置を通したいという質問への答え。神木C自身は安全寄りの設置しかしない方で、ぼったくる設置が少ない。モダンキャミィはぼったくって勝つ行動がしづらい相手だという見立て。ヴィーハトを置いた時にキャノンストライクで飛んでくることが結構あるだろうから、置いた後に大攻撃を出すのがありえる。特に今は大攻撃から起爆できる。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "setplay"], "side": "jp", "tags": ["Q&A", "キャラ対策"]}, {"t": 5252, "head": "キャミィの大Kは中Kで差し返す", "body": "モダンキャミィ戦の振り返り。立ち回りの大Kは見ていれば差し返せそうで、差し返しの技は中Kだ。JPは中Kが圧倒的に便利だという考え。", "chars": ["JP", "キャミィ"], "themes": ["matchup", "neutral"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}, {"t": 6605, "head": "キャミィの飛びに対空が出ない", "body": "モダンキャミィの飛びに対して対空が出なさすぎる、と振り返った場面。傾向ははっきりしているが、そこへ対応するのは難しいと話した。カスタムを通じて、課題がはっきりした気がする、と話した。", "chars": ["JP", "キャミィ"], "themes": ["antiair", "matchup"], "side": "jp", "tags": ["リプレイ振り返り", "キャラ対策"]}], "title": "【スト6】レジェJP 2300なったからカスタム", "date": "20260412", "duration": 7762, "ch": "kamiki"}, {"id": "hQ3PylyyOcY", "game": "スト6", "summary": "JPのランクマ配信。しゃがみ小Pから後ろ入力へ移るときの暴発への質問に答え、アレックスの構えへの見立て、モダンでのJPの適性を話した。", "highlights": [{"t": 5389, "head": "モダン適性ゼロのキャラはJPという見立て", "body": "モダン適性ゼロのキャラといえばJPだという見立て。モダンでは使えなくなる技の影響が大きく、クラシックの攻略がほとんど応用できないうえ、攻略もクラシックの人と共有しにくい。そのうえ火力が低いキャラという印象だ。神木Cはモダンの JP を使っていないため、あくまで印象の話だ。", "chars": ["JP"], "themes": ["system"], "side": "", "tags": ["雑談"]}], "title": "【スト6】レジェJP 今日もランクマ", "date": "20260409", "duration": 8413, "ch": "kamiki"}, {"id": "3VKK8INtQSs", "game": "スト6", "summary": "ランクマ配信。途中で、初心者にどのキャラを勧めるかという質問に答え、JPは初心者に勧めにくく、モダンならホンダ・ブランカ・マリーザなどが良いという見立てを話した。", "highlights": [{"t": 4232, "head": "初心者にJPは勧めにくい", "body": "JPは初心者相手なら弾を撃っていれば勝てる場面もあるが、不自由な面があり、覚えることも多いので、ガチの初心者に勧めるのは微妙だ。とにかく勝つ経験をしたいなら、モダンのエドモンド本田・ブランカ・マリーザの3強という見立てで、リリーもモダンでやることが簡単だ。好きなキャラを使うことはモチベーションに関わるので大事だが、好きなキャラが弱い場合は一概に勧められない。", "chars": ["JP", "エドモンド本田", "ブランカ", "マリーザ", "リリー"], "themes": ["practice"], "side": "", "tags": ["Q&A"]}], "title": "【スト6】レジェJP　ランクマとかカスタムとか　同時配信始めました", "date": "20251003", "duration": 11313, "ch": "kamiki"}], "book": [{"id": "tachimawari", "name": "立ち回り", "lead": "JPの立ち回りは、中間距離の通常技（大P・中K・大K）で相手の前進を止め、ダウンを取ったら設置とラインを上げる流れが軸になる。ドライブゲージの残りで前に出るか撃つかを決める。", "sections": [{"title": "差し返しは中K、ラッシュ止めは中攻撃", "body": ["@ryusei 2026年8月の動画では、モダンのアシストボタンなら立ちのままでしゃがみ中攻撃が出せ、ラッシュ止めがしやすいと解説している。立ちから出すと遅くなる場面で、しゃがんでいるのも悟られない。{{OAXgT9gZZ20@456}}{{OAXgT9gZZ20@482}}", "@jpdc 2026年8月の投稿では、モダンJPで2中Pが追加され、引き中Pや立ち中Kとの使い分けが分からないという質問に、2中Pは置き技とラッシュ止めでキャンセルラッシュを仕込む(ゲージを使いたくなければODストリボーグ、中ストリボーグ、SAキャンセル)、立ち中Kは差し返しが主でリーチが長い、4中PはJ弱Kガード後や気まずい距離で振ると攻撃判定が強くパニカンで勝てる、という答えがあった。{{dc:1285810788199694408/1536380314669285467}}{{dc:1285810788199694408/1536467218341167267}}", "@oukoku 2024年2月の投稿では、JPを始めたてで近接が苦手という相談に、中足や大Pを適当に擦っているという答えと、モダンJPでは大Pか大Kを基本に、ラッシュが来たら引き中かア中、小Pはめくりからなどで散らしているという答えがあった。{{dc:1200611284408881324/1209742106311008316}}{{dc:1200611284408881324/1209758563522707466}}{{dc:1200611284408881324/1209779707004981269}}", "@oukoku 2024年3月の投稿では、クラシックJPを使う人から、ラッシュ止めに最近は前大Kを使っているが、意外と止められるという報告があった。{{dc:1200611284408881324/1214478629527093338}}"], "clips": []}, {"title": "シューティングは意味を持たせて撃つ", "body": ["@jpdc 2025年10月の投稿では、ダイヤ4・5帯で待つ相手に何をすればいいかという質問に、設置してラッシュ、コマ投げ、上下の択をふっかければよいという答えがあった。相手がクラシックなら待っていても飛びが通るが、モダンならむしろ絶対に飛ばない方がよく、弾をさばくのが上手い相手にはフェイントとトリグラフを混ぜると嫌がるという。どんな弾の撃ち方でどう返されたかを把握すると対策のきっかけになるという。{{dc:1285810788199694408/1426888221551235094}}{{dc:1285810788199694408/1426892867707600917}}{{dc:1285810788199694408/1426893985196277851}}", "@oukoku 2024年4月の投稿では、飛びが噛み合うのを恐れて弾とフェイントが減るという悩みに、モダンJPの人が、相手に攻めさせることを意識して弾を使い、ヒットすれば御の字と考えている、下段弾を一度見せるとジャンプ攻撃を誘発できることが多いので、2回目でフェイントして対空できるようにしている、と答えた。{{dc:1200611284408881324/1229706948946165842}}{{dc:1200611284408881324/1230080240815050802}}", "@oukoku 2026年1月の投稿では、モダンJPでダイヤ帯の壁に当たっているという相談に、ダイヤ5の回答者が、シューティングへの対処がうまそうな相手には前へ歩いて画面端まで追い詰める（JPは画面端も強い）、立大Pは当てればシューティングに行けるので積極的に振る、SA2を積極的に使うために立大Kを空振りでも使う、と答えた。{{dc:1200611284408881324/1464498391747788911}}{{dc:1200611284408881324/1467083162629705830}}"], "clips": []}, {"title": "ストリボーグはゲージ効率と調整で評価が変わる", "body": ["@oukoku 2024年10月の投稿では、モダンJPで中ストリボーグを出したいのに中トルバランが出るという質問に、中と強のストリボーグはモダンでは使えないという答えがあった。{{dc:1200611284408881324/1298503003053097063}}{{dc:1200611284408881324/1298515251146522697}}"], "clips": []}, {"title": "対空は落とせるものを落とし、間に合わなければジャストパリィ", "body": ["@ryusei 2026年8月の動画では、モダンでは、めくり飛びに対する SA の対空が押すだけで出せると驚いている。JP は飛ばれる側のキャラなので、対空が簡単になる価値は大きいと言う。{{OAXgT9gZZ20@138}}{{OAXgT9gZZ20@184}}"], "clips": []}, {"title": "ドライブゲージは使いに行き、バーンアウトは相手にさせる", "body": ["@jpdc 2026年1月の投稿では、モダンJPのドライブゲージ使用比率について、ODをきちんと使えているのは良く、JPはOD必殺技（特にヴィーハト）が強力なので優先してゲージをODに回したいという答えがあった。改善点はインパクトがやや多く、パリィドライブラッシュが少ないこと。ラッシュから2中、4中、通常投げで触りに行く攻めも強力で、ラッシュ2中からは立弱Pからストリボーグがつながるという。{{dc:1285810788199694408/1464834947398242365}}{{dc:1285810788199694408/1464839883242606843}}"], "clips": []}], "reviewed": true}, {"id": "combo", "name": "コンボ", "lead": "JPのコンボは、確定反撃の技選び、カウンターの確認、ドライブゲージの配分で火力が決まる。", "sections": [{"title": "コンボの基本型と始動技の選び方", "body": ["@jpdc 2024年10月の投稿では、モダンからクラシックに移る時は、コンボトライアルから始める、まず小攻撃のコンボから中・大と練習する、という声があった。2弱P・2弱K・5弱P・弱ストリボーグも最初から練習した方が楽で、マスターに上がってから練習したら癖付けが大変だったという。{{dc:1285810788199694408/1293180305707896873}}{{dc:1285810788199694408/1293236196419305514}}{{dc:1285810788199694408/1293237159528239214}}{{dc:1285810788199694408/1295900799251251250}}", "@jpdc 2024年10月の投稿では、クラシックJPで練習すべき常用コンボを聞く質問に、しゃがみ中P→キャンセルラッシュしゃがみ大P→大ストリボーグ→中トルバラン→強トリグラフ（意外と難しい）、中足カウンター→弱Kか小P→弱ストリボーグ、触りに行くなら大P→弱トルバラン、などが挙がった。昇竜確定はラッシュ6大K>弱トルバラン>6大K>中ストリボーグ>大P～の方がフレーム的に簡単で火力も出るという。{{dc:1285810788199694408/1295890457141837856}}{{dc:1285810788199694408/1295897392905715792}}{{dc:1285810788199694408/1295897895458832394}}{{dc:1285810788199694408/1295899247220101120}}", "@jpdc 2025年3月の投稿では、クラシックJPの初心者が覚えるコンボとして、ラッシュしゃが中K→しゃが中P→CDRしゃが強P→強ストリボーグ→中トルバラン→強トリグラフが挙がった。新バージョンから使える立ち中K→CDR立ち強P→強ストリボーグ→中トルバラン→強トリグラフは簡単で、立ち中K始動は狙いやすく使う機会も多いという。{{dc:1285810788199694408/1353776784491024508}}{{dc:1285810788199694408/1353778186890121247}}", "@jpdc 2025年9月の投稿では、モダンで生ラッシュの引き中Pや中Kで触りに行ったヒット時のコンボとして、ラッシュ4中Pは+9、ラッシュ中Kは+7を作れるので、間に合う攻撃ならヒット確認からコンボできるという答えがあった。手軽なのはラッシュ4中P→4中Pタゲコンで、ラヴーシュカがあればタゲコンから発動してよい。ラッシュ中Kの+7はモダンでは旨みが薄いという。{{dc:1285864637199286312/1416106698896314539}}{{dc:1285864637199286312/1416119772474511380}}", "@jpdc 2025年9月の投稿では、モダンの生ラッシュ2中Kはラッシュ中Kと似ているが下段なので刺さりやすいという答えがあった。ヒット確認せず弱Pから弱ストリボーグかアブニマーチの択を入れ込む人もいて、弱Pが空振りでも出る。弱ストが「たまたま」暴れ潰しや刺し返しになることもあり、弱Pが空振りする距離ではガードされても確反がほぼないという。{{dc:1285864637199286312/1416121241663705219}}{{dc:1285864637199286312/1416246263162081320}}", "@jpdc 2026年4月の投稿では、クラシックでJPを始めた人に、2中P＞CR＞2強P＞強ストリボーグ＞中トルバラン＞強トリグラフ（＞ザプリェット）が基本の高火力コンボ、グロームストレルカ（TC）＞ODストリボーグ＞強トリグラフも取りやすい始動で良い、と紹介された。ジラント＞ラヴーシュカ＞2中K＞強K＞2強P＞強ヴィーハト＞強P＞インパクト＞強トリグラフは、状況の縛りがほぼなく削りも強いという。{{dc:1285800688097562715/1492479131085045760}}{{dc:1285800688097562715/1492485285110480937}}", "@oukoku 2024年4月の投稿では、クラシックに転向するなら最初に覚えるコンボとして、強ストリボーグ連携が挙げられた。ダメージが取れて距離も離せて設置もできるという。CH以上の立強Pや牽制からのキャンセルラッシュ、パニカン、DI、前ステなどから、しゃがみ強P→強ストリボーグ→中トルバラン→強トリグラフ→設置かSA3。端では前強Kなども始動にし、強ストリボーグ→立強P→トリグラフ→OD設置かSA1で、通常設置は不利になるという。{{dc:1200611284408881324/1232296827924119603}}{{dc:1200611284408881324/1232306370707980328}}", "@oukoku 2024年6月の投稿では、モダンからクラシックに移行して何を練習するかという質問に、クラシック特有の、しゃがみ中Pキャンセルラッシュから大ストリボーグまでつながるコンボを練習するのが一番だという答えがあった。あわせて、ラッシュをしゃがみ中Pで止める使い方や置き技としてのしゃがみ中Pを覚えると、このコンボも自然と使えるようになるという。{{dc:1200611284408881324/1252240196494295152}}{{dc:1200611284408881324/1252978059938762774}}"], "clips": [{"ch": "jpdc", "c": "1285864546984005693", "m": "1287777906965086278", "a": "アオノ", "d": "20240923", "x": "前に投降したお手軽スタンコンボのモダンでもできるバージョンです、全部最速入力です。クラシックで検証してしまったのでダメージに差異があることをご了承ください。"}, {"ch": "jpdc", "c": "1285864546984005693", "m": "1293421498559889501", "a": "アオノ", "d": "20241009", "x": "モダンの大Pパニカンで出来る高めなコンボです、クラシック検証のためダメージに差異があることをご了承ください。"}, {"ch": "jpdc", "c": "1285864546984005693", "m": "1293516495883862026", "a": "ベルフェ", "d": "20241009", "x": "モダンでどうしても「たいじスーパーウルトラコンボ2024」がやりたかった"}]}, {"title": "運び、設置後、トリグラフ後のコンボ", "body": ["@jpdc 2025年4月の投稿では、SA3の使用後に普段より距離が離れていた理由を問われ、CAになっているからで、JPはSA3よりCAの方が距離が離れるという答えがあった。トレモの初期位置から、モダンコマンドでそれぞれを使って確かめた結果だという。{{dc:1285810788199694408/1366871716147494953}}{{dc:1285810788199694408/1366932056382115941}}{{dc:1285810788199694408/1366967258705821826}}", "@jpdc 2025年8月の投稿では、モダンで火力の出るコンボを聞かれ、ジラント→ODストリボーグ→中強ODトリグラフ→強トリグラフ→SA3で5280入り、入力も簡単という答えがあった。500安いがジラント→ODトルバラン→ザプリェットは安定しやすいという話や、画面端限定でジラント→ODストリボーグ→強アシコンを出し切れば5000近く出るという話もあった。{{dc:1285810788199694408/1405089807155335199}}{{dc:1285810788199694408/1405231714460241920}}{{dc:1285810788199694408/1405527156418936985}}{{dc:1285810788199694408/1406248334464647311}}", "@oukoku 2025年5月の投稿では、クラシックで強ストリボーグ→強トリグラフ→SA3までつなげたいがコマンドを入れるタイミングが分からないという質問に、最速入力で問題なく、トルバランを中にするといけるという答えがあった。質問者は、中だと端まで飛ばないと思い込んでいたという。{{dc:1372156483206123530/1372156483206123530}}{{dc:1372156483206123530/1372167274282352697}}{{dc:1372156483206123530/1372174701874511995}}"], "clips": [{"ch": "jpdc", "c": "1285864546984005693", "m": "1413363049078849710", "a": "びゃこ", "d": "20250905", "x": "某全1モダンJPが使ってたスタンコンですが、慣れれば簡単で強くてオススメです。しゃが大の後1ゲージ帰ってきてキャンセル設置で＋16とか大p設置と似たような状況作…"}]}, {"title": "アムネジア、対空、昇龍ガード後のコンボ", "body": ["@jpdc 2024年10月の投稿では、アムネジアで投げやインパクトを取った時の最大を聞く質問に、SA1>SA1が簡単でよく減る、画面端限定で裏投げ、6強K、強ストリボーグ、強P、ODトルバラン、トリグラフ、弱ストリボーグ、SA3で3770、という答えがあった。別の答えでは、屈中P（または中K）>弱トリグラフ>爆発～が最大になり、ODアムネジア>中K（PC）>弱トリグラフ>前ステ2回>6強K>DR>強K>強P>中トルバラン>SA3で4010（モダンのダメージ）という。{{dc:1285810788199694408/1292780779654352969}}{{dc:1285810788199694408/1292783615645843519}}{{dc:1285810788199694408/1292804192104218724}}{{dc:1285810788199694408/1293052097708953642}}", "@oukoku 2026年11月の投稿では、クラシックで画面端でODアムネジアの当身が成功したあとの対応を聞かれ、相手に4F確定がある場合は、しゃがみ弱P→中K→強設置→ワープ→ジャンプ中K→6強K→トリグラフがよく選ばれている印象だという答えがあった。手間なら、しゃがみ弱P2回→6強K拾い→トリグラフ→設置でもよいとも書かれている。{{dc:1568973094180229311/1568973094180229311}}{{dc:1568973094180229311/1568983893833683056}}{{dc:1568973094180229311/1569207925375770747}}", "@oukoku 2025年5月の投稿では、クラシックJPで画面端で投げをアムネジアで取った後の、後ろ投げ→前大K→ディレイ強ストリボーグが成功しないという質問に、6強Kのモーションが見え始めてからコマンドを入力するイメージだという答えがあった。回答者は、6強K>棘>ラッシュ2強P>設置で+13が取れて安定するのでそちらを使っているという。{{dc:1372207850406805564/1372207850406805564}}{{dc:1372207850406805564/1372373393860726835}}"], "clips": []}, {"title": "コンボの精度を上げる", "body": ["@rerin 2026年11月の動画では、モダンの弱アシストのコンボは自動確認だが、しゃがみ弱Pから↓アシスト弱で連打キャンセルするときは自動確認ではないので注意すると話している。立ち中Kからのキャンセルラッシュは、しゃがみ弱Pなら連続ガードを組めるが、しゃがみ中Pからは連続ガードにならない。{{pH0OO3NED0M@62}} {{pH0OO3NED0M@82}} {{pH0OO3NED0M@212}}", "@oukoku 2025年10月の投稿では、クラシックでトリグラフからのSA3締めがうまくいかないという相談に、SA3へのキャンセルはトリグラフのコマンドを作り終わってからすぐにSA3のコマンドを作るといけるという答えがあった。原因は、トリグラフのあとにニュートラルが10F入っていてキャンセルできていないことだった。レバーレスのほうが下下コマンドを作りやすいので推すという意見もあった。{{dc:1424421274993823925/1424421274993823925}}{{dc:1424421274993823925/1424586319530692699}}{{dc:1424421274993823925/1424687035599421472}}{{dc:1424421274993823925/1424713864653705336}}", "@oukoku 2024年3月の投稿では、ODヴィーハト→前強K→中トルバラン→強Pという高めの中トルバランからのコンボは、中トルバランと強Pの間にヴィーハトをヒットさせる必要があり、設置が早く当たると繋がらないという。モダンでも入る。中トルバランの持続は6Fで、持続の最後に相手を乗せるように当てる必要があり、完全端スタートでは近すぎて当たりにくいので、OD設置後に後ろ歩きを入れると当たりやすいという。{{dc:1200611284408881324/1216578309219946536}}{{dc:1200611284408881324/1216669158540840961}}{{dc:1200611284408881324/1216868714289561652}}{{dc:1200611284408881324/1216921681185079377}}", "@oukoku 2024年5月の投稿では、モダンJPでジャンプ大Kからジラントがつながるときとつながらないときがあるという質問に、ジャンプ大Kが高めに当たっているからだろう、相手の胸くらいの高さを狙うとつながる、という答えがあった。{{dc:1200611284408881324/1235483080987250718}}{{dc:1200611284408881324/1235489786534563880}}"], "clips": [{"ch": "oukoku", "g": "1182838025038872637", "c": "1200611284408881324", "m": "1216868714289561652", "a": "MIXA(みくさ)キンバリーMR1800", "d": "20240312", "x": "大Pパニカンからのコンボです。トレモでモダンでやってたのですが出来なくて…"}]}, {"title": "この場面で倒しきれるか（リーサルの相談）", "body": ["@jpdc 2026年2月の投稿では、モダンJPでの、画面端でのインパクト返しは、ジャンプ大KかOD設置のルートに行けると高いダメージが出る。簡単な形と高い形の2つが示された。{{dc:1292666373314707456/1470425355209932987}}{{dc:1292666373314707456/1470434194118410463}}", "@oukoku 2026年10月の投稿では、クラシックのスタンからのリーサルを探す相談に、バクステ×2→弱設置→前ステ→2大P→トリグラフ→OD設置→6大K→中トルバラン→前ジャンプ中K（ちょいディレイ）→ラッシュ2大P→大P→SA2→弱ストリボーグ→中ストリボーグ→OD設置→ちょい遅らせトリグラフ→トリグラフ、でリーサルになるという答えがあった。SA2のあとは、最後をストリボーグかSA1にするのが一番減るという。{{dc:1559588063674372126/1559588063674372126}}{{dc:1559588063674372126/1559592577710293043}}{{dc:1559588063674372126/1559592974000590849}}", "@oukoku 2026年7月の投稿では、クラシックのラウンド3で立大P、ODトルバランからSA2を発動し、中足が届かない間合いでのリーサルを探す相談に、垂直J大P>強設置>前ステ>立ち中K>中弾>OD棘>棘で2875ダメージが出たが、残りHPが3380でまだ600近く足りず、おそらくリーサルはないという答えがあった。{{dc:1527657633501417663/1527657633501417663}}{{dc:1527657633501417663/1527662655114973285}}", "@oukoku 2026年3月の投稿では、クラシックJPで「凶襲突」をジャストパリィした後のリーサルを探す質問に、ジャスパ後にしゃがんでかわして攻撃するか、もう一段ジャスパしてインパクトになるかと思う、という答えがあった。{{dc:1483435844051144795/1483435844051144795}}{{dc:1483435844051144795/1483774199309930537}}", "@oukoku 2026年2月の投稿では、クラシックで画面端のODアムネジア後のリーサルを探す相談に、ラウンド数の記載がなく3ラウンド目の中段をアムネジアで取った場面と見て、そこからはないと思うが、詐欺飛びからバーンアウトを削り切るリーサルならありそうという答えがあった。前大K→強ストリボーグ→大P→中ストリボーグから詐欺飛びでJ大K→ジラント→ODトルバラン×3→SA2→中ストリボーグ→小P→中ストリボーグ→立中K→中ストリボーグの連ガ1800で、計算上リーサルだという。{{dc:1475044322142453830/1475044322142453830}}{{dc:1475044322142453830/1475061893801709671}}{{dc:1475044322142453830/1475063380447592480}}{{dc:1475044322142453830/1475065779279102063}}", "@oukoku 2026年2月の投稿では、クラシックの3ラウンド目のスタン後のリーサルを探す相談に、OD設置>中ストリボーグ>大足>OD設置>5大P>中トルバラン>6大K>トリグラフ>トリグラフ>SA3（6650）でリーサルになるという答えがあった。{{dc:1471875149937512609/1471875149937512609}}{{dc:1471875149937512609/1471879491939729479}}", "@oukoku 2026年1月の投稿では、クラシックの2ラウンド目でジャスパを取った後のリーサルを探す質問に、おそらくないが、屈大P→大ストリボーグ→DR前大K→中弾→大P→CR大P→SA2でいつものルートにいくと2891が出たという答えがあった。DR前大K→CR前大Kを持続中玉で大Pで拾うルートなら倒し切れるかもしれないが、難しくて確かめられないという。{{dc:1459236586486104239/1459236586486104239}}{{dc:1459236586486104239/1459379459743416403}}{{dc:1459236586486104239/1459382971130839276}}"], "clips": []}], "routes": [{"title": "小技・中技始動（モダン準拠）", "ch": "rerin", "routes": [{"name": "弱アシストの基本", "when": "密着で有利なときなど", "route": ["しゃがみ弱P", "↓アシスト弱"], "options": [], "note": "弱アシストのコンボは自動確認で、ボタンを連打していればコンボになる。しゃがみ弱Pから↓アシスト弱で連打キャンセル（連キャン）するときは自動確認ではないので注意。", "cites": ["{{pH0OO3NED0M@70}}", "{{pH0OO3NED0M@82}}", "{{pH0OO3NED0M@99}}"]}, {"name": "小技始動のリーサル", "when": "小技がヒットしてリーサルが見えるとき", "route": ["アシスト弱", "キャンセルラッシュ", "弱P", "立ち中K", "キャンセルラッシュ", "立ち大K", "前大K", "中トルバラン", "SA3"], "options": [], "note": "最後の中トルバランをSA1にすることもできる。SA2を使うときは前大Kの部分をしゃがみ大Pに変え、しゃがみ大P→SA2とつないだら立ち大Kにつなぐ。", "cites": ["{{pH0OO3NED0M@109}}", "{{pH0OO3NED0M@114}}", "{{pH0OO3NED0M@126}}", "{{pH0OO3NED0M@143}}", "{{pH0OO3NED0M@147}}"]}, {"name": "中技始動（アシスト中）", "when": "中技がヒット", "route": ["アシスト中", "キャンセルラッシュ", "しゃがみ大P", "大ストリボーグ", "中トルバラン", "強トリグラフ"], "options": [], "note": "", "cites": ["{{pH0OO3NED0M@188}}", "{{pH0OO3NED0M@190}}"]}, {"name": "中技始動（立ち中K）", "when": "立ち中Kがヒット", "route": ["立ち中K", "キャンセルラッシュ", "しゃがみ大P", "大ストリボーグ", "中トルバラン", "強トリグラフ"], "options": [], "note": "リーサルが見えるなら、小技のときのように地上で伸ばすのがおすすめ。立ち中Kからのキャンセルラッシュは、しゃがみ弱Pなら連続ガードが組めるが、しゃがみ中Pからは連続ガードにならない。", "cites": ["{{pH0OO3NED0M@200}}", "{{pH0OO3NED0M@205}}", "{{pH0OO3NED0M@212}}"]}]}, {"title": "生ラッシュ", "ch": "rerin", "routes": [{"name": "生ラッシュ立ち弱Pのパニッシュカウンター", "when": "相手が技を空振っていた", "route": ["生ラッシュ", "立ち弱P（パニッシュカウンター）", "大K", "しゃがみ中P", "ODストリボーグ", "強トリグラフ"], "options": [], "note": "状況確認でパニカンのコンボを選ぶ。モダンでは、しゃがみ中P→ODストリボーグはアシスト中ボタンをちょい押しして出す。", "cites": ["{{pH0OO3NED0M@298}}", "{{pH0OO3NED0M@300}}", "{{pH0OO3NED0M@306}}"]}, {"name": "大ストリボーグからのリーサル", "when": "ラッシュしゃがみ中Pがヒット。空中から拾ったときのリーサルにも使える（最大ではない）", "route": ["ラッシュ", "しゃがみ中P", "立ち中K", "キャンセルラッシュ", "しゃがみ大P", "大ストリボーグ", "生ラッシュ", "前大K", "キャンセルラッシュ", "立ち大P（高め拾い）", "立ち大P", "トリグラフ", "SA3"], "options": [], "note": "ラッシュしゃがみ中P→立ち中Kが大事で、そこだけ覚えておけば大丈夫。立ち大Pの高め拾いは難しいが、ほかでも使うテクニック。モダンでは大ストリボーグを使わない地上伸ばしのほうが高くなる場合がある。SA3の最大は大ストリボーグのルートだが、火力があまり変わらないので、SA2ルートの火力が大きい地上伸ばしをまず選びたい。", "cites": ["{{pH0OO3NED0M@312}}", "{{pH0OO3NED0M@316}}", "{{pH0OO3NED0M@331}}", "{{pH0OO3NED0M@335}}", "{{pH0OO3NED0M@347}}", "{{pH0OO3NED0M@356}}"]}, {"name": "生ラッシュ中段", "when": "生ラッシュの中段がヒット", "route": ["生ラッシュ", "中段", "しゃがみ中P", "アシスト中（ODストリボーグまで）", "強トリグラフ"], "options": [], "note": "アシスト中を連打しない（連打するとSA2が出る）。モダンはアシスト中のコンボを使う（画面端の大K始動のコンボでも使う）。", "cites": ["{{pH0OO3NED0M@406}}", "{{pH0OO3NED0M@416}}", "{{pH0OO3NED0M@420}}", "{{pH0OO3NED0M@424}}"]}]}, {"title": "設置から拾う", "ch": "rerin", "routes": [{"name": "画面端で拾う", "when": "画面端で設置から拾う", "route": ["生ラッシュ", "前大K", "中ストリボーグ", "前大K", "中ストリボーグ", "立ち大P", "…"], "options": [], "note": "モダンでは1回目の中ストリボーグを弱弾（弱トルバラン）にしたほうが火力が高いが、設置から拾う場合は弱弾が空振りしがちなので非推奨。", "cites": ["{{pH0OO3NED0M@733}}", "{{pH0OO3NED0M@740}}", "{{pH0OO3NED0M@750}}"]}]}, {"title": "ODトルバランの調整で安定するコンボ", "ch": "ryusei", "routes": [{"name": "大P>ODトルバラン>トリグラフSA3", "when": "モダンの大アシストコンボ", "route": ["大P", "ODトルバラン", "トリグラフ", "SA3"], "options": [], "note": "ODトルバランのサーチがガバく、当たらない現象が緩和された。", "cites": ["{{7K1G-oy2RHQ@187}}"]}]}, {"title": "モダン操作のアシストコンボ（2026年8月3日の調整）", "ch": "ryusei", "routes": [{"name": "アシストコンボ2", "when": "モダン操作", "route": ["しゃがみ中P", "ODストリボーグ", "ラヴーシュカ", "シャーロスチ", "強ヴィーハト", "中ストリボーグ"], "options": [], "note": "調整のパッチノートに出ている、変更後のアシストコンボ2の中身。初段が立ち中Kからしゃがみ中Pに変わった。", "cites": ["{{ragTngpJioE@268}}"]}]}], "reviewed": true}, {"id": "setplay", "name": "セットプレイ", "lead": "JPのセットプレイは、ダウンを取って設置し、画面端に追い込んで一度の読み合いに勝つ形が土台になる。そのうえで大Pラッシュ、起爆、ワープ、パリィへの対策を、相手と時期に合わせて使い分ける。", "sections": [{"title": "設置のタイミングと種類：安全第一、OD設置はゲージを見て選ぶ", "body": ["@oukoku 2025年12月の投稿では、クラシックで画面端の大ストリボーグのあと、キャンセルラッシュ後にOD設置するとゲージがなくなるため、OD設置しない場合を尋ねられ、大P→ノーマル設置で+15〜になるので、遅らせた大Kタゲコンや投げの択をかけるという答えがあった。{{dc:1455480556988010637/1455480556988010637}}{{dc:1455480556988010637/1455512086280147060}}"], "clips": []}, {"title": "投げ後の設置：前投げは避け、裏投げは相手を選ぶ", "body": ["@jpdc 2026年1月の投稿では、モダン向けの低難易度な端の柔道セットプレイとして、端背負わせ前投げ→中or強トルバラン（中下択）→グロームストレルカ→ODストリボーグ→遅らせ強P→ODトルバラン→トリグラフ→ザプリェットが紹介された。投げを除いて5000程度だが、投稿者の追記によると、2026年3月17日のアップデートで柔道が削除され、現在は不可能という。{{dc:1285864581478088776/1458823492156915944}}", "@jpdc 2026年3月の投稿では、モダンなら2中Pの代わりにラッシュ4中Pで行けるという案が出た。端の前投げからのラッシュ4中Pは+6でコパくらいしか繋がらないが、コパ弱ストリボーグまで入れ込んで当たっていればザプリェットに繋げるリーサルが使えるかもしれない、という。{{dc:1285800688097562715/1483456687850389635}}{{dc:1285800688097562715/1483503091956453497}}"], "clips": []}, {"title": "大Pと中K：固めの入口になる技の使い方", "body": ["@jpdc 2024年9月の投稿では、攻めの起点になる「○○キャンセルラッシュ」の使い分けについて、立ち中Kキャンセルラッシュ2大Pは、2大Pまでガードされてもそこからキャンセルで中段弾を出すなどごまかしが利くという案があった。モダン相手には、大Pキャンセルラッシュ中足が連続ガードになり、相手が無敵技を入力していれば中足がヒットするので使うという。{{dc:1285810788199694408/1288781107910938624}}{{dc:1285810788199694408/1288798666525642764}}{{dc:1285810788199694408/1288805285816696904}}"], "clips": []}, {"title": "パリィとの読み合い：フェイントで釣り、投げを混ぜる", "body": ["@oukoku 2024年4月の投稿では、パリィでしのぐ相手への攻め方について、モダンJPでは、トルバランのフェイントを混ぜてパリィのタイミングをずらす、ヴィーハトからワープして投げる、という答えがあった。投げ抜けしてくる相手には、アシスト弱コンボか強攻撃からのコンボを入れ、JPが降りる位置を読まれにくい相手の直上のヴィーハトならアシ弱を使い分けるという。{{dc:1200611284408881324/1229566529742573659}}{{dc:1200611284408881324/1229658920901935105}}{{dc:1200611284408881324/1229659799734587425}}{{dc:1200611284408881324/1229664276482883604}}"], "clips": []}, {"title": "画面端のセットプレイ：トリグラフOD設置からの択とゲージの目安", "body": ["@oukoku 2025年5月〜2025年6月の投稿では、画面端の処理を尋ねる質問に、モダンの回答者は端に追い詰めて密着が作れるなら基本は柔道にして、投げを基本に中トルバランとインパクトで択をかけるという。相手のドライブゲージが切れそうな時やバーンアウト中はODトルバランで圧をかけ、強K＞強P＞ラヴーシュカで削りを狙うこともある。端でガードさせてからラヴーシュカを狙うとDリバや無敵技が飛んできやすいので、一度ガードする方がよい場合が多いという。{{dc:1371309587679940638/1371309587679940638}}{{dc:1371309587679940638/1381201362884362250}}"], "clips": []}, {"title": "詐欺飛びと補正切り：リターンと読まれ方", "body": ["@jpdc 2026年11月の投稿では、モダンJPの中アシストのSA2漏れから、大P→中ストリボーグ→前跳び→弱設置とすると、設置付きで+42Fを取れ詐欺跳びに行ける。F式は無理で、J大K→中足→（5Fほど空けて誘爆）となり、2889ダメージで火力は低いが簡単なので、誤爆したときのリカバー程度に使えるという。{{dc:1285864581478088776/1572171035598520441}}"], "clips": []}, {"title": "相手キャラ別の注意：ダルシム、イングリッド、リリー、ED ほか", "body": ["リリー戦は、ヴィーハトを貼って立ち回りに戻ったら、OD コンドルスパイアを見てジャストパリィするのがいちばん大事で、ミスしてもよいから試みる。一度でも成功すれば、リリー側はやりづらくなる。モダンキャミィ戦は、神木Cが安全寄りの設置しかしない前提で、置いた後に大攻撃を出す手がある。キャノンストライクで飛んでくることが多そうで、今は大攻撃から起爆できる（2026年4月12日の配信）。 {{vn8DB9xIkEU@3001}} {{vn8DB9xIkEU@4185}}"], "clips": []}], "reviewed": true}, {"id": "taisaku", "name": "対策", "lead": "動画の対策は、ガードで不利になる技にボタンを押す、確定を取る、ジャストパリィを合わせる、のどれかに落ち着くものが多い。配信では JP がきついキャラとして、ベガ・ジュリ・ジェイミー・ED などが時期ごとに挙がっている。", "sections": [{"title": "キャミィ：ストライクを盾にした飛びと、置き技の噛み合い", "body": ["@oukoku 2024年2月の投稿では、キャミィのナックルには、振らせてジャストパリィするという対応があった。ナックルをガードした後に微歩き投げしてくる相手には、下がって投げをスカし、アシスト強（クラシックなら強Pか）を擦るのが気持ちいいという。{{dc:1204368836686778369/1204631153903009842}}{{dc:1204368836686778369/1204685036511830038}}"], "clips": []}, {"title": "ルーク：大フラッシュナックルにはインパクト、ラッシュ止めは空振りを刺す", "body": ["配信では、ラッシュ止めを振ってくる相手には、ラッシュ止めの技が全般にとても隙があるので、その空振りを大Pや大Kで刺す。ルークの大Pは前に大きく踏み込みダメージも大きく、モダンだと下がりながら出せて余計に強い。{{wsmE7M2oF7M@5698}} {{KC4ifg4QEtA@805}} {{-rrXNES3ACw@1485}}"], "clips": []}, {"title": "舞：SA1後の花蝶扇は、光らなければ小Pを押す", "body": ["配信では、モダン舞には飛びが危ないとしている。モダンでなくても SA を持っている舞に対しては、やってはいけない行動をしたと振り返っている。2026年4月28日の配信では、プールで当たる相手としては舞とラシードが一番嫌だという見立てが出ている。2025年11月16日の配信では、SFL では舞やベガのカウンターピックが JP の出しにくさにつながっているとしている。{{iOeE6a4i3Hg@3730}} {{iOeE6a4i3Hg@9172}} {{OqBKvk1tCl8@9495}}"], "clips": []}], "reviewed": true}, {"id": "kangaekata", "name": "考え方", "lead": "神木Cが繰り返し挙げるのは、新しいことの練習はランクマの外でやること、伸びしろは帯ごとにほぼ決まっていること、の2点だ。カウンターやアムネジアなどシステムの理解と、2025年10月から2026年10月までの調整への見立てを、時期順に並べる。", "sections": [{"title": "リプレイは自分より少し上の人と、自分の負けた試合を見る", "body": ["@jpdc 2025年9月の投稿では、「とにかく攻める」プレイを学ぶ方法を聞かれ、自分より少しランクが高い人（MR1500なら1700〜1800くらい）のリプレイを見て、こういう動きをしていいのかという発見を増やすのがよいという答えがあった。参考にする人のランクが高すぎると参考にならないという。モダンでなくてもよく、クラシックの技をモダンで代用できないか考えるのも大事という。{{dc:1285810788199694408/1417853265063968898}}{{dc:1285810788199694408/1417861482179330150}}{{dc:1285810788199694408/1417867581079158930}}"], "clips": []}, {"title": "パリィは専用ボタンを作り、入力の癖を直す", "body": ["@oukoku 2025年4月〜2025年5月の投稿では、パッド（OCTA）でクラシックJPを使う人から、クラシックではODヴィーハトとOD中トリグラフが弱強P同時押しでないと出せないので、R1に弱強P同時押しを配置しているという書き込みがあった。ほかは天面の6ボタンを弱中強のPとK、R2にパリィ、L2にインパクト、L1はトレモ用のファンクションボタンだという。{{dc:1365225020137279548/1365225020137279548}}{{dc:1365225020137279548/1366775110421319680}}{{dc:1365225020137279548/1368196071389663282}}"], "clips": []}, {"title": "JPの難しさ、サブキャラ、モダンJPの評価", "body": ["モダンJPは、2026年7月までは使う意味が薄いという評価だった。2026年4月9日の配信では、モダン適性ゼロのキャラはJPで、モダンでは使えなくなる技の影響が大きく、クラシックの攻略がほとんど応用できないという印象で、神木Cはモダンの JP を使っていないため、あくまで印象の話だとする。2026年7月1日の配信では、モダンJPはしゃがみ中がなくJPの強みがほぼ消えるとする。代わりに得られるのはワンボタンのアムネジアで、レジェンドを目標にするならまずクラシックにするよう言わざるを得ないとする。2026年7月6日の配信では、モダンを使う意味がない度合いは全キャラで最上位だと思うとする。 {{hQ3PylyyOcY@5389}} {{nVJ1B9hi_lA@3000}} {{UjeaGpYWGxc@725}}", "2026年8月の調整後は、モダンJPの評価が割れている。2026年8月4日の配信では、普通のコンボが出せるようになったことは分かるが、それだけでモダンのほうが強いと言えるレベルなのかという疑問があるとする。ワンボタンのアムネジアは割り込みが強く守りが強くなる点は認める。2026年8月6日の配信では、モダンは遠距離戦でクラシックより有利で、以前の弱点だったコンボ火力の低さは、今回クラシックとほぼ変わらないコンボが出せるようになり塞がったとする。 {{JljSmBPaBfM@3023}} {{zAhVM3GijPc@3660}}", "@ryusei 2026年8月の動画では、モダンの JP に可能性を感じると語っている。モダンでは、ワンボタンのトリグラフとアシストコンボが強みで、慣れるまでの時間が課題だと言う。{{OAXgT9gZZ20@533}}{{OAXgT9gZZ20@622}}", "@rerin 2026年11月の動画では、Year4でモダンJPが大きく強化されたので、今はモダンJPを使っていると話している。モダンとクラシックでコンボはほぼ変わらないので、クラシックのJP使いにも参考になるという。{{pH0OO3NED0M@19}} {{pH0OO3NED0M@33}}", "@jpdc 2024年9月の投稿では、モダンJPからクラシックに移った理由として、モダンでは2中Pと強ストリボーグが使えないのが痛い、レバーレスに替えてクラシックの操作に慣れた、マスター到達で移行した、などが挙がった。PS純正パッドでは真空コマンドが難しくモダンのままだった、という人もいた。{{dc:1285800688097562715/1287076290742190111}}{{dc:1285800688097562715/1287077509128785990}}{{dc:1285800688097562715/1287078563668951182}}{{dc:1285800688097562715/1287078991160934411}}{{dc:1285800688097562715/1287079792293838919}}", "@jpdc 2024年9月〜2024年10月の投稿では、モダンJPからクラシックに移ると、中・強ストリボーグのおかげで端のヴィーハト絡みの設置など全体の火力が上がり、2中Pは判定が強く発生7でラッシュ2中Kからつながるという意見があった。モダンJPは、ワンボタンのアムネジアやトリグラフが楽でバーンアウト中の弾連打に一矢報いられる反面、強ストリボーグやJ中Kがなくコンボがきつく、吹き飛ばしにODを使うことになるという。{{dc:1285810788199694408/1289753793562411109}}{{dc:1285810788199694408/1290910874915045386}}{{dc:1285810788199694408/1290910972139147297}}{{dc:1285810788199694408/1290910981630988352}}{{dc:1285810788199694408/1290916141060984852}}{{dc:1285810788199694408/1290917135568339017}}", "@jpdc 2025年1月の投稿では、モダンJPで覚えるコンボについて、クラシックJPの人から、生ラッシュしゃがみ中→立ち弱→弱ストリボーグ、画面端でODアムネジア→後ろ投げ→アシスト大→トリグラフが挙がった。JPは弱と強のアシストコンボが強く、慣れるまで頼ってよい、しゃがみ大P対空からは強か中のトルバランでガードを揺さぶる、画面端は前投げを狙うのが簡単で強い、という助言もあった。{{dc:1285810788199694408/1331991293349335063}}{{dc:1285810788199694408/1332012096837390387}}", "@jpdc 2025年3月の投稿では、モダンJPは中強ストリボーグと2中Pがなく、コンボ入力にも癖がある一方、アムネジア・チェルノボーグ・ザプリェットが1ボタンで撃てるのは強い、という意見があった。通常技はボタンを2つ押すためラッシュ止めがワンテンポ遅れ、しゃがみ＋アシストという操作はなく、アシスト中の初動が中Kなのは2中Pを渡さない意図と感じるという。{{dc:1285800688097562715/1352475837219471360}}{{dc:1285800688097562715/1353021172928741488}}{{dc:1285800688097562715/1353023151709093899}}{{dc:1285800688097562715/1353027015514656971}}", "@jpdc 2025年3月の投稿では、JPでモダンからクラシックに移ったとき最初に何を練習したかという質問に、弱と強のアシストコンボを手動で再現することから始めたという答えがあった。手動でコンボをやっても正解がわからなかったので、よく知っているアシストコンボの方が正解がわかりやすいという。{{dc:1285810788199694408/1353750046486822913}}{{dc:1285810788199694408/1353758840646139980}}{{dc:1285810788199694408/1353827881100251217}}", "@jpdc 2025年7月の投稿では、プラチナで始めたばかりのモダンJPが何から覚えるかという質問に、強ボタン2回→オートSP→強トリグラフのコンボと、弱ボタン2回→SPのコンボの2つができれば足りるという答えがあった。SA2のラヴーシュカはとても強いのでたくさん使い、基本コンボは弱・強のアシストコンボを加えるとよい。弱2回→SPからSA3がつながることは、小さな隙からもリーサルになるので覚えるとお得だという。{{dc:1285810788199694408/1389541207763320852}}{{dc:1285810788199694408/1389542369325617212}}{{dc:1285810788199694408/1389934660615803000}}", "@jpdc 2025年9月の投稿では、攻めを学ぶのに近いランクのモダンJPのリプレイを探したい理由が語られた。モダンは中強ストリボーグがなく、ジラントからの火力が弱ストリボーグ1940・弱トルバラン1980までで、中ストリボーグなら2260という差があるほか、発生7のしゃが中や下段で速く発生する大足も使えない。そのため立ち回りから違うキャラで、クラシックのリプレイは動き方の参考にしづらいという。一方、中強ストリボーグは攻めが通った後の話で、攻めの上達には関係が薄いという反論もあった。{{dc:1285810788199694408/1417875703877341274}}{{dc:1285810788199694408/1417877470446882876}}{{dc:1285810788199694408/1417886197690400818}}", "@jpdc 2026年1月の投稿では、JPのサブキャラをどう選ぶかを聞かれ、昇竜がないキャラ（キンバリー、ガイル）、対空が変わらないよう2大P対空のキャラ（ベガ、弾がないマノン）、覚えることが少ない激浅モダンのキャラ（リリー、E.本田、ザンギエフ、舞）、JPに昇竜が追加された時のためにサガットなどの昇竜キャラ、という答えが挙がった。{{dc:1285810788199694408/1466683809658573001}}{{dc:1285810788199694408/1466684603614888110}}{{dc:1285810788199694408/1466684657407098974}}{{dc:1285810788199694408/1466684929248329862}}{{dc:1285810788199694408/1466685489439309959}}{{dc:1285810788199694408/1466685513070022717}}", "@jpdc 2026年3月の投稿では、モダンからクラシックに移行するときにしたことを聞かれ、メインキャラでランクマに行って負けるとへこむので別キャラで場数を踏んだ、トレモで出てもランクマでは出なかったのでコンボは簡単にして、出せるコンボと立ち回りを1つずつ地道に増やした、という答えがあった。{{dc:1285810788199694408/1477939570095161466}}{{dc:1285810788199694408/1477945219428388917}}", "@jpdc 2026年3月の投稿では、始めて3週間でモダンJPのままプラチナ5まで来た人のクラシック移行の相談に、長期的には早めにクラシックがよい（屈中Pや中・大ストリボーグなどモダンに無い技の影響が大きい）という答えがあった。別の答えは、コマンドに自信がないだけならクラシック、フィジカルに自信がないならモダンも選択肢で、ワンボタンSAやアムネジアの強みはあるが、コンボ火力とセットプレイの自由度はクラシックが段違いというもの。{{dc:1285810788199694408/1484561791814992033}}{{dc:1285810788199694408/1484566874476904539}}{{dc:1285810788199694408/1484604249408143573}}{{dc:1285810788199694408/1484604439082827978}}", "@jpdc 2026年7月〜2026年8月の投稿では、モダンJPがクラシックの下位互換かという質問に、ワンボタンのアムネジアやSAと同じことをコマンドで出せるようになってからの話で、モチベが高いならクラシック一択という意見もあった。8月3日の調整後は中・強ストリボーグと2中Pが使えるようになった一方、立ち中Pがなくなり、モダンは大幅強化と評価された。{{dc:1285810788199694408/1532405312328302682}}{{dc:1285810788199694408/1532412905205665967}}{{dc:1285810788199694408/1532513792758517952}}{{dc:1285810788199694408/1533676645746085940}}", "@jpdc 2026年8月の投稿では、モダンJPのコマンド変更について、中ストリボーグが出せるのは嬉しいが、コパコパ弱ストリボーグのようなコンボは精密な操作が要りそうだ、という声があった。ストリボーグとトリグラフの入れ替えがきつく、コパコパやヴィーハトがヒットしたときに反射で出るのが中トリグラフに変わってしまう、という報告も出た。{{dc:1285800688097562715/1533676287179100330}}{{dc:1285800688097562715/1533677171577585695}}{{dc:1285800688097562715/1534261866753429556}}", "@jpdc 2026年9月の投稿では、モダンJPを始めた人から、大Pがアシストボタンを要するので設置〆の邪魔、弱ストリボーグが↙＋SPで複合できずSA3キャンセルが難しいと思ったが、そのタイミングはほぼ補正50%なのでワンボタンSAでよいと気づいた、という報告があった。2HKがなくファジー大足ができないのが不安、という感想も添えられた。{{dc:1285800688097562715/1549172464821604525}}{{dc:1285800688097562715/1549172773644140576}}", "@oukoku 2026年4月の投稿では、格闘ゲーム初心者の友人がモダンでJPを始めたので何から教えればよいかという質問に、弱アシストか強アシストで相手と距離を取り、中段か下段の弾を繰り返し撃つ形ができれば最初は勝率が高いという答えがあった。モダンJPは弾に波動が必要なのがハードルなので、弱中強の弾を撃ちたい時に発動できることを目標にする。難しければ強アシストと2・3・4＋SPのトリグラフを撃つだけでも楽しく戦えるという。{{dc:1494623868239872041/1494623868239872041}}{{dc:1494623868239872041/1494627958227337226}}", "@oukoku 2024年2月の投稿では、モダンJPで強さを求めるほどアシストコンボを使う回数は減るのか、という話に、アシストコンボは火力が下がるから、という答えがあった。{{dc:1200611284408881324/1204685798524452864}}{{dc:1200611284408881324/1204689894337937428}}", "@oukoku 2024年3月の投稿では、弱体化直後ではあるが、モダンJPはコマンド操作が必要でモダンとの相性が低いと言われる反面、クラシックとモダンのいいとこ取りができるキャラではないか、という見方が書かれていた。{{dc:1200611284408881324/1212917189338857523}}"], "clips": []}, {"title": "2026年7〜10月の調整：Year4の調整と、その後の評価", "body": ["@jpdc 2026年8月の投稿では、調整後のJPの評価として、ナーフ気味という声が多く出た。ODアムネジアは壊れていたのでナーフ覚悟だった、いちばん痛いのは大P、ベガ戦がますます厳しくなりそう、という意見があった。前強Kに調整が入ったのは嬉しい、モダンはアムネジアのナーフを打ち消して余りあるアッパーをもらっている、という声もあった。{{dc:1285800688097562715/1535562971030224926}}{{dc:1285800688097562715/1535563298932785152}}{{dc:1285800688097562715/1535564434854907975}}{{dc:1285800688097562715/1535566657706270793}}{{dc:1285800688097562715/1535607053387694080}}"], "clips": []}], "reviewed": true}], "src": {"yX85TjYfcqc": {"title": "【スト6】キンバリー戦の匠 #ストリートファイター6 #スト6", "date": "20261008", "kind": "v", "ch": "kamiki"}, "20Ut1TXnUik": {"title": "【スト6/JP】Year4調整で大パンはどう変わったのか【一番痛い】", "date": "20260819", "kind": "v", " <script>
const D = JSON.parse(document.getElementById("data").textContent);
const M = D.meta;
const THEMES = M.themes;
const SIDE = Object.fromEntries(M.sides.map(([k, n], i) => [k, [n, i ? "k-vs" : "k-jp"]]));
const CH = Object.fromEntries(D.channels.map((c, i) => [c.id, [c.name, "k-c" + (i % 6)]]));
const DEF = M.defaultCh;
const multi = D.channels.length > 1;
let side = "", who = "", q = "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hms = t => { t = +t; const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
const ymd = d => d ? `${d.slice(0,4)}年${+d.slice(4,6)}月${+d.slice(6,8)}日` : "";
const yt = (id, t) => `https://www.youtube.com/watch?v=${id}&t=${t}s`;
const sideTag = s => SIDE[s] ? `<span class="tag ${SIDE[s][1]}">${SIDE[s][0]}</span>` : "";
const chOf = c => c || DEF;
const chTag = c => multi && CH[chOf(c)] ? `<span class="tag ${CH[chOf(c)][1]}">${esc(CH[chOf(c)][0])}</span>` : "";
// 教科書の段落：頭の「@チャンネルID 」が話し手。無ければ既定のチャンネル
const said = p => { const m = /^@([\w-]+) /.exec(p); return m ? [m[1], p.slice(m[0].length)] : [DEF, p]; };

// 見出し・検索欄・ボタン・フッター
document.title = M.title;
document.getElementById("title").textContent = M.title;
document.getElementById("subtitle").textContent = M.subtitle || "";
document.getElementById("q").placeholder = M.searchHint || "言葉で探す";
document.getElementById("sides").innerHTML = `<button data-side="" aria-pressed="true">すべて</button>` +
  M.sides.map(([k, n]) => `<button data-side="${esc(k)}" aria-pressed="false">${esc(n)}</button>`).join("");
document.getElementById("whos").innerHTML = multi ? `<button data-who="" aria-pressed="true">全員</button>` +
  D.channels.map(c => `<button data-who="${esc(c.id)}" aria-pressed="false">${esc(c.name)}</button>`).join("") : "";
if (!multi) document.getElementById("whos").remove();
if (!D.lives.length) document.querySelector('nav a[data-tab="lives"]').remove();
if (!D.book.length) document.querySelector('nav a[data-tab="book"]').remove();

// ---- 入口の図：キャラ対（タイル）・状況（流れ図）・技（ボタン）----
// キャラ対策の章：config の matchupCh、無ければ id が taisaku か、章名に「対策」を含む章
const VSI = (() => { const k = D.book.findIndex(c => c.id === (M.matchupCh || "taisaku")); return k >= 0 ? k : D.book.findIndex(c => /対策/.test(c.name)); })();
const VSC = D.book[VSI];
// 節名「ルーク」「ダルシム：テレポを落とし…」はキャラ。「：」が無くて長い節（「相手は JP の…」）は全般
const vsName = s => { const k = s.title.indexOf("："); return k >= 0 ? [s.title.slice(0, k), s.title.slice(k + 1)] : [s.title, ""]; };
const isChar = s => s.title.includes("：") || s.title.length <= 12;
// ルートを1列に（章・グループ・番号つき）。番号は絞り込みに関係なく固定
const RT = [];
D.book.forEach((c, i) => (c.routes || []).forEach(g => g.routes.forEach(r => RT.push({c, i, g, r, k: RT.length}))));
// 技のボタン：config の moves、無ければルートの手順に2回以上出る語
const MV = (M.moves && M.moves.length) ? M.moves : (() => {
  const n = {}; RT.forEach(x => [x.r.route, ...(x.r.options || [])].flat().forEach(s => n[s] = (n[s] || 0) + 1));
  return Object.entries(n).filter(([, v]) => v >= 2).sort((a, b) => b[1] - a[1]).slice(0, 24).map(([s]) => ({g: "ルートに出る技", n: s, q: [s]}));
})();
if (!VSC) document.querySelector('nav a[data-tab="vs"]').remove();
if (!RT.length) document.querySelector('nav a[data-tab="flow"]').remove();
if (!MV.length) document.querySelector('nav a[data-tab="moves"]').remove();
document.getElementById("foot").innerHTML = (M.footer || []).map(h => `<p>${h}</p>`).join("");

// すべてのポイントを1列に
const ALL = [];
D.videos.forEach(v => v.points.forEach(p => ALL.push({...p, src: v, kind: "v"})));
D.lives.forEach(l => l.highlights.forEach(h => ALL.push({...h, src: l, kind: "l"})));
const hit = p => (!who || chOf(p.src.ch) === who) && (!side || p.side === side) &&
  (!q || [p.head, p.body, (p.chars||[]).join(" "), p.src.title].join(" ").includes(q));

function ptHTML(p, i, showFrom) {
  const from = showFrom ? `<div class="from">${chTag(p.src.ch)} 出典：<a href="#/${p.kind === "v" ? "video" : "live"}/${encodeURIComponent(p.src.id)}">${esc(p.src.title)}</a>（${ymd(p.src.date)}）</div>` : "";
  return `<div class="pt" style="animation-delay:${Math.min(i, 12) * 30}ms">
    <a class="ts" href="${yt(p.src.id, p.t)}" target="_blank" rel="noopener" aria-label="${hms(p.t)} から YouTube で見る（新しいタブで開きます）">▶ ${hms(p.t)}</a>
    <div><h3>${esc(p.head)} ${sideTag(p.side)}</h3><p>${esc(p.body)}</p></div>${from}</div>`;
}
// 教科書：出典 {{ID@秒}} を時刻リンクに。{{dc:チャンネルID/メッセージID}} は Discord の投稿へのリンク（D.dc に投稿者・日付）
function cite(text) {
  // 続けて並んだ Discord の出典も新しい順に（段落の並びと見た目をそろえる）
  text = String(text ?? "").replace(/\{\{dc:\d+\/\d+\}\}(?:\s*\{\{dc:\d+\/\d+\}\})+/g, run => run.match(/\{\{dc:\d+\/\d+\}\}/g).sort((a, b) => dcDate(b) - dcDate(a)).join(" "));
  return esc(text).replace(/\{\{([\w-]{11})@(\d+)\}\}/g, (_, id, t) => {
    const s = D.src[id] || {title: id, kind: "v"};
    return `<a class="cite" href="${yt(id, t)}" target="_blank" rel="noopener" title="${esc(s.title)}（${ymd(s.date)}）" aria-label="${esc(s.title)} の ${hms(t)} から（新しいタブで開きます）">${s.kind === "l" ? "配信" : "動画"} ${hms(t)}</a>`;
  }).replace(/\{\{dc:(\d+)\/(\d+)\}\}/g, (_, c, m) => {
    const s = (D.dc || {})[m] || {}, d = s.d ? `${+s.d.slice(0,4)}/${+s.d.slice(4,6)}/${+s.d.slice(6,8)}` : "";
    // サーバーが2つ以上のとき：D.dc の g（サーバーID）・s（サーバー名）。無ければ config の dcGuild・dcName
    return `<a class="cite" href="https://discord.com/channels/${s.g || M.dcGuild}/${c}/${m}" target="_blank" rel="noopener" title="${esc(s.s || M.dcName || "Discord")} #${esc(s.c || "")}" aria-label="${esc(s.a || "")} さんの ${d} の投稿${s.v ? "（動画あり）" : ""}（Discord・新しいタブで開きます）">${s.v ? "▶ " : ""}${esc(s.a || "投稿")} ${d}</a>`;
  });
}
// Discord の投稿を出典にする段落は新しい順に並べる（2026-11-27 本人の指示）。動画の段落は今の順のまま前に置く
// 段落の日付＝出典にしている投稿（{{dc:…}}）のいちばん新しい日付

  return f.map((v, i) => `<a class="card" href="#/${kind === "v" ? "video" : "live"}/${encodeURIComponent(v.id)}" style="animation-delay:${Math.min(i, 15)*25}ms">

    <span class="t">${esc(v.title)}</span><span class="s">${esc(v.summary)}</span></a>`).join("") || `<p class="empty">当てはまるものは無い。</p>`;
}
const mine = list => list.filter(v => !who || chOf(v.ch) === who).length;
function viewVideos() {
  return `<h2>動画</h2><p class="lead">${mine(D.videos)} 本。新しい順。</p><div class="grid">${cards(D.videos, "v")}</div>`;
}
function viewLives() {
  return `<h2>配信</h2><p class="lead">${mine(D.lives)} 本。新しい順。</p><div class="grid">${cards(D.lives, "l")}</div>`;
}
function viewOne(kind, id) {
  const v = (kind === "v" ? D.videos : D.lives).find(x => x.id === id);
  if (!v) return `<p class="empty">見つからない。</p>`;
  const ps = (kind === "v" ? v.points : v.highlights).map(p => ({...p, src: v, kind})).filter(hit);
  return `<a class="back" href="#/${kind === "v" ? "videos" : "lives"}">← ${kind === "v" ? "動画" : "配信"}の一覧</a>
  <h2>${esc(v.title)}</h2>
  <p class="meta">${chTag(v.ch)}${v.kind ? `<span class="tag k-x">${esc(v.kind)}</span>` : ""}<span>${ymd(v.date)}</span><span>${hms(v.duration)}</span>
   <a href="${yt(v.id, 0)}" target="_blank" rel="noopener">YouTube で開く（新しいタブで開きます）</a></p>
  ${v.version_sensitive ? `<p class="warn">⚠ ${esc(v.version_note)}</p>` : ""}
  <div class="sum"><p style="margin:0">${esc(v.summary)}</p>${v.takeaways ? `<ul>${v.takeaways.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</div>
  ${ps.map((p, i) => ptHTML(p, i, false)).join("") || `<p class="empty">当てはまるポイントは無い。</p>`}`;
}
function render() {
  document.documentElement.style.setProperty("--hd", document.querySelector("header").offsetHeight + 16 + "px");
  const h = location.hash.replace(/^#\//, "") || (D.book.length ? "book" : "themes");
  const [a, b, c] = h.split("/").map(decodeURIComponent);
  const tab = {theme: "themes", video: "videos", live: "lives", ch: "book", move: "moves"}[a] || a;
  document.querySelectorAll("nav a").forEach(x => x.dataset.tab === tab ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));
  if (a === "ch") {
    document.getElementById("app").innerHTML = viewChapter(b);
    if (c !== undefined) {
      // 字（Web フォント）の読み込みで行の高さが変わるので、読み込みを待ってから飛ぶ
      const go = () => document.getElementById(c === "routes" ? "routes" : "s" + c)?.scrollIntoView();
      go();
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => setTimeout(go, 60)));
    }
    return;
  }
  document.getElementById("app").innerHTML =
    a === "vs" && VSC ? (b !== undefined ? viewVsOne(b) : viewVs()) : a === "flow" && RT.length ? viewFlow(b) :
    a === "moves" && MV.length ? viewMoves() : a === "move" && MV.length ? viewMove(b) :
    a === "theme" ? viewTheme(b) : a === "videos" ? viewVideos() : a === "lives" ? viewLives() :
    a === "video" ? viewOne("v", b) : a === "live" ? viewOne("l", b) : a === "themes" ? viewThemes() : viewBook();
  // 狭い画面では、状況を押したら流れ図のところまで下げる
  if (a === "flow" && b !== undefined && matchMedia("(max-width:767px)").matches) document.getElementById("fpane")?.scrollIntoView();
}
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-vsort]"); if (b) { vsSort = b.dataset.vsort; render(); }
});
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim(); render(); });
document.querySelectorAll("[data-side]").forEach(b => b.addEventListener("click", () => {
  side = b.dataset.side; document.querySelectorAll("[data-side]").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
}));
document.querySelectorAll("[data-who]").forEach(b => b.addEventListener("click", () => {
  who = b.dataset.who; document.querySelectorAll("[data-who]").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
}));
addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
render();
</script>
</body>
</html>
